  var methodF = M.f;
  if(M.croston) methodF = (sk.xyz==="Z")? 0.72 : 1.55;      /* right tool, wrong tool */
  var aOpt = clamp(cvBase*1.25,0.08,0.55);
  var aPen = 1 + Math.abs((g.alpha||0.3)-aOpt)*0.85;
  if(g.method==="naive"||g.method==="ma"||M.croston) aPen=1;                          /* alpha unused */
  var sDev=Math.abs(season-1);
  var seasonErr = M.season? 7*(1-1/(1+sDev)) : 30*(1-1/(1+sDev*0.9));
  var trueLift  = g.promo? 55*sk.promo : 0;
  var promoErr  = Math.abs((g.forecastAdj||0) - trueLift)*0.42*(sk.promo>0?1:0.15);
  var mape = clamp(cvBase*100*methodF*aPen*0.50 + seasonErr + promoErr, 1.4, 78);
  var bias = ((g.forecastAdj||0) - trueLift)*0.5 + (M.season?0:(season-1)*-9);

  /* --- lead time --- */
  var lt = sk.lt*(g.ltStress||1) + (S.key==="pharma"? g.qpDays : 0) + g.dockToStock;
  if(exped) lt = lt*0.55;
  var ltSd = sk.ltSd*(g.ltStress||1)*(src==="dual"?0.72:1);
  if(evHit && (ev.by==="dual") && src!=="dual") { lt*=1.55; ltSd*=1.8; }

  /* --- safety stock: SS = Z·sqrt(LT·sigmaD^2 + d^2·sigmaLT^2) --- */
  var sigmaD = dailyD*cvBase*LUMP[sk.xyz];
  var sigmaDeff = sigmaD*(1+mape/160);            /* forecast error inflates the buffer you need */
  var z = zFor(svc);
  var sigmaL = Math.sqrt(lt*sigmaDeff*sigmaDeff + dailyD*dailyD*ltSd*ltSd);
  var SSu = z*sigmaL*(g.ssMult||1);
  var ssDays = dailyD>0? SSu/dailyD : 0;

  /* --- order quantity --- */
  var H = sk.cost*g.holdRate;                      /* €/unit/yr */
  var Dan = demand*4;
  var eoq = Math.sqrt(2*Dan*sk.S/Math.max(H,0.0001));
  var Q;
  if(pol==="eoq")       Q = Math.max(eoq, sk.moq);
  else if(pol==="moq")  Q = sk.moq;
  else if(pol==="jit")  Q = Math.max(dailyD*7, sk.moq*0.25);
  else                  Q = Math.max(dailyD*(g.coverWeeks||4)*7, sk.moq*0.2);
  Q = Math.max(Q, dailyD*0.5);
  var orders = Dan/Q;
  var eoqGap = Math.abs(Q-eoq)/Math.max(eoq,1);

  /* --- stock positions --- */
  var cycle = Q/2;
  var campaignStock = dailyD*(g.batchDays||5)/2;   /* longer runs = more stock, older stock */
  var pipeline = dailyD*lt;
  var quarantine = (S.key==="pharma")? dailyD*g.qpDays : 0;
  var avgInv = cycle + campaignStock + SSu + quarantine;
  var rop = dailyD*lt + SSu;
  var invVal = avgInv*sk.cost;
  var daysCover = dailyD>0? avgInv/dailyD : 0;

  /* --- service: cycle service level vs fill rate --- */
  var csl = ncdf(z)*100;
  var fill = clamp((1 - (sigmaL*lossG(z))/Math.max(Q,1))*100, 40, 99.99);

  return {sk:sk,demand:demand,dailyD:dailyD,mape:mape,bias:bias,lt:lt,ltSd:ltSd,
    sigmaD:sigmaDeff,sigmaL:sigmaL,z:z,svc:svc,SSu:SSu,ssDays:ssDays,eoq:eoq,Q:Q,orders:orders,
    eoqGap:eoqGap,cycle:cycle,campaignStock:campaignStock,pipeline:pipeline,quarantine:quarantine,avgInv:avgInv,rop:rop,
    invVal:invVal,daysCover:daysCover,csl:csl,fill:fill,mode:mode,src:src,pol:pol,exped:exped,
    evHit:evHit,H:H,method:g.method};
}

/* ---------- whole company, one quarter ---------- */
function computeAll(state){
  var S=SECTORS[state.sec], g=state.g, q=state.q;
  var ev=S.events.filter(function(e){return e.q===q;})[0]||null;

  var rows=skuList(S).map(function(sk){ return computeSku(sk,g,S,q,ev,state.sku[sk.code]||{}); });

  /* --- plant capacity --- */
  var oee=(g.oeeA/100)*(g.oeeP/100)*(g.oeeQ/100);
  var coLossBase=clamp(0.24-g.batchDays*0.021,0.025,0.24);
  var coLoss=g.smed? coLossBase*0.42 : coLossBase;
  var wt=function(s){return s.cost;};                       /* standard-hour proxy */
  var baseCap=sum(skuList(S).map(function(s){return s.baseQ*wt(s);}))*1.72;
  var capacity=baseCap*(g.shifts/2)*oee*(1-coLoss);
  var totalDem=sum(rows.map(function(r){return r.demand*wt(r.sk);}));
  var unitsDem=sum(rows.map(function(r){return r.demand;}));
  var unitsCap=capacity/Math.max(totalDem,1)*unitsDem;
  var util=totalDem/capacity;
  var shortfall=Math.max(0,(totalDem-capacity)/totalDem);

  /* --- event impact --- */
  var mitigated=false, evOtif=0, evCost=0;
  if(ev){
    var m={
      dual:      g.sourcing==="dual",
      safety:    g.service>=97 || g.ssMult>=1.3,
      air:       g.mode==="air"||g.mode==="courier",
      cold:      g.cold==="active"|| g.mode==="reefer",
      capacity:  g.shifts>=3 || util<0.82,
      routing:   g.heuristic==="savings",
      fill:      g.fill>=88,
      lean:      g.policy==="jit"||g.service<=93,
      multimodal:g.mode==="rail"||g.mode==="truck",
      qp:        g.qpDays<=5,
      serial:    g.serial===true,
      recycled:  g.recycled===true
    };
    mitigated=!!m[ev.by];
    evOtif=mitigated? ev.otif*0.28 : ev.otif;
    evCost=mitigated? ev.cost*0.28 : ev.cost;
  }

  /* --- service per SKU --- */
  var mo=MODES[g.mode];
  rows.forEach(function(r){
    var rel=MODEREL[r.mode]!=null?MODEREL[r.mode]:0;
    var queue = util>0.85? Math.min((util-0.85)*46,20) : 0;
    var onTime = 96 + rel - queue - r.mape*0.11 + (g.crossdock?1.2:0) +
      (g.heuristic==="savings"?0.7:0) + (g.backhaul?0.3:0) - Math.min(shortfall*26,16) +
      (r.exped?2.5:0) + (r.evHit? evOtif : evOtif*0.35);
    /* pharma cold-chain exposure */
    if(S.key==="pharma" && /2-8/.test(r.sk.temp||"")){
      var coldPen = g.cold==="active"? 0.4 : g.cold==="hybrid"? 1.4 : 3.2;
      if(g.mode!=="reefer"&&g.mode!=="air"&&g.mode!=="courier") coldPen+=4.5;
      onTime-=coldPen;
    }
    if(S.key==="pharma" && !g.serial) onTime-=2.2;
    r.onTime=clamp(onTime,45,99.6);
    r.inFull=clamp(r.fill*(1-shortfall*0.75),40,99.9);
    r.otif=r.onTime/100*r.inFull/100*100;
    r.served=r.demand*(r.inFull/100);
    r.lost=r.demand-r.served;
  });

  /* --- money --- */
  var dualPrem=g.sourcing==="dual"?0.018:0;
  var subF = S.key==="packaging" ? (g.substrate||1)*(g.recycled?1.045:1) : 1;
  var otRate=g.shifts>=3?0.035:g.shifts<=1?0:0.012;
  rows.forEach(function(r){
    var sk=r.sk;
    var chargeKg = (r.mode==="air"||r.mode==="courier")? Math.max(sk.kg, sk.cbm*167) : sk.kg;
    var fillF = 78/Math.max(g.fill,35);
    var routeF = g.heuristic==="savings"?0.90:1.0;
    var bh = g.backhaul?0.93:1;
    var frUnit = chargeKg*MODES[r.mode].eurPerKgKm*S.distanceKm*fillF*routeF*bh*(g.crossdock?0.95:1);
    if(r.exped) frUnit*=2.6;
    r.frUnit=frUnit;

    r.revenue = r.served*sk.price;
    r.cogs    = r.served*sk.cost*subF*(1+dualPrem+otRate)*(1+(r.evHit?evCost:evCost*0.3));
    r.freight = r.served*frUnit;
    r.holding = r.invVal*g.holdRate/4;

    /* decay: shelf life waste, or tech value decay */
    var waste=0;
    if(sk.shelf>0){
      var eff = sk.shelf*(S.key==="pharma"?0.28:0.5);        /* usable window before customers refuse it */
      var wr = clamp((r.daysCover/Math.max(eff,1))-1,0,3)*0.30;
      if(g.fefo) wr*=0.55;
      waste = r.avgInv*sk.cost*clamp(wr,0,0.55);
    }
    if(S.key==="tech"){ waste += r.invVal*0.024*(r.daysCover/30); }
    r.makeReady=0;
    if(S.key==="packaging"){
      var mrRate=clamp(0.048-g.batchDays*0.0026,0.008,0.048)*(g.smed?0.58:1);
      r.makeReady=r.served*sk.cost*subF*mrRate;
      waste+=r.makeReady;
    }
    r.waste=waste;

    /* cold chain excursion cost */
    r.excursion=0;
    if(S.key==="pharma" && /2-8/.test(sk.temp||"")){
      var er = g.cold==="active"?0.004: g.cold==="hybrid"?0.014:0.032;
      if(g.mode!=="reefer"&&g.mode!=="air"&&g.mode!=="courier") er*=3.1;
      r.excursion = r.served*sk.cost*er;
    }
    if(S.key==="packaging" && /resin/i.test(sk.src||"")){
      r.excursion = r.served*sk.cost*(g.recycled?0.006:0.026);
    }
    r.penalty = r.lost*sk.price*(S.key==="pharma"?0.42:S.key==="fmcg"?0.30:S.key==="packaging"?0.34:0.22);
    r.profit = r.revenue - r.cogs - r.freight - r.holding - r.waste - r.excursion - r.penalty;
    r.margin = r.revenue>0? r.profit/r.revenue*100 : 0;
    r.gm = r.revenue>0? (r.revenue-r.cogs)/r.revenue*100 : 0;
    r.gmroi = r.invVal>0? (r.revenue-r.cogs)/r.invVal : 0;
    r.turns = r.invVal>0? (r.served*sk.cost*4)/r.invVal : 0;
    r.dio = r.turns>0? 365/r.turns : 0;
    r.co2 = r.served*sk.kg/1000*S.distanceKm*MODES[r.mode].co2gPerTkm/1000; /* kg CO2e */
    r.ctsPct = r.revenue>0? (r.freight+r.holding+r.waste)/r.revenue*100 : 0;
  });

  /* --- roll-up --- */
  var revenue=sum(rows.map(function(r){return r.revenue;}));
  var cogs=sum(rows.map(function(r){return r.cogs;}));
  var freight=sum(rows.map(function(r){return r.freight;}));
  var holding=sum(rows.map(function(r){return r.holding;}));
  var waste=sum(rows.map(function(r){return r.waste;}));
  var excursion=sum(rows.map(function(r){return r.excursion;}));
  var penalty=sum(rows.map(function(r){return r.penalty;}));
  var overhead=revenue*(S.overhead||0.15);
  var profit=revenue-cogs-freight-holding-waste-excursion-penalty-overhead;
  var margin=revenue>0?profit/revenue*100:0;
  var invVal=sum(rows.map(function(r){return r.invVal;}));
  var ownFrac = g.incoterm==="exw"?1.0 : g.incoterm==="cif"?0.82 : 0.16;
  var pipeVal=sum(rows.map(function(r){return r.pipeline*r.sk.cost;}))*ownFrac;
  var bsInv=invVal+pipeVal;
  var co2=sum(rows.map(function(r){return r.co2;}));
  var served=sum(rows.map(function(r){return r.served;}));
  var lost=sum(rows.map(function(r){return r.lost;}));

  var wsum=function(f){var d=sum(rows.map(function(r){return r.demand;}));
    return d>0? sum(rows.map(function(r){return f(r)*r.demand;}))/d : 0;};
  var otif=wsum(function(r){return r.otif;});
  var mape=wsum(function(r){return r.mape;});
  var bias=wsum(function(r){return r.bias;});
  var fill=wsum(function(r){return r.inFull;});
  var onTime=wsum(function(r){return r.onTime;});

  var turns=bsInv>0? (cogs*4)/bsInv : 0;
  var dio=turns>0?365/turns:0;
  var c2c=dio+g.dso-g.dpo;
  var co2Int=revenue>0? co2/(revenue/1000) : 0;   /* kg CO2e per EUR1,000 revenue */

  /* --- resilience: TTS vs TTR --- */
  var ttr = g.sourcing==="dual"? 22 : 68;
  if(S.key==="pharma"&&g.sourcing!=="dual") ttr=118;      /* regulatory requalification */
  var crit=rows.filter(function(r){return r.sk.abc==="A";});
  var tts = crit.length? Math.min.apply(null,crit.map(function(r){return r.daysCover;})) : 30;
  var exposure=Math.max(0,ttr-tts);
  var resilience=clamp(100 - exposure*0.62 + (g.sourcing==="dual"?12:0) + (g.crossdock?2:0) +
    (mitigated?7:0) - (util>0.95?10:0),5,99);

  var bullwhip = 1 + (mape/100)*1.3 + (g.policy==="moq"?0.42:0) + (g.promo&&Math.abs(g.forecastAdj)<10?0.5:0)
    - (g.crossdock?0.08:0) - (g.policy==="jit"?0.22:0);

  return {S:S,g:g,q:q,ev:ev,rows:rows,capacity:unitsCap,totalDem:unitsDem,loadCap:capacity,loadDem:totalDem,util:util*100,
    shortfall:shortfall,oee:oee*100,coLoss:coLoss*100,mitigated:mitigated,evOtif:evOtif,evCost:evCost,
    revenue:revenue,cogs:cogs,freight:freight,holding:holding,waste:waste,excursion:excursion,
    penalty:penalty,overhead:overhead,pipeVal:pipeVal,bsInv:bsInv,profit:profit,margin:margin,invVal:invVal,co2:co2,co2Int:co2Int,
    served:served,lost:lost,otif:otif,mape:mape,bias:bias,fill:fill,onTime:onTime,turns:turns,
    dio:dio,c2c:c2c,ttr:ttr,tts:tts,exposure:exposure,resilience:resilience,bullwhip:bullwhip,
    perfectOrder:otif*0.975*0.982};
}

/* ---------- formatting ---------- */
function fm(n,d){ if(!isFinite(n))return ", ";
  return n.toLocaleString("en-IE",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function money(n){
  var a=Math.abs(n);
  if(a>=1e9) return "€"+fm(n/1e9,2)+"bn";
  if(a>=1e6) return "€"+fm(n/1e6,2)+"m";
  if(a>=1e4) return "€"+fm(n/1e3,0)+"k";
  if(a>=1e3) return "€"+fm(n/1e3,1)+"k";
  return "€"+fm(n,0);
}
function pct(n,d){ return fm(n,d==null?1:d)+"%"; }
function qty(n){ return Math.abs(n)>=1e6? fm(n/1e6,2)+"m" : Math.abs(n)>=1000? fm(n/1000,1)+"k" : fm(n,0); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* ==========================================================
   5 · CHART PRIMITIVES
   Hand-written SVG. No chart library, no CDN, no fonts.
   Everything scales with viewBox so it works on a phone.
   ========================================================== */

var C_ACC=function(){return SECTORS[ST.sec]?SECTORS[ST.sec].acc:"#00A67D";};
var PAL=["#24559E","#1E7A52","#0E6E7A","#9A6A0F","#5C6BA8","#465569","#B5603A","#7A9A4E"];

/* ---------------- label collision control ----------------
   Charts drop labels rather than overprint them. Every text
   that could collide goes through here. */
function LabelBox(){ this.boxes=[]; }
LabelBox.prototype.fits=function(x,y,w,h){
  for(var i=0;i<this.boxes.length;i++){
    var b=this.boxes[i];
    if(Math.abs(x-b.x)*2 < (w+b.w) && Math.abs(y-b.y)*2 < (h+b.h)) return false;
  }
  return true;
};
LabelBox.prototype.place=function(x,y,w,h){
  if(!this.fits(x,y,w,h)) return false;
  this.boxes.push({x:x,y:y,w:w,h:h}); return true;
};
/* approximate Helvetica advance width */
function textW(t,size){ return String(t).length*(size||10)*0.55; }
/* how many x labels fit without touching */
function labelStep(n,innerW,maxChars,size){
  var need=maxChars*(size||10)*0.55+8;
  return Math.max(1,Math.ceil(n/Math.max(1,Math.floor(innerW/need))));
}

/* wrap a caption to the available width instead of letting it run off the frame */
function txw(x,y,t,maxW,size,anchor,col,lh){
  size=size||10.5; lh=lh||(size+3);
  var words=String(t).split(" "), lines=[], cur="";
  var cap=Math.max(6,Math.floor(maxW/(size*0.52)));
  words.forEach(function(wd){
    if((cur+" "+wd).trim().length<=cap) cur=(cur+" "+wd).trim();
    else { if(cur) lines.push(cur); cur=wd; }
  });
  if(cur) lines.push(cur);
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||"middle")+'" font-size="'+size+'"'+
    (col?' fill="'+col+'"':'')+'>'+
    lines.map(function(l,i){ return '<tspan x="'+x+'" dy="'+(i?lh:0)+'">'+esc(l)+'</tspan>'; }).join("")+
    '</text>';
}

function nice(mx){ if(mx<=0)return 1; var e=Math.pow(10,Math.floor(Math.log10(mx))),f=mx/e;
  var n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*e; }
function svgOpen(w,h,cls){ return '<svg class="chart '+(cls||"")+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">'; }
function tx(x,y,t,anchor,cls,size,fill){
  return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(anchor||"middle")+'"'+
    (cls?' class="'+cls+'"':'')+(size?' font-size="'+size+'"':'')+(fill?' fill="'+fill+'"':'')+'>'+t+'</text>';
}

/* ---------------- LINE ---------------- */
function svgLine(o){
  var w=o.w||520,h=o.h||190,pl=o.pl||44,pr=o.pr||12,pt=14,pb=o.pb||26;
  var iw=w-pl-pr, ih=h-pt-pb;
  var all=[];o.series.forEach(function(s){s.data.forEach(function(v){if(v!=null&&isFinite(v))all.push(v);});});
  if(o.bands)o.bands.forEach(function(b){all.push(b.y);});
  var mx=o.yMax!=null?o.yMax:nice(Math.max.apply(null,all.concat([0.0001])));
  var mn=o.yMin!=null?o.yMin:Math.min(0,Math.min.apply(null,all));
  var X=function(i){return pl+(o.x.length<2?iw/2:i*iw/(o.x.length-1));};
  var Y=function(v){return pt+ih-((v-mn)/(mx-mn||1))*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var yv=mn+(mx-mn)*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,o.yFmt?o.yFmt(yv):fm(yv,mx<12?1:0),"end");}
  if(o.bands)o.bands.forEach(function(b){
    s+='<line x1="'+pl+'" y1="'+Y(b.y).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(b.y).toFixed(1)+'" stroke="'+b.color+'" stroke-width="1.4" stroke-dasharray="5 4" opacity=".85"/>';
    s+=tx(w-pr-2,Y(b.y)-4,b.label,"end","lbl",8.5,b.color);});
  var maxc=Math.max.apply(null,o.x.map(function(l){return String(l).length;}));
  var stp=labelStep(o.x.length,iw,maxc,10);
  o.x.forEach(function(l,i){ if(i%stp)return;
    s+=tx(X(i),h-8,esc(l),"middle","lbl");});
  var LB=new LabelBox();
  o.series.forEach(function(se){
    var d="",n=0;
    se.data.forEach(function(v,i){ if(v==null||!isFinite(v))return; d+=(n++?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);});
    if(!d)return;
    if(se.fillArea){
      var f=d+"L"+X(se.data.length-1).toFixed(1)+","+Y(mn).toFixed(1)+"L"+X(0).toFixed(1)+","+Y(mn).toFixed(1)+"Z";
      s+='<path d="'+f+'" fill="'+se.color+'" opacity=".13"/>';}
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.wdt||2.1)+'" stroke-linejoin="round" stroke-linecap="round"'+
       (se.dash?' stroke-dasharray="6 4"':'')+'/>';
    if(se.dots!==false) se.data.forEach(function(v,i){ if(v==null||!isFinite(v))return;
      s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(se.dotR||2.6)+'" fill="'+se.color+'"/>';});
    if(se.endLabel){
      var ly=Y(se.data[se.data.length-1]);
      if(isFinite(ly)&&LB.place(X(se.data.length-1)+4+textW(se.endLabel,9)/2,ly,textW(se.endLabel,9),11))
        s+=tx(X(se.data.length-1)+4,ly+3,se.endLabel,"start","lbl",9,se.color);
    }
  });
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- BARS ---------------- */
function svgBars(o){
  var w=o.w||520,h=o.h||190,pl=o.pl||46,pr=12,pt=14,pb=o.pb||30;
  var iw=w-pl-pr,ih=h-pt-pb,n=o.x.length,ns=o.series.length;
  var tot=o.x.map(function(_,i){ return o.stacked? sum(o.series.map(function(s){return s.data[i]||0;}))
                                                 : Math.max.apply(null,o.series.map(function(s){return s.data[i]||0;})); });
  var mx=o.yMax!=null?o.yMax:nice(Math.max.apply(null,tot.concat([0.0001])));
  var Y=function(v){return pt+ih-(v/(mx||1))*ih;};
  var gw=iw/n, bw=o.stacked? gw*0.56 : (gw*0.72)/ns;
  var s=svgOpen(w,h), LB=new LabelBox();
  for(var i=0;i<=4;i++){var yv=mx*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,o.yFmt?o.yFmt(yv):fm(yv,mx<12?1:0),"end");}
  o.x.forEach(function(l,i){
    var cx=pl+gw*i+gw/2;
    if(o.stacked){
      var acc=0;

/* ---------------- SCATTER / QUADRANT ---------------- */
function svgScatter(o){
  var w=o.w||460,h=(o.h||300)+18,pl=52,pr=16,pt=28,pb=48;
  var iw=w-pl-pr,ih=h-pt-pb;
  var X=function(v){return pl+((v-o.xMin)/(o.xMax-o.xMin||1))*iw;};
  var Y=function(v){return pt+ih-((v-o.yMin)/(o.yMax-o.yMin||1))*ih;};
  var s=svgOpen(w,h);
  if(o.quads){
    var mxx=X((o.xMin+o.xMax)/2),myy=Y((o.yMin+o.yMax)/2);
    s+='<rect x="'+pl+'" y="'+pt+'" width="'+iw+'" height="'+ih+'" fill="var(--panel2)"/>';
    s+='<line x1="'+mxx+'" y1="'+pt+'" x2="'+mxx+'" y2="'+(pt+ih)+'" stroke="var(--rule)" stroke-width="1.2"/>';
    s+='<line x1="'+pl+'" y1="'+myy+'" x2="'+(w-pr)+'" y2="'+myy+'" stroke="var(--rule)" stroke-width="1.2"/>';
    s+=tx(pl+6,pt-4,o.quads[0],"start","lbl",8.5,"var(--sub2)");
    s+=tx(w-pr-6,pt-4,o.quads[1],"end","lbl",8.5,"var(--sub2)");
    s+=tx(pl+6,pt+ih+13,o.quads[2],"start","lbl",8.5,"var(--sub2)");
    s+=tx(w-pr-6,pt+ih+13,o.quads[3],"end","lbl",8.5,"var(--sub2)");
  } else {
    for(var i=0;i<=4;i++){var y=pt+ih*i/4;
      s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
      s+=tx(pl-6,y+3.2,fm(o.yMax-(o.yMax-o.yMin)*i/4,0),"end");}
  }
  var LB=new LabelBox(), PT=new LabelBox();
  /* the quadrant captions reserve their space first */
  if(o.quads){
    LB.place(pl+6+textW(o.quads[0],8.5)/2,pt-4,textW(o.quads[0],8.5),12);
    LB.place(w-pr-6-textW(o.quads[1],8.5)/2,pt-4,textW(o.quads[1],8.5),12);
  }
  o.points.forEach(function(p){
    var cx=clamp(X(p.x),pl+4,w-pr-4),cy=clamp(Y(p.y),pt+4,pt+ih-4);
    /* coincident points are nudged apart so their codes stay readable */
    var R=(p.r||7), tries=0;
    while(tries<10 && !PT.fits(cx,cy,R*2.3,R*2.3)){
      cx+=R*1.7;
      if(cx>w-pr-R){ cx=clamp(X(p.x),pl+4,w-pr-4); cy+=R*1.8; }
      cy=clamp(cy,pt+R,pt+ih-R); tries++;
    }
    PT.place(cx,cy,R*2.3,R*2.3);
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+R+'" fill="'+(p.color||C_ACC())+'" opacity=".82" stroke="#fff" stroke-width="1.4"/>';
    s+=tx(cx,cy+2.8,p.short||"","middle","",8,"#fff");
    if(p.label){
      var ly=cy-(p.r||7)-3.5, lw=textW(p.label,8);
      if(!LB.place(cx,ly,lw,10)){ ly=cy+(p.r||7)+10; }
      if(LB.place(cx,ly,lw,10)) s+=tx(cx,ly,esc(p.label),"middle","lbl",8);
    }
  });
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  s+='<line class="axis" x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(pt+ih)+'"/>';
  s+=tx(pl+iw/2,h-6,esc(o.xLabel||""),"middle","lbl",9);
  s+='<text transform="translate(11,'+(pt+ih/2)+') rotate(-90)" text-anchor="middle" class="lbl" font-size="9">'+esc(o.yLabel||"")+'</text>';
  return s+'</svg>';
}

/* ---------------- WATERFALL ---------------- */

/* ---------------- SAWTOOTH INVENTORY PROFILE ---------------- */
function svgSawtooth(r,g,days){
  var w=560,h=210,pl=50,pr=14,pt=14,pb=28,iw=w-pl-pr,ih=h-pt-pb;
  days=days||120;
  var top=Math.max(r.SSu+r.Q, r.rop*1.25)*1.12;
  var X=function(d){return pl+d/days*iw;},Y=function(v){return pt+ih-clamp(v/top,0,1)*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var yv=top*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,qty(yv),"end","",8.5);}
  /* safety stock band */
  s+='<rect x="'+pl+'" y="'+Y(r.SSu).toFixed(1)+'" width="'+iw+'" height="'+(Y(0)-Y(r.SSu)).toFixed(1)+
     '" fill="var(--bad)" opacity=".085"/>';
  /* build the saw */
  var d="",cur=r.SSu+r.Q,t=0,cyc=r.Q/Math.max(r.dailyD,0.0001),seed=1;
  var rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280;};
  d="M"+X(0)+","+Y(cur);
  var pts=[];
  while(t<days){
    var noise=1+(rnd()-0.5)*r.sk.cv*1.6;
    var draw=Math.min(cyc*noise,days-t);
    var end=cur-r.dailyD*draw*(1+(rnd()-0.5)*0.3);
    t+=draw; d+="L"+X(t).toFixed(1)+","+Y(end).toFixed(1);
    pts.push({t:t,v:end});
    if(end<r.SSu*0.25) d+="L"+X(t).toFixed(1)+","+Y(Math.max(end,0)).toFixed(1);
    cur=Math.max(end,0)+r.Q; if(cur>top)cur=top*0.98;
    d+="L"+X(t).toFixed(1)+","+Y(cur).toFixed(1);
  }
  s+='<path d="'+d+'" fill="none" stroke="'+C_ACC()+'" stroke-width="1.9" stroke-linejoin="round"/>';
  /* reference lines */
  [[r.rop,"var(--warn)","Reorder point "+qty(r.rop)],[r.SSu,"var(--bad)","Safety stock "+qty(r.SSu)]].forEach(function(L){
    s+='<line x1="'+pl+'" y1="'+Y(L[0]).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(L[0]).toFixed(1)+
       '" stroke="'+L[1]+'" stroke-width="1.4" stroke-dasharray="6 4"/>';
    s+=tx(w-pr-2,Y(L[0])-4,L[2],"end","lbl",8.5,L[1]);});
  for(var k=0;k<=4;k++) s+=tx(X(days*k/4),h-8,"day "+Math.round(days*k/4),"middle","lbl",8.5);
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

  s+=tx(X(r.Q),pt+ih+13,"your Q "+qty(r.Q),"middle","lbl",8.5,"var(--bad)");

/* ---------------- VRP ROUTE MAP ---------------- */
var STOPS=[[25,62,9],[58,78,7],[95,55,8],[130,82,6],[160,60,10],[200,75,7],[235,58,9],[268,80,6],
           [300,66,8],[330,50,7],[352,74,9],[178,40,5],[110,30,6],[290,38,7]]
  .map(function(a,i){return {id:i+1,th:a[0]*Math.PI/180,deg:a[0],r:a[1],q:a[2]};});
var DEPOT={r:0,th:0};
function dist(a,b){var ax=a.r*Math.cos(a.th),ay=a.r*Math.sin(a.th),bx=b.r*Math.cos(b.th),by=b.r*Math.sin(b.th);
  return Math.hypot(ax-bx,ay-by);}
function routeLen(rt){var d=dist(DEPOT,rt[0]);for(var i=0;i<rt.length-1;i++)d+=dist(rt[i],rt[i+1]);return d+dist(rt[rt.length-1],DEPOT);}
function sweepRoutes(cap){
  var srt=STOPS.slice().sort(function(a,b){return a.th-b.th;}),out=[],cur=[],load=0;
  srt.forEach(function(c){ if(load+c.q>cap&&cur.length){out.push(cur);cur=[];load=0;} cur.push(c);load+=c.q;});
  if(cur.length)out.push(cur); return out;
}
function savingsRoutes(cap){
  var rts=STOPS.map(function(c){return [c];}),pairs=[];
  for(var i=0;i<STOPS.length;i++)for(var j=i+1;j<STOPS.length;j++)
    pairs.push({a:STOPS[i],b:STOPS[j],s:dist(DEPOT,STOPS[i])+dist(DEPOT,STOPS[j])-dist(STOPS[i],STOPS[j])});
  pairs.sort(function(x,y){return y.s-x.s;});
  pairs.forEach(function(p){
    var ra=null,rb=null;
    rts.forEach(function(r){ if(r[0].id===p.a.id||r[r.length-1].id===p.a.id)ra=r;
                             if(r[0].id===p.b.id||r[r.length-1].id===p.b.id)rb=r;});
    if(!ra||!rb||ra===rb)return;
    var load=sum(ra.map(function(c){return c.q;}))+sum(rb.map(function(c){return c.q;}));
    if(load>cap)return;
    var L=ra,R=rb;
    if(L[L.length-1].id!==p.a.id)L=L.slice().reverse();
    if(R[0].id!==p.b.id)R=R.slice().reverse();
    if(L[L.length-1].id!==p.a.id||R[0].id!==p.b.id)return;
    rts=rts.filter(function(r){return r!==ra&&r!==rb;});
    rts.push(L.concat(R));
  });
  return rts;
}
function svgVrp(heur,cap){
  var w=520,h=330,cx=w/2,cy=h/2-4,sc=1.28;
  var P=function(n){return [cx+n.r*Math.cos(n.th)*sc, cy+n.r*Math.sin(n.th)*sc*-0.78];};
  var rts=heur==="sweep"?sweepRoutes(cap):savingsRoutes(cap);
  var s=svgOpen(w,h);
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="118" fill="none" stroke="var(--rule2)" stroke-dasharray="3 5"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="62" fill="none" stroke="var(--rule2)" stroke-dasharray="3 5"/>';
  rts.forEach(function(rt,i){
    var col=PAL[i%PAL.length],d="M"+cx+","+cy;
    rt.forEach(function(n){var p=P(n);d+="L"+p[0].toFixed(1)+","+p[1].toFixed(1);});
    d+="L"+cx+","+cy;
    s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" opacity=".85" stroke-linejoin="round"/>';
    rt.forEach(function(n){var p=P(n);
      s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="9" fill="'+col+'" stroke="#fff" stroke-width="1.6"/>';
      s+=tx(p[0],p[1]+3,String(n.q),"middle","",8.5,"#fff");});
  });
  s+='<rect x="'+(cx-13)+'" y="'+(cy-13)+'" width="26" height="26" fill="var(--acc)" rx="5"/>';
  s+=tx(cx,cy+3.5,"DC","middle","",9,"#fff");
  var tot=sum(rts.map(routeLen));
  var alt=sum((heur==="sweep"?savingsRoutes(cap):sweepRoutes(cap)).map(routeLen));
  s+=tx(10,16,rts.length+" VEHICLES · "+fm(tot,0)+" KM TOTAL","start","lbl",9.5,"var(--ink)");
  var better=tot<=alt;
  s+=tx(10,29,(better?"▼ ":"▲ ")+fm(Math.abs(tot-alt)/alt*100,1)+"% vs "+(heur==="sweep"?"savings":"sweep"),
    "start","lbl",9,better?"var(--good)":"var(--bad)");
  s+=tx(w-10,16,"numbers = drop size","end","lbl",8.5,"var(--sub2)");
  return s+'</svg>';
}

/* ---------- the ledger: measure the consequence of a change ---------- */
var LEDGER_KEYS=[
  {k:"otif",     n:"OTIF",      f:function(v){return pct(v,1);},  good:1, w:1},
  {k:"margin",   n:"Margin",    f:function(v){return pct(v,1);},  good:1, w:1},
  {k:"invVal",   n:"Inventory", f:function(v){return money(v);},  good:-1,w:1},
  {k:"c2c",      n:"Cash days", f:function(v){return fm(v,0)+"d";},good:-1,w:1},
  {k:"co2Int",   n:"Carbon",    f:function(v){return fm(v,1)+"kg";},good:-1,w:1},
  {k:"resilience",n:"Resilience",f:function(v){return fm(v,0);},   good:1, w:1}
];

function applyChange(label,fromTxt,toTxt,mutate,why){
  var before=computeAll(ST);
  mutate();
  var after=computeAll(ST);
  var deltas=LEDGER_KEYS.map(function(K){
    var d=after[K.k]-before[K.k];
    return {n:K.n,d:d,txt:K.f(after[K.k]),
      sign:Math.abs(d)<1e-9?0:(d>0?1:-1),
      good:Math.abs(d)<1e-9?0:((d>0?1:-1)===K.good?1:-1),
      disp:(d>0?"+":"")+ (K.k==="invVal"? money(d) : K.k==="co2Int"? fm(d,2)+"kg" : K.k==="c2c"? fm(d,1)+"d" : fm(d,2)) };
  }).filter(function(x){return x.sign!==0;});
  var goods=deltas.filter(function(d){return d.good>0;}).length;
  var bads=deltas.filter(function(d){return d.good<0;}).length;
  ST.log.unshift({label:label,from:fromTxt,to:toTxt,deltas:deltas,why:why||"",
    tone:bads===0&&goods>0?"up":goods===0&&bads>0?"down":"mix", q:ST.q});
  if(ST.log.length>50) ST.log.pop();
}

function setG(key,val,label,fmtV,why){
  var old=ST.g[key];
  if(old===val) return;
  applyChange(label||key, fmtV?fmtV(old):String(old), fmtV?fmtV(val):String(val),
    function(){ST.g[key]=val;}, why);
}
function setSku(code,field,val,label,fmtV,why){
  if(!ST.sku[code])ST.sku[code]={};
  var old=ST.sku[code][field];
  if(old===val) return;
  applyChange(code+" · "+(label||field), old==null?"default":(fmtV?fmtV(old):String(old)),
    fmtV?fmtV(val):String(val), function(){ST.sku[code][field]=val;}, why);
}

  paintSide(M);
}

function tone(v,good,lo,hi){
  if(good) return v>=hi?"good":v>=lo?"warn":"bad";
  return v<=lo?"good":v<=hi?"warn":"bad";
}
function paintBoard(M){
  var b=$("#board"); if(!b)return;
  var prev=ST.hist.length?ST.hist[ST.hist.length-1]:null;
  var arrow=function(now,was,good){
    if(was==null)return "";
    var d=now-was; if(Math.abs(d)<0.05)return "";
    var up=d>0, ok=(up===(good>0));
    return '<span class="arrow"><span class="mk '+(ok?"good":"bad")+'"></span>'+(up?"▲":"▼")+'</span>';
  };
  var K=[
    {id:"otif",k:"OTIF",v:pct(M.otif,1),t:tone(M.otif,1,88,95),s:"on-time "+pct(M.onTime,1)+" · in-full "+pct(M.fill,1),a:arrow(M.otif,prev&&prev.otif,1)},
    {id:"margin",k:"Margin",v:pct(M.margin,1),t:tone(M.margin,1,6,14),s:money(M.profit)+" profit",a:arrow(M.margin,prev&&prev.margin,1)},
    {id:"bsInv",k:"Inventory",v:money(M.bsInv),t:tone(M.dio,0,55,85),s:fm(M.dio,0)+"d · incl "+money(M.pipeVal)+" in transit",a:arrow(M.bsInv,prev&&prev.inv,-1)},
    {id:"c2c",k:"Cash-to-cash",v:fm(M.c2c,0),t:tone(M.c2c,0,45,75),s:"days · DIO+DSO−DPO",a:arrow(M.c2c,prev&&prev.c2c,-1)},
    {id:"util",k:"Utilisation",v:pct(M.util,0),t:M.util>100?"bad":M.util>90?"warn":M.util<50?"warn":"good",s:"OEE "+pct(M.oee,0),a:""},
    {id:"mape",k:"Forecast error",v:pct(M.mape,1),t:tone(M.mape,0,12,25),s:"bias "+(M.bias>0?"+":"")+fm(M.bias,1)+"%",a:arrow(M.mape,prev&&prev.mape,-1)},
    {id:"co2Int",k:"Carbon intensity",v:fm(M.co2Int,1),t:tone(M.co2Int,0,3,12),s:"kg CO2e per €1k revenue",a:""},
    {id:"resilience",k:"Resilience",v:fm(M.resilience,0),t:tone(M.resilience,1,45,70),s:"TTS "+fm(M.tts,0)+"d vs TTR "+fm(M.ttr,0)+"d",a:arrow(M.resilience,prev&&prev.res,1)}
  ];
  b.innerHTML=K.map(function(x){
    return '<div class="kpi '+x.t+'"><div class="k">'+x.k+dirMini(x.id)+'</div>'+
      '<div class="v">'+x.v+x.a+'</div><div class="s">'+x.s+'</div></div>';}).join("");

/* ---------- side rail ---------- */

  var h="";

  h+='<div class="card"><div class="cardhead"><h3>Change impact</h3>'+
     '<span class="eyebrow">'+ST.log.length+' logged</span></div>';
  if(!ST.log.length){
    h+='<p class="hint" style="margin:0">Move any control and the measured before/after lands here, service, margin, inventory, cash, carbon and resilience, all at once. That simultaneous movement is the entire discipline.</p>';
  } else {
    h+='<div class="ledger">';
    ST.log.slice(0,14).forEach(function(L){
      h+='<div class="lgi '+L.tone+'"><span class="t">'+esc(L.label)+'</span>'+
         '<span class="d"><s>'+esc(L.from)+'</s> &rarr; '+esc(L.to)+'</span>';
      h+='<span class="d">'+L.deltas.map(function(d){

    });

    h+='<div class="note '+a.t+'"><span class="h">'+esc(a.h)+'</span>'+a.b+'</div>';});

  /* glossary lookup */
  h+='<div class="card"><div class="cardhead"><h3>Look it up</h3><span class="eyebrow">'+GLOSSARY.length+' terms</span></div>'+
     '<input class="searchbox" id="gs" placeholder="safety stock, OTIF, QP…" value="'+esc(ST.gloss)+'">'+
     '<div class="glosslist" id="gl"></div></div>';

function paintGloss(){
  var el=$("#gl"); if(!el)return;
  var q=ST.gloss.trim().toLowerCase();
  var list=GLOSSARY.filter(function(g){
    return !q || g[0].toLowerCase().indexOf(q)>=0 || g[2].toLowerCase().indexOf(q)>=0 || g[1].toLowerCase().indexOf(q)>=0;});
  if(!q) list=list.slice(0,6);
  if(!list.length){ el.innerHTML='<p class="hint" style="margin:8px 0 0">No match. Try a shorter word, or open the Library tab for the full glossary, formula sheet and Incoterms.</p>'; return; }
  el.innerHTML=list.slice(0,40).map(function(g){
    return '<div class="gl"><div class="cat">'+esc(g[1])+'</div><div class="t">'+esc(g[0])+'</div><div class="d">'+esc(g[2])+'</div></div>';
  }).join("");
}

/* ---------- the diagnosis engine ---------- */
function coach(M){
  var g=ST.g,S=M.S,out=[];
  if(M.shortfall>0.015) out.push({t:"bad",h:"Capacity is the constraint",
    b:"Demand of "+qty(M.totalDem)+" exceeds effective capacity of "+qty(M.capacity)+". You are short <b>"+pct(M.shortfall*100,1)+
      "</b> before inventory policy even gets a say. Add a shift, raise batch length, run SMED, or lift OEE, no safety stock setting can fix a capacity gap."});
  if(M.util>95&&M.shortfall<=0.015) out.push({t:"warn",h:"Queueing is starting to bite",
    b:"At "+pct(M.util,0)+" utilisation, queue time rises exponentially rather than linearly. This is why a plant running at 98% has worse lead times than one at 85%, and why everyone blames planning."});
  if(M.mape>18) out.push({t:"bad",h:"Forecast error is expensive",
    b:"MAPE of "+pct(M.mape,1)+" inflates every safety stock in the portfolio. "+
      (g.promo&&Math.abs(g.forecastAdj)<20?"A promotion is running and your forecast is barely lifted, so you are planning for a week that is not going to happen.":
       METHODS[g.method].season?"Seasonality is being modelled, so the error is coming from volatility or alpha.":
       "Your method does not model seasonality, and several SKUs here are strongly seasonal. Try Holt-Winters.")});
  if(Math.abs(M.bias)>7) out.push({t:"warn",h:"You have a bias, not just an error",
    b:"Average bias is <b>"+(M.bias>0?"+":"")+pct(M.bias,1)+"</b>. "+(M.bias>0?
      "Persistent over-forecasting builds inventory you will write off later. Bias is a planning defect, buffer does not fix it, it only hides it.":
      "Persistent under-forecasting means you are chronically short and firefighting. Service will never stabilise until this is corrected.")});
  if(M.dio>90) out.push({t:"warn",h:"Inventory is heavy",
    b:fm(M.dio,0)+" days of stock, "+money(M.invVal)+" of cash. Cash-to-cash is "+fm(M.c2c,0)+
      " days. Ask which of these SKUs actually needs "+g.service+"%, the AX items earn it, the CZ items rarely do."});
  if(M.otif<90) out.push({t:"bad",h:"Service is below the line",
    b:"OTIF "+pct(M.otif,1)+" = on-time "+pct(M.onTime,1)+" × in-full "+pct(M.fill,1)+
      ". Fix whichever factor is lower first, they multiply, so the weaker one dominates."});
  if(M.exposure>25) out.push({t:"bad",h:"Recovery gap",
    b:"Your critical SKUs survive "+fm(M.tts,0)+" days without supply; recovery takes "+fm(M.ttr,0)+
      " days. That is <b>"+fm(M.exposure,0)+" days of exposure</b>. Dual sourcing cuts TTR; more cover raises TTS. Both cost money, and this is the trade you are being paid to make."});
  if(M.waste>M.profit*0.12&&M.waste>0) out.push({t:"warn",h:"Decay is eating the margin",
    b:money(M.waste)+" lost to "+(S.key==="tech"?"value decay on ageing stock":"shelf-life write-off")+
      " this quarter, "+pct(M.waste/Math.max(M.revenue,1)*100,1)+" of revenue. "+
      (S.key==="tech"?"Every extra week of cover is a real margin loss here, not a theoretical one.":"Cut cover on the short-life lines, and check FEFO is actually enforced.")});
  if(g.sourcing==="single") out.push({t:"warn",h:"Single source everywhere",
    b:"Every A item runs on one supplier. TTR is "+fm(M.ttr,0)+" days"+(S.key==="pharma"?", because a regulatory variation is required to change API source":"")+
      ". Dual sourcing costs about 1.8% per unit, that is the premium on the insurance policy."});
  if(M.bullwhip>1.5) out.push({t:"warn",h:"You are amplifying demand",
    b:"Bullwhip ratio "+fm(M.bullwhip,2)+", your order variability is "+pct((M.bullwhip-1)*100,0)+
      " above true demand variability. Big batches, promotion spikes and forecast error all feed this."});
  if(S.key==="pharma"&&g.cold==="passive"&&g.mode!=="reefer") out.push({t:"bad",h:"Cold chain is exposed",
    b:"Passive shippers on a non-refrigerated lane, with 2-8°C product in the portfolio. An excursion does not automatically destroy stock, but it does freeze it pending QP assessment, a service failure either way."});
  if(S.key==="pharma"&&g.qpDays>12) out.push({t:"warn",h:"Release is your hidden lead time",
    b:g.qpDays+" days of QP release sits on top of every manufacturing lead time and creates "+
      qty(sum(M.rows.map(function(r){return r.quarantine;})))+" units of quarantine stock, physically present, financially owned, commercially unavailable."});
  if(g.fill<65) out.push({t:"warn",h:"You are shipping air",
    b:"Vehicles at "+g.fill+"% fill. Cost and CO2 per unit rise steeply below about 75%, an empty half-trailer costs the same to move as a full one."});
  if(!out.length) out.push({t:"good",h:"Balanced configuration",
    b:"No dominant failure mode right now. Push a control to an extreme and watch which KPI breaks first, that is the fastest way to feel where the real constraint sits."});
  return out;
}

      document.documentElement.style.setProperty("--accHi","#B6EEDF");
      renderGame(); window.scrollTo(0,0); return; }
    ST.game=null; ST.launchTab=lt;
    ["acc","accSoft","accInk","onAcc","accHi"].forEach(function(k){ document.documentElement.style.removeProperty("--"+k); });
    renderLaunch(); window.scrollTo(0,0); return;
  }
  if(t.hasAttribute("data-grole")){ ST.game.role=t.getAttribute("data-grole"); renderGame(); window.scrollTo(0,0); return; }
  if(t.hasAttribute("data-gact")){
    var ga=t.getAttribute("data-gact");
    if(ga==="next") gameClose();
    else if(ga==="restart"){ ST.game=gameInit(); renderGame(); window.scrollTo(0,0); }
    else if(ga==="quit"){ ST.game=null; ST.launchTab="home";
      ["acc","accSoft","accInk","onAcc","accHi"].forEach(function(k){ document.documentElement.style.removeProperty("--"+k); });
      renderLaunch(); window.scrollTo(0,0); }
    return;
  }
  if(t.hasAttribute("data-gseg")){
    var gp=t.getAttribute("data-gseg"), gv=t.getAttribute("data-v");
    gset(gp, t.hasAttribute("data-num")? Number(gv) : gv);
    renderGame(); return;
  }
  if(t.hasAttribute("data-lcat")){
    ST.lcat=t.getAttribute("data-lcat");
    $$("[data-lcat]").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lcat")===ST.lcat); });
    paintLearnGloss(); return;
  }
  if(t.hasAttribute("data-tab")){ ST.tab=t.getAttribute("data-tab"); render(); window.scrollTo(0,0); return; }
  if(t.hasAttribute("data-selsku")){ ST.selSku=t.getAttribute("data-selsku"); render(); return; }
  if(t.hasAttribute("data-gcat")){ ST.glossCat=t.getAttribute("data-gcat"); render(); return; }
  if(t.hasAttribute("data-act")){
    var a=t.getAttribute("data-act");
    if(a==="close") closeQuarter();
    else if(a==="restart"){
      ST.sec=null; ST.launchTab="start";
      ["acc","accSoft","accInk","onAcc","accHi"].forEach(function(k){
        document.documentElement.style.removeProperty("--"+k); });
      render();
    }
    else if(a==="clearlog"){ ST.log=[]; paint(); }
    else if(a==="reset"){ ST.sku={}; render(); }
    else if(a==="addsku"){ ST.newSkus.push(newSku(SECTORS[ST.sec])); render(); }
    else if(a==="delsku"){
      var code=t.getAttribute("data-code");
      if(skuList(SECTORS[ST.sec]).length<=1) return;
      ST.hidden[code]=true; delete ST.plan[code];
      if(ST.selSku===code) ST.selSku=skuList(SECTORS[ST.sec])[0].code;
      render();
    }
    else if(a==="resetmd"){ ST.md={}; ST.hidden={}; ST.newSkus=[]; ST.coName=null; render(); }
    else if(a==="autoplan"){
      var Mn=computeAll(ST), rr=Mn.rows.filter(function(x){return x.sk.code===ST.selSku;})[0];
      planOf(ST.selSku).rec=autoPlan(rr); render();
    }
    else if(a==="clearplan"){ planOf(ST.selSku).rec=new Array(WK).fill(0); render(); }
    else if(a==="resetfc"){ var P=planOf(ST.selSku); delete P.fc; delete P.firm; render(); }
    else if(a==="save"){
      var box=$("#scen"); if(box){ box.value=scenarioText();
        box.select(); $("#scenmsg").textContent="Copied into the box. Select all and copy it somewhere safe."; }
    }
    else if(a==="load"){
      var b2=$("#scen"), msg=$("#scenmsg");
      try{ loadScenario(b2.value); render(); }
      catch(err){ if(msg) msg.textContent="Could not read that. Paste the whole box contents, including the outer braces."; }
    }
    return;
  }
  if(t.hasAttribute("data-seg")){
    var key=t.getAttribute("data-seg"), val=t.getAttribute("data-v"),
        lab=t.getAttribute("data-lab")||key, why=t.getAttribute("data-why")||"",
        sku=t.getAttribute("data-sku"), num=t.hasAttribute("data-num");
    var v = num? Number(val) : (val==="true"?true:val==="false"?false:val);
    if(sku) setSku(sku,key,v,lab,null,why); else setG(key,v,lab,null,why);
    $$('[data-seg="'+key+'"]'+(sku?'[data-sku="'+sku+'"]':'')).forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-v")===val); });
    paint(); return;
  }
  if(t.hasAttribute("data-sw")){
    var k=t.getAttribute("data-sw"), lb=t.getAttribute("data-lab")||k, wy=t.getAttribute("data-why")||"";
    setG(k,!ST.g[k],lb,function(v){return v?"on":"off";},wy);
    t.classList.toggle("on",!!ST.g[k]);
    paint(); return;
  }
});

/* typed numbers, master data and plan cells */
var numTimer=null, gameTimer=null;
document.addEventListener("input",function(e){
  var el=e.target;

  /* game decisions */
  if(el.hasAttribute&&(el.hasAttribute("data-gp")||el.hasAttribute("data-gpn"))){
    var gp=el.getAttribute("data-gp")||el.getAttribute("data-gpn");
    if(el.value==="") return;
    var gv=Number(el.value); if(!isFinite(gv)) return;
    var lo=el.min===""?null:Number(el.min), hi=el.max===""?null:Number(el.max);
    if(lo!=null&&gv<lo) gv=lo; if(hi!=null&&gv>hi) gv=hi;
    gset(gp,gv);
    var partner=el.hasAttribute("data-gp")? $('[data-gpn="'+gp+'"]') : $('[data-gp="'+gp+'"]');
    if(partner) partner.value=gv;
    clearTimeout(gameTimer);
    gameTimer=setTimeout(function(){ renderGame(); },520);
    return;
  }

  /* a number typed beside a slider */
  if(el.classList&&el.classList.contains("valin")){
    var key=el.getAttribute("data-gnum"), skc=el.getAttribute("data-snum"),
        lab=el.getAttribute("data-lab")||key, suf=el.getAttribute("data-suf")||"";
    if(el.value==="") return;
    var v=Number(el.value);
    if(!isFinite(v)) return;
    var lo=Number(el.min), hi=Number(el.max);
    if(isFinite(lo)&&v<lo) v=lo;
    if(isFinite(hi)&&v>hi) v=hi;
    var rng=$('input[type=range][data-g="'+key+'"]'+(skc?'[data-sku="'+skc+'"]':':not([data-sku])'));
    if(rng) rng.value=v;
    clearTimeout(numTimer);
    var apply=function(){
      if(skc) setSku(skc,key,v,lab,function(x){return x+suf;},"");
      else setG(key,v,lab,function(x){return x+suf;},"");
      paint();
    };
    if(skc){ if(!ST.sku[skc])ST.sku[skc]={}; ST.sku[skc][key]=v; } else ST.g[key]=v;
    paint();
    numTimer=setTimeout(apply,600);
    return;
  }

  /* the item file */
  if(el.hasAttribute&&el.hasAttribute("data-md")){
    var p=el.getAttribute("data-md").split(":"), code=p[0], f=p[1];
    if(!ST.md[code]) ST.md[code]={};
    if(f==="name"||f==="abc"||f==="xyz"){ ST.md[code][f]=el.value; }
    else {
      if(el.value==="") return;
      var n=Number(el.value); if(!isFinite(n)) return;
      var mn=el.min===""?null:Number(el.min), mx2=el.max===""?null:Number(el.max);
      if(mn!=null&&n<mn) n=mn;
      if(mx2!=null&&n>mx2) n=mx2;
      ST.md[code][f]=n;
    }
    paint();
    return;
  }

  /* the planning book */
  if(el.hasAttribute&&el.hasAttribute("data-plan")){
    var q=el.getAttribute("data-plan").split(":"), c=q[0], row=q[1], wi=q[2];
    var P=planOf(c);
    if(el.value==="") return;
    var val=Math.max(0,Number(el.value)||0);
    if(row==="open"){ P.open=val; }
    else {
      var Mnow=computeAll(ST), rr=Mnow.rows.filter(function(x){return x.sk.code===c;})[0];
      if(!P[row]){ var base=computeMps(rr); P[row]=base[row].slice(); }
      P[row][+wi]=val;
    }
    paint();
    return;
  }

  /* company name */
  if(el.hasAttribute&&el.hasAttribute("data-co")){ ST.coName=el.value||null;
    var t=$(".brandtxt .co"); if(t) t.textContent=(ST.coName||SECTORS[ST.sec].company)+" · "+SECTORS[ST.sec].site;
    return; }
});

function slider(o){

      ' data-lab="'+esc(o.label)+'" data-suf="'+(o.suf||"")+'" aria-label="'+esc(o.label)+' value">'+

/* deterministic pseudo-random weekly demand + forecast, for teaching charts */
function seedRnd(str){ var s=0; for(var i=0;i<str.length;i++)s=(s*31+str.charCodeAt(i))%99991;
  return function(){ s=(s*9301+49297)%233280; return s/233280; }; }
function weekly(sk,g,q,n){
  n=n||16; var rnd=seedRnd(sk.code+q), act=[],lab=[];
  var cvB=sk.cv*(g.volatility?1.55:1);
  for(var i=0;i<n;i++){
    var qi=(q-1+Math.floor(i/13))%8, sea=sk.season[qi];
    var wk=(i%13)/13, seaNext=sk.season[(qi+1)%8], seaSm=sea+(seaNext-sea)*wk*0.35;
    var promoW=(g.promo&&sk.promo>0&&i%13>=3&&i%13<=6)? 1+0.55*sk.promo*2.1 : 1;
    var noise=1+(rnd()-0.5)*cvB*2.2;
    act.push(Math.max(0,sk.baseQ/13*seaSm*promoW*noise));
    lab.push("w"+(i+1));
  }
  /* build each method's forecast on the same series */
  var M=METHODS[g.method], fc=[], lvl=act[0], tr=0, alpha=g.alpha, beta=0.15;
  var seaIdx=[];
  for(var s2=0;s2<8;s2++) seaIdx.push(sk.season[s2]);
  for(var j=0;j<n;j++){
    var f;
    if(g.method==="naive")      f = j===0?act[0]:act[j-1];
    else if(g.method==="ma")    { var w=4,acc=0,c=0; for(var m=Math.max(0,j-w);m<j;m++){acc+=act[m];c++;} f=c?acc/c:act[0]; }
    else if(g.method==="holt")  { f=lvl+tr; var pl=lvl; lvl=alpha*act[j]+(1-alpha)*(lvl+tr); tr=beta*(lvl-pl)+(1-beta)*tr; }
    else if(g.method==="hw")    { var qi2=(q-1+Math.floor(j/13))%8; f=(lvl)*seaIdx[qi2]/ (seaIdx[(q-1)%8]||1);
                                  lvl=alpha*(act[j]/(seaIdx[qi2]||1))+(1-alpha)*lvl; }
    else if(g.method==="croston"){ f = sk.xyz==="Z"? (j<2?act[0]:(act[j-1]+act[j-2])/2*0.97) : lvl*0.86; lvl=alpha*act[j]+(1-alpha)*lvl; }
    else                        { f=lvl; lvl=alpha*act[j]+(1-alpha)*lvl; }
    /* planner override on promotion weeks */
    if(g.promo&&sk.promo>0&&j%13>=3&&j%13<=6) f=f*(1+(g.forecastAdj/100));
    fc.push(Math.max(0,f));
  }
  return {lab:lab,act:act,fc:fc};
}

    return h;
  },
  live:function(M){
    var r=sel(M), g=ST.g, o={};
    var W=weekly(r.sk,g,ST.q,16);
    var errs=W.act.map(function(a,i){return a-W.fc[i];});
    var mad=sum(errs.map(Math.abs))/errs.length;
    var ts=mad>0? sum(errs)/mad : 0;
    var wmape=sum(errs.map(Math.abs))/Math.max(sum(W.act),1)*100;
    var bias=sum(errs)/errs.length/Math.max(sum(W.act)/W.act.length,1)*100;
    o.mape='<span class="'+(wmape<12?"g":wmape<25?"w":"b")+'">'+fm(wmape,1)+'%</span>';
    o.bias='<span class="'+(Math.abs(bias)<5?"g":Math.abs(bias)<12?"w":"b")+'">'+(bias>0?"+":"")+fm(bias,1)+'%</span>';
    o.ts='<span class="'+(Math.abs(ts)<2.5?"g":Math.abs(ts)<4?"w":"b")+'">'+(ts>0?"+":"")+fm(ts,2)+'</span>';
    var msg;
    if(Math.abs(ts)>4) msg=nt("bad","Tracking signal has broken","The running error sum is <b>"+fm(ts,2)+"</b> MADs. The model is no longer tracking reality. This is not noise, it is a structural miss. Change method or re-fit before you touch safety stock.");
    else if(wmape>25) msg=nt("bad","The forecast is not usable","At "+fm(wmape,1)+"% error you are buffering blind. Every point of error here becomes inventory somewhere else."+(METHODS[g.method].season?"":" This item is seasonal and your method does not model seasonality."));
    else if(bias<-8) msg=nt("warn","Consistently under-forecasting","You are short by "+fm(-bias,1)+"% on average, which means chronic firefighting. Service will not stabilise until the bias is corrected, buffer cannot fix a systematic miss.");
    else if(bias>8) msg=nt("warn","Consistently over-forecasting","You are over by "+fm(bias,1)+"% on average. That inventory does not disappear, it becomes a write-off, one quarter later, with somebody else's name on the report.");
    else msg=nt("good","Forecast is behaving","Error "+fm(wmape,1)+"%, bias "+fm(bias,1)+"%, tracking signal "+fm(ts,2)+". Now check whether the remaining error is irreducible noise, beyond that point, extra modelling effort buys nothing and you should be spending it on lead time instead.");
    o.fcnote=msg;
    var b=M.bullwhip;
    o.bullnote = b>1.6? nt("bad","You are amplifying hard","Order variability is "+pct((b-1)*100,0)+" above true demand variability. Every tier above you is now planning against a signal you invented.")
      : b>1.25? nt("warn","Moderate amplification","Ratio "+fm(b,2)+". Batching and forecast error are the main contributors here. Smaller, more frequent orders would flatten this.")
      : nt("good","Demand signal is clean","Ratio "+fm(b,2)+", your orders look roughly like real demand. This is worth more to your suppliers than any forecast you could send them.");
    o.dgrid=M.rows.map(function(rr){
      var need=ST.g.promo? 55*rr.sk.promo : 0;
      var set=ST.g.forecastAdj, gap=Math.abs(set-need);
      var rec = rr.sk.xyz==="Z"? "Croston" : Math.max.apply(null,rr.sk.season)>1.5? "Holt-Winters" : "Exp. smoothing";
      var ok = (rec.indexOf(METHODS[ST.g.method].label.split(" ")[0])>=0)||
               (rec==="Exp. smoothing"&&ST.g.method==="expo")||(rec==="Holt-Winters"&&ST.g.method==="hw")||(rec==="Croston"&&ST.g.method==="croston");
      return '<tr data-selsku="'+rr.sk.code+'" style="cursor:pointer" class="'+(rr.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+rr.sk.code+'<span class="nm">'+esc(rr.sk.name)+'</span></td>'+
        '<td><span class="chip '+rr.sk.abc.toLowerCase()+'">'+rr.sk.abc+'</span> <span class="chip '+rr.sk.xyz.toLowerCase()+'">'+rr.sk.xyz+'</span></td>'+
        '<td>'+qty(rr.sk.baseQ)+'</td>'+
        '<td>'+fm(rr.sk.season[(ST.q-1)%8],2)+'</td>'+
        '<td>'+fm(rr.sk.promo*100,0)+'%</td>'+
        '<td>'+fm(rr.sk.cv*100,0)+'%</td>'+
        '<td>'+fm(need,0)+'%</td>'+
        '<td class="'+(gap<8?"g":gap<30?"w":"b")+'">'+fm(set,0)+'%</td>'+
        '<td class="'+(rr.mape<12?"g":rr.mape<25?"w":"b")+'">'+fm(rr.mape,1)+'%</td>'+
        '<td class="'+(Math.abs(rr.bias)<6?"g":"w")+'">'+(rr.bias>0?"+":"")+fm(rr.bias,1)+'</td>'+
        '<td class="'+(ok?"g":"w")+'">'+rec+(ok?" ✓":"")+'</td></tr>';
    }).join("");
    return o;
  },
  charts:function(M){
    var S=M.S,r=sel(M),g=ST.g,o={};
    var W=weekly(r.sk,g,ST.q,16);
    o.fc=svgLine({x:W.lab,w:520,h:210,series:[
      {name:"Actual",color:"#3A4778",data:W.act,fillArea:true},
      {name:"Forecast",color:S.acc,data:W.fc,dash:true}],
      bands:[{y:r.SSu,label:"safety stock",color:"#B42318"}],yFmt:function(v){return qty(v);}});
    o.season=svgLine({x:["Q1","Q2","Q3","Q4","Q5","Q6","Q7","Q8"],w:460,h:200,yMin:0,
      series:M.rows.map(function(rr,i){return {name:rr.sk.code,color:PAL[i%PAL.length],
        data:rr.sk.season,dotR:2,endLabel:rr.sk.code.split("-")[1]};}),
      bands:[{y:1,label:"average",color:"#8497AE"}],yFmt:function(v){return fm(v,1)+"×";}});
    var b=M.bullwhip;
    o.bull=svgBars({x:["Retail shelf","Your orders","Your supplier","Tier 2"],w:460,h:200,
      series:[{name:"Order variability",color:S.acc,data:[100,100*b,100*b*b*0.94,100*b*b*b*0.88]}],
      valLabels:true,yFmt:function(v){return fm(v,0);}});
    return o;
  }
};

      '<div data-live="eoqnote"></div>'+

        minor("EOQ assumes constant demand, instant replenishment, no quantity discounts and no capacity limit. All four are false in your business. Use it as a sanity check on the order of magnitude, never as an instruction.")));
    h+=card("The price of service","safety stock at each service level",'<div data-chart="svc"></div>'+

        fx("SS = Z · √(LT·σd² + d²·σLT²)","The full formula. Term one is demand variability over the lead time; term two is lead-time variability.")+
        "<p>Most people use only the first term and then wonder why service is worse than the model promised. If your supplier's delivery varies by ±8 days, that variability is often the <b>larger</b> of the two terms, and it is usually the cheaper one to fix.</p>"+
        "<p>Three things follow directly:</p>"+
        "<ul><li>Halving lead time cuts safety stock by about 29%, not 50%, the lead time sits under a square root.</li>"+
        "<li>Halving lead-time <b>variability</b> often does more than halving lead time itself, and costs a conversation rather than a contract.</li>"+

        viz(dgPooling(),"<b>The square-root law.</b> Nine warehouses each need their own buffer against their own surprises. Pool them into one and the surprises cancel each other out, you need roughly √9 = 3 units instead of 9, for exactly the same service. This is the entire mathematical case for centralisation, before you add back the extra transport cost.")+
        "<p><b>Service level versus fill rate.</b> Cycle service level is the probability of not stocking out in a cycle. Fill rate is the fraction of demand met from stock. They are different numbers and the gap is usually 3-5 points, 95% CSL typically gives 99%+ fill, because most stockouts are small and brief. Always establish which one the customer is actually measuring.</p>"+

      '<div>'+seg({g:"mode",sku:sk.code,label:"Transport mode",opts:S.modes.map(function(m){return {v:m,l:MODES[m].label.split(" ")[0]};}),

      '<div class="gridwrap"><table class="dg"><thead><tr>'+

        "<p>Quoted lead time is a marketing number. Measure the actual distribution yourself over six months and plan against that instead. You will usually find the mean is close and the variance is far worse than advertised.</p>"+

TABS.production={n:"Production",
  html:function(M){

      slider({g:"oeeA",label:"Availability",min:60,max:99,suf:"%",hint:"Uptime against planned production time. Breakdowns, changeovers, waiting for materials.",why:"Availability is the first of the three OEE factors. They multiply, so a weak one dominates."})+

    h+=card("Capacity versus demand","this quarter",'<div data-chart="cap"></div>'+
      viz(dgOEE(),"<b>Multiply, do not average.</b> Uptime 88%, speed 92% and quality 98% each sound perfectly respectable. Multiplied together they leave 79% of the day producing good product at full rate. Anyone quoting 95% OEE is measuring one of the three and calling it all of them.")+
      '<div class="grid3" style="margin-top:8px">'+
      '<div><div class="eyebrow">OEE</div><div class="bignum" data-live="oee"></div><small data-live="oeen"></small></div>'+
      '<div><div class="eyebrow">Utilisation</div><div class="bignum" data-live="util"></div><small>demand ÷ capacity</small></div>'+
      '<div><div class="eyebrow">Changeover loss</div><div class="bignum" data-live="co"></div><small data-live="con"></small></div>'+
      '</div>'+
      '<div data-live="capnote"></div>');
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Queueing: why 98% utilisation is a trap","relative lead time vs utilisation",
      '<div data-chart="queue"></div>'+
      '<p class="hint">Lead time does not rise gently as you load a plant, it rises hyperbolically. Between 85% and 95% utilisation, queue time roughly triples. '+
      'This is the single most counter-intuitive fact in operations, and it is why a plant that looks efficient on a utilisation report is often the one with the worst delivery performance.</p>'+
      learn("Little's Law and the discipline of releasing less work",
        viz(dgLittle(),"<b>Identical machine in both rows.</b> The top row has three jobs in the system and a six-day lead time. The bottom row has eleven jobs and a twenty-two day lead time. Nothing got slower, the work just spends its life queueing. Releasing jobs earlier to 'catch up' is what created the bottom row.")+
        fx("WIP = Throughput × Cycle time","Arithmetic, not theory. It holds in a factory, a warehouse, a hospital and an inbox.")+
        "<p>Rearranged: <b>Cycle time = WIP ÷ Throughput</b>. If throughput is capped by your bottleneck, the only way to cut lead time is to cut work-in-progress. Releasing more work into a busy system does not make it produce faster, it makes everything in it slower, including the urgent job you released it for.</p>"+
        "<p>The practical rules that fall out of this:</p>"+
        "<ul><li>Cap WIP deliberately. Kanban does this by design, you cannot start something new until something finishes.</li>"+
        "<li>Do not schedule the bottleneck at 100%. Leave protective capacity or every disturbance becomes a delivery miss.</li>"+
        "<li>An hour lost at the bottleneck is an hour lost by the whole plant. An hour saved anywhere else is a mirage.</li>"+
        "<li>Fix the constraint and a new one appears somewhere else. That is success, not failure, but it means the plan must be re-checked rather than reused.</li></ul>"+
        minor("When a plant is late on everything, the instinct is to release jobs earlier. It is precisely wrong. Releasing earlier raises WIP, which raises cycle time, which makes you later, and then you release earlier still. A lot of expedite culture is this loop, running quietly for years.")));
    h+=card("MRP explosion","from finished goods to purchase orders",
      '<div data-live="mrp"></div>'+
      learn("What MRP actually does, and where it lies to you",
        "<p>MRP takes three inputs, the master production schedule, the bill of materials, and current inventory plus open orders, and answers one question for every component: <b>what do I need, how much, and by when?</b></p>"+
        "<ul><li><b>Gross requirement</b>: what the BOM says you need, quantity per parent × parent quantity.</li>"+
        "<li><b>Net requirement</b>: gross minus on-hand minus scheduled receipts. This is the netting step, and it is the whole point.</li>"+
        "<li><b>Planned order release</b>: net requirement, offset backwards by the lead time, and rounded to lot-size rules.</li></ul>"+
        viz(dgMRPnet(),"<b>Each bar subtracts from the one above it.</b> You need the gross quantity, but you already hold some and have already ordered some. What is left, the orange bar, is the only quantity that needs a purchase order. Systems that skip this netting step reorder things they already own.")+
        fx("Net = Gross − On hand − Scheduled receipts + Safety stock","Applied level by level down the BOM. Change something at level four and 200 finished goods may need re-planning.")+
        "<p><b>Where it lies.</b> Classic MRP assumes infinite capacity, it will cheerfully tell you to make 40,000 units next Tuesday on a line that can make 12,000. It also assumes lead times are fixed constants, when in reality they lengthen exactly when you are busy. That is why MRP output is a proposal, not an instruction, and why rough-cut capacity planning exists.</p>"+
        minor("A yield or scrap factor missing from the BOM is the most common silent killer in MRP. If the process really consumes 1.06kg to make 1kg and the BOM says 1.00, you will be exactly 6% short forever, and the shortage will be blamed on the supplier every single time.")));
    h+='</div>';

    h+=card("Line loading by product code","effective capacity share",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Demand</th><th>Batch size</th><th>Runs/qtr</th>'+
      '<th>Changeovers</th><th>Capacity share</th><th>Served</th><th>Lost'+dirMini('penalty')+'</th><th>Lost value</th>'+
      '</tr></thead><tbody data-live="pgrid2"></tbody><tfoot data-live="pfoot"></tfoot></table></div>'+
      '<p class="hint" style="margin-top:8px">When capacity is short, something must give. Allocating in proportion to demand feels fair and is usually wrong, '+
      'the profit-maximising rule is to allocate by <b>contribution margin per unit of the constrained resource</b>, not by volume or by whoever shouted loudest.</p>'+
      (M.S.key==="packaging"? learn("Make-ready: the waste that happens before the first good unit",
        viz(dgMakeReady(),"<b>Two costs pulling in opposite directions.</b> Every changeover throws away substrate while the press is brought up to colour, so short runs waste material. But long runs build printed stock that exactly one customer can buy, and if their artwork changes it is worth scrap value. The green line is where the two together are cheapest, and it moves every time you shorten a changeover.")+
        "<p>Make-ready is the substrate consumed between the last good unit of one job and the first good unit of the next: web threaded, plates mounted, colour brought to standard, register set. On a wide-web press it can be hundreds of metres, and it is charged to the job that follows.</p>"+
        "<ul><li><b>It is measured last-good-part to first-good-part.</b> If your plant measures press-stop to press-start it is hiding the run-up scrap, which is usually the larger half.</li>"+
        "<li><b>SMED moves the green line left.</b> Halve the changeover and short runs become affordable, which means less printed stock at risk, not just more capacity.</li>"+
        "<li><b>Minimum run length is a commercial decision, not a technical one.</b> If a customer's order is below the point where make-ready is recoverable, either price it properly or decline it.</li></ul>"+
        minor("Ask what percentage of substrate purchased last year left the site as saleable product. Converters who have never calculated it are usually 4-9% worse than they assume, and every point of it is pure margin.")) : "")+
      learn("SMED: buying capacity without buying a machine",
        "<p>Single-Minute Exchange of Die separates changeover work into two kinds:</p>"+
        "<ul><li><b>Internal setup</b>: can only be done with the machine stopped.</li>"+
        "<li><b>External setup</b>: can be done while the machine is still running the previous product.</li></ul>"+
        "<p>The method is simply: observe and classify every step, convert as much internal to external as possible (pre-stage tooling, pre-heat, pre-kit materials), then streamline what remains (quick-release fittings, standardised heights, no threaded fasteners, no adjustment by trial).</p>"+
        fx("Economic batch ∝ √(setup time)","Halve the changeover and the economic batch falls ~29%, which is how lean plants run small batches without losing capacity.")+
        "<p>The consequence matters more than the capacity: shorter changeovers make small batches economic, small batches make fresher stock and faster response possible, and that is worth far more than the recovered hours.</p>"+
        minor("Changeover time is almost always measured last-good-part to first-good-part. If your plant measures machine-stop to machine-start, it is hiding the run-up scrap and the quality settling period, which is often the larger half.")));
    return h;

    comps.forEach(function(c){

      lv.push('<tr><td class="code">'+"·".repeat(c.l)+" L"+c.l+'</td><td style="text-align:left">'+esc(c.n)+'</td>'+
        '<td>'+fm(c.q,c.q<1?3:2)+'</td><td>'+qty(gross)+'</td><td>'+qty(oh)+'</td>'+
        '<td class="'+(net>0?"w":"g")+'">'+qty(net)+'</td><td>'+c.lt+'d</td>'+
        '<td>day −'+c.lt+'</td></tr>');
    });
    lv.push('</tbody></table></div><p class="hint" style="margin-top:8px">Read it downwards: each level nets against its own stock, then offsets backwards by its own lead time. '+
      'The cumulative lead time to the bottom of this tree is what actually determines how fast you can respond to a change in demand, not the lead time of any single component.</p>');
    o.mrp=lv.join("");
    return o;
  },
  charts:function(M){
    var S=M.S,g=ST.g,o={};
    o.cap=svgBars({w:460,h:210,x:["Theoretical","After OEE","After changeover","Demand"],
      yFmt:function(v){return qty(v);},valLabels:true,
      series:[{name:"units",color:S.acc,data:[
        M.capacity/((M.oee/100)*(1-M.coLoss/100)),
        M.capacity/(1-M.coLoss/100),
        M.capacity, M.totalDem]}]});
    var us=[50,60,70,75,80,85,88,90,92,94,96,98];
    o.queue=svgLine({w:460,h:200,x:us.map(function(u){return u+"%";}),
      series:[{name:"Relative lead time",color:S.acc,data:us.map(function(u){return 1/(1-u/100);})},
              {name:"You",color:"#B42318",data:us.map(function(u){return Math.abs(u-M.util)<3? 1/(1-clamp(M.util,40,97)/100):null;}),dotR:6}],
      yFmt:function(v){return fm(v,0)+"×";}});
    return o;
  }
};

/* ============================== 06 LOGISTICS ============================== */
TABS.logistics={n:"Logistics",
  html:function(M){
    var S=M.S,h='';
    h+='<div class="grid2">';
    h+=card("Transport controls","",
      seg({g:"mode",label:"Primary mode",opts:S.modes.map(function(m){return {v:m,l:MODES[m].label};}),
        hint:MODES[ST.g.mode].note,
        why:"Mode sets transit time, cost per kilo and CO2 per tonne-km simultaneously. There is no free choice here."})+
      slider({g:"fill",label:"Vehicle fill rate",min:35,max:100,suf:"%",
        hint:"Below about 75%, cost and CO2 per unit rise steeply, an empty half-trailer costs the same to move as a full one.",
        why:"Fill rate divides fixed transport cost across more units. It is the cheapest lever in logistics and the most commonly ignored."})+
      seg({g:"heuristic",label:"Routing algorithm",opts:[{v:"sweep",l:"Sweep"},{v:"savings",l:"Clarke-Wright"}],
        hint:"Sweep clusters by angle; savings merges the pairs with the largest distance saving first.",
        why:"Routing algorithm changes total distance by 8-15% at zero capital cost."})+
      slider({g:"vrpCap",label:"Vehicle capacity",min:14,max:60,suf:" drops",
        hint:"Bigger vehicles mean fewer routes but less flexibility on tight urban windows.",
        why:"Vehicle capacity determines how many routes are needed and how well the savings algorithm can merge stops."})+
      sw({g:"crossdock",label:"Cross-docking at the DC",sub:"Inbound to outbound within hours, no storage",why:"Cross-docking removes putaway, storage and picking cost, but it requires reliable inbound timing to work at all."})+
      sw({g:"backhaul",label:"Backhaul programme",sub:"Paid loads on the return leg",why:"An empty return is half the distance, half the fuel and none of the revenue."}));
    h+=card("Route plan","one depot, 14 drops",'<div data-chart="vrp"></div>'+
      '<div data-live="vrpnote"></div>');
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Mode trade-off","the triangle you cannot escape",'<div data-chart="modes"></div>'+
      legend([["Cost index","#B42318"],["Speed index","#00875E"],["Carbon index","#41505F"]])+
      '<div data-live="modenote"></div>'+
      learn("Storage versus cross-docking, drawn",
        viz(dgCrossdock(),"<b>Same goods, same building, two routes through it.</b> Cross-docking deletes putaway, storage and picking, the three most expensive steps. What it buys with that saving is a dependency: inbound has to arrive in the window you agreed, or the cross-dock is just an expensive empty floor.")+
        "<p>It suits predictable, high-volume, fast-moving goods with reliable inbound timing, and nothing else. The most common failure is installing it for the cost saving and then discovering supplier delivery reliability was never good enough to support it, at which point you have removed your buffer <i>and</i> your storage.</p>")+
      learn("Choosing a mode without lying to yourself",
        "<p>The comparison people make is cost per shipment. The comparison that decides correctly is <b>total cost including the inventory the mode creates</b>.</p>"+
        "<p>Ocean freight on a 34-day lane is cheap per kilo and expensive in pipeline stock, safety stock (because the lead time is long and variable) and obsolescence risk. Air is the reverse. The break-even depends almost entirely on value density, value per kilo.</p>"+
        fx("Break-even ≈ (air − ocean cost/kg) vs (value/kg × carry rate × days saved ÷ 365)","If the inventory saving exceeds the freight premium, air is genuinely cheaper. For a €690 handset weighing 420g, that maths is closer than most people assume.")+
        "<ul><li><b>Air</b>: high value density, launches, EOL, emergencies, short shelf life. ~600 g CO2e per tonne-km.</li>"+
        "<li><b>Ocean</b>: low value density, stable demand, long horizons. ~12 g. Fifty times cleaner than air.</li>"+
        "<li><b>Rail</b>: dense, steady, fixed corridors, needs road at both ends. ~24 g.</li>"+
        "<li><b>Road</b>: flexible, door to door, priced by the trailer. ~95 g.</li></ul>"+
        minor("Air freight is charged on the greater of actual weight and volumetric weight, usually length × width × height in cm ÷ 5000 or 6000. Redesigning a carton so it falls under the divisor is regularly the highest-return exercise available in logistics, and it costs one afternoon with a tape measure.")));
    h+=card("Load economics","cube-out vs weigh-out by line item",'<div data-chart="cube"></div>'+
      '<div data-live="cubenote"></div>'+
      learn("FTL, LTL, and the pallet count where it flips",
        "<p><b>Full truckload</b> buys the whole trailer: direct, one handling, fastest, and priced the same whether it is full or not. <b>Less-than-truckload</b> shares it: cheaper for small volumes, but with terminal handling, transfers, more damage and longer transit.</p>"+
        viz(dgFTL(),"<b>Two pricing models crossing.</b> LTL charges per pallet, so its line rises steadily. FTL charges for the whole trailer whether you fill it or not, so its line is flat. Below the crossover you are sharing a trailer and saving money; above it you are paying per-pallet rates for something you could move as one full load.")+
        "<p>The break-even is usually somewhere around 12-16 pallets, but it moves with lane, season and carrier. Below it, LTL wins. Above it, you are paying LTL rates for something you could have moved as a full load, and taking the extra handling damage for free.</p>"+
        "<ul><li><b>Cube-out</b>: the trailer fills physically before hitting the weight limit. Light, bulky freight: crisps, pillows, USB docks. Optimise packaging and pallet patterns.</li>"+
        "<li><b>Weigh-out</b>: the trailer hits the weight limit with space left over. Dense freight: cable drums, liquids, transformers. Optimise routing and consolidation instead; there is nothing to gain from smaller boxes.</li></ul>"+
        viz(dgCube(),"<b>Both trailers are full, of different things.</b> The left one ran out of space with weight to spare, so its answer is better packaging and pallet patterns. The right one hit the legal weight limit half empty, so packaging changes are pointless and the answer is consolidation and routing. Find out which yours does before spending anything.")+
        minor("Detention and demurrage are almost entirely avoidable and almost never owned by anyone. Put them on one named person's scorecard and they typically halve within a quarter, not because anyone works harder, but because someone finally looks at them.")));
    h+='</div>';

    h+=card("Freight ledger · every line item","cost, weight and carbon",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Mode</th><th>Unit kg</th><th>Unit m³</th><th>Density</th><th>Chargeable kg</th>'+
      '<th>Freight/unit</th><th>% of price</th><th>Freight €</th><th>CO2 kg</th><th>Behaviour</th>'+
      '</tr></thead><tbody data-live="lgrid"></tbody><tfoot data-live="lfoot"></tfoot></table></div>'+
      '<p class="hint" style="margin-top:8px">The "% of price" column is the one to watch. Where freight is under 2% of price, mode choice is a service decision. '+
      'Where it is over 8%, freight is a product cost and belongs in the pricing conversation.</p>'+
      learn("Incoterms 2020: where cost and risk part company",
        "<p>Eleven rules define who arranges carriage, who bears cost, and, <b>separately</b>: where risk transfers. The most expensive misunderstanding in international trade is assuming those last two happen at the same place. Under CFR and CIF they emphatically do not: risk passes when goods are loaded at origin, while the seller keeps paying freight all the way to the destination port. Goods lost mid-ocean are the buyer's loss on a shipment the seller is still paying for.</p>"+
        viz(dgIncoterm(),"<b>The circle is where risk passes to the buyer. The bar is how far the seller keeps paying.</b> Under FCA and DAP they line up, which is what everyone assumes always happens. Under CIF they do not: risk passes at the vessel while the seller pays freight to the destination port. Cargo lost mid-ocean is the buyer's loss on a shipment the seller is still funding.")+
        "<p>Two practical rules worth memorising:</p>"+
        "<ul><li>If it moves in a container, use <b>FCA</b>, not FOB. FOB was written for goods lifted over a ship's rail, and containers are handed over at a terminal days earlier, leaving a gap where nobody is clearly liable.</li>"+
        "<li><b>DDP</b> makes the seller the importer of record, which they often cannot legally be in the destination country. It looks generous and creates genuine problems.</li></ul>"+
        "<p>The full table is in the Library tab.</p>"));
    return h;
  },
  live:function(M){
    var g=ST.g,S=M.S,o={};
    var rts=(g.heuristic==="sweep"?sweepRoutes(g.vrpCap):savingsRoutes(g.vrpCap));
    var tot=sum(rts.map(routeLen));
    var alt=sum((g.heuristic==="sweep"?savingsRoutes(g.vrpCap):sweepRoutes(g.vrpCap)).map(routeLen));
    o.vrpnote = g.heuristic==="savings"
      ? nt("good","Clarke-Wright is merging drops","Savings routing is producing "+rts.length+" routes over "+fm(tot,0)+
        " km, "+pct(Math.abs(alt-tot)/alt*100,1)+" shorter than sweep clustering, at zero capital cost. The rule is simply: compute S = d(0,i) + d(0,j) − d(i,j) for every pair, sort descending, and merge while capacity allows.")
      : nt("warn","Sweep is leaving distance on the table","Angular clustering gives "+rts.length+" routes over "+fm(tot,0)+
        " km. Switching to Clarke-Wright savings would cut roughly "+pct(Math.abs(alt-tot)/tot*100,1)+" of distance immediately. Sweep's only real advantage is that a transport office can reproduce it by hand.");
    var mo=MODES[g.mode];
    var frShare=M.revenue>0? M.freight/M.revenue*100:0;
    o.modenote=nt(frShare>8?"warn":"good","Freight is "+pct(frShare,1)+" of revenue",
      mo.label+" at "+fm(S.distanceKm,0)+" km average lane. Transit "+mo.days+" days, "+fm(mo.co2gPerTkm,0)+
      " g CO2e per tonne-km, total "+fm(M.co2/1000,1)+" tonnes this quarter. "+
      (frShare>8?"At this share, freight is a product cost and belongs in the pricing conversation, not just the logistics budget."
                :"At this share, mode choice is a service decision rather than a cost one, buy the speed if it earns service."));
    var cubers=M.rows.filter(function(r){return r.sk.kg/Math.max(r.sk.cbm,1e-9) < 250;});
    o.cubenote=nt("good",cubers.length+" of "+M.rows.length+" lines cube out",
      (cubers.length? "These lines fill the trailer before hitting the weight limit: "+cubers.map(function(r){return r.sk.code;}).join(", ")+
        ". For them, packaging and pallet pattern are the lever; nothing is gained from routing changes."
        : "Everything in this portfolio is dense enough to weigh out. Packaging redesign will not help, consolidation and routing will."));
    o.lgrid=M.rows.map(function(r){
      var dens=r.sk.kg/Math.max(r.sk.cbm,1e-9);
      var chg=(r.mode==="air"||r.mode==="courier")? Math.max(r.sk.kg,r.sk.cbm*167) : r.sk.kg;
      var shr=r.sk.price>0? r.frUnit/r.sk.price*100 : 0;
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.name)+'</span></td>'+
        '<td>'+MODES[r.mode].label+'</td>'+
        '<td>'+fm(r.sk.kg,r.sk.kg<10?3:0)+'</td><td>'+fm(r.sk.cbm,4)+'</td>'+
        '<td>'+fm(dens,0)+'</td><td>'+fm(chg,chg<10?3:0)+'</td>'+
        '<td>'+money(r.frUnit)+'</td>'+
        '<td class="'+(shr<2?"g":shr<8?"w":"b")+'">'+(r.sk.price>0?fm(shr,1)+"%":", ")+'</td>'+
        '<td>'+money(r.freight)+'</td><td>'+fm(r.co2,0)+'</td>'+
        '<td>'+(dens<250?'<span class="chip y">CUBES OUT</span>':'<span class="chip x">WEIGHS OUT</span>')+'</td></tr>';
    }).join("");
    o.lfoot='<tr><td>TOTAL</td><td>'+MODES[g.mode].label+'</td><td></td><td></td><td></td><td></td><td></td>'+
      '<td>'+pct(frShare,1)+'</td><td>'+money(M.freight)+'</td><td>'+fm(M.co2,0)+'</td><td></td></tr>';
    return o;
  },
  charts:function(M){
    var S=M.S,g=ST.g,o={};
    o.vrp=svgVrp(g.heuristic,g.vrpCap);
    var ms=S.modes;
    o.modes=svgBars({w:460,h:210,x:ms.map(function(m){return MODES[m].label.split(" ")[0];}),
      yFmt:function(v){return fm(v,0);},
      series:[
        {name:"Cost",color:"#B42318",data:ms.map(function(m){return MODES[m].eurPerKgKm/MODES.ocean.eurPerKgKm;})},
        {name:"Speed",color:"#00875E",data:ms.map(function(m){return 40/MODES[m].days;})},
        {name:"Carbon",color:"#41505F",data:ms.map(function(m){return MODES[m].co2gPerTkm/12;})}]});
    o.cube=svgScatter({w:460,h:290,xMin:0,xMax:Math.max.apply(null,M.rows.map(function(r){return r.sk.kg/Math.max(r.sk.cbm,1e-9);}))*1.15,
      yMin:0,yMax:Math.max.apply(null,M.rows.map(function(r){return r.sk.price||r.sk.cost;}))*1.15,
      xLabel:"density kg/m³  →   (below 250 = cubes out)",yLabel:"value per unit €  →",
      points:M.rows.map(function(r,i){return {x:r.sk.kg/Math.max(r.sk.cbm,1e-9),y:r.sk.price||r.sk.cost,
