/* chapter(tab): the header block that opens every screen. The step number
   is derived from TAB_ORDER rather than stored, so reordering the thread
   automatically renumbers everything. */
function chapter(tab){
  var C=CHAPTERS[tab]; if(!C) return "";
  var i=TAB_ORDER.indexOf(tab)+1;
  return '<div class="chapter"><div class="cn">Step '+i+' of '+TAB_ORDER.length+'</div>'+
    '<h2>'+esc(C.t)+'</h2><div class="cd">'+esc(C.d)+'</div>'+
    '<div class="chain">'+C.chain.map(function(c,j){
      return (j?'<i>›</i>':'')+'<b>'+esc(c)+'</b>';}).join("")+'</div></div>';
}

/* pager(tab): previous/next navigation.
   Three cases handled: no previous (a disabled placeholder keeps the grid
   balanced), a normal next, and the end of the thread, where the next button
   loops back to the tower instead of disappearing. Note the asymmetry: the
   BACK button shows the previous chapter's own title, while the NEXT button
   shows THIS chapter's `next` sentence — the reason to go on. */
function pager(tab){
  var i=TAB_ORDER.indexOf(tab);
  var prev=i>0?TAB_ORDER[i-1]:null, next=i<TAB_ORDER.length-1?TAB_ORDER[i+1]:null;
  var nm=function(k){return (CHAPTERS[k]&&CHAPTERS[k].n)||(TABS[k]&&TABS[k].n)||k;};
  var ti=function(k){return (CHAPTERS[k]&&CHAPTERS[k].t)||"";};
  var wy=function(k){return (CHAPTERS[k]&&CHAPTERS[k].next)||"";};
  var h='<div class="pager">';
  h+= prev
    ? '<button class="pgbtn" data-tab="'+prev+'"><span class="ar">←</span><span><span class="lb">Back to step '+i+'</span>'+
      '<span class="tt">'+esc(nm(prev))+'</span><span class="wy">'+esc(ti(prev))+'</span></span></button>'
    : '<div class="pgbtn dis"><span class="ar">←</span><span><span class="lb">You are at the start</span>'+
      '<span class="tt">Nothing before this</span></span></div>';
  h+= next
    ? '<button class="pgbtn nx" data-tab="'+next+'"><span class="ar">→</span><span><span class="lb">Next, step '+(i+2)+'</span>'+
      '<span class="tt">'+esc(nm(next))+'</span><span class="wy">'+esc(wy(tab))+'</span></span></button>'
    : '<button class="pgbtn nx" data-tab="tower"><span class="ar">↺</span><span><span class="lb">End of the walkthrough</span>'+
      '<span class="tt">Back to the control tower</span><span class="wy">Change something and watch it ripple through again.</span></span></button>';
  return h+'</div>';
}

/* ---------- (c) drawn explanations ----------
   Shared helpers for the dg* family. Unlike section 5's chart primitives,
   these diagrams place geometry by hand: the coordinates encode the idea.

   viz(svg,caption)  wraps a figure with its caption. The caption is the
                     teaching; the figure is the evidence.
   ar(...)           an arrow, using the shared #tip marker
   DEFS              two arrowhead markers, injected into any diagram that
                     needs them. Must appear once per <svg>, hence it is
                     concatenated after svgOpen() in each generator.
   box(...)          a rounded rectangle                                    */
function viz(svg,cap){ return '<div class="viz">'+svg+(cap?'<div class="cap">'+cap+'</div>':'')+'</div>'; }
function ar(x1,y1,x2,y2,col,w){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(col||"var(--sub)")+
  '" stroke-width="'+(w||1.6)+'" marker-end="url(#tip)"/>'; }
var DEFS='<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">'+
  '<path d="M0,0 L8,4 L0,8 z" fill="var(--sub)"/></marker>'+
  '<marker id="tipA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">'+
  '<path d="M0,0 L8,4 L0,8 z" fill="var(--acc)"/></marker></defs>';
function box(x,y,w,h,fill,stroke,r){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+
  '" stroke="'+(stroke||"none")+'" rx="'+(r==null?6:r)+'"/>'; }

/* --- safety stock anatomy ---
   The saw-tooth with all four reference levels named. Drawn by hand rather
   than simulated, so the lead-time bracket and the "risky window" label can
   be placed exactly where the argument needs them. X and Y are inline scale
   functions: 120 days across, 100 units of stock high. */
function dgSafety(){
  var w=560,h=230,s=svgOpen(w,h)+DEFS;
  var Y=function(v){return 190-v*1.45;},X=function(d){return 52+d*4.1;};
  s+='<rect x="52" y="'+Y(28)+'" width="'+(X(120)-52)+'" height="'+(Y(0)-Y(28))+'" fill="var(--bad)" opacity=".1"/>';
  /* two full cycles and the start of a third: down to the reorder point,
     vertically up on receipt, down again */
  s+='<path d="M52,'+Y(100)+' L'+X(45)+','+Y(28)+' L'+X(45)+','+Y(100)+' L'+X(90)+','+Y(34)+' L'+X(90)+','+Y(100)+' L'+X(120)+','+Y(52)+'" '+
     'fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linejoin="round"/>';
  [[100,"var(--sub2)","Order-up-to level"],[52,"var(--warn)","Reorder point"],[28,"var(--bad)","Safety stock"]].forEach(function(L){
    s+='<line x1="52" y1="'+Y(L[0])+'" x2="'+X(120)+'" y2="'+Y(L[0])+'" stroke="'+L[1]+'" stroke-width="1.4" stroke-dasharray="6 4"/>';
    s+=tx(X(120)+4,Y(L[0])+3.5,L[2],"start","lbl",10,L[1]);});
  /* the lead-time bracket: from the order point to the receipt */
  s+='<line x1="'+X(28)+'" y1="'+Y(52)+'" x2="'+X(45)+'" y2="'+Y(52)+'" stroke="var(--ink)" stroke-width="1.4"/>';
  s+=tx((X(28)+X(45))/2,Y(52)-6,"lead time","middle","lbl",10,"var(--ink)");
  s+=tx(X(22),Y(70),"demand eats the stock","middle","lbl",10);
  s+=tx(52,205,"time →","start","lbl",10);
  s+='<text transform="translate(16,120) rotate(-90)" text-anchor="middle" class="lbl" font-size="10">stock on hand</text>';
  s+=tx(X(45)+3,Y(14),"the risky window","start","lbl",10,"var(--bad)");
  s+='<line class="axis" x1="52" y1="'+Y(0)+'" x2="'+X(120)+'" y2="'+Y(0)+'"/>';
  s+='<line class="axis" x1="52" y1="24" x2="52" y2="'+Y(0)+'"/>';
  return s+'</svg>';
}

/* --- cycle service level vs fill rate ---
   Two panels side by side. Left: twenty delivery cycles as blocks, one of
   them red — that is 95% service level, counting EVENTS. Right: the same
   week as one long bar of demand with a small red tail — 99.3% fill rate,
   counting UNITS. The contrast is the whole diagram. */
function dgCSL(){
  var w=560,h=180,s=svgOpen(w,h)+DEFS;
  s+=tx(140,20,"Cycle service level = how OFTEN","middle","lbl",11.5,"var(--ink)");
  s+=tx(420,20,"Fill rate = how MUCH","middle","lbl",11.5,"var(--ink)");
  for(var i=0;i<10;i++){
    var x=32+i*22, out=(i===7);
    s+=box(x,34,16,44,out?"var(--bad)":"var(--good)","none",3);
  }
  s+=tx(140,94,"1 cycle in 20 has a shortage = 95%","middle","lbl",10);
  s+=tx(140,110,"...but it says nothing about size","middle","lbl",10,"var(--sub2)");
  s+=box(300,34,240,44,"var(--good)","none",5);
  s+=box(524,34,16,44,"var(--bad)","none",0);
  s+=tx(420,60,"99.3% of demand supplied","middle","",11,"#fff");
  s+=tx(420,94,"the shortage that happened was small","middle","lbl",10);
  s+=tx(420,110,"and brief, so fill rate stays high","middle","lbl",10,"var(--sub2)");
  s+=box(32,128,508,36,"var(--warnBg)","var(--warn)",8);
  s+=tx(286,150,"Same policy. Two different numbers. Always ask which one the customer is measuring.","middle","",11.5,"var(--ink)");
  return s+'</svg>';
}

/* --- the bullwhip ---
   Four echelons, each drawing the SAME underlying wave at a larger
   amplitude. The waveform is a product of three sines so it looks like real
   demand rather than a textbook sinusoid, and the amplitude multiplier per
   tier (1, 1.6, 2.5, 3.9) is the amplification being taught. */
function dgBullwhip(){
  var w=560,h=200,s=svgOpen(w,h)+DEFS;
  var lv=[["Shop shelf",1],["You",1.6],["Your supplier",2.5],["Tier 2",3.9]];
  lv.forEach(function(L,i){
    var x0=18+i*138,cy=86,amp=13*L[1];
    s+=tx(x0+58,26,L[0],"middle","lbl",11,"var(--ink)");
    var d="";
    for(var t=0;t<=56;t++){
      var y=cy+Math.sin(t/3.1)*amp*Math.sin(t/11+1)+Math.sin(t/1.7)*amp*0.32;
      d+=(t?"L":"M")+(x0+t*2.05).toFixed(1)+","+y.toFixed(1);}
    s+='<line x1="'+x0+'" y1="'+cy+'" x2="'+(x0+116)+'" y2="'+cy+'" stroke="var(--rule)" stroke-dasharray="3 3"/>';
    s+='<path d="'+d+'" fill="none" stroke="'+(i===0?"var(--good)":i===3?"var(--bad)":"var(--acc)")+'" stroke-width="2"/>';
    s+=tx(x0+58,154,"swing ±"+fm(L[1]*12,0)+"%","middle","lbl",10.5,i===3?"var(--bad)":"var(--sub)");
    if(i<3) s+=ar(x0+120,cy,x0+134,cy,"var(--sub2)",1.6);
  });
  s+=tx(280,180,"Same real demand at every step. Each tier reorders off the tier below, and the noise compounds.","middle","lbl",11);
  return s+'</svg>';
}

/* --- ABC x XYZ matrix ---
   A 3x3 grid. Value runs down the rows, predictability across the columns.
   The `col` array shades each cell by how much attention it deserves, so
   the top-left is darkest and the bottom-right nearly white. */
function dgABCXYZ(){
  var w=520,h=250,s=svgOpen(w,h);
  var cells=[["Tight control","S&OP focus","Postpone, don't buffer"],
             ["Automate","Periodic review","Buffer + watch"],
             ["Big batches","Automate","Buffer, then ignore"]];
  var col=[["#DEEAFB","#E4E7FD","#EDF1F6"],["#E8E5FA","#E8E5FA","#EDF1F6"],["#EDF1F6","#F5F8FC","#F5F8FC"]];
  var x0=74,y0=44,cw=138,ch=58;
  ["X, steady","Y, variable","Z, erratic"].forEach(function(t,j){ s+=tx(x0+j*cw+cw/2,34,t,"middle","lbl",11,"var(--ink)"); });
  ["A, high value","B, mid value","C, low value"].forEach(function(t,i){
    s+='<text transform="translate(64,'+(y0+i*ch+ch/2)+')" text-anchor="end" class="lbl" font-size="11" fill="var(--ink)">'+t+'</text>';});
  for(var i=0;i<3;i++)for(var j=0;j<3;j++){
    s+=box(x0+j*cw,y0+i*ch,cw-4,ch-4,col[i][j],"var(--rule)",8);
    s+=tx(x0+j*cw+(cw-4)/2,y0+i*ch+22,["A","B","C"][i]+["X","Y","Z"][j],"middle","",13,"var(--ink)");
    s+=tx(x0+j*cw+(cw-4)/2,y0+i*ch+39,cells[i][j],"middle","lbl",10);}
  s+=tx(260,238,"Nine boxes, nine policies. One policy for everything is the beginner mistake.","middle","lbl",11);
  return s+'</svg>';
}

/* --- Incoterms: where cost and risk part company ---
   One shared timeline (seller → origin port → vessel → destination port →
   buyer) with three rules drawn beneath it. Each rule has a CIRCLE where
   risk passes and a BAR showing how far the seller keeps paying. Under FCA
   and DAP they coincide; under CIF they do not, and the gap is labelled. */
function dgIncoterm(){
  var w=560,h=215,s=svgOpen(w,h)+DEFS;
  var pts=[["Seller",40],["Origin port",170],["Vessel",290],["Dest. port",410],["Buyer",520]];
  s+='<line x1="40" y1="66" x2="520" y2="66" stroke="var(--rule)" stroke-width="3"/>';
  pts.forEach(function(p){ s+='<circle cx="'+p[1]+'" cy="66" r="6" fill="var(--ink)"/>';
    s+=tx(p[1],52,p[0],"middle","lbl",10.5,"var(--ink)");});
  /* [code, riskX, costX, colour] — riskX === costX means they coincide */
  var rows=[["FCA",170,170,"var(--good)"],["CIF",290,410,"var(--bad)"],["DAP",520,520,"var(--good)"]];
  rows.forEach(function(r,i){
    var y=100+i*36;
    s+=tx(34,y+4,r[0],"end","",12,"var(--ink)");
    s+='<line x1="40" y1="'+y+'" x2="520" y2="'+y+'" stroke="var(--rule2)" stroke-width="8" stroke-linecap="round"/>';

  s+=box(44,156,452,46,"var(--panel2)","var(--rule)",9);
  s+=tx(270,175,"Only 12 of these 70 days are actually making anything.","middle","",12,"var(--ink)");
  s+=tx(270,191,"Attack information delay and queueing first: they are the cheapest days to buy back.","middle","lbl",10.5);
  return s+'</svg>';
}

/* --- the converter's trade-off: run length vs waste vs obsolescence ---
   Two opposing cost curves against campaign length. Make-ready waste falls
   as runs lengthen; stock and obsolescence risk rise. The optimum is found
   by brute force over the sampled range rather than solved analytically,
   which is honest: the real curves are not smooth either. */
function dgMakeReady(){
  var w=540,h=225,s=svgOpen(w,h)+DEFS;
  var X=function(d){return 56+d*23.5;},Y=function(v){return 158-v*15.5;};
  var waste=function(d){return clamp(4.8-d*0.26,0.8,4.8);};   /* falls with run length */
  var stock=function(d){return 0.55+d*0.34;};                 /* rises with run length */
  for(var i=0;i<=4;i++){var y=Y(i*2);
    s+='<line class="gridln" x1="56" y1="'+y+'" x2="'+X(19)+'" y2="'+y+'"/>';
    s+=tx(50,y+3.5,(i*2)+"%","end","",9.5);}
  var d1="",d2="";
  for(var r=1;r<=19;r++){ d1+=(r>1?"L":"M")+X(r)+","+Y(waste(r)); d2+=(r>1?"L":"M")+X(r)+","+Y(stock(r)); }
  s+='<path d="'+d1+'" fill="none" stroke="var(--bad)" stroke-width="2.6"/>';
  s+='<path d="'+d2+'" fill="none" stroke="#4B63E8" stroke-width="2.6"/>';
  s+=tx(X(3),Y(waste(3))-9,"make-ready waste","start","",11,"var(--bad)");
  s+=tx(X(12),Y(stock(12))-9,"stock & obsolescence risk","start","",11,"#4B63E8");
  /* find the campaign length minimising the SUM of the two */
  var best=0,bv=1e9;
  for(var r2=1;r2<=19;r2++){var t=waste(r2)+stock(r2); if(t<bv){bv=t;best=r2;}}
  s+='<line x1="'+X(best)+'" y1="30" x2="'+X(best)+'" y2="'+Y(0)+'" stroke="var(--good)" stroke-width="1.8" stroke-dasharray="5 4"/>';
  s+=tx(X(best),24,"lowest total cost ≈ "+best+" days","middle","",11,"var(--good)");
  [1,5,10,15,19].forEach(function(v){s+=tx(X(v),176,v+"d","middle","lbl",10);});
  s+='<line class="axis" x1="56" y1="'+Y(0)+'" x2="'+X(19)+'" y2="'+Y(0)+'"/>';
  s+=tx(300,194,"campaign length →","middle","lbl",10.5);
  s+=box(56,204,428,20,"var(--warnBg)","var(--warn)",7);
  s+=tx(270,218,"Short runs waste substrate. Long runs build printed stock only one customer can ever buy.","middle","",11,"var(--ink)");
  return s+'</svg>';
}
/* ==========================================================
   9 · YOUR NUMBERS
   ----------------------------------------------------------
   Two screens where nothing is fixed. The master data sheet
   is the item file every ERP has and every planner distrusts.
   The planning book is the week-by-week grid a planner
   actually lives in: you type the forecast and the orders,
   the sheet projects the stock, and it tells you afterwards
   what your plan cost.

   THE OVERLAY MODEL
     Seeded data in section 2 is never mutated. Instead:
       ST.md      per-field edits, keyed by product code
       ST.hidden  codes the user removed
       ST.newSkus codes the user added
     effSku() merges an edit map over a seeded record, and skuList()
     assembles the effective portfolio. Because the seed survives, "reset to
     seeded values" is a one-line operation and a removed line can come back.
   ========================================================== */

/* MD_FIELDS — the editable columns of the item file.
     k     the SKU field it writes
     n     column heading
     d     decimal places, which also sets the input's step (10^-d)
     min   floor; several fields cannot sensibly be zero
     max   optional ceiling
     hint  the header tooltip
   Order here is the column order on screen: commercials first, then
   variability, then supply terms, then physical dimensions. */
var MD_FIELDS=[
  {k:"price", n:"Sell price",   d:2,  min:0,    hint:"What the customer pays per unit."},
  {k:"cost",  n:"Unit cost",    d:2,  min:0,    hint:"What it costs you to make or buy one."},
  {k:"baseQ", n:"Demand/qtr",   d:0,  min:0,    hint:"Baseline quarterly demand before season and promotion."},
  {k:"cv",    n:"Demand CV",    d:2,  min:0, max:2, hint:"Coefficient of variation. 0.10 is steady, 0.80 is erratic."},
  {k:"lt",    n:"Lead time",    d:0,  min:1,    hint:"Days from placing an order to stock being available."},
  {k:"ltSd",  n:"Lead time SD", d:1,  min:0,    hint:"How much that lead time varies, in days."},
  {k:"moq",   n:"MOQ",          d:0,  min:1,    hint:"Smallest quantity the supplier will accept."},
  {k:"S",     n:"Order cost",   d:0,  min:1,    hint:"Cost of raising and receiving one order."},
  {k:"shelf", n:"Shelf life",   d:0,  min:0,    hint:"Days before the stock is unsellable. 0 means no limit."},
  {k:"kg",    n:"Weight kg",    d:3,  min:0,    hint:"Per unit. Drives freight cost and CO2."},
  {k:"cbm",   n:"Volume m3",    d:5,  min:0,    hint:"Per unit. Weight divided by this gives density."}
];

/* effSku(sk): the seeded item file with the user's edits laid over it.
   Returns the ORIGINAL object untouched when there are no edits, which
   matters because this runs once per SKU on every repaint. Only finite
   numeric overrides are applied here; the text fields (name, abc, xyz) are
   written straight into ST.md and picked up by the same loop because they
   fail the isFinite test and are therefore skipped — they are read directly
   from ST.md by the item file's own renderer instead.
   dailyBase is recomputed, because editing baseQ must move the daily rate. */
function effSku(sk){
  var o=ST.md[sk.code];
  if(!o) return sk;
  var out={};
  for(var k in sk) out[k]=sk[k];
  for(var j in o) if(o[j]!=null&&isFinite(o[j])) out[j]=o[j];
  out.dailyBase=out.baseQ/91;
  return out;
}

/* skuList(S): the effective portfolio for a sector — seeded lines, plus any
   the user added for THIS sector, minus any hidden, each passed through the
   edit overlay. Every consumer of the portfolio calls this rather than
   reading S.skus directly, which is what makes the item file live. */
function skuList(S){
  var extra=(ST.newSkus||[]).filter(function(s){return s.sector===S.key;});
  return S.skus.concat(extra).filter(function(s){return !ST.hidden[s.code];}).map(effSku);
}

/* newSku(S): create a blank product line. The code is generated by scanning
   for the first unused NEWnn suffix, so removing and re-adding does not
   collide. Numbers are cloned from the sector's first line at 30% volume,
   giving a plausible starting point rather than zeros, and the season is
   flat because a new line has no history to be seasonal about. */
function newSku(S){
  var n=1,code;
  do{ code=S.key.slice(0,2).toUpperCase()+"-NEW"+(n<10?"0"+n:n); n++; }
  while(skuList(S).filter(function(s){return s.code===code;}).length);
  var base=S.skus[0];
  return {code:code,name:"New product line",abc:"B",xyz:"Y",sector:S.key,
    price:base.price,cost:base.cost,baseQ:Math.round(base.baseQ*0.3),cv:0.2,lt:base.lt,ltSd:base.ltSd,
    moq:base.moq,S:base.S,shelf:base.shelf,promo:0.3,kg:base.kg,cbm:base.cbm,
    src:"Not yet defined",note:"You created this line. Every number in it is yours to set.",
    season:[1,1,1,1,1,1,1,1],dailyBase:base.baseQ*0.3/91};
}

/* ---------- the weekly planning book ----------
   WK is the horizon: thirteen weeks, one quarter. */
var WK=13;

/* planOf(code): lazily create and return this line's plan record.
   Fields are all optional and only materialise once edited:
     fc    the forecast row
     firm  committed customer orders
     rec   planned receipts — the only row that costs money
     open  the opening stock balance                                        */
function planOf(code){
  if(!ST.plan[code]) ST.plan[code]={};
  return ST.plan[code];
}

/* defaultFc(r): the starting forecast, taken from the same deterministic
   weekly series the demand charts use, so the planning book and the forecast
   chart agree with each other. */
function defaultFc(r){
  var W=weekly(r.sk,ST.g,ST.q,WK);
  return W.act.map(function(v){return Math.round(v);});
}

/* ----------------------------------------------------------
   computeMps(r) — project the plan forward and price it.

   Walks thirteen weeks. Each week:
     requirement = MAX(forecast, firm orders)
       This is "forecast consumption", how real systems behave as orders
       arrive against a forecast. ADDING them is the classic manual-sheet
       error and double-counts demand.
     available   = opening + receipts
     served      = min(available, requirement)
     closing     = available − served
     shortfall   = requirement − served

   Then costs the result three ways:
     holding   average inventory × unit cost × carrying rate, pro-rated to
               thirteen of fifty-two weeks
     ordering  one order cost per week that has a receipt in it
     lost      shortfall at 35% of sell price, the contribution forgone

   `belowSS` counts weeks spent under safety stock: a plan can achieve full
   service and still be running on luck, and this is how that is detected.
   ---------------------------------------------------------- */
function computeMps(r){
  var P=planOf(r.sk.code);
  var fc=P.fc||defaultFc(r);
  /* default firm orders: 90% of forecast for the first three weeks only,
     because commitment decays quickly beyond the near horizon */
  var firm=P.firm||fc.map(function(v,i){return i<3?Math.round(v*0.9):0;});
  var rec=P.rec||new Array(WK).fill(0);
  var open=P.open!=null?P.open:Math.round(r.SSu+r.Q/2);   /* safety stock plus half a cycle */
  var wk=[],stock=open,short=0,invSum=0,orders=0,belowSS=0;
  for(var i=0;i<WK;i++){
    var dem=Math.max(fc[i]||0,firm[i]||0);
    var opening=stock;
    var receipt=rec[i]||0;
    if(receipt>0) orders++;
    var avail=opening+receipt;
    var served=Math.min(avail,dem);
    var closing=avail-served;
    var miss=dem-served;
    short+=miss; invSum+=closing;
    if(closing<r.SSu) belowSS++;
    wk.push({i:i,fc:fc[i]||0,firm:firm[i]||0,dem:dem,open:opening,rec:receipt,
      close:closing,miss:miss,cover:dem>0?closing/(dem/7):0,below:closing<r.SSu});
    stock=closing;
  }
  var totDem=sum(wk.map(function(x){return x.dem;}));
  var avgInv=invSum/WK;
  var sk=r.sk;
  var holding=avgInv*sk.cost*ST.g.holdRate/52*WK;
  var ordering=orders*sk.S;
  var lost=short*sk.price*0.35;
  var service=totDem>0?(1-short/totDem)*100:100;
  return {wk:wk,fc:fc,firm:firm,rec:rec,open:open,short:short,avgInv:avgInv,orders:orders,
    holding:holding,ordering:ordering,lost:lost,total:holding+ordering+lost,
    service:service,totDem:totDem,belowSS:belowSS};
}

/* ----------------------------------------------------------
   autoPlan(r) — what a reorder point policy would do with the same forecast.

   Walks forward week by week. If serving this week's requirement would take
   closing stock below safety stock, order enough whole lots to close the
   gap. Lot size is the larger of the computed order quantity and the
   supplier's MOQ, rounded up, because you cannot order a fraction of a lot.

   Deliberately MYOPIC: it looks one week ahead, never thirteen. That is the
   point of the comparison on screen — a human can see the week 9 peak from
   week 6 and pre-build; a reorder point policy cannot. The counter-argument,
   made in the explainer, is that the human is optimising against a forecast
   that is treated as true, and does not scale to four thousand lines.

   Receipts are placed in the week they are NEEDED. Placing the order happens
   one lead time earlier, which the surrounding copy makes explicit rather
   than hiding.
   ---------------------------------------------------------- */
function autoPlan(r){
  var P=planOf(r.sk.code);
  var fc=P.fc||defaultFc(r);
  var firm=P.firm||fc.map(function(v,i){return i<3?Math.round(v*0.9):0;});
  var open=P.open!=null?P.open:Math.round(r.SSu+r.Q/2);
  var rec=new Array(WK).fill(0), stock=open;
  var lot=Math.max(Math.round(r.Q), Math.round(r.sk.moq));
  for(var i=0;i<WK;i++){
    var dem=Math.max(fc[i]||0,firm[i]||0);
    if(stock-dem < r.SSu){
      var need=r.SSu+dem-stock;
      var lots=Math.max(1,Math.ceil(need/Math.max(lot,1)));
      rec[i]=lots*lot;
      stock+=rec[i];
    }
    stock=Math.max(0,stock-dem);
  }
  return rec;
}

    h+='<div class="grid2">';
    h+=card("Your projected stock","week by week",'<div data-chart="mps"></div>'+
      legend([["Closing stock",M.S.acc],["Safety stock","#CE2B3C"],["Requirement","#556780"]]));
    h+=card("Choose a line to plan","each has its own book",
      '<div class="gridwrap"><table class="dg"><thead><tr><th>Product code</th><th>Class</th><th>Safety stock</th>'+
      '<th>Reorder pt</th><th>Order qty</th><th>Lead time</th><th>Planned</th></tr></thead><tbody data-live="planlist"></tbody></table></div>'+
      '<div class="hint" style="margin-top:8px">A real planner reviews every line like this every week. The A items get read carefully, the C items get scanned for exceptions.</div>');
    h+='</div>';

    h+=card("How to work a planning book",'',
      learn("The five rows, and the order to read them",
        "<ul><li><b>Forecast</b> is what you think will sell. It is a guess, and it should be the only row in the grid that is.</li>"+
        "<li><b>Firm orders</b> are what customers have actually committed to. As weeks approach, firm should replace forecast, which is why the requirement row takes the greater of the two rather than adding them. Adding them is the most common error in a manual planning sheet, and it double counts demand.</li>"+
        "<li><b>Opening stock</b> is last week's closing. Nothing to decide.</li>"+
        "<li><b>Planned receipts</b> is your actual decision, and the only row here that costs money. Every receipt is an order raised, a truck booked and a payment made.</li>"+
        "<li><b>Closing stock</b> is the consequence. Read it first when scanning somebody else's plan, because it is where the errors surface.</li></ul>"+
        "<p>The discipline is to work forward, not backward. Set the requirement, project the stock, then place receipts only where the projection breaks. Planners who place receipts first and check the projection afterwards end up with a plan that is smooth, comfortable and far too expensive.</p>"+
        minor("Receipts land in the week you type them, but you have to place the order a lead time earlier. On a "+fm(r.lt,0)+"-day lead time that is "+fm(r.lt/7,1)+" weeks. A grid that hides this is why so many planners keep a private spreadsheet with an extra column in it."))+
      learn("Why your plan can beat the formula, and why it usually should not",
        "<p>Press the suggest button and the sheet fills in what a reorder point policy would do with the same forecast. Compare the two costs.</p>"+
        "<p>You can usually beat it, because you can see the whole 13 weeks at once and the policy cannot. It reacts week by week; you can spot the peak in week 9 and start building in week 6. That foresight is exactly what a human planner is for.</p>"+
        "<p>But two cautions worth taking seriously:</p>"+
        "<ul><li>You beat it here because the forecast in this grid is treated as true. In reality the forecast is wrong, and a policy that reacts to what actually happened is more robust than a plan optimised against a guess.</li>"+
        "<li>You cannot do this for four thousand lines every week. The reason policies exist is not that they are smarter, it is that they scale. Spend your judgement on the A items and the exceptions, and let the policy run the rest.</li></ul>"));
    return h;
  },
  live:function(M){
    var r=sel(M),m=computeMps(r),o={};
    /* Score the policy alternative on the SAME forecast. The plan record is
       temporarily overwritten with the auto plan, costed, then restored —
       including the distinction between "had no receipts row" and "had an
       empty one", which is why the restore branches on saveRec. */
    var auto=autoPlan(r);
    var saveRec=planOf(r.sk.code).rec;
    planOf(r.sk.code).rec=auto;
    var am=computeMps(r);
    if(saveRec) planOf(r.sk.code).rec=saveRec; else delete planOf(r.sk.code).rec;
    var diff=m.total-am.total;
    /* four standard metric cards, then two bespoke ones for figures that
       have no DIR entry: orders raised, and total plan cost versus policy */
    o.planscore=[
      mx("fill",m.service,pct(m.service,1),m.service>=98?"g":m.service>=93?"w":"b"),
      mx("bsInv",0,money(m.avgInv*r.sk.cost),"w"),
      mx("holding",0,money(m.holding),m.holding<am.holding?"g":"w"),
      mx("penalty",0,money(m.lost),m.short===0?"g":"b"),
      '<div class="mx"><div class="t"><span>Orders raised</span>'+dirTag("penalty")+'</div>'+
        '<div class="v">'+m.orders+'</div><div class="d">Each one costs '+money(r.sk.S)+
        ' to raise and receive, so '+money(m.ordering)+' in total. Fewer, larger orders cost less to place and more to hold.</div></div>',
      '<div class="mx"><div class="t"><span>Total plan cost</span>'+dirTag("penalty")+'</div>'+
        '<div class="v '+(m.total<=am.total?"g":"b")+'">'+money(m.total)+'</div>'+
        '<div class="d">Holding plus ordering plus the cost of what you failed to supply. The reorder point policy would have spent <b>'+money(am.total)+
        '</b> on the same demand.</div></div>'
    ].join("");
    /* five verdicts, in descending severity. Note the last two: a plan can
       reach full service and STILL be criticised, either for living below
       safety stock (luck, not planning) or for holding four times it
       (safe and expensive). */
    var touched=sum(m.rec)>0;
    o.plannote = !touched
      ? nt("warn","Nothing planned yet",
          "The receipts row is empty, so this sheet is showing what happens if you order nothing for 13 weeks: stock runs down and "+
          qty(m.short)+" units of demand go unmet. Type quantities into the <b>planned receipts</b> row to fix it, "+
          "or press the suggest button to see what a reorder point policy would do and then improve on it.")
      : m.short>0
      ? nt("bad","Your plan runs out in "+m.wk.filter(function(w){return w.miss>0;}).length+" week"+(m.wk.filter(function(w){return w.miss>0;}).length>1?"s":""),
          "You miss "+qty(m.short)+" units of demand, worth "+money(m.short*r.sk.price)+" of sales. Look for the first red closing-stock cell and work backwards: "+
          "the receipt that would have prevented it needed to be placed "+fm(r.lt/7,1)+" weeks before that.")
      : m.belowSS>4
      ? nt("warn","Thin for "+m.belowSS+" of 13 weeks",
          "You never run out, but you spend "+m.belowSS+" weeks below safety stock of "+qty(r.SSu)+
          ". That is not a plan, it is a run of luck. Safety stock exists to absorb the weeks where demand runs hot, and yours is being consumed by the base plan.")
      : m.avgInv>r.SSu*4
      ? nt("warn","Safe but expensive",
          "Full service with no weeks below safety stock, at an average of "+qty(m.avgInv)+" units on hand, which is "+
          fm(m.avgInv/Math.max(r.SSu,1),1)+" times your safety stock. Try removing one receipt and see whether service actually suffers.")
      : nt("good","This is a good plan",
          pct(m.service,1)+" service, "+qty(m.avgInv)+" average stock, "+m.orders+" orders, "+money(m.total)+
          " total cost. Now change the forecast and run it again, because the real test of a plan is what it does when the demand is not what you assumed.");
    o.planlist=M.rows.map(function(rr){
      var p=ST.plan[rr.sk.code];
      var done=p&&(p.rec&&sum(p.rec)>0);      /* has this line been planned? */
      return '<tr data-selsku="'+rr.sk.code+'" style="cursor:pointer" class="'+(rr.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+rr.sk.code+'<span class="nm">'+esc(rr.sk.name)+'</span></td>'+
        '<td><span class="chip '+rr.sk.abc.toLowerCase()+'">'+rr.sk.abc+'</span> <span class="chip '+rr.sk.xyz.toLowerCase()+'">'+rr.sk.xyz+'</span></td>'+
        '<td>'+qty(rr.SSu)+'</td><td>'+qty(rr.rop)+'</td><td>'+qty(rr.Q)+'</td><td>'+fm(rr.lt,0)+'d</td>'+
        '<td class="'+(done?"g":"")+'">'+(done?"yours":"not set")+'</td></tr>';
    }).join("");
    return o;
  },
  /* cells() carries the five computed rows plus the five column totals.
     Using cells rather than live is essential here: the typed inputs sit in
     the same table, and rewriting the whole <tbody> would destroy focus
     mid-keystroke. */
  cells:function(M){
    var r=sel(M),m=computeMps(r),c={};
    m.wk.forEach(function(w,i){
      c["p_dem:"+i]=qty(w.dem);
      c["p_open:"+i]=qty(w.open);
      /* three states: red at zero, amber below safety stock, green above */
      c["p_close:"+i]='<span class="'+(w.close<=0?"b":w.below?"w":"g")+'">'+qty(w.close)+'</span>';
      c["p_cov:"+i]=w.dem>0?fm(w.cover,0)+"d":"-";
      c["p_miss:"+i]=w.miss>0?'<span class="b">'+qty(w.miss)+'</span>':"-";
    });
    c["p_fct"]=qty(sum(m.fc)); c["p_firmt"]=qty(sum(m.firm));
    c["p_demt"]=qty(m.totDem); c["p_rect"]=qty(sum(m.rec));
    c["p_misst"]=m.short>0?'<span class="b">'+qty(m.short)+'</span>':"0";
    return c;
  },
  charts:function(M){
    var r=sel(M),m=computeMps(r);
    /* closing stock as a filled area, requirement dashed over it, safety
       stock as the reference band the area should stay above */
    return {mps:svgLine({w:520,h:210,x:m.wk.map(function(w,i){return "w"+(i+1);}),
      yFmt:function(v){return qty(v);},
      series:[{name:"Closing",color:M.S.acc,data:m.wk.map(function(w){return w.close;}),fillArea:true},
              {name:"Requirement",color:"#556780",data:m.wk.map(function(w){return w.dem;}),dash:true,dotR:2}],
      bands:[{y:r.SSu,label:"safety stock",color:"#CE2B3C"}]})};
  }
};

/* ---------- scenario text ----------
   A scenario is everything the user authored: the sector, the quarter, the
   company name, all controls, all item file edits, all per-SKU overrides,
   the planning book, and the added/removed lines. Notably it does NOT store
   ST.hist or ST.log, because those are a record of play rather than a
   configuration, and restoring them would make the ledger dishonest.

   `v:1` is a format version, so a future change can migrate rather than
   silently mis-read an old string. */
function scenarioText(){
  return JSON.stringify({v:1,sector:ST.sec,q:ST.q,co:ST.coName,g:ST.g,md:ST.md,
    sku:ST.sku,plan:ST.plan,hidden:ST.hidden,newSkus:ST.newSkus});
}

/* loadScenario(txt): parse and apply. Throws on anything that is not a
   recognisable scenario, which the caller catches and turns into a message
   rather than a broken screen. Every field falls back to the current value
   or an empty object, so a partial scenario still loads. */
function loadScenario(txt){
  var o=JSON.parse(txt);
  if(!o||!o.sector||!SECTORS[o.sector]) throw new Error("That is not a scenario from this app.");
  ST.sec=o.sector; ST.q=o.q||1; ST.coName=o.co||null;
  ST.g=o.g||ST.g; ST.md=o.md||{}; ST.sku=o.sku||{}; ST.plan=o.plan||{};
  ST.hidden=o.hidden||{}; ST.newSkus=o.newSkus||[];
  var S=SECTORS[ST.sec];
  ST.selSku=skuList(S)[0].code;      /* the previous selection may be gone */
  /* re-apply the sector accent, since the loaded scenario may be a
     different industry from the one currently on screen */
  ["acc","accSoft","accInk","accLum","onAcc"].forEach(function(k){
    document.documentElement.style.setProperty("--"+k,S[k]);});
}
/* ==========================================================
   10 · THE PRIMER
   ----------------------------------------------------------
   A complete standing explanation on the landing page, before
   you commit to an industry.

   STRUCTURE
     LEARN_SECTIONS  the table of contents: [anchorId, title]. The sticky
                     jump bar and the chapter order both derive from it, so
                     adding a chapter means adding one entry and one sec()
                     call, nothing else.
     sec(id,...)     wraps one chapter: a card, plus the automatic
                     bibliography block from section 13 keyed on the same id.
     learnPage()     assembles the whole thing into one string.

   EDITORIAL RULE
     Chapters are ordered so each one only uses ideas already established.
     Uncertainty comes before safety stock; safety stock before service level
     versus fill rate; the newsvendor after both, because it needs the idea
     of a distribution and the idea of asymmetric cost.

   The prose below is content rather than logic, so it is commented at
   chapter level only — annotating paragraphs would be noise.
   ========================================================== */

/* dgTradeoff(): the four-way tension diagram.
   Four nodes on a circle at 90° intervals, every pair joined by a dashed
   line to show that all six relationships are live. "pick two" sits at the
   centre, which is the entire argument of the app in two words. */
function dgTradeoff(){
  var w=540,h=318,cx=270,cy=126,R=84,s=svgOpen(w,h)+DEFS;
  var pts=[["Service","#00A67D","deliver on time, in full","95%"],
           ["Cost","#CE2B3C","freight, holding, overtime","€"],
           ["Cash","#4B63E8","stock is cash you cannot spend","days"],
           ["Carbon","#0E9BB5","tonne-kilometres you move","kg"]];
  var P=pts.map(function(_,i){var a=-Math.PI/2+i*Math.PI/2;return [cx+Math.cos(a)*R,cy+Math.sin(a)*R];});
  s+='<path d="M'+P.map(function(p){return p[0].toFixed(0)+","+p[1].toFixed(0);}).join(" L")+' Z" '+
     'fill="var(--panel2)" stroke="var(--rule)" stroke-width="1.5"/>';
  /* all six pairwise connections, not just the four sides */
  for(var i=0;i<4;i++)for(var j=i+1;j<4;j++)
    s+='<line x1="'+P[i][0].toFixed(0)+'" y1="'+P[i][1].toFixed(0)+'" x2="'+P[j][0].toFixed(0)+
       '" y2="'+P[j][1].toFixed(0)+'" stroke="var(--rule)" stroke-dasharray="4 4"/>';
  pts.forEach(function(p,i){
    var x=P[i][0],y=P[i][1];
    s+='<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="27" fill="#fff" stroke="'+p[1]+'" stroke-width="3"/>';
    s+=tx(x,y+4,p[3],"middle","",13,p[1]);
    /* label placement rotates with position: right node labels to the right,
       left node to the left, top and bottom centred */
    var lx=i===1?x+36:i===3?x-36:x, ly=i===0?y-42:i===2?y+46:y-9;
    var an=i===1?"start":i===3?"end":"middle";
    s+=tx(lx,ly,p[0],an,"",12.5,"var(--ink)");
    s+=tx(lx,ly+13,p[2],an,"lbl",10);
  });
  s+=tx(cx,cy+4,"pick two","middle","",13,"var(--sub)");
  s+=box(40,278,460,28,"var(--warnBg)","var(--warn)",8);
  s+=tx(270,296,"Pull any corner toward you and at least one other moves away. That tension is the entire job.","middle","",11.5,"var(--ink)");
  return s+'</svg>';
}

/* sec(): one chapter. The id does double duty as the scroll anchor and as
   the bibliography key, so refBlock() appends the right sources without the
   caller having to name them. */
function sec(id,title,eyebrow,body){
  return '<section id="ls-'+id+'">'+card(title,eyebrow,body+refBlock(id))+'</section>';
}
/* twoViz(): two figures with their captions, side by side in the flow.
   Retained as a helper for chapters that need a paired comparison. */
function twoViz(a,ca,b,cb){
  return viz(a,ca)+viz(b,cb);
}

/* learnPage(): assemble the entire primer as one string.
   Called once by renderLaunch() when launchTab === "learn". */
function learnPage(){
  var h='<div class="learnwrap"><div class="lwrap">';

  /* sticky jump bar, derived from LEARN_SECTIONS */
  h+='<nav class="lnav">'+LEARN_SECTIONS.map(function(s){
    return '<a href="#ls-'+s[0]+'">'+esc(s[1])+'</a>';}).join("")+'</nav>';

  /* ---- CH 1: what a supply chain is ----
     Establishes the two-arrow model (goods forward, information back) that
     every later chapter refers to. */
  h+=sec("what","What a supply chain actually is","start here",
    '<p class="lede" style="margin-top:-2px">A supply chain is every step between a raw material coming out of the ground and a finished product reaching somebody who wants it, '+
    'plus every decision about how much of it to have, where to put it, and when to move it.</p>'+
    '<p>The physical part is easy to picture. The part that is actually difficult, and the part this simulator is about, is that '+
    '<b>every one of those decisions has to be made before you know whether it was right</b>. You order silicon forty weeks before the phone sells. '+
    'You commit factory capacity before the season starts. You choose ocean over air before you know whether demand will spike.</p>'+
    viz(scChain(),"<b>Two arrows, not one.</b> Goods move left to right and get faster as they go: weeks at the mine, minutes at the till. Information moves right to left, and gets noisier at every step. Everything in this field happens in the gap between those two arrows.")+
    '<p>So the discipline is not really about logistics. It is about <b>making decisions under uncertainty and then paying for the ones that were wrong</b>, '+
    'in inventory, in expediting, or in customers you disappointed. Everything below is a tool for making that payment smaller.</p>'+
    '<div class="grid3" style="margin-top:14px">'+
    [["How much will we sell?","Demand planning. Always wrong. The job is to be wrong by a small, known, unbiased amount."],
     ["How much should we hold?","Inventory policy. Stock is the premium you pay for not knowing the answer to question one."],
     ["Who makes it, and when?","Sourcing and production. Capacity behaves in ways that surprise people."],
     ["How does it get there?","Logistics and warehousing. Speed, cost and carbon move together."],
     ["What did it all cost?","Finance. This work stays invisible until somebody expresses it in cash."]
    ].map(function(x){return '<div style="border:1px solid var(--rule);border-radius:12px;padding:12px 13px;background:var(--panel)">'+
      '<b style="font-size:.88rem">'+esc(x[0])+'</b><div class="hint" style="margin-top:3px">'+esc(x[1])+'</div></div>';}).join("")+
    '</div>');

  /* ---- CH 2: the tension ---- names the four corners the app scores. */
  h+=sec("tension","The four-way tension","the reason this is hard",
    viz(dgTradeoff(),"<b>Four corners, and you can reliably hold two.</b> Raise the service target and inventory rises with it. Cut inventory and service follows it down. Switch to air freight and service improves while cost and carbon jump.")+
    '<p>Almost every supply chain argument inside a company is an argument about which corner matters most this quarter, held between people who each own one corner. '+
    'Sales owns service. Finance owns cash. Operations owns cost. Sustainability owns carbon. None of them is wrong, which is what makes the argument permanent.</p>'+
    nt("good","The exceptions, and why they are worth a career",
      "A small number of things improve two corners at once. <b>A better forecast</b> gives less inventory at the same service. "+
      "<b>A shorter or more reliable lead time</b> does the same. <b>Fuller vehicles</b> cut cost and carbon together. <b>A warehouse re-slot</b> cuts labour and speeds despatch. "+
      "When you find one of these, it is worth far more than another round of arguing about the service target."));

  /* ---- CH 3: why inventory exists ---- the three buckets, one optional. */
  h+=sec("stock","Why inventory exists at all","three buckets, one of them optional",
    viz(scBuckets(),"<b>Everything you own falls into one of three buckets.</b> Cycle stock exists because you order in batches. Pipeline stock exists because goods take time to arrive. Only safety stock is a genuine choice, and it is the one everybody argues about.")+
    '<p>Inventory is not an asset in any way that matters operationally. It is <b>cash converted into a form that decays, occupies space and needs insuring</b>. '+
    'It exists for exactly one reason: uncertainty. If you knew demand precisely and supply arrived exactly on time, you would need none of it.</p>'+
    '<p>That framing is useful because it tells you where to attack. If cycle stock is the problem, the answer is cheaper ordering or faster changeovers, not a policy argument. '+
    'If pipeline stock is the problem, the answer is a shorter lane or different Incoterms. Only if safety stock is the problem is the answer about service levels, '+
    'and even then the real lever is usually variability rather than the target.</p>'+
    viz(dgSafety(),"<b>The saw-tooth.</b> Stock falls as customers buy. At the reorder point you place an order, and it arrives one lead time later. The red band does nothing at all in a normal cycle: it exists only for the cycles where demand runs hot or the delivery runs late.")+
    minor("Ask of any pile of stock: which bucket is this, and what would have to change for it not to exist? A surprising amount of inventory turns out to be cycle stock created by an ordering process nobody has looked at since the system was installed."));

  /* ---- CH 4: uncertainty ---- the only statistics chapter. Everything
     downstream depends on the reader accepting demand as a distribution. */
  h+=sec("uncertainty","Uncertainty, and the bell curve","the one piece of statistics you need",
    '<p class="lede" style="margin-top:-2px">Demand over a lead time is not a number. It is a distribution: a most likely value with a spread either side. '+
    'Everything about inventory follows from taking that seriously.</p>'+
    viz(sciNormal(),"<b>Computed, not illustrative.</b> The curve is the standard normal density. The green area is the 95% of replenishment cycles where you have enough. The red tail is the 5% where you do not. The orange bar between the mean and the reorder point is exactly what safety stock is.")+
    '<p>Two quantities describe that curve. The <b>mean</b> is what you expect to sell over the lead time. The <b>standard deviation</b>, written sigma, is how far reality typically strays from it. '+
    'Roughly two thirds of outcomes land within one sigma of the mean and about 95% within two.</p>'+
    fx("Safety stock = Z x sigma","Z is how many standard deviations of buffer you choose to carry. That single choice is your service level.")+
    '<p>The word to be careful with is <b>average</b>. If you hold exactly the average demand over the lead time, you will run out in half of all cycles, because half of all outcomes are above the average. '+
    'That is a 50% service level, and it is what happens by default when nobody has thought about the distribution.</p>'+
    nt("warn","The assumption, stated honestly",
      "Real demand is rarely perfectly normal. It is often skewed, sometimes lumpy, and for spare parts it is mostly zeroes with occasional spikes. "+
      "The normal assumption is a working approximation that is good enough for fast-moving items and wrong for intermittent ones, which is why Croston\'s method exists. "+
      "Knowing where the assumption breaks is more useful than knowing the formula."));

  /* ---- CH 5: safety stock derived ---- the longest chapter, and the one
     that carries the app's central quantitative claim: lead-time variability
     usually dominates, and almost every model drops it. */
  h+=sec("safety","Safety stock, derived","where the square roots come from",
    '<p class="lede" style="margin-top:-2px">Almost everyone can quote the safety stock formula. Far fewer can say why it has two terms and why both sit under a square root. '+
    'The answer explains most of what is counter-intuitive about inventory.</p>'+
    fx("SS = Z x sqrt( LT x sigmaD^2  +  d^2 x sigmaLT^2 )","LT is lead time, sigmaD is the standard deviation of demand per day, d is average daily demand, sigmaLT is the standard deviation of lead time.")+
    '<h4 style="margin:16px 0 4px">Why a square root</h4>'+
    '<p>Variances add; standard deviations do not. If each day of demand is independent with variance sigmaD squared, then over LT days the total variance is LT times sigmaD squared, '+
    'and the standard deviation is the square root of that. So doubling the lead time does not double the buffer. It multiplies it by the square root of two, about 1.41.</p>'+
    '<p>Run that backwards and you get one of the most useful facts in the field: <b>halving your lead time cuts safety stock by about 29%, not 50%</b>. '+
    'A lead time reduction project that was sold on halving the buffer will disappoint precisely this much.</p>'+
    '<h4 style="margin:16px 0 4px">Why two terms</h4>'+
    '<p>The first term is uncertainty about <i>how much</i> customers will want. The second is uncertainty about <i>when</i> the goods will turn up. '+
    'They are separate sources of risk and they combine as variances, which is why they add inside the square root.</p>'+
    viz(sciTwoTerm(),"<b>Both terms plotted against lead time.</b> The blue dashed line is demand variability, and it grows with the square root of lead time. The red dashed line is lead time variability, and it is flat: it does not shrink at all as the lead time falls. The black line is the total.")+
    nt("bad","The mistake this diagram exists to prevent",
      "Most textbook examples and a great many real systems drop the second term entirely. When they do, the model promises a service level it cannot deliver, and everybody blames the planner. "+
      "Notice on the chart that for short lead times the red line dominates completely. If your supplier delivers anywhere between 20 and 60 days, <b>reducing that variance is worth more than reducing the average</b>, "+
      "and it usually costs a conversation rather than a contract.")+
    viz(sciServiceZ(),"<b>Z against service level, computed from the inverse normal.</b> The curve is nearly flat up to about 90% and then turns sharply upward. The shaded region is the last 4.9 percentage points, which nearly double the buffer on their own.")+
    '<p>This shape is why blanket service targets are expensive. Going from 95% to 99.9% costs you roughly 88% more safety stock for less than five points of service. '+
    'On an A item with a customer who genuinely notices, that may be worth it. On a C item, it almost never is, and the money spent there is money not available for the item that mattered.</p>'+
    /* the worked example is the payoff of the whole chapter: with realistic
       numbers the lead-time term is 26 times the demand term */
    '<div class="fx"><div class="f">A worked example</div><div class="n">'+
    'Daily demand 120 units, sigma 26. Lead time 30 days, sigma 6 days. Target 95%, so Z = 1.64.<br>'+
    'First term: 30 x 26^2 = 20,280.  Second term: 120^2 x 6^2 = 518,400.<br>'+
    'Sum 538,680, square root 734. Safety stock = 1.64 x 734 = <b>1,204 units</b>, about 10 days of cover.<br>'+
    'Note that the second term is 26 times the first. <b>Nearly all of this buffer is paying for an unreliable supplier, not for variable customers.</b>'+
    '</div></div>');

  /* ---- CH 6: service level vs fill rate ---- */
  h+=sec("service","Service level is not fill rate","two numbers people use interchangeably",
    '<p class="lede" style="margin-top:-2px">Cycle service level is the probability of not running out during a replenishment cycle. '+
    'Fill rate is the fraction of demand you actually supplied from stock. They are different numbers, and the gap between them is usually three to five points.</p>'+
    viz(dgCSL(),"<b>The same week, counted two ways.</b> On the left, one cycle in twenty had a shortage: a 95% service level. On the right, the shortage that happened was small, so 99.3% of what customers asked for still shipped.")+
    '<p>The reason they differ is that service level counts <i>events</i> and fill rate counts <i>units</i>. Most stockouts are shallow and brief: you run out on the last day before a delivery, '+
    'and you miss a handful of units. Counting that as a total failure overstates the damage considerably.</p>'+
    fx("Fill rate = 1 - ( sigmaL x G(k) ) / Q","G(k) is the unit normal loss function, the expected shortfall in standard deviations. It converts how often into how much.")+
    viz(sciFill(),"<b>Fill rate plotted against cycle service level.</b> The grey dashed line is where they would be equal. The orange curve is what actually happens: fill rate sits well above service level throughout, and the two only converge at the very top.")+
    nt("good","The practical use of this",
      "When somebody says the target is 95%, ask which number they mean. If they mean fill rate, a 95% <i>service level</i> policy already delivers about 99%, and you may be carrying "+
      "considerably more stock than the target requires. That one question has funded a lot of inventory reduction projects."));

  /* ---- CH 7: order quantity ---- EOQ, derived, and then deliberately
     deflated: the flatness matters more than the formula. */
  h+=sec("howmuch","How much to order at a time","and why precision here is wasted",
    '<p class="lede" style="margin-top:-2px">Order in large batches and you carry a lot of stock but place few orders. Order in small batches and the reverse. '+
    'The economic order quantity is where the two costs are equal, which is where their sum is smallest.</p>'+
    fx("EOQ = sqrt( 2 x D x S / H )","D is annual demand, S is the cost of placing and receiving one order, H is the cost of holding one unit for a year.")+
    '<h4 style="margin:16px 0 4px">Where it comes from</h4>'+
    '<p>Annual ordering cost is D/Q times S: more orders when Q is small. Annual holding cost is Q/2 times H, because average cycle stock is half the order quantity. '+
    'Total cost is the sum. Differentiate with respect to Q, set to zero, and you get the formula above. The minimum happens to be exactly where the two costs cross, which is a pleasant coincidence and a useful sanity check.</p>'+
    viz(sciEOQ(),"<b>Both cost curves and their sum, computed.</b> Ordering cost falls as a hyperbola, holding cost rises as a straight line, and the total is U-shaped. The green band is 30% either side of the optimum.")+
    nt("good","The most useful thing about EOQ is how flat it is",
      "Look at the green band. Being 30% away from the optimal quantity costs about 2% in total cost. This has two consequences that matter far more than the formula itself. "+
      "<b>First, stop agonising over precision.</b> Round to a sensible pallet or case quantity and move on. "+
      "<b>Second, fight hard about S.</b> Halving the cost of placing an order moves EOQ down by 29% and makes smaller, fresher, more responsive batches genuinely economic. "+
      "That is what an automated purchase order or a changeover reduction project actually buys you.")+
    '<p class="hint">EOQ assumes constant demand, instant replenishment, no quantity discounts and no capacity limit. All four are false in your business. '+
    'Use it as a check on the order of magnitude, never as an instruction.</p>');

  /* ---- CH 8: newsvendor ---- the one-shot decision, and the reason the
     answer is a percentile rather than an average. */
  h+=sec("newsvendor","The newsvendor problem","for anything you only get one shot at",
    '<p class="lede" style="margin-top:-2px">Some decisions cannot be corrected. The Christmas order, the flu vaccine batch, the newspaper print run, the fashion season. '+
    'You commit once, demand arrives, and whatever you got wrong you keep.</p>'+
    '<p>The instinct is to order the expected demand. That is almost always wrong, and the reason is that the two ways of being wrong do not cost the same.</p>'+
    fx("Critical ratio = Cu / ( Cu + Co )","Cu is the cost of being short by one unit, usually the lost margin. Co is the cost of having one unit too many, usually the write-down.")+
    viz(sciNewsvendor(),"<b>The optimal order is a percentile, not an average.</b> With €14 of lost margin against €6 of write-down, the critical ratio is 0.70, so you order up to the 70th percentile of demand. The orange line sits noticeably to the right of the peak.")+
    '<p>Read the formula as a question: <b>what fraction of the pain comes from being short?</b> If running out costs three times as much as overstocking, you should be covered '+
    'three quarters of the time, which means deliberately ordering more than you expect to sell and deliberately accepting leftovers most years.</p>'+
    '<p>Turn the numbers around and it works the other way. For fresh food with a thin margin and a total write-off, Co can exceed Cu, the ratio drops below a half, '+
    'and the right answer is to order <b>less</b> than the average and accept that you will sell out. Bakeries have known this for centuries without the algebra.</p>'+
    minor("The hardest part of applying this is not the maths, it is getting an honest Cu. Finance will give you the lost gross margin. The real figure usually includes the customer who bought elsewhere and did not come back, and nobody has that number, which is exactly why it gets set to zero."));

  /* ---- CH 9: Pareto ---- ABC, XYZ, and the nine boxes. */
  h+=sec("pareto","Not everything deserves the same attention","ABC, XYZ, and the nine boxes",
    viz(sciPareto(),"<b>A Pareto curve, computed.</b> Each bar is one product line ranked by value; the black line is cumulative. About a fifth of the lines carry 80% of the value, and the long tail on the right carries almost nothing.")+
    '<p>This shape appears in nearly every portfolio anyone has ever measured. It matters because management attention is the scarcest resource in a planning team, '+
    'and spreading it evenly across the range guarantees that it is misallocated.</p>'+
    '<p>ABC ranks by value. XYZ ranks by <i>predictability</i>: X is steady and forecastable, Y is variable but patterned, Z is erratic. Crossing them gives nine boxes.</p>'+
    viz(dgABCXYZ(),"<b>Value across, predictability down.</b> Each box calls for genuinely different behaviour, and the corners are the interesting ones.")+
    '<p>The two corners are worth memorising. <b>AX</b> is high value and predictable: tight control, low cover, automated replenishment with exception alerts. '+
    '<b>CZ</b> is low value and erratic: buffer it generously and stop thinking about it, because the stock is genuinely cheaper than the meetings about the stock.</p>'+
    '<p>The hard box is <b>AZ</b>: expensive and unpredictable. Buffer is the wrong tool because it is expensive precisely where you can least afford it. '+
    'The right tools are postponement, late configuration, a supplier who can respond quickly, or an honest conversation with the customer about lead time.</p>'+
    minor("Re-run the classification quarterly, not annually. Items migrate. A C item that has just been designed into a major customer\'s product is an A item nobody has noticed yet, and the first sign is usually a stockout."));

  /* ---- CH 10: forecasting ---- width versus shift: two failures, two cures. */
  h+=sec("forecast","Forecasting: width and shift","two different problems, two different cures",
    '<p class="lede" style="margin-top:-2px">Every forecast is wrong. What matters is the shape of the wrongness, and there are two independent ways to be wrong.</p>'+
    viz(sciBias(),"<b>Two error distributions with identical spread.</b> On the left the errors are centred on zero and cancel out over time. On the right they are shifted: every period is a little short, and the shortfalls accumulate.")+
    '<p><b>Width</b> is accuracy, usually reported as MAPE or its weighted cousin WMAPE. It tells you how far you typically miss. Buffer handles width: that is precisely what safety stock is for.</p>'+
    '<p><b>Shift</b> is bias, the average signed error. Buffer does not handle bias, it only hides it more expensively. '+
    'A persistent positive bias builds inventory you will write off later; a persistent negative one produces chronic firefighting that no amount of stock will settle.</p>'+
    fx("Tracking signal = running sum of errors / mean absolute deviation","Beyond about plus or minus four, the model has lost touch with reality. It is the smoke alarm, not the fire extinguisher.")+
    '<p>The practical order of work is: check bias first, because it is a defect and it is fixable. Then check width, because that is what you buffer against. '+
    'Then check the tracking signal, because a model that used to work and has stopped is a different problem from one that never worked.</p>'+
    nt("warn","Read the incentive before you read the number",
      "Sales teams under-forecast when they are measured on hitting target and over-forecast when they are measured on securing supply. "+
      "Neither is dishonesty; both are rational responses to how somebody is paid. A forecast bias that appears every single quarter is usually an incentive problem wearing a statistics costume."));

  /* ---- CH 11: bullwhip ---- with the lead-time result, which is the
     actionable part and the one usually left out. */
  h+=sec("whip","The bullwhip effect","how small ripples become tidal waves",
    viz(scAmplify(),"<b>Nobody lied.</b> Everyone added a little for safety, and by the fourth step the order is more than double the demand that started it. Real demand never moved at all.")+
    '<p>Four well-run companies, each behaving rationally, will still produce wild oscillation upstream. The causes are structural rather than moral:</p>'+
    '<ul><li><b>Demand signal processing.</b> Each tier forecasts off the orders it receives rather than off real end demand, so noise compounds at every step.</li>'+
    '<li><b>Order batching.</b> Economics push everyone to order in lumps, and lumps look like demand spikes to the tier above.</li>'+
    '<li><b>Price fluctuation.</b> Promotions and forward buying move volume in time without changing consumption.</li>'+
    '<li><b>Rationing and gaming.</b> When supply is allocated in proportion to orders, inflating your order is the rational move, and everybody knows it.</li></ul>'+
    viz(sciBullwhip(),"<b>Amplification compounds, and lead time is the multiplier.</b> Three lead times plotted across four echelons. At one week the chain absorbs the noise; at four weeks the variance at tier three is several times the variance at the shop.")+
    '<p>The lead time result is the actionable one. Amplification is driven by how far ahead each tier has to forecast, so <b>shortening lead times damps the whole chain</b>, '+
    'not just your own part of it. This is the quiet argument for local supply that has nothing to do with politics.</p>'+
    nt("good","What actually works",
      "Share point-of-sale data upstream so everyone plans against the same signal. Shorten and stabilise lead times. Use everyday pricing instead of promotional spikes. "+
      "Allocate on historic sell-through rather than current order size, which removes the incentive to inflate. And let one party manage replenishment for both, "+
      "so there is one demand signal instead of two order streams."));

  /* ---- CH 12: queueing ---- and the expedite death spiral. */
  h+=sec("queue","Why a busy factory is a slow factory","the most counter-intuitive result here",
    '<p class="lede" style="margin-top:-2px">Loading a plant harder does not make it produce faster. Past a certain point it makes everything in it slower, and the relationship is not gentle.</p>'+
    viz(sciQueue(),"<b>Relative lead time against utilisation, at three levels of process variability.</b> All three curves are flat and comfortable up to about 75%, then bend upward, then go nearly vertical. The shaded region is where most plants are asked to operate.")+
    '<p>The mechanism is queueing. A machine at 95% utilisation has almost no idle time to absorb a disturbance, so every breakdown, every late delivery and every rush order '+
    'pushes work into a queue that never gets a chance to drain. The curve is a hyperbola: the term is utilisation divided by one minus utilisation, which goes to infinity as utilisation approaches one.</p>'+
    '<p>Notice that variability shifts the whole curve. The green line is a steady, well-controlled process; the red is a variable one. '+
    '<b>Reducing variability buys you the ability to run at higher utilisation for the same lead time</b>, which is the entire economic argument for process control.</p>'+
    fx("WIP = throughput x cycle time","Little\'s Law. Arithmetic, not theory. It holds in a factory, a warehouse, a hospital and an inbox.")+
    viz(dgLittle(),"<b>The same machine in both rows.</b> Three jobs in the system gives a six day lead time; eleven jobs gives twenty two. Nothing got slower, the work just spends its life queueing.")+
    nt("bad","The expedite death spiral",
      "When a plant is late on everything, the instinct is to release jobs earlier. It is precisely wrong. Releasing earlier raises work in progress, which raises cycle time, which makes you later, "+
      "so you release earlier still. A great deal of expedite culture is this loop running quietly for years, and the way out is counter-intuitive enough that it usually needs the arithmetic above to justify it."));

  /* ---- CH 13: push, pull and the decoupling point ---- */
  h+=sec("wall","Push, pull, and the wall between them","one of the few strategic choices",
    viz(scPushPull(),"<b>Everything left of the wall is made on a guess. Everything right of it is made against a real order.</b> Moving the wall is a strategic decision with consequences in both directions.")+
    '<p>The wall is properly called the decoupling point or the order penetration point. Its position decides two things simultaneously: '+
    'how long a customer waits, and how much inventory you carry in a form that might turn out to be wrong.</p>'+
    viz(dgDecoupling(),"<b>The same idea on a production chain.</b> The dashed line is where a real customer order first touches the product.")+
    '<p>Move it right, toward the customer, and delivery gets faster but you hold more finished goods, each one committed to a specific variant. '+
    'Move it left, toward raw material, and you hold less and hold it in a more flexible form, but the customer waits.</p>'+
    '<p>The clever move is to redesign the product so the wall can sit further left without the customer noticing. That is what <b>postponement</b> means: '+
    'paint mixed at the counter, laptops configured after the order, generic packaging labelled late. You turn many uncertain forecasts into one much more accurate aggregate forecast.</p>'+
    minor("When somebody asks you to cut both inventory and lead time at once, they are asking you to move the wall in two directions. The honest answer is that you cannot, unless you change the product or the process so that the wall can move without the trade-off. That reply, delivered calmly with this diagram, is a good day\'s work."));

  /* ---- CH 14: logistics economics ---- the total-cost mode comparison
     almost nobody actually performs. */
  h+=sec("move","The economics of moving things","where the surprises are",
    '<p class="lede" style="margin-top:-2px">Transport looks like a price comparison and is not. Every mode buys you one thing and charges you in another.</p>'+
    viz(sciMode(),"<b>Four modes, total cost including the inventory the transit time creates.</b> The solid bar is freight paid. The pale bar above it is the pipeline and safety stock that the transit time forces you to carry. For a light, valuable item the ranking is not what the freight rate alone suggests.")+
    '<p>This is the calculation almost nobody does. Ocean freight is cheap per kilo and expensive in pipeline stock, safety stock and obsolescence risk. '+
    'Air is the reverse. The break-even depends almost entirely on <b>value density</b>, the value per kilo. Above roughly a thousand euro per kilo, air is often genuinely cheaper in total.</p>'+
    fx("Chargeable weight = the greater of actual kg and volume / 5000","Air and courier freight bill on whichever is larger. Redesigning a carton to fall below the divisor is regularly the highest-return exercise available in logistics.")+
    viz(dgCube(),"<b>Both trailers are full, of different things.</b> The left one ran out of space with weight to spare, so its answer is packaging and pallet patterns. The right one hit the weight limit half empty, so packaging changes are pointless and the answer is consolidation.")+
    viz(dgFTL(),"<b>Two pricing models crossing.</b> Less-than-truckload charges per pallet, so its line rises. Full truckload charges for the trailer whether you fill it or not, so its line is flat. Below the crossover you are sharing; above it you are paying per-pallet rates for a full load.")+
    viz(dgIncoterm(),"<b>The circle is where risk passes to the buyer. The bar is how far the seller keeps paying.</b> Under FCA and DAP they line up, which is what everyone assumes always happens. Under CIF they do not.")+
    nt("warn","The most expensive misunderstanding in trade",
      "Cost and risk do not always transfer at the same point. Under CIF, risk passes when the goods are loaded at origin while the seller keeps paying freight to the destination port. "+
      "Cargo lost mid-ocean is the buyer\'s loss on a shipment the seller is still funding. Check who is insured for that gap, in writing, before it matters."));

  /* ---- CH 15: the warehouse ---- */
  h+=sec("floor","Inside the building","the cheapest wins in the whole chain",
    viz(scFloor(),"<b>A warehouse floor as somebody would sketch it on site.</b> The red line is one picker\'s route for an eight-line order. Fast movers in the middle band, at waist to shoulder height, shortens that line more than any amount of software.")+
    '<p>Warehouse improvement is unglamorous and unusually profitable, because <b>walking is over half of a picker\'s time</b> and walking responds to a decision that costs nothing but a weekend.</p>'+
    viz(dgGolden(),"<b>The same rack seen from the side.</b> The green band between waist and shoulder is fastest to pick and safest for backs, and it is a small fraction of total cube.")+
    '<p>Slotting properly is four moves. Rank by <b>picks</b>, not by units or value. Put the fast movers in the golden zone, slow and heavy on the floor, slow and light up high. '+
    'Store items that are <b>ordered together</b> near each other, checking actual order lines rather than the product hierarchy. And re-slot regularly, because velocity changes with season and lifecycle.</p>'+
    nt("bad","The 97% threshold",
      "Inventory record accuracy is the percentage of locations where system quantity matches physical. Below roughly 97%, planners stop trusting the system, start keeping private spreadsheets "+
      "and add informal buffers. Once that culture exists, <b>no software project will fix your planning</b>, because the software is no longer where the decisions are being made. "+
      "Cycle counting rather than annual stocktakes is how it gets restored."));

  /* ---- CH 16: risk ---- TTR/TTS instead of a heat map. */
  h+=sec("risk","When it breaks","resilience without a heat map",
    '<p class="lede" style="margin-top:-2px">Ranking risks by likelihood times impact feels rigorous and fails for two reasons. Supply chain catastrophes are low-likelihood, so they rank low. '+
    'And they are correlated, so the grid counts one risk several times.</p>'+
    viz(scSpof(),"<b>You did not have five suppliers.</b> Five independent-looking relationships, one resin plant behind all of them. This is what correlated risk looks like when you draw it rather than tabulate it.")+
    '<p>The alternative asks two answerable questions about every node. <b>Time to recover</b> is how long that node would take to resume full function after a serious disruption. '+
    'Ask the supplier. Most have never been asked and will have to go and find out, which is itself informative. '+
    '<b>Time to survive</b> is how long you could keep serving customers if it stopped, given current stock and alternatives.</p>'+
    viz(dgTTR(),"<b>One timeline, two lengths.</b> Stock lasts 28 days, recovery takes 68, and the red bar is the 40 days in between during which you have nothing to sell.")+
    fx("Exposure = time to recover - time to survive","In days. Positive means a gap. No colours required.")+
    '<p>The output is a list of nodes with a number of days beside each, which is a board-level conversation: '+
    '<i>if this supplier stops, we run out in eleven days and they need sixty eight to recover, here are three options and what each costs.</i> A heat map cannot produce that sentence.</p>'+
    minor("Map suppliers by revenue at risk, not by spend. The four-thousand-euro sole-source label printer that halts every line is a far bigger exposure than the four-million-euro component with three qualified sources, and it will never appear on a procurement spend analysis."));

  /* ---- CH 17: S&OP ---- */
  h+=sec("sop","Agreeing one plan","the meeting everything depends on",
    viz(scSop(),"<b>The monthly rhythm.</b> Five steps, every month, ending in a decision. If the last step reviews performance instead of choosing between options, the whole cycle is theatre.")+
    '<p>Sales and Operations Planning is the monthly process that forces one agreed plan across demand, supply and finance. '+
    'Integrated Business Planning is the same rhythm extended so the numbers presented to the board and the numbers driving the factory are the same numbers.</p>'+
    '<p>Where it goes wrong is almost never the process diagram. It is these four things:</p>'+
    '<ul><li><b>No decisions are made.</b> A meeting that reviews performance rather than choosing between options is a reporting meeting wearing a costume.</li>'+
    '<li><b>The unconstrained forecast is never recorded.</b> Without it you lose all memory of demand you turned away, and end up forecasting your own shortages forever.</li>'+
    '<li><b>Finance is absent.</b> Then the plan has no euro impact, so nobody senior cares, so nobody senior attends, so no decisions get made.</li>'+
    '<li><b>The gap is presented as a problem rather than as options.</b> That one is entirely within your control.</li></ul>'+
    nt("good","The single highest-value habit in this field",
      "Bring two or three costed scenarios rather than one answer. <i>We are 40,000 units short. Option A costs €180k in air freight. Option B gives up €400k of revenue on the C lines. I recommend A, and here is why.</i> "+
      "That sentence changes your role from the person who reports bad news to the person who frames the choice, and that is the difference between a planner and a supply chain leader."));

  /* ---- CH 18: direction reference ----
     Uses card() directly rather than sec(), because it is a reference table
     with no single source to cite. */
  h+='<section id="ls-direction">'+card("Which way is good","for anyone without a finance background",
    '<p class="lede" style="margin-top:-2px">The hard part of a numbers-heavy job is not the arithmetic. It is knowing which direction each number should move, '+
    'and which ones you deliberately keep in the middle rather than maximising. Every metric in the simulator carries one of these three markers.</p>'+
    '<div class="row" style="margin:10px 0 12px">'+
    '<span class="dirL up">higher is better</span><span class="dirL down">lower is better</span><span class="dirL mid">mid-range is best</span></div>'+
    '<div class="gridwrap"><table class="dg"><thead><tr><th>Metric</th><th>Direction</th><th>What it means</th><th>Why</th></tr></thead><tbody>'+
    Object.keys(DIR).map(function(k){var D=DIR[k];
      return '<tr><td class="code">'+esc(D.n)+'</td><td style="text-align:left">'+dirTag(k)+'</td>'+
        '<td style="text-align:left;white-space:normal;min-width:250px">'+esc(D.p)+'</td>'+
        '<td style="text-align:left;white-space:normal;min-width:240px">'+esc(D.why)+'</td></tr>';}).join("")+
    '</tbody></table></div>'+
    minor("Two of these are deliberately mid-range and they catch people out. <b>Utilisation</b> looks like something to maximise and is not: past about 90%, queues explode and delivery gets worse. <b>Days of cover</b> is the same: too little stocks out, too much decays and ties up cash. Anyone telling you to maximise either has not run an operation."))+'</section>';

  /* ---- CH 19: the formula sheet, grouped ---- */
  var groups={};
  FORMULAS.forEach(function(f){ (groups[f.g]=groups[f.g]||[]).push(f); });
  h+='<section id="ls-formulas">'+card("The formula sheet","everything the simulator actually computes",
    '<p class="lede" style="margin-top:-2px">Nothing in this app is a lookup table or a plausible-looking number. Every figure is computed from the formulas below, '+
    'applied to each product line and rolled up. If a result surprises you, the maths is here to argue with.</p>'+
    Object.keys(groups).map(function(k){
      return '<h4 style="margin:16px 0 4px">'+esc(k)+'</h4>'+
        groups[k].map(function(f){return fx(esc(f.f),esc(f.w));}).join("");
    }).join(""))+'</section>';

  /* ---- CH 20: the walkthrough map, derived from TAB_ORDER and CHAPTERS ---- */
  h+='<section id="ls-walk">'+card("The thirteen steps","what each screen covers",
    '<p class="lede" style="margin-top:-2px">Once you pick an industry you become its supply chain lead for eight quarters. '+
    'The steps run in the order the chain actually works, and you can move through them with the arrows at the foot of every screen or the left and right keys.</p>'+
    '<div class="grid2" style="margin-top:12px">'+
    TAB_ORDER.map(function(k,i){
      var C=CHAPTERS[k]; if(!C) return "";
      return '<div style="display:flex;gap:11px;align-items:flex-start;border:1px solid var(--rule);border-radius:12px;padding:12px 13px;background:var(--panel)">'+
        '<span style="width:26px;height:26px;border-radius:50%;background:var(--accSoft);color:var(--accInk);flex:none;'+
        'display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem">'+(i+1)+'</span>'+
        '<div><b style="font-size:.92rem">'+esc(C.n)+'</b>'+
        '<div style="font-size:.82rem;color:var(--sub);font-weight:600">'+esc(C.t)+'</div>'+
        '<div class="hint" style="margin-top:4px">'+esc(C.d)+'</div></div></div>';
    }).join("")+'</div>'+
    nt("good","Two screens are entirely yours",
      "<b>Your numbers</b> is the item file behind every calculation, and every value in it is editable: price, cost, demand, lead time, variability, minimum order quantity, shelf life, weight. "+
      "You can add product lines, remove them, and rename the company. <b>Planning book</b> is the week-by-week grid a planner actually works in: you type the forecast and the receipts, "+
      "the sheet projects stock forward and tells you where it breaks, and then it prices your plan against what a replenishment policy would have spent on the same demand."))+'</section>';

  /* ---- CH 21: field notes, grouped by area ---- */
  var mg={};
  MINOR.forEach(function(m){ (mg[m[0]]=mg[m[0]]||[]).push(m[1]); });
  h+='<section id="ls-notes">'+card("Field notes","the "+MINOR.length+" things nobody writes down",
    '<p class="lede" style="margin-top:-2px">Textbooks teach the formulas. These are the things you normally only learn in year two, usually by getting one of them wrong in front of somebody important.</p>'+
    Object.keys(mg).map(function(k){
      return '<h4 style="margin:16px 0 6px">'+esc(k)+'</h4>'+
        mg[k].map(function(t){return '<div class="minor" style="margin:6px 0"><span class="h">'+esc(k)+'</span>'+t+'</div>';}).join("");
    }).join(""))+'</section>';

  /* ---- CH 22: the searchable glossary.
     The input has id lgs, wired up by renderLaunch(); the chips carry
     data-lcat and are handled by the delegated click listener. */
  var cats=GLOSSARY.map(function(g){return g[1];}).filter(function(v,i,a){return a.indexOf(v)===i;});

    bibliography()+
    nt("good","If you only read three things",
      "<b>Chopra and Meindl</b> for the shape of the whole field. <b>Hopp and Spearman</b> for why factories behave the way they do, "+

    minor("Hyndman and Athanasopoulos is free and legal to read online at otexts.com/fpp3, and it is better than most paid forecasting texts. "+

  h+='<section id="ls-using">'+card("How to use the simulator","nothing here can break",
    '<div class="grid2">'+
