      lot:{VEG:3,FRUIT:4,STOCK:3,BOTL:4,LABEL:4},
      ssFg:{SOUP:1.5,SMOO:1.5,BROTH:1.5},
      interval:{SOUP:5,SMOO:5,BROTH:10},
      frozen:3
    }
  };
}

/* ============================ THE ENGINE ============================ */
function gameRun(G){
  var d=G.d, r=G.round;
  var ev=GEVENTS.filter(function(e){return e.r===r;})[0]||null;
  var eff=ev?ev.eff:{};

  /* ---------- 1. demand ---------- */
  var demand={}, totalUnits=0, totalLitres=0;
  GPROD.forEach(function(p){
    demand[p.id]={};
    GCUST.forEach(function(c){
      var q=c.demandBase[p.id]*26*GSEASON[p.id][r-1]*((eff.demand&&eff.demand[p.id])||1);
      demand[p.id][c.id]=q; totalUnits+=q; totalLitres+=q*p.litres;
    });
  });

  /* ---------- 2. purchasing: price, reliability, lead time ---------- */
  var comp={}, compSpendPlan=0;
  GCOMP.forEach(function(cm){
    var s=GSUP[cm.id].filter(function(x){return x.id===d.supplier[cm.id];})[0]||GSUP[cm.id][0];
    var rel=s.rel*((eff.supRel&&eff.supRel[cm.id])||1);
    var price=cm.base*s.price*((eff.compPrice&&eff.compPrice[cm.id])||1);
    var need=0;
    GPROD.forEach(function(p){
      var tot=GCUST.reduce(function(a,c){return a+demand[p.id][c.id];},0);
      need+=tot*cm.per[p.id];
    });
    /* safety stock in weeks of cover protects against unreliability and lead time */
    var ss=d.ssComp[cm.id], lot=d.lot[cm.id];
    var exposure=(1-rel)*Math.sqrt(Math.max(s.lt,1)/7);
    var cover=ss+lot/2+ (d.frozen*0.35);
    /* buffer helps, but it cannot fully cover an unreliable, distant supplier */
    var availability=clamp(1-Math.max(0,exposure*1.15-cover*0.08), 0.55, 0.999);
    var wksStock=ss+lot/2;
    var avgStock=need/26*wksStock;
    comp[cm.id]={sup:s,rel:rel,price:price,need:need,avail:availability,
      avgStock:avgStock, value:avgStock*price, pipeline:need/26*(s.lt/7)*price,
      quality:s.quality, lt:s.lt, ss:ss, lot:lot};
    compSpendPlan+=need*price;
  });
  /* production can only run when every component of that product is there */
  var availAll=1;
  GCOMP.forEach(function(cm){ availAll*=comp[cm.id].avail; });
  var rejects=1-GCOMP.reduce(function(a,cm){return a*comp[cm.id].quality;},1);

  /* ---------- 3. operations: capacity ---------- */
  var lineLitresPerShift=900000;   /* litres per line, per shift, per 26-week round */
  var setupLoss=GPROD.reduce(function(a,p){ return a + (26/Math.max(d.interval[p.id],1))*0.9; },0)/100;
  var capacity=d.lines*d.shifts*lineLitresPerShift*(1-clamp(setupLoss,0.02,0.35));
  var util=totalLitres/Math.max(capacity,1);
  var overtime=Math.max(0,util-1);
  var prodAdherence=clamp(1-Math.max(0,util-0.88)*1.35,0.6,0.99);

  /* warehouse space */
  var compPallets=sum(GCOMP.map(function(cm){return comp[cm.id].avgStock/cm.pal;}));
  var fgWeeks=sum(GPROD.map(function(p){
    var tot=GCUST.reduce(function(a,c){return a+demand[p.id][c.id];},0);
    return tot/26*(d.ssFg[p.id]+d.interval[p.id]/10);}));
  var fgPallets=fgWeeks/1100;   /* finished units per pallet */
  var inOver=Math.max(0,compPallets-d.inbound), outOver=Math.max(0,fgPallets-d.outbound);
  var staffNeed=(compPallets+fgPallets)/118;
  var flexStaff=Math.max(0,staffNeed-d.staff);

  /* ---------- 4. supply chain: service and freshness ---------- */
  var perCust={}, revenue=0, penalty=0, bonus=0, servedUnits=0, lostUnits=0;
  var obsoleteValue=0, cogs=0;
  GCUST.forEach(function(c){
    var pr=d.promise[c.id];
    var svcSum=0, wSum=0, freshSum=0, rev=0, cg=0;
    GPROD.forEach(function(p){
      var q=demand[p.id][c.id];
      if(q<=0) return;
      /* attained service: stock cover, component availability, plant adherence */
      var ssw=d.ssFg[p.id];
      var base=1-Math.exp(-(ssw+0.55)*1.28);
      var attained=clamp(base*availAll*prodAdherence*(1-rejects),0.4,0.995)*100;
      /* freshness: how much shelf life is left when it ships */
      var ageWeeks=ssw*0.5+d.interval[p.id]/10*0.5;   /* average age at despatch */
      var freshPct=clamp(100-(ageWeeks*7/p.shelf)*100*((eff.decay)||1),5,99);
      /* the customer refuses anything under the promised freshness */
      if(freshPct<pr.fresh) attained*=clamp(1-(pr.fresh-freshPct)/85,0.55,1);
      /* obsolescence: stock that ages out before it ships */
      var over=Math.max(0,ageWeeks*2*7-p.shelf*(1-pr.fresh/100));
      var win=Math.max(p.shelf*(1-pr.fresh/100),1);
      var obs=clamp(over/win,0,2)*0.062*((eff.decay)||1);
      var served=q*attained/100;
      servedUnits+=served; lostUnits+=q-served;
      /* contract index: paid on ATTAINED performance, not promised */
      var gap=(attained-pr.svc);
      var idx=1+(pr.svc-93)*0.012*c.tough + clamp(gap,-12,6)*0.011*c.tough
              +(pr.fresh-65)*0.0035*c.tough - (pr.window-2)*0.012;
      idx=clamp(idx,0.82,1.22);
      var unitRev=p.price*idx;
      rev+=served*unitRev;
      var unitCost=GCOMP.reduce(function(a,cm){return a+cm.per[p.id]*comp[cm.id].price;},0);
      cg+=served*unitCost*(1+rejects);
      obsoleteValue+=q*obs*unitCost;
      if(gap<0) penalty+=served*p.price*Math.min(-gap,15)*0.006*c.tough*((eff.toughness&&eff.toughness[c.id])||1);
      else bonus+=served*p.price*Math.min(gap,6)*0.003*c.tough;
      svcSum+=attained*q; wSum+=q; freshSum+=freshPct*q;
    });
    perCust[c.id]={svc:wSum?svcSum/wSum:0, fresh:wSum?freshSum/wSum:0,
      promised:d.promise[c.id].svc, rev:rev, vol:wSum};
    revenue+=rev; cogs+=cg;
  });

  /* ---------- 5. money ---------- */
  var prodCost=totalLitres*0.142 + d.shifts*d.lines*192000 + overtime*totalLitres*0.46;
  var whCost=(d.inbound+d.outbound)*132 + d.staff*44000 + flexStaff*74000 + (inOver+outOver)*640;
  var opex=prodCost+whCost+obsoleteValue+penalty-bonus+ 880000;   /* sales, admin, marketing */
  var profit=revenue-cogs-opex;

  var compInv=sum(GCOMP.map(function(cm){return comp[cm.id].value+comp[cm.id].pipeline;}));
  var fgInv=sum(GPROD.map(function(p){
    var tot=GCUST.reduce(function(a,c){return a+demand[p.id][c.id];},0);
    var unitCost=GCOMP.reduce(function(a,cm){return a+cm.per[p.id]*comp[cm.id].price;},0);
    return tot/26*(d.ssFg[p.id]+d.interval[p.id]/10)*unitCost;}));
  var fixedAssets=d.lines*1250000 + (d.inbound+d.outbound)*380;
  var investment=compInv+fgInv+fixedAssets+ revenue*0.14;
  var roi=investment>0? profit/investment*100 : 0;

  var otif=servedUnits+lostUnits>0? servedUnits/(servedUnits+lostUnits)*100 : 0;

  return {round:r, ev:ev, demand:demand, comp:comp, perCust:perCust,
    totalUnits:totalUnits, totalLitres:totalLitres, capacity:capacity, util:util*100,
    overtime:overtime*100, prodAdherence:prodAdherence*100, availAll:availAll*100, rejects:rejects*100,
    compPallets:compPallets, fgPallets:fgPallets, inOver:inOver, outOver:outOver, flexStaff:flexStaff,
    revenue:revenue, cogs:cogs, prodCost:prodCost, whCost:whCost, obsolete:obsoleteValue,
    penalty:penalty, bonus:bonus, opex:opex, profit:profit,
    compInv:compInv, fgInv:fgInv, fixedAssets:fixedAssets, investment:investment,
    roi:roi, otif:otif, servedUnits:servedUnits, lostUnits:lostUnits};
}

/* the four individual role scores, as in the team simulations */
function gameRoleScores(R,G){
  var idxSum=0,n=0;
  GCOMP.forEach(function(cm){ idxSum+=GSUP[cm.id].filter(function(x){return x.id===G.d.supplier[cm.id];})[0].price; n++; });
  var purch=clamp((1.06-idxSum/n)*900,0,100);
  var ops=clamp(100-Math.abs(R.util-84)*1.7-(R.inOver+R.outOver)*0.04-R.flexStaff*4,0,100);
  var sales=clamp((sum(GCUST.map(function(c){return R.perCust[c.id].rev;}))/1000000-7)*13,0,100);
  var scm=clamp(100-(R.compInv+R.fgInv)/42000,0,100);
  return {purchasing:purch, operations:ops, sales:sales, supplyChain:scm};
}

    '</tbody></table></div>');

  h+=card("Individual role scores","out of 100",
    '<div class="grid2"><div><div data-gchart="roles"></div></div><div>'+

function gameAdvice(R){
  var G=ST.game, d=G.d, out=[];
  if(R.util>92) out.push({t:"bad",h:"The plant cannot make the plan",
    b:"Utilisation is "+pct(R.util,0)+" and adherence has fallen to "+pct(R.prodAdherence,0)+
      ". Either add a shift, add a line, or lengthen the production intervals so you spend less capacity on changeovers."});
  if(R.util<62) out.push({t:"warn",h:"You are paying for capacity you are not using",
    b:"Utilisation is "+pct(R.util,0)+". Each line-shift costs about "+money(192000)+" a round, and a line also sits in the investment base your ROI is divided by."});
  if(R.availAll<95) out.push({t:"bad",h:"Components are not there when the line wants them",
    b:"Availability is "+pct(R.availAll,1)+". Five components multiply together, so each one has to be near perfect. "+
      "Either move to a more reliable supplier or raise the safety stock on the weakest one."});
  GCUST.forEach(function(c){
    var p=R.perCust[c.id];
    if(p.svc < p.promised-3) out.push({t:"bad",h:"You are over-promising "+c.n,
      b:"You promised "+pct(p.promised,1)+" and delivered "+pct(p.svc,1)+". You are being paid on the lower number and fined on the gap. "+
        "Either lower the promise to what you can hold, or raise the finished goods safety stock to meet it."});
  });
  if(R.obsolete>R.revenue*0.03) out.push({t:"bad",h:"You are making product to throw away",
    b:money(R.obsolete)+" written off, "+pct(R.obsolete/R.revenue*100,1)+" of revenue. Stock is ageing past the freshness the customer will accept. "+
      "Cut finished goods safety stock, shorten the production interval, or lower the freshness you promised."});
  if(R.inOver+R.outOver>0) out.push({t:"warn",h:"Stock is in overflow storage",
    b:fm(R.inOver+R.outOver,0)+" pallets outside your own warehouse at "+money((R.inOver+R.outOver)*640)+
      ". Either buy the space on the Operations screen or hold less stock on the Supply Chain screen. The second is usually cheaper."});
  if(R.flexStaff>0.5) out.push({t:"warn",h:"Agency staff are covering the gap",
    b:fm(R.flexStaff,1)+" agency people at "+money(74000)+" each. Permanent staff cost "+money(44000)+"."});
  if((R.compInv+R.fgInv)>2200000) out.push({t:"warn",h:"Inventory is heavy",
    b:money(R.compInv+R.fgInv)+" tied up. That sits directly in the denominator of your ROI, so it drags the score even when it is not costing you in write-offs."});
  if(R.roi>=10&&out.length===0) out.push({t:"good",h:"This is a working configuration",
    b:"ROI of "+pct(R.roi,1)+" with no obvious failure mode. Now check the round ahead: the events are not random and each one punishes a specific weakness."});
  if(!out.length) out.push({t:"warn",h:"No single failure, but no profit either",
    b:"ROI is "+pct(R.roi,1)+". When nothing is obviously broken the gain is usually in the promise: check whether you are attaining more service than you are being paid for."});
  return out.slice(0,5);
}

function paintGameCharts(R){
  var G=ST.game;
  $$('[data-gchart]').forEach(function(el){
    var k=el.getAttribute("data-gchart");
    if(k==="pl"){
      el.innerHTML=svgWaterfall({w:540,h:250,items:[
        {label:"Revenue",v:R.revenue,total:true},{label:"Components",v:-R.cogs},
        {label:"Production",v:-R.prodCost},{label:"Warehouse",v:-R.whCost},
        {label:"Write-off",v:-R.obsolete},{label:"Penalties",v:-R.penalty+R.bonus},
        {label:"Overheads",v:-880000},{label:"Profit",v:R.profit,total:true}]});
    }
    if(k==="roles"){
      var rs=gameRoleScores(R,G);
      el.innerHTML=svgRadar({w:300,h:270,axes:["Purchasing","Operations","Sales","Supply chain"],
        series:[{name:"you",color:"#1E7A52",data:[rs.purchasing,rs.operations,rs.sales,rs.supplyChain]},
                {name:"target",color:"#7A8798",data:[70,70,70,70],dash:true}]});
    }
    if(k==="hist"&&G.history.length){
      var L=G.history.map(function(x){return "R"+x.round;});
      el.innerHTML=svgLine({w:520,h:210,x:L,series:[
        {name:"ROI",color:"#1E7A52",data:G.history.map(function(x){return x.roi;})},
        {name:"Service",color:"#24559E",data:G.history.map(function(x){return x.otif;})},
        {name:"Inventory",color:"#9A6A0F",data:G.history.map(function(x){return (x.inv)/1e6;}),dash:true}]});
    }
  });
}

function gameClose(){
  var G=ST.game, R=gameRun(G);
  G.history.push({round:G.round,roi:R.roi,otif:R.otif,inv:R.compInv+R.fgInv,profit:R.profit,rev:R.revenue});
  if(G.round>=GAME_ROUNDS){ G.role="final"; renderGameFinal(); return; }
  G.round++; G.role="result"; renderGame(); window.scrollTo(0,0);
}

function renderGameFinal(){
  var G=ST.game;
  var avg=sum(G.history.map(function(x){return x.roi;}))/G.history.length;
  var best=Math.max.apply(null,G.history.map(function(x){return x.roi;}));
  var grade=avg>=14?"Outstanding":avg>=8?"Strong":avg>=2?"Recovered the business":avg>=-6?"Still losing money":"The business is in trouble";
  var h='<div id="launch"><div class="lwrap">';
  h+='<button class="backlink" data-ltab="home">&larr; Back to the start</button>';
  h+='<h1 class="lhead2">Six rounds complete</h1>';
  h+='<p class="lsub2">'+esc(GCO.name)+' after three years under your management.</p>';
  h+='<div class="homegrid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">'+
     [["Average ROI",pct(avg,1),"the number the ranking uses"],
      ["Best round",pct(best,1),"your high water mark"],
      ["Verdict",grade,"against a 12% sector benchmark"]
     ].map(function(x){
       return '<div class="homecard" style="cursor:default"><span class="hnum">'+esc(x[0])+'</span>'+
         '<span class="htt">'+esc(x[1])+'</span><span class="hsub">'+esc(x[2])+'</span></div>';}).join("")+'</div>';
  h+='<div class="card" style="margin-top:22px;text-align:left"><div class="cardhead"><h3>Round by round</h3></div>'+
     '<div class="gridwrap"><table class="dg"><thead><tr><th>Round</th><th>ROI</th><th>Service</th>'+
     '<th>Revenue</th><th>Profit</th><th>Inventory</th></tr></thead><tbody>'+
     G.history.map(function(x){
       return '<tr><td class="code">Round '+x.round+'</td><td class="'+(x.roi>=8?"g":x.roi>=0?"w":"b")+'">'+pct(x.roi,1)+'</td>'+
         '<td class="'+(x.otif>=95?"g":x.otif>=88?"w":"b")+'">'+pct(x.otif,1)+'</td>'+
         '<td>'+money(x.rev)+'</td><td class="'+(x.profit>=0?"g":"b")+'">'+money(x.profit)+'</td>'+
         '<td>'+money(x.inv)+'</td></tr>';}).join("")+'</tbody></table></div>'+
     '<div style="margin-top:16px" data-gfinal="1"></div></div>';
  h+='<div class="pager" style="margin-top:18px">'+
     '<button class="pgbtn" data-gact="restart"><span class="ar">&#8635;</span><span>'+
     '<span class="lb">Try a different strategy</span><span class="tt">Play again from round one</span>'+
     '<span class="wy">The events fall in the same rounds, so you can test whether a change would have absorbed them.</span></span></button>'+
     '<button class="pgbtn nx" data-ltab="learn"><span class="ar">&rarr;</span><span>'+
     '<span class="lb">Understand what happened</span><span class="tt">Read the fundamentals</span>'+
     '<span class="wy">Every mechanic in this game has a chapter explaining the theory underneath it.</span></span></button></div>';
  h+='</div></div>';
  $("#app").innerHTML=h;
  var el=$('[data-gfinal]');
  if(el) el.innerHTML=svgLine({w:540,h:220,x:G.history.map(function(x){return "R"+x.round;}),
    series:[{name:"ROI",color:"#1E7A52",data:G.history.map(function(x){return x.roi;})},
            {name:"Service",color:"#24559E",data:G.history.map(function(x){return x.otif;})}],
    bands:[{y:12,label:"sector benchmark",color:"#7A8798"}]});
}

/* the bullwhip, as growing waves */
ILLU.whip=function(){
  var s=iOpen()+iR(10,18,100,60,VIB.paper,VIB.aquaD,4);
  ["","",""].forEach(function(_,i){
    var amp=6+i*9, col=[VIB.mint,VIB.lemon,VIB.coral][i], y=32+i*16, d="";
    for(var t=0;t<=48;t++){
      var yy=y+Math.sin(t/3.4)*amp*(t/48);
      d+=(t?"L":"M")+(16+t*1.85).toFixed(1)+","+yy.toFixed(1);
    }
    s+=iP(d,null,col,2.4);
  });
  return s+iR(6,84,108,6,VIB.slateL,VIB.slateD,3)+'</svg>';
};
