/* gameScm(R): component policy, then finished goods policy. The second block
   carries the game's sharpest lesson: past a point, MORE stock makes service
   worse, because product ages out of its acceptance window before it ships. */
function gameScm(R){
  var h=card("Component stock policy","cover against unreliable supply",
    '<p class="lede" style="margin-top:-2px">Safety stock is weeks of cover held against a supplier being late or short. '+
    'Lot size is how many weeks you buy at a time: bigger lots mean fewer deliveries, more stock and more warehouse space.</p>'+
    '<div class="grid3">'+GCOMP.map(function(cm){
      var c=R.comp[cm.id];
      return '<div style="border:1px solid var(--rule);border-radius:12px;padding:14px;background:var(--panel)">'+
        '<h4 style="font-size:.9rem">'+esc(cm.n)+'</h4>'+
        /* the supplier's own numbers are repeated here, because this policy
           only makes sense against the lead time and reliability it faces */
        '<div class="hint" style="text-align:center">'+esc(c.sup.n)+' &middot; '+c.lt+' day lead time &middot; '+
        pct(c.rel*100,0)+' reliable</div>'+
        gSlider({p:"ssComp."+cm.id,label:"Safety stock",min:0,max:8,step:0.5,suf:" wk"})+
        gSlider({p:"lot."+cm.id,label:"Lot size",min:1,max:10,step:0.5,suf:" wk"})+
        statline("Availability",pct(c.avail*100,1),c.avail>0.97?"g":c.avail>0.9?"w":"b")+
        statline("Stock value",money(c.value))+
        statline("In the pipeline",money(c.pipeline))+
        '</div>';}).join("")+'</div>');

  h+=card("Finished goods policy","cover against demand, against a shelf life",
    '<p class="lede" style="margin-top:-2px">More finished stock means better service, right up to the point where it ages past what the customer will accept. '+
    'On a 21 day smoothie promising 75% freshness, you have five days of usable window. Hold more than that and you are making product to scrap.</p>'+
    '<div class="grid3">'+GPROD.map(function(p){
      return '<div style="border:1px solid var(--rule);border-radius:12px;padding:14px;background:var(--panel)">'+
        '<h4 style="font-size:.9rem">'+esc(p.n)+'</h4>'+
        '<div class="hint" style="text-align:center">'+p.shelf+' day shelf life &middot; '+money(p.price)+'</div>'+
        gSlider({p:"ssFg."+p.id,label:"Safety stock",min:0,max:6,step:0.1,suf:" wk"})+
        gSlider({p:"interval."+p.id,label:"Production interval",min:1,max:15,suf:" d",
          hint:"Days between runs of this product. Shorter means fresher stock and more changeovers."})+
        '<div class="hint" style="text-align:left;margin-top:6px">'+esc(p.note)+'</div></div>';}).join("")+'</div>'+
    gSlider({p:"frozen",label:"Frozen period",min:1,max:8,suf:" wk",
      hint:"How far ahead the production schedule is fixed. A longer frozen period calms the plant and cuts component uncertainty, at the cost of responsiveness."})+
    '<div class="grid3" style="margin-top:14px">'+
    [["Component stock",money(R.compInv),R.compInv<900000?"g":"w","Including everything in the pipeline."],
     ["Finished goods",money(R.fgInv),R.fgInv<700000?"g":"w","Made and waiting."],
     ["Written off",money(R.obsolete),R.obsolete<250000?"g":"b","Product that aged past what the customer would accept."]
    ].map(function(x){
      return '<div class="mx"><div class="t"><span>'+x[0]+'</span></div><div class="v '+x[2]+'">'+x[1]+'</div>'+
        '<div class="d">'+x[3]+'</div></div>';}).join("")+'</div>'+
    learn("The two things this seat is actually trading",
      "<p>Safety stock buys service and costs cash and freshness. Lot size and production interval buy capacity and cost cash and freshness. "+
      "Everything on this screen is one of those two trades.</p>"+
      "<p>The mistake to avoid is treating stock as a service dial. Past a certain point more stock makes service <b>worse</b>, "+
      "because product ages out of its acceptance window before it ships. On a short shelf life the curve turns over quickly.</p>"+
      refBlock("safety")));
  return h;
}

/* gameResult(R): the round verdict — the ROI headline, the full P&L, the
   promise-versus-delivery table, the four role scores, and the diagnosis. */
function gameResult(R){
  var G=ST.game;
  var rs=gameRoleScores(R,G);
  var h=card("Round "+R.round+" result","operating profit against capital employed",
    '<div style="text-align:center;margin-bottom:14px">'+
    '<div class="eyebrow">Return on investment</div>'+
    '<div style="font-size:clamp(2.6rem,2rem+3vw,4rem);font-weight:700;letter-spacing:-.04em;line-height:1.05;color:'+
      (R.roi>=10?"var(--good)":R.roi>=0?"var(--warn)":"var(--bad)")+'">'+pct(R.roi,1)+'</div>'+
    '<div class="hint" style="margin-top:2px">'+money(R.profit)+' operating profit on '+money(R.investment)+' invested</div></div>'+
    '<div data-gchart="pl"></div>');

  h+=card("Where the money went","",
    '<div class="gridwrap"><table class="dg"><thead><tr><th>Line</th><th>Amount</th><th>Share of revenue</th><th>Comment</th></tr></thead><tbody>'+
    [["Revenue",R.revenue,"Paid at the contract index your attained service earned"],
     ["Component cost",-R.cogs,"Supplier choice and quality rejects both land here"],
     ["Production",-R.prodCost,"Shifts, lines, overtime"],
     ["Warehouse",-R.whCost,"Space, staff, agency cover, overflow"],
     ["Written off",-R.obsolete,"Stock that aged past the acceptance window"],
     ["Customer penalties",-R.penalty,"Charged on the gap between promise and delivery"],
     ["Performance bonus",R.bonus,"Earned where you beat what you promised"],
     ["Overheads",-880000,"Sales, admin and marketing"]
    ].map(function(x){
      return '<tr><td class="code">'+x[0]+'</td><td class="'+(x[1]>=0?"g":"")+'">'+money(x[1])+'</td>'+
        '<td>'+pct(Math.abs(x[1])/Math.max(R.revenue,1)*100,1)+'</td>'+
        '<td style="text-align:left;white-space:normal">'+x[2]+'</td></tr>';}).join("")+
    '</tbody><tfoot><tr><td>Operating profit</td><td class="'+(R.profit>=0?"g":"b")+'">'+money(R.profit)+'</td>'+
    '<td>'+pct(R.profit/Math.max(R.revenue,1)*100,1)+'</td><td style="text-align:left">This divided by capital employed is your score</td></tr></tfoot></table></div>');

  /* the promise table: the single most important feedback in the game */
  h+=card("Promise against delivery","the number that decides the price",
    '<div class="gridwrap"><table class="dg"><thead><tr><th>Customer</th><th>Promised</th><th>Attained</th>'+
    '<th>Gap</th><th>Freshness</th><th>Revenue</th><th>Verdict</th></tr></thead><tbody>'+
    GCUST.map(function(c){
      var p=R.perCust[c.id], gap=p.svc-p.promised;
      return '<tr><td class="code">'+esc(c.n)+'</td><td>'+pct(p.promised,1)+'</td>'+
        '<td class="'+(gap>=0?"g":"b")+'">'+pct(p.svc,1)+'</td>'+
        '<td class="'+(gap>=0?"g":"b")+'">'+(gap>0?"+":"")+fm(gap,1)+'</td>'+
        '<td>'+pct(p.fresh,0)+'</td><td>'+money(p.rev)+'</td>'+
        '<td style="text-align:left">'+(gap>=2?"Beat the promise, bonus earned":gap>=-1?"Delivered what you promised":
          gap>=-6?"Missed, penalty charged":"Badly missed, heavy penalty")+'</td></tr>';}).join("")+
    '</tbody></table></div>');

  h+=card("Individual role scores","out of 100",
    '<div class="grid2"><div><div data-gchart="roles"></div></div><div>'+
    nt(Math.min(rs.purchasing,rs.operations,rs.sales,rs.supplyChain)<40?"warn":"good","Reading these",
      "Each seat is scored on what that seat controls: <b>purchasing</b> on the price index it negotiated, <b>operations</b> on capacity fit, "+
      "<b>sales</b> on revenue earned, <b>supply chain</b> on inventory held. "+
      "A high individual score with a poor team ROI is the signature of exactly the problem this exercise teaches: everyone optimising their own number.")+
    '<div style="margin-top:10px">'+
    statline("Purchasing",fm(rs.purchasing,0),rs.purchasing>60?"g":"w")+
    statline("Operations",fm(rs.operations,0),rs.operations>60?"g":"w")+
    statline("Sales",fm(rs.sales,0),rs.sales>60?"g":"w")+
    statline("Supply Chain",fm(rs.supplyChain,0),rs.supplyChain>60?"g":"w")+
    '</div></div></div>');

  var adv=gameAdvice(R);
  h+=card("What to change before the next round","diagnosis",adv.map(function(a){
    return nt(a.t,a.h,a.b);}).join(""));

  if(G.round<=GAME_ROUNDS){
    h+='<div class="pager"><button class="pgbtn nx" data-gact="next" style="flex:1"><span class="ar">&rarr;</span>'+
       '<span><span class="lb">You have made your changes</span><span class="tt">Close round '+G.round+' and move on</span>'+
       '<span class="wy">Decisions are locked in and the next half-year is calculated.</span></span></button></div>';
  }
  return h;
}

/* gameAdvice(R): the game's coach. Same rule-list pattern as coach() in
   section 6: ordered by priority, capped at five, with a fallback that fires
   when nothing is broken but nothing is earning either. */
function gameAdvice(R){
  var G=ST.game, d=G.d, out=[];
  if(R.util>92) out.push({t:"bad",h:"The plant cannot make the plan",
    b:"Utilisation is "+pct(R.util,0)+" and adherence has fallen to "+pct(R.prodAdherence,0)+
      ". Either add a shift, add a line, or lengthen the production intervals so you spend less capacity on changeovers."});
  if(R.util<62) out.push({t:"warn",h:"You are paying for capacity you are not using",
    b:"Utilisation is "+pct(R.util,0)+". Each line-shift costs about "+money(192000)+" a round, and a line also sits in the investment base your ROI is divided by."});
  if(R.availAll<95) out.push({t:"bad",h:"Components are not there when the line wants them",
    b:"Availability is "+pct(R.availAll,1)+". Five components multiply together, so each one has to be near perfect. "+
      "Either move to a more reliable supplier or raise the safety stock on the weakest one."});
  /* one message per over-promised customer, named individually */
  GCUST.forEach(function(c){
    var p=R.perCust[c.id];
    if(p.svc < p.promised-3) out.push({t:"bad",h:"You are over-promising "+c.n,
      b:"You promised "+pct(p.promised,1)+" and delivered "+pct(p.svc,1)+". You are being paid on the lower number and fined on the gap. "+
        "Either lower the promise to what you can hold, or raise the finished goods safety stock to meet it."});
  });
  if(R.obsolete>R.revenue*0.03) out.push({t:"bad",h:"You are making product to throw away",
    b:money(R.obsolete)+" written off, "+pct(R.obsolete/R.revenue*100,1)+" of revenue. Stock is ageing past the freshness the customer will accept. "+
      "Cut finished goods safety stock, shorten the production interval, or lower the freshness you promised."});
  if(R.inOver+R.outOver>0) out.push({t:"warn",h:"Stock is in overflow storage",
    b:fm(R.inOver+R.outOver,0)+" pallets outside your own warehouse at "+money((R.inOver+R.outOver)*640)+
      ". Either buy the space on the Operations screen or hold less stock on the Supply Chain screen. The second is usually cheaper."});
  if(R.flexStaff>0.5) out.push({t:"warn",h:"Agency staff are covering the gap",
    b:fm(R.flexStaff,1)+" agency people at "+money(74000)+" each. Permanent staff cost "+money(44000)+"."});
  if((R.compInv+R.fgInv)>2200000) out.push({t:"warn",h:"Inventory is heavy",
    b:money(R.compInv+R.fgInv)+" tied up. That sits directly in the denominator of your ROI, so it drags the score even when it is not costing you in write-offs."});
  if(R.roi>=10&&out.length===0) out.push({t:"good",h:"This is a working configuration",
    b:"ROI of "+pct(R.roi,1)+" with no obvious failure mode. Now check the round ahead: the events are not random and each one punishes a specific weakness."});
  if(!out.length) out.push({t:"warn",h:"No single failure, but no profit either",
    b:"ROI is "+pct(R.roi,1)+". When nothing is obviously broken the gain is usually in the promise: check whether you are attaining more service than you are being paid for."});
  return out.slice(0,5);
}

/* ---------------- shell ----------------
   renderGame(): the game's equivalent of render(). Same three-part chrome
   (header, KPI board, role rail) but with its own KPI set and no side rail,
   hence the single-column main grid. */
function renderGame(){
  if(!ST.game) return;
  var G=ST.game, R=gameRun(G);
  G.lastResult=R;
  var h='<div id="chrome"><header id="top"><div class="wrap"><div class="topbar">';
  h+='<div class="brandmark"><div class="beacon"></div><div class="brandtxt">'+
     '<div class="co">'+esc(GCO.sub)+'</div><div class="ttl">'+esc(GCO.name)+'</div></div></div>';
  h+='<div class="spacer"></div><div class="qmeta"><div class="qdots">';
  for(var i=1;i<=GAME_ROUNDS;i++) h+='<div class="qdot '+(i<G.round?"done":i===G.round?"now":"")+'"></div>';
  h+='</div><span class="qtxt num">Round '+Math.min(G.round,GAME_ROUNDS)+' of '+GAME_ROUNDS+'</span>';
  h+='<button class="btn" data-gact="next">Close the round &rarr;</button>';
  h+='<button class="btn ghost" data-gact="quit">Leave the game</button></div></div>';

  h+='<div class="board" id="board">'+[
    {k:"ROI",v:pct(R.roi,1),t:R.roi>=10?"good":R.roi>=0?"warn":"bad",s:"the team score"},
    {k:"Service",v:pct(R.otif,1),t:R.otif>=95?"good":R.otif>=88?"warn":"bad",s:"attained across all customers"},
    {k:"Revenue",v:money(R.revenue),t:"",s:"this half year"},
    {k:"Profit",v:money(R.profit),t:R.profit>0?"good":"bad",s:"operating"},
    {k:"Inventory",v:money(R.compInv+R.fgInv),t:(R.compInv+R.fgInv)<1600000?"good":"warn",s:"components and finished"},
    {k:"Utilisation",v:pct(R.util,0),t:(R.util>70&&R.util<92)?"good":"bad",s:"of effective capacity"},
    {k:"Availability",v:pct(R.availAll,1),t:R.availAll>=97?"good":"bad",s:"components at the line"},
    {k:"Written off",v:money(R.obsolete),t:R.obsolete<250000?"good":"bad",s:"aged past acceptance"}
  ].map(function(x){
    return '<div class="kpi '+x.t+'"><div class="k">'+x.k+'</div><div class="v">'+x.v+'</div><div class="s">'+x.s+'</div></div>';
  }).join("")+'</div></div>';

  /* the event banner is always "live": unlike the simulator, the game has no
     mitigation flag, so an event is simply something that is happening */
  if(R.ev){
    h+='<div class="wrap"><div class="alertbar live" style="margin-bottom:0"><span class="tagpill">THIS ROUND</span>'+
       '<span><b>'+esc(R.ev.t)+'</b> '+esc(R.ev.b)+(R.ev.hint?' <i>'+esc(R.ev.hint)+'</i>':'')+'</span></div></div>';
  }

  h+='<nav id="rail"><div class="wrap"><div class="rails">';
  GROLES.forEach(function(r,i){
    h+='<button class="step '+(G.role===r.k?"on":"")+'" data-grole="'+r.k+'">'+
       '<span class="bead">'+(i+1)+'</span><span class="nm">'+esc(r.n)+'</span></button>';
  });
  h+='</div></div></nav></div>';

  h+='<main style="grid-template-columns:minmax(0,1fr)"><div id="view"></div></main>';
  $("#app").innerHTML=h;

  var body = G.role==="sales"?gameSales(R) : G.role==="purch"?gamePurch(R) :
             G.role==="ops"?gameOps(R) : G.role==="scm"?gameScm(R) :
             G.role==="result"?gameResult(R) : gameBrief(R);
  var role=GROLES.filter(function(r){return r.k===G.role;})[0];
  $("#view").innerHTML='<div class="chapter"><div class="cn">Round '+Math.min(G.round,GAME_ROUNDS)+' of '+GAME_ROUNDS+'</div>'+
    '<h2>'+esc(role.n)+'</h2><div class="cd">'+esc(role.s)+'</div></div>'+body;
  paintGameCharts(R);
  measureChrome();
}

/* paintGameCharts(R): the game's chart painter. Uses [data-gchart] rather
   than [data-chart] so it cannot collide with the simulator's painter. */
function paintGameCharts(R){
  var G=ST.game;
  $$('[data-gchart]').forEach(function(el){
    var k=el.getAttribute("data-gchart");
    if(k==="pl"){
      /* penalties and bonus are netted into one bar, because they are two
         sides of the same contract mechanism */
      el.innerHTML=svgWaterfall({w:540,h:250,items:[
        {label:"Revenue",v:R.revenue,total:true},{label:"Components",v:-R.cogs},
        {label:"Production",v:-R.prodCost},{label:"Warehouse",v:-R.whCost},
        {label:"Write-off",v:-R.obsolete},{label:"Penalties",v:-R.penalty+R.bonus},
        {label:"Overheads",v:-880000},{label:"Profit",v:R.profit,total:true}]});
    }
    if(k==="roles"){
      var rs=gameRoleScores(R,G);
      el.innerHTML=svgRadar({w:300,h:270,axes:["Purchasing","Operations","Sales","Supply chain"],
        series:[{name:"you",color:"#00A67D",data:[rs.purchasing,rs.operations,rs.sales,rs.supplyChain]},
                {name:"target",color:"#8497AE",data:[70,70,70,70],dash:true}]});
    }
    if(k==="hist"&&G.history.length){
      var L=G.history.map(function(x){return "R"+x.round;});
      el.innerHTML=svgLine({w:520,h:210,x:L,series:[
        {name:"ROI",color:"#00A67D",data:G.history.map(function(x){return x.roi;})},
        {name:"Service",color:"#4B63E8",data:G.history.map(function(x){return x.otif;})},
        /* inventory divided down to millions so it shares the axis */
        {name:"Inventory",color:"#C99A06",data:G.history.map(function(x){return (x.inv)/1e6;}),dash:true}]});
    }
  });
}

/* gameClose(): snapshot the round, then advance or finish. Mirrors
   closeQuarter() in section 6, including the rule that the snapshot is taken
   BEFORE the round counter moves. */
function gameClose(){
  var G=ST.game, R=gameRun(G);
  G.history.push({round:G.round,roi:R.roi,otif:R.otif,inv:R.compInv+R.fgInv,profit:R.profit,rev:R.revenue});
  if(G.round>=GAME_ROUNDS){ G.role="final"; renderGameFinal(); return; }
  G.round++; G.role="result"; renderGame(); window.scrollTo(0,0);
}

/* renderGameFinal(): the end screen. Average ROI across all six rounds is
   the headline, because a single good round proves nothing — the events are
   fixed and a configuration that survives all six is the real test. */
function renderGameFinal(){
  var G=ST.game;
  var avg=sum(G.history.map(function(x){return x.roi;}))/G.history.length;
  var best=Math.max.apply(null,G.history.map(function(x){return x.roi;}));
  var grade=avg>=14?"Outstanding":avg>=8?"Strong":avg>=2?"Recovered the business":avg>=-6?"Still losing money":"The business is in trouble";
  var h='<div id="launch"><div class="lwrap">';
  h+='<button class="backlink" data-ltab="home">&larr; Back to the start</button>';
  h+='<h1 class="lhead2">Six rounds complete</h1>';
  h+='<p class="lsub2">'+esc(GCO.name)+' after three years under your management.</p>';
  h+='<div class="homegrid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">'+
     [["Average ROI",pct(avg,1),"the number the ranking uses"],
      ["Best round",pct(best,1),"your high water mark"],
      ["Verdict",grade,"against a 12% sector benchmark"]
     ].map(function(x){
       return '<div class="homecard" style="cursor:default"><span class="hnum">'+esc(x[0])+'</span>'+
         '<span class="htt">'+esc(x[1])+'</span><span class="hsub">'+esc(x[2])+'</span></div>';}).join("")+'</div>';
  h+='<div class="card" style="margin-top:22px;text-align:left"><div class="cardhead"><h3>Round by round</h3></div>'+
     '<div class="gridwrap"><table class="dg"><thead><tr><th>Round</th><th>ROI</th><th>Service</th>'+
     '<th>Revenue</th><th>Profit</th><th>Inventory</th></tr></thead><tbody>'+
     G.history.map(function(x){
       return '<tr><td class="code">Round '+x.round+'</td><td class="'+(x.roi>=8?"g":x.roi>=0?"w":"b")+'">'+pct(x.roi,1)+'</td>'+
         '<td class="'+(x.otif>=95?"g":x.otif>=88?"w":"b")+'">'+pct(x.otif,1)+'</td>'+
         '<td>'+money(x.rev)+'</td><td class="'+(x.profit>=0?"g":"b")+'">'+money(x.profit)+'</td>'+
         '<td>'+money(x.inv)+'</td></tr>';}).join("")+'</tbody></table></div>'+
     '<div style="margin-top:16px" data-gfinal="1"></div></div>';
  h+='<div class="pager" style="margin-top:18px">'+
     '<button class="pgbtn" data-gact="restart"><span class="ar">&#8635;</span><span>'+
     '<span class="lb">Try a different strategy</span><span class="tt">Play again from round one</span>'+
     '<span class="wy">The events fall in the same rounds, so you can test whether a change would have absorbed them.</span></span></button>'+
     '<button class="pgbtn nx" data-ltab="learn"><span class="ar">&rarr;</span><span>'+
     '<span class="lb">Understand what happened</span><span class="tt">Read the fundamentals</span>'+
     '<span class="wy">Every mechanic in this game has a chapter explaining the theory underneath it.</span></span></button></div>';
  h+='</div></div>';
  $("#app").innerHTML=h;
  /* the closing chart carries the 12% sector benchmark as a reference band,
     so the whole run is judged against an external standard */
  var el=$('[data-gfinal]');
  if(el) el.innerHTML=svgLine({w:540,h:220,x:G.history.map(function(x){return "R"+x.round;}),
    series:[{name:"ROI",color:"#00A67D",data:G.history.map(function(x){return x.roi;})},
            {name:"Service",color:"#4B63E8",data:G.history.map(function(x){return x.otif;})}],
    bands:[{y:12,label:"sector benchmark",color:"#8497AE"}]});
}

/* ===== BOOT =====
   One call. ST.sec is null, so render() delegates to renderLaunch(), which
   shows the splash. Every subsequent state change flows through the
   delegated listeners registered in section 6. */
render();
</script>
</body>
</html>
