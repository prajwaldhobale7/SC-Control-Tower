    o.lfoot='<tr><td>TOTAL</td><td>'+MODES[g.mode].label+'</td><td></td><td></td><td></td><td></td><td></td>'+
      '<td>'+pct(frShare,1)+'</td><td>'+money(M.freight)+'</td><td>'+fm(M.co2,0)+'</td><td></td></tr>';
    return o;
  },
  charts:function(M){
    var S=M.S,g=ST.g,o={};
    o.vrp=svgVrp(g.heuristic,g.vrpCap);
    /* the mode triangle: three indices normalised so they are comparable on
       one axis. Cost and carbon are indexed to OCEAN (the cheapest and
       cleanest), speed is 40 divided by transit days. */
    var ms=S.modes;
    o.modes=svgBars({w:460,h:210,x:ms.map(function(m){return MODES[m].label.split(" ")[0];}),
      yFmt:function(v){return fm(v,0);},
      series:[
        {name:"Cost",color:"#CE2B3C",data:ms.map(function(m){return MODES[m].eurPerKgKm/MODES.ocean.eurPerKgKm;})},
        {name:"Speed",color:"#00875E",data:ms.map(function(m){return 40/MODES[m].days;})},
        {name:"Carbon",color:"#556780",data:ms.map(function(m){return MODES[m].co2gPerTkm/12;})}]});
    /* density against value: the top-left quadrant is where air freight can
       be genuinely cheaper, the bottom-left is where you are shipping air */
    o.cube=svgScatter({w:460,h:290,xMin:0,xMax:Math.max.apply(null,M.rows.map(function(r){return r.sk.kg/Math.max(r.sk.cbm,1e-9);}))*1.15,
      yMin:0,yMax:Math.max.apply(null,M.rows.map(function(r){return r.sk.price||r.sk.cost;}))*1.15,
      xLabel:"density kg/m³  →   (below 250 = cubes out)",yLabel:"value per unit €  →",
      points:M.rows.map(function(r,i){return {x:r.sk.kg/Math.max(r.sk.cbm,1e-9),y:r.sk.price||r.sk.cost,
        color:PAL[i%PAL.length],short:r.sk.code.split("-")[1].slice(0,3),label:r.sk.code};})});
    return o;
  }
};

/* ============================== 07 WAREHOUSE ==============================
   The cheapest wins in the whole chain. Two independent levers — where things
   live, and how you pick them — plus the accuracy threshold that decides
   whether anybody trusts the planning system at all.
   ========================================================================= */
TABS.warehouse={n:"Warehouse",
  html:function(M){
    var h='';
    h+='<div class="grid2">';
    h+=card("Warehouse controls","the cheapest wins in the whole chain",
      seg({g:"slotting",label:"Slotting strategy",opts:[{v:"random",l:"Chaotic"},{v:"abc",l:"ABC velocity"},{v:"golden",l:"Golden zone + family"}],
        hint:"Where each SKU physically lives. Walking is 50-60% of a picker's time, so this is not a cosmetic decision.",
        why:"Slotting changes walking distance, which is over half of pick labour. A re-slot costs a weekend and beats most automation business cases."})+
      seg({g:"pickMethod",label:"Picking method",opts:[{v:"single",l:"Order by order"},{v:"batch",l:"Batch pick"},{v:"zone",l:"Zone + sort"}],
        hint:"Batch picking collects several orders in one trip and sorts afterwards. Zone picking gives each picker an area and passes orders between them.",
        why:"Picking method changes travel per order line, which changes labour cost and dock-to-despatch time."})+
      /* dock-to-stock appears on both this screen and sourcing, because it is
         simultaneously a warehouse process and a lead-time component */
      slider({g:"dockToStock",label:"Dock-to-stock time",min:0,max:9,suf:" days",
        hint:"Truck arrival to pickable stock. Anything sitting in goods-in unbooked is invisible to MRP, which will happily reorder it.",
        why:"Dock-to-stock adds directly to effective lead time and therefore to safety stock."})+
      sw({g:"cycleCount",label:"Cycle counting programme",sub:"A items monthly, C items annually",why:"Cycle counting finds root causes continuously instead of correcting numbers once a year."})+
      sw({g:"fefo",label:"FEFO enforced",sub:"First Expired First Out",why:"The oldest received is not always the soonest to expire, with mixed batch lead times, FIFO ships the wrong pallet."}));
    h+=card("Layout and pick path","one 8-line order",'<div data-chart="wh"></div>'+
      '<div data-live="whnote"></div>');
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Where warehouse time goes","typical manual pick operation",'<div data-chart="whtime"></div>'+
      '<p class="hint">Travel dominates. Everything else, the scanning, the picking motion, the paperwork, is a rounding error by comparison, '+
      'which is why almost every worthwhile warehouse project is really a project about walking less.</p>'+
      learn("Slotting properly, in four moves",
        viz(dgGolden(),"<b>A rack seen from the side.</b> The green band between waist and shoulder height is the fastest and safest place to pick from, and it is a small fraction of your total cube. Fill it with the items you pick most often, put slow-and-heavy on the floor and slow-and-light up top, and you have just cut your labour cost without buying anything.")+
        "<ul><li><b>Velocity first.</b> Rank by picks per period, not by units or value. A slow-moving expensive item does not belong in prime space; a fast-moving cheap one does.</li>"+
        "<li><b>Golden zone.</b> The band between knee and shoulder height is fastest to pick and safest for backs. Reserve it for your A-movers. Put slow and heavy items low, slow and light items high.</li>"+
        "<li><b>Family grouping.</b> Items ordered together should be stored together. Check the actual order lines, not the product hierarchy, the categories that marketing invented rarely match what customers buy in one basket.</li>"+
        "<li><b>Re-slot regularly.</b> Velocity changes with season and lifecycle. A slotting plan from eighteen months ago is now actively working against you.</li></ul>"+
        minor("Honeycombing is the space you lose when a pallet position is half-emptied and cannot be used for anything else. It is silent, universal, and typically worth 10-20% of your cube. Deep-lane storage makes it worse; narrower, shallower locations make it better at the cost of more aisles.")));
    h+=card("Inventory accuracy","and why it decides everything else",'<div data-chart="acc"></div>'+
      '<div data-live="accnote"></div>'+
      learn("The 97% threshold",
        "<p>Inventory record accuracy is the percentage of locations where system quantity matches physical quantity. It is the foundation the entire planning stack stands on, and it fails quietly.</p>"+
        "<p>Below roughly 97%, something predictable happens: planners stop trusting the system. They start keeping private spreadsheets, adding informal buffers, and phoning the warehouse to check before committing. Once that culture exists, <b>no software project will fix your planning</b>, because the software is no longer where the decisions are being made.</p>"+
        "<p>What actually restores it:</p>"+
        "<ul><li><b>Cycle counting</b> rather than annual stocktakes, count A items monthly, B quarterly, C annually. You find causes, not just discrepancies.</li>"+
        "<li><b>Root-cause every variance</b> above a threshold. Most accuracy loss traces to a handful of repeating process failures: unrecorded scrap, picks from the wrong location, receipts booked to the wrong unit of measure.</li>"+
        "<li><b>Scan discipline at every touch.</b> Chaotic storage is more space-efficient than fixed locations, but it is completely unusable without reliable scanning.</li></ul>"+
        minor("A stocktake that produces a big adjustment is not a success. It means you have been planning on fiction for a year and have now papered over it for another year. The number that matters is variance frequency, not variance value.")));
    h+='</div>';

    h+=card("Storage profile by line item","cube, velocity and zone",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Picks/qtr est.</th><th>Units held</th><th>m³ held</th>'+
      '<th>Pallets</th><th>Recommended zone</th><th>Shelf life</th><th>Rotation</th><th>Write-off risk</th>'+
      '</tr></thead><tbody data-live="wgrid"></tbody></table></div>'+
      '<p class="hint" style="margin-top:8px">Cube tells you what the warehouse costs; picks tell you what the labour costs. They are different rankings, '+
      'and slotting by the wrong one is the most common warehouse design error.</p>');
    return h;
  },
  live:function(M){
    var g=ST.g,o={};
    /* the labour index is multiplicative: slotting sets the walking distance,
       picking method sets how many trips that distance is spread over.
       100 is the worst case (chaotic storage, one order per trip). */
    var walkIdx=g.slotting==="random"?100:g.slotting==="abc"?72:61;
    var methodIdx=g.pickMethod==="single"?100:g.pickMethod==="batch"?63:71;
    var eff=walkIdx*methodIdx/100;
    o.whnote=nt(eff<50?"good":eff<80?"warn":"bad",
      "Pick labour index "+fm(eff,0)+" (100 = worst case)",
      (g.slotting==="random"?"Chaotic storage maximises space utilisation and maximises walking. ":
       g.slotting==="abc"?"ABC velocity zones cut walking by about 28% against chaotic. ":
       "Golden-zone placement with family grouping cuts walking by about 39% and reduces picker injury risk. ")+
      (g.pickMethod==="single"?"Order-by-order picking means one full trip per order, the simplest method and the most expensive.":
       g.pickMethod==="batch"?"Batch picking amortises the trip across several orders, typically cutting travel per line by a third.":
       "Zone picking removes long trips entirely but adds a sortation and consolidation step downstream.")+
      " Combined, you are at roughly "+fm(eff,0)+"% of the worst-case labour cost.");
    /* accuracy: a cycle-counting programme is worth about 4.4 points, and
       chaotic slotting and slow dock-to-stock each cost a little more */
    var acc=clamp((g.cycleCount?98.6:94.2)-(g.slotting==="random"?1.1:0)-(g.dockToStock>4?1.4:0),85,99.6);
    o.accnote = acc>=97? nt("good","Records are trustworthy",
        fm(acc,1)+"% accuracy. Above the 97% line, planners believe the system, MRP output is actionable, and nobody keeps a private spreadsheet. This is the quiet precondition for every other improvement on this screen.")
      : nt("bad","Below the trust threshold",
        fm(acc,1)+"% accuracy. Below 97%, MRP is planning on fiction and planners start working around the system. "+
        (g.cycleCount?"Your cycle counting programme is helping: the remaining loss is coming from slotting churn or slow dock-to-stock.":"Start a cycle counting programme: A items monthly, C items annually. It finds causes rather than correcting numbers once a year."));
    o.wgrid=M.rows.map(function(r){
      /* picks are estimated from demand over a sixth of an order quantity,
         which approximates a typical case-pick out of a pallet quantity */
      var picks=r.demand/Math.max(r.Q/6,1);
      var m3=r.avgInv*r.sk.cbm;
      var pallets=m3/1.65;                     /* usable cubic metres per pallet */
      var zone= r.sk.abc==="A"? "Golden zone, near dispatch" : r.sk.abc==="B"? "Mid aisle, waist height" : "High bay / far aisle";
      /* write-off risk: cover against 40% of shelf life for perishables,
         cover against 60 days for tech, a flat low score for everything else */
      var wr = r.sk.shelf>0? clamp(r.daysCover/(r.sk.shelf*0.4),0,3) : (M.S.key==="tech"? r.daysCover/60 : 0.2);
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.name)+'</span></td>'+
        '<td><span class="chip '+r.sk.abc.toLowerCase()+'">'+r.sk.abc+'</span> <span class="chip '+r.sk.xyz.toLowerCase()+'">'+r.sk.xyz+'</span></td>'+
        '<td>'+qty(picks)+'</td><td>'+qty(r.avgInv)+'</td><td>'+fm(m3,1)+'</td><td>'+fm(pallets,0)+'</td>'+
        '<td style="text-align:left">'+zone+'</td>'+
        '<td>'+(r.sk.shelf>0?fm(r.sk.shelf,0)+"d":", ")+'</td>'+
        '<td>'+(g.fefo?'<span class="chip x">FEFO</span>':'<span class="chip y">FIFO</span>')+'</td>'+
        '<td class="'+(wr<0.6?"g":wr<1.2?"w":"b")+'">'+(wr<0.6?"LOW":wr<1.2?"MED":"HIGH")+'</td></tr>';
    }).join("");
    return o;
  },
  charts:function(M){
    var g=ST.g,o={};
    o.wh=svgWarehouse(g,M.rows);
    /* the time split: travel is computed from the two strategy choices, and
       the REMAINDER is divided among the other four activities in fixed
       proportions, so the pie always totals 100 */
    var travel=g.slotting==="random"?55:g.slotting==="abc"?44:39;
    var mult=g.pickMethod==="batch"?0.66:g.pickMethod==="zone"?0.74:1;
    travel=travel*mult;
    var rest=100-travel;
    o.whtime=svgHBars({w:460,items:[
      {label:"Travel / walking",v:travel,txt:pct(travel,0),color:"var(--bad)"},
      {label:"Searching",v:rest*0.18,txt:pct(rest*0.18,0),color:"var(--warn)"},
      {label:"Picking motion",v:rest*0.42,txt:pct(rest*0.42,0),color:"var(--good)"},
      {label:"Paperwork / scan",v:rest*0.22,txt:pct(rest*0.22,0),color:"#8497AE"},
      {label:"Setup / other",v:rest*0.18,txt:pct(rest*0.18,0),color:"#8497AE"}]});
    /* the gauge is scaled 85-100 rather than 0-100, because the whole
       decision sits in the last fifteen points */
    var acc=clamp((g.cycleCount?98.6:94.2)-(g.slotting==="random"?1.1:0)-(g.dockToStock>4?1.4:0),85,99.6);
    o.acc=svgGauge({w:300,h:150,v:acc,min:85,max:100,txt:fm(acc,1)+"%",
      label:"inventory record accuracy · 97% is the trust line",
      color:acc>=97?"var(--good)":acc>=95?"var(--warn)":"var(--bad)"});
    return o;
  }
};

/* ============================== 08 FINANCE ==============================
   Translating all of it into cash. This screen exists because supply chain
   work stays invisible until somebody expresses it in money.
   ======================================================================= */
TABS.finance={n:"Finance",
  html:function(M){
    var h='';
    h+='<div class="grid2">';
    /* the three working-capital terms, plus service repeated here because it
       is a working-capital decision as much as a customer one */
    h+=card("Working capital controls","",
      slider({g:"holdRate",label:"Inventory carrying rate",min:0.08,max:0.45,step:0.01,suf:"",
        hint:"Annual cost of holding stock: capital, storage, insurance, shrinkage, obsolescence. Typically 18-35%. Yours is probably a number someone chose years ago.",
        why:"Carrying rate changes every EOQ, every service-level trade-off and every make-or-buy decision in the company."})+
      slider({g:"dso",label:"Customer payment terms (DSO)",min:15,max:120,suf:" days",
        hint:"Days sales outstanding. Longer terms may win the customer and cost you the cash.",
        why:"DSO adds directly to the cash-to-cash cycle."})+
      slider({g:"dpo",label:"Supplier payment terms (DPO)",min:20,max:120,suf:" days",
        hint:"Days payable outstanding. Subtracts from the cash cycle, and comes back in your next price negotiation.",
        why:"DPO subtracts from cash-to-cash. It is a loan from your supplier at their cost of capital, which is higher than yours."})+
      slider({g:"service",label:"Service level",min:80,max:99.9,step:0.1,suf:"%",
        hint:"Shown here too, because service is a working capital decision as much as a customer one.",
        why:"Service level is the single largest discretionary driver of inventory, and therefore of working capital."}));
    h+=card("Cash-to-cash cycle","days between paying and being paid",'<div data-chart="c2c"></div>'+
      '<div data-live="c2cnote"></div>'+
      learn("The number that gets you heard in the boardroom",
        viz(dgCash(),"<b>Follow the money along the timeline.</b> Goods arrive, and 35 days later you pay for them. They sell at day 60, and the customer pays at day 105. So from day 35 to day 105, seventy days, your cash is out of the building and has not come back. That gap is what the business has to fund, and it is the single number that turns supply chain work into something a CFO acts on.")+
        fx("C2C = DIO + DSO − DPO","Days inventory + days receivable − days payable.")+
        "<p>This is the translation layer between supply chain work and finance. It says: from the moment cash leaves the company to pay a supplier, how many days pass before cash comes back from a customer? Every one of those days has to be financed.</p>"+
        "<p>Three levers, and they are not equally available to you:</p>"+
        "<ul><li><b>DIO</b>: yours. Inventory policy, lead time, forecast accuracy, service level. This is where supply chain earns its seat.</li>"+
        "<li><b>DSO</b>: mostly sales and credit control's, though order accuracy and invoice quality sit with you more than people admit. A disputed invoice is a receivable that does not age, it just sits.</li>"+
        "<li><b>DPO</b>: procurement's. Real, but it is borrowing from suppliers who price it back in.</li></ul>"+
        minor("Learn to say your result in cash days. 'We cut six days of cash-to-cash' opens doors that 'we improved turns by 0.4' never will, same fact, completely different audience.")));
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Profit bridge","revenue to profit",'<div data-chart="pl"></div>'+
      '<div data-live="plnote"></div>');
    h+=card("Cost to serve by line item","who is actually profitable",'<div data-chart="cts"></div>'+
      '<p class="hint">Logistics, holding and decay cost as a share of each line\'s revenue. Almost every business that does this exercise honestly '+
      'discovers that some of its "profitable" products or customers are not.</p>'+
      learn("Cost to serve, and the uncomfortable conversation after it",
        "<p>Gross margin by product tells you almost nothing, because it charges every line the same average for the things that vary most: order frequency, drop size, packaging, returns, expediting, and the sheer amount of human attention a line consumes.</p>"+
        "<p>A proper cost-to-serve model allocates:</p>"+
        "<ul><li>Freight by actual weight, cube and lane, not as a percentage of revenue.</li>"+
        "<li>Warehouse cost by cube occupied and picks generated, separately, because they rank differently.</li>"+
        "<li>Inventory carrying by the stock that line actually causes, including its pipeline.</li>"+
        "<li>Obsolescence and write-off by where it genuinely lands.</li></ul>"+
        "<p>Then the awkward part: some lines and some customers turn out to be loss-making. The answer is rarely to fire them, it is usually to change the terms. Minimum order quantities, drop-size charges, different pack formats, longer lead times, or a different channel entirely.</p>"+
        fx("GMROI = Gross margin € ÷ Average inventory cost","Margin earned per euro of stock invested: a far better range-rationalisation metric than margin percentage alone.")));
    h+='</div>';

    h+=card("Reading the money, in plain English","no finance background needed",
      '<p class="lede" style="margin-top:-2px">Each card says what the number means, which direction you want it to move, and roughly where you sit on a sensible range. '+
      'If you only remember one thing: <b>profit and service you push up, cash days and cost you push down, and utilisation you keep in the middle.</b></p>'+
      '<div class="mexp" data-live="fexp"></div>'+
      nt("good","Why supply chain people learn to speak in cash days",
        "\"We improved inventory turns by 0.4\" means nothing outside the department. \"We took six days out of the cash cycle, which freed "+
        /* one quarter's revenue divided by 91 days, times six days */
        money(M.revenue/91*6)+" of working capital\" is the same fact, and it is the version that gets funded. Same work, different language, "+
        "completely different outcome for your budget and your career."));

    h+=card("P&L by line item","fully loaded",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Volume</th><th>Revenue</th><th>COGS</th><th>Gross %</th><th>Freight</th>'+
      '<th>Holding</th><th>Decay</th><th>Penalty</th><th>Profit</th><th>Net %'+dirMini('margin')+'</th><th>GMROI'+dirMini('gmroi')+'</th><th>Cost to serve'+dirMini('ctsPct')+'</th>'+
      '</tr></thead><tbody data-live="fgrid"></tbody><tfoot data-live="ffoot"></tfoot></table></div>'+
      minor("The gap between the gross margin column and the net margin column is the supply chain's P&L. It is usually the only place in the business where those costs are visible together, finance sees them as separate cost centres, and nobody else sees them at all."));
    return h;
  },
  live:function(M){
    var g=ST.g,o={};
    o.c2cnote = M.c2c>90? nt("bad","Cash cycle is long",
        fm(M.c2c,0)+" days: "+fm(M.dio,0)+" inventory + "+g.dso+" receivable − "+g.dpo+" payable. You are financing roughly "+
        money(M.revenue/91*M.c2c)+" of working capital. The inventory portion is the part you control directly.")
      : M.c2c<25? nt("good","Cash cycle is strong",
        fm(M.c2c,0)+" days. At this level the business is being partly financed by its own suppliers. Worth checking that DPO is contractually agreed rather than simply taken, the second version costs you in the next negotiation.")
      : nt("good","Cash cycle is conventional",
        fm(M.c2c,0)+" days, of which "+fm(M.dio,0)+" is inventory. That inventory portion is the piece supply chain owns outright, and it is where the next improvement will come from.");
    var svc=M.revenue>0? M.penalty/M.revenue*100:0;
    /* the P&L note NAMES the largest supply chain cost rather than listing
       all four, using an inline sort — the point is to direct attention */
    o.plnote=nt(M.margin>14?"good":M.margin>6?"warn":"bad","Net margin "+pct(M.margin,1),
      "Gross margin is "+pct((M.revenue-M.cogs)/Math.max(M.revenue,1)*100,1)+", and supply chain costs take "+
      pct((M.freight+M.holding+M.waste+M.excursion+M.penalty)/Math.max(M.revenue,1)*100,1)+
      " of that away. The largest single component is "+
      (function(){var arr=[["freight",M.freight],["holding",M.holding],["decay and waste",M.waste+M.excursion],["service penalties",M.penalty]];
        arr.sort(function(a,b){return b[1]-a[1];}); return arr[0][0]+" at "+money(arr[0][1]);})()+
      ". Service failure costs you "+pct(svc,1)+" of revenue in penalties and lost sales, which is usually more than the inventory that would have prevented it.");
    /* twelve explainer cards: the money view rather than the operations view */
    o.fexp=[
      mx("revenue",0,money(M.revenue),"g"),
      mx("profit",0,money(M.profit),M.profit>0?"g":"b"),
      mx("margin",M.margin,pct(M.margin,1),M.margin>=12?"g":M.margin>=5?"w":"b"),
      mx("bsInv",0,money(M.bsInv),"w"),
      mx("dio",M.dio,fm(M.dio,0)+" days",M.dio<=55?"g":M.dio<=90?"w":"b"),
      mx("c2c",M.c2c,fm(M.c2c,0)+" days",M.c2c<=45?"g":M.c2c<=80?"w":"b"),
      mx("turns",M.turns,fm(M.turns,1)+"×",M.turns>=6?"g":M.turns>=3?"w":"b"),
      mx("holding",0,money(M.holding),"w"),
      mx("freight",0,money(M.freight),"w"),
      mx("waste",0,money(M.waste+M.excursion),(M.waste+M.excursion)<M.revenue*0.01?"g":"b"),
      mx("penalty",0,money(M.penalty),M.penalty<M.revenue*0.01?"g":"b"),
      mx("overhead",0,money(M.overhead),"")
    ].join("");
    o.fgrid=M.rows.map(function(r){
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.name)+'</span></td>'+
        '<td>'+qty(r.served)+'</td><td>'+money(r.revenue)+'</td><td>'+money(r.cogs)+'</td>'+
        '<td class="'+(r.gm>35?"g":r.gm>20?"w":"b")+'">'+fm(r.gm,1)+'</td>'+
        '<td>'+money(r.freight)+'</td><td>'+money(r.holding)+'</td><td>'+money(r.waste+r.excursion)+'</td>'+
        '<td>'+money(r.penalty)+'</td><td>'+money(r.profit)+'</td>'+
        '<td class="'+(r.margin>14?"g":r.margin>5?"w":"b")+'">'+fm(r.margin,1)+'</td>'+
        '<td class="'+(r.gmroi>3?"g":r.gmroi>1.5?"w":"b")+'">'+fm(r.gmroi,2)+'</td>'+
        '<td>'+pct(r.ctsPct,1)+'</td></tr>';
    }).join("");
    o.ffoot='<tr><td>TOTAL</td><td>'+qty(M.served)+'</td><td>'+money(M.revenue)+'</td><td>'+money(M.cogs)+'</td>'+
      '<td>'+fm((M.revenue-M.cogs)/Math.max(M.revenue,1)*100,1)+'</td><td>'+money(M.freight)+'</td>'+
      '<td>'+money(M.holding)+'</td><td>'+money(M.waste+M.excursion)+'</td><td>'+money(M.penalty)+'</td>'+
      '<td>'+money(M.profit)+'</td><td>'+fm(M.margin,1)+'</td><td></td><td></td></tr>';
    return o;
  },
  charts:function(M){
    var g=ST.g,S=M.S,o={};
    /* the cash bridge: DIO as a total, then receivables added and payables
       subtracted, then the net as a second total */
    o.c2c=svgWaterfall({w:460,h:220,items:[
      {label:"Days inventory",v:M.dio,total:true},
      {label:"+ receivable",v:g.dso},
      {label:"− payable",v:-g.dpo},
      {label:"Cash cycle",v:M.c2c,total:true}]});
    o.pl=svgWaterfall({w:460,h:230,items:[
      {label:"Revenue",v:M.revenue,total:true},{label:"COGS",v:-M.cogs},{label:"Freight",v:-M.freight},
      {label:"Holding",v:-M.holding},{label:"Decay",v:-M.waste-M.excursion},{label:"Penalty",v:-M.penalty},{label:"Overhead",v:-M.overhead},
      {label:"Profit",v:M.profit,total:true}]});
    /* cost to serve, ranked: above 14% of revenue a line is probably
       loss-making once everything is allocated honestly */
    o.cts=svgHBars({w:460,items:M.rows.map(function(r){
      return {label:r.sk.code,v:r.ctsPct,txt:pct(r.ctsPct,1),
        color:r.ctsPct<6?"var(--good)":r.ctsPct<14?"var(--warn)":"var(--bad)"};})});
    return o;
  }
};

/* ============================== 09 RISK ==============================
   Resilience without a heat map: two answerable questions per node, and the
   gap between them expressed in days of unserved demand.
   ==================================================================== */
TABS.risk={n:"Risk",
  html:function(M){
    var S=M.S,h='';
    h+='<div class="grid2">';
    /* the control stack is heavily sector-conditional: three shared controls,
       then two for packaging and three for pharma. Each conditional returns
       an empty string when it does not apply, which concatenates harmlessly. */
    h+=card("Resilience controls","",
      seg({g:"sourcing",label:"Sourcing posture",opts:[{v:"single",l:"Single source"},{v:"dual",l:"Dual source"}],
        hint:"The single biggest lever on time-to-recover.",
        why:"Dual sourcing cuts TTR from "+(S.key==="pharma"?"118":"68")+" days to 22."})+
      slider({g:"ssMult",label:"Safety stock multiplier",min:0.4,max:2.2,step:0.1,suf:"×",
        hint:"Raises time-to-survive across the portfolio, and raises working capital in exact proportion.",
        why:"More buffer means more days of survival without supply. That is what buffer is actually for."})+
      slider({g:"ltStress",label:"Lead time environment",min:0.7,max:1.8,step:0.05,suf:"×",
        hint:"Test what happens when the whole environment degrades: congestion, capacity shortage, a bad year.",
        why:"Stressing lead times simultaneously raises pipeline stock, safety stock requirement and exposure."})+
      (S.key==="packaging"? sw({g:"recycled",label:"Recycled content substrate",
        sub:"Costs ~4.5% more per tonne, cuts the virgin-plastic levy by three quarters",
        why:"Recycled substrate raises material cost and lowers regulatory levy. The crossover moves every time the levy is revised."}):"")+
      (S.key==="packaging"? slider({g:"substrate",label:"Substrate price index",min:0.75,max:1.6,step:0.05,suf:"×",
        hint:"Test what a commodity spike does to a business where material is 60-70% of cost.",
        why:"A converter's exposure to substrate is structural, not a planning choice, which is why forward buying is one of the few good reasons to hold extra stock."}):"")+
      (S.key==="pharma"? seg({g:"cold",label:"Cold chain solution",opts:[{v:"passive",l:"Passive"},{v:"hybrid",l:"Hybrid"},{v:"active",l:"Active"}],
        hint:"Passive is insulated packaging with phase-change packs, qualified for a stated duration. Active is powered, controlled, and reports in real time.",
        why:"Cold chain solution determines excursion probability and therefore quarantine risk on every 2-8°C line."}):"")+
      (S.key==="pharma"? slider({g:"qpDays",label:"QP release lead time",min:1,max:21,suf:" days",
        hint:"Batch certification by a Qualified Person. It sits on top of every manufacturing lead time and creates quarantine stock.",
        why:"QP release adds to effective lead time and converts finished stock into quarantine stock, present, owned, unavailable."}):"")+
      (S.key==="pharma"? sw({g:"serial",label:"Serialisation compliant",sub:"Pack-level identifiers and aggregation",
        why:"Non-compliance blocks market access. Aggregation errors surface at the wholesaler, not in your warehouse."}):""));
    h+=card("Time to survive vs time to recover","the only risk metric worth reporting",
      '<div data-chart="ttr"></div>'+
      '<div data-live="ttrnote"></div>'+
      learn("Why TTR/TTS beats every risk heat map",
        viz(dgTTR(),"<b>One timeline, two lengths.</b> Your stock lasts 28 days. Their recovery takes 68. The red bar is the 40 days in between, during which you have nothing to sell. Every risk conversation becomes concrete the moment it is expressed this way, and there is exactly one question to ask each supplier to get the grey bar.")+
        "<p>The standard approach, rank risks by likelihood × impact, colour the grid, feels rigorous and fails for two reasons. Supply chain catastrophes are low-likelihood, so they rank low. And they are correlated, so the grid treats nine suppliers in one industrial park as nine independent risks when they are one risk wearing nine badges.</p>"+
        "<p>The alternative asks two answerable questions about every node:</p>"+
        "<ul><li><b>Time to recover (TTR)</b>: how long would this node take to resume full function after a serious disruption? Ask the supplier. Most have never been asked and will have to go and find out, which is itself informative.</li>"+
        "<li><b>Time to survive (TTS)</b>: how long could you keep serving customers if this node stopped, given current inventory and alternatives?</li></ul>"+
        fx("Exposure = TTR − TTS","In days. Positive means a gap. No colours required.")+
        "<p>The output is a list of nodes with a number of days beside each. That is a board-level conversation: 'if this supplier stops, we run out in 11 days and they need 68 to recover, here are three options and what each costs.' A heat map cannot produce that sentence.</p>"+
        minor("Map by revenue at risk, not by spend. The €4,000-a-year sole-source label printer that halts every line is a far bigger exposure than the €4m component with three qualified sources, and it will never appear on a procurement spend analysis.")));
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Days of survival by line item","if supply stopped today",'<div data-chart="tts"></div>'+
      '<p class="hint">Each bar is how long that product could keep serving demand from stock on hand and in transit. '+
      'The shortest bar on an A item is your real exposure, regardless of what the portfolio average says.</p>');
    h+=card("Disruption calendar","this simulated year",'<div data-live="events"></div>');
    h+='</div>';

    /* the two sector-specific deep dives. Both write into the same
       [data-live="pharmarisk"] slot — only one can ever be present. */
    if(S.key==="packaging"){
      h+=card("Converter-specific exposures","waste, artwork and regulation",
        '<div data-live="pharmarisk"></div>'+
        learn("Why packaging supply chains behave differently",
          "<p>A converter is not a manufacturer with customers, it is a supplier of somebody else's raw material, and almost every constraint follows from that.</p>"+
          "<ul><li><b>Your finished goods have exactly one possible buyer.</b> Printed to one brand's artwork, in their colours, with their barcode. If they rebrand, your stock is scrap value. This is the single largest difference from every other sector in this app.</li>"+
          "<li><b>Material is 60-70% of cost and index-linked.</b> Kraftliner, resin, film and foil are traded commodities. A spike lands on your P&amp;L immediately and reprices to the customer on a lag, if at all. Conversion efficiency is the only margin you genuinely control.</li>"+
          "<li><b>Waste happens before the first good unit.</b> Make-ready substrate is consumed on every changeover, which turns run length into a direct material cost rather than just a capacity question.</li>"+
          "<li><b>Your customers hold no stock.</b> They run JIT into a filling line, so their buffer sits in your warehouse. If that was not priced into the contract, you are funding their working capital.</li>"+
          "<li><b>Regulation prices the material itself.</b> Producer responsibility levies and recycled-content mandates mean substrate choice is now a compliance decision with a deadline that cannot slip.</li></ul>"+
          minor("The clause that matters most in a packaging contract is rarely price. It is who owns obsolete stock when artwork changes, and what notice period applies. Converters who never negotiated it discover the answer during a rebrand, which is the worst possible time.")));
    }
    if(S.key==="pharma"){
      h+=card("Pharma-specific exposures","GxP, cold chain and release",
        '<div data-live="pharmarisk"></div>'+
        learn("Why pharma supply chains behave differently",
          "<p>Every constraint in this sector traces back to one fact: the product is a medicine, and the regulator's question is not 'did it arrive' but 'can you prove it was made, stored and moved correctly, and can you find every pack if it was not'.</p>"+
          viz(dgCold(),"<b>A temperature logger's record from one shipment.</b> The green band is the labelled 2-8°C range. The genset failed and the load spent eleven hours above it. Nothing here proves the product is damaged, but it cannot be sold until a Qualified Person has assessed it against the stability data, and that assessment takes time you do not have.")+
          "<ul><li><b>Release, not production, is the finish line.</b> A Qualified Person must personally certify every batch before sale. Physical stock is not available stock, and quarantine inventory sits on your balance sheet servicing nobody.</li>"+
          "<li><b>Temperature is a quality attribute.</b> An excursion outside 2-8°C does not automatically destroy product, stability data and a QP assessment decide. But the stock is frozen commercially while that runs, which is a service failure whatever the quality verdict.</li>"+
          "<li><b>Shelf life is commercial, not just legal.</b> Customers and tenders routinely demand 75-85% of shelf life remaining on receipt. Product that is in date and compliant can still be worthless.</li>"+
          "<li><b>API concentration is structural.</b> A large share of active ingredients comes from a small number of sites. Qualifying an alternative takes 18-36 months plus a regulatory variation, so the mitigation has to be funded years before the risk arrives, which is exactly why it usually is not.</li>"+
          "<li><b>Serialisation is a supply chain process, not an IT project.</b> Pack-to-case-to-pallet aggregation errors are discovered at the wholesaler, and by then the pallet has been broken down.</li></ul>"+
          minor("When planning a product launch here, the constraint is almost never manufacturing capacity. It is stability data, artwork approval market by market, and QP capacity. Plan those three as critical path and the factory will look easy.")));
    }

    h+=card("Risk register · every line item","exposure, not opinion",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Source</th><th>Lead time</th><th>Days of cover'+dirMini('daysCover')+'</th>'+
      '<th>TTS'+dirMini('tts')+'</th><th>TTR'+dirMini('ttr')+'</th><th>Exposure'+dirMini('exposure')+'</th><th>Revenue at risk</th><th>Rating</th>'+
      '</tr></thead><tbody data-live="rgrid"></tbody></table></div>'+
      '<p class="hint" style="margin-top:8px">Sort this by revenue at risk rather than by spend and the priorities usually rearrange themselves completely.</p>');
    return h;
  },
  live:function(M){
    var g=ST.g,S=M.S,o={};
    /* the exposure verdict converts days into money, because "40 days" only
       becomes a board conversation once it has a euro figure beside it */
    o.ttrnote = M.exposure>40? nt("bad","Serious recovery gap",
        "Your most exposed A item survives "+fm(M.tts,0)+" days without supply; recovery takes "+fm(M.ttr,0)+" days. That is <b>"+
        fm(M.exposure,0)+" days</b> of unserved demand, roughly "+money(M.revenue/91*M.exposure)+" of revenue. Dual sourcing cuts TTR; more cover raises TTS. Both cost money, and choosing between them is the job.")
      : M.exposure>0? nt("warn","Manageable gap",
        fm(M.exposure,0)+" days of exposure. Survivable but uncomfortable, a disruption would be visible to customers. Worth knowing which specific SKU is the binding constraint rather than treating it as a portfolio number.")
      : nt("good","Covered",
        "Time to survive ("+fm(M.tts,0)+" days) exceeds time to recover ("+fm(M.ttr,0)+" days) on your critical items. You could absorb a supplier failure without a customer noticing. Check that this is a deliberate position and not an accident of high inventory.");
    /* the disruption calendar shows the WHOLE year at once, past and future.
       Past outcomes come from the history snapshot's `mit` flag, so the
       calendar is a genuine record rather than a re-evaluation. */
    o.events=(function(){
      var h='';
      S.events.forEach(function(e){
        var past=e.q<ST.q, now=e.q===ST.q;
        var rec=ST.hist.filter(function(x){return x.q===e.q;})[0];
        var st = now? (M.mitigated?"ABSORBED":"LIVE") : past? (rec&&rec.mit?"ABSORBED":"HIT") : "PENDING";
        var tn = st==="ABSORBED"?"good":st==="HIT"||st==="LIVE"?"bad":"";
        h+='<div class="note '+tn+'" style="margin:6px 0"><span class="h">Q'+e.q+' · '+st+'</span>'+
           '<b>'+esc(e.name)+'</b><br>'+esc(e.desc)+
           '<br><span style="opacity:.72">'+esc(e.tip)+'</span></div>';
      });
      return h;
    })();
    o.rgrid=M.rows.map(function(r){
      /* per-line TTR: dual-sourced lines recover in 22 days; the pharma API
         is a special case at 180, because it needs a regulatory variation */
      var ttr = r.src==="dual"?22:(S.key==="pharma"&&r.sk.code==="AP-API3"?180:M.ttr);
      var exp=Math.max(0,ttr-r.daysCover);
      var rev=r.revenue/91*exp;                  /* revenue at risk, in euro */
      var rate = exp>60?"CRITICAL":exp>25?"HIGH":exp>0?"MEDIUM":"LOW";
      var rc = rate==="CRITICAL"?"b":rate==="HIGH"?"b":rate==="MEDIUM"?"w":"g";
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.src||"")+'</span></td>'+
        '<td><span class="chip '+r.sk.abc.toLowerCase()+'">'+r.sk.abc+'</span></td>'+
        '<td>'+(r.src==="dual"?'<span class="chip x">DUAL</span>':'<span class="chip z">SINGLE</span>')+'</td>'+
        '<td>'+fm(r.lt,0)+'d</td><td>'+fm(r.daysCover,0)+'d</td>'+
        '<td>'+fm(r.daysCover,0)+'d</td><td>'+fm(ttr,0)+'d</td>'+
        '<td class="'+rc+'">'+fm(exp,0)+'d</td>'+
        '<td>'+money(rev)+'</td><td class="'+rc+'">'+rate+'</td></tr>';
    }).join("");
    /* --- packaging deep dive: three columns of statlines --- */
    if(S.key==="packaging"){
      var plastics=M.rows.filter(function(r){return /resin/i.test(r.sk.src||"");});
      var mr=sum(M.rows.map(function(r){return r.makeReady||0;}));
      /* "printed stock" is approximated by any line with a short shelf life,
         because in this sector shelf life encodes artwork stability */
      var art=M.rows.filter(function(r){return r.sk.shelf>0&&r.sk.shelf<=240;});
      o.pharmarisk='<div class="grid3">'+
        '<div>'+statline("Make-ready waste",money(mr),mr>M.revenue*0.02?"b":"w")+
        statline("As % of revenue",pct(mr/Math.max(M.revenue,1)*100,2),mr>M.revenue*0.02?"b":"g")+
        statline("Campaign length",g.batchDays+" days")+
        statline("SMED programme",g.smed?"Running":"None",g.smed?"g":"w")+'</div>'+
        '<div>'+statline("Printed-stock lines",art.length+" of "+M.rows.length)+
        statline("Artwork at risk",money(sum(art.map(function(r){return r.invVal;}))),"w")+
        statline("Shortest artwork window",fm(Math.min.apply(null,art.map(function(r){return r.sk.shelf;})),0)+" days","w")+
        /* total waste minus make-ready leaves the obsolescence component */
        statline("Obsolescence cost",money(M.waste-mr),(M.waste-mr)>M.revenue*0.01?"b":"g")+'</div>'+
        '<div>'+statline("Virgin-plastic lines",plastics.length)+
        statline("Recycled content",g.recycled?"Compliant":"Virgin only",g.recycled?"g":"b")+
        statline("EPR levy",money(M.excursion),M.excursion>M.revenue*0.01?"b":"g")+
        statline("Substrate index",fm(g.substrate,2)+"×",g.substrate>1.15?"b":g.substrate>1.0?"w":"g")+'</div></div>'+
        nt(g.recycled?"warn":"bad","The structural exposure",
          "Two things here are outside your control and inside your P&L. <b>Substrate</b> is 60-70% of cost and index-linked, so a commodity move lands on you before you can reprice. "+
          "<b>Artwork</b> belongs to your customer, a rebrand you were not consulted on can make every printed reel in the building unsellable overnight. "+
          "The only real defences are short finished-goods cover on printed lines, and a contract that says who owns obsolete stock. Most converters discover they never agreed that clause.");
    }
    /* --- pharma deep dive: cold chain, release, and the API --- */
    if(S.key==="pharma"){
      var cold=M.rows.filter(function(r){return /2-8/.test(r.sk.temp||"");});
      o.pharmarisk='<div class="grid3">'+
        '<div>'+statline("Cold chain lines",cold.length+" of "+M.rows.length)+
        statline("Shipper type",g.cold==="active"?"Active":g.cold==="hybrid"?"Hybrid":"Passive",g.cold==="active"?"":"w")+
        statline("Excursion cost/qtr",money(M.excursion),M.excursion>M.revenue*0.005?"b":"")+
        statline("Cold chain value",money(sum(cold.map(function(r){return r.invVal;}))))+'</div>'+
        '<div>'+statline("QP release time",g.qpDays+" days",g.qpDays>12?"w":"")+
        statline("Quarantine stock",qty(sum(M.rows.map(function(r){return r.quarantine;}))))+
        statline("Quarantine value",money(sum(M.rows.map(function(r){return r.quarantine*r.sk.cost;}))),"w")+
        statline("Serialisation",g.serial?"Compliant":"NON-COMPLIANT",g.serial?"":"b")+'</div>'+
        /* these four are constants: they describe a structural position that
           no control on this screen can change within the eight quarters */
        '<div>'+statline("API source","Single · Hyderabad","b")+
        statline("API lead time","245 days")+
        statline("Requalification","18-36 months","b")+
        statline("FEFO",g.fefo?"Enforced":"FIFO only",g.fefo?"":"w")+'</div></div>'+
        nt(g.cold==="passive"&&g.mode!=="reefer"?"bad":"warn","The structural exposure",
          "AP-API3 is single-sourced from one site with a 245-day lead time, and it feeds AP-OS12, the commercial backbone of the company. "+
          "Changing that source requires qualification plus a regulatory variation, so it cannot be done reactively. This is not a risk you mitigate during a disruption; "+
          "it is one you either funded three years ago or you did not.");
    }
    return o;
  },
  charts:function(M){
    var S=M.S,o={};
    /* two bars, one comparison. The colour is decided by whether a gap exists
       at all, not by the magnitude. */
    o.ttr=svgBars({w:460,h:210,x:["Time to survive","Time to recover"],yFmt:function(v){return fm(v,0)+"d";},valLabels:true,
      series:[{name:"days",color:M.exposure>0?"#CE2B3C":"#00875E",data:[M.tts,M.ttr]}]});
    /* per-line survival, coloured against that line's OWN recovery time:
       green if cover exceeds TTR, amber above half, red below */
    o.tts=svgHBars({w:460,items:M.rows.map(function(r){
      var ttr=r.src==="dual"?22:M.ttr;
      return {label:r.sk.code,v:r.daysCover,txt:fm(r.daysCover,0)+"d",
        color:r.daysCover>=ttr?"var(--good)":r.daysCover>=ttr*0.5?"var(--warn)":"var(--bad)"};})});
    return o;
  }
};

/* ============================== 10 REVIEW ==============================
   S&OP. The monthly rhythm, the year's track record, and a single graded
   score that weights five KPIs together — because optimising any one alone
   is the classic failure mode.
   ====================================================================== */
TABS.review={n:"S&OP review",
  html:function(M){
    var S=M.S,h='';
    /* the five-step cycle advances one step per quarter, cycling every five,
       so the screen shows a different phase each time you visit it */
    var phase=(ST.q-1)%5;
    var PH=[
      ["Data gathering","Clean actuals: sales, shipments, inventory, capacity, open orders. Bad data in, bad plan out, and this step is where most S&OP processes quietly fail."],
      ["Demand review","Sales and marketing agree one unconstrained forecast. Promotions, launches and known customer changes are surfaced here or they are not surfaced at all."],
      ["Supply review","Operations tests the demand plan against capacity, materials and lead times. Gaps are identified in units and in weeks, not in adjectives."],
      ["Pre-S&OP","Cross-functional reconciliation of the gaps into two or three scenario options, each with its euro impact and its risk stated plainly."],
      ["Executive IBP","Leadership picks one integrated plan covering volume, money and risk, which every function then executes. One plan, one number, one meeting."]
    ];
    h+=card("S&OP cycle · month "+(phase+1)+" of the rhythm","where you are now",
      '<div class="grid3">'+PH.map(function(p,i){
        return '<div style="padding:10px;border-radius:7px;border:1.5px solid '+(i===phase?"var(--acc)":"var(--rule)")+
          ';background:'+(i===phase?"var(--accSoft)":"#fff")+'">'+
          '<div class="eyebrow">Step '+(i+1)+(i===phase?" · now":"")+'</div>'+
          '<b style="font-size:13px">'+esc(p[0])+'</b>'+
          '<div class="hint" style="margin-top:3px">'+esc(p[1])+'</div></div>';}).join("")+'</div>'+
      learn("S&OP versus IBP, and why most implementations disappoint",
        "<p><b>Sales and Operations Planning</b> is a monthly rhythm that forces one agreed plan across demand, supply and finance. <b>Integrated Business Planning</b> is the same rhythm extended to include the financial plan and the strategic initiatives, so the numbers presented to the board and the numbers driving the factory are the same numbers.</p>"+
        "<p>Where it goes wrong is almost never the process diagram. It is:</p>"+
        "<ul><li><b>No decisions are actually made.</b> If the executive meeting reviews performance rather than choosing between options, it is a reporting meeting wearing a costume.</li>"+
        "<li><b>The unconstrained forecast is never recorded.</b> Without it you lose all memory of demand you turned away, and you end up forecasting your own shortages forever.</li>"+
        "<li><b>Finance is absent.</b> Then the plan has no euro impact, so nobody senior cares, so nobody senior attends, so no decisions are made.</li>"+
        "<li><b>The gap is presented as a problem rather than as options.</b> 'We are 40,000 units short' invites panic. 'We are 40,000 short: option A costs €180k in air freight, option B gives up €400k of revenue on the C lines, I recommend A' invites a decision.</li></ul>"+
        minor("The single highest-value habit in this process is bringing two or three costed scenarios rather than one answer. It changes your role from the person who reports bad news to the person who frames the choice, and that is the difference between a planner and a supply chain leader.")));

    if(ST.hist.length){
      h+='<div class="grid2">';
      h+=card("Performance across the year","closed quarters",'<div data-chart="rv1"></div>'+
        legend([["OTIF %",S.acc],["Margin %","#00875E"],["Forecast error %","#CE2B3C"]]));
      h+=card("Working capital and carbon","",'<div data-chart="rv2"></div>'+
        legend([["Cash-to-cash days","#4B63E8"],["Carbon kg per €1k","#556780"]]));
      h+='</div>';
      h+=card("Scorecard","weighted across closed quarters",'<div data-live="score"></div>');
      h+=card("Quarter by quarter","including how each disruption landed",
        '<div class="gridwrap"><table class="dg"><thead><tr>'+
        '<th>Quarter</th><th>OTIF'+dirMini('otif')+'</th><th>Margin'+dirMini('margin')+'</th><th>Inventory</th><th>C2C</th><th>Fcst err'+dirMini('mape')+'</th>'+
        '<th>Util</th><th>Resilience</th><th>Profit</th><th>Disruption</th><th>Outcome</th>'+
        '</tr></thead><tbody data-live="hgrid"></tbody></table></div>');
    } else {
      h+=card("Nothing closed yet","",'<p class="hint" style="margin:0">Close a quarter from the header and your results appear here. '+
        'The eight-quarter arc exists because several decisions on this dashboard, dual sourcing, capacity, shorter lead times, a SMED programme, '+
        'cost money now and only pay back when the disruption they were bought for actually arrives.</p>');
    }
    return h;
  },
  live:function(M){
    var o={};
    if(!ST.hist.length) return o;
    var avg=function(k){return sum(ST.hist.map(function(x){return x[k];}))/ST.hist.length;};
    var otif=avg("otif"),mg=avg("margin"),res=avg("res"),c2c=avg("c2c"),mape=avg("mape");
    /* THE COMPOSITE SCORE
       Five weighted terms. The two inverted metrics (cash days and forecast
       error) are converted to "higher is better" before weighting. The
       weights are chosen so a genuinely balanced operation lands near 70:
         OTIF        0.34 on a ~95 base  ≈ 32
         margin      1.50 on a ~12 base  ≈ 18
         resilience  0.22 on a ~65 base  ≈ 14
         cash        0.14 on (100−55)    ≈  6
         forecast    0.12 on (100−2×14)  ≈  9                              */
    var score=clamp(otif*0.34+mg*1.5+res*0.22+clamp(100-c2c,0,100)*0.14+clamp(100-mape*2,0,100)*0.12,0,100);
    /* the grade names a ROLE rather than a letter alone, because the point is
       what kind of supply chain professional the configuration implies */
    var grade=score>78?"A · Orchestrator":score>66?"B · Planner":score>54?"C · Coordinator":score>42?"D · Firefighter":"E · Expediter";
    var gd=score>66?"g":score>54?"w":"b";
    var mits=ST.hist.filter(function(x){return x.ev&&x.mit;}).length;
    var hits=ST.hist.filter(function(x){return x.ev&&!x.mit;}).length;
    o.score='<div class="row" style="align-items:flex-start;gap:20px">'+
      '<div><div class="eyebrow">Overall</div><div class="bignum '+gd+'" style="font-size:38px">'+fm(score,0)+'</div>'+
      '<b style="font-family:var(--mono);letter-spacing:.06em">'+grade+'</b></div>'+
      '<div style="flex:1;min-width:220px">'+
      statline("Average OTIF",pct(otif,1),otif>93?"g":otif>88?"w":"b")+
      statline("Average margin",pct(mg,1),mg>12?"g":mg>6?"w":"b")+
      statline("Average forecast error",pct(mape,1),mape<14?"g":"w")+
      statline("Average cash-to-cash",fm(c2c,0)+" days",c2c<55?"g":"w")+
      statline("Average resilience",fm(res,0),res>62?"g":"w")+
      statline("Disruptions absorbed",mits+" of "+(mits+hits),hits===0?"g":mits>=hits?"w":"b")+
      '</div></div>'+
      /* the closing note cuts both ways: taking hits is criticised, but so is
         absorbing everything, because insurance you never needed still cost
         margin. Neither outcome is automatically the right one. */
      nt(gd==="g"?"good":gd==="w"?"warn":"bad","What the score is measuring",
        "Service, margin, resilience, cash and forecast quality, weighted together, because optimising any one of them alone is the classic failure mode. "+
        (hits>0?"You took "+hits+" disruption"+(hits>1?"s":"")+" at full force. Look back at what would have absorbed each one; the mitigation was almost always available and looked like waste beforehand.":
        "You absorbed every disruption that landed. Worth checking what that insurance cost you in margin, the answer is not automatically that it was worth it."));
    o.hgrid=ST.hist.map(function(x){
      return '<tr><td class="code">Q'+x.q+'</td>'+
        '<td class="'+(x.otif>93?"g":x.otif>88?"w":"b")+'">'+fm(x.otif,1)+'</td>'+
        '<td class="'+(x.margin>12?"g":x.margin>6?"w":"b")+'">'+fm(x.margin,1)+'</td>'+
        '<td>'+money(x.inv)+'</td><td>'+fm(x.c2c,0)+'d</td><td>'+fm(x.mape,1)+'</td>'+
        '<td>'+fm(x.util,0)+'</td><td>'+fm(x.res,0)+'</td><td>'+money(x.profit)+'</td>'+
        '<td style="text-align:left">'+(x.ev?esc(x.ev):", ")+'</td>'+
        '<td class="'+(x.ev?(x.mit?"g":"b"):"")+'">'+(x.ev?(x.mit?"ABSORBED":"FULL HIT"):", ")+'</td></tr>';
    }).join("");
    return o;
  },
  charts:function(M){
    if(!ST.hist.length) return {};
    var S=M.S,L=ST.hist.map(function(x){return "Q"+x.q;});
    return {
      /* service and margin share a 0-100 axis with forecast error, which is
         legitimate because all three are percentages */
      rv1:svgLine({x:L,w:460,h:200,yMax:100,series:[
        {name:"OTIF",color:S.acc,data:ST.hist.map(function(x){return x.otif;})},
        {name:"Margin",color:"#00875E",data:ST.hist.map(function(x){return x.margin;})},
        {name:"MAPE",color:"#CE2B3C",data:ST.hist.map(function(x){return x.mape;}),dash:true}]}),
      rv2:svgLine({x:L,w:460,h:200,series:[
        {name:"C2C",color:"#4B63E8",data:ST.hist.map(function(x){return x.c2c;})},
        {name:"Carbon kg/€1k",color:"#556780",data:ST.hist.map(function(x){return x.co2;}),dash:true}]})
    };
  }
};

/* ============================== 11 LIBRARY ==============================
   Everything referenced anywhere in the app, collected. Unlike every other
   tab this one has no live(), cells() or charts(): it is entirely static
   content built from the data tables in section 3, so it never repaints.
   ======================================================================= */
TABS.library={n:"Library",
  html:function(M){
    /* derive the category chip list from the data, with a uniqueness filter,
       so adding a glossary category needs no code change here */
    var cats=["ALL"].concat(GLOSSARY.map(function(g){return g[1];}).filter(function(v,i,a){return a.indexOf(v)===i;}));
    var h='';
    /* field notes, grouped by area. The IIFE builds the grouping map inline
       because it is needed exactly once. */
    h+=card("The small things nobody writes down","field notes · "+MINOR.length+" of them",
      '<p class="lede" style="margin-bottom:10px">Textbooks teach the formulas. These are the things you normally only learn in year two, '+
      'usually by getting one of them wrong in front of somebody important.</p>'+
      (function(){
        var groups={};
        MINOR.forEach(function(m){ (groups[m[0]]=groups[m[0]]||[]).push(m[1]); });
        return Object.keys(groups).map(function(k){
          return '<h4 style="margin:14px 0 6px">'+esc(k)+'</h4>'+
            groups[k].map(function(t){return '<div class="minor" style="margin:5px 0"><span class="h">'+esc(k)+'</span>'+t+'</div>';}).join("");
        }).join("");
      })());

    /* the direction table: every metric in DIR, with its plain-English
       meaning and the reason for its preferred direction */
    h+=card("Which way is good? Every metric in one place","for anyone without a finance background",
      '<p class="lede" style="margin-top:-2px">The hardest part of a numbers-heavy job is not the arithmetic, it is knowing which direction each number should move, '+
      'and which ones you deliberately keep in the middle rather than maximising.</p>'+
      '<div class="gridwrap"><table class="dg"><thead><tr><th>Metric</th><th>Direction</th><th>What it means</th><th>Why that direction</th></tr></thead><tbody>'+
      Object.keys(DIR).map(function(k){var D=DIR[k];
        return '<tr><td class="code">'+esc(D.n)+'</td>'+
          '<td style="text-align:left">'+dirTag(k)+'</td>'+
          '<td style="text-align:left;white-space:normal;min-width:250px">'+esc(D.p)+'</td>'+
          '<td style="text-align:left;white-space:normal;min-width:250px">'+esc(D.why)+'</td></tr>';}).join("")+
      '</tbody></table></div>'+
      minor("Two of these are deliberately mid-range, and they catch people out. <b>Utilisation</b> looks like something to maximise and is not, past about 90% queue times explode and delivery gets worse. <b>Days of cover</b> is the same: too little stocks out, too much decays and ties up cash. Anyone who tells you to maximise either one has not run an operation."));

    h+=card("The decoupling point","where prediction stops and fact begins",
      viz(dgDecoupling(),"<b>The dashed line is where a real customer order first touches the product.</b> Everything to the left of it is made on a guess; everything to the right is made against a fact. Move the line to the right and customers wait less but you hold more finished goods. Move it left and you hold less but quote longer lead times. Choosing where it sits is one of the few genuinely strategic decisions in supply chain.")+
      "<p>This is why paint shops mix colour at the counter rather than stocking 3,000 tins, why laptops are configured after the order, and why a restaurant holds ingredients rather than finished meals. In every case, someone moved the decoupling point to the last possible moment before the product becomes specific.</p>");

    /* the formula sheet, grouped by the `g` field */
    h+=card("Formula sheet","everything the engine actually uses",
      (function(){
        var groups={};
        FORMULAS.forEach(function(f){ (groups[f.g]=groups[f.g]||[]).push(f); });
        return Object.keys(groups).map(function(k){
          return '<h4 style="margin:14px 0 4px">'+esc(k)+'</h4>'+
            groups[k].map(function(f){return fx(esc(f.f),esc(f.w));}).join("");
        }).join("");
      })());

    h+=card("Incoterms 2020","who pays, who bears the risk, and where they part company",
      '<div class="gridwrap"><table class="dg"><thead><tr><th>Rule</th><th>Name</th><th>Risk transfers</th><th>Cost transfers</th><th>What to know</th></tr></thead><tbody>'+
      INCOTERMS.map(function(i){
        return '<tr><td class="code">'+i[0]+'</td><td style="text-align:left">'+esc(i[1])+'</td>'+
          '<td style="text-align:left">'+esc(i[2])+'</td><td style="text-align:left">'+esc(i[3])+'</td>'+
          '<td style="text-align:left;white-space:normal;min-width:280px">'+esc(i[4])+'</td></tr>';}).join("")+
      '</tbody></table></div>'+
      nt("warn","The expensive misunderstanding","Cost and risk do not always transfer at the same point. Under CFR and CIF, risk passes when the goods are loaded at origin while the seller keeps paying freight to the destination port, so cargo lost mid-ocean is the buyer's loss on a shipment the seller is still funding. Check who is insured for that gap, in writing, before it matters."));

    /* the filtered glossary. Filtering re-renders the whole tab via render(),
       which is acceptable here because the Library has no input focus to lose */
    h+=card("Glossary","filter by area · "+GLOSSARY.length+" terms",
      '<div class="seg" style="margin-bottom:10px">'+cats.map(function(c){
        return '<button data-gcat="'+c+'" class="'+(ST.glossCat===c?"on":"")+'">'+esc(c)+'</button>';}).join("")+'</div>'+
      GLOSSARY.filter(function(g){return ST.glossCat==="ALL"||g[1]===ST.glossCat;}).map(function(g){
        return '<div class="gl"><div class="cat">'+esc(g[1])+'</div><div class="t" style="font-size:13px">'+esc(g[0])+
          '</div><div class="d" style="font-size:13px">'+esc(g[2])+'</div></div>';}).join(""));

    /* the model disclosure: exactly how each headline number is derived,
       so the reader can argue with the engine rather than trust it */
    h+=card("How this simulator computes things","so you can argue with it",
      '<p class="lede">Nothing here is a lookup table. Every figure comes from the formulas in the sheet above, applied per product code and rolled up. The main chains are:</p>'+
      '<ul style="font-size:13.5px;line-height:1.65">'+
      '<li><b>Demand</b> = base × seasonal index × promotional uplift × event shock. Forecast error is derived from the item\'s coefficient of variation, how well your chosen method matches the pattern present, how far alpha is from the item\'s optimum, and the gap between the uplift you set and the uplift that was needed.</li>'+
      '<li><b>Safety stock</b> uses the full two-term formula, so lead-time variability counts. Forecast error inflates the demand sigma, which is how bad forecasting shows up as inventory rather than as a forecasting metric.</li>'+
      '<li><b>Fill rate</b> comes from the unit normal loss function, so it is properly distinguished from cycle service level rather than assumed equal to it.</li>'+
      '<li><b>Capacity</b> = base × shift factor × OEE × (1 − changeover loss). Shortfall is allocated proportionally, which is deliberately the naive rule, the correct rule is contribution margin per constrained unit.</li>'+
      '<li><b>OTIF</b> = on-time × in-full, multiplicatively. On-time reflects mode transit, queueing above 85% utilisation, forecast error and disruptions.</li>'+
      '<li><b>Freight</b> uses chargeable weight, volumetric for air and courier, multiplied by mode rate, lane distance, and a fill-rate divisor.</li>'+
      '<li><b>Carbon</b> = tonnes × km × mode factor, using roughly the published tonne-km figures.</li>'+
      '<li><b>Resilience</b> is time-to-survive against time-to-recover, not a weighted opinion score.</li>'+
      '</ul>'+
      minor("The most useful thing you can do with any model, including this one, is find where it disagrees with your intuition and work out which of you is wrong. Sometimes it will be the model. That is still a good afternoon."));
    return h;
  }
};
/* ==========================================================
   8 · READING THE NUMBERS, AND SEEING THE IDEAS
   ----------------------------------------------------------
   Three separate systems live here:
     (a) DIR — the direction metadata. Every metric declares whether higher,
         lower or mid-range is better, in plain English, with a range you can
         place yourself on. This is what lets the app be used by somebody
         with no finance background.
     (b) CHAPTERS — the narrative thread. Each screen is a chapter with a
         title, a description, a dependency chain, and a sentence explaining
         why the NEXT screen follows from this one.
     (c) the dg* diagram library — hand-drawn explanatory figures. Unlike the
         sci* plots in section 11 these are diagrams rather than charts: the
         geometry is chosen for clarity, not derived from data.
   ========================================================== */

/* ---------- (a) which way is good? ----------
   Each entry:
     d   "up" | "down" | "mid"   the preferred direction
     n   display name
     u   unit suffix. "€" is special: it suppresses the position scale,
         because a euro figure has no universal good/bad range
     lo  the low end of a sensible range, for the scale marker
     hi  the high end
     p   what the metric MEANS, in plain English
     why WHY that direction is the right one

   Only two metrics are "mid": utilisation and days of cover. Both look like
   things to maximise and are not, and both catch people out, which is why
   the app calls them out repeatedly.                                        */
var DIR={
 otif:{d:"up",n:"Service (OTIF)",u:"%",lo:75,hi:100,
   p:"Of everything you promised to deliver, how much arrived on the right day, complete. This is the customer's own scorecard of you.",
   why:"Higher is better. Above 95% is strong, below 90% will be noticed and in retail will be fined."},
 margin:{d:"up",n:"Operating margin",u:"%",lo:-5,hi:25,
   p:"What is left from every €100 of sales after making the product, moving it, storing it, losing some of it and paying overheads.",
   why:"Higher is better. 8-15% is healthy in most of these industries; under 5% means very little room for error."},
 bsInv:{d:"down",n:"Inventory value",u:"€",lo:0,hi:1,
   p:"Cash you have converted into stock: sitting in the warehouse and in transit. It is not spendable until somebody buys it.",
   why:"Lower is better, but only up to a point. Too little and you stock out; the skill is holding the least that still delivers service."},
 dio:{d:"down",n:"Days inventory (DIO)",u:" days",lo:5,hi:200,
   p:"How many days of sales you are holding as stock. 60 days means the average item sits for two months before it sells.",
   why:"Lower is better: it means the same sales with less cash tied up. Grocery runs 15-30 days; heavy industrial 150+."},
 c2c:{d:"down",n:"Cash-to-cash cycle",u:" days",lo:-20,hi:200,
   p:"Days between paying your supplier and being paid by your customer. Every one of those days has to be funded from somewhere.",
   why:"Lower is better. Negative is excellent: customers pay you before you pay suppliers, so the business funds itself."},
 turns:{d:"up",n:"Inventory turns",u:"×",lo:0,hi:30,
   p:"How many times a year you sell through your entire stock. Four turns means the warehouse empties and refills four times.",
   why:"Higher is better: the same profit earned on less cash. It is simply the other way of saying DIO."},
 util:{d:"mid",n:"Plant utilisation",u:"%",lo:40,hi:110,
   p:"How much of your production capacity the demand is consuming.",
   why:"A middle number is best, near 80-88%. Too low wastes the factory; above 92% queues explode and delivery gets worse, not better."},
 mape:{d:"down",n:"Forecast error",u:"%",lo:0,hi:50,
   p:"On average, how far your forecast was from what actually happened.",
   why:"Lower is better. Under 15% is good. Every point of error turns into safety stock you have to pay for."},
 bias:{d:"mid",n:"Forecast bias",u:"%",lo:-25,hi:25,
   p:"Whether you are wrong in a consistent direction. Positive means you routinely forecast too high.",
   why:"Zero is best. Direction matters more than size, a consistent bias builds stock you will write off, or shortages you keep firefighting."},
 co2Int:{d:"down",n:"Carbon intensity",u:"kg",lo:0,hi:25,
   p:"Kilograms of CO2 from transport for every €1,000 of sales.",
   why:"Lower is better. Mode choice dominates it: air is roughly fifty times ocean per tonne-km."},
 resilience:{d:"up",n:"Resilience",u:"",lo:0,hi:100,
   p:"How well you would survive a supplier or site failure, days of stock you hold, versus days it would take to recover.",
   why:"Higher is better, and it costs money. It looks like waste right up until the day it does not."},
 gmroi:{d:"up",n:"GMROI",u:"×",lo:0,hi:8,
   p:"Gross margin earned for every €1 of stock invested. 3.0 means each euro of stock generates €3 of margin a year.",
   why:"Higher is better. It is the fairest way to compare a slow expensive line against a fast cheap one."},
 fill:{d:"up",n:"Fill rate",u:"%",lo:75,hi:100,
   p:"Of everything customers asked for, how much you could supply straight from stock.",
   why:"Higher is better. This is what a customer actually experiences, and it is usually a few points higher than service level."},
 /* the €-unit entries below get no position scale, only a value and a gloss */
 revenue:{d:"up",n:"Revenue",u:"€",lo:0,hi:1,p:"Total sales value in the quarter.",why:"Higher is better, provided you keep the margin."},
 profit:{d:"up",n:"Profit",u:"€",lo:0,hi:1,p:"What the business actually kept this quarter.",why:"Higher is better. This is the number everything else exists to serve."},

/* dirTag(k,dark): the long "higher is better" pill for metric cards.
   Passing dark:true switches to the compact .dir style used in dense
   contexts. Both carry a title attribute for the hover tooltip. */
function dirTag(k,dark){
  var D=DIR[k]; if(!D) return "";
  var cls=D.d, txt=D.d==="up"?"↑ higher is better":D.d==="down"?"↓ lower is better":"↕ mid-range is best";
  var shrt=D.d==="up"?"↑ higher":D.d==="down"?"↓ lower":"↕ mid";
  return '<span class="'+(dark?"dir":"dirL")+' '+cls+'" title="'+txt+'">'+(dark?shrt:txt)+'</span>';
}
/* dirMini(k): the single-glyph version that sits inside table headers.
   Returns an empty string for an unknown key, so a header can call it
   unconditionally without guarding. */
function dirMini(k){
  var D=DIR[k]; if(!D) return "";
  return '<span class="dir '+D.d+'" title="'+(D.d==="up"?"higher is better":D.d==="down"?"lower is better":"mid-range is best")+'">'+
    (D.d==="up"?"↑":D.d==="down"?"↓":"↕")+'</span>';
}

/* mx(k,val,txt,toneCls): a metric explainer card.
   Four parts: name + direction tag, the value, the plain-English meaning,
   and a position scale with a marker.

   The scale gradient is chosen from the direction:
     up    bad → good, left to right (the default)
     down  reversed with .rev, so "low" reads green
     mid   a bespoke inline gradient, warn → good → bad, so BOTH ends are
           marked as problems and the middle is the target
   Euro metrics get no scale at all, because there is no universal range. */
function mx(k,val,txt,toneCls){
  var D=DIR[k]; if(!D) return "";
  var pos=clamp((val-D.lo)/((D.hi-D.lo)||1),0,1)*100;
  var revScale = D.d==="down";
  var lowLbl,highLbl;
  if(D.d==="up"){ lowLbl="weak"; highLbl="strong"; }
  else if(D.d==="down"){ lowLbl="good"; highLbl="costly"; }
  else { lowLbl="too low"; highLbl="too high"; }
  var scaleCls = D.d==="mid" ? "" : (revScale?"rev":"");
  var bar = (D.u==="€")? "" :
    '<div class="scale '+scaleCls+'"'+(D.d==="mid"?' style="background:linear-gradient(90deg,var(--warn),var(--good) 50%,var(--bad))"':'')+
    '><i style="left:'+pos.toFixed(1)+'%"></i></div>'+
    '<div class="sl"><span>'+lowLbl+' '+fm(D.lo,0)+D.u+'</span><span>'+highLbl+' '+fm(D.hi,0)+D.u+'</span></div>';
  return '<div class="mx"><div class="t"><span>'+esc(D.n)+'</span>'+dirTag(k)+'</div>'+
    '<div class="v '+(toneCls||"")+'">'+txt+'</div>'+
    '<div class="d">'+D.p+' <b style="color:var(--ink)">'+D.why+'</b></div>'+bar+'</div>';
}

/* ---------- (b) the guided thread ----------

     n      short name, used on the step rail
     t      the chapter title

            what turns thirteen tabs into a single argument, and it is
            rendered on the "next" pager button of the CURRENT screen, not

   next:"Nothing here can be fixed until you know what customers are going to want. That is where the chain actually begins."},

   d:"Every calculation in this app, and in every real planning system, is computed from a table like this one. Type over anything in it. Change a lead time, add a product line, rename the company, and the whole simulation recalculates underneath you.",
   chain:["Item file","Forecast","Policy","Plan","Money"],
   next:"With your own numbers in place, the chain starts where it always starts: guessing what customers will want."},
 plan:{n:"Planning book",t:"Thirteen weeks, and you fill them in",
   d:"This is the grid a planner actually works in. You type the forecast and the receipts; the sheet projects stock forward week by week and shows you where it breaks. Then it prices your plan, and shows what a reorder point policy would have spent on the same demand.",
   chain:["Forecast","Firm orders","Receipts","Projected stock","Cost"],
   next:"Your plan assumed the goods turn up. Whether they do is decided upstream, by the suppliers you chose."},
 demand:{n:"Demand",t:"Everything starts with a guess",
   d:"No forecast is right. The job is to be wrong by a small, known and unbiased amount, because whatever error is left has to be paid for later in inventory, in expediting, or in disappointed customers.",
   chain:["Forecast","→ buffer","→ order","→ make","→ ship"],
   next:"Whatever error your forecast leaves behind becomes inventory. Let's go and price it."},
 inventory:{n:"Inventory",t:"The price of not knowing",
   d:"Inventory exists for exactly one reason: uncertainty. Uncertainty about demand, and uncertainty about supply. Remove the uncertainty and the stock is unnecessary; leave it and the stock is the insurance premium you pay.",
   chain:["Forecast error","→ safety stock","→ cash","→ decay risk"],
   next:"Policy sets the rules. Now go and build an actual week-by-week plan using them."},
 sourcing:{n:"Sourcing",t:"The half of the chain you do not own",
   d:"Your suppliers set your lead times, your lead-time variability and a large part of your cost base. Buying well is not getting the lowest quote, it is getting the lowest total cost and the shortest recovery time.",
   chain:["Supplier","→ lead time","→ safety stock","→ risk"],
   next:"Materials arrive. Now something has to turn them into product, and capacity has rules of its own."},
 production:{n:"Production",t:"Where capacity meets reality",
   d:"A plant is not a number of units per week. It is a system of queues, changeovers and losses, and it behaves in ways that surprise people, notably that loading it harder makes it slower.",
   chain:["Capacity","→ OEE","→ batch size","→ lead time"],

   chain:["Mode","→ transit","→ pipeline stock","→ cost & CO2"],

   d:"Resilience is not a mood or a heat map. It is two numbers: how long you would last, and how long recovery would take. The gap between them is your exposure, measured in days of unserved customers.",
   chain:["Node fails","→ stock lasts?","→ recovery time","→ gap"],
   next:"Ten screens of decisions. Now bring them into one room and agree a single plan."},

 library:{n:"Library",t:"Everything, in one place",
   d:"The glossary, the formula sheet, the full Incoterms table and the small things nobody writes down. Come back here whenever a word on another screen was not obvious.",
