<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the layout run under the notch/home-indicator on modern
     phones. Combined with the `dvh` unit used on the landing screen it stops the
     browser chrome from cropping the hero. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- theme-color paints the mobile browser's own toolbar the same white as the app
     header, so the sticky header appears to extend to the top of the device. -->
<meta name="theme-color" content="#FFFFFF">
<title>Supply Chain Control Tower</title>
<meta name="description" content="An offline, interactive supply chain planning simulator and teaching engine. FMCG, high-tech, energy, pharma and packaging.">
<style>
/* ==========================================================
   SUPPLY CHAIN CONTROL TOWER
   ----------------------------------------------------------
   HOW THIS STYLESHEET IS ORGANISED
   ----------------------------------------------------------
   Everything below is one file, in this order:

     1.  :root design tokens        colour, type scale, spacing
     2.  element resets            box-sizing, body, headings
     3.  status marks              the coloured dot system
     4.  header / instrument board the sticky top chrome
     5.  flow track (nav#rail)     the numbered step thread
     6.  page layout               main grid, cards, chapter
     7.  controls                  sliders, segmented buttons, switches
     8.  editable inputs           typed numbers in tables and beside sliders
     9.  data grid                 the dense tables that carry every ledger
     10. charts                    the shell classes hand-written SVG relies on
     11. teaching furniture        learn/fx/note/minor/metric-explainer blocks
     12. side rail                 impact ledger, diagnosis, glossary lookup
     13. landing screens           splash, sector picker, primer
     14. accent injection          the per-sector colour overrides
     15. motion                    entrance animations and hover transitions
     16. containment               the rules that stop anything overflowing
     17. references                per-concept bibliography styling
     18. media queries             wide, tablet, phone, tiny, print, reduced-motion

   DESIGN RULE THIS FILE ENFORCES
   ----------------------------------------------------------
   Monochrome editorial. All type is black on light ground.
   Hierarchy comes from size, weight and space, not colour.
   Colour is reserved for two jobs only: distinguishing data
   series in a chart, and marking status, which is carried by
   a rule or a dot beside the black figure rather than by
   colouring the figure itself.
   Zero external assets. Works offline.
   ========================================================== */

:root{
  /* ---- surfaces, lightest to darkest ----
     paper  = the page behind everything
     panel  = a card sitting on the paper
     panel2 = a recessed area inside a card (chart wells, summary rows)
     panel3 = the darkest neutral fill, used for table headers and chips */
  --paper:#F4F5F7;
  --panel:#FFFFFF;
  --panel2:#FAFBFC;
  --panel3:#F0F2F5;

  --ink:#111111;          /* every piece of type in the app */
  /* three weights of hairline: rule is a real border, rule2 a soft divider,
     rule3 the near-invisible line between table rows */
  --rule:#D5D9DE;
  --rule2:#E8EAEE;
  --rule3:#F1F3F5;

  /* ---- status triad ----
     Used for KPI marks, table cell emphasis and note borders. The *Bg
     variants are the 8%-tint fills that sit behind those states. */
  --good:#0A6B4E;
  --warn:#8A6100;
  --bad:#A31D28;
  --goodBg:#EAF4F0;
  --warnBg:#F8F2E4;
  --badBg:#F8EBEC;

  --sub:#5A5F66;          /* chart tick labels only, never body copy */
  --sub2:#7A8088;         /* chart secondary series only */
  --mono:Helvetica,"Helvetica Neue",Arial,sans-serif;

  /* ---- accent block ----
     These five are REPLACED AT RUNTIME by startSector(), which writes the
     chosen sector's colours onto document.documentElement. The values here
     are only the fallback used on the landing screen before a sector is
     picked. Anything that should recolour per industry must read one of
     these variables rather than hard-coding a hex. */
  --acc:#2B6CB0;          /* replaced per sector */
  --accSoft:#E8F0F9;      /* 10% tint of acc, for fills */
  --accInk:#1A4B80;       /* darkened acc, legible as type on white */
  --accHi:#C5DCF2;        /* highlighter band behind emphasised words */
  --onAcc:#FFFFFF;        /* type colour that sits ON a solid acc fill */

  /* measured at runtime by measureChrome() so the sticky side rail knows
     exactly how tall the header is. The 132px here is only a first guess. */
  --chromeH:132px;

  --hv:Helvetica,"Helvetica Neue",Arial,"Liberation Sans",sans-serif;

  /* ---- fluid type scale ----
     Every size is a clamp(min, preferred, max) so the app reflows from a
     360px phone to a 1500px monitor without a single font-size media query. */
  --t-hero:clamp(2rem,1.15rem + 4.2vw,3.5rem);
  --t-h2:clamp(1.2rem,1.04rem + .74vw,1.58rem);
  --t-h3:clamp(1rem,.94rem + .3vw,1.14rem);
  --t-body:clamp(.94rem,.9rem + .18vw,1rem);
  --t-sm:clamp(.79rem,.76rem + .12vw,.845rem);

  /* one fluid spacing unit drives gutters, card padding and grid gaps */
  --sp:clamp(.85rem,.6rem + .8vw,1.2rem);
  --r:12px;               /* card radius */
  --rSm:9px;              /* tile / alert radius */
  /* shadow  = resting elevation, shadow2 = hover elevation */
  --shadow:0 1px 2px rgba(17,17,17,.04),0 4px 14px -6px rgba(17,17,17,.09);
  --shadow2:0 2px 5px rgba(17,17,17,.06),0 14px 32px -12px rgba(17,17,17,.16);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--hv);background:var(--paper);color:var(--ink);
  font-size:var(--t-body);line-height:1.62;letter-spacing:-.004em;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
/* Tabular figures. Without this, numbers in a table column jitter left and
   right as digits change width, which makes a recalculating grid unreadable. */
.num,table.dg,.val,.bignum,.kpi .v,.mx .v,.statline .sv{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2;letter-spacing:-.028em;color:var(--ink);text-align:center}
h2{font-size:var(--t-h2)}
h3{font-size:var(--t-h3);letter-spacing:-.022em}
h4{font-size:var(--t-sm)}
p{margin:0 0 .7em}
a{color:var(--ink)}
/* Secondary text is the SAME ink at reduced opacity, never a grey hex. That
   keeps one colour in the file and guarantees the contrast ratio scales. */
small,.eyebrow,.hint,.lede,.muted{color:var(--ink)}
.eyebrow{font-size:var(--t-sm);font-weight:500;opacity:.62}
.lede{font-size:calc(var(--t-body) * 1.02);line-height:1.68;opacity:.78}
.hint{font-size:.79rem;line-height:1.5;margin-top:.25rem;opacity:.66}
small{font-size:var(--t-sm);opacity:.66}

/* ---------- status marks: colour lives here, not in the type ----------
   A 7px dot placed beside a black figure. This is the mechanism that lets
   the app signal good/warn/bad without ever tinting the number itself. */
.mk{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:.06em;flex:none}
.mk.good{background:var(--good)} .mk.warn{background:var(--warn)} .mk.bad{background:var(--bad)}

/* ---------- header ----------
   #chrome is the whole sticky assembly: header + KPI board + step rail.
   It is one sticky element rather than three so the shadow reads as a
   single edge and measureChrome() only has to measure one box. */
#chrome{position:sticky;top:0;z-index:60;background:var(--panel);
  box-shadow:0 1px 0 var(--rule),0 8px 20px -14px rgba(17,17,17,.4)}
header#top{background:var(--panel);border-bottom:1px solid var(--rule2);position:relative}
/* 3px accent bar across the very top: the only place the sector colour
   appears at full strength in the chrome. */
header#top::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 42%,#FFFFFF))}
.wrap{max-width:1340px;margin:0 auto;padding:0 var(--sp)}
.topbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.8rem 0 .62rem}
.brandmark{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1 1 auto}
/* The beacon is a radar sweep: a conic gradient rotating under a white
   donut mask, with a pulsing dot in the centre. Pure CSS, no image. */
.beacon{width:28px;height:28px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(from 0deg,var(--acc),color-mix(in srgb,var(--acc) 12%,#FFFFFF) 70%,var(--acc));
  animation:sweep 5s linear infinite}
.beacon::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.beacon::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--acc);z-index:1;
  animation:beat 2.4s ease-in-out infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes beat{50%{opacity:.4;transform:scale(.8)}}
.brandtxt{min-width:0}
.brandtxt .co{font-size:.72rem;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt .ttl{font-size:clamp(.98rem,.86rem + .5vw,1.2rem);font-weight:700;line-height:1.18;letter-spacing:-.03em}
/* qmeta is the right-hand cluster: eight quarter pips, the caption, and the
   two chrome buttons. It wraps to a full row of its own on a phone. */
.qmeta{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.qdots{display:flex;gap:3px}
.qdot{width:15px;height:5px;border-radius:2px;background:var(--rule)}
.qdot.done{background:var(--acc)}
.qdot.now{background:var(--accInk);box-shadow:0 0 0 3px var(--accSoft);animation:beat 1.9s ease-in-out infinite}
.qtxt{font-size:.76rem;white-space:nowrap;opacity:.66}

button{font-family:inherit}
/* .btn is the solid accent button. ::after is a diagonal sheen that sweeps
   across on hover, which is the only decorative flourish in the chrome. */
.btn{font-size:.82rem;font-weight:600;letter-spacing:-.012em;border-radius:8px;padding:.5rem .9rem;cursor:pointer;
  border:1px solid var(--acc);background:var(--acc);color:var(--onAcc);white-space:nowrap;position:relative;overflow:hidden;
  transition:filter .14s,transform .14s,box-shadow .14s}
.btn:hover{filter:brightness(1.09);transform:translateY(-1px);box-shadow:0 6px 16px -7px var(--acc)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.3) 50%,transparent 68%);
  transform:translateX(-130%);transition:transform .62s ease}
.btn:hover::after{transform:translateX(130%)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}   /* secondary action */
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.lite{background:var(--panel);color:var(--ink);border-color:var(--rule)}   /* tertiary, on cards */
.btn.lite:hover{border-color:var(--ink)}
.btn.sm{padding:.32rem .6rem;font-size:.76rem}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}

/* ---------- instrument cluster ----------
   Eight KPI tiles in a fixed 8-column grid on desktop, 4 columns on tablet,
   and a horizontally-snapping carousel on a phone (see media queries). */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;padding-bottom:.7rem}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--rule);
  border-radius:var(--rSm);padding:.55rem .7rem .6rem .8rem;position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;
  animation:tileIn .42s cubic-bezier(.2,.7,.3,1) backwards}
/* staggered entrance: each tile starts 30ms after the one before it */
.kpi:nth-child(1){animation-delay:.02s}.kpi:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.11s}
.kpi:nth-child(5){animation-delay:.14s}.kpi:nth-child(6){animation-delay:.17s}
.kpi:nth-child(7){animation-delay:.2s}.kpi:nth-child(8){animation-delay:.23s}
@keyframes tileIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* the 3px left rule is the tile's status carrier */
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rule)}
.kpi.good::before{background:var(--good)} .kpi.warn::before{background:var(--warn)} .kpi.bad::before{background:var(--bad)}
.kpi.good{background:linear-gradient(180deg,var(--goodBg),var(--panel) 74%)}
.kpi.warn{background:linear-gradient(180deg,var(--warnBg),var(--panel) 74%)}
.kpi.bad{background:linear-gradient(180deg,var(--badBg),var(--panel) 74%)}
.kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
/* .k label / .v value / .s sub-caption. min-height on k and s keeps all eight
   tiles the same height even when one label wraps to two lines. */
.kpi .k{font-size:.68rem;opacity:.62;display:flex;align-items:center;gap:4px;line-height:1.3;
  flex-wrap:wrap;min-height:1.7em}
.kpi .v{font-size:clamp(1.05rem,.72rem + 1.1vw,1.4rem);font-weight:700;line-height:1.22;letter-spacing:-.035em;
  margin-top:1px;color:var(--ink)}
.kpi .s{font-size:.68rem;opacity:.58;line-height:1.32;margin-top:2px;min-height:1.7em}
/* quarter-on-quarter direction arrow, rendered by paintBoard() */
.kpi .arrow{font-size:.6rem;margin-left:4px;opacity:.72;white-space:nowrap}
.kpi .arrow .mk{width:5px;height:5px;margin-right:2px}

/* direction markers
   .dir  = the compact ↑ ↓ ↕ glyph that sits in table headers
   .dirL = the long "higher is better" pill used in metric cards
   Both are generated by dirMini() and dirTag() in section 8. */
.dir{font-size:.62rem;font-weight:700;padding:0 4px;border-radius:3px;line-height:1.5;flex:none;
  background:var(--panel3);color:var(--ink);opacity:.8}
.dirL{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:5px;display:inline-block;white-space:nowrap;
  background:var(--panel3);color:var(--ink);border:1px solid var(--rule2)}
table.dg th .dir{background:rgba(17,17,17,.07)}

/* the disruption banner under the KPI board: live (red) or mitigated (green) */
.alertbar{border-radius:var(--rSm);padding:.6rem .8rem;font-size:var(--t-sm);margin-bottom:.7rem;
  display:flex;gap:.6rem;align-items:flex-start;flex-wrap:wrap;line-height:1.52;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--rule)}
.alertbar.live{border-left-color:var(--bad);background:var(--badBg)}
.alertbar.mit{border-left-color:var(--good);background:var(--goodBg)}
.tagpill{font-size:.68rem;padding:2px 8px;border-radius:4px;font-weight:700;flex:none;margin-top:1px;
  background:var(--panel);border:1px solid var(--rule);color:var(--ink)}

/* ---------- flow track ----------
   The numbered thread across the top. Each .step is a bead plus a name, and
   the ::before pseudo-element draws the connecting line back to the previous
   step, so the whole thread is built from the buttons themselves. */
nav#rail{background:var(--panel);border-bottom:1px solid var(--rule);position:relative}
.rails{display:flex;overflow-x:auto;padding:.5rem 0 .45rem;gap:2px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.rails::-webkit-scrollbar{display:none}
.step{background:none;border:none;cursor:pointer;padding:.4rem .35rem .3rem;display:flex;flex-direction:column;
  align-items:center;gap:6px;min-width:88px;flex:1 0 auto;position:relative;color:var(--ink);scroll-snap-align:center;
  border-radius:10px;transition:background .16s ease}
/* underline that grows from the centre on hover and stays on the active step */
.step::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:2px;border-radius:2px;
  background:var(--acc);transform:scaleX(0);transition:transform .2s ease}
.step:hover{background:var(--accSoft)}
.step:hover::after{transform:scaleX(1)}
.step.on::after{transform:scaleX(1)}
.step .bead{width:22px;height:22px;border-radius:50%;background:var(--panel);border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:.69rem;font-weight:700;color:var(--ink);
  position:relative;z-index:2;transition:all .18s;opacity:.7}
.step .nm{font-size:.71rem;font-weight:500;line-height:1.25;text-align:center;letter-spacing:-.012em;
  white-space:nowrap;opacity:.6;transition:opacity .18s}
/* the connecting line: half a step wide, drawn leftwards, hidden on the first */
.step::before{content:"";position:absolute;top:1.05rem;left:-50%;width:100%;height:1.5px;background:var(--rule2);z-index:1}
.step:first-child::before{display:none}
.step:hover .bead,.step:hover .nm{opacity:1}
.step:hover .bead{border-color:var(--ink)}
.step.done .bead{border-color:var(--ink);opacity:.85}
.step.done::before{background:var(--rule)}
.step.on .bead{background:var(--ink);border-color:var(--ink);color:#FFFFFF;opacity:1;transform:scale(1.14)}
.step.on .nm{opacity:1;font-weight:700}

/* ---------- layout ----------
   Two columns: the screen body (#view) and the persistent side rail (#side).
   The rail is sticky and scrolls independently, offset by the measured
   header height so it never hides under the chrome. */
main{max-width:1340px;margin:0 auto;padding:var(--sp) var(--sp) 3rem;
  display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp);align-items:start}
#view{min-width:0;display:flex;flex-direction:column;gap:var(--sp)}
#side{position:sticky;top:calc(var(--chromeH) + .8rem);display:flex;flex-direction:column;gap:.85rem;
  max-height:calc(100vh - var(--chromeH) - 2rem);overflow-y:auto;scrollbar-width:thin}
#side::-webkit-scrollbar{width:5px}
#side::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:clamp(1.1rem,.8rem + 1vw,1.6rem);box-shadow:var(--shadow)}
/* grid2 = two roughly-equal panels that collapse to one below 340px each
   grid3 = a three-up strip of small figures that collapses the same way */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--sp)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:1.1rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.cardhead{display:flex;justify-content:center;align-items:baseline;gap:.6rem;margin-bottom:.85rem;flex-wrap:wrap;
  padding-bottom:.6rem;border-bottom:1px solid var(--rule2);text-align:center}

/* the chapter block that opens every screen: step number, title, description,
   and the breadcrumb chain of what feeds what */
.chapter{text-align:center}
.chapter{border:1px solid var(--rule);border-radius:var(--r);padding:clamp(1rem,.7rem + 1.1vw,1.5rem);
  box-shadow:var(--shadow);background:var(--panel);border-top:3px solid var(--acc)}
.chapter .cn{font-size:.74rem;font-weight:700;opacity:.6}
.chapter h2{margin:.15rem 0 .35rem}
.chapter{text-align:center}
/* 66ch cap: the classic measure for comfortable reading */
.chapter .cd{font-size:calc(var(--t-body)*1.02);line-height:1.66;max-width:66ch;margin:0 auto;opacity:.78}
.chapter .chain{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.9rem;font-size:.76rem;align-items:center;justify-content:center}
.chapter .chain b{background:var(--panel3);border:1px solid var(--rule2);border-radius:16px;padding:.2rem .7rem;font-weight:600}
.chapter .chain i{font-style:normal;opacity:.45}

/* previous / next navigation at the foot of every screen */
.pager{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:.75rem}
.pgbtn{display:flex;gap:.7rem;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--rule);
  border-radius:var(--r);padding:.85rem 1rem;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);
  transition:transform .14s,box-shadow .14s,border-color .14s}
.pgbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--ink)}
.pgbtn .ar{width:30px;height:30px;border-radius:50%;background:var(--panel3);border:1px solid var(--rule2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700}
.pgbtn .lb{font-size:.72rem;font-weight:600;opacity:.6}
.pgbtn .tt{font-size:.94rem;font-weight:700;line-height:1.3;letter-spacing:-.02em;display:block}
.pgbtn .wy{font-size:.78rem;line-height:1.45;margin-top:1px;display:block;opacity:.66}
.pgbtn.nx{flex-direction:row-reverse;text-align:right}   /* next button mirrors */
.pgbtn.dis{opacity:.3;cursor:default;transform:none;box-shadow:none}

/* ---------- controls ----------
   Three control types, all generated by slider(), seg() and sw() in section 7.
   Each carries data-* attributes read by the delegated listeners in section 6. */
.ctl{margin-bottom:1.5rem}
.ctl:last-child{margin-bottom:0}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:.55rem}
.ctl .lab b{font-size:var(--t-sm);font-weight:600}
/* .val is the pill on the right of a slider label. It contains a real
   <input type=number>, so every slider is also directly typeable. */
.ctl .val{font-size:.8rem;font-weight:700;color:var(--ink);background:var(--panel3);border:1px solid var(--rule2);
  padding:1px 6px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:baseline;gap:1px}
input[type=range]{width:100%;height:24px;accent-color:var(--ink);cursor:pointer;margin:.2rem 0 0}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin-top:.35rem}
.seg button{font-size:.79rem;font-weight:600;padding:.4rem .72rem;border-radius:7px;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink);cursor:pointer;transition:all .13s;min-height:33px}
.seg button:hover{border-color:var(--ink)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
/* switch: a 34x19 track with a 15px knob that translates 15px when on */
.sw{display:flex;align-items:center;gap:.65rem;cursor:pointer;padding:.55rem .7rem;border:1px solid var(--rule);
  border-radius:9px;background:var(--panel);width:100%;text-align:left;transition:border-color .13s}
.sw:hover{border-color:var(--ink)}
.sw .knob{width:34px;height:19px;border-radius:10px;background:var(--rule);position:relative;flex:none;transition:background .17s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  transition:transform .17s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on .knob{background:var(--ink)}
.sw.on .knob::after{transform:translateX(15px)}
.sw .swtxt{font-size:.83rem;font-weight:600;line-height:1.35}
.sw .swtxt small{display:block;font-weight:400;font-size:.75rem;margin-top:1px;opacity:.66}
/* keyboard focus is always visible; the app is fully operable without a mouse */
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* ---------- editable inputs ----------
   .valin sits inside a slider's value pill. .ci is the in-table cell input
   used by the item file and the planning book. Both strip the native spinner
   arrows, which would otherwise wreck the alignment of a dense grid. */
.valin{width:4.6em;border:none;background:transparent;color:var(--ink);font-family:var(--hv);
  font-size:.8rem;font-weight:700;text-align:right;padding:1px 0;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;appearance:textfield}
.valin::-webkit-outer-spin-button,.valin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.valin:focus{outline:none;background:var(--panel);border-radius:3px;box-shadow:0 0 0 2px var(--ink)}
.vsuf{font-size:.8rem;font-weight:700}
/* .ci is transparent until hovered, so a table of 100 inputs still reads as
   a table rather than as a form. The border only appears on interaction. */
input.ci{width:5.2em;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink);
  font-family:var(--hv);font-size:.79rem;text-align:right;padding:.2rem .3rem;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;appearance:textfield;transition:background .12s,border-color .12s}
input.ci::-webkit-outer-spin-button,input.ci::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.ci:hover{border-color:var(--rule);background:var(--panel3)}
input.ci:focus{outline:none;border-color:var(--ink);background:var(--panel);box-shadow:0 0 0 2px rgba(17,17,17,.12)}
input.ci.hi{background:var(--panel3);border-color:var(--rule2)}  /* the row you are meant to fill in */
input.ci.wide{width:8em}
input.ci.nmin{width:11em;text-align:left;font-size:.72rem;opacity:.7}  /* the product name field */
select.ci.sel{width:auto;min-width:3.1em;text-align:left;cursor:pointer;border:1px solid var(--rule);
  background:var(--panel);padding:.15rem .25rem;font-size:.72rem;font-weight:700;color:var(--ink);font-family:var(--hv)}
/* the scenario save/load box holds one long JSON line, so break anywhere */
textarea.searchbox{font-family:var(--hv);line-height:1.45;white-space:pre-wrap;word-break:break-all}
label.eyebrow input{display:block}

/* ---------- data grid ----------
   Every ledger in the app is one of these. Two things make it usable on a
   phone: the header row is sticky vertically, and the first column is sticky
   horizontally, so the product code stays visible while you scroll sideways. */
.gridwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--panel);
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.gridwrap::-webkit-scrollbar{height:7px}
.gridwrap::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
table.dg{border-collapse:collapse;width:100%;font-size:.79rem;min-width:660px;color:var(--ink)}
table.dg th{background:var(--panel3);color:var(--ink);font-weight:700;text-align:right;padding:.5rem .62rem;font-size:.72rem;
  position:sticky;top:0;white-space:nowrap;border-bottom:1.5px solid var(--ink);letter-spacing:-.01em}
/* numbers right, labels left: the first column is the only left-aligned one */
table.dg th,table.dg td{text-align:right}
table.dg th:first-child,table.dg td:first-child{text-align:left;position:sticky;left:0;z-index:2}
table.dg th:first-child{z-index:3}   /* the corner cell must sit above both */
table.dg td:first-child{background:var(--panel);border-right:1px solid var(--rule2)}
table.dg td{padding:.55rem .7rem;text-align:right;border-bottom:1px solid var(--rule3);white-space:nowrap}
table.dg tbody tr:hover td,table.dg tbody tr:hover td:first-child{background:var(--panel3)}
table.dg tr.sel td,table.dg tr.sel td:first-child{background:var(--panel3)!important;box-shadow:inset 3px 0 0 var(--ink)}
table.dg .code{font-weight:700}
table.dg .nm{font-size:.72rem;display:block;font-weight:400;opacity:.62}  /* product name under the code */
/* status: a mark, not coloured type. g/w/b are applied per cell by the
   live() functions once a value crosses a threshold that matters. */
td.g{color:var(--good);font-weight:700} td.w{color:var(--warn);font-weight:700} td.b{color:var(--bad);font-weight:700}
tfoot td{background:var(--panel3);font-weight:700;border-top:1.5px solid var(--ink);border-bottom:none}
/* chips: a=A class, b=B, c=C for ABC; x/y/z for XYZ predictability */
.chip{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:4px;background:var(--panel3);
  color:var(--ink);font-weight:700;border:1px solid var(--rule2)}
.chip.a{background:#E3EDFB;color:#1B4A8C;border-color:#C9DCF5}
.chip.b{background:#EBE6FA;color:#4A3894;border-color:#D8CFF3}
.chip.c{background:#EEF1F5;color:#4A5563;border-color:#DDE3EA}
.chip.x{background:#DFF5EC;color:#04664B;border-color:#BDEBDB}
.chip.y{background:#FCF2DC;color:#7E5A05;border-color:#F2E3B8}
.chip.z{background:#FCE6E8;color:#9B1F2C;border-color:#F5CBD0}

/* ---------- charts ----------
   All SVG is hand-written in sections 5, 8, 11 and 12. These classes are the
   only styling those generators rely on, which is why they must stay in sync
   with the class names passed to tx() and svgOpen(). */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:var(--ink)}
.chart .axis{stroke:var(--ink);stroke-width:1}      /* the two real axes */
.chart .gridln{stroke:var(--rule2);stroke-width:1}  /* horizontal gridlines */
.chart .lbl{font-size:10px}                          /* tick and annotation text */
.chart .val{fill:var(--ink);font-weight:700}         /* value labels on bars */
.legend{display:flex;gap:.85rem;flex-wrap:wrap;font-size:.75rem;margin-top:.5rem;color:var(--ink)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* .viz is a chart plus its caption: the caption is the teaching, the chart
   is the evidence, and the hairline between them separates the two. */
.viz{background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:1.1rem 1.1rem .9rem;margin:1.1rem 0}
.viz .cap{font-size:.79rem;line-height:1.55;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--rule2);opacity:.78}
.viz .cap b{opacity:1;font-weight:700}

/* ---------- teaching ----------
   <details class="learn"> is the collapsible explainer. The summary's ::after
   swaps its text between "Explain this" and "Close" purely in CSS. */
.learn{border:1px solid var(--rule);border-radius:10px;margin-bottom:.6rem;overflow:hidden;background:var(--panel)}
.learn>summary{padding:.7rem .9rem;cursor:pointer;list-style:none;text-align:left;display:flex;justify-content:space-between;align-items:center;
  gap:.7rem;background:var(--panel2);font-size:var(--t-sm);font-weight:600;transition:background .15s}
.learn>summary::-webkit-details-marker{display:none}
.learn>summary:hover{background:var(--panel3)}
.learn>summary::after{content:"Explain this";font-size:.72rem;background:var(--panel3);border:1px solid var(--rule2);
  padding:2px 10px;border-radius:14px;flex:none;font-weight:600}
.learn[open]>summary{background:var(--ink);color:#FFFFFF}
.learn[open]>summary::after{content:"Close";background:rgba(255,255,255,.15);border-color:transparent;color:#FFFFFF}
.learn .body{padding:1.2rem 1.25rem;font-size:var(--t-body);line-height:1.72;border-top:1px solid var(--rule2)}
.learn .body h4{margin-top:1rem}
.learn .body p:last-child{margin-bottom:0}
.learn .body ul{margin:0 0 .7rem;padding-left:1.2rem}
.learn .body li{margin-bottom:.35rem}

/* .fx is a formula card: .f the expression, .n the plain-English gloss.
   The expression scrolls horizontally rather than wrapping, because a
   wrapped formula is unreadable. */
.fx{background:var(--panel2);border:1px solid var(--rule);border-left:3px solid var(--ink);border-radius:8px;
  padding:.85rem 1.05rem;margin:1rem 0}
.fx .f{font-size:calc(var(--t-body)*1.03);font-weight:700;overflow-x:auto;white-space:nowrap;padding-bottom:2px;letter-spacing:-.01em}
.fx .n{font-size:.81rem;line-height:1.56;margin-top:.25rem;opacity:.78}
.fx .n b{opacity:1}

/* .note is the diagnosis/verdict block, tinted by status */
.note{border:1px solid var(--rule);border-left:3px solid var(--rule);padding:.8rem 1rem;border-radius:0 8px 8px 0;
  font-size:.85rem;line-height:1.62;margin:.9rem 0;background:var(--panel2)}
.note.good{border-left-color:var(--good);background:var(--goodBg)}
.note.warn{border-left-color:var(--warn);background:var(--warnBg)}
.note.bad{border-left-color:var(--bad);background:var(--badBg)}
.note .h{font-size:.74rem;display:block;margin-bottom:1px;font-weight:700}

/* .minor is a field note: the practitioner aside, always the same shape */
.minor{background:var(--panel2);border:1px solid var(--rule);border-left:3px solid var(--ink);border-radius:0 8px 8px 0;
  padding:.8rem 1rem;font-size:.85rem;line-height:1.64;margin:1rem 0}
.minor .h{font-size:.74rem;font-weight:700;display:block;margin-bottom:2px;opacity:.6}

/* .mexp / .mx is the metric explainer card built by mx() in section 8:
   name, direction tag, value, plain-English meaning, and a position scale. */
.mexp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:.9rem}
.mx{border:1px solid var(--rule);border-radius:10px;padding:.95rem 1rem;background:var(--panel)}
.mx .t{font-size:.83rem;font-weight:700;text-align:left;display:flex;justify-content:space-between;gap:.5rem;align-items:center;flex-wrap:wrap}
.mx .v{font-size:1.3rem;font-weight:700;margin:.15rem 0 .1rem;letter-spacing:-.03em;color:var(--ink);
  display:flex;align-items:center}
.mx .v.g{color:var(--good)} .mx .v.w{color:var(--warn)} .mx .v.b{color:var(--bad)}
.mx .d{font-size:.78rem;line-height:1.5;opacity:.72}
/* .scale is a bad→good gradient with a marker showing where you sit.
   .rev flips it for metrics where lower is better. */
.scale{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bad),var(--warn) 46%,var(--good));
  position:relative;margin-top:.55rem;opacity:.62}
.scale.rev{background:linear-gradient(90deg,var(--good),var(--warn) 54%,var(--bad))}
.scale i{position:absolute;top:-3.5px;width:3px;height:13px;background:var(--ink);border-radius:2px;
  transform:translateX(-1.5px);box-shadow:0 0 0 2px var(--panel)}
.sl{display:flex;justify-content:space-between;font-size:.68rem;margin-top:.2rem;opacity:.55}

/* ---------- side rail ----------
   The impact ledger. Each .lgi is one logged control change: what moved,
   from what to what, and the six measured consequences. */
.ledger{max-height:min(46vh,320px);overflow-y:auto;scrollbar-width:thin;margin:0 -3px;padding:0 3px}
.lgi{border:1px solid var(--rule2);border-left:3px solid var(--rule);padding:.65rem .85rem;margin-bottom:.55rem;
  background:var(--panel2);border-radius:0 8px 8px 0;font-size:.79rem;line-height:1.5}
/* up = everything that moved, moved the right way. down = the reverse.
   mix = some better, some worse, which is the usual case. */
.lgi.up{border-left-color:var(--good)} .lgi.down{border-left-color:var(--bad)} .lgi.mix{border-left-color:var(--warn)}
.lgi .t{font-weight:700;display:block}
.lgi .d{font-size:.75rem;margin-top:3px;display:block;opacity:.72}
.lgi .d s{text-decoration:none;opacity:.55}   /* the "from" value, de-emphasised */
.lgi .why{margin-top:3px;display:block;font-size:.75rem;opacity:.66}
.delta{font-weight:700}
.delta.p{color:var(--good)} .delta.n{color:var(--bad)}
.searchbox{width:100%;padding:.5rem .7rem;border:1px solid var(--rule);border-radius:8px;font-family:var(--hv);
  font-size:.83rem;background:var(--panel);color:var(--ink)}
.glosslist{max-height:min(38vh,260px);overflow-y:auto;scrollbar-width:thin;margin-top:.55rem}
.gl{border-bottom:1px solid var(--rule3);padding:.5rem 0}
.gl:last-child{border:none}
.gl .t{font-size:.83rem;font-weight:700}
.gl .d{font-size:.79rem;line-height:1.55;margin-top:1px;opacity:.75}
.gl .cat{font-size:.68rem;font-weight:600;opacity:.5}

/* ---------- landing ----------
   Two soft radial washes of the accent behind the paper colour. They are the
   only gradients in the app that are not tied to a component. */
#launch{min-height:100dvh;color:var(--ink);padding:clamp(1.6rem,4vw,3rem) var(--sp) 4rem;
  background:radial-gradient(70% 45% at 78% -6%,color-mix(in srgb,var(--acc) 15%,transparent),transparent 62%),
             radial-gradient(60% 40% at 6% 4%,color-mix(in srgb,var(--acc) 8%,transparent),transparent 60%),var(--paper)}
.lwrap{max-width:1160px;margin:0 auto}
.lhead{font-size:var(--t-hero);font-weight:700;line-height:1.03;letter-spacing:-.045em;margin:.6rem 0 0}
.lhead em{font-style:normal;background:linear-gradient(180deg,transparent 60%,var(--accHi) 60%);padding:0 .09em}
.lsub{font-size:clamp(.95rem,.88rem + .35vw,1.08rem);max-width:64ch;line-height:1.66;margin-top:.95rem;opacity:.78}
.ltabs{display:none}   /* legacy tab strip, superseded by the three home cards */
.ltabs button{font-family:var(--hv);font-size:.88rem;font-weight:600;padding:.6rem 1.05rem;border:none;
  background:transparent;color:var(--ink);cursor:pointer;opacity:.55;border-bottom:2.5px solid transparent;
  margin-bottom:-1px;transition:opacity .15s}
.ltabs button:hover{opacity:.85}
.ltabs button.on{opacity:1;border-bottom-color:var(--ink)}
/* the sector picker. --pc is set inline per card to that sector's accent. */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.8rem;margin-top:1.6rem}
.pick{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:1.05rem;cursor:pointer;
  text-align:left;color:var(--ink);position:relative;overflow:hidden;font-family:var(--hv);box-shadow:var(--shadow);
  transition:transform .16s,border-color .16s,box-shadow .16s}
.pick{animation:rise .45s cubic-bezier(.2,.7,.3,1) backwards}
.pick:nth-child(1){animation-delay:.05s}.pick:nth-child(2){animation-delay:.1s}
.pick:nth-child(3){animation-delay:.15s}.pick:nth-child(4){animation-delay:.2s}
.pick:nth-child(5){animation-delay:.25s}
.pick .bar{transition:height .2s ease}
.pick:hover .bar{height:6px}   /* the sector's colour bar thickens on hover */
.pick:hover{transform:translateY(-4px);border-color:var(--pc);box-shadow:0 16px 34px -18px var(--pc),var(--shadow2)}
.pick .bar{height:3px;background:var(--pc);margin:-1.05rem -1.05rem .85rem}
.pick .pt{font-size:.74rem;font-weight:700;opacity:.6}    /* the sector's tag line */
.pick .pn{font-size:1.04rem;font-weight:700;margin:.15rem 0 .1rem;line-height:1.22;letter-spacing:-.028em}
.pick .pco{font-size:.76rem;opacity:.62}                   /* the company name */
.pick .pd{font-size:.83rem;line-height:1.58;margin-top:.6rem;opacity:.78}
.pick .pf{margin-top:.7rem;padding-top:.6rem;border-top:1px solid var(--rule2);font-size:.72rem;line-height:1.6;opacity:.58}
.lfoot{margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--rule);font-size:.85rem;line-height:1.7;max-width:80ch;opacity:.75}
.lfoot b{opacity:1;font-weight:700}

/* the primer's reading surface: a full-bleed panel2 band that breaks out of
   the page gutter using negative margins equal to --sp */
.learnwrap{background:var(--panel2);margin:1.4rem calc(var(--sp) * -1) -4rem;
  padding:clamp(1.2rem,3vw,2.2rem) 0 3.5rem;border-top:1px solid var(--rule)}
.learnwrap section{margin-bottom:var(--sp);display:block}
/* sticky chapter jump bar, faded out at its lower edge so text passes under it */
.lnav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:.7rem;margin-bottom:.4rem;
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel2) 74%,transparent)}
.lnav::-webkit-scrollbar{display:none}
.lnav a{flex:0 0 auto;font-size:.78rem;font-weight:600;text-decoration:none;padding:.32rem .68rem;
  border:1px solid var(--rule);border-radius:16px;background:var(--panel);white-space:nowrap;transition:all .14s;opacity:.78}
.lnav a:hover{border-color:var(--acc);opacity:1;background:var(--accSoft);color:var(--accInk);transform:translateY(-1px)}
.lnav a{transition:all .16s ease}
.seg-mini{font-size:.72rem;font-weight:600;padding:.22rem .6rem;border-radius:14px;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink);cursor:pointer;font-family:var(--hv);transition:all .13s;opacity:.75}
.seg-mini:hover{border-color:var(--ink);opacity:1}
.seg-mini.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF;opacity:1}
/* anchor offset so a jumped-to heading is not hidden under the sticky lnav */
.learnwrap [id^="ls-"]{scroll-margin-top:4.5rem}

/* ---------- landing: the two-option splash ---------- */
#launch{text-align:center}
.lwrap.home{padding-top:clamp(1.5rem,7vh,4.5rem)}
.hbrand{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:600;opacity:.62;
  border:1px solid var(--rule);border-radius:20px;padding:.3rem .85rem;background:var(--panel)}
.hbeacon{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;animation:beat 2s ease-in-out infinite}
.lhead{font-size:var(--t-hero);font-weight:700;line-height:1.03;letter-spacing:-.045em;margin:1.1rem 0 0}
/* on the splash the emphasis is a hard underline rather than a highlighter */
.lhead em{font-style:normal;border-bottom:5px solid var(--ink);padding-bottom:2px}
.lsub{font-size:clamp(.95rem,.88rem + .35vw,1.08rem);max-width:60ch;line-height:1.66;margin:1rem auto 0;opacity:.78}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));
  gap:1rem;margin:2.4rem auto 0;max-width:1080px}
.homecard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:1.8rem 1.4rem 1.5rem;
  cursor:pointer;font-family:var(--hv);color:var(--ink);box-shadow:var(--shadow);
  transition:transform .17s,border-color .17s,box-shadow .17s}
.homecard{position:relative;overflow:hidden;animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards}
.homecard:nth-child(1){animation-delay:.08s}.homecard:nth-child(2){animation-delay:.16s}.homecard:nth-child(3){animation-delay:.24s}
/* the top rule wipes in from the left on hover */
.homecard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc);
  transform:scaleX(0);transform-origin:left;transition:transform .32s ease}
.homecard:hover::before{transform:scaleX(1)}
.homecard:hover{transform:translateY(-5px);border-color:var(--acc);box-shadow:var(--shadow2)}
.hnum{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--accInk);opacity:.9}
.htt{font-size:clamp(1.15rem,1rem + .6vw,1.45rem);font-weight:700;letter-spacing:-.03em;line-height:1.2}
.hsub{font-size:.86rem;font-weight:600;opacity:.7;max-width:30ch}
.hbody{font-size:.83rem;line-height:1.62;opacity:.66;max-width:40ch;margin-top:.5rem;
  padding-top:.75rem;border-top:1px solid var(--rule2)}
.hgo{margin-top:1rem;font-size:.85rem;font-weight:700;border:1px solid var(--acc);border-radius:8px;
  padding:.5rem 1.3rem;color:var(--accInk);transition:background .18s,color .18s}
.homecard:hover .hgo{background:var(--acc);color:var(--onAcc)}
.hfoot{margin-top:2.2rem;font-size:.8rem;opacity:.55}
.backlink{background:none;border:none;font-family:var(--hv);font-size:.83rem;font-weight:600;color:var(--ink);
  cursor:pointer;opacity:.6;padding:.3rem 0;transition:opacity .14s}
.backlink:hover{opacity:1}
.lhead2{font-size:clamp(1.5rem,1.15rem + 1.7vw,2.3rem);font-weight:700;letter-spacing:-.035em;margin:.7rem 0 0}
.lsub2{font-size:clamp(.9rem,.86rem + .25vw,1rem);max-width:62ch;line-height:1.62;margin:.6rem auto 0;opacity:.75}
/* the splash centres everything, so these three re-left-align the cards */
.pick{text-align:left}
.pick .pn,.pick .pt,.pick .pco{text-align:left}
.lfoot{margin:2rem auto 0;text-align:center}
.learnwrap section .card{text-align:left}

/* ---------- highlights and accent colour ----------
   This block is the second pass: it takes components already defined above
   and re-tints them with the live sector accent. Keeping it separate means
   the base component styles stay readable and colour-independent. */
.hl{background:linear-gradient(180deg,transparent 56%,var(--accHi) 56%,var(--accHi) 93%,transparent 93%);padding:0 .1em;font-weight:600}
.cardhead{border-bottom-width:2px;border-bottom-color:var(--accSoft)}
.cardhead{position:relative;padding-bottom:.8rem}
/* a 38px accent tick centred under every card heading */
.cardhead::after{content:"";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
  width:38px;height:2px;background:var(--acc);border-radius:2px}
.chapter{border-top:3px solid var(--acc);background:linear-gradient(180deg,var(--accSoft),var(--panel) 62%)}
.chapter .cn{color:var(--accInk);opacity:1}
.chapter .chain b{background:var(--panel);border-color:color-mix(in srgb,var(--acc) 30%,var(--rule2))}
.fx{border-left-color:var(--acc);background:linear-gradient(90deg,var(--accSoft),var(--panel2) 58%)}
.minor{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warnBg),var(--panel2) 58%)}
.viz{background:linear-gradient(180deg,var(--panel2),var(--panel))}
.learn>summary::after{background:var(--accSoft);color:var(--accInk);border-color:color-mix(in srgb,var(--acc) 28%,transparent)}
.learn[open]>summary{background:var(--acc);color:var(--onAcc)}
.learn[open]>summary::after{background:rgba(255,255,255,.22);color:var(--onAcc)}
.learn[open]>summary:hover{background:var(--acc);filter:brightness(1.06)}
.dirL{background:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--accInk)}
.dir{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--accInk)}

/* ---------- motion ----------
   Screen entrance: the first four blocks of #view rise in sequence, and
   everything from the fifth onwards shares one delay so a long screen does
   not take two seconds to finish appearing. */
#view>*{animation:rise .42s cubic-bezier(.2,.7,.3,1) backwards}
#view>*:nth-child(1){animation-delay:.02s} #view>*:nth-child(2){animation-delay:.07s}
#view>*:nth-child(3){animation-delay:.12s} #view>*:nth-child(4){animation-delay:.17s}
#view>*:nth-child(n+5){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card,.pgbtn,.pick,.homecard,.mx{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}

}

/* ---------- containment: nothing overflows, nothing overlaps ----------
   Grid and flex children default to min-width:auto, which lets a wide table
   or a long unbroken string blow the whole layout out sideways. Every
   container in the app is explicitly given min-width:0 here. This block is

main,#view,#side,.card,.grid2,.grid3,.mexp,.row,.pager,.homegrid,.pickgrid{min-width:0}
#view>*,.grid2>*,.grid3>*,.mexp>*,.pickgrid>*,.homegrid>*{min-width:0;max-width:100%}

.seg,.legend,.gridwrap{max-width:100%}

.viz svg,[data-chart] svg,.chart,svg{max-width:100%;height:auto}

/* ---- per-concept references ----

.reflist.wide li{margin-bottom:.65rem}

.bignum.g{color:var(--good)} .bignum.w{color:var(--warn)} .bignum.b{color:var(--bad)}
/* a label/value pair on one line with a hairline under it: used everywhere

.statline{display:flex;justify-content:space-between;gap:.8rem;font-size:.83rem;padding:.45rem 0;border-bottom:1px solid var(--rule3)}
.statline:last-child{border:none}

/* ---------- breakpoints ----------
   1500+ : widen the measure and the side rail
   1080- : single column, rail moves below the view and becomes a grid
   680-  : KPI board becomes a swipeable carousel, rail becomes a stack
   400-  : wider KPI tiles, full-width segmented buttons
   print : strip the chrome, open every explainer, drop the shadows
   reduce: kill all motion                                                */
@media(min-width:1500px){ .wrap,main{max-width:1460px} main{grid-template-columns:minmax(0,1fr) 352px} }
@media(max-width:1080px){
  main{grid-template-columns:minmax(0,1fr)}
  #side{position:static;max-height:none;order:2;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));align-items:start}
  #view{order:1}
  .ledger,.glosslist{max-height:300px}
  .board{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:680px){
  /* negative margin + matching padding lets the carousel bleed to the screen
     edges while its first tile still aligns to the page gutter */
  .board{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
    padding-bottom:.7rem;margin:0 calc(var(--sp) * -1);padding-left:var(--sp);padding-right:var(--sp)}
  .board::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 43%;min-width:142px;scroll-snap-align:start}
  .kpi .v{font-size:1.2rem}
  .topbar{padding:.6rem 0 .45rem;gap:.5rem}
  .qmeta{width:100%;justify-content:space-between}
  .step{min-width:66px}
  .step .nm{font-size:.66rem}
  .learn>summary::after{content:"Explain"}   /* shorter label on a phone */
  .ltabs button{flex:1 1 auto;text-align:center;font-size:.82rem;padding:.55rem .6rem}
  .learnwrap{margin-left:calc(var(--sp) * -1);margin-right:calc(var(--sp) * -1)}
  input.ci{width:4.4em;font-size:.75rem}
  .valin{width:4em}
  main{padding-bottom:2rem}
  #side{display:flex}
}
@media(max-width:400px){ .kpi{flex:0 0 62%} .seg button{flex:1 1 auto;text-align:center} }
@media print{
  nav#rail,#side,.pager,header#top .btn{display:none}
  main{grid-template-columns:1fr;max-width:none}
  .card,.learn,.chapter,.viz{break-inside:avoid;box-shadow:none}
  .learn>summary{display:none}
  .learn .body{border:none;padding:0}   /* explainers print open */
  body{background:#fff}
}
@media(prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *,*::before,*::after{animation:none!important;transition:none!important} }

<body>
<!-- The entire interface is rendered into this one node. There is no server,
     no router and no framework: render(), renderLaunch() and renderGame()
     each replace #app.innerHTML wholesale, and delegated listeners on
     `document` survive that replacement. -->
<div id="app"></div>
<script>
"use strict";
/* ==========================================================
   2 · THE COMPANIES
   ----------------------------------------------------------
   Five sectors. Each is a real-shaped business with a
   product portfolio, a cost structure, suppliers, customers
   and its own species of pain.

   Nothing in this section is behaviour. It is all data, and
   the engine in section 4 reads it without knowing which
   sector it is looking at. Adding a sixth industry means
   adding one object here and one entry to SECTOR_ORDER;
   no other file section needs to change.
   ========================================================== */

/* ----------------------------------------------------------
   MODES — the transport options.

   Field dictionary:
     k            the key, repeated inside the object so a mode can be
                  passed around on its own without losing its identity
     label        display name
     days         door-to-door transit time, which becomes part of the
                  effective lead time and therefore of pipeline stock
     eurPerKgKm   freight cost per kilogram per kilometre. Multiplied by
                  chargeable weight and lane distance in computeAll()
     co2gPerTkm   grams of CO2e per tonne-kilometre. These are close to the
                  published sector averages, and the spread between air and
                  ocean is the point: it is roughly fifty to one
     minChg       the minimum charge for one consignment. Held for realism
                  and future use; the current engine prices per unit
     note         the one-paragraph explanation shown as the control's hint

   The three numbers that matter — days, cost, carbon — never move in the
   same direction. That is the trade-off the whole app is built around.
   ---------------------------------------------------------- */
var MODES = {
  air:   {k:"air",  label:"Air freight",   days:3,   eurPerKgKm:0.00042, co2gPerTkm:602, minChg:180, note:"Fast, expensive, carbon-heavy. Bought by the kilo (or volumetric weight, whichever is larger)."},
  ocean: {k:"ocean",label:"Ocean FCL",     days:34,  eurPerKgKm:0.000013,co2gPerTkm:12,  minChg:1400,note:"Cheapest per tonne-km by a mile. You buy a box (20ft/40ft), not a weight, so cube discipline matters."},
  rail:  {k:"rail", label:"Rail",          days:11,  eurPerKgKm:0.000041,co2gPerTkm:24,  minChg:900, note:"Dense, steady, low-carbon. Fixed corridors and terminals, needs road at both ends (drayage)."},
  truck: {k:"truck",label:"Road FTL",      days:2,   eurPerKgKm:0.00011, co2gPerTkm:95,  minChg:320, note:"Door-to-door flexibility. Priced by the trailer, so an empty half-trailer costs the same as a full one."},
  reefer:{k:"reefer",label:"Reefer road",  days:2,   eurPerKgKm:0.00017, co2gPerTkm:138, minChg:520, note:"Temperature-controlled road. ~55% cost premium and higher CO2, the diesel genset runs all night."},
  courier:{k:"courier",label:"Express courier",days:1,eurPerKgKm:0.00098,co2gPerTkm:820, minChg:60,  note:"Parcel-level speed for high-value or emergency freight. Brutal per-kilo economics, unbeatable when the line is down."}
};

/* ----------------------------------------------------------
   SECTORS — the five playable industries.

   SECTOR-LEVEL FIELDS
     key          must match the object's own property name
     name / tag   display name and the one-line diagnosis of its core problem
     company      the fictional operating company you take charge of
     site         its physical footprint, shown in the header
     acc..accHi   the five accent colours written to CSS variables by
                  startSector(). accInk must be legible as type on white;
                  onAcc must be legible on a solid accent fill
     unit         what the portfolio is counted in (cases, units, packs)
     cur          currency symbol (euro throughout)
     supp / cust  who sits either side of you in the chain
     modes        which transport modes this industry can legally or
                  practically use. A pharma cold chain cannot use plain rail
     defMode      the mode selected when the sector starts
     overhead     non-supply-chain cost as a fraction of revenue: sales,
                  admin, marketing, R&D. Subtracted last in the P&L
     incoterm     the default trade term, which decides ownFrac — how much
                  of the in-transit stock sits on YOUR balance sheet
     holdRate     annual inventory carrying rate. Drives H in EOQ and the
                  quarterly holding charge. Pharma and tech are high because
                  of obsolescence; energy is low because steel does not decay
     dso / dpo    days sales outstanding and days payable outstanding, the
                  two non-inventory terms of the cash-to-cash cycle
     distanceKm   the average outbound lane length, used for freight and CO2
     orderLines   order lines per quarter. Carried for realism and for
                  future cost-to-serve work
     blurb        the sector's pitch on the picker screen
     pains        four bullet points naming its structural problems
     special      the sector-specific analysis block key and its label
     events       the disruption calendar, one per listed quarter
     skus         the product portfolio
     seasons      an eight-quarter seasonal index per product code, attached
                  onto each SKU by the loop at the bottom of this section

   EVENT FIELDS
     q            the quarter it lands in
     name / desc  what happened
     otif         percentage points knocked off on-time delivery
     cost         fractional uplift on cost of goods for the SKUs it hits
     by           THE MITIGATION KEY. computeAll() builds a map of which
                  configurations count as mitigated and looks this key up.
                  If the player happens to be configured that way, the event
                  lands at 28% strength instead of 100%
     hits         the product codes directly affected. Everything else in the
                  portfolio takes a 35% splash
     tip          the teaching point, shown on the risk calendar

   SKU FIELDS
     code / name  identity
     abc          value class: A high, B mid, C low
     xyz          predictability class: X steady, Y patterned, Z erratic
     price        selling price per unit (0 means it is consumed, not sold)
     cost         standard cost per unit
     baseQ        baseline quarterly demand before season, promotion and events
     cv           coefficient of variation of demand — sigma over the mean.
                  Under 0.2 is steady, over 0.6 is erratic
     lt / ltSd    supplier lead time in days and its standard deviation.
                  ltSd is the term most models forget and it usually dominates
     moq          supplier minimum order quantity
     S            cost of placing and receiving one order (the S in EOQ)
     shelf        shelf life in days; 0 means no expiry
     promo        promotional sensitivity, 0 to 1
     kg / cbm     unit weight and volume. kg divided by cbm gives density,
                  which decides whether the product cubes out or weighs out
     temp         storage regime (pharma only); the string "2-8" is pattern-
                  matched by the cold chain logic in the engine
     src          where it comes from, shown under the code in ledgers
     note         the teaching note attached to that line
   ---------------------------------------------------------- */
var SECTORS = {

/* ---------------------------------------------------------- FMCG
   The velocity problem. Short shelf life, promotions that triple demand
   for a week, and retail customers who fine you for being late. Note the
   holdRate of 0.26 and the short lead times: this is a business where
   inventory decays rather than one where it is expensive to finance. */
fmcg:{
  key:"fmcg", name:"Fast-Moving Consumer Goods", tag:"The velocity problem",
  company:"KILKENNY FOODS LTD", site:"Naas, Co. Kildare · 3 lines · 1 NDC",
  acc:"#00A67D", accSoft:"#E2F7F0", accInk:"#05664A", onAcc:"#06231A", accHi:"#B6EEDF",
  unit:"cases", cur:"€", supp:"Ingredient & packaging suppliers", cust:"Retail RDCs & symbol stores",
  modes:["truck","reefer","rail"], defMode:"truck",
  overhead:0.18, incoterm:"dap", holdRate:0.26, dso:38, dpo:52, distanceKm:340, orderLines:1850,
  blurb:"Shelf life measured in days, promotions that triple demand for one week, and retail customers who fine you for being late. Freshness and velocity beat everything.",
  pains:["Short shelf life → write-offs","Promotional bullwhip","Retailer OTIF penalties","Cold-chain compliance"],
  special:{key:"shelf", label:"Shelf-life & waste"},
  events:[
    /* mitigated by carrying more buffer — but the tip argues buffer is the
       expensive answer to a promotion you knew about in advance */
    {q:2,name:"Retailer promotion goes viral",desc:"A multibuy on granola runs 4 weeks; sell-out is 2.4× the agreed volume.",otif:-7,cost:.05,by:"safety",hits:["KF-1001"],tip:"Promotions are known in advance. Lift the forecast and pre-build; safety stock alone is expensive insurance for something you could have planned."},
    /* mitigated by an active cold chain or a reefer lane */
    {q:3,name:"Heatwave strains the cold chain",desc:"Reefer capacity tightens across the island; chilled lanes slow down and spoilage risk climbs.",otif:-6,cost:.08,by:"cold",hits:["KF-1042","KF-2210"],tip:"Time in transit IS shelf life for chilled goods. Faster, fuller, reefer-mode lanes cut both spoilage and the retailer's rejection rate."},
    /* mitigated by having spare capacity: three shifts or utilisation under 82% */
    {q:4,name:"Christmas peak: the annual cliff",desc:"Seasonal lines run at 26× baseline for six weeks, then fall off a cliff on 25 December.",otif:-5,cost:.05,by:"capacity",hits:["KF-4820"],tip:"Seasonal peaks are a capacity problem, not an inventory problem. Pre-build from Q3 with spare shifts, you cannot buy capacity in December."},
    /* mitigated only by dual sourcing */
    {q:6,name:"Packaging film supplier stops",desc:"Your single-source film converter has a fire. Three weeks of no printed film.",otif:-9,cost:.06,by:"dual",hits:["KF-1001","KF-5115"],tip:"Packaging is the classic invisible single point of failure: cheap, low-attention, and it stops every line in the plant."},
    /* mitigated by running the savings routing heuristic rather than sweep */
    {q:7,name:"City centre delivery windows shrink",desc:"New urban access rules cut delivery windows: more drops, tighter slots, same fleet.",otif:-4,cost:.05,by:"routing",hits:[],tip:"When windows tighten, routing intelligence beats adding trucks. Savings-algorithm route merging recovers most of the lost capacity."}
  ],
  skus:[
    /* AX: the reliable earner. Low cv, long shelf life, everything about it
       says tight control and low cover. */
    {code:"KF-1001",name:"Oat & Honey Granola 500g",abc:"A",xyz:"X",price:3.10,cost:1.92,baseQ:504000,cv:.12,lt:21,ltSd:3,moq:8000,S:220,shelf:270,promo:.85,kg:6.2,cbm:.022,src:"Irish oats + imported honey",note:"The reliable earner. Steady demand, decent margin, promoted 4× a year."},
    /* AY: 21 days of shelf life against a 7-day inbound. The commercial
       window is far shorter than the legal one. */
    {code:"KF-1042",name:"Berry Yoghurt 4×125g",abc:"A",xyz:"Y",price:2.40,cost:1.55,baseQ:696000,cv:.26,lt:7,ltSd:2,moq:12000,S:180,shelf:21,promo:1.0,kg:0.62,cbm:.0031,src:"Fresh dairy, 2 day inbound",note:"21-day shelf life. Retailers reject anything under 14 days remaining, so you effectively have a 7-day selling window."},
    /* BY: weather-driven, cv 0.34, and the seasonal index swings 1.42 to 0.55 */
    {code:"KF-2210",name:"Chilled Soup 600ml",abc:"B",xyz:"Y",price:2.05,cost:1.34,baseQ:252000,cv:.34,lt:10,ltSd:3,moq:6000,S:190,shelf:28,promo:.7,kg:.68,cbm:.0028,src:"Vegetables, seasonal contracts",note:"Weather-driven. A cold snap moves this 40% in a week and no forecast sees it coming."},
    /* BX: 56-day lead time on a commodity input. Predictable demand, but the
       cost base is hedged rather than planned. */
    {code:"KF-3300",name:"Roast & Ground Coffee 227g",abc:"B",xyz:"X",price:5.80,cost:3.45,baseQ:174000,cv:.14,lt:56,ltSd:9,moq:4800,S:420,shelf:540,promo:.6,kg:.26,cbm:.0009,src:"Green coffee, Brazil/Vietnam",note:"56-day inbound lead time on green beans and a commodity price that moves daily. Hedged, not planned."},
    /* CZ: the newsvendor product. cv 0.85 and a Q4 index of 3.62 against
       0.04 in Q1 — a one-shot decision dressed as a product line. */
    {code:"KF-4820",name:"Luxury Mince Pies 6pk",abc:"C",xyz:"Z",price:3.35,cost:2.05,baseQ:108000,cv:.85,lt:35,ltSd:6,moq:16000,S:260,shelf:120,promo:.5,kg:.55,cbm:.0035,src:"Seasonal co-packer",note:"98% of the year's volume ships in eight weeks. Everything unsold on 26 December is written off."},
    /* AX: 23% gross margin. Volume covers fixed cost, and one service
       failure loses the entire contract. */
    {code:"KF-5115",name:"Own-Label Cereal 750g",abc:"A",xyz:"X",price:1.85,cost:1.42,baseQ:912000,cv:.09,lt:18,ltSd:3,moq:24000,S:240,shelf:300,promo:.4,kg:9.1,cbm:.031,src:"Contract manufacture",note:"23% gross margin. Volume pays the factory's fixed costs, but one service failure loses the whole contract."}
  ],
  /* eight quarters = two years, so the arrays repeat after four entries */
  seasons:{ "KF-1001":[1,1.02,.96,1.08,1,1.02,.96,1.08], "KF-1042":[.94,1.12,1.18,.86,.94,1.12,1.18,.86],
    "KF-2210":[1.35,.72,.55,1.42,1.35,.72,.55,1.42], "KF-3300":[1.08,.94,.88,1.12,1.08,.94,.88,1.12],
    "KF-4820":[.04,.05,.28,3.62,.04,.05,.28,3.62], "KF-5115":[1,1,.98,1.02,1,1,.98,1.02] }
},

/* ---------------------------------------------------------- HIGH-TECH
   The complexity problem. Note incoterm "exw": the buyer owns the goods from
   the supplier's door, so ownFrac is 1.0 and every day of that 9,400km ocean
   lane sits on your balance sheet. holdRate 0.31 is the highest in the app,
   because the product loses about 2.4% of its value every month. */
tech:{
  key:"tech", name:"High-Tech Electronics", tag:"The complexity problem",
  company:"NORTHWIND DEVICES PLC", site:"Design Cork · CM Shenzhen · 2 hubs",
  acc:"#4B63E8", accSoft:"#E9ECFD", accInk:"#2B36A8", onAcc:"#FFFFFF", accHi:"#C9D0FA",
  unit:"units", cur:"€", supp:"Fabs, CMs & component brokers", cust:"Carriers, e-tail & channel partners",
  modes:["air","ocean","rail","courier"], defMode:"ocean",
  overhead:0.155, incoterm:"exw", holdRate:0.31, dso:52, dpo:64, distanceKm:9400, orderLines:640,
  blurb:"Bills of material 900 lines deep, silicon booked 40 weeks out, and a product that loses 2% of its value every month it sits in a warehouse. Air or ocean is the question you answer every week.",
  pains:["26-40 week silicon lead times","Value decay & obsolescence","Multi-tier opacity","Launch/EOL cliffs"],
  special:{key:"bom", label:"BOM & obsolescence"},
  events:[
    {q:2,name:"Fab cuts your allocation 18%",desc:"Your power-management IC vendor reallocates capacity to an automotive customer with a bigger book.",otif:-8,cost:.05,by:"dual",hits:["ND-A100","ND-A090"],tip:"Allocation is decided on relationship and forecast credibility, not contracts. A qualified second source is the only real answer."},
    /* the only event in the app mitigated by choosing a fast mode */

/* ----------------------------------------------------------
   Denormalise the seasons table onto each SKU.

   The engine reads sk.season directly rather than looking the code up in
   S.seasons every time, because computeSku() runs once per SKU per repaint
   and a repaint happens on every keystroke. Three things are attached:

     s.season     the eight-quarter index array (default flat if missing)
     s.sector     a back-reference, so a SKU passed on its own still knows
                  which industry it belongs to
     s.dailyBase  quarterly demand divided by 91 days. Every rate in the
                  engine — safety stock, pipeline, days of cover — is a
                  daily rate, so this conversion is done once here

   This runs at load time, before anything is rendered.
   ---------------------------------------------------------- */
Object.keys(SECTORS).forEach(function(k){
  var S = SECTORS[k];
  S.skus.forEach(function(s){
    s.season = S.seasons[s.code] || [1,1,1,1,1,1,1,1];
    s.sector = k;
    s.dailyBase = s.baseQ/91;
  });
});
