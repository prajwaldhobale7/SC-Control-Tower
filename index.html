<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Supply Chain Control Tower</title>
<meta name="description" content="An offline supply chain planning simulator, a four-role business game, and the whole subject explained from first principles.">
<style>
/* ==========================================================
   THE INSTRUMENT SHEET - REVISED TYPOGRAPHY & EVEN STYLING
   ========================================================== */

:root{
  --canvas:#FFFFFF;
  --band:#F3F5F8;
  --band2:#FAFBFC;

  --ink:#151A22;          /* primary type */
  --ink2:#576070;         /* secondary type */
  --ink3:#737D8D;         /* tertiary, labels */
  --line:#E1E6EC;         /* hairline */
  --line2:#EDF0F4;

  --good:#1E7A52;
  --warn:#9A6A0F;
  --bad:#B42318;
  --goodBg:#EDF4F0;
  --warnBg:#F7F2E8;
  --badBg:#F9EEEC;

  --acc:#24559E;
  --accSoft:#EDF1F7;
  --accInk:#1B4176;
  --accHi:#D9E2EF;
  --onAcc:#FFFFFF;
  --chromeH:128px;

  --hv:"Inter","Inter var",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;

  --panel:var(--canvas);
  --panel2:var(--band2);
  --panel3:var(--band);
  --rule:var(--line);
  --rule2:var(--line2);
  --sub:var(--ink2);
  --sub2:var(--ink3);
  --mono:var(--hv);

  --sh-1:0 1px 2px rgba(21,26,34,.04),0 1px 3px rgba(21,26,34,.05);
  --sh-2:0 2px 4px rgba(21,26,34,.04),0 14px 30px -20px rgba(21,26,34,.30);
  --sh-3:0 4px 8px rgba(21,26,34,.05),0 22px 44px -24px rgba(21,26,34,.34);
  --shadow:var(--sh-1);
  --shadow2:var(--sh-2);

  /* HARMONIZED EVEN TYPE SCALE */
  --t-hero:clamp(2.1rem,1.8rem + 1.2vw,2.8rem);
  --t-h1:clamp(1.5rem,1.3rem + 0.8vw,2.0rem);
  --t-h2:clamp(1.2rem,1.1rem + 0.4vw,1.45rem);
  --t-h3:clamp(1.0rem,0.95rem + 0.2vw,1.15rem);
  --t-body:0.925rem;
  --t-sm:0.825rem;
  --t-xs:0.75rem;

  --sp:clamp(1.15rem,.78rem + 1.25vw,1.95rem);
  --r:8px;
  --r-sm:6px;
  --r-lg:12px;
  --r-pill:999px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--hv);background:var(--band);color:var(--ink);
  font-size:var(--t-body);line-height:1.6;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
.num,table.dg,.val,.bignum,.kpi .v,.mx .v,.statline .sv{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* Standardized Heading & Text Hierarchy */
h1,h2,h3,h4{margin:0;color:var(--ink);text-align:center;font-weight:500;line-height:1.25}
h1{font-size:var(--t-h1);letter-spacing:-.025em}
h2{font-size:var(--t-h2);letter-spacing:-.02em}
h3{font-size:var(--t-h3);letter-spacing:-.01em}
h4{font-size:var(--t-sm);font-weight:600;letter-spacing:0}
p{margin:0 0 .8em}
a{color:var(--ink)}
b,strong{font-weight:600}
.eyebrow{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.lede{font-size:var(--t-body);line-height:1.6;color:var(--ink2)}
.hint{font-size:var(--t-sm);line-height:1.5;margin-top:.35rem;color:var(--ink2)}
small{font-size:var(--t-xs);color:var(--ink2)}

/* Chrome Nav Header */
#chrome{position:sticky;top:0;z-index:60;background:var(--canvas);border-bottom:1px solid var(--line)}
header#top{background:var(--canvas);position:relative}
.wrap{max-width:1300px;margin:0 auto;padding:0 var(--sp)}
.topbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.75rem 0}
.brandmark{display:flex;align-items:center;gap:.7rem;min-width:0;flex:1 1 auto}
.brandtxt{min-width:0}
.brandtxt .co{font-size:var(--t-xs);color:var(--ink3);letter-spacing:.04em;white-space:nowrap}
.brandtxt .ttl{font-size:var(--t-h3);font-weight:500;letter-spacing:-.02em;line-height:1.2}
.spacer{flex:1 1 auto}

/* Buttons */
button{font-family:inherit}
.btn{font-size:var(--t-sm);font-weight:500;border-radius:var(--r);padding:.5rem 1rem;
  cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:var(--onAcc);white-space:nowrap;
  transition:all .16s ease;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:hover{background:color-mix(in srgb,var(--acc) 88%,#000);border-color:color-mix(in srgb,var(--acc) 88%,#000)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink3);background:var(--band2)}
.btn.lite{background:var(--canvas);color:var(--ink);border-color:var(--line)}
.btn.lite:hover{border-color:var(--ink3);background:var(--band2)}
.btn.sm{padding:.3rem .65rem;font-size:var(--t-xs)}
.btn:disabled{opacity:.3;cursor:not-allowed}

/* Explicit Navigation Bar for Top & Bottom Back Buttons */
.nav-action-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.6rem .8rem;background:var(--band2);border:1px solid var(--line);
  border-radius:var(--r);margin:.8rem 0;
}
.nav-action-bar.top-bar{margin-bottom:1.2rem}
.nav-action-bar.bottom-bar{margin-top:1.5rem}

/* Readout Board */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:0;padding:0 0 .8rem;border-top:1px solid var(--line)}
.kpi{position:relative;padding:.75rem .85rem .3rem 0;min-width:0;border-top:2px solid transparent;margin-top:-1px}
.kpi+.kpi{padding-left:.85rem;box-shadow:inset 1px 0 0 var(--line2)}
.kpi.good{border-top-color:var(--good)}
.kpi.warn{border-top-color:var(--warn)}
.kpi.bad{border-top-color:var(--bad)}
.kpi .k{font-size:var(--t-xs);color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;line-height:1.3;min-height:2.2em}
.kpi .v{font-size:var(--t-h2);font-weight:400;line-height:1.2;margin-top:.15rem;color:var(--ink)}
.kpi .s{font-size:var(--t-xs);color:var(--ink3);line-height:1.3;margin-top:.2rem}

/* Navigation Rail */
nav#rail{background:var(--canvas);border-top:1px solid var(--line);position:relative}
.rails{display:flex;overflow-x:auto;scrollbar-width:none;gap:0}
.rails::-webkit-scrollbar{display:none}
.step{background:none;border:none;cursor:pointer;padding:.65rem .85rem;display:flex;align-items:center;gap:.4rem;
  flex:0 0 auto;color:var(--ink3);font-family:var(--hv);font-size:var(--t-sm);border-bottom:2px solid transparent;transition:all .16s ease}
.step:hover{color:var(--ink)}
.step.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:500}

/* Layout */
main{max-width:1300px;margin:0 auto;padding:1.5rem var(--sp) 4rem;
  display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:1.5rem;align-items:start}
#view{min-width:0;display:flex;flex-direction:column;gap:1.2rem}
#side{position:sticky;top:calc(var(--chromeH) + 1rem);display:flex;flex-direction:column;gap:1.2rem;
  max-height:calc(100vh - var(--chromeH) - 2rem);overflow-y:auto}

.card{background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.4rem;box-shadow:var(--sh-1)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1.2rem}

/* Vector-free clean landing page */
#launch{min-height:85vh;background:var(--canvas);color:var(--ink);padding:2.5rem var(--sp) 4rem}
.lwrap{max-width:1080px;margin:0 auto}
.lwrap.home{text-align:center}
.lhead{font-size:var(--t-hero);font-weight:300;line-height:1.15;letter-spacing:-.03em;margin:1rem 0 .5rem;text-align:center}
.lhead em{font-style:normal;color:var(--acc)}
.lsub{font-size:var(--t-body);max-width:58ch;line-height:1.6;margin:1rem auto 0;color:var(--ink2)}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1rem;
  margin:2.5rem auto 0;max-width:1080px}
.homecard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.4rem;
  background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.6rem;cursor:pointer;
  color:var(--ink);transition:all .2s ease;box-shadow:var(--sh-1)}
.homecard:hover{background:var(--band2);border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--sh-2)}
.htt{font-size:var(--t-h3);font-weight:500;margin-top:.2rem}
.hsub{font-size:var(--t-sm);color:var(--ink2);line-height:1.5}
.hbody{font-size:var(--t-sm);line-height:1.55;color:var(--ink2);margin-top:.8rem;padding-top:.8rem;border-top:1px solid var(--line2);width:100%}
.hgo{margin-top:1.2rem;font-size:var(--t-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}

/* Hide vectors explicitly on front page elements */
#launch .illu, #launch svg, #launch .secart, #launch .chapart, #launch .beacon { display: none !important; }

/* Tables */
.gridwrap{overflow-x:auto}
table.dg{border-collapse:collapse;width:100%;font-size:var(--t-sm);color:var(--ink)}
table.dg th{background:var(--accSoft);color:var(--accInk);font-weight:600;text-align:right;padding:.5rem .75rem;
  font-size:var(--t-xs);letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--acc)}
table.dg th:first-child,table.dg td:first-child{text-align:left}
table.dg td{padding:.55rem .75rem;text-align:right;border-bottom:1px solid var(--line2)}

@media(max-width:1080px){
  main{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:680px){
  .board{display:flex;overflow-x:auto;padding:.5rem 0}
  .kpi{flex:0 0 45%;min-width:130px;padding-left:.8rem}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ==========================================================
   NAVIGATION HISTORY ENGINE (Chrome-Like Back Function)
   ========================================================== */
var historyStack = [];

function navigateTo(viewName, params) {
  params = params || {};
  var currentState = { view: viewName, params: params };
  
  if (historyStack.length === 0 || JSON.stringify(historyStack[historyStack.length - 1]) !== JSON.stringify(currentState)) {
    historyStack.push(currentState);
  }
  renderView(currentState);
  window.scrollTo(0, 0);
}

function goBack() {
  if (historyStack.length > 1) {
    historyStack.pop(); // Remove current view
    var prevState = historyStack[historyStack.length - 1];
    renderView(prevState);
    window.scrollTo(0, 0);
  } else {
    navigateTo('home');
  }
}

// Global exposure for event handlers
window.goBack = goBack;
window.navigateTo = navigateTo;

/* Helper to render Top & Bottom Back Bars */
function renderNavBars(position) {
  var isHome = historyStack.length <= 1 && historyStack[0] && historyStack[0].view === 'home';
  if (isHome) return '';
  
  return `
    <div class="nav-action-bar ${position}-bar">
      <button class="btn lite sm" onclick="goBack()">← Back</button>
      <span class="eyebrow" style="font-size:0.7rem">Supply Chain Control Tower</span>
      <button class="btn ghost sm" onclick="navigateTo('home')">Home</button>
    </div>
  `;
}

/* ==========================================================
   BUSINESS SECTORS DATA
   ========================================================== */
var SECTORS = {
  fmcg: {
    key: "fmcg", name: "Fast-Moving Consumer Goods", company: "KILKENNY FOODS LTD",
    unit: "cases", cur: "€", blurb: "Shelf life measured in days, promotions that triple demand, and strict retail OTIF windows.",
    skus: [
      {code:"KF-1001", name:"Oat & Honey Granola 500g", price:3.10, cost:1.92, stock:45000},
      {code:"KF-1042", name:"Berry Yoghurt 4x125g", price:2.40, cost:1.55, stock:12000}
    ]
  },
  tech: {
    key: "tech", name: "High-Tech Electronics", company: "NORTHWIND DEVICES PLC",
    unit: "units", cur: "€", blurb: "Complex BOMs, silicon allocations, rapid value decay, and international freight trade-offs.",
    skus: [
      {code:"ND-A100", name:"Aster 9 Flagship Handset", price:690, cost:448, stock:8500},
      {code:"ND-T220", name:"Slate 11 Tablet", price:420, cost:291, stock:3200}
    ]
  },
  energy: {
    key: "energy", name: "Energy & Grid Infrastructure", company: "SHANNON GRID ENERGY",
    unit: "units", cur: "€", blurb: "Multi-month OEM lead times, critical grid infrastructure spares, and capital project schedules.",
    skus: [
      {code:"SG-TR40", name:"40 MVA Power Transformer", price:890000, cost:690000, stock:4},
      {code:"SG-CB11", name:"11kV XLPE Cable Drum 500m", price:21500, cost:15800, stock:45}
    ]
  },
  pharma: {
    key: "pharma", name: "Pharmaceutical & Life Sciences", company: "AURELIA PHARMA LTD",
    unit: "packs", cur: "€", blurb: "Cold-chain enforcement, regulatory releases, batch traceability, and high stock outage costs.",
    skus: [
      {code:"AP-OS12", name:"Atorvexin 20mg Tabs", price:14.20, cost:6.85, stock:95000},
      {code:"AP-BI55", name:"Nerulimab 150mg PFS", price:1180, cost:640, stock:1400}
    ]
  },
  packaging: {
    key: "packaging", name: "Packaging Manufacturing", company: "BOYNE PACKAGING LTD",
    unit: "units", cur: "€", blurb: "Bespoke artwork, setup make-ready waste, raw material index volatility, and line JIT demands.",
    skus: [
      {code:"BP-CF12", name:"Printed Corrugated Case", price:0.62, cost:0.47, stock:320000},
      {code:"BP-FF08", name:"Printed Flexible Film Reel", price:340, cost:258, stock:850}
    ]
  }
};

/* State for active sector and simulation run */
var activeSector = SECTORS.fmcg;
var simDay = 12;
var simFillRate = 96.4;
var simProfit = 142800;

/* ==========================================================
   VIEW RENDERING ENGINE
   ========================================================== */
function renderView(state) {
  var app = document.getElementById('app');
  var view = state.view;

  if (view === 'home') {
    app.innerHTML = renderHome();
  } else if (view === 'sim') {
    app.innerHTML = renderUnifiedSimulation();
  } else if (view === 'sector_select') {
    app.innerHTML = renderSectorPicker();
  } else if (view === 'learn') {
    app.innerHTML = renderTheory();
  } else {
    app.innerHTML = renderHome();
  }
}

/* 1. Vector-Free Front Page Landing View */
function renderHome() {
  return `
    <div id="launch">
      <div class="lwrap home">
        <div class="eyebrow">Supply Chain Operations Platform</div>
        <h1 class="lhead">Supply Chain <em>Control Tower</em></h1>
        <p class="lsub">An interactive business simulator, strategic network modeler, and foundational operating guide for modern supply chain management.</p>
        
        <div class="homegrid">
          <div class="homecard" onclick="navigateTo('sim')">
            <div class="htt">Play the Simulation</div>
            <div class="hsub">Interactive Execution & Live Network Simulator</div>
            <div class="hbody">Run inventory policies, respond to market disruptions, and monitor real-time network flow telemetry across sectors.</div>
            <div class="hgo">Launch Simulation →</div>
          </div>

          <div class="homecard" onclick="navigateTo('sector_select')">
            <div class="htt">Select Sector Strategy</div>
            <div class="hsub">FMCG, High-Tech, Energy, Pharma & Packaging</div>
            <div class="hbody">Configure supply chain structures tailored to specific industry lead times, holding costs, and operational constraints.</div>
            <div class="hgo">Choose Sector →</div>
          </div>

          <div class="homecard" onclick="navigateTo('learn')">
            <div class="htt">First Principles Knowledge</div>
            <div class="hsub">Operational Concepts & Frameworks</div>
            <div class="hbody">Explore replenishment mechanics, safety stock calculus, inventory classifications, and bullwhip dynamics.</div>
            <div class="hgo">Explore Guide →</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

/* 2. Unified Simulation View (Includes Live Network Simulator) */
function renderUnifiedSimulation() {
  var skus = activeSector.skus;
  var tableRows = skus.map(function(s) {
    return `
      <tr>
        <td><b>${s.code}</b><br><small>${s.name}</small></td>
        <td>${activeSector.cur}${s.price.toFixed(2)}</td>
        <td>${activeSector.cur}${s.cost.toFixed(2)}</td>
        <td>${s.stock.toLocaleString()} ${activeSector.unit}</td>
        <td><span class="chip a">Optimal</span></td>
      </tr>
    `;
  }).join('');

  return `
    <div id="chrome">
      <header id="top">
        <div class="wrap">
          <div class="topbar">
            <div class="brandmark">
              <div class="brandtxt">
                <div class="co">${activeSector.company}</div>
                <div class="ttl">${activeSector.name} Operations Hub</div>
              </div>
            </div>
            <div class="spacer"></div>
            <button class="btn sm ghost" onclick="navigateTo('sector_select')">Change Sector</button>
          </div>
          <div class="board">
            <div class="kpi good"><div class="k">Service Level (OTIF)</div><div class="v">${simFillRate}%</div><div class="s">Target: 95.0%</div></div>
            <div class="kpi"><div class="k">Operating Margin</div><div class="v">${activeSector.cur}${simProfit.toLocaleString()}</div><div class="s">YTD Performance</div></div>
            <div class="kpi"><div class="k">Current Day</div><div class="v">${simDay}</div><div class="s">Cycle 1 / 30</div></div>
            <div class="kpi good"><div class="k">Network Status</div><div class="v">Live Active</div><div class="s">Flowing normally</div></div>
          </div>
        </div>
      </header>
      <nav id="rail">
        <div class="wrap rails">
          <button class="step on"><span class="nm">Simulation Dashboard</span></button>
          <button class="step" onclick="navigateTo('learn')"><span class="nm">Theory & Principles</span></button>
        </div>
      </nav>
    </div>

    <main>
      <div id="view">
        ${renderNavBars('top')}

        <!-- Integrated Live Network Simulator Section -->
        <div class="card">
          <div class="cardhead">
            <h2>Live Network Telemetry & Simulator</h2>
          </div>
          <p class="lede">Real-time simulation node visualization and active supply flow tracking.</p>

          <div style="background:var(--band2);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin:1rem 0;text-align:center">
            <div style="display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:1rem">
              <div><strong>Supplier Hub</strong><br><small>Lead Time: 3 Days</small></div>
              <div style="color:var(--acc);font-weight:bold">➔ [ In Transit: 1,400 ${activeSector.unit} ] ➔</div>
              <div><strong>Central Facility</strong><br><small>Stock: Active</small></div>
              <div style="color:var(--acc);font-weight:bold">➔ [ Distribution ] ➔</div>
              <div><strong>Customer Channels</strong><br><small>Demand Rate: Normal</small></div>
            </div>
          </div>

          <div class="row" style="margin-top:1rem">
            <button class="btn sm" onclick="simDay++; renderView(historyStack[historyStack.length-1]);">Step Next Day (+1)</button>
            <button class="btn sm lite" onclick="simFillRate = +(simFillRate + 0.1).toFixed(1); renderView(historyStack[historyStack.length-1]);">Optimize Replenishment</button>
          </div>
        </div>

        <!-- Inventory Decision Table -->
        <div class="card">
          <div class="cardhead">
            <h2>Active Portfolio Inventory</h2>
          </div>
          <div class="gridwrap">
            <table class="dg">
              <thead>
                <tr>
                  <th>SKU Code & Description</th>
                  <th>Unit Selling Price</th>
                  <th>Unit Standard Cost</th>
                  <th>Current On-Hand</th>
                  <th>Stock Status</th>
                </tr>
              </thead>
              <tbody>
                ${tableRows}
              </tbody>
            </table>
          </div>
        </div>

        ${renderNavBars('bottom')}
      </div>

      <div id="side">
        <div class="card">
          <h3>Active Controls</h3>
          <p class="hint">Adjust parameters for the active sector simulation model.</p>
          <div class="hr"></div>
          <div class="ctl">
            <div class="lab"><b>Safety Stock Buffer</b><span class="val">+15%</span></div>
            <input type="range" min="0" max="50" value="15">
          </div>
          <div class="ctl">
            <div class="lab"><b>Order Review Frequency</b><span class="val">7 Days</span></div>
            <input type="range" min="1" max="14" value="7">
          </div>
        </div>
      </div>
    </main>
  `;
}

/* 3. Sector Selector View */
function renderSectorPicker() {
  var keys = Object.keys(SECTORS);
  var cards = keys.map(function(k) {
    var sec = SECTORS[k];
    return `
      <div class="card" style="cursor:pointer" onclick="activeSector = SECTORS['${k}']; navigateTo('sim');">
        <div class="eyebrow">${sec.key}</div>
        <h2 style="text-align:left;margin:.4rem 0">${sec.name}</h2>
        <p style="font-size:var(--t-sm);color:var(--ink2)">${sec.blurb}</p>
        <button class="btn sm lite" style="margin-top:.8rem">Select ${sec.company} →</button>
      </div>
    `;
  }).join('');

  return `
    <div class="wrap" style="padding-top:2rem;padding-bottom:3rem">
      ${renderNavBars('top')}
      <h1>Select Industry Sector</h1>
      <p class="lede" style="text-align:center;margin-bottom:2rem">Choose an operational model to test supply chain decision making under distinct constraints.</p>
      <div class="grid2">
        ${cards}
      </div>
      ${renderNavBars('bottom')}
    </div>
  `;
}

/* 4. Theory & Teaching View */
function renderTheory() {
  return `
    <div class="wrap" style="padding-top:2rem;padding-bottom:3rem">
      ${renderNavBars('top')}
      <div class="card">
        <h1>First Principles of Supply Chain Planning</h1>
        <p class="lede" style="margin-top:1rem">Supply chain management balances three competing forces: Customer Service Level, Working Capital Investment, and Operating Cost Efficiency.</p>
        
        <div class="hr"></div>
