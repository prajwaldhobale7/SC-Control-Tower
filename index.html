/* ==========================================================
   11 · COMPUTED PLOTS
   ----------------------------------------------------------
   Every curve here is genuinely computed from the formula it
   illustrates, with axes, values and the annotation a
   textbook figure would carry. Nothing is drawn to look
   approximately right.

   THE DISTINCTION THAT MATTERS
     section 8  dg*   DIAGRAMS. Geometry chosen to explain an idea.
     section 11 sci*  PLOTS. Geometry derived from a function.
     section 12 sc*   SCHEMATICS. Technical drawings on a baseline grid.

   Because the sci* family evaluates real functions — npdf, ncdf, nInv,
   lossG — any change to the engine's maths shows up here immediately.
   These figures cannot drift out of agreement with the simulator.
   ========================================================== */

/* axes(o): the shared axis renderer for this family. Emits the two solid
   axis lines plus optional titles, with the y title rotated about its own
   origin. Every sci* function ends with a call to this. */
function axes(o){
  var s='<line class="axis" x1="'+o.pl+'" y1="'+(o.pt+o.ih)+'" x2="'+(o.w-o.pr)+'" y2="'+(o.pt+o.ih)+'"/>'+
        '<line class="axis" x1="'+o.pl+'" y1="'+o.pt+'" x2="'+o.pl+'" y2="'+(o.pt+o.ih)+'"/>';
  if(o.xl) s+=tx(o.pl+o.iw/2,o.h-6,o.xl,"middle","lbl",10);
  if(o.yl) s+='<text transform="translate(12,'+(o.pt+o.ih/2)+') rotate(-90)" text-anchor="middle" class="lbl" font-size="10">'+o.yl+'</text>';
  return s;
}

/* sciNormal(): the standard normal density, with the 95% service level
   shaded. Three paths are built: the whole curve, the left region under the
   reorder point (green, "you are fine"), and the right tail (red, stockout).
   The safety stock bracket beneath the axis runs from the mean to the
   reorder point, which is the visual definition of Z × sigma. */
function sciNormal(){
  var w=560,h=250,pl=54,pr=18,pt=22,pb=48,iw=w-pl-pr,ih=h-pt-pb;
  /* the x axis spans ±3.6 sigma; 0.42 is just above the peak density */
  var X=function(z){return pl+(z+3.6)/7.2*iw;}, Y=function(p){return pt+ih-p/0.42*ih;};
  var s=svgOpen(w,h);
  var d="",fill="M"+X(-3.6)+","+Y(0);
  for(var i=0;i<=180;i++){var z=-3.6+i*0.04; d+=(i?"L":"M")+X(z).toFixed(1)+","+Y(npdf(z)).toFixed(1);}
  var z95=nInv(0.95);
  /* the red tail: from the reorder point to the right edge, closed to y=0 */
  var f="M"+X(z95).toFixed(1)+","+Y(0).toFixed(1);
  for(var j=0;j<=60;j++){var z2=z95+j*(3.6-z95)/60; f+="L"+X(z2).toFixed(1)+","+Y(npdf(z2)).toFixed(1);}
  f+="L"+X(3.6).toFixed(1)+","+Y(0).toFixed(1)+"Z";
  /* the green region: everything to the left of the reorder point */
  var g2="M"+X(-3.6)+","+Y(0);
  for(var k=0;k<=120;k++){var z3=-3.6+k*(z95+3.6)/120; g2+="L"+X(z3).toFixed(1)+","+Y(npdf(z3)).toFixed(1);}
  g2+="L"+X(z95).toFixed(1)+","+Y(0).toFixed(1)+"Z";
  s+='<path d="'+g2+'" fill="#00A67D" opacity=".16"/>';
  s+='<path d="'+f+'" fill="#CE2B3C" opacity=".3"/>';
  s+='<path d="'+d+'" fill="none" stroke="var(--ink)" stroke-width="2.2"/>';
  /* two vertical markers: the mean, and the reorder point */
  [[0,"mean demand\\nover the lead time","var(--sub)"],[z95,"reorder point","#CE2B3C"]].forEach(function(m){
    s+='<line x1="'+X(m[0]).toFixed(1)+'" y1="'+pt+'" x2="'+X(m[0]).toFixed(1)+'" y2="'+Y(0)+
       '" stroke="'+m[2]+'" stroke-width="1.5" stroke-dasharray="5 4"/>';
    m[1].split("\\n").forEach(function(t,i){ s+=tx(X(m[0]),pt+12+i*11,t,"middle","lbl",9.5,m[2]); });
  });
  s+='<line x1="'+X(0).toFixed(1)+'" y1="'+(Y(0)+14)+'" x2="'+X(z95).toFixed(1)+'" y2="'+(Y(0)+14)+
     '" stroke="var(--acc)" stroke-width="2"/>';
  s+=tx((X(0)+X(z95))/2,Y(0)+27,"safety stock = Z x sigma","middle","",10.5,"var(--accInk)");
  s+=tx(X(2.4),Y(0)-14,"stockout","middle","",10,"#9B1F2C");
  s+=tx(X(2.4),Y(0)-3,"5% of cycles","middle","lbl",9.5,"#9B1F2C");
  s+=tx(X(-1.5),Y(0.16),"95% of cycles you are fine","middle","",10.5,"#046046");
  [-3,-2,-1,0,1,2,3].forEach(function(z){ s+=tx(X(z),Y(0)+40,(z>0?"+":"")+z+"σ","middle","lbl",9); });
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,yl:"probability"});
  return s+'</svg>';
}

/* sciServiceZ(): Z plotted against service level, sampled every 0.1% from 50
   to 99.9. Five labelled markers at the service levels people actually quote.
   The label offsets in MK are hand-tuned because the curve turns so sharply
   at the top that automatic placement would overlap. */
function sciServiceZ(){
  var w=560,h=250,pl=58,pr=20,pt=20,pb=46,iw=w-pl-pr,ih=h-pt-pb;
  var lv=[]; for(var p=50;p<=99.9;p+=0.1) lv.push(p);
  var zmax=nInv(0.999);
  var X=function(p){return pl+(p-50)/49.9*iw;}, Y=function(z){return pt+ih-Math.max(z,0)/zmax*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,fm(zmax*i/4,2),"end","",9.5);}
  var d="";
  lv.forEach(function(p,i){ d+=(i?"L":"M")+X(p).toFixed(1)+","+Y(nInv(p/100)).toFixed(1); });
  s+='<path d="'+d+'" fill="none" stroke="var(--acc)" stroke-width="2.6"/>';
  /* [service level, Z label, x offset, y offset] — offsets hand-placed */
  var MK=[[90,"1.28",0,-13],[95,"1.64",0,-13],[98,"2.05",-60,-10],[99,"2.33",-60,26],[99.9,"3.09",-96,-16]];
  MK.forEach(function(m){
    var z=nInv(m[0]/100);
    s+='<circle cx="'+X(m[0]).toFixed(1)+'" cy="'+Y(z).toFixed(1)+'" r="4" fill="var(--ink)"/>';
    s+='<line x1="'+X(m[0]).toFixed(1)+'" y1="'+Y(z).toFixed(1)+'" x2="'+(X(m[0])+m[2]+ (m[2]<0?14:-2)).toFixed(1)+
       '" y2="'+(Y(z)+m[3]).toFixed(1)+'" stroke="var(--sub2)" stroke-width=".8"/>';
    s+=tx(X(m[0])+m[2],Y(z)+m[3]-1,m[0]+"% = "+m[1],m[2]<0?"end":"start","",9.5,"var(--ink)");});
  s+='<rect x="'+X(95).toFixed(1)+'" y="'+pt+'" width="'+(X(99.9)-X(95)).toFixed(1)+'" height="'+ih+
     '" fill="#CE2B3C" opacity=".08"/>';
  s+=tx((X(95)+X(99.9))/2,pt+ih-8,"the last 4.9 points nearly double the buffer","middle","",10,"#9B1F2C");
  [50,70,80,90,95,99].forEach(function(p){ s+=tx(X(p),h-24,p+"%","middle","lbl",9.5); });
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,xl:"cycle service level",yl:"Z, the safety factor"});
  return s+'</svg>';
}

/* sciTwoTerm(): the two terms of the safety stock formula plotted separately
   against lead time, with realistic numbers (d=120, sd=26, sLT=6, Z=1.64).
   Term one grows as sqrt(LT); term two is CONSTANT in lead time, which is the
   whole point — shortening the lead time does not touch it.
   The slot-sorting at the end pushes the three right-hand labels apart by a
   minimum gap, because at short lead times they would otherwise coincide. */
function sciTwoTerm(){
  var w=560,h=250,pl=58,pr=100,pt=20,pb=46,iw=w-pl-pr,ih=h-pt-pb;
  var d0=120,sd=26,sLT=6,z=1.64,LTmax=60;
  var t1=function(L){return z*Math.sqrt(L*sd*sd);};              /* demand variability */
  var t2=function(L){return z*Math.sqrt(d0*d0*sLT*sLT);};        /* lead-time variability */
  var tot=function(L){return z*Math.sqrt(L*sd*sd+d0*d0*sLT*sLT);};
  var mx=nice(tot(LTmax)*1.08);
  var X=function(L){return pl+L/LTmax*iw;}, Y=function(v){return pt+ih-v/mx*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,qty(mx*i/4),"end","",9.5);}
  var a="M"+X(0)+","+Y(0), b="M"+X(0)+","+Y(0);
  for(var L=0;L<=LTmax;L++){ a+="L"+X(L).toFixed(1)+","+Y(t1(L)).toFixed(1); }
  a+="L"+X(LTmax)+","+Y(0)+"Z";
  s+='<path d="'+a+'" fill="#4B63E8" opacity=".22"/>';
  var c="";
  for(var L2=0;L2<=LTmax;L2++){ c+=(L2?"L":"M")+X(L2).toFixed(1)+","+Y(tot(L2)).toFixed(1); }
  s+='<path d="'+c+'" fill="none" stroke="var(--ink)" stroke-width="2.6"/>';
  var e="";
  for(var L3=0;L3<=LTmax;L3++){ e+=(L3?"L":"M")+X(L3).toFixed(1)+","+Y(t1(L3)).toFixed(1); }
  s+='<path d="'+e+'" fill="none" stroke="#4B63E8" stroke-width="2" stroke-dasharray="5 4"/>';
  s+='<line x1="'+pl+'" y1="'+Y(t2(0)).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(t2(0)).toFixed(1)+
     '" stroke="#CE2B3C" stroke-width="2" stroke-dasharray="5 4"/>';
  /* label anti-collision: sort by y, then walk down enforcing a 26px gap */
  var slots=[{y:Y(tot(LTmax)),t:["total",""],c:"var(--ink)"},
             {y:Y(t1(LTmax)),t:["demand","variability"],c:"#2A35A0"},
             {y:Y(t2(0)),t:["lead time","variability"],c:"#9B1F2C"}];
  slots.sort(function(a,b){return a.y-b.y;});
  var minGap=26, prev=-1e9;
  slots.forEach(function(sl){
    var y=Math.max(sl.y, prev+minGap); prev=y;
    s+=tx(w-pr+5,y+4,sl.t[0],"start","",10,sl.c);
    if(sl.t[1]) s+=tx(w-pr+5,y+15,sl.t[1],"start","lbl",9,sl.c);
  });
  [0,15,30,45,60].forEach(function(L){ s+=tx(X(L),h-24,L+"d","middle","lbl",9.5); });
  s+=tx(pl+iw*0.32,pt+16,"lead time variability does not shrink when lead time does","start","",10,"#9B1F2C");
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,xl:"lead time, days",yl:"safety stock, units"});
  return s+'</svg>';
}

/* sciFill(): fill rate against cycle service level, computed through the
   loss function with sigma=60 and Q=900. The grey dashed 45° line is where
   they would be equal; the orange curve sits above it throughout, and the
   gap is the point. Both are plotted on the same 70-100 axis. */
function sciFill(){
  var w=560,h=250,pl=56,pr=20,pt=20,pb=46,iw=w-pl-pr,ih=h-pt-pb;
  var sig=60,Q=900;
  var X=function(c){return pl+(c-70)/29.8*iw;}, Y=function(f){return pt+ih-(f-70)/30*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=5;i++){var y=pt+ih-ih*i/5;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,fm(70+30*i/5,0)+"%","end","",9.5);}
  var d="",e="";
  for(var c=70;c<=99.8;c+=0.2){
    var z=nInv(c/100), fill=clamp((1-(sig*lossG(z))/Q)*100,70,100);
    d+=(d?"L":"M")+X(c).toFixed(1)+","+Y(fill).toFixed(1);
    e+=(e?"L":"M")+X(c).toFixed(1)+","+Y(c).toFixed(1);      /* the parity line */
  }
  s+='<path d="'+e+'" fill="none" stroke="var(--sub2)" stroke-width="1.8" stroke-dasharray="5 4"/>';
  s+='<path d="'+d+'" fill="none" stroke="var(--acc)" stroke-width="2.8"/>';
  /* the 95% case, marked on both curves with a connecting rule */
  var z95=nInv(0.95), f95=(1-(sig*lossG(z95))/Q)*100;
  s+='<line x1="'+X(95).toFixed(1)+'" y1="'+Y(95).toFixed(1)+'" x2="'+X(95).toFixed(1)+'" y2="'+Y(f95).toFixed(1)+
     '" stroke="var(--ink)" stroke-width="2"/>';
  s+='<circle cx="'+X(95).toFixed(1)+'" cy="'+Y(f95).toFixed(1)+'" r="4.5" fill="var(--acc)"/>';
  s+='<circle cx="'+X(95).toFixed(1)+'" cy="'+Y(95).toFixed(1)+'" r="4.5" fill="var(--sub2)"/>';
  s+=tx(X(95)+8,Y(f95)-4,"fill rate "+fm(f95,1)+"%","start","",10.5,"var(--accInk)");
  s+=tx(X(95)+8,Y(95)+13,"service level 95%","start","",10.5,"var(--sub)");
  s+=tx(X(82),Y(88),"the gap is free credibility:","middle","",10.5,"var(--ink)");
  s+=tx(X(82),Y(85.4),"customers feel the orange line","middle","lbl",10);
  [70,80,90,95,99].forEach(function(c){ s+=tx(X(c),h-24,c+"%","middle","lbl",9.5); });
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,xl:"cycle service level, the probability of no stockout",yl:"fill rate"});
  return s+'</svg>';
}

/* sciEOQ(): the EOQ cost curves with worked numbers (D=52000, S=180, H=3.2).
   The green band spans 30% either side of the optimum, and the caption
   computes the actual penalty at its edge rather than quoting a rule of
   thumb — for these numbers it is about 2%. */
function sciEOQ(){
  var w=560,h=255,pl=62,pr=20,pt=20,pb=52,iw=w-pl-pr,ih=h-pt-pb;
  var D=52000,Sc=180,H=3.2;
  var eoq=Math.sqrt(2*D*Sc/H), qmax=eoq*2.6;
  var ordC=function(q){return D/q*Sc;}, holdC=function(q){return q/2*H;};
  var totC=function(q){return ordC(q)+holdC(q);};
  var mx=nice(totC(qmax));
  var X=function(q){return pl+q/qmax*iw;}, Y=function(v){return pt+ih-clamp(v/mx,0,1)*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,money(mx*i/4),"end","",9.5);}
  var lo=eoq*0.7, hi=eoq*1.3;
  s+='<rect x="'+X(lo).toFixed(1)+'" y="'+pt+'" width="'+(X(hi)-X(lo)).toFixed(1)+'" height="'+ih+
     '" fill="#00A67D" opacity=".1"/>';
  /* sampling starts at qmax/120 rather than 0, because ordering cost is
     asymptotic at the origin and would blow the scale */
  var mk=function(fn,col,wd,dash){var d="";
    for(var q=qmax/120;q<=qmax;q+=qmax/120){ d+=(d?"L":"M")+X(q).toFixed(1)+","+Y(fn(q)).toFixed(1); }
    return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+wd+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>';};
  s+=mk(ordC,"#4B63E8",1.9,1)+mk(holdC,"#C99A06",1.9,1)+mk(totC,"var(--ink)",2.8);
  s+='<line x1="'+X(eoq).toFixed(1)+'" y1="'+Y(totC(eoq)).toFixed(1)+'" x2="'+X(eoq).toFixed(1)+'" y2="'+Y(0)+
     '" stroke="#00A67D" stroke-width="1.8" stroke-dasharray="4 3"/>';
  s+='<circle cx="'+X(eoq).toFixed(1)+'" cy="'+Y(totC(eoq)).toFixed(1)+'" r="5" fill="#00A67D"/>';
  s+=tx(X(eoq),Y(totC(eoq))-12,"EOQ = "+fm(eoq,0)+" units","middle","",10.5,"#046046");
  s+=tx(X(eoq),Y(0)+15,"where the two lines cross","middle","lbl",9.5,"#046046");
  s+=tx(X(eoq*1.75),Y(holdC(eoq*1.75))+16,"holding cost","start","",10,"#7A5D00");
  s+=tx(X(eoq*0.42),Y(ordC(eoq*0.42))-8,"ordering cost","start","",10,"#2A35A0");
  s+=tx(X(eoq*2.1),Y(totC(eoq*2.1))-10,"total","start","",10,"var(--ink)");
  var pen=(totC(hi)/totC(eoq)-1)*100;    /* the real penalty at +30% */
  s+=tx((X(lo)+X(hi))/2,pt+14,"30% either side costs only "+fm(pen,1)+"% more","middle","",10.5,"#046046");
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,xl:"order quantity",yl:"annual cost"});
  return s+'</svg>';
}

/* sciPareto(): a fifty-line portfolio with geometrically decaying value
   (ratio 0.895), which reproduces the classic 20/80 shape. Bars are the
   individual values; the black line is cumulative. The A and B cut lines are
   FOUND from the data at the 80% and 95% crossings rather than assumed. */
function sciPareto(){
  var w=560,h=250,pl=54,pr=44,pt=20,pb=46,iw=w-pl-pr,ih=h-pt-pb;
  var n=50, vals=[];
  for(var i=0;i<n;i++) vals.push(Math.pow(0.895,i));
  var tot=sum(vals), cum=0, pts=[];
  vals.forEach(function(v,i){ cum+=v; pts.push({x:(i+1)/n*100,y:cum/tot*100,v:v/tot*100}); });
  var X=function(p){return pl+p/100*iw;}, Y=function(p){return pt+ih-p/100*ih;};
  var s=svgOpen(w,h);
  for(var g=0;g<=4;g++){var y=pt+ih-ih*g/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,(g*25)+"%","end","",9.5);}
  vals.forEach(function(v,i){
    /* bars are scaled to 55% of the plot height so they sit under the line */
    var bh=(v/tot*100)/(vals[0]/tot*100)*ih*0.55;
    var band=pts[i].y<=80?"#4B63E8":pts[i].y<=95?"#7C5CF0":"#8497AE";
    s+='<rect x="'+X(i/n*100).toFixed(1)+'" y="'+(pt+ih-bh).toFixed(1)+'" width="'+(iw/n-1.4).toFixed(1)+
       '" height="'+bh.toFixed(1)+'" fill="'+band+'" opacity=".5"/>';});
  var d="M"+X(0)+","+Y(0);
  pts.forEach(function(p){ d+="L"+X(p.x).toFixed(1)+","+Y(p.y).toFixed(1); });
  s+='<path d="'+d+'" fill="none" stroke="var(--ink)" stroke-width="2.6"/>';
  var a=pts.filter(function(p){return p.y<=80;}).length, b=pts.filter(function(p){return p.y<=95;}).length;
  [[a,"A","#2A35A0"],[b,"B","#4A3894"]].forEach(function(m){
    s+='<line x1="'+X(m[0]/n*100).toFixed(1)+'" y1="'+pt+'" x2="'+X(m[0]/n*100).toFixed(1)+'" y2="'+Y(0)+
       '" stroke="'+m[2]+'" stroke-width="1.5" stroke-dasharray="4 3"/>';});
  s+=tx(X(a/n*100)+8,pt+16,"A: "+fm(a/n*100,0)+"% of lines","start","",10.5,"#2A35A0");
  s+=tx(X(a/n*100)+8,pt+28,"carry 80% of the value","start","lbl",9.5,"#2A35A0");
  s+=tx((X(a/n*100)+X(b/n*100))/2,Y(6),"B","middle","",11,"#4A3894");
  s+=tx(X(100)-6,Y(34),"C: "+fm((n-b)/n*100,0)+"% of lines","end","",10,"#556780");
  s+=tx(X(100)-6,Y(34)+12,"carry 5% of the value","end","lbl",9.5,"#556780");
  [0,25,50,75,100].forEach(function(p){ s+=tx(X(p),h-24,p+"%","middle","lbl",9.5); });
  s+=tx(w-pr+6,Y(80),"80%","start","lbl",9,"var(--ink)");
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,xl:"product lines, ranked by value",yl:"cumulative value"});
  return s+'</svg>';
}

/* sciQueue(): relative lead time against utilisation, at three levels of
   process variability. The curve is 1 + cv·(u/(1−u)) — Kingman's
   approximation in its simplest form. Plotting three variability levels is
   what makes the second, less obvious point: reducing variability buys you
   the right to run at higher utilisation for the same lead time. */
function sciQueue(){
  var w=560,h=250,pl=56,pr=54,pt=20,pb=46,iw=w-pl-pr,ih=h-pt-pb;
  var X=function(u){return pl+(u-40)/58*iw;}, Y=function(t){return pt+ih-clamp(t/14,0,1)*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,fm(14*i/4,1)+"x","end","",9.5);}
  var QI=0;
  [[0.5,"#00A67D","steady process"],[1,"var(--acc)","typical"],[1.8,"#CE2B3C","high variability"]].forEach(function(cv){
    var d="";
    for(var u=40;u<=98;u+=0.5){ var r=u/100, t=1+cv[0]*(r/(1-r)); d+=(d?"L":"M")+X(u).toFixed(1)+","+Y(t).toFixed(1); }
    s+='<path d="'+d+'" fill="none" stroke="'+cv[1]+'" stroke-width="2.4"/>';
    /* labels are placed at different utilisations per series and then
       clamped into non-overlapping bands, because the curves converge left */
    var uu=[88,91,93][QI], tt=1+cv[0]*((uu/100)/(1-uu/100));
    s+=tx(w-pr+5,clamp(Y(tt)+4,pt+14+QI*20,pt+ih-4),cv[2],"start","lbl",9,cv[1]);
    QI++;
  });
  s+='<rect x="'+X(85).toFixed(1)+'" y="'+pt+'" width="'+(X(98)-X(85)).toFixed(1)+'" height="'+ih+
     '" fill="#CE2B3C" opacity=".07"/>';
  s+=tx((X(85)+X(98))/2,pt+14,"past 85%, small changes","middle","",10,"#9B1F2C");
  s+=tx((X(85)+X(98))/2,pt+26,"produce large delays","middle","",10,"#9B1F2C");
  [40,60,75,85,90,95].forEach(function(u){ s+=tx(X(u),h-24,u+"%","middle","lbl",9.5); });
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,xl:"utilisation",yl:"lead time, relative"});
  return s+'</svg>';
}

/* sciPooling(): the square-root law. Two curves — what people assume (linear,
   dashed grey) and what happens (sqrt, solid accent) — with the 9→1
   consolidation marked as a vertical bar between the two. */
function sciPooling(){
  var w=540,h=240,pl=56,pr=24,pt=20,pb=46,iw=w-pl-pr,ih=h-pt-pb;
  var X=function(n){return pl+(n-1)/15*iw;}, Y=function(v){return pt+ih-v/16*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,fm(16*i/4,0)+"x","end","",9.5);}
  var d="",e="";
  for(var n=1;n<=16;n+=0.25){ d+=(d?"L":"M")+X(n).toFixed(1)+","+Y(Math.sqrt(n)).toFixed(1);
    e+=(e?"L":"M")+X(n).toFixed(1)+","+Y(n).toFixed(1); }
  s+='<path d="'+e+'" fill="none" stroke="var(--sub2)" stroke-width="1.8" stroke-dasharray="5 4"/>';
  s+='<path d="'+d+'" fill="none" stroke="var(--acc)" stroke-width="2.8"/>';
  /* the four perfect squares, where sqrt is a whole number */
  [1,4,9,16].forEach(function(n){
    s+='<circle cx="'+X(n).toFixed(1)+'" cy="'+Y(Math.sqrt(n)).toFixed(1)+'" r="4.5" fill="var(--acc)"/>';
    s+=tx(X(n),Y(Math.sqrt(n))-10,fm(Math.sqrt(n),0)+"x","middle","",10,"var(--accInk)");});
  s+=tx(X(12),Y(13),"what people assume","middle","lbl",10,"var(--sub2)");
  s+=tx(X(14),Y(7.2),"what actually happens","end","",10.5,"var(--accInk)");
  s+='<line x1="'+X(9).toFixed(1)+'" y1="'+Y(3).toFixed(1)+'" x2="'+X(9).toFixed(1)+'" y2="'+Y(9).toFixed(1)+
     '" stroke="#00A67D" stroke-width="2.4"/>';
  s+=tx(X(9)+7,(Y(3)+Y(9))/2,"9 depots into 1","start","",10,"#046046");
  s+=tx(X(9)+7,(Y(3)+Y(9))/2+12,"cuts buffer by two thirds","start","lbl",9.5,"#046046");
  [1,4,8,12,16].forEach(function(n){ s+=tx(X(n),h-24,n,"middle","lbl",9.5); });
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,xl:"number of stocking locations",yl:"total safety stock needed"});
  return s+'</svg>';
}

/* sciNewsvendor(): the density again, but split at the CRITICAL RATIO rather
   than at a service level. With Cu=14 and Co=6 the ratio is 0.70, so the
   optimal order sits at the 70th percentile — visibly right of the peak,
   which is the entire lesson. The two shaded regions are labelled with their
   own unit costs, so the asymmetry is explicit. */
function sciNewsvendor(){
  var w=560,h=250,pl=54,pr=20,pt=20,pb=52,iw=w-pl-pr,ih=h-pt-pb;
  var Cu=14,Co=6, cr=Cu/(Cu+Co), zStar=nInv(cr);
  var X=function(z){return pl+(z+3.4)/6.8*iw;}, Y=function(p){return pt+ih-p/0.42*ih;};
  var s=svgOpen(w,h);
  var lo="M"+X(-3.4)+","+Y(0), hi2="M"+X(zStar).toFixed(1)+","+Y(0).toFixed(1);
  for(var i=0;i<=120;i++){var z=-3.4+i*(zStar+3.4)/120; lo+="L"+X(z).toFixed(1)+","+Y(npdf(z)).toFixed(1);}
  lo+="L"+X(zStar).toFixed(1)+","+Y(0).toFixed(1)+"Z";
  for(var j=0;j<=80;j++){var z2=zStar+j*(3.4-zStar)/80; hi2+="L"+X(z2).toFixed(1)+","+Y(npdf(z2)).toFixed(1);}
  hi2+="L"+X(3.4).toFixed(1)+","+Y(0).toFixed(1)+"Z";
  s+='<path d="'+lo+'" fill="#C99A06" opacity=".2"/>';     /* left over */
  s+='<path d="'+hi2+'" fill="#CE2B3C" opacity=".24"/>';   /* sold out */
  var d="";
  for(var k=0;k<=170;k++){var z3=-3.4+k*0.04; d+=(k?"L":"M")+X(z3).toFixed(1)+","+Y(npdf(z3)).toFixed(1);}
  s+='<path d="'+d+'" fill="none" stroke="var(--ink)" stroke-width="2.2"/>';
  s+='<line x1="'+X(zStar).toFixed(1)+'" y1="'+pt+'" x2="'+X(zStar).toFixed(1)+'" y2="'+Y(0)+
     '" stroke="var(--acc)" stroke-width="2.4"/>';
  s+=tx(X(zStar),pt+12,"order up to here","middle","",10.5,"var(--accInk)");
  s+=tx(X(zStar),pt+24,"the "+fm(cr*100,0)+"th percentile of demand","middle","lbl",9.5,"var(--accInk)");
  s+=tx(X(-1.5),Y(0.1),"left over","middle","",10.5,"#7A5D00");
  s+=tx(X(-1.5),Y(0.1)+12,"costs "+money(Co)+" each","middle","lbl",9.5,"#7A5D00");
  s+=tx(X(2.1),Y(0.05),"sold out","middle","",10.5,"#9B1F2C");
  s+=tx(X(2.1),Y(0.05)+12,"costs "+money(Cu)+" each","middle","lbl",9.5,"#9B1F2C");
  s+=tx(pl+iw/2,h-28,"critical ratio = Cu / (Cu + Co) = "+money(Cu)+" / "+money(Cu+Co)+" = "+fm(cr,2),
    "middle","",11.5,"var(--ink)");
  s+=tx(pl+iw/2,h-12,"when running out hurts more than overstocking, the answer is more than the average. Always.",
    "middle","lbl",10);
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,yl:"probability"});
  return s+'</svg>';
}

/* sciBias(): two panels, identical spread, different centre. The panel()
   closure draws one distribution with its own local coordinate system, which
   is why pl/pt/ih are redeclared inside it. The right panel adds a red
   bracket from zero to the shifted mean: that bracket IS the bias. */
function sciBias(){
  var w=560,h=230,s=svgOpen(w,h);
  var panel=function(x0,shift,spread,title,note,col){
    var pl=x0+8,iw=232,pt=48,ih=100;
    var X=function(z){return pl+(z+3.4)/6.8*iw;}, Y=function(p){return pt+ih-p/0.42*ih;};
    var d="";
    for(var i=0;i<=170;i++){var z=-3.4+i*0.04;
      d+=(i?"L":"M")+X(z).toFixed(1)+","+Y(npdf((z-shift)/spread)/spread).toFixed(1);}
    var o='<path d="'+d+'" fill="'+col+'" opacity=".18"/>'+'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2"/>';
    o+='<line x1="'+X(0).toFixed(1)+'" y1="'+pt+'" x2="'+X(0).toFixed(1)+'" y2="'+Y(0)+
       '" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 3"/>';
    o+=tx(X(0),pt-9,"zero error","middle","lbl",9);
    if(shift!==0){
      o+='<line x1="'+X(0).toFixed(1)+'" y1="'+(Y(0)+10)+'" x2="'+X(shift).toFixed(1)+'" y2="'+(Y(0)+10)+
         '" stroke="#CE2B3C" stroke-width="2.4"/>';
      o+=tx((X(0)+X(shift))/2,Y(0)+23,"bias","middle","",10,"#9B1F2C");
    }
    o+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(pl+iw)+'" y2="'+(pt+ih)+'"/>';
    o+=tx(pl+iw/2,18,title,"middle","",11.5,"var(--ink)");
    o+=tx(pl+iw/2,h-24,note,"middle","lbl",10);
    return o;};
  s+=panel(6,0,1,"Accurate and unbiased","errors cancel out; buffer them and you are done","#00A67D");
  s+=panel(288,1.35,1,"Same spread, but biased","errors accumulate; no buffer ever fixes this","#CE2B3C");
  s+=tx(280,h-6,"MAPE measures the width. Bias measures the shift. They are different problems with different cures.",
    "middle","",11,"var(--ink)");
  return s+'</svg>';
}

/* sciBullwhip(): variance amplification across four echelons at three lead
   times. The amplification per echelon follows the Chen et al. form
   1 + 2L/p + 2L²/p², here with p=4 review periods, raised to e/2 to give the
   standard-deviation ratio rather than the variance ratio. */
function sciBullwhip(){
  var w=560,h=250,pl=56,pr=24,pt=20,pb=52,iw=w-pl-pr,ih=h-pt-pb;
  var X=function(e){return pl+e/4*iw;}, Y=function(v){return pt+ih-clamp((v-1)/5,0,1)*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,fm(1+5*i/4,1)+"x","end","",9.5);}
  var BI=0;
  [[1,"#00A67D","1 week"],[2,"var(--acc)","2 weeks"],[4,"#CE2B3C","4 weeks"]].forEach(function(L){
    BI++;
    var d="";
    for(var e=0;e<=4;e++){
      var amp=Math.pow(1+2*L[0]/4+2*L[0]*L[0]/16,e/2);
      d+=(e?"L":"M")+X(e).toFixed(1)+","+Y(amp).toFixed(1);
      /* label at the right-hand end, banded to avoid collision */
      if(e===4){ var ly=clamp(Y(amp)-9, pt+14+(3-BI)*18, pt+ih-6); s+=tx(X(e)-4,ly,L[2]+" lead time","end","",10,L[1]); }
    }
    s+='<path d="'+d+'" fill="none" stroke="'+L[1]+'" stroke-width="2.6"/>';
    for(var e2=0;e2<=4;e2++){
      var a2=Math.pow(1+2*L[0]/4+2*L[0]*L[0]/16,e2/2);
      s+='<circle cx="'+X(e2).toFixed(1)+'" cy="'+Y(a2).toFixed(1)+'" r="3.4" fill="'+L[1]+'"/>';}
  });
  ["shop","distributor","factory","tier 2","tier 3"].forEach(function(t,i){
    s+=tx(X(i),h-30,t,"middle","lbl",9.5);});
  s+=tx(pl+iw/2,h-11,"Amplification compounds at every step, and lead time is the multiplier.","middle","",11,"var(--ink)");
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,yl:"order variance, relative to demand"});
  return s+'</svg>';
}

/* sciMode(): the total-cost mode comparison, using the flagship handset's
   real parameters (420g, €690, 31% carry, 9,400km, 92,000 units).
   Each bar has two segments: freight PAID (solid) and the inventory that
   transit time CREATES (pale). The inventory term is deliberately quadratic
   in transit days — days of pipeline multiplied by a safety-stock effect
   that also grows with the lane — which is why the ranking inverts. */
function sciMode(){
  var w=560,h=255,pl=60,pr=24,pt=20,pb=54,iw=w-pl-pr,ih=h-pt-pb;
  var kg=0.42, val=690, carry=0.31, km=9400, units=92000;
  var M2=[["Ocean","ocean","#4B63E8"],["Rail","rail","#00A67D"],["Air","air","#CE2B3C"],["Courier","courier","#C99A06"]];
  var rows=M2.map(function(m){
    var mo=MODES[m[1]];
    var fr=kg*mo.eurPerKgKm*km*units;
    var inv=units/91*mo.days*val*carry/365*mo.days;
    return {n:m[0],c:m[2],fr:fr,inv:inv,tot:fr+inv,days:mo.days};});
  var mx=nice(Math.max.apply(null,rows.map(function(r){return r.tot;})));
  var Y=function(v){return pt+ih-v/mx*ih;};
  var gw=iw/rows.length, bw=gw*0.46;
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,money(mx*i/4),"end","",9.5);}
  rows.forEach(function(r,i){
    var cx=pl+gw*i+gw/2;
    s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(r.fr).toFixed(1)+'" width="'+bw.toFixed(1)+
       '" height="'+(Y(0)-Y(r.fr)).toFixed(1)+'" fill="'+r.c+'" rx="3"/>';
    s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(r.tot).toFixed(1)+'" width="'+bw.toFixed(1)+
       '" height="'+(Y(r.fr)-Y(r.tot)).toFixed(1)+'" fill="'+r.c+'" opacity=".32" rx="3"/>';
    s+=tx(cx,Y(r.tot)-6,money(r.tot),"middle","",10.5,"var(--ink)");
    s+=tx(cx,h-34,r.n,"middle","",11,"var(--ink)");
    s+=tx(cx,h-22,r.days+" days in transit","middle","lbl",9.5);});
  s+=tx(pl+6,pt+12,"solid = freight paid","start","",10,"var(--sub)");
  s+=tx(pl+6,pt+25,"pale = inventory that transit time creates","start","",10,"var(--sub)");
  s+=tx(pl+iw/2,h-6,"For a 420g item worth €690, the cheap option is not obviously the cheap option.","middle","",11,"var(--ink)");
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,yl:"total cost per quarter"});
  return s+'</svg>';
}

/* ==========================================================
   12 · SCHEMATICS
   ----------------------------------------------------------
   Technical drawings rather than sketches: aligned geometry,
   hairline rules, consistent node sizing, labels on a
   baseline grid.

   These use their own tiny primitive set (scLine, scBox, scT) rather than
   the chart helpers, because they need a different default weight and a
   different arrowhead. Colours are hard-coded hex rather than CSS variables
   so a schematic reads identically on any sector accent.
   ========================================================== */

var SC_INK="#111111", SC_RULE="#D5D9DE", SC_SOFT="#F0F2F5", SC_MID="#8A9099";
function scLine(x1,y1,x2,y2,o){o=o||{};
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(o.col||SC_RULE)+
    '" stroke-width="'+(o.w||1)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+
    (o.arrow?' marker-end="url(#scTip)"':'')+' stroke-linecap="round"/>';}
function scBox(x,y,w,h,o){o=o||{};
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(o.fill||"#FFFFFF")+
    '" stroke="'+(o.stroke||SC_RULE)+'" stroke-width="'+(o.w||1)+'" rx="'+(o.r==null?4:o.r)+'"/>';}
function scT(x,y,t,o){o=o||{};
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.anchor||"middle")+'" font-size="'+(o.size||10.5)+
    '" font-weight="'+(o.weight||400)+'" fill="'+(o.col||SC_INK)+'"'+(o.op?' opacity="'+o.op+'"':'')+'>'+t+'</text>';}
/* an open chevron arrowhead rather than a filled triangle: it reads as a
   technical drawing rather than a presentation graphic */
var SCDEF='<defs><marker id="scTip" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">'+
  '<path d="M0,0.6 L6.6,3.5 L0,6.4" fill="none" stroke="#111111" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>'+
  '</marker></defs>';

/* scChain(): the two-flow schematic that opens the primer.
   Top half: goods moving left to right, with the planning horizon shrinking
   at each step. Bottom half: orders moving right to left, with the order
   index growing 100 → 130 → 180 → 260. The reversal in the second loop is
   why the index array is read backwards. */
function scChain(){
  var w=560,h=250,s=svgOpen(w,h)+SCDEF;
  var N=[["Raw material",58],["Manufacture",172],["Distribution",286],["Retail",400],["Customer",506]];
  var tl=["weeks ahead","days ahead","hours ahead","minutes ahead"];
  s+=scT(280,26,"PHYSICAL FLOW",{size:9.5,weight:700,op:.55});
  N.forEach(function(n,i){
    s+=scBox(n[1]-46,44,92,40,{fill:i===2?SC_INK:"#FFFFFF"});
    s+=scT(n[1],68,n[0],{size:10.5,weight:600,col:i===2?"#FFFFFF":SC_INK});
    if(i<4){
      s+=scLine(n[1]+48,64,N[i+1][1]-50,64,{col:SC_INK,w:1.3,arrow:1});
      s+=scT((n[1]+N[i+1][1])/2,56,tl[i],{size:8.5,op:.55});
    }
  });
  /* information flow back */
  s+=scT(280,138,"INFORMATION FLOW",{size:9.5,weight:700,op:.55});
  N.slice().reverse().forEach(function(n,i){
    if(i<4){
      var from=N[4-i][1], to=N[3-i][1];
      s+=scLine(from-48,116,to+50,116,{col:SC_INK,w:1.3,arrow:1,dash:"4 3"});
    }
  });
  var amp=[["100","orders placed"],["130","+30%"],["180","+80%"],["260","+160%"]];
  amp.forEach(function(a,i){
    var x=N[3-i][1];      /* right to left: amplification grows upstream */
    s+=scT(x,106,a[0],{size:11,weight:700});
    s+=scT(x,166,a[1],{size:8.5,op:.6});
  });
  s+=scT(506,106,"real demand",{size:9,op:.6});
  s+=scLine(40,182,520,182,{col:SC_RULE});
  s+=scT(280,202,"Goods move left to right and accelerate. Orders move right to left and amplify.",{size:11,weight:600});

/* refBlock(key): the per-chapter bibliography. Concatenates the primary and

function refBlock(key){
  var ids=(REFS[key]||[]).concat(REF_EXTRA[key]||[]);
  var seen={}, list=[];
  ids.forEach(function(id){ if(!seen[id]&&BIB[id]){ seen[id]=1; list.push(BIB[id]); } });

/* bibliography(): the full list, for the end of the primer.

   from the author string with a regular expression, so the reader sees the
   development of the field in order: Edgeworth 1888, Harris 1913, Arrow 1951,
   and so on. Books and reference works keep their declaration order, which is
   roughly the order a newcomer would meet them. */
function bibliography(){
  var groups={book:["Books","Standard texts, in the order you would sensibly read them"],
              paper:["Papers","The original results, most of them short and worth reading in full"],
              ref:["Standards and reference works","Definitions and process models the industry actually uses"]};
  var by={book:[],paper:[],ref:[]};
  Object.keys(BIB).forEach(function(k){ by[BIB[k][3]].push(BIB[k]); });
  by.paper.sort(function(a,b){
    var ya=+(/\((\d{4})\)/.exec(a[0])||[0,0])[1], yb=+(/\((\d{4})\)/.exec(b[0])||[0,0])[1];
    return ya-yb; });
  return ["book","paper","ref"].map(function(g){
    return '<h4 style="margin:1.4rem 0 .3rem">'+esc(groups[g][0])+'</h4>'+
      '<p class="hint" style="margin-top:0">'+esc(groups[g][1])+'</p>'+

      }).join("")+'</ol>';
  }).join("");
}
/* ==========================================================
   14 · THE BOARDROOM SIMULATION
   ----------------------------------------------------------
   An original four-role business game in the same genre as
   the team simulations used on supply chain courses: you and
   three notional colleagues each hold one lever, the levers
   only work together, and one number keeps score.
   Company, products, suppliers, customers and all numbers
   below are invented for this app.

   WHY IT EXISTS ALONGSIDE THE SIMULATOR
     The eight-quarter simulator teaches the MECHANISMS. This teaches the
     ORGANISATIONAL failure: four seats, each locally rational, producing a
     collectively bad result. The clearest expression of that is the promise
     mechanic — Sales sets a service promise, Supply Chain sets the stock
     that would deliver it, and neither can succeed alone.

   THE SCORING ASYMMETRY THAT DRIVES EVERYTHING
     The contract index is settled on ATTAINED service, and a penalty is
     charged on the SHORTFALL against the promise. So promising 99% and
     attaining 88% is strictly worse than promising 88% and attaining 88%:
     you are paid on the lower number either way, and fined on the gap.
     But promising low is not free either, because the price premium is set
     by the promise. The optimum is promising exactly what you can hold.
   ========================================================== */

var GAME_ROUNDS=6;      /* six half-year rounds = three years */

var GCO={
  name:"HARBOUR & VINE",
  sub:"Chilled soups and smoothies · Wexford · one plant, one national DC",
  brief:"You have inherited a business that is losing money. Last year it returned 4.1% on the capital invested in it, "+
        "against a sector benchmark of about 12%. Service to the two big grocery accounts is poor, the plant is running "+
        "hot, and there is far too much stock of the wrong things. You have six half-year rounds to fix it."
};

/* ---- what we sell ----
   Three products chosen to pull in opposite directions: soup is
   winter-weighted with the shortest life, smoothies are summer-weighted with
   the best margin, broth is small, long-life and easy to forget.
   `litres` is the capacity unit: the plant is measured in litres, not units,
   so a 750ml smoothie consumes more line time than a 500ml broth. */
var GPROD=[
  {id:"SOUP", n:"Chilled soup, 600ml", price:2.05, shelf:28, litres:0.6,
   note:"Winter-weighted, thin margin, and the shortest shelf life in the range."},
  {id:"SMOO", n:"Smoothie, 750ml",     price:3.40, shelf:21, litres:0.75,
   note:"Summer-weighted and the highest margin. Also the most fragile: 21 days from the filler."},
  {id:"BROTH",n:"Bone broth, 500ml",   price:4.10, shelf:45, litres:0.5,
   note:"Small volume, long shelf life, premium price. Easy to forget and easy to run out of."}
];

/* ---- what we buy ----
   `per` is the bill of materials: how much of this component goes into one
   unit of each product. Bottle and label are 1 per unit of everything, which
   is what makes them the systemic risk — they gate all three products.
   `pal` is units per pallet, used to convert stock into warehouse space. */
var GCOMP=[
  {id:"VEG",  n:"Vegetable purée",     unit:"kg",  base:1.32, pal:720,   per:{SOUP:0.62,SMOO:0,   BROTH:0.10}},
  {id:"FRUIT",n:"Fruit pulp",          unit:"kg",  base:2.15, pal:800,   per:{SOUP:0,   SMOO:0.85,BROTH:0}},
  {id:"STOCK",n:"Bone stock concentrate",unit:"kg",base:3.80, pal:900,   per:{SOUP:0.06,SMOO:0,   BROTH:0.45}},
  {id:"BOTL", n:"PET bottle and cap",  unit:"ea",  base:0.145,pal:4800,  per:{SOUP:1,   SMOO:1,   BROTH:1}},
  {id:"LABEL",n:"Printed sleeve",      unit:"ea",  base:0.041,pal:96000, per:{SOUP:1,   SMOO:1,   BROTH:1}}
];

/* ---- who we buy from: the purchasing decision ----
   Every component offers a price/reliability/lead-time frontier. `price` is
   an INDEX against the component's base price, so 0.84 means 16% cheaper.
   The consistent pattern: cheaper means further away and less dependable,
   and the lead time penalty is the one that does not appear on a purchasing
   scorecard. */
var GSUP={
  VEG:[  {id:"v1",n:"Slaney Growers",    price:1.00,rel:0.97,lt:7, quality:0.995,note:"Local, dependable, dearest. 7 day lead time."},
         {id:"v2",n:"Iberia Vegetal",    price:0.84,rel:0.90,lt:21,quality:0.985,note:"Cheaper, three week lead time, occasional short shipments."},
         {id:"v3",n:"Global Produce Co", price:0.71,rel:0.79,lt:42,quality:0.965,note:"Cheapest by far. Six weeks out, and one delivery in five disappoints."}],
  FRUIT:[{id:"f1",n:"Andes Pulp Direct", price:1.00,rel:0.95,lt:35,quality:0.99, note:"Contracted grower, reliable, priced accordingly."},
         {id:"f2",n:"Tropicanor Trading",price:0.88,rel:0.88,lt:49,quality:0.98, note:"A trader rather than a grower. Good price, variable arrival."},
         {id:"f3",n:"Spot market",       price:0.76,rel:0.74,lt:56,quality:0.955,note:"Whatever is available. Cheap, slow, and you take what comes."}],
  STOCK:[{id:"s1",n:"Ballina Fine Foods",price:1.00,rel:0.98,lt:10,quality:0.995,note:"Small, excellent, limited capacity."},
         {id:"s2",n:"Continental Stocks",price:0.90,rel:0.92,lt:24,quality:0.985,note:"Larger, steadier, three and a half weeks."}],
  BOTL:[ {id:"b1",n:"Wexford Plastics",  price:1.00,rel:0.99,lt:5, quality:0.998,note:"Next county. Effectively never fails."},
         {id:"b2",n:"Baltic Preform",    price:0.86,rel:0.93,lt:28,quality:0.99, note:"Cheaper per bottle, four weeks of pipeline stock."},
         {id:"b3",n:"Asia Pacific PET",  price:0.72,rel:0.85,lt:63,quality:0.975,note:"Lowest unit price in the file, nine weeks at sea."}],
  LABEL:[{id:"l1",n:"Kilkenny Print",    price:1.00,rel:0.98,lt:9, quality:0.997,note:"Short runs, fast artwork changes."},
         {id:"l2",n:"Euroflex Labels",   price:0.87,rel:0.91,lt:26,quality:0.99, note:"Cheaper, but artwork changes take a month to land."}]
};

/* ---- who we sell to: the sales decision ----
   `tough` scales both the price premium AND the penalty for that customer,
   so a demanding account pays more for service and fines harder for failure.
   Convenience is toughest at 1.22; the discounter is softest at 0.78 and
   will not pay much for a better service level either. */
var GCUST=[
  {id:"NAT", n:"National Grocer",   share:0.52, demandBase:{SOUP:44000,SMOO:38000,BROTH:5200},
   tough:1.0, note:"Half your volume. Fines you against a delivery scorecard and audits it monthly."},
  {id:"DISC",n:"Discount Chain",    share:0.31, demandBase:{SOUP:31000,SMOO:22000,BROTH:1800},
   tough:0.78,note:"Price-led. Tolerates a lower service level but will not pay much for a better one."},
  {id:"CONV",n:"Convenience Group", share:0.17, demandBase:{SOUP:12000,SMOO:16000,BROTH:4100},
   tough:1.22,note:"Small drops, frequent deliveries, and the strictest freshness requirement of the three."}
];

/* seasonality by half-year round: H1 is winter-weighted, H2 summer-weighted.
   Soup and smoothie are deliberately ANTI-correlated, so total volume is
   roughly level while the mix swings — which is what makes capacity planning
   look easy and freshness planning hard. */
var GSEASON={SOUP:[1.28,0.74,1.24,0.78,1.22,0.80], SMOO:[0.72,1.30,0.76,1.28,0.80,1.26], BROTH:[1.06,0.94,1.08,0.96,1.10,0.98]};

/* ---- the events that land between rounds ----
   Each `eff` key targets a different part of the engine:
     demand      multiplies a product's demand
     supRel      multiplies a component's supplier reliability
     toughness   multiplies a customer's penalty rate
     compPrice   multiplies a component's price
     decay       multiplies the freshness loss rate
   None of them can be "mitigated" by a flag, unlike the simulator's events.
   Here the only defence is having already made the right structural choice,
   which is why round 3 hits whoever bought the most distant bottle supplier. */
var GEVENTS=[
 {r:2,t:"Cold snap",             b:"A long freeze pushes soup demand 18% above plan for six weeks. Smoothies fall away.",
  eff:{demand:{SOUP:1.18,SMOO:0.90}}},
 {r:3,t:"Bottle supplier fire",  b:"A fire at a preform plant removes capacity from the market. Long-haul bottle supply is disrupted.",
  eff:{supRel:{BOTL:0.72}}, hint:"Whoever is furthest away is worst hit."},
 {r:4,t:"Grocer raises the bar", b:"National Grocer moves its supplier scorecard threshold from 96% to 98% and doubles the penalty rate.",
  eff:{toughness:{NAT:1.25}}},
 {r:5,t:"Fruit price spike",     b:"A poor South American harvest lifts fruit pulp prices across the market.",
  eff:{compPrice:{FRUIT:1.32}}},
 {r:6,t:"Summer heatwave",       b:"Sustained heat lifts smoothie demand sharply, and chilled distribution comes under strain.",
  eff:{demand:{SMOO:1.26,SOUP:0.88}, decay:1.35}}
];

/* ---- decisions, with sane starting values ----
   The opening position is deliberately mediocre in a specific way: mid-price
   suppliers on every component, promises slightly above what the stock policy
   can support, and a plant running hot. That gives the player something to
   diagnose rather than a blank slate. */
function gameInit(){
  return {
    round:1, history:[], log:[], role:"brief", showResult:false, lastResult:null,
    d:{
      /* SALES: what we promise each customer */
      promise:{NAT:{svc:95,fresh:70,window:2}, DISC:{svc:92,fresh:60,window:3}, CONV:{svc:95,fresh:75,window:1}},
      /* PURCHASING: who supplies each component */
      supplier:{VEG:"v2",FRUIT:"f2",STOCK:"s2",BOTL:"b2",LABEL:"l2"},
      /* OPERATIONS: capacity */
      shifts:2, lines:2, inbound:1150, outbound:900, staff:15,
      /* SUPPLY CHAIN: inventory policy */
      ssComp:{VEG:2,FRUIT:2,STOCK:2,BOTL:2,LABEL:2},
      lot:{VEG:3,FRUIT:4,STOCK:3,BOTL:4,LABEL:4},
      ssFg:{SOUP:1.5,SMOO:1.5,BROTH:1.5},
      interval:{SOUP:5,SMOO:5,BROTH:10},
      frozen:3
    }
  };
}

/* ============================ THE ENGINE ============================
   gameRun(G): five passes, mirroring the four seats plus the money.
     1  demand      seasonality and event shocks
     2  purchasing  price, reliability, availability, pipeline
     3  operations  capacity, utilisation, warehouse space, staffing
     4  supply chain service attained, freshness, obsolescence, revenue
     5  money       the P&L and return on investment
   Like computeAll(), this is pure: it reads G and returns a result object.
   ==================================================================== */
function gameRun(G){
  var d=G.d, r=G.round;
  var ev=GEVENTS.filter(function(e){return e.r===r;})[0]||null;
  var eff=ev?ev.eff:{};

  /* ---------- 1. demand ----------
     26 weeks per round, so the weekly base figures are multiplied by 26. */
  var demand={}, totalUnits=0, totalLitres=0;
  GPROD.forEach(function(p){
    demand[p.id]={};
    GCUST.forEach(function(c){
      var q=c.demandBase[p.id]*26*GSEASON[p.id][r-1]*((eff.demand&&eff.demand[p.id])||1);
      demand[p.id][c.id]=q; totalUnits+=q; totalLitres+=q*p.litres;
    });
  });

  /* ---------- 2. purchasing: price, reliability, lead time ----------
     The availability model is the interesting part. `exposure` combines
     unreliability with distance: (1−rel) × sqrt(leadTimeWeeks). Cover from
     safety stock, half the lot size and a fraction of the frozen period
     offsets it, but only at 0.08 per week against 1.15 per exposure unit —
     so buffer HELPS but cannot fully rescue a distant, unreliable supplier.
     That asymmetry is deliberate: it is the lesson of the round 3 event. */
  var comp={}, compSpendPlan=0;
  GCOMP.forEach(function(cm){
    var s=GSUP[cm.id].filter(function(x){return x.id===d.supplier[cm.id];})[0]||GSUP[cm.id][0];
    var rel=s.rel*((eff.supRel&&eff.supRel[cm.id])||1);
    var price=cm.base*s.price*((eff.compPrice&&eff.compPrice[cm.id])||1);
    var need=0;
    GPROD.forEach(function(p){
      var tot=GCUST.reduce(function(a,c){return a+demand[p.id][c.id];},0);
      need+=tot*cm.per[p.id];
    });
    /* safety stock in weeks of cover protects against unreliability and lead time */
    var ss=d.ssComp[cm.id], lot=d.lot[cm.id];
    var exposure=(1-rel)*Math.sqrt(Math.max(s.lt,1)/7);
    var cover=ss+lot/2+ (d.frozen*0.35);
    /* buffer helps, but it cannot fully cover an unreliable, distant supplier */
    var availability=clamp(1-Math.max(0,exposure*1.15-cover*0.08), 0.55, 0.999);
    var wksStock=ss+lot/2;
    var avgStock=need/26*wksStock;
    comp[cm.id]={sup:s,rel:rel,price:price,need:need,avail:availability,
      avgStock:avgStock, value:avgStock*price, pipeline:need/26*(s.lt/7)*price,
      quality:s.quality, lt:s.lt, ss:ss, lot:lot};
    compSpendPlan+=need*price;
  });
  /* production can only run when EVERY component is there, so the five
     availabilities MULTIPLY. Five components at 97% each give 86% overall,
     which is the point most people miss when they optimise one at a time. */
  var availAll=1;
  GCOMP.forEach(function(cm){ availAll*=comp[cm.id].avail; });
  var rejects=1-GCOMP.reduce(function(a,cm){return a*comp[cm.id].quality;},1);

  /* ---------- 3. operations: capacity ----------
     Setup loss rises with the number of runs: 26 weeks divided by the
     production interval, times 0.9% per changeover, summed across products.
     Halving an interval therefore doubles that product's contribution. */
  var lineLitresPerShift=900000;   /* litres per line, per shift, per 26-week round */
  var setupLoss=GPROD.reduce(function(a,p){ return a + (26/Math.max(d.interval[p.id],1))*0.9; },0)/100;
  var capacity=d.lines*d.shifts*lineLitresPerShift*(1-clamp(setupLoss,0.02,0.35));
  var util=totalLitres/Math.max(capacity,1);
  var overtime=Math.max(0,util-1);
  /* plan adherence starts falling at 88% utilisation, not at 100% */
  var prodAdherence=clamp(1-Math.max(0,util-0.88)*1.35,0.6,0.99);

  /* warehouse space: stock converted to pallets via each item's pal figure,
     then compared with the space Operations bought. Overflow is charged. */
  var compPallets=sum(GCOMP.map(function(cm){return comp[cm.id].avgStock/cm.pal;}));
  var fgWeeks=sum(GPROD.map(function(p){
    var tot=GCUST.reduce(function(a,c){return a+demand[p.id][c.id];},0);
    return tot/26*(d.ssFg[p.id]+d.interval[p.id]/10);}));
  var fgPallets=fgWeeks/1100;   /* finished units per pallet */
  var inOver=Math.max(0,compPallets-d.inbound), outOver=Math.max(0,fgPallets-d.outbound);
  var staffNeed=(compPallets+fgPallets)/118;
  var flexStaff=Math.max(0,staffNeed-d.staff);

  /* ---------- 4. supply chain: service and freshness ----------
     Service attained is the product of four factors:
       base           an exponential in weeks of finished-goods cover, so the
                      first week of stock buys far more service than the fifth
       availAll       components present at the line
       prodAdherence  the plant kept to plan
       (1−rejects)    quality losses
     Then freshness gates it: if attained freshness falls below the PROMISED
     freshness, orders get refused, and service is scaled down further.     */
  var perCust={}, revenue=0, penalty=0, bonus=0, servedUnits=0, lostUnits=0;
  var obsoleteValue=0, cogs=0;
  GCUST.forEach(function(c){
    var pr=d.promise[c.id];
    var svcSum=0, wSum=0, freshSum=0, rev=0, cg=0;
    GPROD.forEach(function(p){
      var q=demand[p.id][c.id];
      if(q<=0) return;
      /* attained service: stock cover, component availability, plant adherence */
      var ssw=d.ssFg[p.id];
      var base=1-Math.exp(-(ssw+0.55)*1.28);
      var attained=clamp(base*availAll*prodAdherence*(1-rejects),0.4,0.995)*100;
      /* freshness: average age at despatch is half the safety stock plus half
         the production interval, expressed as a share of shelf life */
      var ageWeeks=ssw*0.5+d.interval[p.id]/10*0.5;
      var freshPct=clamp(100-(ageWeeks*7/p.shelf)*100*((eff.decay)||1),5,99);
      /* the customer refuses anything under the promised freshness */
      if(freshPct<pr.fresh) attained*=clamp(1-(pr.fresh-freshPct)/85,0.55,1);
      /* obsolescence: stock that ages past the acceptance window before it
         ships. The window is what is LEFT after the freshness promise. */
      var over=Math.max(0,ageWeeks*2*7-p.shelf*(1-pr.fresh/100));
      var win=Math.max(p.shelf*(1-pr.fresh/100),1);
      var obs=clamp(over/win,0,2)*0.062*((eff.decay)||1);
      var served=q*attained/100;
      servedUnits+=served; lostUnits+=q-served;
      /* CONTRACT INDEX — the heart of the game.
         Four terms, all scaled by the customer's toughness:
           + a premium for promising above 93%
           + an adjustment for the gap, capped at −12 and +6
           + a premium for promised freshness above 65%
           − a penalty for a delivery window looser than 2 days
         The result is clamped to ±22%, and it multiplies list price. */
      var gap=(attained-pr.svc);
      var idx=1+(pr.svc-93)*0.012*c.tough + clamp(gap,-12,6)*0.011*c.tough
              +(pr.fresh-65)*0.0035*c.tough - (pr.window-2)*0.012;
      idx=clamp(idx,0.82,1.22);
      var unitRev=p.price*idx;
      rev+=served*unitRev;
      var unitCost=GCOMP.reduce(function(a,cm){return a+cm.per[p.id]*comp[cm.id].price;},0);
      cg+=served*unitCost*(1+rejects);
      obsoleteValue+=q*obs*unitCost;
      /* penalties on the downside are charged at roughly twice the rate that
         bonuses are paid on the upside, which is how real scorecards work */
      if(gap<0) penalty+=served*p.price*Math.min(-gap,15)*0.006*c.tough*((eff.toughness&&eff.toughness[c.id])||1);
      else bonus+=served*p.price*Math.min(gap,6)*0.003*c.tough;
      svcSum+=attained*q; wSum+=q; freshSum+=freshPct*q;
    });
    perCust[c.id]={svc:wSum?svcSum/wSum:0, fresh:wSum?freshSum/wSum:0,
      promised:d.promise[c.id].svc, rev:rev, vol:wSum};
    revenue+=rev; cogs+=cg;
  });

  /* ---------- 5. money ----------
     ROI is profit over capital employed, where capital includes fixed assets
     (lines and racking) as well as stock. That is what makes buying a third
     line a genuinely double-edged decision: it raises capacity AND the
     denominator you are scored against. */
  var prodCost=totalLitres*0.142 + d.shifts*d.lines*192000 + overtime*totalLitres*0.46;
  var whCost=(d.inbound+d.outbound)*132 + d.staff*44000 + flexStaff*74000 + (inOver+outOver)*640;
  var opex=prodCost+whCost+obsoleteValue+penalty-bonus+ 880000;   /* sales, admin, marketing */
  var profit=revenue-cogs-opex;

  var compInv=sum(GCOMP.map(function(cm){return comp[cm.id].value+comp[cm.id].pipeline;}));
  var fgInv=sum(GPROD.map(function(p){
    var tot=GCUST.reduce(function(a,c){return a+demand[p.id][c.id];},0);
    var unitCost=GCOMP.reduce(function(a,cm){return a+cm.per[p.id]*comp[cm.id].price;},0);
    return tot/26*(d.ssFg[p.id]+d.interval[p.id]/10)*unitCost;}));
  var fixedAssets=d.lines*1250000 + (d.inbound+d.outbound)*380;
  var investment=compInv+fgInv+fixedAssets+ revenue*0.14;   /* + working capital */
  var roi=investment>0? profit/investment*100 : 0;

  var otif=servedUnits+lostUnits>0? servedUnits/(servedUnits+lostUnits)*100 : 0;

  return {round:r, ev:ev, demand:demand, comp:comp, perCust:perCust,
    totalUnits:totalUnits, totalLitres:totalLitres, capacity:capacity, util:util*100,
    overtime:overtime*100, prodAdherence:prodAdherence*100, availAll:availAll*100, rejects:rejects*100,
    compPallets:compPallets, fgPallets:fgPallets, inOver:inOver, outOver:outOver, flexStaff:flexStaff,
    revenue:revenue, cogs:cogs, prodCost:prodCost, whCost:whCost, obsolete:obsoleteValue,
    penalty:penalty, bonus:bonus, opex:opex, profit:profit,
    compInv:compInv, fgInv:fgInv, fixedAssets:fixedAssets, investment:investment,
    roi:roi, otif:otif, servedUnits:servedUnits, lostUnits:lostUnits};
}

/* gameRoleScores(R,G): the four individual scores.
   Each seat is scored ONLY on what that seat controls:
     purchasing   the average price index it negotiated
     operations   how close utilisation is to 84%, less overflow and agency
     sales        revenue earned
     supplyChain  inventory held, inverted
   The whole point is that these can all be high while ROI is poor, which is
   exactly the pathology the exercise teaches. */
function gameRoleScores(R,G){
  var idxSum=0,n=0;
  GCOMP.forEach(function(cm){ idxSum+=GSUP[cm.id].filter(function(x){return x.id===G.d.supplier[cm.id];})[0].price; n++; });
  var purch=clamp((1.06-idxSum/n)*900,0,100);
  var ops=clamp(100-Math.abs(R.util-84)*1.7-(R.inOver+R.outOver)*0.04-R.flexStaff*4,0,100);
  var sales=clamp((sum(GCUST.map(function(c){return R.perCust[c.id].rev;}))/1000000-7)*13,0,100);
  var scm=clamp(100-(R.compInv+R.fgInv)/42000,0,100);
  return {purchasing:purch, operations:ops, sales:sales, supplyChain:scm};
}

/* ==========================================================
   15 · THE GAME SCREEN
   Four role tabs plus a briefing and a results screen, one round button,
   one score. renderGame() owns its own render path, parallel to render().
   ========================================================== */

var GROLES=[
  {k:"brief",  n:"Briefing",       s:"where the company stands"},
  {k:"sales",  n:"VP Sales",       s:"what you promise customers"},
  {k:"purch",  n:"VP Purchasing",  s:"who supplies you"},
  {k:"ops",    n:"VP Operations",  s:"capacity to make and store"},
  {k:"scm",    n:"VP Supply Chain",s:"how much stock, in what size batches"},
  {k:"result", n:"Results",        s:"what the round returned"}
];

/* gget/gset: read and write a dotted path into ST.game.d, e.g.
   "promise.NAT.svc" or "ssComp.BOTL". This lets every control identify its
   target with a single string attribute, exactly as the simulator's controls
   name a flat ST.g key. */
function gget(p){ var o=ST.game.d, a=p.split("."); for(var i=0;i<a.length;i++) o=o[a[i]]; return o; }
function gset(p,v){ var o=ST.game.d, a=p.split("."); for(var i=0;i<a.length-1;i++) o=o[a[i]]; o[a[a.length-1]]=v; }

/* gSlider / gSeg: the game's own control builders. Structurally identical to
   slider() and seg() but writing data-gp/data-gpn/data-gseg, which route to
   the game's handlers rather than the simulator's ledger. Game changes are
   NOT logged, because the round result is the feedback mechanism here. */
function gSlider(o){
  var v=gget(o.p);
  return '<div class="ctl"><div class="lab"><b>'+esc(o.label)+'</b>'+
    '<span class="val"><input class="valin" type="number" min="'+o.min+'" max="'+o.max+'" step="'+(o.step||1)+
    '" value="'+v+'" data-gpn="'+o.p+'"><span class="vsuf">'+(o.suf||"")+'</span></span></div>'+
    '<input type="range" min="'+o.min+'" max="'+o.max+'" step="'+(o.step||1)+'" value="'+v+'" data-gp="'+o.p+'" '+
    'data-suf="'+(o.suf||"")+'" aria-label="'+esc(o.label)+'">'+
    (o.hint?'<div class="hint">'+o.hint+'</div>':'')+'</div>';
}
function gSeg(o){
  var v=String(gget(o.p));
  return '<div class="ctl"><div class="lab"><b>'+esc(o.label)+'</b></div><div class="seg">'+
    o.opts.map(function(op){
      return '<button data-gseg="'+o.p+'" data-v="'+op.v+'"'+(o.num?' data-num':'')+
        ' class="'+(v===String(op.v)?"on":"")+'">'+esc(op.l)+'</button>';}).join("")+
    '</div>'+(o.hint?'<div class="hint">'+o.hint+'</div>':'')+'</div>';
}

/* ---------------- the screens ---------------- */

/* gameBrief(R): the situation, the rules, and the track record. */
function gameBrief(R){
  var G=ST.game;
  var h=card("The situation","round "+G.round+" of "+GAME_ROUNDS,
    '<p class="lede" style="margin-top:-2px">'+esc(GCO.brief)+'</p>'+
    '<div class="grid3" style="margin-top:14px">'+
    [["Return on investment",pct(R.roi,1),R.roi>=10?"g":R.roi>=0?"w":"b","operating profit as a share of capital employed"],
     ["Service attained",pct(R.otif,1),R.otif>=95?"g":R.otif>=88?"w":"b","of everything customers ordered"],
     ["Plant utilisation",pct(R.util,0),(R.util>70&&R.util<92)?"g":"b","of effective capacity"],
     ["Inventory",money(R.compInv+R.fgInv),(R.compInv+R.fgInv)<1600000?"g":"w","components plus finished goods"]
    ].map(function(x){
      return '<div class="mx"><div class="t"><span>'+x[0]+'</span></div><div class="v '+x[2]+'">'+x[1]+'</div>'+
        '<div class="d">'+x[3]+'</div></div>';}).join("")+'</div>');

  h+=card("How this works","four roles, one score",
    '<div class="grid2">'+
    '<div><p>You hold all four jobs at once. In the real version of this exercise each is a different person, '+
    'which is the entire point: the levers only work together.</p>'+
    '<ul style="font-size:.88rem;line-height:1.7;padding-left:1.2rem">'+
    '<li><b>Sales</b> promises a service level and a freshness level to each customer. Promise more and the price goes up. '+
    'Fail to deliver what you promised and you are fined on the shortfall.</li>'+
    '<li><b>Purchasing</b> chooses a supplier for each component. Cheaper suppliers are slower and less reliable.</li>'+
    '<li><b>Operations</b> sets shifts, lines, warehouse space and staff.</li>'+
    '<li><b>Supply Chain</b> sets safety stock and batch sizes for both components and finished goods.</li></ul></div>'+
    '<div>'+nt("bad","The trap this game exists to teach",
      "If Sales promises 99% and Supply Chain holds three days of stock, you get neither the service nor the saving. "+
      "You get the penalty for missing the promise <i>and</i> the cost of the stock. Every role can be locally right and collectively wrong, "+
      "and that is what happens in real companies every quarter.")+
    nt("good","The scoring",
      "One team number: <b>return on investment</b>, operating profit as a percentage of the capital tied up in the business. "+
      "Each role also gets its own score, so you can see whether one seat is carrying the others. "+
      "Both are shown on the results screen after you close a round.")+'</div></div>'+
    '<div class="hint" style="margin-top:10px">Products: '+GPROD.map(function(p){
      return esc(p.n)+" at "+money(p.price)+", "+p.shelf+" day shelf life";}).join(" &middot; ")+'</div>');

  if(G.history.length){
    h+=card("Track record","closed rounds",'<div data-gchart="hist"></div>'+
      legend([["ROI %","#00A67D"],["Service %","#4B63E8"],["Inventory €m","#C99A06"]]));
  }
  return h;
}

/* gameSales(R): three customer cards, each with the three promise controls
   and the attained figures beneath, so the gap is visible at the point of
   decision rather than only on the results screen. */
function gameSales(R){
  var h=card("What you promise each customer","the price follows the promise",
    '<p class="lede" style="margin-top:-2px">You cannot set prices directly. You set a promised service level and a promised freshness, '+
    'and the customer pays a premium or demands a discount accordingly. The premium is settled on what you <b>attain</b>, not what you promised, '+
    'so an ambitious promise you miss is worse than a modest promise you keep.</p>'+
    '<div class="grid3">'+GCUST.map(function(c){
      var p=R.perCust[c.id];
      return '<div style="border:1px solid var(--rule);border-radius:12px;padding:14px;background:var(--panel)">'+
        '<h4 style="font-size:.95rem">'+esc(c.n)+'</h4>'+
        '<div class="hint" style="text-align:center;margin-bottom:10px">'+esc(c.note)+'</div>'+
        gSlider({p:"promise."+c.id+".svc",label:"Service promised",min:80,max:99.5,step:0.5,suf:"%",
          hint:"Attained last round: "+pct(p.svc,1)})+
        gSlider({p:"promise."+c.id+".fresh",label:"Freshness on delivery",min:40,max:90,suf:"%",
          hint:"Attained: "+pct(p.fresh,0)+" of shelf life remaining. Promise more than you attain and orders get refused."})+
        gSeg({p:"promise."+c.id+".window",label:"Delivery window",num:true,
          opts:[{v:1,l:"1 day"},{v:2,l:"2 days"},{v:3,l:"3 days"}],
          hint:"A tighter window earns a better price and is harder to hit."})+
        '<div class="hr" style="height:1px;background:var(--rule2);margin:10px 0"></div>'+
        statline("Attained service",pct(p.svc,1),p.svc>=gget("promise."+c.id+".svc")?"g":"b")+
        statline("Promised",pct(gget("promise."+c.id+".svc"),1))+
        statline("Revenue this round",money(p.rev))+
        '</div>';}).join("")+'</div>'+
    learn("Why over-promising costs more than under-delivering saves",
      "<p>The contract index is settled on attained performance. Promise 99% and attain 88% and you are paid as if you attained 88%, "+
      "<i>and</i> charged a penalty on the eleven-point shortfall. Promise 88% and attain 88% and you are paid cleanly with no penalty.</p>"+
      "<p>But do not be falsely modest either. Promising and attaining a high level pays better than promising low and over-delivering, "+
      "because the price premium is set by the promise and only adjusted by the gap. The skill is promising exactly what your supply chain can hold.</p>"+
      minor("This is why the sales seat cannot be played alone. Before you raise a promise, go to Supply Chain and check whether the safety stock supports it, "+
        "and to Operations to check the plant can make it.")+refBlock("service")));
  return h;
}

/* gamePurch(R): one block per component, each showing the three (or two)
   supplier options side by side with the selected one highlighted, then the
   three consequences that a price-only scorecard would miss. */
function gamePurch(R){
  var h=card("Who supplies each component","price against reliability and lead time",
    '<p class="lede" style="margin-top:-2px">Every component has a choice of supplier. The cheap ones are further away and less dependable. '+
    'A missing component stops the whole product, not just its own line, because you cannot bottle a soup without a bottle.</p>'+
    GCOMP.map(function(cm){
      var cur=R.comp[cm.id];
      return '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--rule2)">'+
        '<h4 style="font-size:.95rem">'+esc(cm.n)+'</h4>'+
        '<div class="hint" style="text-align:center">Base price '+money(cm.base)+' per '+cm.unit+
        ' &middot; you need about '+qty(cur.need)+' '+cm.unit+' this round</div>'+
        '<div class="seg" style="justify-content:center;margin-top:10px">'+
        GSUP[cm.id].map(function(s){
          return '<button data-gseg="supplier.'+cm.id+'" data-v="'+s.id+'" class="'+(gget("supplier."+cm.id)===s.id?"on":"")+'">'+
            esc(s.n)+'</button>';}).join("")+'</div>'+
        '<div class="grid3" style="margin-top:10px">'+GSUP[cm.id].map(function(s){
          var on=gget("supplier."+cm.id)===s.id;
          return '<div style="border:1px solid '+(on?"var(--acc)":"var(--rule2)")+';border-radius:10px;padding:10px;'+
            'background:'+(on?"var(--accSoft)":"var(--panel2)")+'">'+
            '<div style="font-weight:700;font-size:.8rem;text-align:center">'+esc(s.n)+'</div>'+
            statline("Unit price",money(cm.base*s.price))+
            statline("Reliability",pct(s.rel*100,0),s.rel>=0.95?"g":s.rel>=0.88?"w":"b")+
            statline("Lead time",s.lt+" days",s.lt<=14?"g":s.lt<=35?"w":"b")+
            '<div class="hint" style="text-align:left">'+esc(s.note)+'</div></div>';}).join("")+'</div></div>';
    }).join("")+
    '<div class="hr" style="height:1px;background:var(--rule2);margin:16px 0"></div>'+
    '<div class="grid3">'+
    '<div class="mx"><div class="t"><span>Component availability</span></div><div class="v '+
      (R.availAll>=97?"g":R.availAll>=90?"w":"b")+'">'+pct(R.availAll,1)+'</div>'+
      '<div class="d">The chance that every component of a product is there when the line wants it. Multiply the five together and it falls fast.</div></div>'+
    '<div class="mx"><div class="t"><span>Rejected on quality</span></div><div class="v '+(R.rejects<2?"g":"b")+'">'+
      pct(R.rejects,1)+'</div><div class="d">Cheaper suppliers ship more out-of-specification material. You pay for it and then scrap it.</div></div>'+
    '<div class="mx"><div class="t"><span>Pipeline stock</span></div><div class="v w">'+
      money(sum(GCOMP.map(function(cm){return R.comp[cm.id].pipeline;})))+'</div>'+
      '<div class="d">Cash sitting on ships and lorries. A nine-week lane ties up nine weeks of it.</div></div></div>'+
    learn("The cheapest quote is rarely the cheapest supplier",
      "<p>Switch every component to the cheapest source and watch three things move at once: unit cost falls, component availability falls, "+
      "and pipeline stock rises because the goods are further away. The third one is invisible on a purchasing scorecard, which is precisely why it gets missed.</p>"+
      fx("Total cost = price + freight + pipeline carrying + quality failure + the cost of stopping the line",
        "The purchasing seat is scored on price alone in this game, exactly as it often is in real companies. The team is scored on ROI. Notice when those two disagree.")+
      refBlock("move")));
  return h;
}

/* gameOps(R): five capacity controls and six diagnostic cards. Note that

  var h=card("Capacity to make it and space to keep it","",

    'Too much and you are paying for capacity nobody is using.</p>'+
    '<div class="grid2">'+
    '<div>'+
    gSeg({p:"shifts",label:"Shifts per day",num:true,opts:[{v:1,l:"1"},{v:2,l:"2"},{v:3,l:"3"}],
      hint:"Each line-shift costs about "+money(192000)+" a round in labour and running cost."})+
    gSeg({p:"lines",label:"Bottling lines",num:true,opts:[{v:1,l:"1"},{v:2,l:"2"},{v:3,l:"3"}],
      hint:"A line is a capital item as well as a cost. It raises the investment the ROI is measured against."})+
    gSlider({p:"staff",label:"Warehouse staff",min:4,max:26,suf:"",
      hint:"Short of people and the work still gets done, by agency staff at a large premium."})+
    '</div><div>'+
    gSlider({p:"inbound",label:"Inbound pallet spaces",min:200,max:1800,step:50,
      hint:"Component storage. Anything over the limit goes to an overflow warehouse at "+money(640)+" a pallet."})+
    gSlider({p:"outbound",label:"Outbound pallet spaces",min:200,max:1800,step:50,
      hint:"Finished goods. Both numbers are set by Supply Chain's stock policy, not by you."})+
    '</div></div>'+
    '<div class="grid3" style="margin-top:14px">'+
    [["Utilisation",pct(R.util,0),(R.util>70&&R.util<92)?"g":R.util>=92?"b":"w",
      "Above about 90% the plant loses adherence to plan and starts missing orders. Below 65% you are paying for idle capacity."],
     ["Plan adherence",pct(R.prodAdherence,0),R.prodAdherence>95?"g":"w","How much of what you scheduled actually got made."],
     ["Overtime",pct(R.overtime,0),R.overtime<1?"g":"b","Demand above capacity, paid for at a premium."],
     ["Inbound space needed",fm(R.compPallets,0)+" pallets",R.inOver>0?"b":"g",
      R.inOver>0? fm(R.inOver,0)+" pallets in overflow, costing "+money(R.inOver*640):"Within your space."],
     ["Outbound space needed",fm(R.fgPallets,0)+" pallets",R.outOver>0?"b":"g",
      R.outOver>0? fm(R.outOver,0)+" pallets in overflow, costing "+money(R.outOver*640):"Within your space."],
     ["Agency staff",fm(R.flexStaff,1),R.flexStaff>0?"b":"g",
      R.flexStaff>0?"Hired to cover the gap, at "+money(74000)+" each":"Fully covered by your own people."]
    ].map(function(x){
      return '<div class="mx"><div class="t"><span>'+x[0]+'</span></div><div class="v '+x[2]+'">'+x[1]+'</div>'+
        '<div class="d">'+x[3]+'</div></div>';}).join("")+'</div>'+
    learn("Why running the plant flat out makes service worse",
      "<p>Short production runs mean more changeovers, and every changeover is capacity you do not get back. Set the production interval to two days "+
      "on the Supply Chain screen and watch utilisation here jump, because you have just asked for thirteen runs a quarter instead of five.</p>"+
      "<p>Past about 88% utilisation, plan adherence starts to fall. Queues form, the schedule slips, and orders miss. "+
      "This is the single most counter-intuitive result in operations and it is why a plant that looks efficient on a utilisation report "+
      "often has the worst delivery performance in the group.</p>"+refBlock("queue")));
