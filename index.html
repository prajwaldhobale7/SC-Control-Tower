/* ============================== 07 WAREHOUSE ============================== */
TABS.warehouse={n:"Warehouse",
  html:function(M){
    var h='';
    h+='<div class="grid2">';
    h+=card("Warehouse controls","the cheapest wins in the whole chain",
      seg({g:"slotting",label:"Slotting strategy",opts:[{v:"random",l:"Chaotic"},{v:"abc",l:"ABC velocity"},{v:"golden",l:"Golden zone + family"}],
        hint:"Where each SKU physically lives. Walking is 50-60% of a picker's time, so this is not a cosmetic decision.",
        why:"Slotting changes walking distance, which is over half of pick labour. A re-slot costs a weekend and beats most automation business cases."})+
      seg({g:"pickMethod",label:"Picking method",opts:[{v:"single",l:"Order by order"},{v:"batch",l:"Batch pick"},{v:"zone",l:"Zone + sort"}],
        hint:"Batch picking collects several orders in one trip and sorts afterwards. Zone picking gives each picker an area and passes orders between them.",
        why:"Picking method changes travel per order line, which changes labour cost and dock-to-despatch time."})+
      slider({g:"dockToStock",label:"Dock-to-stock time",min:0,max:9,suf:" days",
        hint:"Truck arrival to pickable stock. Anything sitting in goods-in unbooked is invisible to MRP, which will happily reorder it.",
        why:"Dock-to-stock adds directly to effective lead time and therefore to safety stock."})+
      sw({g:"cycleCount",label:"Cycle counting programme",sub:"A items monthly, C items annually",why:"Cycle counting finds root causes continuously instead of correcting numbers once a year."})+
      sw({g:"fefo",label:"FEFO enforced",sub:"First Expired First Out",why:"The oldest received is not always the soonest to expire, with mixed batch lead times, FIFO ships the wrong pallet."}));
    h+=card("Layout and pick path","one 8-line order",'<div data-chart="wh"></div>'+
      '<div data-live="whnote"></div>');
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Where warehouse time goes","typical manual pick operation",'<div data-chart="whtime"></div>'+
      '<p class="hint">Travel dominates. Everything else, the scanning, the picking motion, the paperwork, is a rounding error by comparison, '+
      'which is why almost every worthwhile warehouse project is really a project about walking less.</p>'+
      learn("Slotting properly, in four moves",
        viz(dgGolden(),"<b>A rack seen from the side.</b> The green band between waist and shoulder height is the fastest and safest place to pick from, and it is a small fraction of your total cube. Fill it with the items you pick most often, put slow-and-heavy on the floor and slow-and-light up top, and you have just cut your labour cost without buying anything.")+
        "<ul><li><b>Velocity first.</b> Rank by picks per period, not by units or value. A slow-moving expensive item does not belong in prime space; a fast-moving cheap one does.</li>"+
        "<li><b>Golden zone.</b> The band between knee and shoulder height is fastest to pick and safest for backs. Reserve it for your A-movers. Put slow and heavy items low, slow and light items high.</li>"+
        "<li><b>Family grouping.</b> Items ordered together should be stored together. Check the actual order lines, not the product hierarchy, the categories that marketing invented rarely match what customers buy in one basket.</li>"+
        "<li><b>Re-slot regularly.</b> Velocity changes with season and lifecycle. A slotting plan from eighteen months ago is now actively working against you.</li></ul>"+
        minor("Honeycombing is the space you lose when a pallet position is half-emptied and cannot be used for anything else. It is silent, universal, and typically worth 10-20% of your cube. Deep-lane storage makes it worse; narrower, shallower locations make it better at the cost of more aisles.")));
    h+=card("Inventory accuracy","and why it decides everything else",'<div data-chart="acc"></div>'+
      '<div data-live="accnote"></div>'+
      learn("The 97% threshold",
        "<p>Inventory record accuracy is the percentage of locations where system quantity matches physical quantity. It is the foundation the entire planning stack stands on, and it fails quietly.</p>"+
        "<p>Below roughly 97%, something predictable happens: planners stop trusting the system. They start keeping private spreadsheets, adding informal buffers, and phoning the warehouse to check before committing. Once that culture exists, <b>no software project will fix your planning</b>, because the software is no longer where the decisions are being made.</p>"+
        "<p>What actually restores it:</p>"+
        "<ul><li><b>Cycle counting</b> rather than annual stocktakes, count A items monthly, B quarterly, C annually. You find causes, not just discrepancies.</li>"+
        "<li><b>Root-cause every variance</b> above a threshold. Most accuracy loss traces to a handful of repeating process failures: unrecorded scrap, picks from the wrong location, receipts booked to the wrong unit of measure.</li>"+
        "<li><b>Scan discipline at every touch.</b> Chaotic storage is more space-efficient than fixed locations, but it is completely unusable without reliable scanning.</li></ul>"+
        minor("A stocktake that produces a big adjustment is not a success. It means you have been planning on fiction for a year and have now papered over it for another year. The number that matters is variance frequency, not variance value.")));
    h+='</div>';

    h+=card("Storage profile by line item","cube, velocity and zone",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Picks/qtr est.</th><th>Units held</th><th>m³ held</th>'+
      '<th>Pallets</th><th>Recommended zone</th><th>Shelf life</th><th>Rotation</th><th>Write-off risk</th>'+
      '</tr></thead><tbody data-live="wgrid"></tbody></table></div>'+
      '<p class="hint" style="margin-top:8px">Cube tells you what the warehouse costs; picks tell you what the labour costs. They are different rankings, '+
      'and slotting by the wrong one is the most common warehouse design error.</p>');
    return h;
  },
  live:function(M){
    var g=ST.g,o={};
    var walkIdx=g.slotting==="random"?100:g.slotting==="abc"?72:61;
    var methodIdx=g.pickMethod==="single"?100:g.pickMethod==="batch"?63:71;
    var eff=walkIdx*methodIdx/100;
    o.whnote=nt(eff<50?"good":eff<80?"warn":"bad",
      "Pick labour index "+fm(eff,0)+" (100 = worst case)",
      (g.slotting==="random"?"Chaotic storage maximises space utilisation and maximises walking. ":
       g.slotting==="abc"?"ABC velocity zones cut walking by about 28% against chaotic. ":
       "Golden-zone placement with family grouping cuts walking by about 39% and reduces picker injury risk. ")+
      (g.pickMethod==="single"?"Order-by-order picking means one full trip per order, the simplest method and the most expensive.":
       g.pickMethod==="batch"?"Batch picking amortises the trip across several orders, typically cutting travel per line by a third.":
       "Zone picking removes long trips entirely but adds a sortation and consolidation step downstream.")+
      " Combined, you are at roughly "+fm(eff,0)+"% of the worst-case labour cost.");
    var acc=clamp((g.cycleCount?98.6:94.2)-(g.slotting==="random"?1.1:0)-(g.dockToStock>4?1.4:0),85,99.6);
    o.accnote = acc>=97? nt("good","Records are trustworthy",
        fm(acc,1)+"% accuracy. Above the 97% line, planners believe the system, MRP output is actionable, and nobody keeps a private spreadsheet. This is the quiet precondition for every other improvement on this screen.")
      : nt("bad","Below the trust threshold",
        fm(acc,1)+"% accuracy. Below 97%, MRP is planning on fiction and planners start working around the system. "+
        (g.cycleCount?"Your cycle counting programme is helping: the remaining loss is coming from slotting churn or slow dock-to-stock.":"Start a cycle counting programme: A items monthly, C items annually. It finds causes rather than correcting numbers once a year."));
    o.wgrid=M.rows.map(function(r){

        '<td>'+qty(picks)+'</td><td>'+qty(r.avgInv)+'</td><td>'+fm(m3,1)+'</td><td>'+fm(pallets,0)+'</td>'+
        '<td style="text-align:left">'+zone+'</td>'+
        '<td>'+(r.sk.shelf>0?fm(r.sk.shelf,0)+"d":", ")+'</td>'+
        '<td>'+(g.fefo?'<span class="chip x">FEFO</span>':'<span class="chip y">FIFO</span>')+'</td>'+
        '<td class="'+(wr<0.6?"g":wr<1.2?"w":"b")+'">'+(wr<0.6?"LOW":wr<1.2?"MED":"HIGH")+'</td></tr>';
    }).join("");
    return o;
  },
  charts:function(M){

    o.wh=svgWarehouse(g,M.rows);
    var travel=g.slotting==="random"?55:g.slotting==="abc"?44:39;

      {label:"Picking motion",v:rest*0.42,txt:pct(rest*0.42,0),color:"var(--good)"},
      {label:"Paperwork / scan",v:rest*0.22,txt:pct(rest*0.22,0),color:"#7A8798"},
      {label:"Setup / other",v:rest*0.18,txt:pct(rest*0.18,0),color:"#7A8798"}]});
    var acc=clamp((g.cycleCount?98.6:94.2)-(g.slotting==="random"?1.1:0)-(g.dockToStock>4?1.4:0),85,99.6);
    o.acc=svgGauge({w:300,h:150,v:acc,min:85,max:100,txt:fm(acc,1)+"%",
      label:"inventory record accuracy · 97% is the trust line",
      color:acc>=97?"var(--good)":acc>=95?"var(--warn)":"var(--bad)"});
    return o;
  }
};

/* ============================== 08 FINANCE ============================== */
TABS.finance={n:"Finance",
  html:function(M){
    var h='';
    h+='<div class="grid2">';
    h+=card("Working capital controls","",
      slider({g:"holdRate",label:"Inventory carrying rate",min:0.08,max:0.45,step:0.01,suf:"",
        hint:"Annual cost of holding stock: capital, storage, insurance, shrinkage, obsolescence. Typically 18-35%. Yours is probably a number someone chose years ago.",
        why:"Carrying rate changes every EOQ, every service-level trade-off and every make-or-buy decision in the company."})+
      slider({g:"dso",label:"Customer payment terms (DSO)",min:15,max:120,suf:" days",
        hint:"Days sales outstanding. Longer terms may win the customer and cost you the cash.",
        why:"DSO adds directly to the cash-to-cash cycle."})+
      slider({g:"dpo",label:"Supplier payment terms (DPO)",min:20,max:120,suf:" days",
        hint:"Days payable outstanding. Subtracts from the cash cycle, and comes back in your next price negotiation.",
        why:"DPO subtracts from cash-to-cash. It is a loan from your supplier at their cost of capital, which is higher than yours."})+
      slider({g:"service",label:"Service level",min:80,max:99.9,step:0.1,suf:"%",
        hint:"Shown here too, because service is a working capital decision as much as a customer one.",
        why:"Service level is the single largest discretionary driver of inventory, and therefore of working capital."}));
    h+=card("Cash-to-cash cycle","days between paying and being paid",'<div data-chart="c2c"></div>'+
      '<div data-live="c2cnote"></div>'+
      learn("The number that gets you heard in the boardroom",
        viz(dgCash(),"<b>Follow the money along the timeline.</b> Goods arrive, and 35 days later you pay for them. They sell at day 60, and the customer pays at day 105. So from day 35 to day 105, seventy days, your cash is out of the building and has not come back. That gap is what the business has to fund, and it is the single number that turns supply chain work into something a CFO acts on.")+
        fx("C2C = DIO + DSO − DPO","Days inventory + days receivable − days payable.")+
        "<p>This is the translation layer between supply chain work and finance. It says: from the moment cash leaves the company to pay a supplier, how many days pass before cash comes back from a customer? Every one of those days has to be financed.</p>"+
        "<p>Three levers, and they are not equally available to you:</p>"+
        "<ul><li><b>DIO</b>: yours. Inventory policy, lead time, forecast accuracy, service level. This is where supply chain earns its seat.</li>"+
        "<li><b>DSO</b>: mostly sales and credit control's, though order accuracy and invoice quality sit with you more than people admit. A disputed invoice is a receivable that does not age, it just sits.</li>"+
        "<li><b>DPO</b>: procurement's. Real, but it is borrowing from suppliers who price it back in.</li></ul>"+
        minor("Learn to say your result in cash days. 'We cut six days of cash-to-cash' opens doors that 'we improved turns by 0.4' never will, same fact, completely different audience.")));
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Profit bridge","revenue to profit",'<div data-chart="pl"></div>'+
      '<div data-live="plnote"></div>');
    h+=card("Cost to serve by line item","who is actually profitable",'<div data-chart="cts"></div>'+
      '<p class="hint">Logistics, holding and decay cost as a share of each line\'s revenue. Almost every business that does this exercise honestly '+
      'discovers that some of its "profitable" products or customers are not.</p>'+
      learn("Cost to serve, and the uncomfortable conversation after it",
        "<p>Gross margin by product tells you almost nothing, because it charges every line the same average for the things that vary most: order frequency, drop size, packaging, returns, expediting, and the sheer amount of human attention a line consumes.</p>"+
        "<p>A proper cost-to-serve model allocates:</p>"+
        "<ul><li>Freight by actual weight, cube and lane, not as a percentage of revenue.</li>"+
        "<li>Warehouse cost by cube occupied and picks generated, separately, because they rank differently.</li>"+
        "<li>Inventory carrying by the stock that line actually causes, including its pipeline.</li>"+
        "<li>Obsolescence and write-off by where it genuinely lands.</li></ul>"+
        "<p>Then the awkward part: some lines and some customers turn out to be loss-making. The answer is rarely to fire them, it is usually to change the terms. Minimum order quantities, drop-size charges, different pack formats, longer lead times, or a different channel entirely.</p>"+
        fx("GMROI = Gross margin € ÷ Average inventory cost","Margin earned per euro of stock invested: a far better range-rationalisation metric than margin percentage alone.")));
    h+='</div>';

    h+=card("Reading the money, in plain English","no finance background needed",
      '<p class="lede" style="margin-top:-2px">Each card says what the number means, which direction you want it to move, and roughly where you sit on a sensible range. '+
      'If you only remember one thing: <b>profit and service you push up, cash days and cost you push down, and utilisation you keep in the middle.</b></p>'+
      '<div class="mexp" data-live="fexp"></div>'+
      nt("good","Why supply chain people learn to speak in cash days",
        "\"We improved inventory turns by 0.4\" means nothing outside the department. \"We took six days out of the cash cycle, which freed "+
        money(M.revenue/91*6)+" of working capital\" is the same fact, and it is the version that gets funded. Same work, different language, "+
        "completely different outcome for your budget and your career."));

    h+=card("P&L by line item","fully loaded",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Volume</th><th>Revenue</th><th>COGS</th><th>Gross %</th><th>Freight</th>'+
      '<th>Holding</th><th>Decay</th><th>Penalty</th><th>Profit</th><th>Net %'+dirMini('margin')+'</th><th>GMROI'+dirMini('gmroi')+'</th><th>Cost to serve'+dirMini('ctsPct')+'</th>'+
      '</tr></thead><tbody data-live="fgrid"></tbody><tfoot data-live="ffoot"></tfoot></table></div>'+
      minor("The gap between the gross margin column and the net margin column is the supply chain's P&L. It is usually the only place in the business where those costs are visible together, finance sees them as separate cost centres, and nobody else sees them at all."));
    return h;
  },
  live:function(M){

    o.c2cnote = M.c2c>90? nt("bad","Cash cycle is long",
        fm(M.c2c,0)+" days: "+fm(M.dio,0)+" inventory + "+g.dso+" receivable − "+g.dpo+" payable. You are financing roughly "+
        money(M.revenue/91*M.c2c)+" of working capital. The inventory portion is the part you control directly.")
      : M.c2c<25? nt("good","Cash cycle is strong",
        fm(M.c2c,0)+" days. At this level the business is being partly financed by its own suppliers. Worth checking that DPO is contractually agreed rather than simply taken, the second version costs you in the next negotiation.")
      : nt("good","Cash cycle is conventional",
        fm(M.c2c,0)+" days, of which "+fm(M.dio,0)+" is inventory. That inventory portion is the piece supply chain owns outright, and it is where the next improvement will come from.");
    var svc=M.revenue>0? M.penalty/M.revenue*100:0;
    o.plnote=nt(M.margin>14?"good":M.margin>6?"warn":"bad","Net margin "+pct(M.margin,1),
      "Gross margin is "+pct((M.revenue-M.cogs)/Math.max(M.revenue,1)*100,1)+", and supply chain costs take "+

      ". Service failure costs you "+pct(svc,1)+" of revenue in penalties and lost sales, which is usually more than the inventory that would have prevented it.");
    o.fexp=[

      mx("profit",0,money(M.profit),M.profit>0?"g":"b"),

      mx("c2c",M.c2c,fm(M.c2c,0)+" days",M.c2c<=45?"g":M.c2c<=80?"w":"b"),
      mx("turns",M.turns,fm(M.turns,1)+"×",M.turns>=6?"g":M.turns>=3?"w":"b"),
      mx("holding",0,money(M.holding),"w"),
      mx("freight",0,money(M.freight),"w"),
      mx("waste",0,money(M.waste+M.excursion),(M.waste+M.excursion)<M.revenue*0.01?"g":"b"),
      mx("penalty",0,money(M.penalty),M.penalty<M.revenue*0.01?"g":"b"),
      mx("overhead",0,money(M.overhead),"")
    ].join("");
    o.fgrid=M.rows.map(function(r){
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.name)+'</span></td>'+
        '<td>'+qty(r.served)+'</td><td>'+money(r.revenue)+'</td><td>'+money(r.cogs)+'</td>'+
        '<td class="'+(r.gm>35?"g":r.gm>20?"w":"b")+'">'+fm(r.gm,1)+'</td>'+
        '<td>'+money(r.freight)+'</td><td>'+money(r.holding)+'</td><td>'+money(r.waste+r.excursion)+'</td>'+
        '<td>'+money(r.penalty)+'</td><td>'+money(r.profit)+'</td>'+

      '<td>'+money(M.holding)+'</td><td>'+money(M.waste+M.excursion)+'</td><td>'+money(M.penalty)+'</td>'+
      '<td>'+money(M.profit)+'</td><td>'+fm(M.margin,1)+'</td><td></td><td></td></tr>';

/* ============================== 09 RISK ============================== */
TABS.risk={n:"Risk",
  html:function(M){
    var S=M.S,h='';
    h+='<div class="grid2">';
    h+=card("Resilience controls","",
      seg({g:"sourcing",label:"Sourcing posture",opts:[{v:"single",l:"Single source"},{v:"dual",l:"Dual source"}],
        hint:"The single biggest lever on time-to-recover.",
        why:"Dual sourcing cuts TTR from "+(S.key==="pharma"?"118":"68")+" days to 22."})+
      slider({g:"ssMult",label:"Safety stock multiplier",min:0.4,max:2.2,step:0.1,suf:"×",
        hint:"Raises time-to-survive across the portfolio, and raises working capital in exact proportion.",
        why:"More buffer means more days of survival without supply. That is what buffer is actually for."})+
      slider({g:"ltStress",label:"Lead time environment",min:0.7,max:1.8,step:0.05,suf:"×",
        hint:"Test what happens when the whole environment degrades: congestion, capacity shortage, a bad year.",
        why:"Stressing lead times simultaneously raises pipeline stock, safety stock requirement and exposure."})+
      (S.key==="packaging"? sw({g:"recycled",label:"Recycled content substrate",
        sub:"Costs ~4.5% more per tonne, cuts the virgin-plastic levy by three quarters",
        why:"Recycled substrate raises material cost and lowers regulatory levy. The crossover moves every time the levy is revised."}):"")+
      (S.key==="packaging"? slider({g:"substrate",label:"Substrate price index",min:0.75,max:1.6,step:0.05,suf:"×",
        hint:"Test what a commodity spike does to a business where material is 60-70% of cost.",
        why:"A converter's exposure to substrate is structural, not a planning choice, which is why forward buying is one of the few good reasons to hold extra stock."}):"")+
      (S.key==="pharma"? seg({g:"cold",label:"Cold chain solution",opts:[{v:"passive",l:"Passive"},{v:"hybrid",l:"Hybrid"},{v:"active",l:"Active"}],
        hint:"Passive is insulated packaging with phase-change packs, qualified for a stated duration. Active is powered, controlled, and reports in real time.",
        why:"Cold chain solution determines excursion probability and therefore quarantine risk on every 2-8°C line."}):"")+
      (S.key==="pharma"? slider({g:"qpDays",label:"QP release lead time",min:1,max:21,suf:" days",
        hint:"Batch certification by a Qualified Person. It sits on top of every manufacturing lead time and creates quarantine stock.",
        why:"QP release adds to effective lead time and converts finished stock into quarantine stock, present, owned, unavailable."}):"")+
      (S.key==="pharma"? sw({g:"serial",label:"Serialisation compliant",sub:"Pack-level identifiers and aggregation",
        why:"Non-compliance blocks market access. Aggregation errors surface at the wholesaler, not in your warehouse."}):""));
    h+=card("Time to survive vs time to recover","the only risk metric worth reporting",
      '<div data-chart="ttr"></div>'+
      '<div data-live="ttrnote"></div>'+
      learn("Why TTR/TTS beats every risk heat map",
        viz(dgTTR(),"<b>One timeline, two lengths.</b> Your stock lasts 28 days. Their recovery takes 68. The red bar is the 40 days in between, during which you have nothing to sell. Every risk conversation becomes concrete the moment it is expressed this way, and there is exactly one question to ask each supplier to get the grey bar.")+
        "<p>The standard approach, rank risks by likelihood × impact, colour the grid, feels rigorous and fails for two reasons. Supply chain catastrophes are low-likelihood, so they rank low. And they are correlated, so the grid treats nine suppliers in one industrial park as nine independent risks when they are one risk wearing nine badges.</p>"+
        "<p>The alternative asks two answerable questions about every node:</p>"+
        "<ul><li><b>Time to recover (TTR)</b>: how long would this node take to resume full function after a serious disruption? Ask the supplier. Most have never been asked and will have to go and find out, which is itself informative.</li>"+
        "<li><b>Time to survive (TTS)</b>: how long could you keep serving customers if this node stopped, given current inventory and alternatives?</li></ul>"+
        fx("Exposure = TTR − TTS","In days. Positive means a gap. No colours required.")+
        "<p>The output is a list of nodes with a number of days beside each. That is a board-level conversation: 'if this supplier stops, we run out in 11 days and they need 68 to recover, here are three options and what each costs.' A heat map cannot produce that sentence.</p>"+
        minor("Map by revenue at risk, not by spend. The €4,000-a-year sole-source label printer that halts every line is a far bigger exposure than the €4m component with three qualified sources, and it will never appear on a procurement spend analysis.")));
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Days of survival by line item","if supply stopped today",'<div data-chart="tts"></div>'+
      '<p class="hint">Each bar is how long that product could keep serving demand from stock on hand and in transit. '+
      'The shortest bar on an A item is your real exposure, regardless of what the portfolio average says.</p>');
    h+=card("Disruption calendar","this simulated year",'<div data-live="events"></div>');
    h+='</div>';

    if(S.key==="packaging"){
      h+=card("Converter-specific exposures","waste, artwork and regulation",
        '<div data-live="pharmarisk"></div>'+
        learn("Why packaging supply chains behave differently",
          "<p>A converter is not a manufacturer with customers, it is a supplier of somebody else's raw material, and almost every constraint follows from that.</p>"+
          "<ul><li><b>Your finished goods have exactly one possible buyer.</b> Printed to one brand's artwork, in their colours, with their barcode. If they rebrand, your stock is scrap value. This is the single largest difference from every other sector in this app.</li>"+
          "<li><b>Material is 60-70% of cost and index-linked.</b> Kraftliner, resin, film and foil are traded commodities. A spike lands on your P&amp;L immediately and reprices to the customer on a lag, if at all. Conversion efficiency is the only margin you genuinely control.</li>"+
          "<li><b>Waste happens before the first good unit.</b> Make-ready substrate is consumed on every changeover, which turns run length into a direct material cost rather than just a capacity question.</li>"+
          "<li><b>Your customers hold no stock.</b> They run JIT into a filling line, so their buffer sits in your warehouse. If that was not priced into the contract, you are funding their working capital.</li>"+
          "<li><b>Regulation prices the material itself.</b> Producer responsibility levies and recycled-content mandates mean substrate choice is now a compliance decision with a deadline that cannot slip.</li></ul>"+
          minor("The clause that matters most in a packaging contract is rarely price. It is who owns obsolete stock when artwork changes, and what notice period applies. Converters who never negotiated it discover the answer during a rebrand, which is the worst possible time.")));
    }
    if(S.key==="pharma"){
      h+=card("Pharma-specific exposures","GxP, cold chain and release",
        '<div data-live="pharmarisk"></div>'+
        learn("Why pharma supply chains behave differently",
          "<p>Every constraint in this sector traces back to one fact: the product is a medicine, and the regulator's question is not 'did it arrive' but 'can you prove it was made, stored and moved correctly, and can you find every pack if it was not'.</p>"+
          viz(dgCold(),"<b>A temperature logger's record from one shipment.</b> The green band is the labelled 2-8°C range. The genset failed and the load spent eleven hours above it. Nothing here proves the product is damaged, but it cannot be sold until a Qualified Person has assessed it against the stability data, and that assessment takes time you do not have.")+
          "<ul><li><b>Release, not production, is the finish line.</b> A Qualified Person must personally certify every batch before sale. Physical stock is not available stock, and quarantine inventory sits on your balance sheet servicing nobody.</li>"+
          "<li><b>Temperature is a quality attribute.</b> An excursion outside 2-8°C does not automatically destroy product, stability data and a QP assessment decide. But the stock is frozen commercially while that runs, which is a service failure whatever the quality verdict.</li>"+
          "<li><b>Shelf life is commercial, not just legal.</b> Customers and tenders routinely demand 75-85% of shelf life remaining on receipt. Product that is in date and compliant can still be worthless.</li>"+
          "<li><b>API concentration is structural.</b> A large share of active ingredients comes from a small number of sites. Qualifying an alternative takes 18-36 months plus a regulatory variation, so the mitigation has to be funded years before the risk arrives, which is exactly why it usually is not.</li>"+
          "<li><b>Serialisation is a supply chain process, not an IT project.</b> Pack-to-case-to-pallet aggregation errors are discovered at the wholesaler, and by then the pallet has been broken down.</li></ul>"+
          minor("When planning a product launch here, the constraint is almost never manufacturing capacity. It is stability data, artwork approval market by market, and QP capacity. Plan those three as critical path and the factory will look easy.")));
    }

    h+=card("Risk register · every line item","exposure, not opinion",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Source</th><th>Lead time</th><th>Days of cover'+dirMini('daysCover')+'</th>'+
      '<th>TTS'+dirMini('tts')+'</th><th>TTR'+dirMini('ttr')+'</th><th>Exposure'+dirMini('exposure')+'</th><th>Revenue at risk</th><th>Rating</th>'+
      '</tr></thead><tbody data-live="rgrid"></tbody></table></div>'+
      '<p class="hint" style="margin-top:8px">Sort this by revenue at risk rather than by spend and the priorities usually rearrange themselves completely.</p>');
    return h;
  },
  live:function(M){
    var g=ST.g,S=M.S,o={};
    o.ttrnote = M.exposure>40? nt("bad","Serious recovery gap",
        "Your most exposed A item survives "+fm(M.tts,0)+" days without supply; recovery takes "+fm(M.ttr,0)+" days. That is <b>"+
        fm(M.exposure,0)+" days</b> of unserved demand, roughly "+money(M.revenue/91*M.exposure)+" of revenue. Dual sourcing cuts TTR; more cover raises TTS. Both cost money, and choosing between them is the job.")
      : M.exposure>0? nt("warn","Manageable gap",
        fm(M.exposure,0)+" days of exposure. Survivable but uncomfortable, a disruption would be visible to customers. Worth knowing which specific SKU is the binding constraint rather than treating it as a portfolio number.")
      : nt("good","Covered",
        "Time to survive ("+fm(M.tts,0)+" days) exceeds time to recover ("+fm(M.ttr,0)+" days) on your critical items. You could absorb a supplier failure without a customer noticing. Check that this is a deliberate position and not an accident of high inventory.");

    if(S.key==="packaging"){

        return '<button data-gcat="'+c+'" class="'+(ST.glossCat===c?"on":"")+'">'+esc(c)+'</button>';}).join("")+'</div>'+

      '<li><b>Demand</b> = base × seasonal index × promotional uplift × event shock. Forecast error is derived from the item\'s coefficient of variation, how well your chosen method matches the pattern present, how far alpha is from the item\'s optimum, and the gap between the uplift you set and the uplift that was needed.</li>'+

  }
};

function dirTag(k,dark){
  var D=DIR[k]; if(!D) return "";
  var cls=D.d, txt=D.d==="up"?"↑ higher is better":D.d==="down"?"↓ lower is better":"↕ mid-range is best";
  var shrt=D.d==="up"?"↑ higher":D.d==="down"?"↓ lower":"↕ mid";
  return '<span class="'+(dark?"dir":"dirL")+' '+cls+'" title="'+txt+'">'+(dark?shrt:txt)+'</span>';
}
function dirMini(k){
  var D=DIR[k]; if(!D) return "";
  return '<span class="dir '+D.d+'" title="'+(D.d==="up"?"higher is better":D.d==="down"?"lower is better":"mid-range is best")+'">'+
    (D.d==="up"?"↑":D.d==="down"?"↓":"↕")+'</span>';
}
/* a metric card: value, which way is good, plain English, and where you sit */
function mx(k,val,txt,toneCls){
  var D=DIR[k]; if(!D) return "";
  var pos=clamp((val-D.lo)/((D.hi-D.lo)||1),0,1)*100;
  var revScale = D.d==="down";
  var lowLbl,highLbl;
  if(D.d==="up"){ lowLbl="weak"; highLbl="strong"; }
  else if(D.d==="down"){ lowLbl="good"; highLbl="costly"; }
  else { lowLbl="too low"; highLbl="too high"; }
  var scaleCls = D.d==="mid" ? "" : (revScale?"rev":"");
  var bar = (D.u==="€")? "" :
    '<div class="scale '+scaleCls+'"'+(D.d==="mid"?' style="background:linear-gradient(90deg,var(--warn),var(--good) 50%,var(--bad))"':'')+
    '><i style="left:'+pos.toFixed(1)+'%"></i></div>'+
    '<div class="sl"><span>'+lowLbl+' '+fm(D.lo,0)+D.u+'</span><span>'+highLbl+' '+fm(D.hi,0)+D.u+'</span></div>';
  return '<div class="mx"><div class="t"><span>'+esc(D.n)+'</span>'+dirTag(k)+'</div>'+
    '<div class="v '+(toneCls||"")+'">'+txt+'</div>'+
    '<div class="d">'+D.p+' <b style="color:var(--ink)">'+D.why+'</b></div>'+bar+'</div>';
}

function chapter(tab){
  var C=CHAPTERS[tab]; if(!C) return "";
  var i=TAB_ORDER.indexOf(tab)+1;
  return '<div class="chapter"><div class="chapwrap">'+
    '<div class="chapart">'+illuFor(tab)+'</div><div class="chaptxt">'+
    '<div class="cn">Step '+i+' of '+TAB_ORDER.length+'</div>'+
    '<h2>'+esc(C.t)+'</h2><div class="cd">'+esc(C.d)+'</div>'+
    '<div class="chain">'+C.chain.map(function(c,j){
      return (j?'<i>›</i>':'')+'<b>'+esc(c)+'</b>';}).join("")+'</div></div></div></div>';
}
function pager(tab){
  var i=TAB_ORDER.indexOf(tab);
  var prev=i>0?TAB_ORDER[i-1]:null, next=i<TAB_ORDER.length-1?TAB_ORDER[i+1]:null;
  var nm=function(k){return (CHAPTERS[k]&&CHAPTERS[k].n)||(TABS[k]&&TABS[k].n)||k;};
  var ti=function(k){return (CHAPTERS[k]&&CHAPTERS[k].t)||"";};
  var wy=function(k){return (CHAPTERS[k]&&CHAPTERS[k].next)||"";};
  var h='<div class="pager">';
  h+= prev
    ? '<button class="pgbtn" data-tab="'+prev+'"><span class="ar">←</span><span><span class="lb">Back to step '+i+'</span>'+
      '<span class="tt">'+esc(nm(prev))+'</span><span class="wy">'+esc(ti(prev))+'</span></span></button>'
    : '<div class="pgbtn dis"><span class="ar">←</span><span><span class="lb">You are at the start</span>'+
      '<span class="tt">Nothing before this</span></span></div>';
  h+= next
    ? '<button class="pgbtn nx" data-tab="'+next+'"><span class="ar">→</span><span><span class="lb">Next, step '+(i+2)+'</span>'+
      '<span class="tt">'+esc(nm(next))+'</span><span class="wy">'+esc(wy(tab))+'</span></span></button>'
    : '<button class="pgbtn nx" data-tab="tower"><span class="ar">↺</span><span><span class="lb">End of the walkthrough</span>'+
      '<span class="tt">Back to the control tower</span><span class="wy">Change something and watch it ripple through again.</span></span></button>';
  return h+'</div>';
}

/* effective SKU = seeded item file, with your edits on top */
function effSku(sk){
  var o=ST.md[sk.code];
  if(!o) return sk;
  var out={};
  for(var k in sk) out[k]=sk[k];
  for(var j in o) if(o[j]!=null&&isFinite(o[j])) out[j]=o[j];
  out.dailyBase=out.baseQ/91;
  return out;
}
function skuList(S){
  var extra=(ST.newSkus||[]).filter(function(s){return s.sector===S.key;});
  return S.skus.concat(extra).filter(function(s){return !ST.hidden[s.code];}).map(effSku);
}
function newSku(S){
  var n=1,code;
  do{ code=S.key.slice(0,2).toUpperCase()+"-NEW"+(n<10?"0"+n:n); n++; }
  while(skuList(S).filter(function(s){return s.code===code;}).length);
  var base=S.skus[0];
  return {code:code,name:"New product line",abc:"B",xyz:"Y",sector:S.key,
    price:base.price,cost:base.cost,baseQ:Math.round(base.baseQ*0.3),cv:0.2,lt:base.lt,ltSd:base.ltSd,
    moq:base.moq,S:base.S,shelf:base.shelf,promo:0.3,kg:base.kg,cbm:base.cbm,
    src:"Not yet defined",note:"You created this line. Every number in it is yours to set.",
    season:[1,1,1,1,1,1,1,1],dailyBase:base.baseQ*0.3/91};
}

/* ---------- the weekly planning book ---------- */
var WK=13;
function planOf(code){
  if(!ST.plan[code]) ST.plan[code]={};
  return ST.plan[code];
}
function defaultFc(r){
  var W=weekly(r.sk,ST.g,ST.q,WK);
  return W.act.map(function(v){return Math.round(v);});
}
function computeMps(r){
  var P=planOf(r.sk.code);
  var fc=P.fc||defaultFc(r);
  var firm=P.firm||fc.map(function(v,i){return i<3?Math.round(v*0.9):0;});
  var rec=P.rec||new Array(WK).fill(0);
  var open=P.open!=null?P.open:Math.round(r.SSu+r.Q/2);
  var wk=[],stock=open,short=0,invSum=0,orders=0,belowSS=0;
  for(var i=0;i<WK;i++){
    var dem=Math.max(fc[i]||0,firm[i]||0);
    var opening=stock;
    var receipt=rec[i]||0;
    if(receipt>0) orders++;
    var avail=opening+receipt;
    var served=Math.min(avail,dem);
    var closing=avail-served;
    var miss=dem-served;
    short+=miss; invSum+=closing;
    if(closing<r.SSu) belowSS++;
    wk.push({i:i,fc:fc[i]||0,firm:firm[i]||0,dem:dem,open:opening,rec:receipt,
      close:closing,miss:miss,cover:dem>0?closing/(dem/7):0,below:closing<r.SSu});
    stock=closing;
  }
  var totDem=sum(wk.map(function(x){return x.dem;}));
  var avgInv=invSum/WK;
  var sk=r.sk;
  var holding=avgInv*sk.cost*ST.g.holdRate/52*WK;
  var ordering=orders*sk.S;
  var lost=short*sk.price*0.35;
  var service=totDem>0?(1-short/totDem)*100:100;
  return {wk:wk,fc:fc,firm:firm,rec:rec,open:open,short:short,avgInv:avgInv,orders:orders,
    holding:holding,ordering:ordering,lost:lost,total:holding+ordering+lost,
    service:service,totDem:totDem,belowSS:belowSS};
}
/* what a replenishment policy would do with the same forecast.
   Receipts are placed in the week they are needed; placing the order
   happens one lead time earlier, which the copy makes explicit. */
function autoPlan(r){
  var P=planOf(r.sk.code);
  var fc=P.fc||defaultFc(r);
  var firm=P.firm||fc.map(function(v,i){return i<3?Math.round(v*0.9):0;});
  var open=P.open!=null?P.open:Math.round(r.SSu+r.Q/2);
  var rec=new Array(WK).fill(0), stock=open;
  var lot=Math.max(Math.round(r.Q), Math.round(r.sk.moq));
  for(var i=0;i<WK;i++){
    var dem=Math.max(fc[i]||0,firm[i]||0);
    if(stock-dem < r.SSu){
      var need=r.SSu+dem-stock;
      var lots=Math.max(1,Math.ceil(need/Math.max(lot,1)));
      rec[i]=lots*lot;
      stock+=rec[i];
    }
    stock=Math.max(0,stock-dem);
  }
  return rec;
}

  });
  s+=tx(cx,cy+4,"pick two","middle","",13,"var(--sub)");
  s+=box(40,282,460,34,"var(--warnBg)","var(--warn)",8);
  s+=txw(270,297,"Pull any corner toward you and at least one other moves away. That tension is the entire job.",430,10.5,"middle","#111111");
  return s+'</svg>';
}

];
function sec(id,title,eyebrow,body){
  return '<section id="ls-'+id+'">'+card(title,eyebrow,
    '<div class="secart">'+illuFor(id)+'</div>'+body+refBlock(id))+'</section>';
}
function twoViz(a,ca,b,cb){
  return viz(a,ca)+viz(b,cb);
}

function learnPage(){
  var h='<div class="learnwrap"><div class="lwrap">';

  h+='<nav class="lnav">'+LEARN_SECTIONS.map(function(s){
    return '<a href="#ls-'+s[0]+'">'+esc(s[1])+'</a>';}).join("")+'</nav>';

  /* ---- what a supply chain is ---- */
  h+=sec("what","What a supply chain actually is","start here",
    '<p class="lede" style="margin-top:-2px">A supply chain is every step between a raw material coming out of the ground and a finished product reaching somebody who wants it, '+
    'plus every decision about how much of it to have, where to put it, and when to move it.</p>'+
    '<p>The physical part is easy to picture. The part that is actually difficult, and the part this simulator is about, is that '+
    '<b>every one of those decisions has to be made before you know whether it was right</b>. You order silicon forty weeks before the phone sells. '+
    'You commit factory capacity before the season starts. You choose ocean over air before you know whether demand will spike.</p>'+
    viz(scChain(),"<b>Two arrows, not one.</b> Goods move left to right and get faster as they go: weeks at the mine, minutes at the till. Information moves right to left, and gets noisier at every step. Everything in this field happens in the gap between those two arrows.")+
    '<p>So the discipline is not really about logistics. It is about <b>making decisions under uncertainty and then paying for the ones that were wrong</b>, '+
    'in inventory, in expediting, or in customers you disappointed. Everything below is a tool for making that payment smaller.</p>'+
    '<div class="grid3" style="margin-top:14px">'+
    [["How much will we sell?","Demand planning. Always wrong. The job is to be wrong by a small, known, unbiased amount."],
     ["How much should we hold?","Inventory policy. Stock is the premium you pay for not knowing the answer to question one."],
     ["Who makes it, and when?","Sourcing and production. Capacity behaves in ways that surprise people."],
     ["How does it get there?","Logistics and warehousing. Speed, cost and carbon move together."],
     ["What did it all cost?","Finance. This work stays invisible until somebody expresses it in cash."]
    ].map(function(x){return '<div style="border:1px solid var(--rule);border-radius:12px;padding:12px 13px;background:var(--panel)">'+
      '<b style="font-size:.88rem">'+esc(x[0])+'</b><div class="hint" style="margin-top:3px">'+esc(x[1])+'</div></div>';}).join("")+
    '</div>');

  /* ---- the tension ---- */
  h+=sec("tension","The four-way tension","the reason this is hard",
    viz(dgTradeoff(),"<b>Four corners, and you can reliably hold two.</b> Raise the service target and inventory rises with it. Cut inventory and service follows it down. Switch to air freight and service improves while cost and carbon jump.")+
    '<p>Almost every supply chain argument inside a company is an argument about which corner matters most this quarter, held between people who each own one corner. '+
    'Sales owns service. Finance owns cash. Operations owns cost. Sustainability owns carbon. None of them is wrong, which is what makes the argument permanent.</p>'+
    nt("good","The exceptions, and why they are worth a career",
      "A small number of things improve two corners at once. <b>A better forecast</b> gives less inventory at the same service. "+
      "<b>A shorter or more reliable lead time</b> does the same. <b>Fuller vehicles</b> cut cost and carbon together. <b>A warehouse re-slot</b> cuts labour and speeds despatch. "+
      "When you find one of these, it is worth far more than another round of arguing about the service target."));

  /* ---- why inventory exists ---- */
  h+=sec("stock","Why inventory exists at all","three buckets, one of them optional",
    viz(scBuckets(),"<b>Everything you own falls into one of three buckets.</b> Cycle stock exists because you order in batches. Pipeline stock exists because goods take time to arrive. Only safety stock is a genuine choice, and it is the one everybody argues about.")+
    '<p>Inventory is not an asset in any way that matters operationally. It is <b>cash converted into a form that decays, occupies space and needs insuring</b>. '+
    'It exists for exactly one reason: uncertainty. If you knew demand precisely and supply arrived exactly on time, you would need none of it.</p>'+
    '<p>That framing is useful because it tells you where to attack. If cycle stock is the problem, the answer is cheaper ordering or faster changeovers, not a policy argument. '+
    'If pipeline stock is the problem, the answer is a shorter lane or different Incoterms. Only if safety stock is the problem is the answer about service levels, '+
    'and even then the real lever is usually variability rather than the target.</p>'+
    viz(dgSafety(),"<b>The saw-tooth.</b> Stock falls as customers buy. At the reorder point you place an order, and it arrives one lead time later. The red band does nothing at all in a normal cycle: it exists only for the cycles where demand runs hot or the delivery runs late.")+
    minor("Ask of any pile of stock: which bucket is this, and what would have to change for it not to exist? A surprising amount of inventory turns out to be cycle stock created by an ordering process nobody has looked at since the system was installed."));

  /* ---- uncertainty ---- */
  h+=sec("uncertainty","Uncertainty, and the bell curve","the one piece of statistics you need",
    '<p class="lede" style="margin-top:-2px">Demand over a lead time is not a number. It is a distribution: a most likely value with a spread either side. '+
    'Everything about inventory follows from taking that seriously.</p>'+
    viz(sciNormal(),"<b>Computed, not illustrative.</b> The curve is the standard normal density. The green area is the 95% of replenishment cycles where you have enough. The red tail is the 5% where you do not. The orange bar between the mean and the reorder point is exactly what safety stock is.")+
    '<p>Two quantities describe that curve. The <b>mean</b> is what you expect to sell over the lead time. The <b>standard deviation</b>, written sigma, is how far reality typically strays from it. '+
    'Roughly two thirds of outcomes land within one sigma of the mean and about 95% within two.</p>'+
    fx("Safety stock = Z x sigma","Z is how many standard deviations of buffer you choose to carry. That single choice is your service level.")+
    '<p>The word to be careful with is <b>average</b>. If you hold exactly the average demand over the lead time, you will run out in half of all cycles, because half of all outcomes are above the average. '+
    'That is a 50% service level, and it is what happens by default when nobody has thought about the distribution.</p>'+
    nt("warn","The assumption, stated honestly",
      "Real demand is rarely perfectly normal. It is often skewed, sometimes lumpy, and for spare parts it is mostly zeroes with occasional spikes. "+
      "The normal assumption is a working approximation that is good enough for fast-moving items and wrong for intermittent ones, which is why Croston\'s method exists. "+
      "Knowing where the assumption breaks is more useful than knowing the formula."));

  /* ---- safety stock derived ---- */
  h+=sec("safety","Safety stock, derived","where the square roots come from",
    '<p class="lede" style="margin-top:-2px">Almost everyone can quote the safety stock formula. Far fewer can say why it has two terms and why both sit under a square root. '+
    'The answer explains most of what is counter-intuitive about inventory.</p>'+
    fx("SS = Z x sqrt( LT x sigmaD^2  +  d^2 x sigmaLT^2 )","LT is lead time, sigmaD is the standard deviation of demand per day, d is average daily demand, sigmaLT is the standard deviation of lead time.")+
    '<h4 style="margin:16px 0 4px">Why a square root</h4>'+
    '<p>Variances add; standard deviations do not. If each day of demand is independent with variance sigmaD squared, then over LT days the total variance is LT times sigmaD squared, '+
    'and the standard deviation is the square root of that. So doubling the lead time does not double the buffer. It multiplies it by the square root of two, about 1.41.</p>'+
    '<p>Run that backwards and you get one of the most useful facts in the field: <b>halving your lead time cuts safety stock by about 29%, not 50%</b>. '+
    'A lead time reduction project that was sold on halving the buffer will disappoint precisely this much.</p>'+
    '<h4 style="margin:16px 0 4px">Why two terms</h4>'+
    '<p>The first term is uncertainty about <i>how much</i> customers will want. The second is uncertainty about <i>when</i> the goods will turn up. '+
    'They are separate sources of risk and they combine as variances, which is why they add inside the square root.</p>'+
    viz(sciTwoTerm(),"<b>Both terms plotted against lead time.</b> The blue dashed line is demand variability, and it grows with the square root of lead time. The red dashed line is lead time variability, and it is flat: it does not shrink at all as the lead time falls. The black line is the total.")+
    nt("bad","The mistake this diagram exists to prevent",
      "Most textbook examples and a great many real systems drop the second term entirely. When they do, the model promises a service level it cannot deliver, and everybody blames the planner. "+
      "Notice on the chart that for short lead times the red line dominates completely. If your supplier delivers anywhere between 20 and 60 days, <b>reducing that variance is worth more than reducing the average</b>, "+
      "and it usually costs a conversation rather than a contract.")+
    viz(sciServiceZ(),"<b>Z against service level, computed from the inverse normal.</b> The curve is nearly flat up to about 90% and then turns sharply upward. The shaded region is the last 4.9 percentage points, which nearly double the buffer on their own.")+
    '<p>This shape is why blanket service targets are expensive. Going from 95% to 99.9% costs you roughly 88% more safety stock for less than five points of service. '+
    'On an A item with a customer who genuinely notices, that may be worth it. On a C item, it almost never is, and the money spent there is money not available for the item that mattered.</p>'+
    '<div class="fx"><div class="f">A worked example</div><div class="n">'+
    'Daily demand 120 units, sigma 26. Lead time 30 days, sigma 6 days. Target 95%, so Z = 1.64.<br>'+
    'First term: 30 x 26^2 = 20,280.  Second term: 120^2 x 6^2 = 518,400.<br>'+
    'Sum 538,680, square root 734. Safety stock = 1.64 x 734 = <b>1,204 units</b>, about 10 days of cover.<br>'+
    'Note that the second term is 26 times the first. <b>Nearly all of this buffer is paying for an unreliable supplier, not for variable customers.</b>'+
    '</div></div>');

  /* ---- service vs fill ---- */
  h+=sec("service","Service level is not fill rate","two numbers people use interchangeably",
    '<p class="lede" style="margin-top:-2px">Cycle service level is the probability of not running out during a replenishment cycle. '+
    'Fill rate is the fraction of demand you actually supplied from stock. They are different numbers, and the gap between them is usually three to five points.</p>'+
    viz(dgCSL(),"<b>The same week, counted two ways.</b> On the left, one cycle in twenty had a shortage: a 95% service level. On the right, the shortage that happened was small, so 99.3% of what customers asked for still shipped.")+
    '<p>The reason they differ is that service level counts <i>events</i> and fill rate counts <i>units</i>. Most stockouts are shallow and brief: you run out on the last day before a delivery, '+
    'and you miss a handful of units. Counting that as a total failure overstates the damage considerably.</p>'+
    fx("Fill rate = 1 - ( sigmaL x G(k) ) / Q","G(k) is the unit normal loss function, the expected shortfall in standard deviations. It converts how often into how much.")+
    viz(sciFill(),"<b>Fill rate plotted against cycle service level.</b> The grey dashed line is where they would be equal. The orange curve is what actually happens: fill rate sits well above service level throughout, and the two only converge at the very top.")+
    nt("good","The practical use of this",
      "When somebody says the target is 95%, ask which number they mean. If they mean fill rate, a 95% <i>service level</i> policy already delivers about 99%, and you may be carrying "+
      "considerably more stock than the target requires. That one question has funded a lot of inventory reduction projects."));

  /* ---- order quantity ---- */
  h+=sec("howmuch","How much to order at a time","and why precision here is wasted",
    '<p class="lede" style="margin-top:-2px">Order in large batches and you carry a lot of stock but place few orders. Order in small batches and the reverse. '+
    'The economic order quantity is where the two costs are equal, which is where their sum is smallest.</p>'+
    fx("EOQ = sqrt( 2 x D x S / H )","D is annual demand, S is the cost of placing and receiving one order, H is the cost of holding one unit for a year.")+
    '<h4 style="margin:16px 0 4px">Where it comes from</h4>'+
    '<p>Annual ordering cost is D/Q times S: more orders when Q is small. Annual holding cost is Q/2 times H, because average cycle stock is half the order quantity. '+
    'Total cost is the sum. Differentiate with respect to Q, set to zero, and you get the formula above. The minimum happens to be exactly where the two costs cross, which is a pleasant coincidence and a useful sanity check.</p>'+
    viz(sciEOQ(),"<b>Both cost curves and their sum, computed.</b> Ordering cost falls as a hyperbola, holding cost rises as a straight line, and the total is U-shaped. The green band is 30% either side of the optimum.")+
    nt("good","The most useful thing about EOQ is how flat it is",
      "Look at the green band. Being 30% away from the optimal quantity costs about 2% in total cost. This has two consequences that matter far more than the formula itself. "+
      "<b>First, stop agonising over precision.</b> Round to a sensible pallet or case quantity and move on. "+
      "<b>Second, fight hard about S.</b> Halving the cost of placing an order moves EOQ down by 29% and makes smaller, fresher, more responsive batches genuinely economic. "+
      "That is what an automated purchase order or a changeover reduction project actually buys you.")+
    '<p class="hint">EOQ assumes constant demand, instant replenishment, no quantity discounts and no capacity limit. All four are false in your business. '+
    'Use it as a check on the order of magnitude, never as an instruction.</p>');

  /* ---- newsvendor ---- */
  h+=sec("newsvendor","The newsvendor problem","for anything you only get one shot at",
    '<p class="lede" style="margin-top:-2px">Some decisions cannot be corrected. The Christmas order, the flu vaccine batch, the newspaper print run, the fashion season. '+
    'You commit once, demand arrives, and whatever you got wrong you keep.</p>'+
    '<p>The instinct is to order the expected demand. That is almost always wrong, and the reason is that the two ways of being wrong do not cost the same.</p>'+
    fx("Critical ratio = Cu / ( Cu + Co )","Cu is the cost of being short by one unit, usually the lost margin. Co is the cost of having one unit too many, usually the write-down.")+
    viz(sciNewsvendor(),"<b>The optimal order is a percentile, not an average.</b> With €14 of lost margin against €6 of write-down, the critical ratio is 0.70, so you order up to the 70th percentile of demand. The orange line sits noticeably to the right of the peak.")+
    '<p>Read the formula as a question: <b>what fraction of the pain comes from being short?</b> If running out costs three times as much as overstocking, you should be covered '+
    'three quarters of the time, which means deliberately ordering more than you expect to sell and deliberately accepting leftovers most years.</p>'+
    '<p>Turn the numbers around and it works the other way. For fresh food with a thin margin and a total write-off, Co can exceed Cu, the ratio drops below a half, '+
    'and the right answer is to order <b>less</b> than the average and accept that you will sell out. Bakeries have known this for centuries without the algebra.</p>'+
    minor("The hardest part of applying this is not the maths, it is getting an honest Cu. Finance will give you the lost gross margin. The real figure usually includes the customer who bought elsewhere and did not come back, and nobody has that number, which is exactly why it gets set to zero."));

  /* ---- pareto ---- */
  h+=sec("pareto","Not everything deserves the same attention","ABC, XYZ, and the nine boxes",
    viz(sciPareto(),"<b>A Pareto curve, computed.</b> Each bar is one product line ranked by value; the black line is cumulative. About a fifth of the lines carry 80% of the value, and the long tail on the right carries almost nothing.")+
    '<p>This shape appears in nearly every portfolio anyone has ever measured. It matters because management attention is the scarcest resource in a planning team, '+
    'and spreading it evenly across the range guarantees that it is misallocated.</p>'+
    '<p>ABC ranks by value. XYZ ranks by <i>predictability</i>: X is steady and forecastable, Y is variable but patterned, Z is erratic. Crossing them gives nine boxes.</p>'+
    viz(dgABCXYZ(),"<b>Value across, predictability down.</b> Each box calls for genuinely different behaviour, and the corners are the interesting ones.")+
    '<p>The two corners are worth memorising. <b>AX</b> is high value and predictable: tight control, low cover, automated replenishment with exception alerts. '+
    '<b>CZ</b> is low value and erratic: buffer it generously and stop thinking about it, because the stock is genuinely cheaper than the meetings about the stock.</p>'+
    '<p>The hard box is <b>AZ</b>: expensive and unpredictable. Buffer is the wrong tool because it is expensive precisely where you can least afford it. '+
    'The right tools are postponement, late configuration, a supplier who can respond quickly, or an honest conversation with the customer about lead time.</p>'+
    minor("Re-run the classification quarterly, not annually. Items migrate. A C item that has just been designed into a major customer\'s product is an A item nobody has noticed yet, and the first sign is usually a stockout."));

  /* ---- forecasting ---- */
  h+=sec("forecast","Forecasting: width and shift","two different problems, two different cures",
    '<p class="lede" style="margin-top:-2px">Every forecast is wrong. What matters is the shape of the wrongness, and there are two independent ways to be wrong.</p>'+
    viz(sciBias(),"<b>Two error distributions with identical spread.</b> On the left the errors are centred on zero and cancel out over time. On the right they are shifted: every period is a little short, and the shortfalls accumulate.")+
    '<p><b>Width</b> is accuracy, usually reported as MAPE or its weighted cousin WMAPE. It tells you how far you typically miss. Buffer handles width: that is precisely what safety stock is for.</p>'+
    '<p><b>Shift</b> is bias, the average signed error. Buffer does not handle bias, it only hides it more expensively. '+
    'A persistent positive bias builds inventory you will write off later; a persistent negative one produces chronic firefighting that no amount of stock will settle.</p>'+
    fx("Tracking signal = running sum of errors / mean absolute deviation","Beyond about plus or minus four, the model has lost touch with reality. It is the smoke alarm, not the fire extinguisher.")+
    '<p>The practical order of work is: check bias first, because it is a defect and it is fixable. Then check width, because that is what you buffer against. '+
    'Then check the tracking signal, because a model that used to work and has stopped is a different problem from one that never worked.</p>'+
    nt("warn","Read the incentive before you read the number",
      "Sales teams under-forecast when they are measured on hitting target and over-forecast when they are measured on securing supply. "+
      "Neither is dishonesty; both are rational responses to how somebody is paid. A forecast bias that appears every single quarter is usually an incentive problem wearing a statistics costume."));

  /* ---- bullwhip ---- */
  h+=sec("whip","The bullwhip effect","how small ripples become tidal waves",
    viz(scAmplify(),"<b>Nobody lied.</b> Everyone added a little for safety, and by the fourth step the order is more than double the demand that started it. Real demand never moved at all.")+
    '<p>Four well-run companies, each behaving rationally, will still produce wild oscillation upstream. The causes are structural rather than moral:</p>'+
    '<ul><li><b>Demand signal processing.</b> Each tier forecasts off the orders it receives rather than off real end demand, so noise compounds at every step.</li>'+
    '<li><b>Order batching.</b> Economics push everyone to order in lumps, and lumps look like demand spikes to the tier above.</li>'+
    '<li><b>Price fluctuation.</b> Promotions and forward buying move volume in time without changing consumption.</li>'+
    '<li><b>Rationing and gaming.</b> When supply is allocated in proportion to orders, inflating your order is the rational move, and everybody knows it.</li></ul>'+
    viz(sciBullwhip(),"<b>Amplification compounds, and lead time is the multiplier.</b> Three lead times plotted across four echelons. At one week the chain absorbs the noise; at four weeks the variance at tier three is several times the variance at the shop.")+
    '<p>The lead time result is the actionable one. Amplification is driven by how far ahead each tier has to forecast, so <b>shortening lead times damps the whole chain</b>, '+
    'not just your own part of it. This is the quiet argument for local supply that has nothing to do with politics.</p>'+
    nt("good","What actually works",
      "Share point-of-sale data upstream so everyone plans against the same signal. Shorten and stabilise lead times. Use everyday pricing instead of promotional spikes. "+
      "Allocate on historic sell-through rather than current order size, which removes the incentive to inflate. And let one party manage replenishment for both, "+
      "so there is one demand signal instead of two order streams."));

  /* ---- queueing ---- */
  h+=sec("queue","Why a busy factory is a slow factory","the most counter-intuitive result here",
    '<p class="lede" style="margin-top:-2px">Loading a plant harder does not make it produce faster. Past a certain point it makes everything in it slower, and the relationship is not gentle.</p>'+
    viz(sciQueue(),"<b>Relative lead time against utilisation, at three levels of process variability.</b> All three curves are flat and comfortable up to about 75%, then bend upward, then go nearly vertical. The shaded region is where most plants are asked to operate.")+
    '<p>The mechanism is queueing. A machine at 95% utilisation has almost no idle time to absorb a disturbance, so every breakdown, every late delivery and every rush order '+
    'pushes work into a queue that never gets a chance to drain. The curve is a hyperbola: the term is utilisation divided by one minus utilisation, which goes to infinity as utilisation approaches one.</p>'+
    '<p>Notice that variability shifts the whole curve. The green line is a steady, well-controlled process; the red is a variable one. '+
    '<b>Reducing variability buys you the ability to run at higher utilisation for the same lead time</b>, which is the entire economic argument for process control.</p>'+
    fx("WIP = throughput x cycle time","Little\'s Law. Arithmetic, not theory. It holds in a factory, a warehouse, a hospital and an inbox.")+
    viz(dgLittle(),"<b>The same machine in both rows.</b> Three jobs in the system gives a six day lead time; eleven jobs gives twenty two. Nothing got slower, the work just spends its life queueing.")+
    nt("bad","The expedite death spiral",
      "When a plant is late on everything, the instinct is to release jobs earlier. It is precisely wrong. Releasing earlier raises work in progress, which raises cycle time, which makes you later, "+
      "so you release earlier still. A great deal of expedite culture is this loop running quietly for years, and the way out is counter-intuitive enough that it usually needs the arithmetic above to justify it."));

  /* ---- push pull ---- */
  h+=sec("wall","Push, pull, and the wall between them","one of the few strategic choices",
    viz(scPushPull(),"<b>Everything left of the wall is made on a guess. Everything right of it is made against a real order.</b> Moving the wall is a strategic decision with consequences in both directions.")+
    '<p>The wall is properly called the decoupling point or the order penetration point. Its position decides two things simultaneously: '+
    'how long a customer waits, and how much inventory you carry in a form that might turn out to be wrong.</p>'+
    viz(dgDecoupling(),"<b>The same idea on a production chain.</b> The dashed line is where a real customer order first touches the product.")+
    '<p>Move it right, toward the customer, and delivery gets faster but you hold more finished goods, each one committed to a specific variant. '+
    'Move it left, toward raw material, and you hold less and hold it in a more flexible form, but the customer waits.</p>'+
    '<p>The clever move is to redesign the product so the wall can sit further left without the customer noticing. That is what <b>postponement</b> means: '+
    'paint mixed at the counter, laptops configured after the order, generic packaging labelled late. You turn many uncertain forecasts into one much more accurate aggregate forecast.</p>'+
    minor("When somebody asks you to cut both inventory and lead time at once, they are asking you to move the wall in two directions. The honest answer is that you cannot, unless you change the product or the process so that the wall can move without the trade-off. That reply, delivered calmly with this diagram, is a good day\'s work."));

  /* ---- logistics economics ---- */
  h+=sec("move","The economics of moving things","where the surprises are",
    '<p class="lede" style="margin-top:-2px">Transport looks like a price comparison and is not. Every mode buys you one thing and charges you in another.</p>'+
    viz(sciMode(),"<b>Four modes, total cost including the inventory the transit time creates.</b> The solid bar is freight paid. The pale bar above it is the pipeline and safety stock that the transit time forces you to carry. For a light, valuable item the ranking is not what the freight rate alone suggests.")+
    '<p>This is the calculation almost nobody does. Ocean freight is cheap per kilo and expensive in pipeline stock, safety stock and obsolescence risk. '+
    'Air is the reverse. The break-even depends almost entirely on <b>value density</b>, the value per kilo. Above roughly a thousand euro per kilo, air is often genuinely cheaper in total.</p>'+
    fx("Chargeable weight = the greater of actual kg and volume / 5000","Air and courier freight bill on whichever is larger. Redesigning a carton to fall below the divisor is regularly the highest-return exercise available in logistics.")+
    viz(dgCube(),"<b>Both trailers are full, of different things.</b> The left one ran out of space with weight to spare, so its answer is packaging and pallet patterns. The right one hit the weight limit half empty, so packaging changes are pointless and the answer is consolidation.")+
    viz(dgFTL(),"<b>Two pricing models crossing.</b> Less-than-truckload charges per pallet, so its line rises. Full truckload charges for the trailer whether you fill it or not, so its line is flat. Below the crossover you are sharing; above it you are paying per-pallet rates for a full load.")+
    viz(dgIncoterm(),"<b>The circle is where risk passes to the buyer. The bar is how far the seller keeps paying.</b> Under FCA and DAP they line up, which is what everyone assumes always happens. Under CIF they do not.")+
    nt("warn","The most expensive misunderstanding in trade",
      "Cost and risk do not always transfer at the same point. Under CIF, risk passes when the goods are loaded at origin while the seller keeps paying freight to the destination port. "+
      "Cargo lost mid-ocean is the buyer\'s loss on a shipment the seller is still funding. Check who is insured for that gap, in writing, before it matters."));

  /* ---- warehouse ---- */
  h+=sec("floor","Inside the building","the cheapest wins in the whole chain",
    viz(scFloor(),"<b>A warehouse floor as somebody would sketch it on site.</b> The red line is one picker\'s route for an eight-line order. Fast movers in the middle band, at waist to shoulder height, shortens that line more than any amount of software.")+
    '<p>Warehouse improvement is unglamorous and unusually profitable, because <b>walking is over half of a picker\'s time</b> and walking responds to a decision that costs nothing but a weekend.</p>'+
    viz(dgGolden(),"<b>The same rack seen from the side.</b> The green band between waist and shoulder is fastest to pick and safest for backs, and it is a small fraction of total cube.")+

  h+=sec("risk","When it breaks","resilience without a heat map",

/* glossary filtering on the primer */
function paintLearnGloss(){
  var el=document.getElementById("lgl"); if(!el)return;
  var q=(ST.lgloss||"").trim().toLowerCase(), c=ST.lcat||"ALL";
  var list=GLOSSARY.filter(function(g){
    if(c!=="ALL"&&g[1]!==c) return false;
    return !q||g[0].toLowerCase().indexOf(q)>=0||g[2].toLowerCase().indexOf(q)>=0;});
  if(!list.length){ el.innerHTML='<p class="hint">No match. Try a shorter word.</p>'; return; }
  el.innerHTML='<div class="hint" style="margin-bottom:6px">'+list.length+' term'+(list.length===1?"":"s")+'</div>'+
    list.map(function(g){
      return '<div class="gl"><div class="cat">'+esc(g[1])+'</div><div class="t">'+esc(g[0])+
        '</div><div class="d">'+esc(g[2])+'</div></div>';}).join("");
}
/* ==========================================================
   11 · TWO KINDS OF DIAGRAM
   PLOTS. Every curve here is computed from the formula it
   illustrates, with axes, values and the annotation a
   textbook figure would carry. Nothing is drawn to look
   approximately right.
   ========================================================== */

/* ---------------- (b) plotted, computed diagrams ---------------- */
function axes(o){
  var s='<line class="axis" x1="'+o.pl+'" y1="'+(o.pt+o.ih)+'" x2="'+(o.w-o.pr)+'" y2="'+(o.pt+o.ih)+'"/>'+
        '<line class="axis" x1="'+o.pl+'" y1="'+o.pt+'" x2="'+o.pl+'" y2="'+(o.pt+o.ih)+'"/>';
  if(o.xl) s+=tx(o.pl+o.iw/2,o.h-6,o.xl,"middle","lbl",10);
  if(o.yl) s+='<text transform="translate(12,'+(o.pt+o.ih/2)+') rotate(-90)" text-anchor="middle" class="lbl" font-size="10">'+o.yl+'</text>';
  return s;
}

/* the normal curve, with the service level shaded */
function sciNormal(){
  var w=560,h=250,pl=54,pr=18,pt=22,pb=48,iw=w-pl-pr,ih=h-pt-pb;
  var X=function(z){return pl+(z+3.6)/7.2*iw;}, Y=function(p){return pt+ih-p/0.42*ih;};
  var s=svgOpen(w,h);
  var d="",fill="M"+X(-3.6)+","+Y(0);
  for(var i=0;i<=180;i++){var z=-3.6+i*0.04; d+=(i?"L":"M")+X(z).toFixed(1)+","+Y(npdf(z)).toFixed(1);}
  var z95=nInv(0.95);
  var f="M"+X(z95).toFixed(1)+","+Y(0).toFixed(1);
  for(var j=0;j<=60;j++){var z2=z95+j*(3.6-z95)/60; f+="L"+X(z2).toFixed(1)+","+Y(npdf(z2)).toFixed(1);}
  f+="L"+X(3.6).toFixed(1)+","+Y(0).toFixed(1)+"Z";
  var g2="M"+X(-3.6)+","+Y(0);
  for(var k=0;k<=120;k++){var z3=-3.6+k*(z95+3.6)/120; g2+="L"+X(z3).toFixed(1)+","+Y(npdf(z3)).toFixed(1);}
  g2+="L"+X(z95).toFixed(1)+","+Y(0).toFixed(1)+"Z";
  s+='<path d="'+g2+'" fill="#1E7A52" opacity=".16"/>';
  s+='<path d="'+f+'" fill="#B42318" opacity=".3"/>';
  s+='<path d="'+d+'" fill="none" stroke="var(--ink)" stroke-width="2.2"/>';
  [[0,"mean demand\\nover the lead time","var(--sub)"],[z95,"reorder point","#B42318"]].forEach(function(m){
    s+='<line x1="'+X(m[0]).toFixed(1)+'" y1="'+pt+'" x2="'+X(m[0]).toFixed(1)+'" y2="'+Y(0)+
       '" stroke="'+m[2]+'" stroke-width="1.5" stroke-dasharray="5 4"/>';
    m[1].split("\\n").forEach(function(t,i){ s+=tx(X(m[0]),pt+12+i*11,t,"middle","lbl",9.5,m[2]); });
  });
  s+='<line x1="'+X(0).toFixed(1)+'" y1="'+(Y(0)+14)+'" x2="'+X(z95).toFixed(1)+'" y2="'+(Y(0)+14)+
     '" stroke="var(--acc)" stroke-width="2"/>';
  s+=tx((X(0)+X(z95))/2,Y(0)+27,"safety stock = Z x sigma","middle","",10.5,"var(--accInk)");
  s+=tx(X(2.4),Y(0)-14,"stockout","middle","",10,"#8A2A20");
  s+=tx(X(2.4),Y(0)-3,"5% of cycles","middle","lbl",9.5,"#8A2A20");
  s+=tx(X(-1.5),Y(0.16),"95% of cycles you are fine","middle","",10.5,"#125437");
  [-3,-2,-1,0,1,2,3].forEach(function(z){ s+=tx(X(z),Y(0)+40,(z>0?"+":"")+z+"σ","middle","lbl",9); });
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,yl:"probability"});
  return s+'</svg>';
}

/* safety stock against service level: the blow-up at the top */
function sciServiceZ(){
  var w=560,h=250,pl=58,pr=20,pt=20,pb=46,iw=w-pl-pr,ih=h-pt-pb;

  var zmax=nInv(0.999);

  s+='<path d="'+d+'" fill="none" stroke="var(--acc)" stroke-width="2.6"/>';

/* the two terms of the safety stock formula, as areas */
function sciTwoTerm(){
  var w=560,h=250,pl=58,pr=100,pt=20,pb=46,iw=w-pl-pr,ih=h-pt-pb;
  var d0=120,sd=26,sLT=6,z=1.64,LTmax=60;
  var t1=function(L){return z*Math.sqrt(L*sd*sd);};
  var t2=function(L){return z*Math.sqrt(d0*d0*sLT*sLT);};
  var tot=function(L){return z*Math.sqrt(L*sd*sd+d0*d0*sLT*sLT);};
  var mx=nice(tot(LTmax)*1.08);
  var X=function(L){return pl+L/LTmax*iw;}, Y=function(v){return pt+ih-v/mx*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
    s+=tx(pl-6,y+3.5,qty(mx*i/4),"end","",9.5);}
  var a="M"+X(0)+","+Y(0), b="M"+X(0)+","+Y(0);
  for(var L=0;L<=LTmax;L++){ a+="L"+X(L).toFixed(1)+","+Y(t1(L)).toFixed(1); }
  a+="L"+X(LTmax)+","+Y(0)+"Z";
  s+='<path d="'+a+'" fill="#24559E" opacity=".22"/>';
  var c="";
  for(var L2=0;L2<=LTmax;L2++){ c+=(L2?"L":"M")+X(L2).toFixed(1)+","+Y(tot(L2)).toFixed(1); }
  s+='<path d="'+c+'" fill="none" stroke="var(--ink)" stroke-width="2.6"/>';
  var e="";
  for(var L3=0;L3<=LTmax;L3++){ e+=(L3?"L":"M")+X(L3).toFixed(1)+","+Y(t1(L3)).toFixed(1); }
  s+='<path d="'+e+'" fill="none" stroke="#24559E" stroke-width="2" stroke-dasharray="5 4"/>';
  s+='<line x1="'+pl+'" y1="'+Y(t2(0)).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(t2(0)).toFixed(1)+
     '" stroke="#B42318" stroke-width="2" stroke-dasharray="5 4"/>';
  var slots=[{y:Y(tot(LTmax)),t:["total",""],c:"var(--ink)"},
             {y:Y(t1(LTmax)),t:["demand","variability"],c:"#1F4E82"},
             {y:Y(t2(0)),t:["lead time","variability"],c:"#8A2A20"}];
  slots.sort(function(a,b){return a.y-b.y;});
  var minGap=26, prev=-1e9;
  slots.forEach(function(sl){
    var y=Math.max(sl.y, prev+minGap); prev=y;
    s+=tx(w-pr+5,y+4,sl.t[0],"start","",10,sl.c);
    if(sl.t[1]) s+=tx(w-pr+5,y+15,sl.t[1],"start","lbl",9,sl.c);
  });
  [0,15,30,45,60].forEach(function(L){ s+=tx(X(L),h-24,L+"d","middle","lbl",9.5); });
  s+=tx(pl+iw*0.32,pt+16,"lead time variability does not shrink when lead time does","start","",10,"#8A2A20");
  s+=axes({w:w,h:h,pl:pl,pr:pr,pt:pt,ih:ih,iw:iw,xl:"lead time, days",yl:"safety stock, units"});
  return s+'</svg>';
}

/* cycle service level against fill rate, through the loss function */
function sciFill(){

  var X=function(p){return pl+p/100*iw;}, Y=function(p){return pt+ih-p/100*ih;};

/* ---- decisions, with sane starting values ---- */
function gameInit(){

      /* SUPPLY CHAIN: inventory policy */
