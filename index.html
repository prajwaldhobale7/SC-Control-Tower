<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Supply Chain Control Tower</title>
<meta name="description" content="An offline, interactive supply chain planning simulator and teaching engine. FMCG, high-tech, energy, pharma and packaging.">
<style>
/* ==========================================================
   SUPPLY CHAIN CONTROL TOWER
   ----------------------------------------------------------
   Monochrome editorial. All type is black on light ground.
   Hierarchy comes from size, weight and space, not colour.
   Colour is reserved for two jobs only: distinguishing data
   series in a chart, and marking status, which is carried by
   a rule or a dot beside the black figure rather than by
   colouring the figure itself.
   Zero external assets. Works offline.
   ========================================================== */

:root{
  --paper:#F5F6F8;
  --panel:#FFFFFF;
  --panel2:#FAFBFC;
  --panel3:#EFF1F4;

  --ink:#111111;          /* every piece of type in the app */
  --rule:#DCDFE4;
  --rule2:#E9EBEF;
  --rule3:#F2F4F6;

  --good:#1E7A52;
  --warn:#9A6A0F;
  --bad:#B42318;
  --goodBg:#E7F2EC;
  --warnBg:#F6EEDD;
  --badBg:#F7E7E5;

  --sub:#5A5F66;          /* chart tick labels only, never body copy */
  --sub2:#7A8088;         /* chart secondary series only */
  --mono:Helvetica,"Helvetica Neue",Arial,sans-serif;
  --acc:#3B9BE8;          /* replaced per sector */
  --accSoft:#E3F2FD;
  --accInk:#1565A8;
  --accHi:#B8E0FB;
  --onAcc:#FFFFFF;
  --chromeH:132px;

  --hv:Helvetica,"Helvetica Neue",Arial,"Liberation Sans",sans-serif;

  --t-hero:clamp(2rem,1.15rem + 4.2vw,3.5rem);
  --t-h2:clamp(1.2rem,1.04rem + .74vw,1.58rem);
  --t-h3:clamp(1rem,.94rem + .3vw,1.14rem);
  --t-body:clamp(.94rem,.9rem + .18vw,1rem);
  --t-sm:clamp(.79rem,.76rem + .12vw,.845rem);

  --sp:clamp(.85rem,.6rem + .8vw,1.2rem);
  --r:8px;
  --rSm:6px;
  --shadow:0 1px 2px rgba(20,24,31,.04);
  --shadow2:0 1px 2px rgba(20,24,31,.05),0 8px 20px -10px rgba(20,24,31,.14);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--hv);background:var(--paper);color:var(--ink);
  font-size:var(--t-body);line-height:1.62;letter-spacing:-.004em;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
.num,table.dg,.val,.bignum,.kpi .v,.mx .v,.statline .sv{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2;letter-spacing:-.028em;color:var(--ink);text-align:center}
h2{font-size:var(--t-h2)}
h3{font-size:var(--t-h3);letter-spacing:-.022em}
h4{font-size:var(--t-sm)}
p{margin:0 0 .7em}
a{color:var(--ink)}
small,.eyebrow,.hint,.lede,.muted{color:var(--ink)}
.eyebrow{font-size:var(--t-sm);font-weight:500;opacity:.62}
.lede{font-size:calc(var(--t-body) * 1.02);line-height:1.68;opacity:.78}
.hint{font-size:.79rem;line-height:1.5;margin-top:.25rem;opacity:.66}
small{font-size:var(--t-sm);opacity:.66}

/* ---------- status marks: colour lives here, not in the type ---------- */
.mk{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:.06em;flex:none}
.mk.good{background:var(--good)} .mk.warn{background:var(--warn)} .mk.bad{background:var(--bad)}

/* ---------- header ---------- */
#chrome{position:sticky;top:0;z-index:60;background:var(--panel);
  box-shadow:0 1px 0 var(--rule),0 8px 20px -14px rgba(17,17,17,.4)}
header#top{background:var(--panel);border-bottom:1px solid var(--rule2);position:relative}
header#top::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--acc)}
.wrap{max-width:1340px;margin:0 auto;padding:0 var(--sp)}
.topbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.8rem 0 .62rem}
.brandmark{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1 1 auto}
.beacon{width:28px;height:28px;border-radius:50%;flex:none;position:relative;
  background:var(--accSoft);border:1.5px solid var(--acc)}
.beacon::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.beacon::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--acc);z-index:1}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes beat{50%{opacity:.4;transform:scale(.8)}}
.brandtxt{min-width:0}
.brandtxt .co{font-size:.72rem;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt .ttl{font-size:clamp(.98rem,.86rem + .5vw,1.2rem);font-weight:700;line-height:1.18;letter-spacing:-.03em}
.qmeta{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.qdots{display:flex;gap:3px}
.qdot{width:15px;height:5px;border-radius:2px;background:var(--rule)}
.qdot.done{background:var(--acc)}
.qdot.now{background:var(--accInk);box-shadow:0 0 0 2px var(--accSoft)}
.qtxt{font-size:.76rem;white-space:nowrap;opacity:.66}

button{font-family:inherit}
.btn{font-size:.82rem;font-weight:600;letter-spacing:-.012em;border-radius:8px;padding:.5rem .9rem;cursor:pointer;
  border:1px solid var(--acc);background:var(--acc);color:var(--onAcc);white-space:nowrap;position:relative;overflow:hidden;
  transition:filter .14s,transform .14s,box-shadow .14s}
.btn:hover{filter:brightness(1.06)}

.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.lite{background:var(--panel);color:var(--accInk);border-color:var(--acc)}
.btn.lite:hover{border-color:var(--ink)}
.btn.sm{padding:.32rem .6rem;font-size:.76rem}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}

/* ---------- instrument cluster ---------- */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;padding-bottom:.7rem}
.kpi{background:var(--panel);border:1px solid var(--rule);
  border-radius:var(--rSm);padding:.55rem .7rem .6rem .8rem;position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;
  animation:tileIn .42s cubic-bezier(.2,.7,.3,1) backwards}
.kpi:nth-child(1){animation-delay:.02s}.kpi:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.11s}
.kpi:nth-child(5){animation-delay:.14s}.kpi:nth-child(6){animation-delay:.17s}
.kpi:nth-child(7){animation-delay:.2s}.kpi:nth-child(8){animation-delay:.23s}
@keyframes tileIn{from{opacity:0}to{opacity:1}}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rule)}
.kpi.good::before{background:var(--good)} .kpi.warn::before{background:var(--warn)} .kpi.bad::before{background:var(--bad)}
.kpi.good,.kpi.warn,.kpi.bad{background:var(--panel)}
.kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.kpi .k{font-size:.68rem;opacity:.62;display:flex;align-items:center;gap:4px;line-height:1.3;
  flex-wrap:wrap;min-height:1.7em}
.kpi .v{font-size:clamp(1.05rem,.72rem + 1.1vw,1.4rem);font-weight:700;line-height:1.22;letter-spacing:-.035em;
  margin-top:1px;color:var(--ink)}
.kpi .s{font-size:.68rem;opacity:.58;line-height:1.32;margin-top:2px;min-height:1.7em}
.kpi .arrow{font-size:.6rem;margin-left:4px;opacity:.72;white-space:nowrap}
.kpi .arrow .mk{width:5px;height:5px;margin-right:2px}

/* direction markers */
.dir{font-size:.62rem;font-weight:700;padding:0 4px;border-radius:3px;line-height:1.5;flex:none;
  background:var(--panel3);color:var(--ink);opacity:.8}
.dirL{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:5px;display:inline-block;white-space:nowrap;
  background:var(--panel3);color:var(--ink);border:1px solid var(--rule2)}
table.dg th .dir{background:rgba(17,17,17,.07)}

.alertbar{border-radius:var(--rSm);padding:.6rem .8rem;font-size:var(--t-sm);margin-bottom:.7rem;
  display:flex;gap:.6rem;align-items:flex-start;flex-wrap:wrap;line-height:1.52;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--rule)}
.alertbar.live{border-left-color:var(--bad);background:var(--badBg)}
.alertbar.mit{border-left-color:var(--good);background:var(--goodBg)}
.tagpill{font-size:.68rem;padding:2px 8px;border-radius:4px;font-weight:700;flex:none;margin-top:1px;
  background:var(--panel);border:1px solid var(--rule);color:var(--ink)}

/* ---------- flow track ---------- */
nav#rail{background:var(--panel);border-bottom:1px solid var(--rule);position:relative}
.rails{display:flex;overflow-x:auto;padding:.5rem 0 .45rem;gap:2px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.rails::-webkit-scrollbar{display:none}
.step{background:none;border:none;cursor:pointer;padding:.4rem .35rem .3rem;display:flex;flex-direction:column;
  align-items:center;gap:6px;min-width:88px;flex:1 0 auto;position:relative;color:var(--ink);scroll-snap-align:center;
  border-radius:10px;transition:background .16s ease}
.step::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:2px;border-radius:2px;
  background:var(--acc);transform:scaleX(0);transition:transform .2s ease}
.step:hover{background:var(--accSoft)}
.step:hover::after{transform:scaleX(1)}
.step.on::after{transform:scaleX(1)}
.step .bead{width:22px;height:22px;border-radius:50%;background:var(--panel);border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:.69rem;font-weight:700;color:var(--ink);
  position:relative;z-index:2;transition:all .18s;opacity:.7}
.step .nm{font-size:.71rem;font-weight:500;line-height:1.25;text-align:center;letter-spacing:-.012em;
  white-space:nowrap;opacity:.6;transition:opacity .18s}
.step::before{content:"";position:absolute;top:1.05rem;left:-50%;width:100%;height:1.5px;background:var(--rule2);z-index:1}
.step:first-child::before{display:none}
.step:hover .bead,.step:hover .nm{opacity:1}
.step:hover .bead{border-color:var(--ink)}
.step.done .bead{border-color:var(--ink);opacity:.85}
.step.done::before{background:var(--rule)}
.step.on .bead{background:var(--acc);border-color:var(--acc);color:var(--onAcc);opacity:1;transform:scale(1.14)}
.step.on .nm{opacity:1;font-weight:700}

/* ---------- layout ---------- */
main{max-width:1340px;margin:0 auto;padding:calc(var(--sp) * 1.4) var(--sp) 4rem;
  display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp);align-items:start}
#view{min-width:0;display:flex;flex-direction:column;gap:var(--sp)}
#side{position:sticky;top:calc(var(--chromeH) + .8rem);display:flex;flex-direction:column;gap:.85rem;
  max-height:calc(100vh - var(--chromeH) - 2rem);overflow-y:auto;scrollbar-width:thin}
#side::-webkit-scrollbar{width:5px}
#side::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:clamp(1.2rem,.9rem + 1.1vw,1.85rem);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--sp)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:1.1rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.cardhead{display:flex;justify-content:center;align-items:baseline;gap:.6rem;margin-bottom:1.15rem;flex-wrap:wrap;
  padding-bottom:.6rem;border-bottom:1px solid var(--rule2);text-align:center}

.chapter{text-align:center}
.chapter{border:1px solid var(--rule);border-radius:var(--r);padding:clamp(1rem,.7rem + 1.1vw,1.5rem);
  box-shadow:var(--shadow);background:var(--panel);border-top:3px solid var(--acc)}
.chapter .cn{font-size:.74rem;font-weight:700;opacity:.6}
.chapter h2{margin:.15rem 0 .35rem}
.chapter{text-align:center}
.chapter .cd{font-size:calc(var(--t-body)*1.02);line-height:1.66;max-width:66ch;margin:0 auto;opacity:.78}
.chapter .chain{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.9rem;font-size:.76rem;align-items:center;justify-content:center}
.chapter .chain b{background:var(--panel3);border:1px solid var(--rule2);border-radius:16px;padding:.2rem .7rem;font-weight:600}
.chapter .chain i{font-style:normal;opacity:.45}

.pager{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:.75rem}
.pgbtn{display:flex;gap:.7rem;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--rule);
  border-radius:var(--r);padding:.85rem 1rem;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);
  transition:transform .14s,box-shadow .14s,border-color .14s}
.pgbtn:hover{box-shadow:var(--shadow2);border-color:var(--acc)}
.pgbtn .ar{width:30px;height:30px;border-radius:50%;background:var(--accSoft);color:var(--accInk);border:1px solid var(--rule2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700}
.pgbtn .lb{font-size:.72rem;font-weight:600;opacity:.6}
.pgbtn .tt{font-size:.94rem;font-weight:700;line-height:1.3;letter-spacing:-.02em;display:block}
.pgbtn .wy{font-size:.78rem;line-height:1.45;margin-top:1px;display:block;opacity:.66}
.pgbtn.nx{flex-direction:row-reverse;text-align:right}
.pgbtn.dis{opacity:.3;cursor:default;transform:none;box-shadow:none}

/* ---------- controls ---------- */
.ctl{margin-bottom:1.5rem}
.ctl:last-child{margin-bottom:0}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:.55rem}
.ctl .lab b{font-size:var(--t-sm);font-weight:600}
.ctl .val{font-size:.8rem;font-weight:700;color:var(--ink);background:var(--panel3);border:1px solid var(--rule2);
  padding:1px 6px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:baseline;gap:1px}
input[type=range]{width:100%;height:24px;accent-color:var(--acc);cursor:pointer;margin:.2rem 0 0}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin-top:.35rem}
.seg button{font-size:.79rem;font-weight:600;padding:.4rem .72rem;border-radius:7px;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink);cursor:pointer;transition:all .13s;min-height:33px}
.seg button:hover{border-color:var(--ink)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.sw{display:flex;align-items:center;gap:.65rem;cursor:pointer;padding:.55rem .7rem;border:1px solid var(--rule);
  border-radius:9px;background:var(--panel);width:100%;text-align:left;transition:border-color .13s}
.sw:hover{border-color:var(--ink)}
.sw .knob{width:34px;height:19px;border-radius:10px;background:var(--rule);position:relative;flex:none;transition:background .17s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  transition:transform .17s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on .knob{background:var(--acc)}
.sw.on .knob::after{transform:translateX(15px)}
.sw .swtxt{font-size:.83rem;font-weight:600;line-height:1.35}
.sw .swtxt small{display:block;font-weight:400;font-size:.75rem;margin-top:1px;opacity:.66}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* ---------- editable inputs ---------- */
.valin{width:4.6em;border:none;background:transparent;color:var(--ink);font-family:var(--hv);
  font-size:.8rem;font-weight:700;text-align:right;padding:1px 0;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;appearance:textfield}
.valin::-webkit-outer-spin-button,.valin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.valin:focus{outline:none;background:var(--panel);border-radius:3px;box-shadow:0 0 0 2px var(--ink)}
.vsuf{font-size:.8rem;font-weight:700}
input.ci{width:5.2em;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink);
  font-family:var(--hv);font-size:.79rem;text-align:right;padding:.2rem .3rem;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;appearance:textfield;transition:background .12s,border-color .12s}
input.ci::-webkit-outer-spin-button,input.ci::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.ci:hover{border-color:var(--rule);background:var(--panel3)}
input.ci:focus{outline:none;border-color:var(--ink);background:var(--panel);box-shadow:0 0 0 2px rgba(17,17,17,.12)}
input.ci.hi{background:var(--panel3);border-color:var(--rule2)}
input.ci.wide{width:8em}
input.ci.nmin{width:11em;text-align:left;font-size:.72rem;opacity:.7}
select.ci.sel{width:auto;min-width:3.1em;text-align:left;cursor:pointer;border:1px solid var(--rule);
  background:var(--panel);padding:.15rem .25rem;font-size:.72rem;font-weight:700;color:var(--ink);font-family:var(--hv)}
textarea.searchbox{font-family:var(--hv);line-height:1.45;white-space:pre-wrap;word-break:break-all}
label.eyebrow input{display:block}

/* ---------- data grid ---------- */
.gridwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--panel);
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.gridwrap::-webkit-scrollbar{height:7px}
.gridwrap::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
table.dg{border-collapse:collapse;width:100%;font-size:.79rem;min-width:660px;color:var(--ink)}
table.dg th{background:var(--panel3);color:var(--ink);font-weight:700;text-align:right;padding:.5rem .62rem;font-size:.72rem;
  position:sticky;top:0;white-space:nowrap;border-bottom:1.5px solid var(--ink);letter-spacing:-.01em}
table.dg th,table.dg td{text-align:right}
table.dg th:first-child,table.dg td:first-child{text-align:left;position:sticky;left:0;z-index:2}
table.dg th:first-child{z-index:3}
table.dg td:first-child{background:var(--panel);border-right:1px solid var(--rule2)}
table.dg td{padding:.55rem .7rem;text-align:right;border-bottom:1px solid var(--rule3);white-space:nowrap}
table.dg tbody tr:hover td,table.dg tbody tr:hover td:first-child{background:var(--panel3)}
table.dg tr.sel td,table.dg tr.sel td:first-child{background:var(--accSoft)!important;box-shadow:inset 3px 0 0 var(--acc)}
table.dg .code{font-weight:700}
table.dg .nm{font-size:.72rem;display:block;font-weight:400;opacity:.62}
/* status: a mark, not coloured type */
td.g{color:var(--good);font-weight:700} td.w{color:var(--warn);font-weight:700} td.b{color:var(--bad);font-weight:700}
tfoot td{background:var(--panel3);font-weight:700;border-top:2px solid var(--acc);border-bottom:none}
.chip{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:5px;background:var(--accSoft);
  color:var(--ink);font-weight:700;border:1px solid var(--rule2)}
.chip.a{background:#E6EDF7;color:#1F4E82;border-color:#CEDCEC}
.chip.b{background:#E7EAF3;color:#3A4778;border-color:#D2D8E7}
.chip.c{background:#EDF0F3;color:#41505F;border-color:#DCE1E8}
.chip.x{background:#E4EFE8;color:#2A5F45;border-color:#CBDFD3}
.chip.y{background:#F4EDDD;color:#7A5510;border-color:#E5D9BC}
.chip.z{background:#F5E8E5;color:#8A3320;border-color:#E6D0C9}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:var(--ink)}
.chart .axis{stroke:#94A3B8;stroke-width:1.2}
.chart .gridln{stroke:var(--rule2);stroke-width:1}
.chart .lbl{font-size:10px}
.chart .val{fill:var(--ink);font-weight:700}
.legend{display:flex;gap:.85rem;flex-wrap:wrap;font-size:.75rem;margin-top:.5rem;color:var(--ink)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

.viz{background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:1.1rem 1.1rem .9rem;margin:1.1rem 0}
.viz .cap{font-size:.79rem;line-height:1.55;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--rule2);opacity:.78}
.viz .cap b{opacity:1;font-weight:700}

/* ---------- teaching ---------- */
.learn{border:1px solid var(--rule);border-radius:10px;margin-bottom:.6rem;overflow:hidden;background:var(--panel)}
.learn>summary{padding:.7rem .9rem;cursor:pointer;list-style:none;text-align:left;display:flex;justify-content:space-between;align-items:center;
  gap:.7rem;background:var(--panel2);font-size:var(--t-sm);font-weight:600;transition:background .15s}
.learn>summary::-webkit-details-marker{display:none}
.learn>summary:hover{background:var(--panel3)}
.learn>summary::after{content:"Explain this";font-size:.72rem;background:var(--panel3);border:1px solid var(--rule2);
  padding:2px 10px;border-radius:14px;flex:none;font-weight:600}
.learn[open]>summary{background:var(--acc);color:var(--onAcc)}
.learn[open]>summary::after{content:"Close";background:rgba(255,255,255,.15);border-color:transparent;color:#FFFFFF}
.learn .body{padding:1.2rem 1.25rem;font-size:var(--t-body);line-height:1.72;border-top:1px solid var(--rule2)}
.learn .body h4{margin-top:1rem}
.learn .body p:last-child{margin-bottom:0}
.learn .body ul{margin:0 0 .7rem;padding-left:1.2rem}
.learn .body li{margin-bottom:.35rem}

.fx{background:var(--panel2);border:1px solid var(--rule);border-left:3px solid var(--acc);border-radius:8px;
  padding:.85rem 1.05rem;margin:1rem 0}
.fx .f{font-size:calc(var(--t-body)*1.03);font-weight:700;overflow-x:auto;white-space:nowrap;padding-bottom:2px;letter-spacing:-.01em}
.fx .n{font-size:.81rem;line-height:1.56;margin-top:.25rem;opacity:.78}
.fx .n b{opacity:1}

.note{border:1px solid var(--rule);border-left:3px solid var(--rule);padding:.8rem 1rem;border-radius:0 8px 8px 0;
  font-size:.85rem;line-height:1.62;margin:.9rem 0;background:var(--panel2)}
.note.good{border-left-color:var(--good);background:var(--goodBg)}
.note.warn{border-left-color:var(--warn);background:var(--warnBg)}
.note.bad{border-left-color:var(--bad);background:var(--badBg)}
.note .h{font-size:.74rem;display:block;margin-bottom:1px;font-weight:700}

.minor{background:var(--panel2);border:1px solid var(--rule);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;
  padding:.8rem 1rem;font-size:.85rem;line-height:1.64;margin:1rem 0}
.minor .h{font-size:.74rem;font-weight:700;display:block;margin-bottom:2px;opacity:.6}

.mexp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:.9rem}
.mx{border:1px solid var(--rule);border-radius:10px;padding:.95rem 1rem;background:var(--panel)}
.mx .t{font-size:.83rem;font-weight:700;text-align:left;display:flex;justify-content:space-between;gap:.5rem;align-items:center;flex-wrap:wrap}
.mx .v{font-size:1.3rem;font-weight:700;margin:.15rem 0 .1rem;letter-spacing:-.03em;color:var(--ink);
  display:flex;align-items:center}
.mx .v.g{color:var(--good)} .mx .v.w{color:var(--warn)} .mx .v.b{color:var(--bad)}
.mx .d{font-size:.78rem;line-height:1.5;opacity:.72}
.scale{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bad),var(--warn) 46%,var(--good));
  position:relative;margin-top:.55rem;opacity:.62}
.scale.rev{background:linear-gradient(90deg,var(--good),var(--warn) 54%,var(--bad))}
.scale i{position:absolute;top:-3.5px;width:3px;height:13px;background:var(--acc);border-radius:2px;
  transform:translateX(-1.5px);box-shadow:0 0 0 2px var(--panel)}
.sl{display:flex;justify-content:space-between;font-size:.68rem;margin-top:.2rem;opacity:.55}

/* ---------- side rail ---------- */
.ledger{max-height:min(46vh,320px);overflow-y:auto;scrollbar-width:thin;margin:0 -3px;padding:0 3px}
.lgi{border:1px solid var(--rule2);border-left:3px solid var(--acc);padding:.65rem .85rem;margin-bottom:.55rem;
  background:var(--panel2);border-radius:0 8px 8px 0;font-size:.79rem;line-height:1.5}
.lgi.up{border-left-color:var(--good)} .lgi.down{border-left-color:var(--bad)} .lgi.mix{border-left-color:var(--warn)}
.lgi .t{font-weight:700;display:block}
.lgi .d{font-size:.75rem;margin-top:3px;display:block;opacity:.72}
.lgi .d s{text-decoration:none;opacity:.55}
.lgi .why{margin-top:3px;display:block;font-size:.75rem;opacity:.66}
.delta{font-weight:700}
.delta.p{color:var(--good)} .delta.n{color:var(--bad)}
.searchbox{width:100%;padding:.5rem .7rem;border:1px solid var(--rule);border-radius:8px;font-family:var(--hv);
  font-size:.83rem;background:var(--panel);color:var(--ink)}
.glosslist{max-height:min(38vh,260px);overflow-y:auto;scrollbar-width:thin;margin-top:.55rem}
.gl{border-bottom:1px solid var(--rule3);padding:.5rem 0}
.gl:last-child{border:none}
.gl .t{font-size:.83rem;font-weight:700}
.gl .d{font-size:.79rem;line-height:1.55;margin-top:1px;opacity:.75}
.gl .cat{font-size:.68rem;font-weight:600;opacity:.5}

/* ---------- landing ---------- */
#launch{min-height:100dvh;color:var(--ink);padding:clamp(2rem,5vw,4rem) var(--sp) 4rem;background:var(--paper)}
.lwrap{max-width:1160px;margin:0 auto}
.lhead{font-size:var(--t-hero);font-weight:700;line-height:1.03;letter-spacing:-.045em;margin:.6rem 0 0}
.lhead em{font-style:normal;color:var(--accInk)}
.lsub{font-size:clamp(.95rem,.88rem + .35vw,1.08rem);max-width:64ch;line-height:1.66;margin-top:.95rem;opacity:.78}
.ltabs{display:none}
.ltabs button{font-family:var(--hv);font-size:.88rem;font-weight:600;padding:.6rem 1.05rem;border:none;
  background:transparent;color:var(--ink);cursor:pointer;opacity:.55;border-bottom:2.5px solid transparent;
  margin-bottom:-1px;transition:opacity .15s}
.ltabs button:hover{opacity:.85}
.ltabs button.on{opacity:1;border-bottom-color:var(--acc)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.8rem;margin-top:1.6rem}
.pick{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:1.05rem;cursor:pointer;
  text-align:left;color:var(--ink);position:relative;overflow:hidden;font-family:var(--hv);box-shadow:var(--shadow);
  transition:transform .16s,border-color .16s,box-shadow .16s}
.pick{animation:rise .45s cubic-bezier(.2,.7,.3,1) backwards}
.pick:nth-child(1){animation-delay:.05s}.pick:nth-child(2){animation-delay:.1s}
.pick:nth-child(3){animation-delay:.15s}.pick:nth-child(4){animation-delay:.2s}
.pick:nth-child(5){animation-delay:.25s}
.pick .bar{transition:height .2s ease}
.pick:hover .bar{height:6px}
.pick:hover{transform:translateY(-2px);border-color:var(--pc);box-shadow:var(--shadow2)}
.pick .bar{height:3px;background:var(--pc);margin:-1.05rem -1.05rem .85rem}
.pick .pt{font-size:.74rem;font-weight:700;opacity:.6}
.pick .pn{font-size:1.04rem;font-weight:700;margin:.15rem 0 .1rem;line-height:1.22;letter-spacing:-.028em}
.pick .pco{font-size:.76rem;opacity:.62}
.pick .pd{font-size:.83rem;line-height:1.58;margin-top:.6rem;opacity:.78}
.pick .pf{margin-top:.7rem;padding-top:.6rem;border-top:1px solid var(--rule2);font-size:.72rem;line-height:1.6;opacity:.58}
.lfoot{margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--rule);font-size:.85rem;line-height:1.7;max-width:80ch;opacity:.75}
.lfoot b{opacity:1;font-weight:700}

.learnwrap{background:var(--panel2);margin:1.4rem calc(var(--sp) * -1) -4rem;
  padding:clamp(1.2rem,3vw,2.2rem) 0 3.5rem;border-top:1px solid var(--rule)}
.learnwrap section{margin-bottom:var(--sp);display:block}
.lnav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:.7rem;margin-bottom:.4rem;
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel2) 74%,transparent)}
.lnav::-webkit-scrollbar{display:none}
.lnav a{flex:0 0 auto;font-size:.78rem;font-weight:600;text-decoration:none;padding:.32rem .68rem;
  border:1px solid var(--rule);border-radius:16px;background:var(--panel);white-space:nowrap;transition:all .14s;opacity:.78}
.lnav a:hover{border-color:var(--acc);opacity:1;background:var(--accSoft);color:var(--accInk);transform:translateY(-1px)}
.lnav a{transition:all .16s ease}
.seg-mini{font-size:.72rem;font-weight:600;padding:.22rem .6rem;border-radius:14px;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink);cursor:pointer;font-family:var(--hv);transition:all .13s;opacity:.75}
.seg-mini:hover{border-color:var(--ink);opacity:1}
.seg-mini.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc);opacity:1}
.learnwrap [id^="ls-"]{scroll-margin-top:4.5rem}


/* ---------- landing: the two-option splash ---------- */
#launch{text-align:center}
.lwrap.home{padding-top:clamp(1.5rem,7vh,4.5rem)}
.hbrand{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:600;opacity:.62;
  border:1px solid var(--rule);border-radius:20px;padding:.3rem .85rem;background:var(--panel)}
.hbeacon{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.lhead{font-size:var(--t-hero);font-weight:700;line-height:1.03;letter-spacing:-.045em;margin:1.1rem 0 0}
.lhead em{font-style:normal;border-bottom:5px solid var(--ink);padding-bottom:2px}
.lsub{font-size:clamp(.95rem,.88rem + .35vw,1.08rem);max-width:60ch;line-height:1.66;margin:1rem auto 0;opacity:.78}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));
  gap:1rem;margin:2.4rem auto 0;max-width:1080px}
.homecard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:2.2rem 1.6rem 1.8rem;
  cursor:pointer;font-family:var(--hv);color:var(--ink);box-shadow:var(--shadow);
  transition:transform .17s,border-color .17s,box-shadow .17s}
.homecard{position:relative;overflow:hidden;animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards}
.homecard:nth-child(1){animation-delay:.08s}.homecard:nth-child(2){animation-delay:.16s}.homecard:nth-child(3){animation-delay:.24s}
.homecard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc);
  transform:scaleX(0);transform-origin:left;transition:transform .32s ease}
.homecard:hover::before{transform:scaleX(1)}
.homecard:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:var(--shadow2)}
.hnum{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--accInk);opacity:.9}
.htt{font-size:clamp(1.15rem,1rem + .6vw,1.45rem);font-weight:700;letter-spacing:-.03em;line-height:1.2}
.hsub{font-size:.86rem;font-weight:600;opacity:.7;max-width:30ch}
.hbody{font-size:.83rem;line-height:1.62;opacity:.66;max-width:40ch;margin-top:.5rem;
  padding-top:.75rem;border-top:1px solid var(--rule2)}
.hgo{margin-top:1rem;font-size:.85rem;font-weight:700;border:1px solid var(--acc);border-radius:8px;
  padding:.5rem 1.3rem;color:var(--accInk);transition:background .18s,color .18s}
.homecard:hover .hgo{background:var(--acc);color:var(--onAcc)}
.hfoot{margin-top:2.2rem;font-size:.8rem;opacity:.55}
.backlink{background:none;border:none;font-family:var(--hv);font-size:.83rem;font-weight:600;color:var(--ink);
  cursor:pointer;opacity:.6;padding:.3rem 0;transition:opacity .14s}
.backlink:hover{opacity:1}
.lhead2{font-size:clamp(1.5rem,1.15rem + 1.7vw,2.3rem);font-weight:700;letter-spacing:-.035em;margin:.7rem 0 0}
.lsub2{font-size:clamp(.9rem,.86rem + .25vw,1rem);max-width:62ch;line-height:1.62;margin:.6rem auto 0;opacity:.75}
.pick{text-align:left}
.pick .pn,.pick .pt,.pick .pco{text-align:left}
.lfoot{margin:2rem auto 0;text-align:center}
.learnwrap section .card{text-align:left}

/* ---------- highlights and accent colour ---------- */
.hl{background:linear-gradient(180deg,transparent 56%,var(--accHi) 56%,var(--accHi) 93%,transparent 93%);padding:0 .1em;font-weight:600}
.cardhead{border-bottom-width:2px;border-bottom-color:var(--accSoft)}
.cardhead{position:relative;padding-bottom:.8rem}
.cardhead::after{content:"";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
  width:38px;height:2px;background:var(--acc);border-radius:2px}
.chapter{border-top:2px solid var(--acc);background:var(--panel)}
.chapter .cn{color:var(--accInk);opacity:1}
.chapter .chain b{background:var(--panel);border-color:color-mix(in srgb,var(--acc) 30%,var(--rule2))}
.fx{border-left-color:var(--acc);background:var(--panel2)}
.minor{border-left-color:var(--warn);background:var(--panel2)}
.viz{background:var(--panel2)}
.learn>summary::after{background:var(--accSoft);color:var(--accInk);border-color:color-mix(in srgb,var(--acc) 28%,transparent)}
.learn[open]>summary{background:var(--acc);color:var(--onAcc)}
.learn[open]>summary::after{background:rgba(255,255,255,.22);color:var(--onAcc)}
.learn[open]>summary:hover{background:var(--acc);filter:brightness(1.06)}
.dirL{background:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--accInk)}
.dir{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--accInk)}
.pgbtn:hover{border-color:var(--acc)}
.pgbtn .ar{transition:background .18s,color .18s,border-color .18s}
.pgbtn:hover .ar{background:var(--acc);color:var(--onAcc);border-color:var(--acc)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.sw.on .knob{background:var(--acc)}
.step.on .bead{background:var(--acc);border-color:var(--acc);color:var(--onAcc);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent)}
.step.done .bead{border-color:var(--acc);color:var(--accInk);background:var(--accSoft);opacity:1}
.step.done::before{background:color-mix(in srgb,var(--acc) 52%,var(--rule2))}
table.dg th{padding:.62rem .7rem;background:var(--panel3);border-bottom-color:var(--acc);border-bottom-width:2px}
table.dg tbody tr:hover td,table.dg tbody tr:hover td:first-child{background:var(--accSoft)}
table.dg tr.sel td,table.dg tr.sel td:first-child{background:var(--accSoft)!important;box-shadow:inset 3px 0 0 var(--acc)}
input.ci:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.valin:focus{box-shadow:0 0 0 2px var(--acc)}
.ctl .val{background:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--accInk)}
input[type=range]{accent-color:var(--acc)}
:focus-visible{outline-color:var(--acc)}
.tagpill{background:var(--acc);color:var(--onAcc);border-color:var(--acc)}
.alertbar.live .tagpill{background:var(--bad);color:#fff;border-color:var(--bad)}
.alertbar.mit .tagpill{background:var(--good);color:#fff;border-color:var(--good)}
.mk.acc{background:var(--acc)}

/* ---------- motion ---------- */
#view>*{animation:rise .3s cubic-bezier(.25,.6,.35,1) backwards}
#view>*:nth-child(1){animation-delay:.02s} #view>*:nth-child(2){animation-delay:.07s}
#view>*:nth-child(3){animation-delay:.12s} #view>*:nth-child(4){animation-delay:.17s}
#view>*:nth-child(n+5){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card,.pgbtn,.pick,.homecard,.mx{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
@media(hover:hover){
  .card:hover{border-color:color-mix(in srgb,var(--acc) 30%,var(--rule))}
  .mx:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--acc) 32%,var(--rule))}
  .seg button:hover{border-color:var(--acc);color:var(--accInk)}
  .lnav a:hover{border-color:var(--acc);color:var(--accInk)}
  .sw:hover{border-color:var(--acc)}
}
.learn[open] .body{animation:unfold .32s ease}
@keyframes unfold{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.lgi{animation:slideIn .32s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
.viz svg,[data-chart] svg{animation:fadeChart .55s ease backwards;animation-delay:.08s}
@keyframes fadeChart{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.step .bead,.step .nm{transition:all .2s ease}

/* ---------- containment: nothing overflows, nothing overlaps ---------- */
main,#view,#side,.card,.grid2,.grid3,.mexp,.row,.pager,.homegrid,.pickgrid{min-width:0}
#view>*,.grid2>*,.grid3>*,.mexp>*,.pickgrid>*,.homegrid>*{min-width:0;max-width:100%}
.card,.chapter,.viz,.note,.fx,.minor,.learn,.lgi,.gl{overflow-wrap:anywhere}
.kpi .v,.kpi .k,.kpi .s{min-width:0;max-width:100%}
.brandtxt{min-width:0;flex:1 1 auto}
.ctl .lab,.ctl .lab b,.sw .swtxt,.mx .t span:first-child{min-width:0;overflow-wrap:anywhere}
.seg,.legend,.gridwrap{max-width:100%}
.seg button{max-width:100%;overflow-wrap:anywhere}
.viz svg,[data-chart] svg,.chart,svg{max-width:100%;height:auto}


/* ---- per-concept references ---- */
.refs{margin-top:1.6rem;padding-top:1.1rem;border-top:2px solid var(--accSoft)}
.refh{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.55;margin-bottom:.6rem;text-align:center}
.reflist{margin:0;padding-left:1.4rem;font-size:.8rem;line-height:1.55}
.reflist li{margin-bottom:.5rem;padding-left:.2rem}
.reflist li::marker{color:var(--acc);font-weight:700}
.reflist .ra{font-weight:700}
.reflist .rt{font-style:italic}
.reflist .rp{display:block;opacity:.6;font-size:.75rem}
.reflist.wide li{margin-bottom:.65rem}
.refn{font-size:.75rem;opacity:.6;line-height:1.55;margin-top:.7rem;padding-top:.6rem;border-top:1px solid var(--rule3)}


/* ---------- illustrations ---------- */
.illu{display:block;width:100%;height:auto;max-width:150px;overflow:visible}
.chapwrap{display:flex;align-items:center;gap:clamp(.9rem,2.4vw,1.8rem);text-align:left}
.chapart{flex:0 0 auto;width:clamp(78px,11vw,120px);
  background:var(--panel2);border:1px solid var(--rule2);border-radius:8px;padding:.55rem;
  box-shadow:var(--shadow);animation:floatIn .6s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes floatIn{from{opacity:0}to{opacity:1}}
.chaptxt{min-width:0;flex:1 1 auto}
.chaptxt h2,.chaptxt .cn{text-align:left}
.chaptxt .cd{margin:0;max-width:64ch}
.chaptxt .chain{justify-content:flex-start}
.secart{width:clamp(88px,14vw,132px);margin:0 auto 1.4rem;background:var(--panel2);
  border:1px solid var(--rule2);border-radius:8px;padding:.6rem;box-shadow:none}
.secart .illu{max-width:none}
@media(max-width:640px){
  .chapwrap{flex-direction:column;text-align:center;gap:.8rem}
  .chaptxt h2,.chaptxt .cn{text-align:center}
  .chaptxt .cd{margin:0 auto}
  .chaptxt .chain{justify-content:center}
  .chapart{width:104px}
}


/* ---- illustration inside each option card ---- */
.cardart{display:block;width:clamp(88px,22vw,116px);margin:0 auto .2rem;background:var(--accSoft);
  border:1px solid color-mix(in srgb,var(--acc) 20%,var(--rule));border-radius:16px;padding:.55rem}
.cardart .illu{max-width:none}
.homecard:hover .cardart{background:color-mix(in srgb,var(--acc) 16%,#FFFFFF)}
.cardart{transition:background .18s}

/* ---------- misc ---------- */
.bignum{font-size:clamp(1.4rem,1.1rem + 1vw,1.8rem);font-weight:700;line-height:1.12;letter-spacing:-.032em;color:var(--ink)}
.bignum.g{color:var(--good)} .bignum.w{color:var(--warn)} .bignum.b{color:var(--bad)}
.statline{display:flex;justify-content:space-between;gap:.8rem;font-size:.83rem;padding:.45rem 0;border-bottom:1px solid var(--rule3)}
.statline:last-child{border:none}
.statline .sv{font-weight:700;white-space:nowrap;color:var(--ink)}
.statline .sv.g{color:var(--good)} .statline .sv.w{color:var(--warn)} .statline .sv.b{color:var(--bad)}

@media(min-width:1500px){ .wrap,main{max-width:1460px} main{grid-template-columns:minmax(0,1fr) 352px} }
@media(max-width:1080px){
  main{grid-template-columns:minmax(0,1fr)}
  #side{position:static;max-height:none;order:2;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));align-items:start}
  #view{order:1}
  .ledger,.glosslist{max-height:300px}
  .board{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:680px){
  .board{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
    padding-bottom:.7rem;margin:0 calc(var(--sp) * -1);padding-left:var(--sp);padding-right:var(--sp)}
  .board::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 43%;min-width:142px;scroll-snap-align:start}
  .kpi .v{font-size:1.2rem}
  .topbar{padding:.6rem 0 .45rem;gap:.5rem}
  .qmeta{width:100%;justify-content:space-between}
  .step{min-width:66px}
  .step .nm{font-size:.66rem}
  .learn>summary::after{content:"Explain"}
  .ltabs button{flex:1 1 auto;text-align:center;font-size:.82rem;padding:.55rem .6rem}
  .learnwrap{margin-left:calc(var(--sp) * -1);margin-right:calc(var(--sp) * -1)}
  input.ci{width:4.4em;font-size:.75rem}
  .valin{width:4em}
  main{padding-bottom:2rem}

/* ==========================================================
   3 · THE KNOWLEDGE BASE
   Glossary, formula sheet, Incoterms, and the things nobody
   writes down but every planner learns in year two.
   ========================================================== */

var GLOSSARY = [
/* --- demand --- */
["Bullwhip effect","DEMAND","Small ripples in shop-floor demand become tidal waves upstream. A 5% blip at retail becomes 20% at the distributor and 60% at the factory. Caused by order batching, price promotions, rationing games and, most of all, everyone forecasting off the order stream above them instead of off real end demand."],
["MAPE","DEMAND","Mean Absolute Percentage Error. Average of |actual − forecast| ÷ actual. Easy to explain, but it explodes toward infinity on low-volume items and punishes under-forecasting more than over-forecasting. Never use it alone on intermittent demand."],
["WMAPE","DEMAND","Weighted MAPE: sum of absolute errors ÷ sum of actuals. Fixes MAPE's small-number problem by weighting by volume. This is what most real planning systems actually report."],
["Bias (forecast)","DEMAND","The average signed error. MAPE tells you how wrong you are; bias tells you which direction you are consistently wrong in. Persistent positive bias means you are systematically over-forecasting and building inventory you will write off."],
["Tracking signal","DEMAND","Running sum of forecast errors ÷ mean absolute deviation. If it drifts beyond about ±4, your forecast model has lost touch with reality and needs re-fitting. It is the smoke alarm on your forecast."],
["Exponential smoothing","DEMAND","Forecast = α × last actual + (1−α) × last forecast. A high α (0.5+) reacts fast and chases noise; a low α (0.1) is stable but slow to spot a real trend. Choosing α is choosing how much you believe the most recent week."],
["Holt's method","DEMAND","Exponential smoothing with a second equation for trend. Use when demand is genuinely growing or declining rather than just wobbling around a level."],
["Holt-Winters","DEMAND","Adds a third equation for seasonality. The workhorse for anything with an annual rhythm, ice cream, flu vaccine, mince pies."],
["Croston's method","DEMAND","Built for intermittent demand: spare parts, service items, anything with many zero periods and occasional spikes. It forecasts the size of a demand event and the interval between events separately. Applying normal smoothing to a spare part gives you a nonsense answer like 0.3 units a week."],
["Demand sensing","DEMAND","Using short-term downstream signals: POS scans, weather, web traffic, to adjust the near-horizon forecast. Improves weeks 1-4; does nothing for the 40-week silicon order."],
["Unconstrained forecast","DEMAND","What the market would buy if you could supply it all. Vital to record separately from the constrained plan, otherwise you lose all memory of the demand you turned away and forecast your own shortages forever."],
["Phantom demand","DEMAND","Orders that exist only because customers fear shortage, double ordering across suppliers, or padding to secure allocation. It evaporates the moment supply recovers, usually leaving you with a warehouse full of it."],
["Cannibalisation","DEMAND","New product takes volume from your own existing product rather than the competitor's. Forecast the pair, not the launch."],
["Halo effect","DEMAND","A promotion on one item lifting sales of a related item. Promote coffee, sell more biscuits."],

/* --- inventory --- */
["Safety stock","INVENTORY","Inventory held to absorb variability, not to meet expected demand. Its size is driven by the variability of demand AND of lead time, and by how sure you want to be. It is the price of uncertainty, paid in cash."],
["Cycle stock","INVENTORY","The inventory that exists purely because you order in batches rather than one unit at a time. Averages half the order quantity. Cut it by ordering more often, if your ordering and setup costs allow."],
["Pipeline stock","INVENTORY","Stock in transit that you own but cannot touch. On a 34-day ocean lane, pipeline stock alone can exceed everything in your warehouse. It appears on your balance sheet the moment Incoterms transfer risk."],
["EOQ","INVENTORY","Economic Order Quantity: the batch size where ordering cost and holding cost are equal, which is where their sum is minimised. Its great gift is that the cost curve is very flat near the optimum: being 30% off EOQ costs you only about 4% in total cost. Precision here is not worth agonising over."],
["Reorder point (ROP)","INVENTORY","Demand during lead time plus safety stock. When on-hand plus on-order minus backorders drops below it, you place an order. Note it is calculated on inventory POSITION, not on-hand, forgetting the on-order part is the single most common cause of double ordering."],
["Cycle service level","INVENTORY","The probability of NOT stocking out during a replenishment cycle. A 95% CSL means one cycle in twenty has a shortage. It says nothing about how big that shortage is."],
["Fill rate","INVENTORY","The fraction of demand met from stock. Different from cycle service level and usually higher. A 95% CSL might deliver a 99.3% fill rate, because most stockouts are small and brief. Customers experience fill rate; textbooks compute CSL."],
["Z-score / service factor","INVENTORY","The number of standard deviations of buffer you carry. 90% → 1.28, 95% → 1.65, 98% → 2.05, 99% → 2.33, 99.9% → 3.09. The relationship is brutally non-linear: the jump from 95% to 99.9% nearly doubles your safety stock for 4.9 percentage points of service."],
["Square-root law","INVENTORY","Total safety stock across N warehouses ≈ safety stock of one warehouse × √N. Consolidating from 9 depots to 1 cuts safety stock by two-thirds. This is the entire mathematical case for centralisation, before you add back the transport cost."],
["Risk pooling","INVENTORY","Aggregating variability so highs offset lows. Works across locations, products or time. The square-root law is risk pooling with the numbers filled in."],
["Postponement","INVENTORY","Hold product in generic form and finish it late, paint, label, localise, kit, after real demand is known. Turns many uncertain SKU forecasts into one much more accurate aggregate forecast."],
["ABC analysis","INVENTORY","Pareto by value: roughly 20% of items make 80% of value (A), the next 30% make 15% (B), and the last 50% make 5% (C). It tells you where to spend management attention."],
["XYZ analysis","INVENTORY","Pareto by predictability. X = steady and forecastable, Y = variable but patterned, Z = erratic. Cross it with ABC and you get nine boxes that each deserve a different policy. AX items get tight lean control; CZ items get a generous buffer and no meetings."],
["Inventory turns","INVENTORY","COGS ÷ average inventory value. How many times a year you sell through your stock. Grocery runs 20-40; heavy industrial 2-4. Comparing turns across sectors is meaningless; comparing them across your own quarters is everything."],
["DIO","INVENTORY","Days Inventory Outstanding = 365 ÷ turns. The same fact as turns, expressed in days, which is how everyone actually talks about it."],
["Consignment stock","INVENTORY","Supplier owns the stock until you consume it. Improves your working capital and shifts the risk upstream, at a price built into the unit cost, always."],
["VMI","INVENTORY","Vendor Managed Inventory: your supplier sees your consumption and replenishes without you ordering. Kills a whole layer of bullwhip because there is one demand signal instead of two order streams."],
["Dead stock / slob","INVENTORY","Slow-moving and obsolete stock. The write-down is painful, but the real cost is the racking, the counting and the management attention it consumes for years before someone finally signs it off."],
["Min-max policy","INVENTORY","Order up to Max when you fall below Min. Simple, robust, and everywhere in real ERP systems, though slightly less cost-efficient than a properly tuned (s,Q) policy."],
["Base-stock / order-up-to","INVENTORY","Order every period back up to a target level. Best when reviewing frequently and ordering is cheap."],

/* --- converting --- */
["Make-ready waste","MAKE","The substrate consumed between the last good unit of one job and the first good unit of the next, threading the web, mounting plates, bringing colour to standard, setting register. On a wide-web press it can be hundreds of metres, and it makes run length a direct material cost rather than only a capacity question."],
["Converting","MAKE","Turning a raw web or resin into finished packaging: printing, laminating, die-cutting, moulding, slitting. The margin lives entirely in how little material and time the conversion wastes."],
["Substrate","SOURCE","The base material a converter buys: containerboard, film, laminate, resin, foil. Typically 60-70% of total cost, traded on an index, and therefore largely outside the converter's control."],
["Artwork obsolescence","INVENTORY","Printed stock made worthless by a customer changing their design. Unique to printed packaging: the goods are physically perfect and have exactly one possible buyer who no longer wants them. The defence is short finished-goods cover and a contract clause on who owns obsolete stock."],
["EPR levy","TRADE","Extended Producer Responsibility: a charge per tonne of packaging placed on the market, usually modulated so that recycled or recyclable material pays less. It turns material choice into a priced financial decision rather than a sustainability preference."],
["Minimum run length","MAKE","The order size below which make-ready waste and setup cannot be recovered. A commercial decision dressed as a technical constraint, below it, either price the job properly or decline it."],
["Trim waste","MAKE","Material lost because the job width does not divide neatly into the web width. Ganging several jobs across one web is how good planners recover it, and it is invisible on any standard cost report."],
["Mono-material","MAKE","Packaging built from a single polymer family so it can actually be recycled, replacing multi-layer laminates that cannot. Usually costs performance, barrier, seal strength, print quality, which is why it is a supply chain project and not a purchasing one."],

["Newsvendor model","INVENTORY","The right order quantity when you get exactly one shot: a Christmas range, a flu vaccine batch, a fashion season. Because being short and being long do not cost the same, the answer is a percentile of demand rather than the average. When running out hurts more than overstocking, order more than you expect to sell, and accept leftovers most years."],
["Critical ratio","INVENTORY","Cu divided by (Cu + Co), where Cu is the cost of being one unit short and Co the cost of one unit too many. It answers: what fraction of the total pain comes from running out? Order up to that percentile of the demand distribution. Below 0.5 the correct answer is to order less than the average, which is why bakeries sell out."],
["Value density","DELIVER","Value per kilogram. It is the single number that decides whether air freight is genuinely cheaper than ocean once you count the inventory that a long transit creates. Above roughly a thousand euro per kilo, the inventory saving usually exceeds the freight premium."],
["Unit normal loss function","INVENTORY","Written G(k), the expected shortfall in standard deviations for a given safety factor. It is what converts how often you stock out into how much you fail to supply, and therefore what separates cycle service level from fill rate."],
["Coefficient of variation","DEMAND","Standard deviation divided by the mean. It expresses variability in a way that can be compared across items of wildly different size, which a raw standard deviation cannot. Under about 0.2 is steady, over 0.6 is erratic and needs a different forecasting method entirely."],
["Utilisation trap","MAKE","The belief that a busier plant is a more productive one. Queue time rises with utilisation divided by one minus utilisation, so it is nearly flat to 75% and close to vertical past 95%. A plant run at 98% has terrible lead times, looks excellent on a utilisation report, and everybody blames planning."],
["Order penetration point","DATA","Another name for the decoupling point: the place in the chain where a real customer order first touches the product. Everything upstream of it is made on prediction, everything downstream on fact."],

/* --- source --- */
["TCO","SOURCE","Total Cost of Ownership: unit price plus freight, duty, inventory carrying, quality failure, tooling, switching and risk cost. The cheapest quote regularly turns out to be the most expensive supplier once you count the 34 days of pipeline stock and the 3% defect rate."],
["Kraljic matrix","SOURCE","Plots every purchase on supply risk versus profit impact. Four boxes: Leverage (compete it hard), Strategic (partner deeply), Bottleneck (secure supply, price is secondary), Routine (automate and stop thinking about it). Most organisations negotiate everything like it is Leverage."],
["Dual sourcing","SOURCE","Two qualified suppliers for the same item. Costs 1-4% in lost volume leverage and qualification effort, and pays out entirely on the day one of them fails. It is insurance, and like insurance it looks like waste right up until it doesn't."],
["Should-cost model","SOURCE","Building up what a part ought to cost from material, labour, machine rate, overhead and margin. Changes a negotiation from haggling to a conversation about facts."],
["MOQ","SOURCE","Minimum Order Quantity. Where a supplier's setup economics collide with your EOQ. If MOQ exceeds EOQ badly, you are financing the supplier's production efficiency out of your own working capital."],
["Lead time variability","SOURCE","More damaging than long lead time. A reliable 90-day lead time is plannable; an 'anywhere from 20 to 60 days' lead time forces you to buffer for the worst case every single cycle."],
["Supplier scorecard","SOURCE","Quality, delivery, cost, responsiveness, compliance, scored monthly and shared. The point is not the score, it is that the conversation becomes evidence-based."],
["Payment terms (DPO)","SOURCE","Days Payable Outstanding. Stretching supplier payments improves your cash conversion cycle and quietly damages your small suppliers, who then price the financing cost back into your next quote."],
["Tail spend","SOURCE","The thousands of low-value suppliers making up ~5% of spend and ~60% of transactions. Automate it; do not negotiate it."],
["Multi-tier visibility","SOURCE","Knowing your suppliers' suppliers. Most catastrophic disruptions come from tier 2 or tier 3, a single resin plant or one specialty pigment that six of your 'independent' suppliers all buy from."],

/* --- make --- */
["MRP","MAKE","Material Requirements Planning. Takes the production schedule, explodes it through the bill of materials, subtracts what you already have and what is already on order, and tells you what to buy and when. Its assumption of infinite capacity is its famous flaw."],
["Bill of materials (BOM)","MAKE","The recipe: what goes into one unit, in what quantity, at what level. A multi-level BOM is a tree, change one component at level 4 and you may need to re-plan 200 finished goods."],
["Yield / scrap factor","MAKE","The BOM says 1kg; reality needs 1.06kg because 6% is lost in the process. Forget this and you are permanently short by exactly the scrap rate."],
["OEE","MAKE","Overall Equipment Effectiveness = Availability × Performance × Quality. Three numbers that each look respectable at 90% multiply to 73%. World class is around 85%; most lines that claim 90% are measuring only one of the three."],
["Takt time","MAKE","Available production time ÷ customer demand. The heartbeat the line must beat to. If takt is 42 seconds and your slowest station takes 51, you have found your bottleneck without needing software."],
["Cycle time vs lead time","MAKE","Cycle time is how long one unit takes to make. Lead time is how long a customer waits. The gap between them is queueing, and it is usually 90%+ of the total."],
["Little's Law","MAKE","WIP = Throughput × Cycle time. It is arithmetic, not a theory, and it holds everywhere. Its practical consequence: to cut lead time without adding capacity, cut work-in-progress. Releasing more work into a busy system makes everything slower."],
["Theory of Constraints","MAKE","Identify the bottleneck, exploit it, subordinate everything else to it, elevate it, then repeat. An hour lost at the bottleneck is an hour lost by the whole plant; an hour saved anywhere else is a mirage."],
["SMED","MAKE","Single-Minute Exchange of Die: cutting changeover time by converting internal setup (machine stopped) into external setup (done while running). Halve the changeover and the economic batch size halves too, which unlocks smaller, more frequent, fresher runs."],
["Campaign manufacturing","MAKE","Running one product for a long block to avoid changeovers and cleaning validation. Common in pharma and chemicals, where a changeover can mean days of cleaning and swab testing. Efficient for the plant, murderous for inventory."],
["Frozen period","MAKE","The near-term window where the schedule cannot change. Too short and the plant thrashes; too long and you cannot respond to real customers. Where planning and manufacturing negotiate their treaty."],
["Rough-cut capacity planning","MAKE","A quick sanity check of the demand plan against a few critical resources before committing. Catches the impossible plan before it becomes everyone's problem."],
["Heijunka","MAKE","Production levelling: smoothing volume and mix so the line runs at a steady rhythm rather than lurching between feast and famine."],

/* --- deliver --- */
["OTIF","DELIVER","On Time, In Full. Of every promised delivery, did everything ordered arrive on the promised day? It is multiplicative and unforgiving: 96% on-time × 97% in-full = 93% OTIF. Retailers now fine against it."],
["Perfect order","DELIVER","OTIF plus damage-free plus correct paperwork plus correct invoice. Four gates at 97% each = 88.5% perfect orders. This is the metric that shows how much the invisible admin failures cost you."],
["FTL vs LTL","DELIVER","Full Truckload buys the whole trailer: fast, direct, one handling. Less-than-Truckload shares it, cheaper for small volumes, but with terminal handling, transfers and more damage. The breakeven is usually somewhere around 12-16 pallets; below that LTL wins, above it FTL does."],
["Cube-out vs weigh-out","DELIVER","A trailer cubes out when it is physically full before hitting the weight limit (pillows, crisps, docks); it weighs out when it hits the weight limit with space left (cable drums, liquids). Knowing which one your product does tells you whether to optimise packaging or pallet patterns."],
["Volumetric weight","DELIVER","Air and courier freight charge on whichever is greater: actual weight, or volume ÷ a divisor (commonly 5000 or 6000 for cm³/kg). Redesigning a box to fall below the divisor is one of the highest-return exercises in logistics."],
["Milk run","DELIVER","One vehicle on a fixed loop collecting from several suppliers or delivering to several customers, instead of each running a part-empty vehicle. Cuts cost and, crucially, allows small frequent deliveries, the backbone of JIT."],
["Cross-docking","DELIVER","Inbound goods go straight to an outbound door within hours, never entering storage. Removes putaway, storage and picking cost. It requires excellent inbound timing, a cross-dock with unreliable inbound is just an expensive floor."],
["VRP","DELIVER","Vehicle Routing Problem. One depot, many stops, limited vehicles, find the cheapest routes. The number of possible solutions explodes factorially, 20 stops is more combinations than there are atoms in a person, so everyone uses heuristics."],
["Clarke-Wright savings","DELIVER","The classic VRP heuristic. For every pair of stops compute S = d(depot,i) + d(depot,j) − d(i,j): how much you save by serving them on one trip instead of two. Merge the biggest savings first while capacity allows. Typically 8-15% shorter than naive clustering, and it runs in milliseconds."],
["Sweep method","DELIVER","Rotate a line around the depot like a radar arm; add stops to a vehicle in the order they are swept until it fills, then start the next. Fast, intuitive, and noticeably worse than savings, but easy to explain to a transport office."],
["Backhaul","DELIVER","Finding a paying load for the return leg. An empty return is 50% of the distance producing 0% of the revenue and 100% of the emissions."],
["Drop trailer","DELIVER","Leaving a loaded trailer at the dock for later unloading instead of holding the driver. Slashes detention cost and turns dock scheduling from a fight into a plan."],
["Detention & demurrage","DELIVER","Detention is a charge for holding the carrier's equipment too long; demurrage is a charge for leaving a container at the port past free time. Both are pure avoidable cost, and both are usually somebody else's KPI, which is why they persist."],
["Cost to serve","DELIVER","The true cost of serving each customer or channel, including order frequency, drop size, returns, packaging, and the phone calls. Almost every business discovers that a chunk of its 'profitable' customers are not."],
["Freight class / NMFC","DELIVER","North American LTL classification by density, stowability, handling and liability. Misclassify and you get re-billed weeks later, always upward."],

/* --- warehouse --- */
["Slotting","WAREHOUSE","Deciding where each SKU physically lives. Fast movers at waist height near dispatch; slow movers high and far. A good re-slot can cut picker walking distance 20-35% with zero capital spend, and walking is 55% of a picker's time."],
["Golden zone","WAREHOUSE","The shelf band between knee and shoulder height. Fastest to pick, safest for backs. Prime real estate, reserve it for your A-movers."],
["Pick face vs reserve","WAREHOUSE","The pick face is the small accessible quantity being picked from; reserve is bulk stock feeding it. Replenishment between them is invisible work that a badly slotted warehouse doubles."],
["Wave vs batch vs zone picking","WAREHOUSE","Wave = release orders in timed groups aligned to dispatch. Batch = pick several orders in one trip, sort after. Zone = each picker owns an area and orders pass between them. Most large operations use a hybrid of all three."],
["Put-to-light / pick-to-light","WAREHOUSE","Lights direct the operator to the location and quantity. Cuts errors and training time dramatically; expensive and inflexible once installed."],
["Dock-to-stock time","WAREHOUSE","Hours from a truck arriving to the goods being available to pick. Often the largest hidden delay in the whole chain, stock physically present but system-invisible is not stock."],
["Cycle counting","WAREHOUSE","Counting a subset of locations continuously instead of shutting down for an annual stocktake. Count A items monthly, C items yearly. Fixes root causes rather than just correcting numbers once a year."],
["Inventory record accuracy","WAREHOUSE","Percentage of locations where system quantity matches physical. Below ~97% your MRP is planning on fiction, and planners start keeping private spreadsheets, which is how you know it is bad."],
["Honeycombing","WAREHOUSE","Wasted rack space from partially emptied pallet positions you cannot use for anything else. Silent, universal, and worth 10-20% of your cube."],
["FEFO vs FIFO","WAREHOUSE","First Expired First Out versus First In First Out. For anything with a shelf life FEFO is mandatory, the oldest received is not always the soonest to expire, especially with mixed batch lead times."],
["Put-away strategy","WAREHOUSE","Random/chaotic storage (system remembers where things are) beats fixed locations on space utilisation by 20%+, but is unusable without reliable scanning discipline."],

/* --- finance --- */
["Cash-to-cash cycle","FINANCE","DIO + DSO − DPO. The days between paying your supplier and being paid by your customer. It is the single number that translates supply chain performance into treasury language, and the one your CFO already knows."],
["Working capital","FINANCE","Inventory + receivables − payables. Supply chain controls the largest lever on it, which is why inventory reduction projects always have executive attention."],

var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var sum=function(a){return a.reduce(function(x,y){return x+y;},0);};

/* standard normal */
function npdf(z){ return Math.exp(-z*z/2)/Math.sqrt(2*Math.PI); }
function ncdf(z){
  var t=1/(1+0.2316419*Math.abs(z));
  var d=npdf(z);
  var p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0? 1-p : p;
}
/* inverse normal, Acklam's approximation, good to ~1e-9 */
function nInv(p){
  if(p<=0) return -6; if(p>=1) return 6;
  var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  var b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  var c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  var d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  var pl=0.02425,q,r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
/* unit normal loss function G(k), drives fill rate */
function lossG(k){ return npdf(k) - k*(1-ncdf(k)); }

function computeSku(sk,g,S,q,ev,over){
  var o = over||{};
  var svc   = o.service!=null? o.service : g.service;
  var pol   = o.policy!=null?  o.policy  : g.policy;
  var src   = o.source!=null?  o.source  : g.sourcing;
  var mode  = o.mode!=null?    o.mode    : g.mode;
  var exped = (o.expedite===true||o.expedite==="true");

  /* --- demand --- */
  var season = sk.season[(q-1)%8];
  var promoM = g.promo? 1 + 0.55*sk.promo : 1;
  var evHit  = (ev && ev.hits.indexOf(sk.code)>=0);
  var evDem  = 1;
  if(evHit && ev.by==="capacity") evDem = 1.35;      /* demand-surge events */
  if(evHit && ev.by==="safety")   evDem = 1.32;

  var dailyD = demand/91;

  var M = METHODS[g.method];
