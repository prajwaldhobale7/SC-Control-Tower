  [25,50,75,100].forEach(function(r){
    var d="";for(var i=0;i<n;i++){var p=pt(i,r);d+=(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1);}
    s+='<path d="'+d+'Z" fill="none" stroke="var(--rule2)" stroke-width="1"/>';});
  for(var i=0;i<n;i++){var p=pt(i,100);
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="var(--rule2)"/>';
    var lp=pt(i,124);
    s+=tx(lp[0],lp[1]+3,esc(o.axes[i]),lp[0]>cx+8?"start":lp[0]<cx-8?"end":"middle","lbl",8.5);}
  o.series.forEach(function(se){
    var d="";se.data.forEach(function(v,i){var p=pt(i,clamp(v,0,100));d+=(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1);});
    s+='<path d="'+d+'Z" fill="'+se.color+'" fill-opacity=".17" stroke="'+se.color+'" stroke-width="2"'+(se.dash?' stroke-dasharray="5 4"':'')+'/>';
    se.data.forEach(function(v,i){var p=pt(i,clamp(v,0,100));
      s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="'+se.color+'"/>';});});
  return s+'</svg>';
}

/* ---------------- WATERFALL ----------------
   Revenue-to-profit bridges and the cash-cycle bridge.

   items: [{label, v, total}]
     total:true   the bar is drawn from zero and RESETS the running balance
     total:false  the bar floats from the running balance to balance + v

   The first pass computes every bar's [bottom, top] pair and tracks the
   overall min and max, because a bridge can legitimately go negative. The
   second pass draws. Connector lines link the top of each bar to the next,
   except where the next bar is a total. Labels are split on the first space
   so a two-word label stacks rather than colliding with its neighbour. */
function svgWaterfall(o){
  var w=o.w||560,h=o.h||230,pl=52,pr=10,pt=16,pb=46;
  var iw=w-pl-pr,ih=h-pt-pb,n=o.items.length;
  var run=0,tops=[],mx=0,mn=0;
  o.items.forEach(function(it){
    if(it.total){tops.push([0,it.v]);run=it.v;}
    else {tops.push([run,run+it.v]);run+=it.v;}
    mx=Math.max(mx,tops[tops.length-1][0],tops[tops.length-1][1]);
    mn=Math.min(mn,tops[tops.length-1][0],tops[tops.length-1][1]);});
  mx=nice(mx); if(mn<0)mn=-nice(-mn);
  var Y=function(v){return pt+ih-((v-mn)/(mx-mn||1))*ih;};
  var gw=iw/n,bw=gw*0.62;
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var yv=mn+(mx-mn)*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,money(yv),"end","",8.5);}
  o.items.forEach(function(it,i){
    var a=Y(tops[i][0]),b=Y(tops[i][1]),x=pl+gw*i+(gw-bw)/2;
    /* totals are ink; increases green; decreases red */
    var col=it.total?"var(--ink)":(it.v>=0?"var(--good)":"var(--bad)");
    s+='<rect x="'+x.toFixed(1)+'" y="'+Math.min(a,b).toFixed(1)+'" width="'+bw.toFixed(1)+
       '" height="'+Math.max(1.5,Math.abs(a-b)).toFixed(1)+'" fill="'+col+'" rx="1.5"/>';
    if(i<n-1&&!o.items[i+1].total)
      s+='<line x1="'+(x+bw).toFixed(1)+'" y1="'+b.toFixed(1)+'" x2="'+(pl+gw*(i+1)+(gw-bw)/2).toFixed(1)+
         '" y2="'+b.toFixed(1)+'" stroke="var(--sub2)" stroke-width="1" stroke-dasharray="3 3"/>';
    s+=tx(x+bw/2,Math.min(a,b)-4,money(it.v),"middle","val",8.5);
    var words=it.label.split(" ");
    s+=tx(x+bw/2,h-pb+16,esc(words[0]),"middle","lbl",8);
    if(words[1]) s+=tx(x+bw/2,h-pb+26,esc(words.slice(1).join(" ")),"middle","lbl",8);
  });
  /* the axis sits at zero, not at the bottom, so negatives read correctly */
  s+='<line class="axis" x1="'+pl+'" y1="'+Y(0).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(0).toFixed(1)+'"/>';
  return s+'</svg>';
}

/* ---------------- GAUGE ARC ----------------
   A half-circle dial, used once: inventory record accuracy against the 97%
   trust line. Two arcs are drawn, a grey full sweep and a coloured partial
   one. The large-arc-flag in the path data must flip at the halfway point,
   which is the (f>0.5?1:0) term. */
function svgGauge(o){
  var w=o.w||150,h=o.h||96,cx=w/2,cy=h-14,R=Math.min(w/2-8,h-26);
  var v=clamp((o.v-(o.min||0))/((o.max||100)-(o.min||0)),0,1);
  var arc=function(f,col,wd){
    var a0=Math.PI,a1=Math.PI+Math.PI*f;      /* sweep from 180° to 360° */
    var x0=cx+Math.cos(a0)*R,y0=cy+Math.sin(a0)*R,x1=cx+Math.cos(a1)*R,y1=cy+Math.sin(a1)*R;
    return '<path d="M'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+R+','+R+' 0 '+(f>0.5?1:0)+',1 '+
      x1.toFixed(1)+','+y1.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="'+wd+'" stroke-linecap="round"/>';};
  var s=svgOpen(w,h);
  s+=arc(1,"var(--rule2)",9)+arc(v,o.color||C_ACC(),9);
  s+=tx(cx,cy-6,o.txt!=null?o.txt:fm(o.v,1),"middle","val",19);
  s+=tx(cx,cy+9,esc(o.label||""),"middle","lbl",8.5);
  return s+'</svg>';
}

/* ---------------- SAWTOOTH INVENTORY PROFILE ----------------
   The single most useful picture in inventory, simulated for 120 days.

   The saw is built by walking forward in time: stock falls at the daily
   demand rate for one cycle length, a receipt lifts it by Q, repeat. Noise
   is applied to both the cycle length and the depletion rate so the profile
   looks like a real stock record rather than a textbook triangle.

   The randomness uses a LINEAR CONGRUENTIAL GENERATOR seeded to 1, not
   Math.random(). That is deliberate: the chart must be identical on every
   repaint, otherwise it would flicker on each keystroke. */
function svgSawtooth(r,g,days){
  var w=560,h=210,pl=50,pr=14,pt=14,pb=28,iw=w-pl-pr,ih=h-pt-pb;
  days=days||120;
  /* the y top must clear the highest point the saw can reach */
  var top=Math.max(r.SSu+r.Q, r.rop*1.25)*1.12;
  var X=function(d){return pl+d/days*iw;},Y=function(v){return pt+ih-clamp(v/top,0,1)*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var yv=top*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,qty(yv),"end","",8.5);}
  /* safety stock band: the red zone the saw should normally stay above */
  s+='<rect x="'+pl+'" y="'+Y(r.SSu).toFixed(1)+'" width="'+iw+'" height="'+(Y(0)-Y(r.SSu)).toFixed(1)+
     '" fill="var(--bad)" opacity=".085"/>';
  /* build the saw */
  var d="",cur=r.SSu+r.Q,t=0,cyc=r.Q/Math.max(r.dailyD,0.0001),seed=1;
  var rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280;};
  d="M"+X(0)+","+Y(cur);
  var pts=[];
  while(t<days){
    var noise=1+(rnd()-0.5)*r.sk.cv*1.6;         /* cycle length varies with demand cv */
    var draw=Math.min(cyc*noise,days-t);
    var end=cur-r.dailyD*draw*(1+(rnd()-0.5)*0.3);   /* depletion rate varies too */
    t+=draw; d+="L"+X(t).toFixed(1)+","+Y(end).toFixed(1);
    pts.push({t:t,v:end});
    if(end<r.SSu*0.25) d+="L"+X(t).toFixed(1)+","+Y(Math.max(end,0)).toFixed(1);  /* near-stockout */
    cur=Math.max(end,0)+r.Q; if(cur>top)cur=top*0.98;   /* receipt lands */
    d+="L"+X(t).toFixed(1)+","+Y(cur).toFixed(1);       /* vertical step up */
  }
  s+='<path d="'+d+'" fill="none" stroke="'+C_ACC()+'" stroke-width="1.9" stroke-linejoin="round"/>';
  /* reference lines: reorder point and safety stock, labelled at the right */
  [[r.rop,"var(--warn)","Reorder point "+qty(r.rop)],[r.SSu,"var(--bad)","Safety stock "+qty(r.SSu)]].forEach(function(L){
    s+='<line x1="'+pl+'" y1="'+Y(L[0]).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(L[0]).toFixed(1)+
       '" stroke="'+L[1]+'" stroke-width="1.4" stroke-dasharray="6 4"/>';
    s+=tx(w-pr-2,Y(L[0])-4,L[2],"end","lbl",8.5,L[1]);});
  for(var k=0;k<=4;k++) s+=tx(X(days*k/4),h-8,"day "+Math.round(days*k/4),"middle","lbl",8.5);
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- EOQ TOTAL-COST CURVE ----------------
   Three curves sampled at 60 points: ordering cost D/Q·S (a hyperbola),
   holding cost Q/2·H (a straight line), and their sum (a flat-bottomed U).
   Two vertical markers show the optimum and where the player actually is.

   Note the scale is derived from pts.slice(3) — the first three samples sit
   on the near-vertical part of the ordering-cost hyperbola and would
   otherwise set an axis top ten times higher than the interesting region. */
function svgEoq(r,g){
  var w=520,h=200,pl=54,pr=14,pt=14,pb=32,iw=w-pl-pr,ih=h-pt-pb;
  var D=r.demand*4,S=r.sk.S,H=r.H;
  var qmax=Math.max(r.eoq,r.Q)*2.4,pts=[];
  for(var i=1;i<=60;i++){var Qi=qmax*i/60;
    pts.push({q:Qi,ord:D/Qi*S,hold:Qi/2*H,tot:D/Qi*S+Qi/2*H});}
  var mx=nice(Math.max.apply(null,pts.slice(3).map(function(p){return p.tot;})));
  var X=function(q){return pl+q/qmax*iw;},Y=function(v){return pt+ih-clamp(v/mx,0,1)*ih;};
  var s=svgOpen(w,h);
  for(var j=0;j<=4;j++){var yv=mx*j/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,money(yv),"end","",8.5);}
  var draw=function(key,col,wd,dash){var d="";pts.forEach(function(p,i){d+=(i?"L":"M")+X(p.q).toFixed(1)+","+Y(p[key]).toFixed(1);});
    return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+wd+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>';};
  s+=draw("ord","var(--sub2)",1.5,1)+draw("hold","var(--sub)",1.5,1)+draw("tot",C_ACC(),2.4);
  /* EOQ marker and your marker */
  s+='<line x1="'+X(r.eoq).toFixed(1)+'" y1="'+pt+'" x2="'+X(r.eoq).toFixed(1)+'" y2="'+(pt+ih)+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  s+=tx(X(r.eoq),pt+10,"EOQ "+qty(r.eoq),"middle","lbl",8.5,"var(--good)");
  s+='<line x1="'+X(r.Q).toFixed(1)+'" y1="'+pt+'" x2="'+X(r.Q).toFixed(1)+'" y2="'+(pt+ih)+'" stroke="var(--bad)" stroke-width="1.5"/>';
  s+=tx(X(r.Q),pt+ih+13,"your Q "+qty(r.Q),"middle","lbl",8.5,"var(--bad)");
  s+=tx(pl+iw/2,h-6,"order quantity","middle","lbl",8.5);
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- SERVICE vs SAFETY-STOCK CURVE ----------------
   Safety stock at ten service levels for THIS product line, using the live
   sigmaL. The x scale is linear in service level, which is what makes the
   blow-up above 99% visually obvious: the sample points bunch together on x
   while the curve climbs steeply on y. */
function svgServiceCurve(r,g){
  var w=520,h=200,pl=52,pr=48,pt=14,pb=32,iw=w-pl-pr,ih=h-pt-pb;
  var lv=[80,85,90,93,95,97,98,99,99.5,99.9];
  var vals=lv.map(function(L){var z=zFor(L);return {L:L,ss:z*r.sigmaL,cost:z*r.sigmaL*r.sk.cost*g.holdRate/4};});
  var mx=nice(vals[vals.length-1].ss*1.05);
  var X=function(L){return pl+(L-80)/(99.9-80)*iw;},Y=function(v){return pt+ih-clamp(v/mx,0,1)*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var yv=mx*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,qty(yv),"end","",8.5);}
  var d="";vals.forEach(function(v,i){d+=(i?"L":"M")+X(v.L).toFixed(1)+","+Y(v.ss).toFixed(1);});
  s+='<path d="'+d+'" fill="none" stroke="'+C_ACC()+'" stroke-width="2.4"/>';
  vals.forEach(function(v){s+='<circle cx="'+X(v.L).toFixed(1)+'" cy="'+Y(v.ss).toFixed(1)+'" r="2.6" fill="'+C_ACC()+'"/>';});
  /* the player's current position, clamped into the drawn range */
  s+='<line x1="'+X(clamp(r.svc,80,99.9)).toFixed(1)+'" y1="'+pt+'" x2="'+X(clamp(r.svc,80,99.9)).toFixed(1)+'" y2="'+(pt+ih)+'" stroke="var(--bad)" stroke-width="1.6"/>';
  s+=tx(X(clamp(r.svc,80,99.9)),pt+9,"you: "+r.svc+"%","middle","lbl",8.5,"var(--bad)");
  [80,90,95,98,99.9].forEach(function(L){s+=tx(X(L),h-8,L+"%","middle","lbl",8.5);});
  s+=tx(w-pr+4,Y(mx*0.5),"safety","start","lbl",8.5);
  s+=tx(w-pr+4,Y(mx*0.5)+9,"stock","start","lbl",8.5);
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- NETWORK MAP (the animated one) ----------------
   Seven nodes on fixed coordinates, coloured by live status:
     supplier  green if dual-sourced, red during an unmitigated dual event
     plant     by utilisation, warning both above 88% and below 45%
     DC        by days of stock and service
     customer  by OTIF

   Link thickness scales with the served/demanded ratio, so a company failing
   to supply visibly draws thinner arrows. The flowing dashes are a CSS
   animation on stroke-dashoffset, defined INSIDE the SVG so the chart is
   self-contained, with a reduced-motion override in the same block. */
function svgNetwork(M){
  var w=560,h=214,S=M.S,g=M.g,acc=S.acc;
  var col=function(t){return t==="bad"?"var(--bad)":t==="warn"?"var(--warn)":"var(--good)";};
  var supT = g.sourcing==="dual"?"good":(M.ev&&M.ev.by==="dual"&&!M.mitigated)?"bad":"warn";
  var plantT = M.util>100?"bad":M.util>88?"warn":M.util<45?"warn":"good";
  var dcT = M.dio>75?"warn":M.otif<90?"warn":"good";
  var custT = M.otif>=95?"good":M.otif>=88?"warn":"bad";
  var nodes=[
    {x:52,y:64,r:15,t:supT,l:"TIER 2",s:"raw"},
    {x:52,y:150,r:15,t:supT,l:"TIER 2",s:"raw"},
    {x:154,y:107,r:20,t:supT,l:"SUPPLIER",s:g.sourcing==="dual"?"dual source":"single source"},
    {x:272,y:107,r:24,t:plantT,l:"PLANT",s:fm(M.util,0)+"% util"},
    {x:392,y:107,r:20,t:dcT,l:"DC",s:fm(M.dio,0)+" days stock"},
    {x:500,y:64,r:14,t:custT,l:"CUSTOMER",s:""},
    {x:500,y:150,r:14,t:custT,l:"CUSTOMER",s:""}
  ];
  var links=[[0,2],[1,2],[2,3],[3,4],[4,5],[4,6]];
  if(g.crossdock) links.push([3,5]);      /* the bypass appears only when enabled */
  var s=svgOpen(w,h);
  s+='<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'+
     '<path d="M0,0 L7,3.5 L0,7 z" fill="'+acc+'"/></marker>'+
     '<style>@keyframes dashfl{to{stroke-dashoffset:-22}}'+
     '.fl{animation:dashfl 1.1s linear infinite}'+
     '@media(prefers-reduced-motion:reduce){.fl{animation:none}}</style></defs>';
  links.forEach(function(L){
    var a=nodes[L[0]],b=nodes[L[1]];
    var thick=clamp(1.4+M.served/Math.max(M.totalDem,1)*3.4,1.2,5);
    /* a grey backing line, then the animated accent line over it */
    s+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="var(--rule)" stroke-width="'+(thick+1.6)+'" stroke-linecap="round"/>';
    s+='<line class="fl" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+acc+'" stroke-width="'+thick+
       '" stroke-dasharray="9 13" stroke-linecap="round" marker-end="url(#ah)"/>';
  });
  if(g.crossdock) s+=tx(400,146,"cross-dock bypass","middle","lbl",8,acc);
  nodes.forEach(function(n){
    s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+n.r+'" fill="#fff" stroke="'+col(n.t)+'" stroke-width="2.6"/>';
    s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(n.r-6)+'" fill="'+col(n.t)+'" opacity=".28"/>';
    s+=tx(n.x,n.y+n.r+11,n.l,"middle","lbl",8);
    if(n.s) s+=tx(n.x,n.y+n.r+20,n.s,"middle","lbl",8,"var(--sub2)");
  });
  s+=tx(272,26,MODES[g.mode].label.toUpperCase()+" · "+fm(S.distanceKm,0)+" KM AVG LANE","middle","lbl",8.5,acc);
  return s+'</svg>';
}

/* ---------------- VRP ROUTE MAP ----------------
   A real vehicle routing problem, solved two ways, live.

   STOPS are stored in POLAR coordinates: [angle in degrees, radius, drop
   size]. Polar is the natural representation because the sweep heuristic
   sorts by angle, and because it makes the depot the obvious origin. */
var STOPS=[[25,62,9],[58,78,7],[95,55,8],[130,82,6],[160,60,10],[200,75,7],[235,58,9],[268,80,6],
           [300,66,8],[330,50,7],[352,74,9],[178,40,5],[110,30,6],[290,38,7]]
  .map(function(a,i){return {id:i+1,th:a[0]*Math.PI/180,deg:a[0],r:a[1],q:a[2]};});
var DEPOT={r:0,th:0};

/* dist(a,b): euclidean distance between two polar points, via cartesian. */
function dist(a,b){var ax=a.r*Math.cos(a.th),ay=a.r*Math.sin(a.th),bx=b.r*Math.cos(b.th),by=b.r*Math.sin(b.th);
  return Math.hypot(ax-bx,ay-by);}

/* routeLen(rt): total distance of one route, depot → stops in order → depot.
   Both legs back to the depot are included, which is what makes merging two
   routes into one a saving. */
function routeLen(rt){var d=dist(DEPOT,rt[0]);for(var i=0;i<rt.length-1;i++)d+=dist(rt[i],rt[i+1]);return d+dist(rt[rt.length-1],DEPOT);}

/* sweepRoutes(cap): the SWEEP heuristic.
   Sort every stop by polar angle, then walk round the circle adding stops to
   the current vehicle until the next one would breach capacity, at which
   point start a new vehicle. Fast, intuitive, reproducible by hand in a
   transport office, and consistently worse than savings. */
function sweepRoutes(cap){
  var srt=STOPS.slice().sort(function(a,b){return a.th-b.th;}),out=[],cur=[],load=0;
  srt.forEach(function(c){ if(load+c.q>cap&&cur.length){out.push(cur);cur=[];load=0;} cur.push(c);load+=c.q;});
  if(cur.length)out.push(cur); return out;
}

/* savingsRoutes(cap): CLARKE-WRIGHT savings, 1964.

   Step 1  every stop starts as its own out-and-back route
   Step 2  for every PAIR compute S = d(0,i) + d(0,j) − d(i,j), the distance
           saved by serving them on one trip instead of two
   Step 3  sort the pairs by saving, descending
   Step 4  walk the list and merge whenever it is legal

   A merge is only legal when i is an ENDPOINT of one route and j is an
   endpoint of another, they are not already in the same route, and the
   combined load fits. The two reverse() calls orient each route so that i
   is the tail of the left route and j is the head of the right one; if that
   cannot be arranged the merge is abandoned.

   Typically 8-15% shorter than sweep, and it runs in milliseconds. */
function savingsRoutes(cap){
  var rts=STOPS.map(function(c){return [c];}),pairs=[];
  for(var i=0;i<STOPS.length;i++)for(var j=i+1;j<STOPS.length;j++)
    pairs.push({a:STOPS[i],b:STOPS[j],s:dist(DEPOT,STOPS[i])+dist(DEPOT,STOPS[j])-dist(STOPS[i],STOPS[j])});
  pairs.sort(function(x,y){return y.s-x.s;});
  pairs.forEach(function(p){
    var ra=null,rb=null;
    /* find the routes whose HEAD or TAIL is a or b; interior stops cannot merge */
    rts.forEach(function(r){ if(r[0].id===p.a.id||r[r.length-1].id===p.a.id)ra=r;
                             if(r[0].id===p.b.id||r[r.length-1].id===p.b.id)rb=r;});
    if(!ra||!rb||ra===rb)return;
    var load=sum(ra.map(function(c){return c.q;}))+sum(rb.map(function(c){return c.q;}));
    if(load>cap)return;
    var L=ra,R=rb;
    if(L[L.length-1].id!==p.a.id)L=L.slice().reverse();   /* a must be the tail of L */
    if(R[0].id!==p.b.id)R=R.slice().reverse();            /* b must be the head of R */
    if(L[L.length-1].id!==p.a.id||R[0].id!==p.b.id)return;
    rts=rts.filter(function(r){return r!==ra&&r!==rb;});
    rts.push(L.concat(R));
  });
  return rts;
}

/* svgVrp(heur,cap): draw the chosen solution, and compute the OTHER one too
   so the caption can state the difference. The −0.78 y factor squashes the
   circle into an ellipse, which reads as a map seen in perspective. */
function svgVrp(heur,cap){
  var w=520,h=330,cx=w/2,cy=h/2-4,sc=1.28;
  var P=function(n){return [cx+n.r*Math.cos(n.th)*sc, cy+n.r*Math.sin(n.th)*sc*-0.78];};
  var rts=heur==="sweep"?sweepRoutes(cap):savingsRoutes(cap);
  var s=svgOpen(w,h);
  /* two faint range rings, purely to give the plot a sense of distance */
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="118" fill="none" stroke="var(--rule2)" stroke-dasharray="3 5"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="62" fill="none" stroke="var(--rule2)" stroke-dasharray="3 5"/>';
  rts.forEach(function(rt,i){
    var col=PAL[i%PAL.length],d="M"+cx+","+cy;
    rt.forEach(function(n){var p=P(n);d+="L"+p[0].toFixed(1)+","+p[1].toFixed(1);});
    d+="L"+cx+","+cy;                                  /* return leg to the depot */
    s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" opacity=".85" stroke-linejoin="round"/>';
    rt.forEach(function(n){var p=P(n);
      s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="9" fill="'+col+'" stroke="#fff" stroke-width="1.6"/>';
      s+=tx(p[0],p[1]+3,String(n.q),"middle","",8.5,"#fff");});   /* the drop size */
  });
  s+='<rect x="'+(cx-13)+'" y="'+(cy-13)+'" width="26" height="26" fill="var(--ink)" rx="3"/>';
  s+=tx(cx,cy+3.5,"DC","middle","",9,"#fff");
  var tot=sum(rts.map(routeLen));
  var alt=sum((heur==="sweep"?savingsRoutes(cap):sweepRoutes(cap)).map(routeLen));
  s+=tx(10,16,rts.length+" VEHICLES · "+fm(tot,0)+" KM TOTAL","start","lbl",9.5,"var(--ink)");
  var better=tot<=alt;
  s+=tx(10,29,(better?"▼ ":"▲ ")+fm(Math.abs(tot-alt)/alt*100,1)+"% vs "+(heur==="sweep"?"savings":"sweep"),
    "start","lbl",9,better?"var(--good)":"var(--bad)");
  s+=tx(w-10,16,"numbers = drop size","end","lbl",8.5,"var(--sub2)");
  return s+'</svg>';
}

/* ---------------- WAREHOUSE SLOTTING MAP ----------------
   An 8-aisle by 10-bay plan view with a picker's route drawn over it.

   cls(ai,bi) returns a 0-1 "distance from dispatch" score, combining
   vertical distance from the middle aisle with horizontal distance from the
   dock. That score drives the fill colour under each slotting strategy:
     random  colours cycle arbitrarily — velocity is ignored
     abc     fast items in the low-distance band
     golden  a tighter band still, plus family grouping

   The pick paths are hand-authored per strategy rather than solved, because
   the point being made is the SHAPE of the route, not its optimality. The
   walked distance is measured from the drawn path and scaled by 0.42 to
   convert SVG units to metres. */
function svgWarehouse(g,rows){
  var w=520,h=250,s=svgOpen(w,h);
  var aisles=8,bays=10,x0=54,y0=34,bw=(w-x0-24)/bays,bh=(h-y0-46)/aisles;
  var order=rows.slice().sort(function(a,b){return b.served-a.served;});
  var cls=function(ai,bi){
    var d=Math.abs(ai-3.5)/3.5*0.55+ (bi/bays)*0.85;   /* distance from dispatch */
    return d;
  };
  for(var ai=0;ai<aisles;ai++)for(var bi=0;bi<bays;bi++){
    var d=cls(ai,bi),fillc,label="";
    if(g.slotting==="random"){ fillc=["#DEEAFB","#E8E5FA","#EDF1F6"][(ai*bays+bi)%3]; }
    else if(g.slotting==="abc"){ fillc = d<0.45?"#DEEAFB":d<0.75?"#E8E5FA":"#EDF1F6"; }
    else { fillc = d<0.3?"#DEEAFB":d<0.6?"#E8E5FA":"#EDF1F6"; }
    s+='<rect x="'+(x0+bi*bw).toFixed(1)+'" y="'+(y0+ai*bh).toFixed(1)+'" width="'+(bw-2.5).toFixed(1)+
       '" height="'+(bh-2.5).toFixed(1)+'" fill="'+fillc+'" stroke="var(--rule2)" rx="1.5"/>';
  }
  /* dispatch dock */
  s+='<rect x="18" y="'+(y0+bh*2.4).toFixed(1)+'" width="28" height="'+(bh*3.2).toFixed(1)+'" fill="var(--ink)" rx="3"/>';
  s+='<text transform="translate(32,'+(y0+bh*4).toFixed(1)+') rotate(-90)" text-anchor="middle" font-size="8.5" fill="#fff" class="lbl">DISPATCH</text>';
  /* pick path: [aisle, bay] pairs, eight lines, out and back to the dock */
  var pts=g.slotting==="random"? [[1,6],[4,2],[6,9],[2,8],[7,1],[3,5],[5,9],[0,3]]
        : g.slotting==="abc"?    [[3,0],[4,1],[2,1],[5,2],[3,3],[6,4],[2,6],[4,8]]
        :                        [[3,0],[4,0],[3,1],[4,1],[2,2],[5,3],[3,5],[4,7]];
  var d2="M46,"+(y0+bh*4).toFixed(1);
  pts.forEach(function(p){ d2+="L"+(x0+p[1]*bw+bw/2).toFixed(1)+","+(y0+p[0]*bh+bh/2).toFixed(1); });
  d2+="L46,"+(y0+bh*4).toFixed(1);
  s+='<path d="'+d2+'" fill="none" stroke="'+C_ACC()+'" stroke-width="2" stroke-dasharray="5 3" opacity=".9"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+(x0+p[1]*bw+bw/2).toFixed(1)+'" cy="'+(y0+p[0]*bh+bh/2).toFixed(1)+'" r="7.5" fill="'+C_ACC()+'"/>';
    s+=tx(x0+p[1]*bw+bw/2,y0+p[0]*bh+bh/2+3,String(i+1),"middle","",8,"#fff");});
  /* measure the drawn route, including both dock legs */
  var lenPx=0,prev=[46,y0+bh*4];
  pts.forEach(function(p){var c=[x0+p[1]*bw+bw/2,y0+p[0]*bh+bh/2];lenPx+=Math.hypot(c[0]-prev[0],c[1]-prev[1]);prev=c;});
  lenPx+=Math.hypot(46-prev[0],(y0+bh*4)-prev[1]);
  s+=tx(x0,20,"8-LINE PICK · ~"+fm(lenPx*0.42,0)+" M WALKED","start","lbl",9.5,"var(--ink)");
  s+=tx(w-14,20,g.slotting==="random"?"chaotic storage":g.slotting==="abc"?"ABC velocity zones":"golden-zone + family grouping","end","lbl",8.5,"var(--sub)");
  s+=tx(x0,h-10,"█ fast    █ medium    █ slow","start","lbl",8.5,"var(--sub2)");
  return s+'</svg>';
}
/* ==========================================================
   6 · APP SHELL & THE IMPACT LEDGER
   ----------------------------------------------------------
   Every control change is measured: before vs after, on the
   metrics that matter. That ledger is how you learn what a
   lever actually does rather than what it is supposed to do.

   ARCHITECTURE IN ONE PARAGRAPH
     There is one mutable object, ST. Every screen is a pure function of ST.
     Rendering has two speeds: render() rebuilds the entire page, and paint()
     refreshes only the data-bearing nodes inside the current screen. All
     input handling is DELEGATED to `document`, so listeners survive an
     innerHTML replacement and never need re-attaching.

   WHY TWO SPEEDS
     render()  rebuilds structure. Called on tab change, sector change,
               quarter close, and any edit that adds or removes a row.
     paint()   rewrites only [data-live], [data-cell] and [data-chart]
               nodes. Called on every slider move and keystroke. It must not
               touch anything holding focus, which is exactly why typed
               inputs live outside the repainted regions.
   ========================================================== */

/* ----------------------------------------------------------
   ST — the single source of truth.

     sec        active sector key, or null on the landing screen
     q          current quarter, 1..8 (9 means the year is closed)
     tab        which of the thirteen screens is showing
     selSku     the product line every per-line panel focuses on
     gloss      side-rail glossary search text
     glossCat   Library glossary category filter

     g          THE CONTROL STATE. Every slider, segmented button and switch
                in the app writes one field here. computeAll() reads nothing
                else about the player's choices. Grouped below by screen.

     sku        per-SKU policy overrides: {code: {service, policy, ...}}
     hist       one record per closed quarter, drives every trend chart
     log        the impact ledger, newest first, capped at 50

     md         edits to the item file, {code: {field: value}}
     plan       the planning book, {code: {fc, firm, rec, open}}
     hidden     product lines the user removed
     newSkus    product lines the user added
     coName     a renamed company

     game       the four-role simulation's own state, null unless playing
     launchTab  which landing screen is showing: home, start or learn
     lgloss     primer glossary search text
     lcat       primer glossary category filter
   ---------------------------------------------------------- */
var ST={
  sec:null, q:1, tab:"tower", selSku:null, gloss:"", glossCat:"ALL",
  g:{
    /* demand screen */
    method:"expo", alpha:0.30, forecastAdj:0, promo:false, volatility:false,
    /* inventory screen */
    service:95, policy:"eoq", ssMult:1.0, coverWeeks:4,
    /* sourcing screen */
    sourcing:"single", ltStress:1.0, dockToStock:1,
    /* production screen */
    shifts:2, batchDays:5, smed:false, oeeA:88, oeeP:92, oeeQ:98,
    /* logistics screen */
    mode:"truck", fill:78, crossdock:false, heuristic:"savings", vrpCap:28, backhaul:false,
    /* warehouse screen */
    slotting:"random", pickMethod:"single", cycleCount:false,
    /* sector-specific: pharma (qpDays, cold, serial), shared (fefo, incoterm) */
    qpDays:7, cold:"passive", serial:true, fefo:true, incoterm:"dap",
    /* sector-specific: packaging */
    substrate:1.0, recycled:false,
    /* finance screen — these three are overwritten per sector on start */
    holdRate:0.26, dso:38, dpo:52
  },
  sku:{}, hist:[], log:[],
  md:{}, plan:{}, hidden:{}, newSkus:[], coName:null, game:null,
  launchTab:"home", lgloss:"", lcat:"ALL"
};

/* jQuery-shaped shorthands. $$ returns a real Array rather than a NodeList
   so forEach and map are available without conversion at each call site. */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

/* ----------------------------------------------------------
   startSector(k) — begin a run.

   Resets everything that is run-specific (quarter, history, ledger, all
   overrides and edits), adopts the sector's own defaults for the four
   fields that genuinely differ by industry, and writes the five accent
   colours onto the document element so the whole stylesheet re-tints.

   Note what is NOT reset: the forecasting method, service level and other
   policy settings persist across a sector change, so you can carry a
   configuration from one industry to another and see how badly it travels.
   ---------------------------------------------------------- */
function startSector(k){
  var S=SECTORS[k];
  ST.sec=k; ST.q=1; ST.tab="tower"; ST.hist=[]; ST.log=[]; ST.sku={};
  ST.md={}; ST.plan={}; ST.hidden={}; ST.newSkus=[]; ST.coName=null; ST.selSku=S.skus[0].code;
  ST.g.mode=S.defMode; ST.g.incoterm=S.incoterm||"dap"; ST.g.holdRate=S.holdRate; ST.g.dso=S.dso; ST.g.dpo=S.dpo;
  document.documentElement.style.setProperty("--acc",S.acc);
  document.documentElement.style.setProperty("--accSoft",S.accSoft);
  document.documentElement.style.setProperty("--accInk",S.accInk);
  document.documentElement.style.setProperty("--onAcc",S.onAcc);
  document.documentElement.style.setProperty("--accHi",S.accHi);

  render();
  window.scrollTo(0,0);
}

/* ----------------------------------------------------------
   THE LEDGER — measure the consequence of a change.

   LEDGER_KEYS lists the six KPIs every change is scored against.
     k     the field on the computeAll() result
     n     display name
     f     formatter for the absolute value
     good  +1 if rising is an improvement, −1 if falling is
     w     weight, reserved for a future composite score

   These six are deliberately chosen to pull against each other: service and
   resilience want to rise while inventory, cash days and carbon want to
   fall, and margin sits in the middle. A change that improves all six at
   once is genuinely rare, and the ledger exists to make that visible.
   ---------------------------------------------------------- */
var LEDGER_KEYS=[
  {k:"otif",     n:"OTIF",      f:function(v){return pct(v,1);},  good:1, w:1},
  {k:"margin",   n:"Margin",    f:function(v){return pct(v,1);},  good:1, w:1},
  {k:"invVal",   n:"Inventory", f:function(v){return money(v);},  good:-1,w:1},
  {k:"c2c",      n:"Cash days", f:function(v){return fm(v,0)+"d";},good:-1,w:1},
  {k:"co2Int",   n:"Carbon",    f:function(v){return fm(v,1)+"kg";},good:-1,w:1},
  {k:"resilience",n:"Resilience",f:function(v){return fm(v,0);},   good:1, w:1}
];

/* applyChange(label, fromTxt, toTxt, mutate, why)
   ------------------------------------------------
   The heart of the teaching mechanism. It:
     1  computes the whole company BEFORE the change
     2  runs the caller's mutate() function, which alters exactly one field
     3  computes the whole company AFTER
     4  diffs the six ledger KPIs
     5  drops anything that did not move (|delta| < 1e-9)
     6  classifies the change: up if nothing got worse, down if nothing got
        better, mix otherwise — and mix is by far the most common
     7  pushes onto the front of the log, trimming to 50 entries

   This is only possible because computeAll() is pure: calling it twice with
   different state has no side effects and no cached values to invalidate.
*/
function applyChange(label,fromTxt,toTxt,mutate,why){
  var before=computeAll(ST);
  mutate();
  var after=computeAll(ST);
  var deltas=LEDGER_KEYS.map(function(K){
    var d=after[K.k]-before[K.k];
    return {n:K.n,d:d,txt:K.f(after[K.k]),
      sign:Math.abs(d)<1e-9?0:(d>0?1:-1),
      /* good is +1 when the direction of movement matches the metric's
         preferred direction, −1 when it does not */
      good:Math.abs(d)<1e-9?0:((d>0?1:-1)===K.good?1:-1),
      /* the displayed delta, formatted per metric with an explicit + sign */
      disp:(d>0?"+":"")+ (K.k==="invVal"? money(d) : K.k==="co2Int"? fm(d,2)+"kg" : K.k==="c2c"? fm(d,1)+"d" : fm(d,2)) };
  }).filter(function(x){return x.sign!==0;});
  var goods=deltas.filter(function(d){return d.good>0;}).length;
  var bads=deltas.filter(function(d){return d.good<0;}).length;
  ST.log.unshift({label:label,from:fromTxt,to:toTxt,deltas:deltas,why:why||"",
    tone:bads===0&&goods>0?"up":goods===0&&bads>0?"down":"mix", q:ST.q});
  if(ST.log.length>50) ST.log.pop();
}

/* setG(key,val,...): change a GLOBAL control and log it.
   The early return on an unchanged value stops a slider that was dragged
   and released in the same place from filling the ledger with noise.
   fmtV is an optional formatter so the ledger reads "95% → 99%" rather
   than "95 → 99". */
function setG(key,val,label,fmtV,why){
  var old=ST.g[key];
  if(old===val) return;
  applyChange(label||key, fmtV?fmtV(old):String(old), fmtV?fmtV(val):String(val),
    function(){ST.g[key]=val;}, why);
}

/* setSku(code,field,val,...): change a PER-LINE override and log it.
   An override that did not previously exist shows as "default → 99%", which
   is more honest than inventing the inherited value. */
function setSku(code,field,val,label,fmtV,why){
  if(!ST.sku[code])ST.sku[code]={};
  var old=ST.sku[code][field];
  if(old===val) return;
  applyChange(code+" · "+(label||field), old==null?"default":(fmtV?fmtV(old):String(old)),
    fmtV?fmtV(val):String(val), function(){ST.sku[code][field]=val;}, why);
}

/* ----------------------------------------------------------
   closeQuarter() — advance time.

   Snapshots the CURRENT quarter's results into ST.hist before incrementing,
   which is why the history array is always one behind the live quarter. The
   snapshot deliberately stores derived KPIs rather than the whole model
   object: the trend charts only need these fourteen fields, and keeping the
   record small means a full run is a few kilobytes.

   `ev` and `mit` are the two fields that make the review screen possible:
   they record not just that a disruption happened, but whether the
   configuration you were running at the time absorbed it.
   ---------------------------------------------------------- */
function closeQuarter(){
  if(ST.q>8) return;
  var M=computeAll(ST);
  ST.hist.push({q:ST.q,otif:M.otif,margin:M.margin,inv:M.bsInv,c2c:M.c2c,co2:M.co2Int,
    res:M.resilience,mape:M.mape,util:M.util,profit:M.profit,rev:M.revenue,turns:M.turns,
    ev:M.ev?M.ev.name:null,mit:M.mitigated,bull:M.bullwhip});
  ST.q++;
  if(ST.q>8) ST.tab="review";      /* the year ends on the S&OP review screen */
  render(); window.scrollTo(0,0);
}

/* ==========================================================
   SHELL
   ========================================================== */

/* TABS is populated by sections 7 and 9. Each entry is:
     n       display name fallback
     html(M) build the screen's structure once
     live(M) optional: {key: html} written into [data-live] nodes on repaint
     cells(M)optional: {key: html} written into [data-cell] nodes
     charts(M)optional:{key: svg}  written into [data-chart] nodes
   The three optional maps exist so a repaint can refresh figures without
   destroying inputs that currently hold focus. */
var TABS={};

/* TAB_ORDER is the narrative sequence, not the definition order: it follows
   the chain as it actually works, from the tower down through demand,
   inventory and supply, out to logistics, and back to money and risk. It
   also drives the step rail, the pager and the keyboard arrows. */
var TAB_ORDER=["tower","data","demand","inventory","plan","sourcing","production","logistics","warehouse","finance","risk","review","library"];

/* ----------------------------------------------------------
   render() — rebuild the entire page.

   Structure emitted:
     #chrome
       header#top   brand, quarter pips, close/restart buttons, alert bar
       .board       the eight KPI tiles (filled by paintBoard)
       nav#rail     the thirteen numbered steps
     main
       #view        chapter + screen + pager
       #side        ledger, diagnosis, glossary (filled by paintSide)

   Then paint() fills in every live region, and measureChrome() records the
   header height so the sticky side rail can offset itself correctly.
   ---------------------------------------------------------- */
function render(){
  if(!ST.sec){ renderLaunch(); return; }
  var S=SECTORS[ST.sec];
  var h='<div id="chrome"><header id="top"><div class="wrap">';
  h+='<div class="topbar">';
  h+='<div class="brandmark"><div class="beacon"></div><div class="brandtxt">'+
     '<div class="co">'+esc(ST.coName||S.company)+' · '+esc(S.site)+'</div>'+
     '<div class="ttl">Supply Chain Control Tower</div></div></div>';
  h+='<div class="spacer"></div>';
  h+='<div class="qmeta"><div class="qdots">';
  /* eight pips: done, now, or pending */
  for(var i=1;i<=8;i++) h+='<div class="qdot '+(i<ST.q?"done":i===ST.q&&ST.q<=8?"now":"")+'" title="Quarter '+i+'"></div>';
  h+='</div>';
  h+='<span class="qtxt num">'+(ST.q>8?"Year 2 complete":"Quarter "+ST.q+" of 8")+'</span>';
  if(ST.q<=8) h+='<button class="btn" data-act="close">Close quarter &rarr;</button>';
  h+='<button class="btn ghost" data-act="restart">Change sector</button></div>';
  h+='</div>';

  /* the model is computed once here and passed down; nothing below
     recomputes it, so the header and the screen can never disagree */
  var M=computeAll(ST);
  if(M.ev && ST.q<=8){
    h+='<div class="alertbar '+(M.mitigated?"mit":"live")+'">'+
       '<span class="tagpill">'+(M.mitigated?"ABSORBED":"LIVE DISRUPTION")+'</span>'+
       '<span><b>'+esc(M.ev.name)+'</b>: '+esc(M.ev.desc)+
       (M.mitigated?' <b>Your configuration absorbed most of it.</b>':
                    ' <b>Full impact is landing on service and cost.</b>')+'</span></div>';
  }
  h+='<div class="board" id="board"></div>';
  h+='</div></header>';

  /* the step rail: everything before the current tab is marked done and
     shows a tick, which turns the tab strip into a progress thread */
  var here=TAB_ORDER.indexOf(ST.tab);
  h+='<nav id="rail"><div class="wrap"><div class="rails">';
  TAB_ORDER.forEach(function(k,i){
    if(!TABS[k])return;
    var st = i===here?"on":i<here?"done":"";
    h+='<button class="step '+st+'" data-tab="'+k+'" title="Step '+(i+1)+', '+esc(TABS[k].n)+'">'+
       '<span class="bead">'+(i<here?"✓":(i+1))+'</span>'+
       '<span class="nm">'+esc(CHAPTERS[k]?CHAPTERS[k].n:TABS[k].n)+'</span></button>';
  });
  h+='</div></div></nav></div>';

  h+='<main><div id="view"></div><aside id="side"></aside></main>';
  $("#app").innerHTML=h;
  /* chapter header + the screen itself + previous/next navigation */
  $("#view").innerHTML=chapter(ST.tab)+TABS[ST.tab].html(M)+pager(ST.tab);
  paint();
  measureChrome();
}

/* measureChrome(): record the real header height in --chromeH so the sticky
   side rail can sit exactly below it. The >40px guard rejects a measurement
   taken before layout has settled, in which case the CSS fallback stands. */
function measureChrome(){
  var c=$("#chrome");
  if(!c||!c.getBoundingClientRect) return;
  var hgt=Math.ceil(c.getBoundingClientRect().height);
  /* only trust a real measurement; otherwise keep the CSS fallback */
  if(hgt>40) document.documentElement.style.setProperty("--chromeH",hgt+"px");
}
/* the header reflows when the topbar wraps, so re-measure on resize */
if(typeof window!=="undefined" && window.addEventListener)
  window.addEventListener("resize",function(){ if(ST.sec) measureChrome(); });

/* ----------------------------------------------------------
   paint() — refresh figures without rebuilding structure.

   Called on every slider move, every keystroke in the item file, and every
   segmented-button click. It recomputes the model once and then writes into
   three families of placeholder:
     [data-live="k"]  from TABS[tab].live(M)
     [data-cell="k"]  from TABS[tab].cells(M)
     [data-chart="k"] from TABS[tab].charts(M)
   Each map is optional, and a key with no matching node is silently ignored,
   which lets a screen share one live() across several layouts.
   ---------------------------------------------------------- */
function paint(){
  if(!ST.sec)return;
  var M=computeAll(ST);
  paintBoard(M);
  var T=TABS[ST.tab];
  if(T.live){ var L=T.live(M);
    Object.keys(L).forEach(function(k){
      $$('[data-live="'+k+'"]').forEach(function(e){ e.innerHTML=L[k]; }); }); }
  if(T.cells){ var CE=T.cells(M);
    Object.keys(CE).forEach(function(k){
      $$('[data-cell="'+k+'"]').forEach(function(e){ e.innerHTML=CE[k]; }); }); }
  if(T.charts){ var C=T.charts(M);
    Object.keys(C).forEach(function(k){
      $$('[data-chart="'+k+'"]').forEach(function(e){ e.innerHTML=C[k]; }); }); }
  paintSide(M);
}

/* tone(v,good,lo,hi): the universal three-state classifier.
     good truthy  → higher is better: >=hi good, >=lo warn, else bad
     good falsy   → lower is better:  <=lo good, <=hi warn, else bad
   Returns the class name, so a caller can use it directly or map it to the
   single-letter table classes g/w/b. */
function tone(v,good,lo,hi){
  if(good) return v>=hi?"good":v>=lo?"warn":"bad";
  return v<=lo?"good":v<=hi?"warn":"bad";
}

/* paintBoard(M): the eight KPI tiles.
   Each tile carries a value, a status class, a sub-caption and, where a
   previous quarter exists, a direction arrow. The arrow is judged on
   whether the movement was in the metric's GOOD direction, not on whether
   it went up, which is why inventory falling shows a green marker. */
function paintBoard(M){
  var b=$("#board"); if(!b)return;
  var prev=ST.hist.length?ST.hist[ST.hist.length-1]:null;
  var arrow=function(now,was,good){
    if(was==null)return "";
    var d=now-was; if(Math.abs(d)<0.05)return "";      /* ignore noise */
    var up=d>0, ok=(up===(good>0));
    return '<span class="arrow"><span class="mk '+(ok?"good":"bad")+'"></span>'+(up?"▲":"▼")+'</span>';
  };
  var K=[
    {id:"otif",k:"OTIF",v:pct(M.otif,1),t:tone(M.otif,1,88,95),s:"on-time "+pct(M.onTime,1)+" · in-full "+pct(M.fill,1),a:arrow(M.otif,prev&&prev.otif,1)},
    {id:"margin",k:"Margin",v:pct(M.margin,1),t:tone(M.margin,1,6,14),s:money(M.profit)+" profit",a:arrow(M.margin,prev&&prev.margin,1)},
    /* inventory is toned by DIO rather than by value, because a euro figure
       has no universal threshold but days of stock does */
    {id:"bsInv",k:"Inventory",v:money(M.bsInv),t:tone(M.dio,0,55,85),s:fm(M.dio,0)+"d · incl "+money(M.pipeVal)+" in transit",a:arrow(M.bsInv,prev&&prev.inv,-1)},
    {id:"c2c",k:"Cash-to-cash",v:fm(M.c2c,0),t:tone(M.c2c,0,45,75),s:"days · DIO+DSO−DPO",a:arrow(M.c2c,prev&&prev.c2c,-1)},
    /* utilisation is the one mid-range metric here, so it gets a bespoke
       ladder rather than tone(): bad above 100, warn above 90 AND below 50 */
    {id:"util",k:"Utilisation",v:pct(M.util,0),t:M.util>100?"bad":M.util>90?"warn":M.util<50?"warn":"good",s:"OEE "+pct(M.oee,0),a:""},
    {id:"mape",k:"Forecast error",v:pct(M.mape,1),t:tone(M.mape,0,12,25),s:"bias "+(M.bias>0?"+":"")+fm(M.bias,1)+"%",a:arrow(M.mape,prev&&prev.mape,-1)},
    {id:"co2Int",k:"Carbon intensity",v:fm(M.co2Int,1),t:tone(M.co2Int,0,3,12),s:"kg CO2e per €1k revenue",a:""},
    {id:"resilience",k:"Resilience",v:fm(M.resilience,0),t:tone(M.resilience,1,45,70),s:"TTS "+fm(M.tts,0)+"d vs TTR "+fm(M.ttr,0)+"d",a:arrow(M.resilience,prev&&prev.res,1)}
  ];
  b.innerHTML=K.map(function(x){
    return '<div class="kpi '+x.t+'"><div class="k">'+x.k+dirMini(x.id)+'</div>'+
      '<div class="v">'+x.v+x.a+'</div><div class="s">'+x.s+'</div></div>';}).join("");
}

/* ----------------------------------------------------------
   paintSide(M) — the three persistent panels.

     1  Change impact   the ledger, newest 14 entries
     2  Diagnosis       the top five findings from coach()
     3  Look it up      a live glossary search

   The whole rail is rebuilt on every paint, which is cheap and means the
   ledger cannot drift out of sync. The search box's value is re-emitted
   from state so the text survives that rebuild.
   ---------------------------------------------------------- */
function paintSide(M){
  var el=$("#side"); if(!el)return;
  var h="";

  /* impact ledger */
  h+='<div class="card"><div class="cardhead"><h3>Change impact</h3>'+
     '<span class="eyebrow">'+ST.log.length+' logged</span></div>';
  if(!ST.log.length){
    h+='<p class="hint" style="margin:0">Move any control and the measured before/after lands here, service, margin, inventory, cash, carbon and resilience, all at once. That simultaneous movement is the entire discipline.</p>';
  } else {
    h+='<div class="ledger">';
    ST.log.slice(0,14).forEach(function(L){
      h+='<div class="lgi '+L.tone+'"><span class="t">'+esc(L.label)+'</span>'+
         '<span class="d"><s>'+esc(L.from)+'</s> &rarr; '+esc(L.to)+'</span>';
      h+='<span class="d">'+L.deltas.map(function(d){
        return d.n+' <span class="delta '+(d.good>0?"p":"n")+'">'+d.disp+'</span>';}).join(" · ")+'</span>';
      if(L.why) h+='<span class="why">'+esc(L.why)+'</span>';
      h+='</div>';
    });
    h+='</div><button class="btn lite sm" data-act="clearlog" style="width:100%;margin-top:6px">Clear ledger</button>';
  }
  h+='</div>';

  /* coach */
  var adv=coach(M);
  h+='<div class="card"><div class="cardhead"><h3>Diagnosis</h3><span class="eyebrow">live</span></div>';
  adv.slice(0,5).forEach(function(a){
    h+='<div class="note '+a.t+'"><span class="h">'+esc(a.h)+'</span>'+a.b+'</div>';});
  h+='</div>';

  /* glossary lookup */
  h+='<div class="card"><div class="cardhead"><h3>Look it up</h3><span class="eyebrow">'+GLOSSARY.length+' terms</span></div>'+
     '<input class="searchbox" id="gs" placeholder="safety stock, OTIF, QP…" value="'+esc(ST.gloss)+'">'+
     '<div class="glosslist" id="gl"></div></div>';

  el.innerHTML=h;
  paintGloss();
  var gs=$("#gs");
  if(gs) gs.addEventListener("input",function(){ST.gloss=gs.value;paintGloss();});
}

/* paintGloss(): filter the glossary on term, definition OR category, so
   typing "pharma" finds the whole category and typing "buffer" finds
   definitions that never use the word "safety stock". With no query it
   shows six entries as a teaser rather than the full list. */
function paintGloss(){
  var el=$("#gl"); if(!el)return;
  var q=ST.gloss.trim().toLowerCase();
  var list=GLOSSARY.filter(function(g){
    return !q || g[0].toLowerCase().indexOf(q)>=0 || g[2].toLowerCase().indexOf(q)>=0 || g[1].toLowerCase().indexOf(q)>=0;});
  if(!q) list=list.slice(0,6);
  if(!list.length){ el.innerHTML='<p class="hint" style="margin:8px 0 0">No match. Try a shorter word, or open the Library tab for the full glossary, formula sheet and Incoterms.</p>'; return; }
  el.innerHTML=list.slice(0,40).map(function(g){
    return '<div class="gl"><div class="cat">'+esc(g[1])+'</div><div class="t">'+esc(g[0])+'</div><div class="d">'+esc(g[2])+'</div></div>';
  }).join("");
}

/* ----------------------------------------------------------
   coach(M) — the diagnosis engine.

   A rule list, evaluated top to bottom against the live model. Each rule
   that fires pushes {t: tone, h: heading, b: body}. The side rail shows the
   first five, so ORDER IS PRIORITY: capacity shortfall is tested first
   because no inventory setting can fix a capacity gap, and the "balanced
   configuration" message is last because it only fires when nothing else did.

   Every message states the number that triggered it and names the specific
   control that would change it. A diagnosis that says "service is low"
   without saying which factor is lower is not worth showing.
   ---------------------------------------------------------- */
function coach(M){
  var g=ST.g,S=M.S,out=[];
  /* 1. capacity: the constraint that overrides everything else */
  if(M.shortfall>0.015) out.push({t:"bad",h:"Capacity is the constraint",
    b:"Demand of "+qty(M.totalDem)+" exceeds effective capacity of "+qty(M.capacity)+". You are short <b>"+pct(M.shortfall*100,1)+
      "</b> before inventory policy even gets a say. Add a shift, raise batch length, run SMED, or lift OEE, no safety stock setting can fix a capacity gap."});
  /* 2. queueing: fires only when there is no outright shortfall, because
     otherwise the shortfall message already covers it */
  if(M.util>95&&M.shortfall<=0.015) out.push({t:"warn",h:"Queueing is starting to bite",
    b:"At "+pct(M.util,0)+" utilisation, queue time rises exponentially rather than linearly. This is why a plant running at 98% has worse lead times than one at 85%, and why everyone blames planning."});
  /* 3. forecast error, with the diagnosis branching on the likely cause */
  if(M.mape>18) out.push({t:"bad",h:"Forecast error is expensive",
    b:"MAPE of "+pct(M.mape,1)+" inflates every safety stock in the portfolio. "+
      (g.promo&&Math.abs(g.forecastAdj)<20?"A promotion is running and your forecast is barely lifted, so you are planning for a week that is not going to happen.":
       METHODS[g.method].season?"Seasonality is being modelled, so the error is coming from volatility or alpha.":
       "Your method does not model seasonality, and several SKUs here are strongly seasonal. Try Holt-Winters.")});
  /* 4. bias is a separate defect from error, and needs a different cure */
  if(Math.abs(M.bias)>7) out.push({t:"warn",h:"You have a bias, not just an error",
    b:"Average bias is <b>"+(M.bias>0?"+":"")+pct(M.bias,1)+"</b>. "+(M.bias>0?
      "Persistent over-forecasting builds inventory you will write off later. Bias is a planning defect, buffer does not fix it, it only hides it.":
      "Persistent under-forecasting means you are chronically short and firefighting. Service will never stabilise until this is corrected.")});
  /* 5. inventory weight */
  if(M.dio>90) out.push({t:"warn",h:"Inventory is heavy",
    b:fm(M.dio,0)+" days of stock, "+money(M.invVal)+" of cash. Cash-to-cash is "+fm(M.c2c,0)+
      " days. Ask which of these SKUs actually needs "+g.service+"%, the AX items earn it, the CZ items rarely do."});
  /* 6. service, decomposed so the weaker factor is obvious */
  if(M.otif<90) out.push({t:"bad",h:"Service is below the line",
    b:"OTIF "+pct(M.otif,1)+" = on-time "+pct(M.onTime,1)+" × in-full "+pct(M.fill,1)+
      ". Fix whichever factor is lower first, they multiply, so the weaker one dominates."});
  /* 7. the recovery gap, in days rather than in colours */
  if(M.exposure>25) out.push({t:"bad",h:"Recovery gap",
    b:"Your critical SKUs survive "+fm(M.tts,0)+" days without supply; recovery takes "+fm(M.ttr,0)+
      " days. That is <b>"+fm(M.exposure,0)+" days of exposure</b>. Dual sourcing cuts TTR; more cover raises TTS. Both cost money, and this is the trade you are being paid to make."});
  /* 8. decay, phrased differently for tech (value) and everyone else (shelf) */
  if(M.waste>M.profit*0.12&&M.waste>0) out.push({t:"warn",h:"Decay is eating the margin",
    b:money(M.waste)+" lost to "+(S.key==="tech"?"value decay on ageing stock":"shelf-life write-off")+
      " this quarter, "+pct(M.waste/Math.max(M.revenue,1)*100,1)+" of revenue. "+
      (S.key==="tech"?"Every extra week of cover is a real margin loss here, not a theoretical one.":"Cut cover on the short-life lines, and check FEFO is actually enforced.")});
  /* 9. always fires under single sourcing: it is a standing exposure, not
     an error, so it is framed as a priced insurance decision */
  if(g.sourcing==="single") out.push({t:"warn",h:"Single source everywhere",
    b:"Every A item runs on one supplier. TTR is "+fm(M.ttr,0)+" days"+(S.key==="pharma"?", because a regulatory variation is required to change API source":"")+
      ". Dual sourcing costs about 1.8% per unit, that is the premium on the insurance policy."});
  /* 10. bullwhip */
  if(M.bullwhip>1.5) out.push({t:"warn",h:"You are amplifying demand",
    b:"Bullwhip ratio "+fm(M.bullwhip,2)+", your order variability is "+pct((M.bullwhip-1)*100,0)+
      " above true demand variability. Big batches, promotion spikes and forecast error all feed this."});
  /* 11-12. pharma only */
  if(S.key==="pharma"&&g.cold==="passive"&&g.mode!=="reefer") out.push({t:"bad",h:"Cold chain is exposed",
    b:"Passive shippers on a non-refrigerated lane, with 2-8°C product in the portfolio. An excursion does not automatically destroy stock, but it does freeze it pending QP assessment, a service failure either way."});
  if(S.key==="pharma"&&g.qpDays>12) out.push({t:"warn",h:"Release is your hidden lead time",
    b:g.qpDays+" days of QP release sits on top of every manufacturing lead time and creates "+
      qty(sum(M.rows.map(function(r){return r.quarantine;})))+" units of quarantine stock, physically present, financially owned, commercially unavailable."});
  /* 13. load factor */
  if(g.fill<65) out.push({t:"warn",h:"You are shipping air",
    b:"Vehicles at "+g.fill+"% fill. Cost and CO2 per unit rise steeply below about 75%, an empty half-trailer costs the same to move as a full one."});
  /* fallback: never leave the panel empty */
  if(!out.length) out.push({t:"good",h:"Balanced configuration",
    b:"No dominant failure mode right now. Push a control to an extreme and watch which KPI breaks first, that is the fastest way to feel where the real constraint sits."});
  return out;
}

/* ==========================================================
   GLOBAL EVENT WIRING

   Four delegated listeners on `document`, attached once at load:
     click     navigation, segmented buttons, switches, all actions
     keydown   left/right arrows move between screens
     input     typed numbers, item file, planning book, game fields
     input     (a second one) range sliders specifically
     change    <select> elements in the item file

   Delegation is essential here: render() replaces the entire DOM, so any
   listener attached to a button would be destroyed on the next repaint.
   ========================================================== */

/* ---------- click ----------
   One closest() call collects every actionable attribute, then the handler
   dispatches on which attribute is present. Order matters only where two
   could co-occur, which is why the specific game handlers are tested before
   the generic ones.

   Attribute vocabulary:
     data-pick    choose a sector and start
     data-ltab    switch landing screen (or enter the game)
     data-grole   game: switch role tab
     data-gact    game: next / restart / quit
     data-gseg    game: segmented control
     data-lcat    primer glossary category
     data-tab     switch simulator screen
     data-selsku  select a product line
     data-gcat    Library glossary category
     data-act     everything else, dispatched on its value
     data-seg     a segmented control in the simulator
     data-sw      a switch
*/
document.addEventListener("click",function(e){
  var t=e.target.closest? e.target.closest("[data-pick],[data-act],[data-tab],[data-ltab],[data-lcat],[data-seg],[data-sw],[data-selsku],[data-gcat],[data-grole],[data-gact],[data-gseg]") : null;
  if(!t)return;
  if(t.hasAttribute("data-pick")){ startSector(t.getAttribute("data-pick")); return; }
  if(t.hasAttribute("data-ltab")){
    var lt=t.getAttribute("data-ltab");
    /* "play" is not a landing tab: it enters the four-role game, which owns
       its own render path and needs a fixed green accent */
    if(lt==="play"){ ST.sec=null; ST.game=gameInit();
      document.documentElement.style.setProperty("--acc","#00A67D");
      document.documentElement.style.setProperty("--accSoft","#E2F7F0");
      document.documentElement.style.setProperty("--accInk","#05664A");
      document.documentElement.style.setProperty("--onAcc","#06231A");
      document.documentElement.style.setProperty("--accHi","#B6EEDF");
      renderGame(); window.scrollTo(0,0); return; }
    /* leaving for a landing screen clears the game and drops the accent
       overrides so the neutral blue fallback in :root takes over */
    ST.game=null; ST.launchTab=lt;
    ["acc","accSoft","accInk","onAcc","accHi"].forEach(function(k){ document.documentElement.style.removeProperty("--"+k); });
    renderLaunch(); window.scrollTo(0,0); return;
  }
  if(t.hasAttribute("data-grole")){ ST.game.role=t.getAttribute("data-grole"); renderGame(); window.scrollTo(0,0); return; }
  if(t.hasAttribute("data-gact")){
    var ga=t.getAttribute("data-gact");
    if(ga==="next") gameClose();
    else if(ga==="restart"){ ST.game=gameInit(); renderGame(); window.scrollTo(0,0); }
    else if(ga==="quit"){ ST.game=null; ST.launchTab="home";
      ["acc","accSoft","accInk","onAcc","accHi"].forEach(function(k){ document.documentElement.style.removeProperty("--"+k); });
      renderLaunch(); window.scrollTo(0,0); }
    return;
  }
  if(t.hasAttribute("data-gseg")){
    var gp=t.getAttribute("data-gseg"), gv=t.getAttribute("data-v");
    /* data-num marks a numeric value; without it everything is a string */
    gset(gp, t.hasAttribute("data-num")? Number(gv) : gv);
    renderGame(); return;
  }
  if(t.hasAttribute("data-lcat")){
    /* the primer's category chips update in place rather than re-rendering
       the whole page, because the page is very long and scroll position
       matters */
    ST.lcat=t.getAttribute("data-lcat");
    $$("[data-lcat]").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lcat")===ST.lcat); });
    paintLearnGloss(); return;
  }
  if(t.hasAttribute("data-tab")){ ST.tab=t.getAttribute("data-tab"); render(); window.scrollTo(0,0); return; }
  if(t.hasAttribute("data-selsku")){ ST.selSku=t.getAttribute("data-selsku"); render(); return; }
  if(t.hasAttribute("data-gcat")){ ST.glossCat=t.getAttribute("data-gcat"); render(); return; }
  if(t.hasAttribute("data-act")){
    var a=t.getAttribute("data-act");
    if(a==="close") closeQuarter();
    else if(a==="restart"){
      ST.sec=null; ST.launchTab="start";
      ["acc","accSoft","accInk","onAcc","accHi"].forEach(function(k){
        document.documentElement.style.removeProperty("--"+k); });
      render();
    }
    else if(a==="clearlog"){ ST.log=[]; paint(); }
    else if(a==="reset"){ ST.sku={}; render(); }                 /* clear per-SKU overrides */
    else if(a==="addsku"){ ST.newSkus.push(newSku(SECTORS[ST.sec])); render(); }
    else if(a==="delsku"){
      /* hide rather than delete, so the seeded data stays intact and
         "reset to seeded values" can bring the line back */
      var code=t.getAttribute("data-code");
      if(skuList(SECTORS[ST.sec]).length<=1) return;             /* never empty the portfolio */
      ST.hidden[code]=true; delete ST.plan[code];
      if(ST.selSku===code) ST.selSku=skuList(SECTORS[ST.sec])[0].code;
      render();
    }
    else if(a==="resetmd"){ ST.md={}; ST.hidden={}; ST.newSkus=[]; ST.coName=null; render(); }
    else if(a==="autoplan"){
      /* fill the planning book with what a reorder point policy would do */
      var Mn=computeAll(ST), rr=Mn.rows.filter(function(x){return x.sk.code===ST.selSku;})[0];
      planOf(ST.selSku).rec=autoPlan(rr); render();
    }
    else if(a==="clearplan"){ planOf(ST.selSku).rec=new Array(WK).fill(0); render(); }
    else if(a==="resetfc"){ var P=planOf(ST.selSku); delete P.fc; delete P.firm; render(); }
    else if(a==="save"){
      /* serialise into the textarea and select it, so the next keystroke
         is a copy rather than a clipboard permission prompt */
      var box=$("#scen"); if(box){ box.value=scenarioText();
        box.select(); $("#scenmsg").textContent="Copied into the box. Select all and copy it somewhere safe."; }
    }
    else if(a==="load"){
      var b2=$("#scen"), msg=$("#scenmsg");
      try{ loadScenario(b2.value); render(); }
      catch(err){ if(msg) msg.textContent="Could not read that. Paste the whole box contents, including the outer braces."; }
    }
    return;
  }
  if(t.hasAttribute("data-seg")){
    /* a segmented control. The value arrives as a string, so three
       conversions are possible: numeric (data-num), boolean, or left alone. */
    var key=t.getAttribute("data-seg"), val=t.getAttribute("data-v"),
        lab=t.getAttribute("data-lab")||key, why=t.getAttribute("data-why")||"",
        sku=t.getAttribute("data-sku"), num=t.hasAttribute("data-num");
    var v = num? Number(val) : (val==="true"?true:val==="false"?false:val);
    if(sku) setSku(sku,key,v,lab,null,why); else setG(key,v,lab,null,why);
    /* update the pressed state immediately, scoped to this control group
       and, if present, to this SKU, so a per-line override does not toggle
       the portfolio-level control of the same name */
    $$('[data-seg="'+key+'"]'+(sku?'[data-sku="'+sku+'"]':'')).forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-v")===val); });
    paint(); return;
  }
  if(t.hasAttribute("data-sw")){
    /* a switch simply inverts its boolean and formats as on/off in the ledger */
    var k=t.getAttribute("data-sw"), lb=t.getAttribute("data-lab")||k, wy=t.getAttribute("data-why")||"";
    setG(k,!ST.g[k],lb,function(v){return v?"on":"off";},wy);
    t.classList.toggle("on",!!ST.g[k]);
    paint(); return;
  }
});

/* ---------- keyboard ----------
   Left and right arrows walk TAB_ORDER. Guarded three ways: only inside a
   run, never while a form field has focus, and never with a modifier held,
   so browser shortcuts and text editing are unaffected. */
document.addEventListener("keydown",function(e){
  if(!ST.sec)return;
  var t=e.target, tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var i=TAB_ORDER.indexOf(ST.tab);
  if(e.key==="ArrowRight"&&i<TAB_ORDER.length-1){ ST.tab=TAB_ORDER[i+1]; render(); window.scrollTo(0,0); e.preventDefault(); }
  if(e.key==="ArrowLeft"&&i>0){ ST.tab=TAB_ORDER[i-1]; render(); window.scrollTo(0,0); e.preventDefault(); }
});

/* ---------- typed input ----------
   Four kinds of typed field share one listener, distinguished by attribute.

   THE DEBOUNCE PATTERN, used for the first two:
     - write the raw value into state immediately and paint(), so the screen
       responds on every keystroke
     - schedule the LOGGED change for later
   Without this, typing "1", "1.", "1.5" would create three ledger entries.
   The timers are module-level so a second keystroke cancels the first.

   Every numeric field is also clamped to its own min/max on the way in,
   so an out-of-range paste cannot produce a NaN cascade downstream. */
var numTimer=null, gameTimer=null;
document.addEventListener("input",function(e){
  var el=e.target;

  /* game decisions: the slider and its typed twin mirror each other, then a
     520ms debounce re-renders the whole game screen */
  if(el.hasAttribute&&(el.hasAttribute("data-gp")||el.hasAttribute("data-gpn"))){
    var gp=el.getAttribute("data-gp")||el.getAttribute("data-gpn");
    if(el.value==="") return;                    /* mid-edit empty field: wait */
    var gv=Number(el.value); if(!isFinite(gv)) return;
    var lo=el.min===""?null:Number(el.min), hi=el.max===""?null:Number(el.max);
    if(lo!=null&&gv<lo) gv=lo; if(hi!=null&&gv>hi) gv=hi;
    gset(gp,gv);
    /* keep the partner control in step without firing its own input event */
    var partner=el.hasAttribute("data-gp")? $('[data-gpn="'+gp+'"]') : $('[data-gp="'+gp+'"]');
    if(partner) partner.value=gv;
    clearTimeout(gameTimer);
    gameTimer=setTimeout(function(){ renderGame(); },520);
    return;
  }

  /* a number typed beside a slider */
  if(el.classList&&el.classList.contains("valin")){
    var key=el.getAttribute("data-gnum"), skc=el.getAttribute("data-snum"),
        lab=el.getAttribute("data-lab")||key, suf=el.getAttribute("data-suf")||"";
    if(el.value==="") return;
    var v=Number(el.value);
    if(!isFinite(v)) return;
    var lo=Number(el.min), hi=Number(el.max);
    if(isFinite(lo)&&v<lo) v=lo;
    if(isFinite(hi)&&v>hi) v=hi;
    /* move the matching range control. The :not([data-sku]) selector is what
       stops a portfolio-level field from grabbing a per-SKU slider. */
    var rng=$('input[type=range][data-g="'+key+'"]'+(skc?'[data-sku="'+skc+'"]':':not([data-sku])'));
    if(rng) rng.value=v;
    clearTimeout(numTimer);
    var apply=function(){
      if(skc) setSku(skc,key,v,lab,function(x){return x+suf;},"");
      else setG(key,v,lab,function(x){return x+suf;},"");
      paint();
    };
    /* immediate, unlogged write so the screen tracks the keystroke... */
    if(skc){ if(!ST.sku[skc])ST.sku[skc]={}; ST.sku[skc][key]=v; } else ST.g[key]=v;
    paint();
    /* ...then the logged version 600ms after typing stops */
    numTimer=setTimeout(apply,600);
    return;
  }

  /* the item file. data-md is "CODE:field". Three fields are text or enum
     and stored verbatim; everything else is numeric and clamped. Item file
     edits are NOT logged to the ledger, because changing the data is not the
     same kind of act as changing a policy. */
  if(el.hasAttribute&&el.hasAttribute("data-md")){
    var p=el.getAttribute("data-md").split(":"), code=p[0], f=p[1];
    if(!ST.md[code]) ST.md[code]={};
    if(f==="name"||f==="abc"||f==="xyz"){ ST.md[code][f]=el.value; }
    else {
      if(el.value==="") return;
      var n=Number(el.value); if(!isFinite(n)) return;
      var mn=el.min===""?null:Number(el.min), mx2=el.max===""?null:Number(el.max);
      if(mn!=null&&n<mn) n=mn;
      if(mx2!=null&&n>mx2) n=mx2;
      ST.md[code][f]=n;
    }
    paint();
    return;
  }

  /* the planning book. data-plan is "CODE:row" for the opening balance, or
     "CODE:row:weekIndex" for a grid cell. A row is copied from the computed
     default on first edit, so the user starts from the suggested numbers
     rather than from zeros. */
  if(el.hasAttribute&&el.hasAttribute("data-plan")){
    var q=el.getAttribute("data-plan").split(":"), c=q[0], row=q[1], wi=q[2];
    var P=planOf(c);
    if(el.value==="") return;
    var val=Math.max(0,Number(el.value)||0);       /* negatives are meaningless here */
    if(row==="open"){ P.open=val; }
    else {
      var Mnow=computeAll(ST), rr=Mnow.rows.filter(function(x){return x.sk.code===c;})[0];
      if(!P[row]){ var base=computeMps(rr); P[row]=base[row].slice(); }
      P[row][+wi]=val;
    }
    paint();
    return;
  }

  /* company name: updates the header directly rather than re-rendering,
     so the field does not lose focus mid-word */
  if(el.hasAttribute&&el.hasAttribute("data-co")){ ST.coName=el.value||null;
    var t=$(".brandtxt .co"); if(t) t.textContent=(ST.coName||SECTORS[ST.sec].company)+" · "+SECTORS[ST.sec].site;
    return; }
});

/* <select> fires `change`, not `input`, in some browsers, so the ABC and
   XYZ dropdowns in the item file need their own handler. */
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.hasAttribute&&el.hasAttribute("data-md")&&el.tagName==="SELECT"){
    var p=el.getAttribute("data-md").split(":");
    if(!ST.md[p[0]])ST.md[p[0]]={};
    ST.md[p[0]][p[1]]=el.value; paint();
  }
});

/* ---------- range sliders ----------
   A drag fires `input` continuously. The goal is a live screen but exactly
   ONE ledger entry per drag, recording where the drag started and where it
   finished. The trick:

     on the first event of a drag, stash the ORIGINAL value in slideStart
     on every event, write the new value and repaint (unlogged)
     420ms after the last event, temporarily restore the original value,
       then call setG/setSku with the final value

   That restore-then-set is what makes applyChange() measure the true
   before/after of the whole drag rather than the last pixel of it.
   slideStart is keyed by sku+key so two sliders can be dragged in sequence
   without interfering. */
var slideTimer=null, slideStart={};
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.type!=="range"||!el.hasAttribute("data-g"))return;
  var key=el.getAttribute("data-g"), sku=el.getAttribute("data-sku"),
      lab=el.getAttribute("data-lab")||key, suf=el.getAttribute("data-suf")||"",
      why=el.getAttribute("data-why")||"", v=Number(el.value);
  var id=(sku||"")+key;
  if(slideStart[id]==null) slideStart[id]= sku? (ST.sku[sku]&&ST.sku[sku][key]!=null?ST.sku[sku][key]:ST.g[key]) : ST.g[key];
  if(sku){ if(!ST.sku[sku])ST.sku[sku]={}; ST.sku[sku][key]=v; } else ST.g[key]=v;
  /* update the value pill beside the slider without a full repaint */
  var out=el.parentNode.querySelector(".val"); if(out) out.textContent=v+suf;
  clearTimeout(slideTimer);
  slideTimer=setTimeout(function(){
    var was=slideStart[id]; slideStart[id]=null;
    if(was!==v){
      var now=v;
      /* rewind, then apply properly so the ledger sees the full delta */
      if(sku){ ST.sku[sku][key]=was; } else ST.g[key]=was;
      if(sku) setSku(sku,key,now,lab,function(x){return x+suf;},why);
      else setG(key,now,lab,function(x){return x+suf;},why);
    }
    paint();
  },420);
  paint();
});
/* ==========================================================
   7 · THE SCREENS
   ----------------------------------------------------------
   Thirteen tabs, each an entry in TABS. Sections 7 and 9 fill
   that object; section 6 renders whatever it finds there.

   THE TAB CONTRACT
     TABS.x = {
       n:      display name (a fallback; CHAPTERS usually supplies it)
       html:   function(M) → the screen's STRUCTURE, built once per render
       live:   function(M) → {key: html} written into [data-live] nodes
       cells:  function(M) → {key: html} written into [data-cell] nodes
       charts: function(M) → {key: svg}  written into [data-chart] nodes
     }

   WHY THE SPLIT MATTERS
     html() emits placeholders, never figures. Everything that changes on a
     keystroke goes into live/cells/charts. That is what lets paint() refresh
     forty numbers without disturbing a text field that currently has focus,
     and it is why typing in the item file does not fight the cursor.

     The practical rule: if a value comes off M, it belongs in live();
     if it is a label, a heading or an explainer, it belongs in html().
   ========================================================== */

/* ----------------------------------------------------------
   CONTROL BUILDERS
   Three functions produce every interactive control in the simulator. All
   three emit the data-* attributes that section 6's delegated listeners
   read, which is why no control ever needs its own event handler.

   Shared options:
     g      the ST.g field this control writes
     label  the visible label, also used in the ledger
     sku    optional: make this a PER-LINE override instead of a global
     hint   the explanatory line underneath
     why    the ledger annotation, explaining what the lever actually does
   ---------------------------------------------------------- */

/* slider(o): a range input PLUS a typed number that mirror each other.
   The value resolution is the same three-step lookup used by the engine:
   per-SKU override, else global. Emitting both controls from one function
   guarantees their min/max/step can never drift apart. */
function slider(o){
  var v = o.sku? ((ST.sku[o.sku]&&ST.sku[o.sku][o.g]!=null)?ST.sku[o.sku][o.g]:ST.g[o.g]) : ST.g[o.g];
  return '<div class="ctl"><div class="lab"><b>'+esc(o.label)+'</b>'+
    '<span class="val"><input class="valin" type="number" inputmode="decimal" min="'+o.min+'" max="'+o.max+
      '" step="'+(o.step||1)+'" value="'+v+'" data-gnum="'+o.g+'"'+(o.sku?' data-snum="'+o.sku+'"':'')+
      ' data-lab="'+esc(o.label)+'" data-suf="'+(o.suf||"")+'" aria-label="'+esc(o.label)+' value">'+
      '<span class="vsuf">'+(o.suf||"")+'</span></span></div>'+
    '<input type="range" min="'+o.min+'" max="'+o.max+'" step="'+(o.step||1)+'" value="'+v+'" '+
    'data-g="'+o.g+'"'+(o.sku?' data-sku="'+o.sku+'"':'')+' data-lab="'+esc(o.label)+'" data-suf="'+(o.suf||"")+'" '+
    'data-why="'+esc(o.why||"")+'" aria-label="'+esc(o.label)+'">'+
    (o.hint?'<div class="hint">'+o.hint+'</div>':'')+'</div>';
}

/* seg(o): a segmented button group.
   opts is [{v: value, l: label}]. The comparison is done on STRINGS, because
   every attribute value is a string: String(v)===String(op.v) matches 95 to
   "95" correctly. Pass num:true to have the click handler convert back. */
function seg(o){
  var v = o.sku? ((ST.sku[o.sku]&&ST.sku[o.sku][o.g]!=null)?ST.sku[o.sku][o.g]:ST.g[o.g]) : ST.g[o.g];
  var h='<div class="ctl"><div class="lab"><b>'+esc(o.label)+'</b></div><div class="seg">';
  o.opts.forEach(function(op){
    h+='<button data-seg="'+o.g+'" data-v="'+op.v+'"'+(o.num?' data-num':'')+
       (o.sku?' data-sku="'+o.sku+'"':'')+' data-lab="'+esc(o.label)+'" data-why="'+esc(o.why||"")+'" '+
       'class="'+(String(v)===String(op.v)?"on":"")+'">'+esc(op.l)+'</button>';});
  h+='</div>'+(o.hint?'<div class="hint">'+o.hint+'</div>':'')+'</div>';
  return h;
}

/* sw(o): a boolean switch. Global only — there is no per-SKU variant,
   because every switch in the app is a company-wide programme. */
function sw(o){
  return '<div class="ctl"><button class="sw '+(ST.g[o.g]?"on":"")+'" data-sw="'+o.g+'" data-lab="'+esc(o.label)+
    '" data-why="'+esc(o.why||"")+'"><span class="knob"></span><span class="swtxt">'+esc(o.label)+
    (o.sub?'<small>'+o.sub+'</small>':'')+'</span></button></div>';
}

/* ----------------------------------------------------------
   CONTENT BUILDERS
   Five one-liners that keep the teaching furniture consistent. Every
   explainer, formula, verdict and field note in the app goes through one of
   these, which is why they all look the same everywhere.
   ---------------------------------------------------------- */

/* learn(title, body): a collapsible <details> explainer. Body is trusted
   HTML assembled by the caller; only the title is escaped. */
function learn(t,b){ return '<details class="learn"><summary>'+esc(t)+'</summary><div class="body">'+b+'</div></details>'; }
/* fx(formula, note): a formula card. */
function fx(f,n){ return '<div class="fx"><div class="f">'+f+'</div>'+(n?'<div class="n">'+n+'</div>':'')+'</div>'; }
/* nt(tone, heading, body): a verdict block. tone is "", good, warn or bad. */
function nt(t,h,b){ return '<div class="note '+t+'"><span class="h">'+esc(h)+'</span>'+b+'</div>'; }
/* minor(text): a field note, always labelled the same way. */
function minor(t){ return '<div class="minor"><span class="h">Field note</span>'+t+'</div>'; }
/* card(title, eyebrow, body, cls): the standard panel. Passing an empty
   title omits the header entirely, which is used for bare content blocks. */
function card(t,eyebrow,body,cls){
  return '<div class="card '+(cls||"")+'">'+(t?'<div class="cardhead"><h3>'+esc(t)+'</h3>'+
    (eyebrow?'<span class="eyebrow">'+esc(eyebrow)+'</span>':'')+'</div>':'')+body+'</div>';
}
/* legend(items): [[label, colour], ...] → the swatch strip under a chart. */
function legend(items){
  return '<div class="legend">'+items.map(function(i){
    return '<span><i style="background:'+i[1]+'"></i>'+esc(i[0])+'</span>';}).join("")+'</div>';
}
/* statline(label, value, cls): one label/value row with a hairline under it. */
function statline(l,v,cls){ return '<div class="statline"><span>'+l+'</span><span class="sv '+(cls||"")+'">'+v+'</span></div>'; }
/* sel(M): the currently selected row, falling back to the first line if the
   selection is stale — which happens after a product line is deleted. */
function sel(M){ return M.rows.filter(function(r){return r.sk.code===ST.selSku;})[0]||M.rows[0]; }

/* ----------------------------------------------------------
   weekly(sk,g,q,n) — a deterministic weekly demand series and the forecast
   your chosen method would have produced against it.

   This exists purely for TEACHING charts. It is not the engine: computeSku()
   works in quarterly aggregates, while this generates the week-by-week
   texture you need to see a forecast track, lag or miss.

   DETERMINISM
     seedRnd() is a linear congruential generator seeded from the SKU code
     and quarter. The same product in the same quarter always produces the
     same series, so the chart does not shimmer as you drag a slider — only
     the FORECAST line moves, which is exactly the comparison being taught.

   The actual series is built from four multiplicative components:
     baseQ/13         the weekly baseline
     seaSm            the seasonal index, smoothed 35% toward the next
                      quarter so the curve does not step at quarter ends
     promoW           a promotional spike in weeks 3-6 of each quarter
     noise            ±cv, scaled by 2.2 to make the variability visible

   The forecast branch then implements each method honestly:
     naive    yesterday's actual
     ma       a four-period moving average
     holt     level and trend, with beta fixed at 0.15
     hw       level deseasonalised by the quarter's index, then reseasonalised
     croston  a two-period average on Z items, a deliberately poor level
              estimate on everything else, matching the engine's view that
              Croston is the wrong tool for smooth demand
     expo     plain exponential smoothing, the default
   Finally the planner's promotional uplift is applied to the promo weeks,
   which is what makes the "uplift needed vs uplift set" gap visible.
   ---------------------------------------------------------- */
function seedRnd(str){ var s=0; for(var i=0;i<str.length;i++)s=(s*31+str.charCodeAt(i))%99991;
  return function(){ s=(s*9301+49297)%233280; return s/233280; }; }
function weekly(sk,g,q,n){
  n=n||16; var rnd=seedRnd(sk.code+q), act=[],lab=[];
  var cvB=sk.cv*(g.volatility?1.55:1);
  for(var i=0;i<n;i++){
    var qi=(q-1+Math.floor(i/13))%8, sea=sk.season[qi];
    /* blend toward the next quarter's index across the 13 weeks */
    var wk=(i%13)/13, seaNext=sk.season[(qi+1)%8], seaSm=sea+(seaNext-sea)*wk*0.35;
    /* a four-week promotion sits in weeks 3-6, at roughly twice the average
       quarterly uplift, because a promotion is concentrated not spread */
    var promoW=(g.promo&&sk.promo>0&&i%13>=3&&i%13<=6)? 1+0.55*sk.promo*2.1 : 1;
    var noise=1+(rnd()-0.5)*cvB*2.2;
    act.push(Math.max(0,sk.baseQ/13*seaSm*promoW*noise));
    lab.push("w"+(i+1));
  }
  /* build each method's forecast on the same series */
  var M=METHODS[g.method], fc=[], lvl=act[0], tr=0, alpha=g.alpha, beta=0.15;
  var seaIdx=[];
  for(var s2=0;s2<8;s2++) seaIdx.push(sk.season[s2]);
  for(var j=0;j<n;j++){
    var f;
    if(g.method==="naive")      f = j===0?act[0]:act[j-1];
    else if(g.method==="ma")    { var w=4,acc=0,c=0; for(var m=Math.max(0,j-w);m<j;m++){acc+=act[m];c++;} f=c?acc/c:act[0]; }
    else if(g.method==="holt")  { f=lvl+tr; var pl=lvl; lvl=alpha*act[j]+(1-alpha)*(lvl+tr); tr=beta*(lvl-pl)+(1-beta)*tr; }
    else if(g.method==="hw")    { var qi2=(q-1+Math.floor(j/13))%8; f=(lvl)*seaIdx[qi2]/ (seaIdx[(q-1)%8]||1);
                                  lvl=alpha*(act[j]/(seaIdx[qi2]||1))+(1-alpha)*lvl; }
    else if(g.method==="croston"){ f = sk.xyz==="Z"? (j<2?act[0]:(act[j-1]+act[j-2])/2*0.97) : lvl*0.86; lvl=alpha*act[j]+(1-alpha)*lvl; }
    else                        { f=lvl; lvl=alpha*act[j]+(1-alpha)*lvl; }
    /* planner override on promotion weeks */
    if(g.promo&&sk.promo>0&&j%13>=3&&j%13<=6) f=f*(1+(g.forecastAdj/100));
    fc.push(Math.max(0,f));
  }
  return {lab:lab,act:act,fc:fc};
}

    }

  },
  live:function(M){

    var foot='<tr><td>PORTFOLIO · '+M.rows.length+' lines</td><td></td><td>'+qty(M.totalDem)+'</td>'+
      '<td>'+fm(M.mape,1)+'%</td><td></td><td></td><td>'+fm(M.dio,0)+'d</td><td></td>'+
      '<td>'+money(M.invVal)+'</td><td>'+fm(M.fill,1)+'</td><td>'+fm(M.otif,1)+'</td>'+

  charts:function(M){
