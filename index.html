/* ==========================================================
   3 · THE KNOWLEDGE BASE
   ----------------------------------------------------------
   Four flat arrays. They are pure content, consumed in three
   places: the side-rail lookup box, the Library screen, and
   the primer on the landing page.

   Shapes:
     GLOSSARY  [term, CATEGORY, definition]
               CATEGORY drives the filter chips. Adding a new
               category needs no code change: the chip list is
               derived from the data with a uniqueness filter.
     FORMULAS  {g: group, f: expression, w: why it matters}
               `g` groups them into headings on the formula sheet.
     INCOTERMS [code, name, riskTransfers, costTransfers, note]
               The two middle columns exist as separate fields
               precisely because they are not always the same
               point, which is the whole teaching point.
     MINOR     [area, note]
               The field notes. Grouped by area at render time.

   Nothing here is referenced by the engine. Changing a
   definition cannot change a computed number.
   ========================================================== */

var GLOSSARY = [
/* --- demand: everything about predicting what will be wanted --- */
["Bullwhip effect","DEMAND","Small ripples in shop-floor demand become tidal waves upstream. A 5% blip at retail becomes 20% at the distributor and 60% at the factory. Caused by order batching, price promotions, rationing games and, most of all, everyone forecasting off the order stream above them instead of off real end demand."],
["MAPE","DEMAND","Mean Absolute Percentage Error. Average of |actual − forecast| ÷ actual. Easy to explain, but it explodes toward infinity on low-volume items and punishes under-forecasting more than over-forecasting. Never use it alone on intermittent demand."],
["WMAPE","DEMAND","Weighted MAPE: sum of absolute errors ÷ sum of actuals. Fixes MAPE's small-number problem by weighting by volume. This is what most real planning systems actually report."],
["Bias (forecast)","DEMAND","The average signed error. MAPE tells you how wrong you are; bias tells you which direction you are consistently wrong in. Persistent positive bias means you are systematically over-forecasting and building inventory you will write off."],
["Tracking signal","DEMAND","Running sum of forecast errors ÷ mean absolute deviation. If it drifts beyond about ±4, your forecast model has lost touch with reality and needs re-fitting. It is the smoke alarm on your forecast."],
["Exponential smoothing","DEMAND","Forecast = α × last actual + (1−α) × last forecast. A high α (0.5+) reacts fast and chases noise; a low α (0.1) is stable but slow to spot a real trend. Choosing α is choosing how much you believe the most recent week."],
["Holt's method","DEMAND","Exponential smoothing with a second equation for trend. Use when demand is genuinely growing or declining rather than just wobbling around a level."],
["Holt-Winters","DEMAND","Adds a third equation for seasonality. The workhorse for anything with an annual rhythm, ice cream, flu vaccine, mince pies."],
["Croston's method","DEMAND","Built for intermittent demand: spare parts, service items, anything with many zero periods and occasional spikes. It forecasts the size of a demand event and the interval between events separately. Applying normal smoothing to a spare part gives you a nonsense answer like 0.3 units a week."],
["Demand sensing","DEMAND","Using short-term downstream signals: POS scans, weather, web traffic, to adjust the near-horizon forecast. Improves weeks 1-4; does nothing for the 40-week silicon order."],
["Unconstrained forecast","DEMAND","What the market would buy if you could supply it all. Vital to record separately from the constrained plan, otherwise you lose all memory of the demand you turned away and forecast your own shortages forever."],
["Phantom demand","DEMAND","Orders that exist only because customers fear shortage, double ordering across suppliers, or padding to secure allocation. It evaporates the moment supply recovers, usually leaving you with a warehouse full of it."],
["Cannibalisation","DEMAND","New product takes volume from your own existing product rather than the competitor's. Forecast the pair, not the launch."],
["Halo effect","DEMAND","A promotion on one item lifting sales of a related item. Promote coffee, sell more biscuits."],

/* --- inventory: the largest category, because it is where the money sits --- */
["Safety stock","INVENTORY","Inventory held to absorb variability, not to meet expected demand. Its size is driven by the variability of demand AND of lead time, and by how sure you want to be. It is the price of uncertainty, paid in cash."],
["Cycle stock","INVENTORY","The inventory that exists purely because you order in batches rather than one unit at a time. Averages half the order quantity. Cut it by ordering more often, if your ordering and setup costs allow."],
["Pipeline stock","INVENTORY","Stock in transit that you own but cannot touch. On a 34-day ocean lane, pipeline stock alone can exceed everything in your warehouse. It appears on your balance sheet the moment Incoterms transfer risk."],
["EOQ","INVENTORY","Economic Order Quantity: the batch size where ordering cost and holding cost are equal, which is where their sum is minimised. Its great gift is that the cost curve is very flat near the optimum: being 30% off EOQ costs you only about 4% in total cost. Precision here is not worth agonising over."],
["Reorder point (ROP)","INVENTORY","Demand during lead time plus safety stock. When on-hand plus on-order minus backorders drops below it, you place an order. Note it is calculated on inventory POSITION, not on-hand, forgetting the on-order part is the single most common cause of double ordering."],
["Cycle service level","INVENTORY","The probability of NOT stocking out during a replenishment cycle. A 95% CSL means one cycle in twenty has a shortage. It says nothing about how big that shortage is."],
["Fill rate","INVENTORY","The fraction of demand met from stock. Different from cycle service level and usually higher. A 95% CSL might deliver a 99.3% fill rate, because most stockouts are small and brief. Customers experience fill rate; textbooks compute CSL."],
["Z-score / service factor","INVENTORY","The number of standard deviations of buffer you carry. 90% → 1.28, 95% → 1.65, 98% → 2.05, 99% → 2.33, 99.9% → 3.09. The relationship is brutally non-linear: the jump from 95% to 99.9% nearly doubles your safety stock for 4.9 percentage points of service."],
["Square-root law","INVENTORY","Total safety stock across N warehouses ≈ safety stock of one warehouse × √N. Consolidating from 9 depots to 1 cuts safety stock by two-thirds. This is the entire mathematical case for centralisation, before you add back the transport cost."],
["Risk pooling","INVENTORY","Aggregating variability so highs offset lows. Works across locations, products or time. The square-root law is risk pooling with the numbers filled in."],
["Postponement","INVENTORY","Hold product in generic form and finish it late, paint, label, localise, kit, after real demand is known. Turns many uncertain SKU forecasts into one much more accurate aggregate forecast."],
["ABC analysis","INVENTORY","Pareto by value: roughly 20% of items make 80% of value (A), the next 30% make 15% (B), and the last 50% make 5% (C). It tells you where to spend management attention."],
["XYZ analysis","INVENTORY","Pareto by predictability. X = steady and forecastable, Y = variable but patterned, Z = erratic. Cross it with ABC and you get nine boxes that each deserve a different policy. AX items get tight lean control; CZ items get a generous buffer and no meetings."],
["Inventory turns","INVENTORY","COGS ÷ average inventory value. How many times a year you sell through your stock. Grocery runs 20-40; heavy industrial 2-4. Comparing turns across sectors is meaningless; comparing them across your own quarters is everything."],
["DIO","INVENTORY","Days Inventory Outstanding = 365 ÷ turns. The same fact as turns, expressed in days, which is how everyone actually talks about it."],
["Consignment stock","INVENTORY","Supplier owns the stock until you consume it. Improves your working capital and shifts the risk upstream, at a price built into the unit cost, always."],
["VMI","INVENTORY","Vendor Managed Inventory: your supplier sees your consumption and replenishes without you ordering. Kills a whole layer of bullwhip because there is one demand signal instead of two order streams."],
["Dead stock / slob","INVENTORY","Slow-moving and obsolete stock. The write-down is painful, but the real cost is the racking, the counting and the management attention it consumes for years before someone finally signs it off."],
["Min-max policy","INVENTORY","Order up to Max when you fall below Min. Simple, robust, and everywhere in real ERP systems, though slightly less cost-efficient than a properly tuned (s,Q) policy."],
["Base-stock / order-up-to","INVENTORY","Order every period back up to a target level. Best when reviewing frequently and ordering is cheap."],

/* --- converting: terms that only matter if you are somebody's raw material --- */
["Make-ready waste","MAKE","The substrate consumed between the last good unit of one job and the first good unit of the next, threading the web, mounting plates, bringing colour to standard, setting register. On a wide-web press it can be hundreds of metres, and it makes run length a direct material cost rather than only a capacity question."],
["Converting","MAKE","Turning a raw web or resin into finished packaging: printing, laminating, die-cutting, moulding, slitting. The margin lives entirely in how little material and time the conversion wastes."],
["Substrate","SOURCE","The base material a converter buys: containerboard, film, laminate, resin, foil. Typically 60-70% of total cost, traded on an index, and therefore largely outside the converter's control."],
["Artwork obsolescence","INVENTORY","Printed stock made worthless by a customer changing their design. Unique to printed packaging: the goods are physically perfect and have exactly one possible buyer who no longer wants them. The defence is short finished-goods cover and a contract clause on who owns obsolete stock."],
["EPR levy","TRADE","Extended Producer Responsibility: a charge per tonne of packaging placed on the market, usually modulated so that recycled or recyclable material pays less. It turns material choice into a priced financial decision rather than a sustainability preference."],
["Minimum run length","MAKE","The order size below which make-ready waste and setup cannot be recovered. A commercial decision dressed as a technical constraint, below it, either price the job properly or decline it."],
["Trim waste","MAKE","Material lost because the job width does not divide neatly into the web width. Ganging several jobs across one web is how good planners recover it, and it is invisible on any standard cost report."],
["Mono-material","MAKE","Packaging built from a single polymer family so it can actually be recycled, replacing multi-layer laminates that cannot. Usually costs performance, barrier, seal strength, print quality, which is why it is a supply chain project and not a purchasing one."],

/* --- the quantitative core: the handful of results the primer derives --- */
["Newsvendor model","INVENTORY","The right order quantity when you get exactly one shot: a Christmas range, a flu vaccine batch, a fashion season. Because being short and being long do not cost the same, the answer is a percentile of demand rather than the average. When running out hurts more than overstocking, order more than you expect to sell, and accept leftovers most years."],
["Critical ratio","INVENTORY","Cu divided by (Cu + Co), where Cu is the cost of being one unit short and Co the cost of one unit too many. It answers: what fraction of the total pain comes from running out? Order up to that percentile of the demand distribution. Below 0.5 the correct answer is to order less than the average, which is why bakeries sell out."],
["Value density","DELIVER","Value per kilogram. It is the single number that decides whether air freight is genuinely cheaper than ocean once you count the inventory that a long transit creates. Above roughly a thousand euro per kilo, the inventory saving usually exceeds the freight premium."],
["Unit normal loss function","INVENTORY","Written G(k), the expected shortfall in standard deviations for a given safety factor. It is what converts how often you stock out into how much you fail to supply, and therefore what separates cycle service level from fill rate."],
["Coefficient of variation","DEMAND","Standard deviation divided by the mean. It expresses variability in a way that can be compared across items of wildly different size, which a raw standard deviation cannot. Under about 0.2 is steady, over 0.6 is erratic and needs a different forecasting method entirely."],
["Utilisation trap","MAKE","The belief that a busier plant is a more productive one. Queue time rises with utilisation divided by one minus utilisation, so it is nearly flat to 75% and close to vertical past 95%. A plant run at 98% has terrible lead times, looks excellent on a utilisation report, and everybody blames planning."],
["Order penetration point","DATA","Another name for the decoupling point: the place in the chain where a real customer order first touches the product. Everything upstream of it is made on prediction, everything downstream on fact."],

/* --- source: the half of the chain you do not own --- */
["TCO","SOURCE","Total Cost of Ownership: unit price plus freight, duty, inventory carrying, quality failure, tooling, switching and risk cost. The cheapest quote regularly turns out to be the most expensive supplier once you count the 34 days of pipeline stock and the 3% defect rate."],
["Kraljic matrix","SOURCE","Plots every purchase on supply risk versus profit impact. Four boxes: Leverage (compete it hard), Strategic (partner deeply), Bottleneck (secure supply, price is secondary), Routine (automate and stop thinking about it). Most organisations negotiate everything like it is Leverage."],
["Dual sourcing","SOURCE","Two qualified suppliers for the same item. Costs 1-4% in lost volume leverage and qualification effort, and pays out entirely on the day one of them fails. It is insurance, and like insurance it looks like waste right up until it doesn't."],
["Should-cost model","SOURCE","Building up what a part ought to cost from material, labour, machine rate, overhead and margin. Changes a negotiation from haggling to a conversation about facts."],
["MOQ","SOURCE","Minimum Order Quantity. Where a supplier's setup economics collide with your EOQ. If MOQ exceeds EOQ badly, you are financing the supplier's production efficiency out of your own working capital."],
["Lead time variability","SOURCE","More damaging than long lead time. A reliable 90-day lead time is plannable; an 'anywhere from 20 to 60 days' lead time forces you to buffer for the worst case every single cycle."],
["Supplier scorecard","SOURCE","Quality, delivery, cost, responsiveness, compliance, scored monthly and shared. The point is not the score, it is that the conversation becomes evidence-based."],
["Payment terms (DPO)","SOURCE","Days Payable Outstanding. Stretching supplier payments improves your cash conversion cycle and quietly damages your small suppliers, who then price the financing cost back into your next quote."],
["Tail spend","SOURCE","The thousands of low-value suppliers making up ~5% of spend and ~60% of transactions. Automate it; do not negotiate it."],
["Multi-tier visibility","SOURCE","Knowing your suppliers' suppliers. Most catastrophic disruptions come from tier 2 or tier 3, a single resin plant or one specialty pigment that six of your 'independent' suppliers all buy from."],

/* --- make: how a plant actually behaves, as opposed to how it is budgeted --- */
["MRP","MAKE","Material Requirements Planning. Takes the production schedule, explodes it through the bill of materials, subtracts what you already have and what is already on order, and tells you what to buy and when. Its assumption of infinite capacity is its famous flaw."],
["Bill of materials (BOM)","MAKE","The recipe: what goes into one unit, in what quantity, at what level. A multi-level BOM is a tree, change one component at level 4 and you may need to re-plan 200 finished goods."],
["Yield / scrap factor","MAKE","The BOM says 1kg; reality needs 1.06kg because 6% is lost in the process. Forget this and you are permanently short by exactly the scrap rate."],
["OEE","MAKE","Overall Equipment Effectiveness = Availability × Performance × Quality. Three numbers that each look respectable at 90% multiply to 73%. World class is around 85%; most lines that claim 90% are measuring only one of the three."],
["Takt time","MAKE","Available production time ÷ customer demand. The heartbeat the line must beat to. If takt is 42 seconds and your slowest station takes 51, you have found your bottleneck without needing software."],
["Cycle time vs lead time","MAKE","Cycle time is how long one unit takes to make. Lead time is how long a customer waits. The gap between them is queueing, and it is usually 90%+ of the total."],
["Little's Law","MAKE","WIP = Throughput × Cycle time. It is arithmetic, not a theory, and it holds everywhere. Its practical consequence: to cut lead time without adding capacity, cut work-in-progress. Releasing more work into a busy system makes everything slower."],
["Theory of Constraints","MAKE","Identify the bottleneck, exploit it, subordinate everything else to it, elevate it, then repeat. An hour lost at the bottleneck is an hour lost by the whole plant; an hour saved anywhere else is a mirage."],
["SMED","MAKE","Single-Minute Exchange of Die: cutting changeover time by converting internal setup (machine stopped) into external setup (done while running). Halve the changeover and the economic batch size halves too, which unlocks smaller, more frequent, fresher runs."],
["Campaign manufacturing","MAKE","Running one product for a long block to avoid changeovers and cleaning validation. Common in pharma and chemicals, where a changeover can mean days of cleaning and swab testing. Efficient for the plant, murderous for inventory."],
["Frozen period","MAKE","The near-term window where the schedule cannot change. Too short and the plant thrashes; too long and you cannot respond to real customers. Where planning and manufacturing negotiate their treaty."],
["Rough-cut capacity planning","MAKE","A quick sanity check of the demand plan against a few critical resources before committing. Catches the impossible plan before it becomes everyone's problem."],
["Heijunka","MAKE","Production levelling: smoothing volume and mix so the line runs at a steady rhythm rather than lurching between feast and famine."],

/* --- deliver: moving it, and what that costs in three currencies --- */
["OTIF","DELIVER","On Time, In Full. Of every promised delivery, did everything ordered arrive on the promised day? It is multiplicative and unforgiving: 96% on-time × 97% in-full = 93% OTIF. Retailers now fine against it."],
["Perfect order","DELIVER","OTIF plus damage-free plus correct paperwork plus correct invoice. Four gates at 97% each = 88.5% perfect orders. This is the metric that shows how much the invisible admin failures cost you."],
["FTL vs LTL","DELIVER","Full Truckload buys the whole trailer: fast, direct, one handling. Less-than-Truckload shares it, cheaper for small volumes, but with terminal handling, transfers and more damage. The breakeven is usually somewhere around 12-16 pallets; below that LTL wins, above it FTL does."],
["Cube-out vs weigh-out","DELIVER","A trailer cubes out when it is physically full before hitting the weight limit (pillows, crisps, docks); it weighs out when it hits the weight limit with space left (cable drums, liquids). Knowing which one your product does tells you whether to optimise packaging or pallet patterns."],
["Volumetric weight","DELIVER","Air and courier freight charge on whichever is greater: actual weight, or volume ÷ a divisor (commonly 5000 or 6000 for cm³/kg). Redesigning a box to fall below the divisor is one of the highest-return exercises in logistics."],
["Milk run","DELIVER","One vehicle on a fixed loop collecting from several suppliers or delivering to several customers, instead of each running a part-empty vehicle. Cuts cost and, crucially, allows small frequent deliveries, the backbone of JIT."],
["Cross-docking","DELIVER","Inbound goods go straight to an outbound door within hours, never entering storage. Removes putaway, storage and picking cost. It requires excellent inbound timing, a cross-dock with unreliable inbound is just an expensive floor."],
["VRP","DELIVER","Vehicle Routing Problem. One depot, many stops, limited vehicles, find the cheapest routes. The number of possible solutions explodes factorially, 20 stops is more combinations than there are atoms in a person, so everyone uses heuristics."],
["Clarke-Wright savings","DELIVER","The classic VRP heuristic. For every pair of stops compute S = d(depot,i) + d(depot,j) − d(i,j): how much you save by serving them on one trip instead of two. Merge the biggest savings first while capacity allows. Typically 8-15% shorter than naive clustering, and it runs in milliseconds."],
["Sweep method","DELIVER","Rotate a line around the depot like a radar arm; add stops to a vehicle in the order they are swept until it fills, then start the next. Fast, intuitive, and noticeably worse than savings, but easy to explain to a transport office."],
["Backhaul","DELIVER","Finding a paying load for the return leg. An empty return is 50% of the distance producing 0% of the revenue and 100% of the emissions."],
["Drop trailer","DELIVER","Leaving a loaded trailer at the dock for later unloading instead of holding the driver. Slashes detention cost and turns dock scheduling from a fight into a plan."],
["Detention & demurrage","DELIVER","Detention is a charge for holding the carrier's equipment too long; demurrage is a charge for leaving a container at the port past free time. Both are pure avoidable cost, and both are usually somebody else's KPI, which is why they persist."],
["Cost to serve","DELIVER","The true cost of serving each customer or channel, including order frequency, drop size, returns, packaging, and the phone calls. Almost every business discovers that a chunk of its 'profitable' customers are not."],
["Freight class / NMFC","DELIVER","North American LTL classification by density, stowability, handling and liability. Misclassify and you get re-billed weeks later, always upward."],

/* --- warehouse: the cheapest wins in the whole chain --- */
["Slotting","WAREHOUSE","Deciding where each SKU physically lives. Fast movers at waist height near dispatch; slow movers high and far. A good re-slot can cut picker walking distance 20-35% with zero capital spend, and walking is 55% of a picker's time."],
["Golden zone","WAREHOUSE","The shelf band between knee and shoulder height. Fastest to pick, safest for backs. Prime real estate, reserve it for your A-movers."],
["Pick face vs reserve","WAREHOUSE","The pick face is the small accessible quantity being picked from; reserve is bulk stock feeding it. Replenishment between them is invisible work that a badly slotted warehouse doubles."],
["Wave vs batch vs zone picking","WAREHOUSE","Wave = release orders in timed groups aligned to dispatch. Batch = pick several orders in one trip, sort after. Zone = each picker owns an area and orders pass between them. Most large operations use a hybrid of all three."],
["Put-to-light / pick-to-light","WAREHOUSE","Lights direct the operator to the location and quantity. Cuts errors and training time dramatically; expensive and inflexible once installed."],
["Dock-to-stock time","WAREHOUSE","Hours from a truck arriving to the goods being available to pick. Often the largest hidden delay in the whole chain, stock physically present but system-invisible is not stock."],
["Cycle counting","WAREHOUSE","Counting a subset of locations continuously instead of shutting down for an annual stocktake. Count A items monthly, C items yearly. Fixes root causes rather than just correcting numbers once a year."],
["Inventory record accuracy","WAREHOUSE","Percentage of locations where system quantity matches physical. Below ~97% your MRP is planning on fiction, and planners start keeping private spreadsheets, which is how you know it is bad."],
["Honeycombing","WAREHOUSE","Wasted rack space from partially emptied pallet positions you cannot use for anything else. Silent, universal, and worth 10-20% of your cube."],
["FEFO vs FIFO","WAREHOUSE","First Expired First Out versus First In First Out. For anything with a shelf life FEFO is mandatory, the oldest received is not always the soonest to expire, especially with mixed batch lead times."],
["Put-away strategy","WAREHOUSE","Random/chaotic storage (system remembers where things are) beats fixed locations on space utilisation by 20%+, but is unusable without reliable scanning discipline."],

/* --- finance: the language that turns this work into a budget line --- */
["Cash-to-cash cycle","FINANCE","DIO + DSO − DPO. The days between paying your supplier and being paid by your customer. It is the single number that translates supply chain performance into treasury language, and the one your CFO already knows."],
["Working capital","FINANCE","Inventory + receivables − payables. Supply chain controls the largest lever on it, which is why inventory reduction projects always have executive attention."],
["Carrying cost","FINANCE","The annual cost of holding inventory: cost of capital, storage, insurance, shrinkage, obsolescence, handling. Typically 18-35% a year. Most companies use a number that has not been reviewed in a decade."],
["GMROI","FINANCE","Gross Margin Return On Inventory Investment = gross margin ÷ average inventory cost. Answers 'how many euro of margin does each euro of stock earn me', far more useful for range decisions than margin percentage alone."],
["Landed cost","FINANCE","Unit price + freight + insurance + duty + brokerage + handling, to the point of use. Sourcing decisions made on ex-works price alone are guesses."],
["Contribution margin","FINANCE","Revenue − variable cost. In a shortage, allocating scarce capacity by contribution margin per constrained unit (per machine hour, per kilo of air freight) is the profit-maximising rule."],
["Obsolescence provision","FINANCE","Money set aside against stock you expect to write off. Rising provisions are usually the first visible symptom of a demand planning problem."],

/* --- risk: two numbers instead of a heat map --- */
["Time to Recover (TTR)","RISK","How long a node needs to return to full function after a disruption. Measurable, supplier-answerable, and the input to almost every serious risk model."],
["Time to Survive (TTS)","RISK","How long you can keep serving customers if a node stops. If TTS is less than TTR, you have an exposure, expressed in days, which makes it a board-level conversation instead of a heat map."],
["Single point of failure","RISK","Any node whose loss stops output. Usually not the expensive item, it is the sole-source label printer, the one qualified sterilisation facility, or the specialist coating line nobody mapped."],
["Bowtie / heat map trap","RISK","Ranking risks by likelihood × impact feels rigorous and hides the fact that supply chain catastrophes are low-likelihood and correlated. TTR/TTS beats a heat map every time."],
["Postponed capacity","RISK","Reserved but unused capacity: an option, not waste. Priced as such it becomes defensible in a budget conversation."],
["Force majeure","RISK","A contractual clause suspending obligations under extraordinary events. Read yours before you need it: the definition of what qualifies, and who bears cost during suspension, varies enormously."],

/* --- pharma: the terms that only exist because the product is a medicine --- */
["GMP","PHARMA","Good Manufacturing Practice. The legally enforceable framework governing how medicines are made, tested and documented. If it is not documented, it did not happen."],
["GDP (pharma)","PHARMA","Good Distribution Practice. GMP's counterpart for storage and transport: qualified vehicles, mapped warehouses, trained staff, documented temperature control, and traceability of every movement."],
["Qualified Person (QP)","PHARMA","A legally named individual who personally certifies every batch before it can be sold in the EU. No QP signature, no sale, regardless of how much stock is physically in the building."],
["Quarantine stock","PHARMA","Product that physically exists but is not yet released. It occupies racking, sits on your balance sheet, and services nobody. Planners who count it as available inventory create phantom supply."],
["Cold chain 2-8°C","PHARMA","The standard refrigerated range for most biologics and vaccines. Maintained by validated packaging, monitored by data loggers, and audited end to end. Frozen chains run at −20°C or −70°C with entirely different equipment."],
["Temperature excursion","PHARMA","Any deviation outside the labelled range. It does not automatically destroy product, stability data and a QP assessment decide. But the stock is unusable while that assessment runs, which is why excursions are a service problem as much as a quality one."],
["Validated shipper","PHARMA","Passive (insulated box + phase-change packs, qualified for a stated duration) or active (powered, controlled container). Passive is cheaper and simpler; active protects longer and reports in real time. The choice is a lane-by-lane decision, not a company-wide one."],
["Serialisation","PHARMA","Unique identifiers on every saleable pack, verified at dispensing (EU FMD) or through the chain (US DSCSA). Aggregation links pack to case to pallet, and when aggregation data is wrong, the error surfaces at the wholesaler, not in your warehouse."],
["Batch / lot genealogy","PHARMA","The full traceable record from API lot through intermediates to finished pack. It is what makes a recall surgical instead of national, and it is only as good as your scanning discipline."],
["API concentration risk","PHARMA","A large share of the world's active ingredients comes from a small number of sites in a small number of regions. Qualifying an alternative takes 18-36 months plus a regulatory variation, so the mitigation must start years before the disruption."],
["Shelf-life at release","PHARMA","Customers and tenders demand a minimum remaining shelf life on receipt, often 75-85% of total. Product technically in date can be commercially worthless."],
["CMO / CDMO","PHARMA","Contract (Development and) Manufacturing Organisation. Outsourced production. Their capacity is shared across their clients, so your priority in their schedule is a commercial negotiation, not a given."],
["Deviation & CAPA","PHARMA","A deviation is any departure from approved procedure; CAPA is the Corrective And Preventive Action that follows. Both consume QP time, which is why a quality event upstream shows up as a service failure three weeks later."],

/* --- trade & data: the paperwork layer, and the records under everything --- */
["Incoterms 2020","TRADE","Eleven three-letter rules defining who arranges carriage, who bears cost, and, separately, where risk transfers. The most expensive misunderstanding in trade is assuming cost and risk transfer at the same point. They frequently do not."],

/* ==========================================================
   4 · THE ENGINE
   ----------------------------------------------------------
   Every number on screen is computed here from published
   formulas. Nothing is faked. Change a control and the whole
   chain of consequences recalculates.

   CALL GRAPH
     computeAll(state)                    once per repaint
       ├─ skuList(S)                      section 9: item file + your edits
       ├─ computeSku(sk,g,S,q,ev,over)    once per product line
       │    ├─ zFor(svc) → nInv()         service level to safety factor
       │    ├─ lossG(z)  → npdf/ncdf      fill rate from the loss function
       │    └─ returns one `row`
       ├─ capacity block                  OEE and changeover loss
       ├─ event mitigation block          did your configuration absorb it?
       ├─ per-row service block           on-time × in-full
       ├─ per-row money block             revenue, COGS, freight, decay
       └─ roll-up block                   portfolio totals and derived KPIs

   PURITY RULE
     computeAll() reads state and returns a fresh object. It never mutates
     ST, never touches the DOM, and never caches. That is what makes the
     impact ledger in section 6 possible: it can call computeAll() before a
     change, apply the change, call it again, and diff the two results.

   UNITS USED THROUGHOUT
     time      days, except lead-time environment which is a multiplier
     quantity  units of the sector's own unit (cases, packs, units)
     rate      per day, derived from quarterly figures by dividing by 91
     money     euro, per quarter unless the name says otherwise
     carbon    kilograms CO2e per quarter
   ========================================================== */

/* clamp(v,a,b): constrain v to [a,b]. Used everywhere a model output must
   stay physically sensible — a fill rate cannot exceed 100%, a resilience
   score cannot go negative — without introducing a discontinuity. */
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
/* sum(array): total of a numeric array. Half the roll-up is sum(rows.map(...)). */
var sum=function(a){return a.reduce(function(x,y){return x+y;},0);};

/* ---------------------------------------------------------- standard normal
   Three functions, no library. Together they give the app everything it
   needs from the normal distribution: the density, the cumulative, and the
   inverse cumulative. */

/* npdf(z): the standard normal probability density at z.
   Used to DRAW the bell curves in section 11 and as an input to lossG(). */
function npdf(z){ return Math.exp(-z*z/2)/Math.sqrt(2*Math.PI); }

/* ncdf(z): cumulative standard normal, i.e. P(Z ≤ z).
   Zelen & Severo's polynomial approximation (Abramowitz & Stegun 26.2.17),
   accurate to about 7.5e-8, which is far beyond what an inventory decision
   needs. The symmetry trick at the end means only the positive tail is
   actually approximated.
   Used for: cycle service level from a Z, and inside lossG(). */
function ncdf(z){
  var t=1/(1+0.2316419*Math.abs(z));
  var d=npdf(z);
  var p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0? 1-p : p;
}

/* nInv(p): inverse cumulative normal — given a probability, return the Z.
   Acklam's rational approximation, good to about 1.15e-9 relative error.
   Three branches: the lower tail (p < 0.02425), the upper tail (mirrored),
   and the central region, which uses a different rational polynomial.
   This is THE function behind the service-level curve: every time the app
   converts "95% service" into "1.64 sigma of buffer", it lands here. */
function nInv(p){
  if(p<=0) return -6; if(p>=1) return 6;      /* hard rails, never returns Infinity */
  var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  var b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  var c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  var d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  var pl=0.02425,q,r;
  /* lower tail */
  if(p<pl){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  /* upper tail: same polynomial on (1-p), negated */
  if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  /* central region */
  q=p-0.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

/* lossG(k): the unit normal loss function G(k) = φ(k) − k·(1−Φ(k)).
   It is the expected shortfall, in standard deviations, when you hold k
   sigma of buffer. This single function is what separates "how often you
   stock out" (cycle service level) from "how much you fail to supply"
   (fill rate), and it is why a 95% CSL usually delivers a 99%+ fill rate. */
function lossG(k){ return npdf(k) - k*(1-ncdf(k)); }

/* ---------------------------------------------------------- forecasting methods
   `f` is the error multiplier applied to the item's coefficient of variation.
   Naive is worst at 1.42; Holt-Winters best at 0.82. `season` records whether
   the method can see a seasonal pattern at all — if it cannot, the seasonal
   component of the demand curve becomes pure error.
   `croston` is a flag rather than a factor, because Croston's error factor is
   conditional on the item: brilliant on Z items, poor on everything else. */
var METHODS={
  naive:{label:"Naive (last period)", f:1.42, season:false,
    why:"Tomorrow equals today. A legitimate benchmark: if your fancy model cannot beat naive, it is not earning its licence fee."},
  ma:{label:"Moving average", f:1.16, season:false,
    why:"Averages the last n periods. Stable and easy to explain, but it lags every genuine turn by half the window length."},
  expo:{label:"Exponential smoothing", f:1.0, season:false,
    why:"Weights recent history more heavily, controlled by alpha. The default workhorse for level demand with no trend or season."},
  holt:{label:"Holt (level + trend)", f:.93, season:false,
    why:"Adds a trend equation. Use it when demand is genuinely growing or declining, not just wobbling."},
  hw:{label:"Holt-Winters (+ season)", f:.82, season:true,
    why:"Adds a seasonal index. Essential for anything with an annual rhythm, vaccine, mince pies, smartwatches at Christmas."},
  croston:{label:"Croston (intermittent)", f:1.0, season:false, croston:true,
    why:"Forecasts demand size and the interval between demands separately. Built for spare parts and erratic Z items where normal smoothing returns nonsense."}
};

/* LUMP: how much extra demand variability an XYZ class carries beyond its
   stated coefficient of variation. A Z item is not just noisier, it is
   lumpier: the same sigma arrives in fewer, larger events, which needs
   more buffer than a smooth process with identical variance. */
var LUMP={X:1.0,Y:1.55,Z:2.6};

/* MODEREL: percentage points added to (or taken off) on-time delivery purely
   because of the mode's transit reliability. Ocean is the worst at −3.2:
   a 34-day lane is exposed to more that can go wrong. Courier is +2.8. */
var MODEREL={air:1.6,ocean:-3.2,rail:-0.9,truck:1.1,reefer:0.4,courier:2.8};

/* zFor(svc): a service level in percent → the safety factor Z.
   Clamped to [50, 99.95] because below 50% the concept stops meaning
   anything and above 99.95% the inverse normal runs away. */
function zFor(svc){ return nInv(clamp(svc,50,99.95)/100); }

/* ==========================================================
   computeSku — one product line, one quarter.

   Arguments
     sk    the effective SKU (item file plus the user's edits)
     g     the global control state, ST.g
     S     the sector object
     q     the current quarter, 1..8
     ev    the event landing this quarter, or null
     over  per-SKU overrides, ST.sku[code], possibly empty

   Returns one `row`: about forty derived fields. Everything downstream —
   grids, charts, diagnosis, the P&L — reads a row, never the raw SKU.
   ========================================================== */
function computeSku(sk,g,S,q,ev,over){
  var o = over||{};
  /* Resolution order for every policy field: the per-SKU override if one
     exists, otherwise the portfolio default. This one pattern is what makes
     differentiated inventory policy possible in the app. */
  var svc   = o.service!=null? o.service : g.service;
  var pol   = o.policy!=null?  o.policy  : g.policy;
  var src   = o.source!=null?  o.source  : g.sourcing;
  var mode  = o.mode!=null?    o.mode    : g.mode;
  /* expedite arrives from a segmented button as the string "true" */
  var exped = (o.expedite===true||o.expedite==="true");

  /* --- demand ---
     demand = base × season × promotion × event shock.
     The season array is eight long and the quarter is 1-based, hence (q-1)%8. */
  var season = sk.season[(q-1)%8];
  /* a promotion lifts a fully promo-sensitive item by 55% */
  var promoM = g.promo? 1 + 0.55*sk.promo : 1;
  var evHit  = (ev && ev.hits.indexOf(sk.code)>=0);
  var evDem  = 1;
  /* Two mitigation keys describe demand SURGES rather than supply failures.
     A capacity event is a 35% surge; a safety event is 32%. Everything else
     leaves demand alone and attacks service or cost instead. */
  if(evHit && ev.by==="capacity") evDem = 1.35;
  if(evHit && ev.by==="safety")   evDem = 1.32;
  var demand = sk.baseQ * season * promoM * evDem;
  var dailyD = demand/91;                      /* the daily rate everything else uses */

  /* --- forecast quality ---
     Error is assembled from four independent sources, then clamped. */
  var M = METHODS[g.method];
  /* volatile market widens the item's own coefficient of variation by 55% */
  var cvBase = sk.cv * (g.volatility? 1.55 : 1);
  var methodF = M.f;
  /* Croston is the right tool only on intermittent (Z) items. On anything
     else it is actively worse than plain smoothing: 0.72 versus 1.55. */
  if(M.croston) methodF = (sk.xyz==="Z")? 0.72 : 1.55;
  /* the optimal alpha rises with the item's volatility: a noisy series needs
     more responsiveness. Deviating from it costs 0.85 error units per 1.0 */
  var aOpt = clamp(cvBase*1.25,0.08,0.55);
  var aPen = 1 + Math.abs((g.alpha||0.3)-aOpt)*0.85;
  /* three methods do not use alpha at all, so no penalty applies */
  if(g.method==="naive"||g.method==="ma"||M.croston) aPen=1;
  /* seasonal error: how far this quarter's index is from 1.0. A seasonal
     method absorbs most of it (coefficient 7); a non-seasonal one does not
     (coefficient 30). The 1-1/(1+x) shape saturates, so a 3.6x Christmas
     index does not produce a 300% error. */
  var sDev=Math.abs(season-1);
  var seasonErr = M.season? 7*(1-1/(1+sDev)) : 30*(1-1/(1+sDev*0.9));
  /* promotional error: the gap between the uplift you set and the uplift the
     item actually needed. Items with no promo sensitivity still take 15% of
     the penalty, because a blanket uplift distorts them too. */
  var trueLift  = g.promo? 55*sk.promo : 0;
  var promoErr  = Math.abs((g.forecastAdj||0) - trueLift)*0.42*(sk.promo>0?1:0.15);
  /* total: floor 1.4% (irreducible noise), ceiling 78% (unusable) */
  var mape = clamp(cvBase*100*methodF*aPen*0.50 + seasonErr + promoErr, 1.4, 78);
  /* bias is SIGNED. Half the promotional mis-set carries straight through,
     and a non-seasonal method inherits a bias equal to the seasonal deviation
     in the opposite direction — it under-forecasts peaks and over-forecasts
     troughs, which is exactly what a level model does. */
  var bias = ((g.forecastAdj||0) - trueLift)*0.5 + (M.season?0:(season-1)*-9);

  /* --- lead time ---
     Effective lead time is longer than the supplier's quote:
       supplier lead time × environment stress
       + QP release days (pharma only: a batch is not saleable until signed)
       + dock-to-stock (physically present but not yet system-received) */
  var lt = sk.lt*(g.ltStress||1) + (S.key==="pharma"? g.qpDays : 0) + g.dockToStock;
  if(exped) lt = lt*0.55;                          /* expediting buys 45% of the time */
  /* dual sourcing cuts lead-time VARIABILITY by 28%, which is the part that
     actually drives safety stock */
  var ltSd = sk.ltSd*(g.ltStress||1)*(src==="dual"?0.72:1);
  /* a supply-failure event on a single-sourced item stretches both */
  if(evHit && (ev.by==="dual") && src!=="dual") { lt*=1.55; ltSd*=1.8; }

  /* --- safety stock: SS = Z·sqrt(LT·sigmaD^2 + d^2·sigmaLT^2) ---
     The full two-term formula. Term one is demand variability accumulated
     over the lead time; term two is lead-time variability multiplied by the
     demand rate. Most implementations drop term two and then under-deliver. */
  var sigmaD = dailyD*cvBase*LUMP[sk.xyz];
  /* forecast error inflates the demand sigma you must buffer against. This
     is the mechanism by which bad forecasting shows up as INVENTORY rather
     than as a forecasting statistic. */
  var sigmaDeff = sigmaD*(1+mape/160);
  var z = zFor(svc);
  var sigmaL = Math.sqrt(lt*sigmaDeff*sigmaDeff + dailyD*dailyD*ltSd*ltSd);
  var SSu = z*sigmaL*(g.ssMult||1);              /* the planner's blanket override */
  var ssDays = dailyD>0? SSu/dailyD : 0;

  /* --- order quantity ---
     Four policies, all producing a Q that then feeds cycle stock. */
  var H = sk.cost*g.holdRate;                    /* holding cost, €/unit/year */
  var Dan = demand*4;                            /* annualised demand */
  var eoq = Math.sqrt(2*Dan*sk.S/Math.max(H,0.0001));
  var Q;
  if(pol==="eoq")       Q = Math.max(eoq, sk.moq);          /* MOQ can bind above EOQ */
  else if(pol==="moq")  Q = sk.moq;                          /* supplier economics win */
  else if(pol==="jit")  Q = Math.max(dailyD*7, sk.moq*0.25); /* weekly buckets */
  else                  Q = Math.max(dailyD*(g.coverWeeks||4)*7, sk.moq*0.2); /* fixed cover */
  Q = Math.max(Q, dailyD*0.5);                   /* never below half a day of demand */
  var orders = Dan/Q;                            /* orders placed per year */
  var eoqGap = Math.abs(Q-eoq)/Math.max(eoq,1);  /* how far from optimal, as a fraction */

  /* --- stock positions ---
     Four buckets, summed into average inventory. Only safety stock is a
     free choice; the other three are consequences of decisions elsewhere. */
  var cycle = Q/2;                                  /* average of a saw-tooth */
  var campaignStock = dailyD*(g.batchDays||5)/2;    /* longer runs = more, older stock */
  var pipeline = dailyD*lt;                         /* in transit, owned, untouchable */
  var quarantine = (S.key==="pharma")? dailyD*g.qpDays : 0;  /* present but not released */
  var avgInv = cycle + campaignStock + SSu + quarantine;
  var rop = dailyD*lt + SSu;                        /* reorder point, on POSITION */
  var invVal = avgInv*sk.cost;
  var daysCover = dailyD>0? avgInv/dailyD : 0;

  /* --- service: cycle service level vs fill rate ---
     csl  is simply Φ(z): the probability of surviving a cycle.
     fill uses the loss function: expected shortfall over order quantity.
     They are deliberately computed by different routes because they are
     genuinely different quantities. */
  var csl = ncdf(z)*100;
  var fill = clamp((1 - (sigmaL*lossG(z))/Math.max(Q,1))*100, 40, 99.99);

  return {sk:sk,demand:demand,dailyD:dailyD,mape:mape,bias:bias,lt:lt,ltSd:ltSd,
    sigmaD:sigmaDeff,sigmaL:sigmaL,z:z,svc:svc,SSu:SSu,ssDays:ssDays,eoq:eoq,Q:Q,orders:orders,
    eoqGap:eoqGap,cycle:cycle,campaignStock:campaignStock,pipeline:pipeline,quarantine:quarantine,avgInv:avgInv,rop:rop,
    invVal:invVal,daysCover:daysCover,csl:csl,fill:fill,mode:mode,src:src,pol:pol,exped:exped,
    evHit:evHit,H:H,method:g.method};
}

/* ==========================================================
   computeAll — the whole company, one quarter.

   Takes the entire application state and returns the model object `M` that
   every screen renders from. Runs in six passes, in this order, because
   each pass depends on the one before it:

     1  rows        per-SKU maths via computeSku()
     2  capacity    can the plant physically make the demand?
     3  event       did your configuration absorb this quarter's disruption?
     4  service     on-time × in-full, per row
     5  money       revenue, cost, decay, penalties, per row
     6  roll-up     portfolio totals, cash cycle, resilience, bullwhip
   ========================================================== */
function computeAll(state){
  var S=SECTORS[state.sec], g=state.g, q=state.q;
  /* at most one event per quarter; [0] of the filtered list, or null */
  var ev=S.events.filter(function(e){return e.q===q;})[0]||null;

  /* --- 1. per-SKU --- */
  var rows=skuList(S).map(function(sk){ return computeSku(sk,g,S,q,ev,state.sku[sk.code]||{}); });

  /* --- 2. plant capacity ---
     OEE multiplies three factors that each look respectable alone.
     Changeover loss falls as campaign length rises: 24% at one day, floored
     at 2.5%. SMED cuts whatever remains by 58%. */
  var oee=(g.oeeA/100)*(g.oeeP/100)*(g.oeeQ/100);
  var coLossBase=clamp(0.24-g.batchDays*0.021,0.025,0.24);
  var coLoss=g.smed? coLossBase*0.42 : coLossBase;
  /* Capacity is measured in standard hours, and unit cost is used as the
     proxy for how much line time a unit consumes. A transformer therefore
     eats far more capacity than a yoghurt, which is the intended behaviour. */
  var wt=function(s){return s.cost;};
  var baseCap=sum(skuList(S).map(function(s){return s.baseQ*wt(s);}))*1.72;
  /* shifts scale linearly from the two-shift baseline */
  var capacity=baseCap*(g.shifts/2)*oee*(1-coLoss);
  var totalDem=sum(rows.map(function(r){return r.demand*wt(r.sk);}));   /* load, weighted */
  var unitsDem=sum(rows.map(function(r){return r.demand;}));            /* load, in units */
  /* express capacity back in units for display, using the same mix */
  var unitsCap=capacity/Math.max(totalDem,1)*unitsDem;
  var util=totalDem/capacity;
  var shortfall=Math.max(0,(totalDem-capacity)/totalDem);   /* fraction of demand unmakeable */

  /* --- 3. event impact ---
     Build a truth table of which configurations count as mitigation, then
     look up this event's `by` key in it. A mitigated event lands at 28%
     strength. This is the mechanism that makes decisions taken in quarter 1
     pay off — or not — in quarter 6. */
  var mitigated=false, evOtif=0, evCost=0;
  if(ev){
    var m={
      dual:      g.sourcing==="dual",                       /* a qualified second source */
      safety:    g.service>=97 || g.ssMult>=1.3,            /* genuinely deep buffer */
      air:       g.mode==="air"||g.mode==="courier",        /* a fast lane already booked */
      cold:      g.cold==="active"|| g.mode==="reefer",     /* real temperature control */
      capacity:  g.shifts>=3 || util<0.82,                  /* protective capacity exists */
      routing:   g.heuristic==="savings",                   /* better route merging */
      fill:      g.fill>=88,                                /* full vehicles */
      lean:      g.policy==="jit"||g.service<=93,           /* little stock to write down */
      multimodal:g.mode==="rail"||g.mode==="truck",         /* land modes, pre-qualified */
      qp:        g.qpDays<=5,                               /* release is not the bottleneck */
      serial:    g.serial===true,                           /* serialisation compliant */
      recycled:  g.recycled===true                          /* substrate meets the mandate */
    };
    mitigated=!!m[ev.by];
    evOtif=mitigated? ev.otif*0.28 : ev.otif;
    evCost=mitigated? ev.cost*0.28 : ev.cost;
  }

  /* --- 4. service per SKU ---
     on-time is built additively from mode reliability, plant queueing,
     forecast error and logistics choices; in-full comes from the fill rate
     scaled down by any capacity shortfall. OTIF is their product. */
  var mo=MODES[g.mode];
  rows.forEach(function(r){
    var rel=MODEREL[r.mode]!=null?MODEREL[r.mode]:0;
    /* queueing penalty: nothing below 85% utilisation, then up to 20 points */
    var queue = util>0.85? Math.min((util-0.85)*46,20) : 0;
    var onTime = 96 + rel - queue - r.mape*0.11 + (g.crossdock?1.2:0) +
      (g.heuristic==="savings"?0.7:0) + (g.backhaul?0.3:0) - Math.min(shortfall*26,16) +
      (r.exped?2.5:0) + (r.evHit? evOtif : evOtif*0.35);   /* splash on non-hit lines */
    /* pharma cold-chain exposure: any SKU labelled 2-8°C pays a penalty that
       depends on the shipper type, and a further 4.5 points if the lane
       itself is not temperature-controlled at all */
    if(S.key==="pharma" && /2-8/.test(r.sk.temp||"")){
      var coldPen = g.cold==="active"? 0.4 : g.cold==="hybrid"? 1.4 : 3.2;
      if(g.mode!=="reefer"&&g.mode!=="air"&&g.mode!=="courier") coldPen+=4.5;
      onTime-=coldPen;
    }
    /* non-compliant serialisation blocks market access at the wholesaler */
    if(S.key==="pharma" && !g.serial) onTime-=2.2;
    r.onTime=clamp(onTime,45,99.6);
    r.inFull=clamp(r.fill*(1-shortfall*0.75),40,99.9);
    r.otif=r.onTime/100*r.inFull/100*100;        /* multiplicative, and unforgiving */
    r.served=r.demand*(r.inFull/100);
    r.lost=r.demand-r.served;
  });

  /* --- 5. money, per row --- */
  var dualPrem=g.sourcing==="dual"?0.018:0;                 /* 1.8% insurance premium */
  /* packaging only: the substrate index multiplies COGS directly, and
     recycled content adds 4.5% per tonne on top */
  var subF = S.key==="packaging" ? (g.substrate||1)*(g.recycled?1.045:1) : 1;
  var otRate=g.shifts>=3?0.035:g.shifts<=1?0:0.012;         /* overtime loading */
  rows.forEach(function(r){
    var sk=r.sk;
    /* Air and courier bill on the GREATER of actual and volumetric weight.
       167 is the kg-per-cubic-metre equivalent of the 1:6000 cm3/kg divisor. */
    var chargeKg = (r.mode==="air"||r.mode==="courier")? Math.max(sk.kg, sk.cbm*167) : sk.kg;
    var fillF = 78/Math.max(g.fill,35);          /* 78% fill is the neutral baseline */
    var routeF = g.heuristic==="savings"?0.90:1.0;
    var bh = g.backhaul?0.93:1;
    var frUnit = chargeKg*MODES[r.mode].eurPerKgKm*S.distanceKm*fillF*routeF*bh*(g.crossdock?0.95:1);
    if(r.exped) frUnit*=2.6;                     /* expediting is 2.6x the freight rate */
    r.frUnit=frUnit;

    r.revenue = r.served*sk.price;
    r.cogs    = r.served*sk.cost*subF*(1+dualPrem+otRate)*(1+(r.evHit?evCost:evCost*0.3));
    r.freight = r.served*frUnit;
    r.holding = r.invVal*g.holdRate/4;           /* annual rate, one quarter of it */

    /* decay: shelf-life waste for perishables, or value decay for tech */
    var waste=0;
    if(sk.shelf>0){
      /* the USABLE window is much shorter than the legal shelf life, because
         customers refuse stock without enough life left. Pharma is harshest
         at 28% of nominal; everything else gets 50%. */
      var eff = sk.shelf*(S.key==="pharma"?0.28:0.5);
      /* waste rate rises once days of cover exceeds that window */
      var wr = clamp((r.daysCover/Math.max(eff,1))-1,0,3)*0.30;
      if(g.fefo) wr*=0.55;                       /* FEFO cuts write-off by 45% */
      waste = r.avgInv*sk.cost*clamp(wr,0,0.55);
    }
    /* tech has no expiry date but loses ~2.4% of value per 30 days held */
    if(S.key==="tech"){ waste += r.invVal*0.024*(r.daysCover/30); }
    /* packaging: make-ready substrate consumed on every changeover.
       Shorter campaigns mean more changeovers, so a higher rate. */
    r.makeReady=0;
    if(S.key==="packaging"){
      var mrRate=clamp(0.048-g.batchDays*0.0026,0.008,0.048)*(g.smed?0.58:1);
      r.makeReady=r.served*sk.cost*subF*mrRate;
      waste+=r.makeReady;
    }
    r.waste=waste;

    /* `excursion` is reused for two sector-specific compliance costs:
       pharma cold-chain excursions, and the packaging EPR levy. */
    r.excursion=0;
    if(S.key==="pharma" && /2-8/.test(sk.temp||"")){
      var er = g.cold==="active"?0.004: g.cold==="hybrid"?0.014:0.032;
      if(g.mode!=="reefer"&&g.mode!=="air"&&g.mode!=="courier") er*=3.1;
      r.excursion = r.served*sk.cost*er;
    }
    if(S.key==="packaging" && /resin/i.test(sk.src||"")){
      r.excursion = r.served*sk.cost*(g.recycled?0.006:0.026);
    }
    /* service penalty: lost sales priced at a sector-specific severity.
       Pharma is the harshest at 42% of list, because failing to supply a
       medicine costs far more than the margin on it. */
    r.penalty = r.lost*sk.price*(S.key==="pharma"?0.42:S.key==="fmcg"?0.30:S.key==="packaging"?0.34:0.22);
    r.profit = r.revenue - r.cogs - r.freight - r.holding - r.waste - r.excursion - r.penalty;
    r.margin = r.revenue>0? r.profit/r.revenue*100 : 0;
    r.gm = r.revenue>0? (r.revenue-r.cogs)/r.revenue*100 : 0;
    r.gmroi = r.invVal>0? (r.revenue-r.cogs)/r.invVal : 0;       /* margin per € of stock */
    r.turns = r.invVal>0? (r.served*sk.cost*4)/r.invVal : 0;     /* annualised */
    r.dio = r.turns>0? 365/r.turns : 0;
    /* tonnes × km × grams per tonne-km, converted to kg CO2e */
    r.co2 = r.served*sk.kg/1000*S.distanceKm*MODES[r.mode].co2gPerTkm/1000;
    r.ctsPct = r.revenue>0? (r.freight+r.holding+r.waste)/r.revenue*100 : 0;  /* cost to serve */
  });

  /* --- 6. roll-up --- */
  var revenue=sum(rows.map(function(r){return r.revenue;}));
  var cogs=sum(rows.map(function(r){return r.cogs;}));
  var freight=sum(rows.map(function(r){return r.freight;}));
  var holding=sum(rows.map(function(r){return r.holding;}));
  var waste=sum(rows.map(function(r){return r.waste;}));
  var excursion=sum(rows.map(function(r){return r.excursion;}));
  var penalty=sum(rows.map(function(r){return r.penalty;}));
  var overhead=revenue*(S.overhead||0.15);
  var profit=revenue-cogs-freight-holding-waste-excursion-penalty-overhead;
  var margin=revenue>0?profit/revenue*100:0;
  var invVal=sum(rows.map(function(r){return r.invVal;}));
  /* ownFrac: how much of the pipeline sits on YOUR balance sheet, decided by
     the Incoterm. EXW means you own it from the supplier's door (1.0); DAP
     means you own almost none of it until it arrives (0.16). */
  var ownFrac = g.incoterm==="exw"?1.0 : g.incoterm==="cif"?0.82 : 0.16;
  var pipeVal=sum(rows.map(function(r){return r.pipeline*r.sk.cost;}))*ownFrac;
  var bsInv=invVal+pipeVal;                       /* what the balance sheet actually shows */
  var co2=sum(rows.map(function(r){return r.co2;}));
  var served=sum(rows.map(function(r){return r.served;}));
  var lost=sum(rows.map(function(r){return r.lost;}));

  /* Portfolio KPIs are DEMAND-WEIGHTED, not simple averages. A straight mean
     would let a tiny spare-part line drag company OTIF as hard as the volume
     engine, which would be nonsense. */
  var wsum=function(f){var d=sum(rows.map(function(r){return r.demand;}));
    return d>0? sum(rows.map(function(r){return f(r)*r.demand;}))/d : 0;};
  var otif=wsum(function(r){return r.otif;});
  var mape=wsum(function(r){return r.mape;});
  var bias=wsum(function(r){return r.bias;});
  var fill=wsum(function(r){return r.inFull;});
  var onTime=wsum(function(r){return r.onTime;});

  var turns=bsInv>0? (cogs*4)/bsInv : 0;
  var dio=turns>0?365/turns:0;
  var c2c=dio+g.dso-g.dpo;                        /* the CFO's number */
  var co2Int=revenue>0? co2/(revenue/1000) : 0;   /* kg CO2e per EUR1,000 revenue */

  /* --- resilience: TTS vs TTR ---
     TTR is how long a failed node takes to come back. Dual sourcing cuts it
     from 68 days to 22. Pharma single-sourced is 118, because changing an
     API source needs a regulatory variation on top of a qualification.
     TTS is the days of cover on the WORST A item, not the average — your
     exposure is set by the weakest critical line, not the portfolio. */
  var ttr = g.sourcing==="dual"? 22 : 68;
  if(S.key==="pharma"&&g.sourcing!=="dual") ttr=118;
  var crit=rows.filter(function(r){return r.sk.abc==="A";});
  var tts = crit.length? Math.min.apply(null,crit.map(function(r){return r.daysCover;})) : 30;
  var exposure=Math.max(0,ttr-tts);
  /* the 0-99 score is a presentation of that gap, adjusted for the postures
     that genuinely change recovery behaviour */
  var resilience=clamp(100 - exposure*0.62 + (g.sourcing==="dual"?12:0) + (g.crossdock?2:0) +
    (mitigated?7:0) - (util>0.95?10:0),5,99);

  /* bullwhip: how much more variable your ORDERS are than real demand.
     Forecast error, big batches and un-lifted promotions all amplify;
     cross-docking and JIT damp. 1.0 would be a perfectly clean signal. */
  var bullwhip = 1 + (mape/100)*1.3 + (g.policy==="moq"?0.42:0) + (g.promo&&Math.abs(g.forecastAdj)<10?0.5:0)
    - (g.crossdock?0.08:0) - (g.policy==="jit"?0.22:0);

  return {S:S,g:g,q:q,ev:ev,rows:rows,capacity:unitsCap,totalDem:unitsDem,loadCap:capacity,loadDem:totalDem,util:util*100,
    shortfall:shortfall,oee:oee*100,coLoss:coLoss*100,mitigated:mitigated,evOtif:evOtif,evCost:evCost,
    revenue:revenue,cogs:cogs,freight:freight,holding:holding,waste:waste,excursion:excursion,
    penalty:penalty,overhead:overhead,pipeVal:pipeVal,bsInv:bsInv,profit:profit,margin:margin,invVal:invVal,co2:co2,co2Int:co2Int,
    served:served,lost:lost,otif:otif,mape:mape,bias:bias,fill:fill,onTime:onTime,turns:turns,
    dio:dio,c2c:c2c,ttr:ttr,tts:tts,exposure:exposure,resilience:resilience,bullwhip:bullwhip,
    /* perfect order adds a damage-free gate (97.5%) and a paperwork gate
       (98.2%) on top of OTIF, which is why it is always lower */
    perfectOrder:otif*0.975*0.982};
}

/* ---------------------------------------------------------- formatting
   Four functions. Every figure that reaches the screen passes through one
   of them, which is why the whole app formats consistently without any
   component having to think about it. */

/* fm(n,d): locale number with a fixed number of decimals. en-IE gives comma
   thousands separators and a dot decimal. Non-finite input returns a placeholder
   rather than "NaN", so a divide-by-zero never reaches the user. */
function fm(n,d){ if(!isFinite(n))return ", ";
  return n.toLocaleString("en-IE",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }

/* money(n): euro with automatic magnitude. Note the two thousand-scale
   branches: above €10k it drops the decimal, below it keeps one, so a
   column of figures never mixes "€9.7k" with "€1,240". */
function money(n){
  var a=Math.abs(n);
  if(a>=1e9) return "€"+fm(n/1e9,2)+"bn";
  if(a>=1e6) return "€"+fm(n/1e6,2)+"m";
  if(a>=1e4) return "€"+fm(n/1e3,0)+"k";
  if(a>=1e3) return "€"+fm(n/1e3,1)+"k";
  return "€"+fm(n,0);
}

/* pct(n,d): percentage, one decimal by default. */
function pct(n,d){ return fm(n,d==null?1:d)+"%"; }

/* qty(n): unit counts with magnitude suffixes. Needed because the same
   function formats 14 transformers and 168 million PET preforms. */
function qty(n){ return Math.abs(n)>=1e6? fm(n/1e6,2)+"m" : Math.abs(n)>=1000? fm(n/1000,1)+"k" : fm(n,0); }

/* esc(s): HTML escape. Everything the app builds is an HTML string, so any
   value that came from user input — a product name, a company name — must
   pass through here before concatenation. */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* ==========================================================
   5 · CHART PRIMITIVES
   ----------------------------------------------------------
   Hand-written SVG. No chart library, no CDN, no fonts.
   Everything scales with viewBox so it works on a phone.

   WHY HAND-WRITTEN
     The app is one file that must work offline in ten years. A charting
     library would be the single largest dependency in it, and would still
     not draw a saw-tooth inventory profile or a Clarke-Wright route map.

   THE SHARED PATTERN
     Every generator below follows the same six steps:
       1  declare width, height and the four paddings
       2  derive inner width/height
       3  build X() and Y() scale functions that map data → pixels
       4  emit gridlines and axis labels
       5  emit the data
       6  emit the axis lines, close the <svg>
     They return a STRING. Nothing here touches the DOM; the caller drops
     the string into an innerHTML.

   COORDINATE CONVENTION
     SVG y grows downward, so every Y() function is written as
     (top + innerHeight − value·scale). Getting this backwards is the most
     common way to break one of these.
   ========================================================== */

/* C_ACC(): the live sector accent, read at draw time rather than captured,
   so a chart drawn after a sector change uses the new colour. */
var C_ACC=function(){return SECTORS[ST.sec]?SECTORS[ST.sec].acc:"#00A67D";};
/* PAL: the categorical series palette, used when a chart needs one colour
   per product line. Ordered for maximum adjacent contrast. */
var PAL=["#4B63E8","#00A67D","#D9308F","#C99A06","#7C5CF0","#0E9BB5","#CE2B3C","#0F766E"];

/* ---------------- label collision control ----------------
   Charts drop labels rather than overprint them. Every text
   that could collide goes through here.

   LabelBox is a trivial axis-aligned bounding-box registry. fits() tests a
   candidate rectangle against everything already placed; place() tests and
   registers in one call. The test is the standard separating-axis check for
   two AABBs: they overlap when the centre distance on BOTH axes is less
   than half the summed extents. */
function LabelBox(){ this.boxes=[]; }
LabelBox.prototype.fits=function(x,y,w,h){
  for(var i=0;i<this.boxes.length;i++){
    var b=this.boxes[i];
    if(Math.abs(x-b.x)*2 < (w+b.w) && Math.abs(y-b.y)*2 < (h+b.h)) return false;
  }
  return true;
};
LabelBox.prototype.place=function(x,y,w,h){
  if(!this.fits(x,y,w,h)) return false;
  this.boxes.push({x:x,y:y,w:w,h:h}); return true;
};

/* textW(t,size): approximate rendered width of a string. Helvetica averages
   about 0.55 em per character across mixed-case text. Good enough for
   collision detection, and it avoids having to measure in the DOM. */
function textW(t,size){ return String(t).length*(size||10)*0.55; }

/* labelStep(n,innerW,maxChars,size): how many x labels to SKIP so they do
   not touch. Returns 1 to print every label, 2 for every other, and so on.
   This is what keeps a 16-week axis readable on a 360px phone. */
function labelStep(n,innerW,maxChars,size){
  var need=maxChars*(size||10)*0.55+8;
  return Math.max(1,Math.ceil(n/Math.max(1,Math.floor(innerW/need))));
}

/* nice(mx): round a maximum up to a human axis top — 1, 2, 2.5, 5 or 10
   times a power of ten. Without this you get axis labels like 47,382. */
function nice(mx){ if(mx<=0)return 1; var e=Math.pow(10,Math.floor(Math.log10(mx))),f=mx/e;
  var n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*e; }

/* svgOpen(w,h,cls): the opening tag. viewBox plus preserveAspectRatio is
   what makes every chart fluid: the CSS sets width:100%, and the browser
   scales the whole coordinate system. role="img" keeps it out of the
   accessibility tree as a decorative graphic. */
function svgOpen(w,h,cls){ return '<svg class="chart '+(cls||"")+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">'; }

/* tx(): the text helper every generator uses. Coordinates are rounded to one
   decimal to keep the emitted string short — with several hundred labels per
   screen that adds up. */
function tx(x,y,t,anchor,cls,size,fill){
  return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(anchor||"middle")+'"'+
    (cls?' class="'+cls+'"':'')+(size?' font-size="'+size+'"':'')+(fill?' fill="'+fill+'"':'')+'>'+t+'</text>';
}

/* ---------------- LINE ----------------
   Multi-series line chart with optional area fill, dashed series, reference
   bands and end-of-line labels.

   Options
     x         array of category labels (one per data point)
     series    [{name,color,data,dash,fillArea,dots,dotR,wdt,endLabel}]
     bands     [{y,label,color}] horizontal reference lines, e.g. safety stock
     yMin/yMax force the scale instead of deriving it
     yFmt      formatter for the y tick labels

   Null and non-finite data points are SKIPPED rather than drawn as zero,
   which is how the "You" marker on the queueing chart draws a single dot. */
function svgLine(o){
  var w=o.w||520,h=o.h||190,pl=o.pl||44,pr=o.pr||12,pt=14,pb=o.pb||26;
  var iw=w-pl-pr, ih=h-pt-pb;
  /* collect every finite value across every series to derive the scale */
  var all=[];o.series.forEach(function(s){s.data.forEach(function(v){if(v!=null&&isFinite(v))all.push(v);});});
  if(o.bands)o.bands.forEach(function(b){all.push(b.y);});   /* bands must fit too */
  var mx=o.yMax!=null?o.yMax:nice(Math.max.apply(null,all.concat([0.0001])));
  var mn=o.yMin!=null?o.yMin:Math.min(0,Math.min.apply(null,all));
  /* a single-point series is centred rather than pinned to the left edge */
  var X=function(i){return pl+(o.x.length<2?iw/2:i*iw/(o.x.length-1));};
  var Y=function(v){return pt+ih-((v-mn)/(mx-mn||1))*ih;};
  var s=svgOpen(w,h);
  /* five gridlines: 0, 25, 50, 75, 100 percent of the range */
  for(var i=0;i<=4;i++){var yv=mn+(mx-mn)*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,o.yFmt?o.yFmt(yv):fm(yv,mx<12?1:0),"end");}
  /* reference bands are drawn under the data, labelled at the right edge */
  if(o.bands)o.bands.forEach(function(b){
    s+='<line x1="'+pl+'" y1="'+Y(b.y).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(b.y).toFixed(1)+'" stroke="'+b.color+'" stroke-width="1.4" stroke-dasharray="5 4" opacity=".85"/>';
    s+=tx(w-pr-2,Y(b.y)-4,b.label,"end","lbl",8.5,b.color);});
  /* thin the x labels so they never collide */
  var maxc=Math.max.apply(null,o.x.map(function(l){return String(l).length;}));
  var stp=labelStep(o.x.length,iw,maxc,10);
  o.x.forEach(function(l,i){ if(i%stp)return;
    s+=tx(X(i),h-8,esc(l),"middle","lbl");});
  var LB=new LabelBox();
  o.series.forEach(function(se){
    /* build the path, skipping gaps. `n` tracks whether we have emitted a
       moveto yet, so a series starting with nulls still works. */
    var d="",n=0;
    se.data.forEach(function(v,i){ if(v==null||!isFinite(v))return; d+=(n++?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);});
    if(!d)return;
    /* area fill: close the path down to the baseline and back */
    if(se.fillArea){
      var f=d+"L"+X(se.data.length-1).toFixed(1)+","+Y(mn).toFixed(1)+"L"+X(0).toFixed(1)+","+Y(mn).toFixed(1)+"Z";
      s+='<path d="'+f+'" fill="'+se.color+'" opacity=".13"/>';}
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.wdt||2.1)+'" stroke-linejoin="round" stroke-linecap="round"'+
       (se.dash?' stroke-dasharray="6 4"':'')+'/>';
    if(se.dots!==false) se.data.forEach(function(v,i){ if(v==null||!isFinite(v))return;
      s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(se.dotR||2.6)+'" fill="'+se.color+'"/>';});
    /* end label: only drawn if it does not collide with a previous one */
    if(se.endLabel){
      var ly=Y(se.data[se.data.length-1]);
      if(isFinite(ly)&&LB.place(X(se.data.length-1)+4+textW(se.endLabel,9)/2,ly,textW(se.endLabel,9),11))
        s+=tx(X(se.data.length-1)+4,ly+3,se.endLabel,"start","lbl",9,se.color);
    }
  });
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- BARS ----------------
   Handles both grouped and stacked bars from one code path.

   stacked:true   one bar per category, series accumulated upward
   stacked:false  ns bars per category, side by side and centred on the slot
   valLabels:true print the value above each bar, subject to collision test

   The label font size shrinks to fit the slot width, which is what keeps
   "After changeover" readable in a four-category chart on a phone. */
function svgBars(o){
  var w=o.w||520,h=o.h||190,pl=o.pl||46,pr=12,pt=14,pb=o.pb||30;
  var iw=w-pl-pr,ih=h-pt-pb,n=o.x.length,ns=o.series.length;
  /* the scale top is the tallest STACK when stacked, the tallest single
     series value when grouped */
  var tot=o.x.map(function(_,i){ return o.stacked? sum(o.series.map(function(s){return s.data[i]||0;}))
                                                 : Math.max.apply(null,o.series.map(function(s){return s.data[i]||0;})); });
  var mx=o.yMax!=null?o.yMax:nice(Math.max.apply(null,tot.concat([0.0001])));
  var Y=function(v){return pt+ih-(v/(mx||1))*ih;};
  var gw=iw/n, bw=o.stacked? gw*0.56 : (gw*0.72)/ns;
  var s=svgOpen(w,h), LB=new LabelBox();
  for(var i=0;i<=4;i++){var yv=mx*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,o.yFmt?o.yFmt(yv):fm(yv,mx<12?1:0),"end");}
  o.x.forEach(function(l,i){
    var cx=pl+gw*i+gw/2;
    if(o.stacked){
      /* acc tracks the running top of the stack */
      var acc=0;
      o.series.forEach(function(se){ var v=se.data[i]||0;
        s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(acc+v).toFixed(1)+'" width="'+bw.toFixed(1)+
           '" height="'+Math.max(0,(Y(acc)-Y(acc+v))).toFixed(1)+'" fill="'+se.color+'" rx="1.5"/>'; acc+=v;});
    } else {
      o.series.forEach(function(se,j){ var v=se.data[i]||0;
        /* centre the whole group on cx, then offset by series index */
        var x=cx-(ns*bw)/2+j*bw;
        s+='<rect x="'+x.toFixed(1)+'" y="'+Y(v).toFixed(1)+'" width="'+(bw-1.5).toFixed(1)+
           '" height="'+Math.max(0,(Y(0)-Y(v))).toFixed(1)+'" fill="'+se.color+'" rx="1.5"/>';
        if(o.valLabels){
          var vt=o.yFmt?o.yFmt(v):fm(v,0);
          if(LB.place(x+bw/2-0.75,Y(v)-8,textW(vt,8.5),12))
            s+=tx(x+bw/2-0.75,Y(v)-3,vt,"middle","val",8.5);
        }});
    }
    /* shrink-to-fit category label, floored at 7.5px */
    var lsz=Math.min(9.5,Math.max(7.5,gw/(String(l).length*0.62)));
    s+=tx(cx,h-9,esc(l),"middle","lbl",lsz);
  });
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- HORIZONTAL BARS ----------------
   For ranked lists: cost to serve by line, days of survival, warehouse time
   split. Height is derived from the item count, so the caller never sets it.
   Each row draws a full-width track first, then the value bar over it, which
   makes the unfilled remainder legible. Long labels are ellipsised to fit
   the left gutter. */
function svgHBars(o){
  var w=o.w||520,rowH=o.rowH||22,pl=o.pl||96,pr=o.pr||54;
  var h=o.items.length*rowH+16,iw=w-pl-pr;
  var mx=nice(Math.max.apply(null,o.items.map(function(d){return Math.abs(d.v);}).concat([0.0001])));
  var s=svgOpen(w,h);
  o.items.forEach(function(d,i){
    var y=8+i*rowH, bw=Math.abs(d.v)/mx*iw;
    s+='<rect x="'+pl+'" y="'+(y+3)+'" width="'+iw+'" height="'+(rowH-9)+'" fill="var(--rule2)" rx="2"/>';
    s+='<rect x="'+pl+'" y="'+(y+3)+'" width="'+bw.toFixed(1)+'" height="'+(rowH-9)+'" fill="'+(d.color||C_ACC())+'" rx="2"/>';
    /* character budget for the gutter, then truncate with an ellipsis */
    var lab=String(d.label), cap=Math.floor((pl-10)/(9.5*0.55));
    if(lab.length>cap) lab=lab.slice(0,cap-1)+"\u2026";
    s+=tx(pl-6,y+rowH/2+0.5,esc(lab),"end","lbl",9.5);
    s+=tx(w-4,y+rowH/2+0.5,d.txt!=null?d.txt:fm(d.v,0),"end","val",9.5);
  });
  return s+'</svg>';
}

/* ---------------- SCATTER / QUADRANT ----------------
   Two modes. With `quads` it becomes a 2x2 strategy matrix (Kraljic); without
   it, a plain scatter with gridlines (cube-out versus value).

   The interesting part is the collision handling, which runs TWICE:
     PT  keeps the plotted circles from sitting on top of each other, nudging
         a coincident point right and then down until it finds space
     LB  keeps the text labels apart, trying above the point first and then
         below, and dropping the label entirely if neither fits
   Quadrant captions reserve their space in LB before any point is placed. */
function svgScatter(o){
  var w=o.w||460,h=(o.h||300)+18,pl=52,pr=16,pt=28,pb=48;
  var iw=w-pl-pr,ih=h-pt-pb;
  var X=function(v){return pl+((v-o.xMin)/(o.xMax-o.xMin||1))*iw;};
  var Y=function(v){return pt+ih-((v-o.yMin)/(o.yMax-o.yMin||1))*ih;};
  var s=svgOpen(w,h);
  if(o.quads){
    /* crosshair through the midpoint, plus four corner captions in the
       order: top-left, top-right, bottom-left, bottom-right */
    var mxx=X((o.xMin+o.xMax)/2),myy=Y((o.yMin+o.yMax)/2);
    s+='<rect x="'+pl+'" y="'+pt+'" width="'+iw+'" height="'+ih+'" fill="var(--panel2)"/>';
    s+='<line x1="'+mxx+'" y1="'+pt+'" x2="'+mxx+'" y2="'+(pt+ih)+'" stroke="var(--rule)" stroke-width="1.2"/>';
    s+='<line x1="'+pl+'" y1="'+myy+'" x2="'+(w-pr)+'" y2="'+myy+'" stroke="var(--rule)" stroke-width="1.2"/>';
    s+=tx(pl+6,pt-4,o.quads[0],"start","lbl",8.5,"var(--sub2)");
    s+=tx(w-pr-6,pt-4,o.quads[1],"end","lbl",8.5,"var(--sub2)");
    s+=tx(pl+6,pt+ih+13,o.quads[2],"start","lbl",8.5,"var(--sub2)");
    s+=tx(w-pr-6,pt+ih+13,o.quads[3],"end","lbl",8.5,"var(--sub2)");
  } else {
    for(var i=0;i<=4;i++){var y=pt+ih*i/4;
      s+='<line class="gridln" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';
      s+=tx(pl-6,y+3.2,fm(o.yMax-(o.yMax-o.yMin)*i/4,0),"end");}
  }
  var LB=new LabelBox(), PT=new LabelBox();
  /* the quadrant captions reserve their space first */
  if(o.quads){
    LB.place(pl+6+textW(o.quads[0],8.5)/2,pt-4,textW(o.quads[0],8.5),12);
    LB.place(w-pr-6-textW(o.quads[1],8.5)/2,pt-4,textW(o.quads[1],8.5),12);
  }
  o.points.forEach(function(p){
    var cx=clamp(X(p.x),pl+4,w-pr-4),cy=clamp(Y(p.y),pt+4,pt+ih-4);
    /* coincident points are nudged apart so their codes stay readable:
       step right by 1.7 radii, wrap to the next row when the plot edge is
       reached, give up after ten attempts and accept the overlap */
    var R=(p.r||7), tries=0;
    while(tries<10 && !PT.fits(cx,cy,R*2.3,R*2.3)){
      cx+=R*1.7;
      if(cx>w-pr-R){ cx=clamp(X(p.x),pl+4,w-pr-4); cy+=R*1.8; }
      cy=clamp(cy,pt+R,pt+ih-R); tries++;
    }
    PT.place(cx,cy,R*2.3,R*2.3);
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+R+'" fill="'+(p.color||C_ACC())+'" opacity=".82" stroke="#fff" stroke-width="1.4"/>';
    s+=tx(cx,cy+2.8,p.short||"","middle","",8,"#fff");   /* three-letter code inside */
    if(p.label){
      var ly=cy-(p.r||7)-3.5, lw=textW(p.label,8);
      if(!LB.place(cx,ly,lw,10)){ ly=cy+(p.r||7)+10; }   /* try below instead */
      if(LB.place(cx,ly,lw,10)) s+=tx(cx,ly,esc(p.label),"middle","lbl",8);
    }
  });
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  s+='<line class="axis" x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(pt+ih)+'"/>';
  s+=tx(pl+iw/2,h-6,esc(o.xLabel||""),"middle","lbl",9);
  /* rotated y-axis title: translate to the position, THEN rotate, so the
     rotation happens about the label's own origin */
  s+='<text transform="translate(11,'+(pt+ih/2)+') rotate(-90)" text-anchor="middle" class="lbl" font-size="9">'+esc(o.yLabel||"")+'</text>';
  return s+'</svg>';
}

/* ---------------- RADAR ----------------
   n-axis polar chart. pt(i,v) converts an axis index and a 0-100 value into
   cartesian coordinates, starting at twelve o'clock (−π/2) and going
   clockwise. Rings are drawn at 25/50/75/100, axis labels at 124 so they sit
   just outside the outline. Label anchoring is chosen by horizontal position
   so text on the left of the chart is right-aligned and vice versa. */
function svgRadar(o){
  var w=o.w||300,h=o.h||270,cx=w/2,cy=h/2+4,R=Math.min(w,h)/2-40;
  var n=o.axes.length,s=svgOpen(w,h);
  var pt=function(i,v){var a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100];};
