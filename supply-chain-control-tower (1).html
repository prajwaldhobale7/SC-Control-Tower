<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Supply Chain Control Tower</title>
<meta name="description" content="An offline, interactive supply chain planning simulator and teaching engine. FMCG, high-tech, energy and pharma.">
<style>
/* ==========================================================
   SUPPLY CHAIN CONTROL TOWER
   ----------------------------------------------------------
   Direction: a night operations centre. Control towers are
   dark rooms full of luminous instruments — so the chrome
   (header, instrument cluster, flow track, rail) is deep
   marine night, and the workspace you read in is cool
   porcelain. Sector colours are navigation and signal lights.
   Type is Helvetica in its native Swiss idiom: tight tracking
   at display sizes, strong weight contrast, strict grid.
   Signature: the instrument cluster — always visible, always
   live, swipeable on a phone.
   Zero external assets. Works offline.
   ========================================================== */

:root{
  /* --- night marine chrome --- */
  --abyss:#0B1220;
  --abyss2:#111C2E;
  --abyss3:#1A2941;
  --abyssLine:#22344F;
  --onDark:#F2F7FC;
  --onDarkSub:#8FA6C0;
  --onDarkFaint:#5E7695;

  /* --- porcelain workspace --- */
  --paper:#EEF2F7;
  --panel:#FFFFFF;
  --panel2:#F5F8FC;
  --ink:#0E1626;
  --sub:#556780;
  --sub2:#8497AE;
  --rule:#D9E2EC;
  --rule2:#EAF0F6;

  /* --- signal lights --- */
  --good:#00875E;
  --warn:#A87A05;
  --bad:#CE2B3C;
  --goodBg:#DDF3EC;
  --warnBg:#FAF1D8;
  --badBg:#FBE6E8;
  --goodLum:#3BE0AC;
  --warnLum:#F7C948;
  --badLum:#FF7A8A;

  /* --- house beacon; overridden per sector --- */
  --acc:#00B3BC;
  --accSoft:#D8F4F6;
  --accInk:#046A72;
  --accLum:#2FE3EC;
  --onAcc:#03161A;

  --hv:Helvetica,"Helvetica Neue",Arial,"Liberation Sans",sans-serif;

  /* Swiss scale — fluid, tight at the top */
  --t-hero:clamp(2rem,1.15rem + 4.2vw,3.6rem);
  --t-h2:clamp(1.22rem,1.05rem + .78vw,1.62rem);
  --t-h3:clamp(1.02rem,.95rem + .32vw,1.16rem);
  --t-body:clamp(.94rem,.9rem + .18vw,1rem);
  --t-sm:clamp(.79rem,.76rem + .12vw,.845rem);

  --sp:clamp(.85rem,.6rem + .8vw,1.2rem);
  --r:16px;
  --rSm:11px;
  --shadow:0 1px 2px rgba(14,22,38,.05),0 8px 24px -8px rgba(14,22,38,.12);
  --shadow2:0 2px 6px rgba(14,22,38,.07),0 20px 44px -12px rgba(14,22,38,.2);
  --glow:0 0 0 1px rgba(255,255,255,.05),0 6px 22px -8px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--hv);background:var(--paper);color:var(--ink);
  font-size:var(--t-body);line-height:1.62;letter-spacing:-.004em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-wrap:break-word;
}
.num,table.dg,.val,.bignum,.kpi .v,.mx .v,.statline .sv{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2;letter-spacing:-.028em}
h2{font-size:var(--t-h2)}
h3{font-size:var(--t-h3);letter-spacing:-.022em}
h4{font-size:var(--t-sm);color:var(--ink);letter-spacing:-.012em}
p{margin:0 0 .7em}
a{color:var(--accInk)}
small{font-size:var(--t-sm);color:var(--sub)}
.eyebrow{font-size:var(--t-sm);color:var(--sub);font-weight:500}
.lede{font-size:calc(var(--t-body) * 1.02);color:var(--sub);line-height:1.68}

/* ============ header: the tower ============ */
header#top{
  background:var(--abyss);color:var(--onDark);position:sticky;top:0;z-index:60;
  background-image:radial-gradient(120% 190% at 82% -70%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 62%);
  border-bottom:1px solid var(--abyssLine);
}
.wrap{max-width:1340px;margin:0 auto;padding:0 var(--sp)}
.topbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.72rem 0 .6rem}
.brandmark{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1 1 auto}
.beacon{width:32px;height:32px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(from 0deg,var(--accLum),transparent 58%);animation:sweep 4s linear infinite}
.beacon::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--accLum);box-shadow:0 0 12px var(--accLum)}
@keyframes sweep{to{transform:rotate(360deg)}}
.brandtxt{min-width:0}
.brandtxt .co{font-size:.72rem;color:var(--onDarkSub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt .ttl{font-size:clamp(.98rem,.86rem + .5vw,1.22rem);font-weight:700;line-height:1.18;letter-spacing:-.03em}
.qmeta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.qdots{display:flex;gap:3px}
.qdot{width:15px;height:6px;border-radius:3px;background:var(--abyss3)}
.qdot.done{background:var(--acc)}
.qdot.now{background:var(--onDark);box-shadow:0 0 9px var(--accLum);animation:blip 1.8s ease-in-out infinite}
@keyframes blip{50%{opacity:.4}}
.qtxt{font-size:.76rem;color:var(--onDarkSub);white-space:nowrap}

button{font-family:inherit}
.btn{font-size:.82rem;font-weight:600;letter-spacing:-.012em;border-radius:9px;padding:.52rem .85rem;cursor:pointer;
  border:1px solid transparent;background:var(--acc);color:var(--onAcc);white-space:nowrap;
  transition:transform .13s ease,filter .13s ease,box-shadow .13s ease}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 6px 16px -6px var(--acc)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--onDarkSub);border-color:var(--abyssLine)}
.btn.ghost:hover{color:var(--onDark);border-color:var(--onDarkFaint);box-shadow:none;filter:none}
.btn.lite{background:var(--panel);color:var(--ink);border-color:var(--rule);box-shadow:var(--shadow)}
.btn.sm{padding:.34rem .62rem;font-size:.76rem}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none}

/* ============ SIGNATURE: the instrument cluster ============ */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;padding-bottom:.7rem}
.kpi{background:linear-gradient(180deg,var(--abyss2),#0E1828);border:1px solid var(--abyssLine);
  border-radius:var(--rSm);padding:.45rem .58rem .5rem;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--abyssLine)}
.kpi .k{font-size:.68rem;color:var(--onDarkSub);display:flex;align-items:center;gap:4px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:clamp(1.05rem,.72rem + 1.1vw,1.42rem);font-weight:700;line-height:1.22;letter-spacing:-.035em;
  margin-top:1px;color:var(--onDark)}
.kpi .s{font-size:.68rem;color:var(--onDarkFaint);line-height:1.32;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .arrow{font-size:.68rem;margin-left:3px}
.kpi.good .v{color:var(--goodLum)} .kpi.warn .v{color:var(--warnLum)} .kpi.bad .v{color:var(--badLum)}
.kpi.good::before{background:var(--goodLum);box-shadow:0 0 10px var(--goodLum)}
.kpi.warn::before{background:var(--warnLum);box-shadow:0 0 10px var(--warnLum)}
.kpi.bad::before{background:var(--badLum);box-shadow:0 0 10px var(--badLum)}

/* direction markers */
.dir{font-size:.62rem;font-weight:700;padding:0 4px;border-radius:4px;line-height:1.5;flex:none}
.dir.up{background:rgba(59,224,172,.15);color:var(--goodLum)}
.dir.down{background:rgba(255,122,138,.15);color:var(--badLum)}
.dir.mid{background:rgba(143,166,192,.15);color:var(--onDarkSub)}
.dirL{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:6px;display:inline-block;white-space:nowrap}
.dirL.up{background:var(--goodBg);color:var(--good)}
.dirL.down{background:var(--badBg);color:var(--bad)}
.dirL.mid{background:var(--rule2);color:var(--sub)}
table.dg th .dir{background:rgba(255,255,255,.09);color:#B9CCE0}

.alertbar{border-radius:var(--rSm);padding:.6rem .8rem;font-size:var(--t-sm);margin-bottom:.7rem;
  display:flex;gap:.6rem;align-items:flex-start;flex-wrap:wrap;line-height:1.52}
.alertbar.live{background:linear-gradient(90deg,rgba(206,43,60,.22),rgba(206,43,60,.07));border:1px solid rgba(255,122,138,.32)}
.alertbar.mit{background:linear-gradient(90deg,rgba(0,135,94,.24),rgba(0,135,94,.07));border:1px solid rgba(59,224,172,.3)}
.tagpill{font-size:.68rem;padding:2px 8px;border-radius:5px;font-weight:700;flex:none;margin-top:1px}
.alertbar.live .tagpill{background:var(--badLum);color:#2A0509}
.alertbar.mit .tagpill{background:var(--goodLum);color:#02231A}

/* ============ flow track ============ */
nav#rail{background:var(--abyss2);border-bottom:1px solid var(--abyssLine);position:sticky;top:0;z-index:55}
.rails{display:flex;overflow-x:auto;padding:.6rem 0 .55rem;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.rails::-webkit-scrollbar{display:none}
.step{background:none;border:none;cursor:pointer;padding:0 2px;display:flex;flex-direction:column;align-items:center;
  gap:5px;min-width:82px;flex:1 0 auto;position:relative;color:var(--onDarkFaint);scroll-snap-align:center}
.step .bead{width:23px;height:23px;border-radius:50%;background:var(--abyss);border:1.5px solid var(--abyssLine);
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--onDarkFaint);
  position:relative;z-index:2;transition:all .2s ease}
.step .nm{font-size:.71rem;font-weight:500;line-height:1.25;text-align:center;letter-spacing:-.012em;
  white-space:nowrap;transition:color .2s}
.step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:1.5px;background:var(--abyssLine);z-index:1}
.step:first-child::before{display:none}
.step:hover .bead{border-color:var(--acc);color:var(--accLum)}
.step:hover .nm{color:var(--onDarkSub)}
.step.done .bead{background:color-mix(in srgb,var(--acc) 26%,var(--abyss));border-color:var(--acc);color:var(--accLum)}
.step.done::before{background:color-mix(in srgb,var(--acc) 55%,var(--abyssLine))}
.step.on .bead{background:var(--acc);border-color:var(--acc);color:var(--onAcc);transform:scale(1.22);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent),0 0 16px var(--acc)}
.step.on .nm{color:var(--onDark);font-weight:700}

/* ============ layout ============ */
main{max-width:1340px;margin:0 auto;padding:var(--sp) var(--sp) 3rem;
  display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp);align-items:start}
#view{min-width:0;display:flex;flex-direction:column;gap:var(--sp);animation:rise .32s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#side{position:sticky;top:5.6rem;display:flex;flex-direction:column;gap:.85rem;
  max-height:calc(100vh - 6.8rem);overflow-y:auto;scrollbar-width:thin}
#side::-webkit-scrollbar{width:5px}
#side::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:clamp(.9rem,.6rem + .9vw,1.25rem);box-shadow:var(--shadow)}
@media(hover:hover){.card{transition:box-shadow .22s ease}.card:hover{box-shadow:var(--shadow2)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--sp)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:.85rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:.7rem;margin-bottom:.7rem;flex-wrap:wrap}

/* chapter opener */
.chapter{border:1px solid var(--rule);border-radius:var(--r);padding:clamp(1rem,.7rem + 1.1vw,1.5rem);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 13%,var(--panel)),var(--panel) 62%)}
.chapter::after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 20%,transparent),transparent 68%)}
.chapter>*{position:relative;z-index:1}
.chapter .cn{font-size:.74rem;font-weight:700;color:var(--accInk)}
.chapter h2{margin:.15rem 0 .35rem}
.chapter .cd{font-size:calc(var(--t-body)*1.02);color:var(--sub);line-height:1.66;max-width:70ch}
.chapter .chain{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.85rem;font-size:.76rem;align-items:center}
.chapter .chain b{background:var(--panel);border:1px solid var(--rule);border-radius:20px;padding:.22rem .7rem;font-weight:600}
.chapter .chain i{color:var(--sub2);font-style:normal}

/* prev / next */
.pager{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:.75rem}
.pgbtn{display:flex;gap:.7rem;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--rule);
  border-radius:var(--r);padding:.85rem 1rem;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.pgbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--acc)}
.pgbtn .ar{width:32px;height:32px;border-radius:50%;background:var(--accSoft);color:var(--accInk);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700}
.pgbtn .lb{font-size:.72rem;color:var(--sub);font-weight:600}
.pgbtn .tt{font-size:.94rem;font-weight:700;line-height:1.3;letter-spacing:-.02em;display:block}
.pgbtn .wy{font-size:.78rem;color:var(--sub);line-height:1.45;margin-top:1px;display:block}
.pgbtn.nx{flex-direction:row-reverse;text-align:right}
.pgbtn.dis{opacity:.3;cursor:default;transform:none;box-shadow:none}

/* ============ controls ============ */
.ctl{margin-bottom:1rem}
.ctl:last-child{margin-bottom:0}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:.55rem}
.ctl .lab b{font-size:var(--t-sm);font-weight:600}
.ctl .val{font-size:.8rem;font-weight:700;color:var(--accInk);background:var(--accSoft);padding:1px 8px;border-radius:7px;white-space:nowrap}
.hint{font-size:.79rem;color:var(--sub);line-height:1.5;margin-top:.25rem}
input[type=range]{width:100%;height:26px;accent-color:var(--acc);cursor:pointer;margin:.2rem 0 0}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin-top:.35rem}
.seg button{font-size:.79rem;font-weight:600;padding:.42rem .72rem;border-radius:9px;border:1.5px solid var(--rule);
  background:var(--panel);color:var(--ink);cursor:pointer;transition:all .14s ease;min-height:34px}
.seg button:hover{border-color:var(--acc)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc);box-shadow:0 3px 10px -3px var(--acc)}
.sw{display:flex;align-items:center;gap:.65rem;cursor:pointer;padding:.6rem .7rem;border:1px solid var(--rule);
  border-radius:11px;background:var(--panel);width:100%;text-align:left;transition:border-color .14s}
.sw:hover{border-color:var(--acc)}
.sw .knob{width:36px;height:20px;border-radius:10px;background:var(--rule);position:relative;flex:none;transition:background .18s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;
  transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on .knob{background:var(--acc)}
.sw.on .knob::after{transform:translateX(16px)}
.sw .swtxt{font-size:.83rem;font-weight:600;line-height:1.35}
.sw .swtxt small{display:block;font-weight:400;font-size:.75rem;color:var(--sub);margin-top:1px}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:5px}

/* ============ data grid ============ */
.gridwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--panel);
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
  background-image:linear-gradient(90deg,var(--panel) 30%,transparent),linear-gradient(90deg,transparent,var(--panel) 70%),
    radial-gradient(farthest-side at 0 50%,rgba(14,22,38,.11),transparent),
    radial-gradient(farthest-side at 100% 50%,rgba(14,22,38,.11),transparent);
  background-position:0 0,100% 0,0 0,100% 0;background-repeat:no-repeat;
  background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
.gridwrap::-webkit-scrollbar{height:7px}
.gridwrap::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
table.dg{border-collapse:collapse;width:100%;font-size:.79rem;min-width:660px}
table.dg th{background:var(--abyss2);color:#BDCFE2;font-weight:600;text-align:right;padding:.5rem .62rem;font-size:.72rem;
  position:sticky;top:0;white-space:nowrap;border-bottom:1px solid var(--abyssLine);letter-spacing:-.01em}
table.dg th:first-child,table.dg td:first-child{text-align:left;position:sticky;left:0;z-index:2}
table.dg th:first-child{z-index:3}
table.dg td:first-child{background:var(--panel);border-right:1px solid var(--rule2)}
table.dg td{padding:.44rem .62rem;text-align:right;border-bottom:1px solid var(--rule2);white-space:nowrap}
table.dg tbody tr{transition:background .12s}
table.dg tbody tr:hover td,table.dg tbody tr:hover td:first-child{background:var(--accSoft)}
table.dg tr.sel td,table.dg tr.sel td:first-child{background:var(--accSoft)!important;box-shadow:inset 3px 0 0 var(--acc)}
table.dg .code{font-weight:700}
table.dg .nm{color:var(--sub);font-size:.72rem;display:block;font-weight:400}
td.g{color:var(--good);font-weight:700} td.w{color:var(--warn);font-weight:700} td.b{color:var(--bad);font-weight:700}
tfoot td{background:var(--panel2);font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
.chip{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:5px;background:var(--rule2);color:var(--sub);font-weight:700}
.chip.a{background:#DEEAFB;color:#1B4A8C} .chip.b{background:#E8E5FA;color:#4A3894} .chip.c{background:#EDF1F6;color:#556780}
.chip.x{background:#DCF2EA;color:#046046} .chip.y{background:#FAF0D8;color:#7E5A05} .chip.z{background:#FBE3E6;color:#9B1F2C}

/* ============ charts ============ */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:var(--sub)}
.chart .axis{stroke:var(--rule);stroke-width:1}
.chart .gridln{stroke:var(--rule2);stroke-width:1}
.chart .lbl{font-size:10px}
.chart .val{fill:var(--ink);font-weight:700}
.legend{display:flex;gap:.85rem;flex-wrap:wrap;font-size:.75rem;color:var(--sub);margin-top:.5rem}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

.viz{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--rule);
  border-radius:12px;padding:.85rem .9rem .7rem;margin:.75rem 0}
.viz .cap{font-size:.79rem;color:var(--sub);line-height:1.55;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--rule)}
.viz .cap b{color:var(--ink)}

/* ============ teaching ============ */
.learn{border:1px solid var(--rule);border-radius:12px;margin-bottom:.6rem;overflow:hidden;background:var(--panel)}
.learn>summary{padding:.7rem .9rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;
  align-items:center;gap:.7rem;background:var(--panel2);font-size:var(--t-sm);font-weight:600;transition:background .15s}
.learn>summary::-webkit-details-marker{display:none}
.learn>summary:hover{background:var(--accSoft)}
.learn>summary::after{content:"Explain this";font-size:.72rem;color:var(--accInk);background:var(--accSoft);
  padding:2px 10px;border-radius:20px;flex:none;font-weight:600}
.learn[open]>summary{background:var(--abyss);color:var(--onDark)}
.learn[open]>summary:hover{background:var(--abyss2)}
.learn[open]>summary::after{content:"Close";background:rgba(255,255,255,.13);color:var(--onDark)}
.learn .body{padding:.9rem 1rem;font-size:var(--t-body);line-height:1.68;border-top:1px solid var(--rule)}
.learn .body p:last-child{margin-bottom:0}
.learn .body ul{margin:0 0 .7rem;padding-left:1.2rem}
.learn .body li{margin-bottom:.35rem}

.fx{background:var(--panel2);border:1px solid var(--rule);border-left:3px solid var(--acc);border-radius:10px;
  padding:.65rem .85rem;margin:.65rem 0}
.fx .f{font-size:calc(var(--t-body)*1.03);font-weight:700;color:var(--ink);overflow-x:auto;white-space:nowrap;
  padding-bottom:2px;letter-spacing:-.015em}

/* ==========================================================
   3 · THE KNOWLEDGE BASE
   Glossary, formula sheet, Incoterms, and the things nobody
   writes down but every planner learns in year two.
   ========================================================== */

var GLOSSARY = [
/* --- demand --- */
["Bullwhip effect","DEMAND","Small ripples in shop-floor demand become tidal waves upstream. A 5% blip at retail becomes 20% at the distributor and 60% at the factory. Caused by order batching, price promotions, rationing games and — most of all — everyone forecasting off the order stream above them instead of off real end demand."],
["MAPE","DEMAND","Mean Absolute Percentage Error. Average of |actual − forecast| ÷ actual. Easy to explain, but it explodes toward infinity on low-volume items and punishes under-forecasting more than over-forecasting. Never use it alone on intermittent demand."],
["WMAPE","DEMAND","Weighted MAPE — sum of absolute errors ÷ sum of actuals. Fixes MAPE's small-number problem by weighting by volume. This is what most real planning systems actually report."],
["Bias (forecast)","DEMAND","The average signed error. MAPE tells you how wrong you are; bias tells you which direction you are consistently wrong in. Persistent positive bias means you are systematically over-forecasting and building inventory you will write off."],
["Tracking signal","DEMAND","Running sum of forecast errors ÷ mean absolute deviation. If it drifts beyond about ±4, your forecast model has lost touch with reality and needs re-fitting. It is the smoke alarm on your forecast."],
["Exponential smoothing","DEMAND","Forecast = α × last actual + (1−α) × last forecast. A high α (0.5+) reacts fast and chases noise; a low α (0.1) is stable but slow to spot a real trend. Choosing α is choosing how much you believe the most recent week."],
["Holt's method","DEMAND","Exponential smoothing with a second equation for trend. Use when demand is genuinely growing or declining rather than just wobbling around a level."],
["Holt-Winters","DEMAND","Adds a third equation for seasonality. The workhorse for anything with an annual rhythm — ice cream, flu vaccine, mince pies."],
["Croston's method","DEMAND","Built for intermittent demand — spare parts, service items, anything with many zero periods and occasional spikes. It forecasts the size of a demand event and the interval between events separately. Applying normal smoothing to a spare part gives you a nonsense answer like 0.3 units a week."],
["Demand sensing","DEMAND","Using short-term downstream signals — POS scans, weather, web traffic — to adjust the near-horizon forecast. Improves weeks 1–4; does nothing for the 40-week silicon order."],
["Unconstrained forecast","DEMAND","What the market would buy if you could supply it all. Vital to record separately from the constrained plan, otherwise you lose all memory of the demand you turned away and forecast your own shortages forever."],
["Phantom demand","DEMAND","Orders that exist only because customers fear shortage — double ordering across suppliers, or padding to secure allocation. It evaporates the moment supply recovers, usually leaving you with a warehouse full of it."],
["Cannibalisation","DEMAND","New product takes volume from your own existing product rather than the competitor's. Forecast the pair, not the launch."],
["Halo effect","DEMAND","A promotion on one item lifting sales of a related item. Promote coffee, sell more biscuits."],

/* --- inventory --- */
["Safety stock","INVENTORY","Inventory held to absorb variability, not to meet expected demand. Its size is driven by the variability of demand AND of lead time, and by how sure you want to be. It is the price of uncertainty, paid in cash."],
["Cycle stock","INVENTORY","The inventory that exists purely because you order in batches rather than one unit at a time. Averages half the order quantity. Cut it by ordering more often — if your ordering and setup costs allow."],
["Pipeline stock","INVENTORY","Stock in transit that you own but cannot touch. On a 34-day ocean lane, pipeline stock alone can exceed everything in your warehouse. It appears on your balance sheet the moment Incoterms transfer risk."],
["EOQ","INVENTORY","Economic Order Quantity — the batch size where ordering cost and holding cost are equal, which is where their sum is minimised. Its great gift is that the cost curve is very flat near the optimum: being 30% off EOQ costs you only about 4% in total cost. Precision here is not worth agonising over."],
["Reorder point (ROP)","INVENTORY","Demand during lead time plus safety stock. When on-hand plus on-order minus backorders drops below it, you place an order. Note it is calculated on inventory POSITION, not on-hand — forgetting the on-order part is the single most common cause of double ordering."],
["Cycle service level","INVENTORY","The probability of NOT stocking out during a replenishment cycle. A 95% CSL means one cycle in twenty has a shortage — it says nothing about how big that shortage is."],
["Fill rate","INVENTORY","The fraction of demand met from stock. Different from cycle service level and usually higher. A 95% CSL might deliver a 99.3% fill rate, because most stockouts are small and brief. Customers experience fill rate; textbooks compute CSL."],
["Z-score / service factor","INVENTORY","The number of standard deviations of buffer you carry. 90% → 1.28, 95% → 1.65, 98% → 2.05, 99% → 2.33, 99.9% → 3.09. The relationship is brutally non-linear: the jump from 95% to 99.9% nearly doubles your safety stock for 4.9 percentage points of service."],
["Square-root law","INVENTORY","Total safety stock across N warehouses ≈ safety stock of one warehouse × √N. Consolidating from 9 depots to 1 cuts safety stock by two-thirds. This is the entire mathematical case for centralisation — before you add back the transport cost."],
["Risk pooling","INVENTORY","Aggregating variability so highs offset lows. Works across locations, products or time. The square-root law is risk pooling with the numbers filled in."],
["Postponement","INVENTORY","Hold product in generic form and finish it late — paint, label, localise, kit — after real demand is known. Turns many uncertain SKU forecasts into one much more accurate aggregate forecast."],
["ABC analysis","INVENTORY","Pareto by value: roughly 20% of items make 80% of value (A), the next 30% make 15% (B), and the last 50% make 5% (C). It tells you where to spend management attention."],
["XYZ analysis","INVENTORY","Pareto by predictability. X = steady and forecastable, Y = variable but patterned, Z = erratic. Cross it with ABC and you get nine boxes that each deserve a different policy. AX items get tight lean control; CZ items get a generous buffer and no meetings."],
["Inventory turns","INVENTORY","COGS ÷ average inventory value. How many times a year you sell through your stock. Grocery runs 20–40; heavy industrial 2–4. Comparing turns across sectors is meaningless; comparing them across your own quarters is everything."],
["DIO","INVENTORY","Days Inventory Outstanding = 365 ÷ turns. The same fact as turns, expressed in days, which is how everyone actually talks about it."],
["Consignment stock","INVENTORY","Supplier owns the stock until you consume it. Improves your working capital and shifts the risk upstream — at a price built into the unit cost, always."],
["VMI","INVENTORY","Vendor Managed Inventory — your supplier sees your consumption and replenishes without you ordering. Kills a whole layer of bullwhip because there is one demand signal instead of two order streams."],
["Dead stock / slob","INVENTORY","Slow-moving and obsolete stock. The write-down is painful, but the real cost is the racking, the counting and the management attention it consumes for years before someone finally signs it off."],
["Min-max policy","INVENTORY","Order up to Max when you fall below Min. Simple, robust, and everywhere in real ERP systems, though slightly less cost-efficient than a properly tuned (s,Q) policy."],
["Base-stock / order-up-to","INVENTORY","Order every period back up to a target level. Best when reviewing frequently and ordering is cheap."],

/* --- source --- */
["TCO","SOURCE","Total Cost of Ownership — unit price plus freight, duty, inventory carrying, quality failure, tooling, switching and risk cost. The cheapest quote regularly turns out to be the most expensive supplier once you count the 34 days of pipeline stock and the 3% defect rate."],
["Kraljic matrix","SOURCE","Plots every purchase on supply risk versus profit impact. Four boxes: Leverage (compete it hard), Strategic (partner deeply), Bottleneck (secure supply, price is secondary), Routine (automate and stop thinking about it). Most organisations negotiate everything like it is Leverage."],
["Dual sourcing","SOURCE","Two qualified suppliers for the same item. Costs 1–4% in lost volume leverage and qualification effort, and pays out entirely on the day one of them fails. It is insurance, and like insurance it looks like waste right up until it doesn't."],
["Should-cost model","SOURCE","Building up what a part ought to cost from material, labour, machine rate, overhead and margin. Changes a negotiation from haggling to a conversation about facts."],
["MOQ","SOURCE","Minimum Order Quantity. Where a supplier's setup economics collide with your EOQ. If MOQ exceeds EOQ badly, you are financing the supplier's production efficiency out of your own working capital."],
["Lead time variability","SOURCE","More damaging than long lead time. A reliable 90-day lead time is plannable; an 'anywhere from 20 to 60 days' lead time forces you to buffer for the worst case every single cycle."],
["Supplier scorecard","SOURCE","Quality, delivery, cost, responsiveness, compliance — scored monthly and shared. The point is not the score, it is that the conversation becomes evidence-based."],
["Payment terms (DPO)","SOURCE","Days Payable Outstanding. Stretching supplier payments improves your cash conversion cycle and quietly damages your small suppliers, who then price the financing cost back into your next quote."],
["Tail spend","SOURCE","The thousands of low-value suppliers making up ~5% of spend and ~60% of transactions. Automate it; do not negotiate it."],
["Multi-tier visibility","SOURCE","Knowing your suppliers' suppliers. Most catastrophic disruptions come from tier 2 or tier 3 — a single resin plant or one specialty pigment that six of your 'independent' suppliers all buy from."],

/* --- make --- */
["MRP","MAKE","Material Requirements Planning. Takes the production schedule, explodes it through the bill of materials, subtracts what you already have and what is already on order, and tells you what to buy and when. Its assumption of infinite capacity is its famous flaw."],
["Bill of materials (BOM)","MAKE","The recipe: what goes into one unit, in what quantity, at what level. A multi-level BOM is a tree — change one component at level 4 and you may need to re-plan 200 finished goods."],
["Yield / scrap factor","MAKE","The BOM says 1kg; reality needs 1.06kg because 6% is lost in the process. Forget this and you are permanently short by exactly the scrap rate."],
["OEE","MAKE","Overall Equipment Effectiveness = Availability × Performance × Quality. Three numbers that each look respectable at 90% multiply to 73%. World class is around 85%; most lines that claim 90% are measuring only one of the three."],
["Takt time","MAKE","Available production time ÷ customer demand. The heartbeat the line must beat to. If takt is 42 seconds and your slowest station takes 51, you have found your bottleneck without needing software."],
["Cycle time vs lead time","MAKE","Cycle time is how long one unit takes to make. Lead time is how long a customer waits. The gap between them is queueing, and it is usually 90%+ of the total."],
["Little's Law","MAKE","WIP = Throughput × Cycle time. It is arithmetic, not a theory, and it holds everywhere. Its practical consequence: to cut lead time without adding capacity, cut work-in-progress. Releasing more work into a busy system makes everything slower."],
["Theory of Constraints","MAKE","Identify the bottleneck, exploit it, subordinate everything else to it, elevate it, then repeat. An hour lost at the bottleneck is an hour lost by the whole plant; an hour saved anywhere else is a mirage."],
["SMED","MAKE","Single-Minute Exchange of Die — cutting changeover time by converting internal setup (machine stopped) into external setup (done while running). Halve the changeover and the economic batch size halves too, which unlocks smaller, more frequent, fresher runs."],
["Campaign manufacturing","MAKE","Running one product for a long block to avoid changeovers and cleaning validation. Common in pharma and chemicals, where a changeover can mean days of cleaning and swab testing. Efficient for the plant, murderous for inventory."],
["Frozen period","MAKE","The near-term window where the schedule cannot change. Too short and the plant thrashes; too long and you cannot respond to real customers. Where planning and manufacturing negotiate their treaty."],
["Rough-cut capacity planning","MAKE","A quick sanity check of the demand plan against a few critical resources before committing. Catches the impossible plan before it becomes everyone's problem."],
["Heijunka","MAKE","Production levelling — smoothing volume and mix so the line runs at a steady rhythm rather than lurching between feast and famine."],

/* --- deliver --- */
["OTIF","DELIVER","On Time, In Full. Of every promised delivery, did everything ordered arrive on the promised day? It is multiplicative and unforgiving: 96% on-time × 97% in-full = 93% OTIF. Retailers now fine against it."],
["Perfect order","DELIVER","OTIF plus damage-free plus correct paperwork plus correct invoice. Four gates at 97% each = 88.5% perfect orders. This is the metric that shows how much the invisible admin failures cost you."],
["FTL vs LTL","DELIVER","Full Truckload buys the whole trailer — fast, direct, one handling. Less-than-Truckload shares it — cheaper for small volumes, but with terminal handling, transfers and more damage. The breakeven is usually somewhere around 12–16 pallets; below that LTL wins, above it FTL does."],
["Cube-out vs weigh-out","DELIVER","A trailer cubes out when it is physically full before hitting the weight limit (pillows, crisps, docks); it weighs out when it hits the weight limit with space left (cable drums, liquids). Knowing which one your product does tells you whether to optimise packaging or pallet patterns."],
["Volumetric weight","DELIVER","Air and courier freight charge on whichever is greater: actual weight, or volume ÷ a divisor (commonly 5000 or 6000 for cm³/kg). Redesigning a box to fall below the divisor is one of the highest-return exercises in logistics."],
["Milk run","DELIVER","One vehicle on a fixed loop collecting from several suppliers or delivering to several customers, instead of each running a part-empty vehicle. Cuts cost and, crucially, allows small frequent deliveries — the backbone of JIT."],
["Cross-docking","DELIVER","Inbound goods go straight to an outbound door within hours, never entering storage. Removes putaway, storage and picking cost. It requires excellent inbound timing — a cross-dock with unreliable inbound is just an expensive floor."],
["VRP","DELIVER","Vehicle Routing Problem. One depot, many stops, limited vehicles, find the cheapest routes. The number of possible solutions explodes factorially — 20 stops is more combinations than there are atoms in a person — so everyone uses heuristics."],
["Clarke-Wright savings","DELIVER","The classic VRP heuristic. For every pair of stops compute S = d(depot,i) + d(depot,j) − d(i,j): how much you save by serving them on one trip instead of two. Merge the biggest savings first while capacity allows. Typically 8–15% shorter than naive clustering, and it runs in milliseconds."],
["Sweep method","DELIVER","Rotate a line around the depot like a radar arm; add stops to a vehicle in the order they are swept until it fills, then start the next. Fast, intuitive, and noticeably worse than savings — but easy to explain to a transport office."],
["Backhaul","DELIVER","Finding a paying load for the return leg. An empty return is 50% of the distance producing 0% of the revenue and 100% of the emissions."],
["Drop trailer","DELIVER","Leaving a loaded trailer at the dock for later unloading instead of holding the driver. Slashes detention cost and turns dock scheduling from a fight into a plan."],
["Detention & demurrage","DELIVER","Detention is a charge for holding the carrier's equipment too long; demurrage is a charge for leaving a container at the port past free time. Both are pure avoidable cost, and both are usually somebody else's KPI, which is why they persist."],
["Cost to serve","DELIVER","The true cost of serving each customer or channel — including order frequency, drop size, returns, packaging, and the phone calls. Almost every business discovers that a chunk of its 'profitable' customers are not."],
["Freight class / NMFC","DELIVER","North American LTL classification by density, stowability, handling and liability. Misclassify and you get re-billed weeks later, always upward."],

/* --- warehouse --- */
["Slotting","WAREHOUSE","Deciding where each SKU physically lives. Fast movers at waist height near dispatch; slow movers high and far. A good re-slot can cut picker walking distance 20–35% with zero capital spend, and walking is 55% of a picker's time."],
["Golden zone","WAREHOUSE","The shelf band between knee and shoulder height. Fastest to pick, safest for backs. Prime real estate — reserve it for your A-movers."],
["Pick face vs reserve","WAREHOUSE","The pick face is the small accessible quantity being picked from; reserve is bulk stock feeding it. Replenishment between them is invisible work that a badly slotted warehouse doubles."],
["Wave vs batch vs zone picking","WAREHOUSE","Wave = release orders in timed groups aligned to dispatch. Batch = pick several orders in one trip, sort after. Zone = each picker owns an area and orders pass between them. Most large operations use a hybrid of all three."],
["Put-to-light / pick-to-light","WAREHOUSE","Lights direct the operator to the location and quantity. Cuts errors and training time dramatically; expensive and inflexible once installed."],
["Dock-to-stock time","WAREHOUSE","Hours from a truck arriving to the goods being available to pick. Often the largest hidden delay in the whole chain — stock physically present but system-invisible is not stock."],
["Cycle counting","WAREHOUSE","Counting a subset of locations continuously instead of shutting down for an annual stocktake. Count A items monthly, C items yearly. Fixes root causes rather than just correcting numbers once a year."],
["Inventory record accuracy","WAREHOUSE","Percentage of locations where system quantity matches physical. Below ~97% your MRP is planning on fiction, and planners start keeping private spreadsheets — which is how you know it is bad."],
["Honeycombing","WAREHOUSE","Wasted rack space from partially emptied pallet positions you cannot use for anything else. Silent, universal, and worth 10–20% of your cube."],
["FEFO vs FIFO","WAREHOUSE","First Expired First Out versus First In First Out. For anything with a shelf life FEFO is mandatory — the oldest received is not always the soonest to expire, especially with mixed batch lead times."],

   4 · THE ENGINE
   Every number on screen is computed here from published
   formulas. Nothing is faked. Change a control and the whole
   chain of consequences recalculates.

var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var sum=function(a){return a.reduce(function(x,y){return x+y;},0);};

/* standard normal */
function npdf(z){ return Math.exp(-z*z/2)/Math.sqrt(2*Math.PI); }
function ncdf(z){
  var t=1/(1+0.2316419*Math.abs(z));
  var d=npdf(z);
  var p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0? 1-p : p;
}
/* inverse normal — Acklam's approximation, good to ~1e-9 */
function nInv(p){
  if(p<=0) return -6; if(p>=1) return 6;
  var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  var b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  var c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  var d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  var pl=0.02425,q,r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
/* unit normal loss function G(k) — drives fill rate */
function lossG(k){ return npdf(k) - k*(1-ncdf(k)); }

/* ---------- one SKU, one quarter ---------- */
function computeSku(sk,g,S,q,ev,over){
  var o = over||{};
  var svc   = o.service!=null? o.service : g.service;
  var pol   = o.policy!=null?  o.policy  : g.policy;
  var src   = o.source!=null?  o.source  : g.sourcing;
  var mode  = o.mode!=null?    o.mode    : g.mode;
  var exped = (o.expedite===true||o.expedite==="true");

  /* --- demand --- */
  var season = sk.season[(q-1)%8];
  var promoM = g.promo? 1 + 0.55*sk.promo : 1;
  var evHit  = (ev && ev.hits.indexOf(sk.code)>=0);
  var evDem  = 1;
  if(evHit && ev.by==="capacity") evDem = 1.35;      /* demand-surge events */
  if(evHit && ev.by==="safety")   evDem = 1.32;
  var demand = sk.baseQ * season * promoM * evDem;
  var dailyD = demand/91;

  /* --- forecast quality --- */
  var M = METHODS[g.method];
  var cvBase = sk.cv * (g.volatility? 1.55 : 1);
  var methodF = M.f;
  if(M.croston) methodF = (sk.xyz==="Z")? 0.72 : 1.55;      /* right tool, wrong tool */
  var aOpt = clamp(cvBase*1.25,0.08,0.55);
  var aPen = 1 + Math.abs((g.alpha||0.3)-aOpt)*0.85;
  if(g.method==="naive"||g.method==="ma"||M.croston) aPen=1;                          /* alpha unused */
  var sDev=Math.abs(season-1);
  var seasonErr = M.season? 7*(1-1/(1+sDev)) : 30*(1-1/(1+sDev*0.9));
  var trueLift  = g.promo? 55*sk.promo : 0;
  var promoErr  = Math.abs((g.forecastAdj||0) - trueLift)*0.42*(sk.promo>0?1:0.15);
  var mape = clamp(cvBase*100*methodF*aPen*0.50 + seasonErr + promoErr, 1.4, 78);
  var bias = ((g.forecastAdj||0) - trueLift)*0.5 + (M.season?0:(season-1)*-9);

  /* --- lead time --- */
  var lt = sk.lt*(g.ltStress||1) + (S.key==="pharma"? g.qpDays : 0) + g.dockToStock;
  if(exped) lt = lt*0.55;
  var ltSd = sk.ltSd*(g.ltStress||1)*(src==="dual"?0.72:1);
  if(evHit && (ev.by==="dual") && src!=="dual") { lt*=1.55; ltSd*=1.8; }

  /* --- safety stock: SS = Z·sqrt(LT·sigmaD^2 + d^2·sigmaLT^2) --- */
  var sigmaD = dailyD*cvBase*LUMP[sk.xyz];
  var sigmaDeff = sigmaD*(1+mape/160);            /* forecast error inflates the buffer you need */
  var z = zFor(svc);
  var sigmaL = Math.sqrt(lt*sigmaDeff*sigmaDeff + dailyD*dailyD*ltSd*ltSd);
  var SSu = z*sigmaL*(g.ssMult||1);
  var ssDays = dailyD>0? SSu/dailyD : 0;

  /* --- order quantity --- */
  var H = sk.cost*g.holdRate;                      /* €/unit/yr */
  var Dan = demand*4;
  var eoq = Math.sqrt(2*Dan*sk.S/Math.max(H,0.0001));
  var Q;
  if(pol==="eoq")       Q = Math.max(eoq, sk.moq);
  else if(pol==="moq")  Q = sk.moq;
  else if(pol==="jit")  Q = Math.max(dailyD*7, sk.moq*0.25);
  else                  Q = Math.max(dailyD*(g.coverWeeks||4)*7, sk.moq*0.2);
  Q = Math.max(Q, dailyD*0.5);
  var orders = Dan/Q;
  var eoqGap = Math.abs(Q-eoq)/Math.max(eoq,1);

  /* --- stock positions --- */
  var cycle = Q/2;
  var campaignStock = dailyD*(g.batchDays||5)/2;   /* longer runs = more stock, older stock */
  var pipeline = dailyD*lt;
  var quarantine = (S.key==="pharma")? dailyD*g.qpDays : 0;
  var avgInv = cycle + campaignStock + SSu + quarantine;
  var rop = dailyD*lt + SSu;
  var invVal = avgInv*sk.cost;
  var daysCover = dailyD>0? avgInv/dailyD : 0;

  /* --- service: cycle service level vs fill rate --- */
  var csl = ncdf(z)*100;
  var fill = clamp((1 - (sigmaL*lossG(z))/Math.max(Q,1))*100, 40, 99.99);

  return {sk:sk,demand:demand,dailyD:dailyD,mape:mape,bias:bias,lt:lt,ltSd:ltSd,
    sigmaD:sigmaDeff,sigmaL:sigmaL,z:z,svc:svc,SSu:SSu,ssDays:ssDays,eoq:eoq,Q:Q,orders:orders,
    eoqGap:eoqGap,cycle:cycle,campaignStock:campaignStock,pipeline:pipeline,quarantine:quarantine,avgInv:avgInv,rop:rop,
    invVal:invVal,daysCover:daysCover,csl:csl,fill:fill,mode:mode,src:src,pol:pol,exped:exped,
    evHit:evHit,H:H,method:g.method};
}

/* ---------- whole company, one quarter ---------- */
function computeAll(state){
  var S=SECTORS[state.sec], g=state.g, q=state.q;
  var ev=S.events.filter(function(e){return e.q===q;})[0]||null;

  var rows=S.skus.map(function(sk){ return computeSku(sk,g,S,q,ev,state.sku[sk.code]||{}); });

  /* --- plant capacity --- */
  var oee=(g.oeeA/100)*(g.oeeP/100)*(g.oeeQ/100);
  var coLossBase=clamp(0.24-g.batchDays*0.021,0.025,0.24);
  var coLoss=g.smed? coLossBase*0.42 : coLossBase;
  var wt=function(s){return s.cost;};                       /* standard-hour proxy */
  var baseCap=sum(S.skus.map(function(s){return s.baseQ*wt(s);}))*1.72;
  var capacity=baseCap*(g.shifts/2)*oee*(1-coLoss);
  var totalDem=sum(rows.map(function(r){return r.demand*wt(r.sk);}));
  var unitsDem=sum(rows.map(function(r){return r.demand;}));
  var unitsCap=capacity/Math.max(totalDem,1)*unitsDem;
  var util=totalDem/capacity;
  var shortfall=Math.max(0,(totalDem-capacity)/totalDem);

  /* --- event impact --- */
  var mitigated=false, evOtif=0, evCost=0;
  if(ev){
    var m={
      dual:      g.sourcing==="dual",
      safety:    g.service>=97 || g.ssMult>=1.3,
      air:       g.mode==="air"||g.mode==="courier",
      cold:      g.cold==="active"|| g.mode==="reefer",
      capacity:  g.shifts>=3 || util<0.82,
      routing:   g.heuristic==="savings",
      fill:      g.fill>=88,
      lean:      g.policy==="jit"||g.service<=93,
      multimodal:g.mode==="rail"||g.mode==="truck",
      qp:        g.qpDays<=5,
      serial:    g.serial===true
    };
    mitigated=!!m[ev.by];
    evOtif=mitigated? ev.otif*0.28 : ev.otif;
    evCost=mitigated? ev.cost*0.28 : ev.cost;
  }

  /* --- service per SKU --- */
  var mo=MODES[g.mode];
  rows.forEach(function(r){
    var rel=MODEREL[r.mode]!=null?MODEREL[r.mode]:0;
    var queue = util>0.85? Math.min((util-0.85)*46,20) : 0;
    var onTime = 96 + rel - queue - r.mape*0.11 + (g.crossdock?1.2:0) +
      (g.heuristic==="savings"?0.7:0) + (g.backhaul?0.3:0) - Math.min(shortfall*26,16) +
      (r.exped?2.5:0) + (r.evHit? evOtif : evOtif*0.35);
    /* pharma cold-chain exposure */
    if(S.key==="pharma" && /2–8/.test(r.sk.temp||"")){
      var coldPen = g.cold==="active"? 0.4 : g.cold==="hybrid"? 1.4 : 3.2;
      if(g.mode!=="reefer"&&g.mode!=="air"&&g.mode!=="courier") coldPen+=4.5;
      onTime-=coldPen;
    }
    if(S.key==="pharma" && !g.serial) onTime-=2.2;
    r.onTime=clamp(onTime,45,99.6);
    r.inFull=clamp(r.fill*(1-shortfall*0.75),40,99.9);
    r.otif=r.onTime/100*r.inFull/100*100;
    r.served=r.demand*(r.inFull/100);
    r.lost=r.demand-r.served;
  });

  /* --- money --- */
  var dualPrem=g.sourcing==="dual"?0.018:0;
  var otRate=g.shifts>=3?0.035:g.shifts<=1?0:0.012;
  rows.forEach(function(r){
    var sk=r.sk;
    var chargeKg = (r.mode==="air"||r.mode==="courier")? Math.max(sk.kg, sk.cbm*167) : sk.kg;
    var fillF = 78/Math.max(g.fill,35);
    var routeF = g.heuristic==="savings"?0.90:1.0;
    var bh = g.backhaul?0.93:1;
    var frUnit = chargeKg*MODES[r.mode].eurPerKgKm*S.distanceKm*fillF*routeF*bh*(g.crossdock?0.95:1);
    if(r.exped) frUnit*=2.6;
    r.frUnit=frUnit;

    r.revenue = r.served*sk.price;
    r.cogs    = r.served*sk.cost*(1+dualPrem+otRate)*(1+(r.evHit?evCost:evCost*0.3));
    r.freight = r.served*frUnit;
    r.holding = r.invVal*g.holdRate/4;

    /* decay: shelf life waste, or tech value decay */
    var waste=0;
    if(sk.shelf>0){
      var eff = sk.shelf*(S.key==="pharma"?0.28:0.5);        /* usable window before customers refuse it */
      var wr = clamp((r.daysCover/Math.max(eff,1))-1,0,3)*0.30;
      if(g.fefo) wr*=0.55;
      waste = r.avgInv*sk.cost*clamp(wr,0,0.55);
    }
    if(S.key==="tech"){ waste += r.invVal*0.024*(r.daysCover/30); }
    r.waste=waste;

    /* cold chain excursion cost */
    r.excursion=0;
    if(S.key==="pharma" && /2–8/.test(sk.temp||"")){
      var er = g.cold==="active"?0.004: g.cold==="hybrid"?0.014:0.032;
      if(g.mode!=="reefer"&&g.mode!=="air"&&g.mode!=="courier") er*=3.1;
      r.excursion = r.served*sk.cost*er;
    }
    r.penalty = r.lost*sk.price*(S.key==="pharma"?0.42:S.key==="fmcg"?0.30:0.22);
    r.profit = r.revenue - r.cogs - r.freight - r.holding - r.waste - r.excursion - r.penalty;
    r.margin = r.revenue>0? r.profit/r.revenue*100 : 0;
    r.gm = r.revenue>0? (r.revenue-r.cogs)/r.revenue*100 : 0;
    r.gmroi = r.invVal>0? (r.revenue-r.cogs)/r.invVal : 0;
    r.turns = r.invVal>0? (r.served*sk.cost*4)/r.invVal : 0;
    r.dio = r.turns>0? 365/r.turns : 0;
    r.co2 = r.served*sk.kg/1000*S.distanceKm*MODES[r.mode].co2gPerTkm/1000; /* kg CO2e */
    r.ctsPct = r.revenue>0? (r.freight+r.holding+r.waste)/r.revenue*100 : 0;
  });

  /* --- roll-up --- */
  var revenue=sum(rows.map(function(r){return r.revenue;}));
  var cogs=sum(rows.map(function(r){return r.cogs;}));
  var freight=sum(rows.map(function(r){return r.freight;}));
  var holding=sum(rows.map(function(r){return r.holding;}));
  var waste=sum(rows.map(function(r){return r.waste;}));
  var excursion=sum(rows.map(function(r){return r.excursion;}));
  var penalty=sum(rows.map(function(r){return r.penalty;}));
  var overhead=revenue*(S.overhead||0.15);
  var profit=revenue-cogs-freight-holding-waste-excursion-penalty-overhead;
  var margin=revenue>0?profit/revenue*100:0;
  var invVal=sum(rows.map(function(r){return r.invVal;}));
  var ownFrac = g.incoterm==="exw"?1.0 : g.incoterm==="cif"?0.82 : 0.16;
  var pipeVal=sum(rows.map(function(r){return r.pipeline*r.sk.cost;}))*ownFrac;
  var bsInv=invVal+pipeVal;
  var co2=sum(rows.map(function(r){return r.co2;}));
  var served=sum(rows.map(function(r){return r.served;}));
  var lost=sum(rows.map(function(r){return r.lost;}));

  var wsum=function(f){var d=sum(rows.map(function(r){return r.demand;}));
    return d>0? sum(rows.map(function(r){return f(r)*r.demand;}))/d : 0;};
  var otif=wsum(function(r){return r.otif;});
  var mape=wsum(function(r){return r.mape;});
  var bias=wsum(function(r){return r.bias;});
  var fill=wsum(function(r){return r.inFull;});
  var onTime=wsum(function(r){return r.onTime;});

  var turns=bsInv>0? (cogs*4)/bsInv : 0;
  var dio=turns>0?365/turns:0;
  var c2c=dio+g.dso-g.dpo;
  var co2Int=revenue>0? co2/(revenue/1000) : 0;   /* kg CO2e per EUR1,000 revenue */

  /* --- resilience: TTS vs TTR --- */
  var ttr = g.sourcing==="dual"? 22 : 68;
  if(S.key==="pharma"&&g.sourcing!=="dual") ttr=118;      /* regulatory requalification */
  var crit=rows.filter(function(r){return r.sk.abc==="A";});
  var tts = crit.length? Math.min.apply(null,crit.map(function(r){return r.daysCover;})) : 30;
  var exposure=Math.max(0,ttr-tts);
  var resilience=clamp(100 - exposure*0.62 + (g.sourcing==="dual"?12:0) + (g.crossdock?2:0) +
    (mitigated?7:0) - (util>0.95?10:0),5,99);

  var bullwhip = 1 + (mape/100)*1.3 + (g.policy==="moq"?0.42:0) + (g.promo&&Math.abs(g.forecastAdj)<10?0.5:0)
    - (g.crossdock?0.08:0) - (g.policy==="jit"?0.22:0);

  return {S:S,g:g,q:q,ev:ev,rows:rows,capacity:unitsCap,totalDem:unitsDem,loadCap:capacity,loadDem:totalDem,util:util*100,
    shortfall:shortfall,oee:oee*100,coLoss:coLoss*100,mitigated:mitigated,evOtif:evOtif,evCost:evCost,
    revenue:revenue,cogs:cogs,freight:freight,holding:holding,waste:waste,excursion:excursion,
    penalty:penalty,overhead:overhead,pipeVal:pipeVal,bsInv:bsInv,profit:profit,margin:margin,invVal:invVal,co2:co2,co2Int:co2Int,
    served:served,lost:lost,otif:otif,mape:mape,bias:bias,fill:fill,onTime:onTime,turns:turns,
    dio:dio,c2c:c2c,ttr:ttr,tts:tts,exposure:exposure,resilience:resilience,bullwhip:bullwhip,
    perfectOrder:otif*0.975*0.982};
}

/* ---------- formatting ---------- */
function fm(n,d){ if(!isFinite(n))return "—";
  return n.toLocaleString("en-IE",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function money(n){
  var a=Math.abs(n);
  if(a>=1e9) return "€"+fm(n/1e9,2)+"bn";
  if(a>=1e6) return "€"+fm(n/1e6,2)+"m";
  if(a>=1e4) return "€"+fm(n/1e3,0)+"k";
  if(a>=1e3) return "€"+fm(n/1e3,1)+"k";
  return "€"+fm(n,0);
}
function pct(n,d){ return fm(n,d==null?1:d)+"%"; }
function qty(n){ return Math.abs(n)>=1e6? fm(n/1e6,2)+"m" : Math.abs(n)>=1000? fm(n/1000,1)+"k" : fm(n,0); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* ==========================================================
   5 · CHART PRIMITIVES
   Hand-written SVG. No chart library, no CDN, no fonts.
   Everything scales with viewBox so it works on a phone.
   ========================================================== */

var C_ACC=function(){return SECTORS[ST.sec]?SECTORS[ST.sec].acc:"#00A67D";};
var PAL=["#00B3BC","#4B63E8","#00A67D","#D9308F","#C99A06","#0E9BB5","#7C5CF0","#CE2B3C"];

function nice(mx){ if(mx<=0)return 1; var e=Math.pow(10,Math.floor(Math.log10(mx))),f=mx/e;
  var n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*e; }
function svgOpen(w,h,cls){ return '<svg class="chart '+(cls||"")+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">'; }
function tx(x,y,t,anchor,cls,size,fill){
  return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(anchor||"middle")+'"'+
    (cls?' class="'+cls+'"':'')+(size?' font-size="'+size+'"':'')+(fill?' fill="'+fill+'"':'')+'>'+t+'</text>';
}

/* ---------------- LINE ---------------- */
function svgLine(o){
  var w=o.w||520,h=o.h||190,pl=o.pl||44,pr=o.pr||12,pt=14,pb=o.pb||26;
  var iw=w-pl-pr, ih=h-pt-pb;
  var all=[];o.series.forEach(function(s){s.data.forEach(function(v){if(v!=null&&isFinite(v))all.push(v);});});
  if(o.bands)o.bands.forEach(function(b){all.push(b.y);});
  var mx=o.yMax!=null?o.yMax:nice(Math.max.apply(null,all.concat([0.0001])));
  var mn=o.yMin!=null?o.yMin:Math.min(0,Math.min.apply(null,all));
  var X=function(i){return pl+(o.x.length<2?iw/2:i*iw/(o.x.length-1));};
  var Y=function(v){return pt+ih-((v-mn)/(mx-mn||1))*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var yv=mn+(mx-mn)*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,o.yFmt?o.yFmt(yv):fm(yv,mx<12?1:0),"end");}
  if(o.bands)o.bands.forEach(function(b){
    s+='<line x1="'+pl+'" y1="'+Y(b.y).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(b.y).toFixed(1)+'" stroke="'+b.color+'" stroke-width="1.4" stroke-dasharray="5 4" opacity=".85"/>';
    s+=tx(w-pr-2,Y(b.y)-4,b.label,"end","lbl",8.5,b.color);});
  o.x.forEach(function(l,i){ if(o.x.length>10&&i%2)return;
    s+=tx(X(i),h-8,esc(l),"middle","lbl");});
  o.series.forEach(function(se){
    var d="",n=0;
    se.data.forEach(function(v,i){ if(v==null||!isFinite(v))return; d+=(n++?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);});
    if(!d)return;
    if(se.fillArea){
      var f=d+"L"+X(se.data.length-1).toFixed(1)+","+Y(mn).toFixed(1)+"L"+X(0).toFixed(1)+","+Y(mn).toFixed(1)+"Z";
      s+='<path d="'+f+'" fill="'+se.color+'" opacity=".13"/>';}
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.wdt||2.1)+'" stroke-linejoin="round" stroke-linecap="round"'+
       (se.dash?' stroke-dasharray="6 4"':'')+'/>';
    if(se.dots!==false) se.data.forEach(function(v,i){ if(v==null||!isFinite(v))return;
      s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(se.dotR||2.6)+'" fill="'+se.color+'"/>';});
    if(se.endLabel) s+=tx(X(se.data.length-1)+4,Y(se.data[se.data.length-1])+3,se.endLabel,"start","lbl",9,se.color);
  });
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- BARS ---------------- */
function svgBars(o){
  var w=o.w||520,h=o.h||190,pl=o.pl||46,pr=12,pt=14,pb=o.pb||30;
  var iw=w-pl-pr,ih=h-pt-pb,n=o.x.length,ns=o.series.length;
  var tot=o.x.map(function(_,i){ return o.stacked? sum(o.series.map(function(s){return s.data[i]||0;}))
                                                 : Math.max.apply(null,o.series.map(function(s){return s.data[i]||0;})); });
  var mx=o.yMax!=null?o.yMax:nice(Math.max.apply(null,tot.concat([0.0001])));
  var Y=function(v){return pt+ih-(v/(mx||1))*ih;};
  var gw=iw/n, bw=o.stacked? gw*0.56 : (gw*0.72)/ns;
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var yv=mx*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,o.yFmt?o.yFmt(yv):fm(yv,mx<12?1:0),"end");}
  o.x.forEach(function(l,i){
    var cx=pl+gw*i+gw/2;
    if(o.stacked){
      var acc=0;
      o.series.forEach(function(se){ var v=se.data[i]||0;
        s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(acc+v).toFixed(1)+'" width="'+bw.toFixed(1)+
           '" height="'+Math.max(0,(Y(acc)-Y(acc+v))).toFixed(1)+'" fill="'+se.color+'" rx="1.5"/>'; acc+=v;});
    } else {
      o.series.forEach(function(se,j){ var v=se.data[i]||0;
        var x=cx-(ns*bw)/2+j*bw;
        s+='<rect x="'+x.toFixed(1)+'" y="'+Y(v).toFixed(1)+'" width="'+(bw-1.5).toFixed(1)+
           '" height="'+Math.max(0,(Y(0)-Y(v))).toFixed(1)+'" fill="'+se.color+'" rx="1.5"/>';
        if(o.valLabels) s+=tx(x+bw/2-0.75,Y(v)-3,o.yFmt?o.yFmt(v):fm(v,0),"middle","val",8.5);});
    }
    s+=tx(cx,h-9,esc(l),"middle","lbl",n>7?8:9);
  });
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- HORIZONTAL BARS ---------------- */
function svgHBars(o){
  var w=o.w||520,rowH=o.rowH||22,pl=o.pl||96,pr=o.pr||54;
  var h=o.items.length*rowH+16,iw=w-pl-pr;
  var mx=nice(Math.max.apply(null,o.items.map(function(d){return Math.abs(d.v);}).concat([0.0001])));
  var s=svgOpen(w,h);
  o.items.forEach(function(d,i){
    var y=8+i*rowH, bw=Math.abs(d.v)/mx*iw;
    s+='<rect x="'+pl+'" y="'+(y+3)+'" width="'+iw+'" height="'+(rowH-9)+'" fill="var(--rule2)" rx="2"/>';
    s+='<rect x="'+pl+'" y="'+(y+3)+'" width="'+bw.toFixed(1)+'" height="'+(rowH-9)+'" fill="'+(d.color||C_ACC())+'" rx="2"/>';
    s+=tx(pl-6,y+rowH/2+0.5,esc(d.label),"end","lbl",9.5);
    s+=tx(w-4,y+rowH/2+0.5,d.txt!=null?d.txt:fm(d.v,0),"end","val",9.5);
  });
  return s+'</svg>';
}

/* ---------------- SCATTER / QUADRANT ---------------- */
function svgScatter(o){
  var w=o.w||460,h=o.h||300,pl=52,pr=16,pt=16,pb=38;
  var iw=w-pl-pr,ih=h-pt-pb;
  var X=function(v){return pl+((v-o.xMin)/(o.xMax-o.xMin||1))*iw;};
  var Y=function(v){return pt+ih-((v-o.yMin)/(o.yMax-o.yMin||1))*ih;};
  var s=svgOpen(w,h);
  if(o.quads){
    var mxx=X((o.xMin+o.xMax)/2),myy=Y((o.yMin+o.yMax)/2);
    s+='<rect x="'+pl+'" y="'+pt+'" width="'+iw+'" height="'+ih+'" fill="var(--panel2)"/>';
    s+='<line x1="'+mxx+'" y1="'+pt+'" x2="'+mxx+'" y2="'+(pt+ih)+'" stroke="var(--rule)" stroke-width="1.2"/>';

  var w=560,h=210,pl=50,pr=14,pt=14,pb=28,iw=w-pl-pr,ih=h-pt-pb;
  days=days||120;
  var top=Math.max(r.SSu+r.Q, r.rop*1.25)*1.12;
  var X=function(d){return pl+d/days*iw;},Y=function(v){return pt+ih-clamp(v/top,0,1)*ih;};
  var s=svgOpen(w,h);
  for(var i=0;i<=4;i++){var yv=top*i/4,y=Y(yv);
    s+='<line class="gridln" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+=tx(pl-6,y+3.2,qty(yv),"end","",8.5);}

  s+='<rect x="'+pl+'" y="'+Y(r.SSu).toFixed(1)+'" width="'+iw+'" height="'+(Y(0)-Y(r.SSu)).toFixed(1)+
     '" fill="var(--bad)" opacity=".085"/>';
  /* build the saw */
  var d="",cur=r.SSu+r.Q,t=0,cyc=r.Q/Math.max(r.dailyD,0.0001),seed=1;
  var rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280;};
  d="M"+X(0)+","+Y(cur);
  var pts=[];
  while(t<days){
    var noise=1+(rnd()-0.5)*r.sk.cv*1.6;
    var draw=Math.min(cyc*noise,days-t);
    var end=cur-r.dailyD*draw*(1+(rnd()-0.5)*0.3);
    t+=draw; d+="L"+X(t).toFixed(1)+","+Y(end).toFixed(1);
    pts.push({t:t,v:end});
    if(end<r.SSu*0.25) d+="L"+X(t).toFixed(1)+","+Y(Math.max(end,0)).toFixed(1);
    cur=Math.max(end,0)+r.Q; if(cur>top)cur=top*0.98;
    d+="L"+X(t).toFixed(1)+","+Y(cur).toFixed(1);

  s+='<path d="'+d+'" fill="none" stroke="'+C_ACC()+'" stroke-width="1.9" stroke-linejoin="round"/>';
  /* reference lines */
  [[r.rop,"var(--warn)","Reorder point "+qty(r.rop)],[r.SSu,"var(--bad)","Safety stock "+qty(r.SSu)]].forEach(function(L){
    s+='<line x1="'+pl+'" y1="'+Y(L[0]).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(L[0]).toFixed(1)+
       '" stroke="'+L[1]+'" stroke-width="1.4" stroke-dasharray="6 4"/>';

  for(var k=0;k<=4;k++) s+=tx(X(days*k/4),h-8,"day "+Math.round(days*k/4),"middle","lbl",8.5);
  s+='<line class="axis" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'"/>';
  return s+'</svg>';
}

/* ---------------- VRP ROUTE MAP ---------------- */
var STOPS=[[25,62,9],[58,78,7],[95,55,8],[130,82,6],[160,60,10],[200,75,7],[235,58,9],[268,80,6],
           [300,66,8],[330,50,7],[352,74,9],[178,40,5],[110,30,6],[290,38,7]]
  .map(function(a,i){return {id:i+1,th:a[0]*Math.PI/180,deg:a[0],r:a[1],q:a[2]};});
var DEPOT={r:0,th:0};
function dist(a,b){var ax=a.r*Math.cos(a.th),ay=a.r*Math.sin(a.th),bx=b.r*Math.cos(b.th),by=b.r*Math.sin(b.th);
  return Math.hypot(ax-bx,ay-by);}
function routeLen(rt){var d=dist(DEPOT,rt[0]);for(var i=0;i<rt.length-1;i++)d+=dist(rt[i],rt[i+1]);return d+dist(rt[rt.length-1],DEPOT);}
function sweepRoutes(cap){
  var srt=STOPS.slice().sort(function(a,b){return a.th-b.th;}),out=[],cur=[],load=0;
  srt.forEach(function(c){ if(load+c.q>cap&&cur.length){out.push(cur);cur=[];load=0;} cur.push(c);load+=c.q;});
  if(cur.length)out.push(cur); return out;
}
function savingsRoutes(cap){
  var rts=STOPS.map(function(c){return [c];}),pairs=[];
  for(var i=0;i<STOPS.length;i++)for(var j=i+1;j<STOPS.length;j++)
    pairs.push({a:STOPS[i],b:STOPS[j],s:dist(DEPOT,STOPS[i])+dist(DEPOT,STOPS[j])-dist(STOPS[i],STOPS[j])});
  pairs.sort(function(x,y){return y.s-x.s;});
  pairs.forEach(function(p){
    var ra=null,rb=null;
    rts.forEach(function(r){ if(r[0].id===p.a.id||r[r.length-1].id===p.a.id)ra=r;
                             if(r[0].id===p.b.id||r[r.length-1].id===p.b.id)rb=r;});
    if(!ra||!rb||ra===rb)return;
    var load=sum(ra.map(function(c){return c.q;}))+sum(rb.map(function(c){return c.q;}));
    if(load>cap)return;
    var L=ra,R=rb;
    if(L[L.length-1].id!==p.a.id)L=L.slice().reverse();
    if(R[0].id!==p.b.id)R=R.slice().reverse();
    if(L[L.length-1].id!==p.a.id||R[0].id!==p.b.id)return;
    rts=rts.filter(function(r){return r!==ra&&r!==rb;});
    rts.push(L.concat(R));
  });
  return rts;
}
function svgVrp(heur,cap){
  var w=520,h=330,cx=w/2,cy=h/2-4,sc=1.28;
  var P=function(n){return [cx+n.r*Math.cos(n.th)*sc, cy+n.r*Math.sin(n.th)*sc*-0.78];};
  var rts=heur==="sweep"?sweepRoutes(cap):savingsRoutes(cap);
  var s=svgOpen(w,h);
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="118" fill="none" stroke="var(--rule2)" stroke-dasharray="3 5"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="62" fill="none" stroke="var(--rule2)" stroke-dasharray="3 5"/>';
  rts.forEach(function(rt,i){
    var col=PAL[i%PAL.length],d="M"+cx+","+cy;
    rt.forEach(function(n){var p=P(n);d+="L"+p[0].toFixed(1)+","+p[1].toFixed(1);});
    d+="L"+cx+","+cy;
    s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" opacity=".85" stroke-linejoin="round"/>';
    rt.forEach(function(n){var p=P(n);
      s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="9" fill="'+col+'" stroke="#fff" stroke-width="1.6"/>';
      s+=tx(p[0],p[1]+3,String(n.q),"middle","",8.5,"#fff");});
  });
  s+='<rect x="'+(cx-13)+'" y="'+(cy-13)+'" width="26" height="26" fill="var(--ink)" rx="3"/>';
  s+=tx(cx,cy+3.5,"DC","middle","",9,"#fff");
  var tot=sum(rts.map(routeLen));
  var alt=sum((heur==="sweep"?savingsRoutes(cap):sweepRoutes(cap)).map(routeLen));
  s+=tx(10,16,rts.length+" VEHICLES · "+fm(tot,0)+" KM TOTAL","start","lbl",9.5,"var(--ink)");
  var better=tot<=alt;
  s+=tx(10,29,(better?"▼ ":"▲ ")+fm(Math.abs(tot-alt)/alt*100,1)+"% vs "+(heur==="sweep"?"savings":"sweep"),
    "start","lbl",9,better?"var(--good)":"var(--bad)");
  s+=tx(w-10,16,"numbers = drop size","end","lbl",8.5,"var(--sub2)");
  return s+'</svg>';
}

  var pts=g.slotting==="random"? [[1,6],[4,2],[6,9],[2,8],[7,1],[3,5],[5,9],[0,3]]
        : g.slotting==="abc"?    [[3,0],[4,1],[2,1],[5,2],[3,3],[6,4],[2,6],[4,8]]
        :                        [[3,0],[4,0],[3,1],[4,1],[2,2],[5,3],[3,5],[4,7]];
  var d2="M46,"+(y0+bh*4).toFixed(1);
  pts.forEach(function(p){ d2+="L"+(x0+p[1]*bw+bw/2).toFixed(1)+","+(y0+p[0]*bh+bh/2).toFixed(1); });
  d2+="L46,"+(y0+bh*4).toFixed(1);
  s+='<path d="'+d2+'" fill="none" stroke="'+C_ACC()+'" stroke-width="2" stroke-dasharray="5 3" opacity=".9"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+(x0+p[1]*bw+bw/2).toFixed(1)+'" cy="'+(y0+p[0]*bh+bh/2).toFixed(1)+'" r="7.5" fill="'+C_ACC()+'"/>';
    s+=tx(x0+p[1]*bw+bw/2,y0+p[0]*bh+bh/2+3,String(i+1),"middle","",8,"#fff");});
  var lenPx=0,prev=[46,y0+bh*4];
  pts.forEach(function(p){var c=[x0+p[1]*bw+bw/2,y0+p[0]*bh+bh/2];lenPx+=Math.hypot(c[0]-prev[0],c[1]-prev[1]);prev=c;});
  lenPx+=Math.hypot(46-prev[0],(y0+bh*4)-prev[1]);
  s+=tx(x0,20,"8-LINE PICK · ~"+fm(lenPx*0.42,0)+" M WALKED","start","lbl",9.5,"var(--ink)");
  s+=tx(w-14,20,g.slotting==="random"?"chaotic storage":g.slotting==="abc"?"ABC velocity zones":"golden-zone + family grouping","end","lbl",8.5,"var(--sub)");

/* ---------- the ledger: measure the consequence of a change ---------- */
var LEDGER_KEYS=[
  {k:"otif",     n:"OTIF",      f:function(v){return pct(v,1);},  good:1, w:1},
  {k:"margin",   n:"Margin",    f:function(v){return pct(v,1);},  good:1, w:1},
  {k:"invVal",   n:"Inventory", f:function(v){return money(v);},  good:-1,w:1},
  {k:"c2c",      n:"Cash days", f:function(v){return fm(v,0)+"d";},good:-1,w:1},
  {k:"co2Int",   n:"Carbon",    f:function(v){return fm(v,1)+"kg";},good:-1,w:1},
  {k:"resilience",n:"Resilience",f:function(v){return fm(v,0);},   good:1, w:1}
];

function applyChange(label,fromTxt,toTxt,mutate,why){
  var before=computeAll(ST);
  mutate();
  var after=computeAll(ST);
  var deltas=LEDGER_KEYS.map(function(K){
    var d=after[K.k]-before[K.k];
    return {n:K.n,d:d,txt:K.f(after[K.k]),
      sign:Math.abs(d)<1e-9?0:(d>0?1:-1),
      good:Math.abs(d)<1e-9?0:((d>0?1:-1)===K.good?1:-1),
      disp:(d>0?"+":"")+ (K.k==="invVal"? money(d) : K.k==="co2Int"? fm(d,2)+"kg" : K.k==="c2c"? fm(d,1)+"d" : fm(d,2)) };
  }).filter(function(x){return x.sign!==0;});
  var goods=deltas.filter(function(d){return d.good>0;}).length;
  var bads=deltas.filter(function(d){return d.good<0;}).length;
  ST.log.unshift({label:label,from:fromTxt,to:toTxt,deltas:deltas,why:why||"",
    tone:bads===0&&goods>0?"up":goods===0&&bads>0?"down":"mix", q:ST.q});
  if(ST.log.length>50) ST.log.pop();
}

function setG(key,val,label,fmtV,why){
  var old=ST.g[key];
  if(old===val) return;
  applyChange(label||key, fmtV?fmtV(old):String(old), fmtV?fmtV(val):String(val),
    function(){ST.g[key]=val;}, why);
}
function setSku(code,field,val,label,fmtV,why){
  if(!ST.sku[code])ST.sku[code]={};
  var old=ST.sku[code][field];
  if(old===val) return;
  applyChange(code+" · "+(label||field), old==null?"default":(fmtV?fmtV(old):String(old)),
    fmtV?fmtV(val):String(val), function(){ST.sku[code][field]=val;}, why);
}

function tone(v,good,lo,hi){
  if(good) return v>=hi?"good":v>=lo?"warn":"bad";
  return v<=lo?"good":v<=hi?"warn":"bad";
}

  var b=$("#board"); if(!b)return;

  var arrow=function(now,was,good){
    if(was==null)return "";
    var d=now-was; if(Math.abs(d)<0.05)return "";
    var up=d>0, ok=(up===(good>0));
    return '<span class="arrow" style="color:'+(ok?"#3BE0AC":"#FF7A8A")+'">'+(up?"▲":"▼")+'</span>';
  };
  var K=[
    {id:"otif",k:"OTIF",v:pct(M.otif,1),t:tone(M.otif,1,88,95),s:"on-time "+pct(M.onTime,1)+" · in-full "+pct(M.fill,1),a:arrow(M.otif,prev&&prev.otif,1)},
    {id:"margin",k:"Margin",v:pct(M.margin,1),t:tone(M.margin,1,6,14),s:money(M.profit)+" profit",a:arrow(M.margin,prev&&prev.margin,1)},
    {id:"bsInv",k:"Inventory",v:money(M.bsInv),t:tone(M.dio,0,55,85),s:fm(M.dio,0)+"d · incl "+money(M.pipeVal)+" in transit",a:arrow(M.bsInv,prev&&prev.inv,-1)},
    {id:"c2c",k:"Cash-to-cash",v:fm(M.c2c,0),t:tone(M.c2c,0,45,75),s:"days · DIO+DSO−DPO",a:arrow(M.c2c,prev&&prev.c2c,-1)},
    {id:"util",k:"Utilisation",v:pct(M.util,0),t:M.util>100?"bad":M.util>90?"warn":M.util<50?"warn":"good",s:"OEE "+pct(M.oee,0),a:""},
    {id:"mape",k:"Forecast error",v:pct(M.mape,1),t:tone(M.mape,0,12,25),s:"bias "+(M.bias>0?"+":"")+fm(M.bias,1)+"%",a:arrow(M.mape,prev&&prev.mape,-1)},
    {id:"co2Int",k:"Carbon intensity",v:fm(M.co2Int,1),t:tone(M.co2Int,0,3,12),s:"kg CO2e per €1k revenue",a:""},
    {id:"resilience",k:"Resilience",v:fm(M.resilience,0),t:tone(M.resilience,1,45,70),s:"TTS "+fm(M.tts,0)+"d vs TTR "+fm(M.ttr,0)+"d",a:arrow(M.resilience,prev&&prev.res,1)}

/* ---------- the diagnosis engine ---------- */
function coach(M){
  var g=ST.g,S=M.S,out=[];
  if(M.shortfall>0.015) out.push({t:"bad",h:"Capacity is the constraint",
    b:"Demand of "+qty(M.totalDem)+" exceeds effective capacity of "+qty(M.capacity)+". You are short <b>"+pct(M.shortfall*100,1)+
      "</b> before inventory policy even gets a say. Add a shift, raise batch length, run SMED, or lift OEE — no safety stock setting can fix a capacity gap."});
  if(M.util>95&&M.shortfall<=0.015) out.push({t:"warn",h:"Queueing is starting to bite",
    b:"At "+pct(M.util,0)+" utilisation, queue time rises exponentially rather than linearly. This is why a plant running at 98% has worse lead times than one at 85%, and why everyone blames planning."});
  if(M.mape>18) out.push({t:"bad",h:"Forecast error is expensive",
    b:"MAPE of "+pct(M.mape,1)+" inflates every safety stock in the portfolio. "+
      (g.promo&&Math.abs(g.forecastAdj)<20?"A promotion is running and your forecast is barely lifted — you are planning for a week that is not going to happen.":
       METHODS[g.method].season?"Seasonality is being modelled, so the error is coming from volatility or alpha.":
       "Your method does not model seasonality, and several SKUs here are strongly seasonal. Try Holt-Winters.")});
  if(Math.abs(M.bias)>7) out.push({t:"warn",h:"You have a bias, not just an error",
    b:"Average bias is <b>"+(M.bias>0?"+":"")+pct(M.bias,1)+"</b>. "+(M.bias>0?
      "Persistent over-forecasting builds inventory you will write off later. Bias is a planning defect — buffer does not fix it, it only hides it.":
      "Persistent under-forecasting means you are chronically short and firefighting. Service will never stabilise until this is corrected.")});
  if(M.dio>90) out.push({t:"warn",h:"Inventory is heavy",
    b:fm(M.dio,0)+" days of stock, "+money(M.invVal)+" of cash. Cash-to-cash is "+fm(M.c2c,0)+
      " days. Ask which of these SKUs actually needs "+g.service+"% — the AX items earn it, the CZ items rarely do."});
  if(M.otif<90) out.push({t:"bad",h:"Service is below the line",
    b:"OTIF "+pct(M.otif,1)+" = on-time "+pct(M.onTime,1)+" × in-full "+pct(M.fill,1)+
      ". Fix whichever factor is lower first — they multiply, so the weaker one dominates."});
  if(M.exposure>25) out.push({t:"bad",h:"Recovery gap",
    b:"Your critical SKUs survive "+fm(M.tts,0)+" days without supply; recovery takes "+fm(M.ttr,0)+
      " days. That is <b>"+fm(M.exposure,0)+" days of exposure</b>. Dual sourcing cuts TTR; more cover raises TTS. Both cost money — this is the trade you are being paid to make."});
  if(M.waste>M.profit*0.12&&M.waste>0) out.push({t:"warn",h:"Decay is eating the margin",
    b:money(M.waste)+" lost to "+(S.key==="tech"?"value decay on ageing stock":"shelf-life write-off")+
      " this quarter — "+pct(M.waste/Math.max(M.revenue,1)*100,1)+" of revenue. "+
      (S.key==="tech"?"Every extra week of cover is a real margin loss here, not a theoretical one.":"Cut cover on the short-life lines, and check FEFO is actually enforced.")});
  if(g.sourcing==="single") out.push({t:"warn",h:"Single source everywhere",
    b:"Every A item runs on one supplier. TTR is "+fm(M.ttr,0)+" days"+(S.key==="pharma"?", because a regulatory variation is required to change API source":"")+
      ". Dual sourcing costs about 1.8% per unit — that is the premium on the insurance policy."});
  if(M.bullwhip>1.5) out.push({t:"warn",h:"You are amplifying demand",
    b:"Bullwhip ratio "+fm(M.bullwhip,2)+" — your order variability is "+pct((M.bullwhip-1)*100,0)+
      " above true demand variability. Big batches, promotion spikes and forecast error all feed this."});
  if(S.key==="pharma"&&g.cold==="passive"&&g.mode!=="reefer") out.push({t:"bad",h:"Cold chain is exposed",
    b:"Passive shippers on a non-refrigerated lane, with 2–8°C product in the portfolio. An excursion does not automatically destroy stock, but it does freeze it pending QP assessment — a service failure either way."});
  if(S.key==="pharma"&&g.qpDays>12) out.push({t:"warn",h:"Release is your hidden lead time",
    b:g.qpDays+" days of QP release sits on top of every manufacturing lead time and creates "+
      qty(sum(M.rows.map(function(r){return r.quarantine;})))+" units of quarantine stock — physically present, financially owned, commercially unavailable."});
  if(g.fill<65) out.push({t:"warn",h:"You are shipping air",
    b:"Vehicles at "+g.fill+"% fill. Cost and CO2 per unit rise steeply below about 75% — an empty half-trailer costs the same to move as a full one."});
  if(!out.length) out.push({t:"good",h:"Balanced configuration",
    b:"No dominant failure mode right now. Push a control to an extreme and watch which KPI breaks first — that is the fastest way to feel where the real constraint sits."});
  return out;
}

/* deterministic pseudo-random weekly demand + forecast, for teaching charts */
function seedRnd(str){ var s=0; for(var i=0;i<str.length;i++)s=(s*31+str.charCodeAt(i))%99991;
  return function(){ s=(s*9301+49297)%233280; return s/233280; }; }
function weekly(sk,g,q,n){
  n=n||16; var rnd=seedRnd(sk.code+q), act=[],lab=[];
  var cvB=sk.cv*(g.volatility?1.55:1);
  for(var i=0;i<n;i++){
    var qi=(q-1+Math.floor(i/13))%8, sea=sk.season[qi];
    var wk=(i%13)/13, seaNext=sk.season[(qi+1)%8], seaSm=sea+(seaNext-sea)*wk*0.35;
    var promoW=(g.promo&&sk.promo>0&&i%13>=3&&i%13<=6)? 1+0.55*sk.promo*2.1 : 1;
    var noise=1+(rnd()-0.5)*cvB*2.2;
    act.push(Math.max(0,sk.baseQ/13*seaSm*promoW*noise));
    lab.push("w"+(i+1));
  }
  /* build each method's forecast on the same series */
  var M=METHODS[g.method], fc=[], lvl=act[0], tr=0, alpha=g.alpha, beta=0.15;
  var seaIdx=[];
  for(var s2=0;s2<8;s2++) seaIdx.push(sk.season[s2]);
  for(var j=0;j<n;j++){
    var f;
    if(g.method==="naive")      f = j===0?act[0]:act[j-1];
    else if(g.method==="ma")    { var w=4,acc=0,c=0; for(var m=Math.max(0,j-w);m<j;m++){acc+=act[m];c++;} f=c?acc/c:act[0]; }
    else if(g.method==="holt")  { f=lvl+tr; var pl=lvl; lvl=alpha*act[j]+(1-alpha)*(lvl+tr); tr=beta*(lvl-pl)+(1-beta)*tr; }
    else if(g.method==="hw")    { var qi2=(q-1+Math.floor(j/13))%8; f=(lvl)*seaIdx[qi2]/ (seaIdx[(q-1)%8]||1);
                                  lvl=alpha*(act[j]/(seaIdx[qi2]||1))+(1-alpha)*lvl; }
    else if(g.method==="croston"){ f = sk.xyz==="Z"? (j<2?act[0]:(act[j-1]+act[j-2])/2*0.97) : lvl*0.86; lvl=alpha*act[j]+(1-alpha)*lvl; }
    else                        { f=lvl; lvl=alpha*act[j]+(1-alpha)*lvl; }
    /* planner override on promotion weeks */
    if(g.promo&&sk.promo>0&&j%13>=3&&j%13<=6) f=f*(1+(g.forecastAdj/100));
    fc.push(Math.max(0,f));
  }
  return {lab:lab,act:act,fc:fc};
}

      o.hist2=svgLine({x:L,w:420,h:190,series:[

TABS.demand={n:"Demand planning",

      slider({g:"alpha",label:"Smoothing constant α",min:0.05,max:0.9,step:0.05,

    h+=card("Forecast vs actual · "+sk.code,"16 weeks, "+METHODS[ST.g.method].label,

      '<div class="grid3" style="margin-top:10px">'+
      '<div><div class="eyebrow">WMAPE</div><div class="bignum" data-live="mape"></div><small>accuracy</small></div>'+
      '<div><div class="eyebrow">Bias</div><div class="bignum" data-live="bias"></div><small>direction of error</small></div>'+
