      '</div>'+
      '<div data-live="fcnote"></div>');
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Seasonal shape · whole portfolio","index vs annual average",'<div data-chart="season"></div>'+
      '<p class="hint">Each line is one product code across eight quarters. Where lines diverge violently, a single company-level forecast is meaningless — '+
      'and a non-seasonal model will be wrong in a completely predictable way, which is the most annoying kind of wrong.</p>'+
      learn("Choosing a method, honestly",
        "<p>The right method is the simplest one that captures the structure actually present in the data. In order of ambition:</p>"+
        "<ul><li><b>Naive</b> — tomorrow equals today. Always compute it, because it is the benchmark. If your model cannot beat naive, it is not earning its licence fee.</li>"+
        "<li><b>Moving average</b> — stable, transparent, lags every turn by half the window.</li>"+
        "<li><b>Exponential smoothing</b> — the default. One parameter, α, controlling how much you believe the newest number.</li>"+
        "<li><b>Holt</b> — adds trend. Use only when there is a real trend; fitting trend to noise produces confident nonsense.</li>"+
        "<li><b>Holt-Winters</b> — adds seasonality. Needs two full cycles of clean history to fit.</li>"+
        "<li><b>Croston</b> — for intermittent demand. Try it on the Z-class spare or trial item and watch the error collapse; try it on a steady A item and watch it get worse.</li></ul>"+
        fx("Ft+1 = α·At + (1−α)·Ft","Simple exponential smoothing. Everything else is this with extra equations bolted on.")+
        viz(dgPromo(),"<b>Blue is what would have sold anyway. Orange is what the promotion added.</b> Forecast the two separately and each becomes predictable. Average them into one model and you are wrong in every single week — too high outside the promotion, too low inside it.")+
        minor("Never report forecast accuracy without a horizon and a level. 'We are 80% accurate' is meaningless — at one week or six months, at SKU or at category? Those numbers can be thirty points apart, and the difference decides whether a supplier can act on it.")));
    h+=card("The bullwhip effect","variance amplification by echelon",'<div data-chart="bull"></div>'+
      '<div data-live="bullnote"></div>'+
      learn("Where the whip comes from — and how to stop it",
        viz(dgBullwhip(),"<b>Read it left to right.</b> The shop shelf on the left is the only real demand there is. Everything to the right of it is a reaction to a reaction. Nobody in this picture is behaving badly — they are all forecasting off the orders they receive rather than off the shelf.")+
        "<p>Four well-run companies, each behaving rationally, will still produce wild oscillation upstream. The causes are structural, not moral:</p>"+
        "<ul><li><b>Demand signal processing</b> — each tier forecasts off the orders it receives rather than off real end demand, so noise compounds at every step.</li>"+
        "<li><b>Order batching</b> — economics push everyone to order in lumps, and lumps look like demand spikes to the tier above.</li>"+
        "<li><b>Price fluctuation</b> — promotions and forward buying move volume in time without changing consumption.</li>"+
        "<li><b>Rationing and gaming</b> — when supply is allocated in proportion to orders, inflating your order is the rational move, and everybody knows it.</li></ul>"+
        fx("Bullwhip = CV(orders) ÷ CV(demand)","Above 1.0 you are amplifying. Measure it at every handoff — the worst amplification is rarely where people assume.")+
        "<p><b>What actually works:</b> share point-of-sale data upstream, shorten and stabilise lead times, use everyday-low-pricing instead of promotional spikes, allocate on historic sell-through rather than on current order size, and let one party manage replenishment for both (VMI) so there is one signal instead of two.</p>"));
    h+='</div>';

    h+=card("Demand plan by line item","unconstrained view",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Base/qtr</th><th>Season idx</th><th>Promo sens.</th>'+
      '<th>Demand CV</th><th>Uplift needed</th><th>Uplift set</th><th>Fcst err'+dirMini('mape')+'</th><th>Bias'+dirMini('bias')+'</th><th>Recommended method</th>'+
      '</tr></thead><tbody data-live="dgrid"></tbody></table></div>'+
      '<p class="hint" style="margin-top:8px">The "uplift needed" column is the real answer; "uplift set" is what you told the system. '+
      'The gap between them is the largest single controllable source of forecast error in most consumer businesses.</p>'+
      minor("Split baseline from uplift and forecast them separately, then keep a library of past promotion responses by mechanic — multibuy, price cut, gondola end, TV support. The second time you run the same mechanic, you have data instead of an argument."));
    return h;
  },
  live:function(M){
    var r=sel(M), g=ST.g, o={};
    var W=weekly(r.sk,g,ST.q,16);
    var errs=W.act.map(function(a,i){return a-W.fc[i];});
    var mad=sum(errs.map(Math.abs))/errs.length;
    var ts=mad>0? sum(errs)/mad : 0;
    var wmape=sum(errs.map(Math.abs))/Math.max(sum(W.act),1)*100;
    var bias=sum(errs)/errs.length/Math.max(sum(W.act)/W.act.length,1)*100;
    o.mape='<span class="'+(wmape<12?"g":wmape<25?"w":"b")+'">'+fm(wmape,1)+'%</span>';
    o.bias='<span class="'+(Math.abs(bias)<5?"g":Math.abs(bias)<12?"w":"b")+'">'+(bias>0?"+":"")+fm(bias,1)+'%</span>';
    o.ts='<span class="'+(Math.abs(ts)<2.5?"g":Math.abs(ts)<4?"w":"b")+'">'+(ts>0?"+":"")+fm(ts,2)+'</span>';
    var msg;
    if(Math.abs(ts)>4) msg=nt("bad","Tracking signal has broken","The running error sum is <b>"+fm(ts,2)+"</b> MADs. The model is no longer tracking reality — this is not noise, it is a structural miss. Change method or re-fit before you touch safety stock.");
    else if(wmape>25) msg=nt("bad","The forecast is not usable","At "+fm(wmape,1)+"% error you are buffering blind. Every point of error here becomes inventory somewhere else."+(METHODS[g.method].season?"":" This item is seasonal and your method does not model seasonality."));
    else if(bias<-8) msg=nt("warn","Consistently under-forecasting","You are short by "+fm(-bias,1)+"% on average, which means chronic firefighting. Service will not stabilise until the bias is corrected — buffer cannot fix a systematic miss.");
    else if(bias>8) msg=nt("warn","Consistently over-forecasting","You are over by "+fm(bias,1)+"% on average. That inventory does not disappear — it becomes a write-off, one quarter later, with somebody else's name on the report.");
    else msg=nt("good","Forecast is behaving","Error "+fm(wmape,1)+"%, bias "+fm(bias,1)+"%, tracking signal "+fm(ts,2)+". Now check whether the remaining error is irreducible noise — beyond that point, extra modelling effort buys nothing and you should be spending it on lead time instead.");
    o.fcnote=msg;
    var b=M.bullwhip;
    o.bullnote = b>1.6? nt("bad","You are amplifying hard","Order variability is "+pct((b-1)*100,0)+" above true demand variability. Every tier above you is now planning against a signal you invented.")
      : b>1.25? nt("warn","Moderate amplification","Ratio "+fm(b,2)+". Batching and forecast error are the main contributors here. Smaller, more frequent orders would flatten this.")
      : nt("good","Demand signal is clean","Ratio "+fm(b,2)+" — your orders look roughly like real demand. This is worth more to your suppliers than any forecast you could send them.");
    o.dgrid=M.rows.map(function(rr){
      var need=ST.g.promo? 55*rr.sk.promo : 0;
      var set=ST.g.forecastAdj, gap=Math.abs(set-need);
      var rec = rr.sk.xyz==="Z"? "Croston" : Math.max.apply(null,rr.sk.season)>1.5? "Holt-Winters" : "Exp. smoothing";
      var ok = (rec.indexOf(METHODS[ST.g.method].label.split(" ")[0])>=0)||
               (rec==="Exp. smoothing"&&ST.g.method==="expo")||(rec==="Holt-Winters"&&ST.g.method==="hw")||(rec==="Croston"&&ST.g.method==="croston");
      return '<tr data-selsku="'+rr.sk.code+'" style="cursor:pointer" class="'+(rr.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+rr.sk.code+'<span class="nm">'+esc(rr.sk.name)+'</span></td>'+
        '<td><span class="chip '+rr.sk.abc.toLowerCase()+'">'+rr.sk.abc+'</span> <span class="chip '+rr.sk.xyz.toLowerCase()+'">'+rr.sk.xyz+'</span></td>'+
        '<td>'+qty(rr.sk.baseQ)+'</td>'+
        '<td>'+fm(rr.sk.season[(ST.q-1)%8],2)+'</td>'+
        '<td>'+fm(rr.sk.promo*100,0)+'%</td>'+
        '<td>'+fm(rr.sk.cv*100,0)+'%</td>'+
        '<td>'+fm(need,0)+'%</td>'+
        '<td class="'+(gap<8?"g":gap<30?"w":"b")+'">'+fm(set,0)+'%</td>'+
        '<td class="'+(rr.mape<12?"g":rr.mape<25?"w":"b")+'">'+fm(rr.mape,1)+'%</td>'+
        '<td class="'+(Math.abs(rr.bias)<6?"g":"w")+'">'+(rr.bias>0?"+":"")+fm(rr.bias,1)+'</td>'+
        '<td class="'+(ok?"g":"w")+'">'+rec+(ok?" ✓":"")+'</td></tr>';
    }).join("");
    return o;
  },
  charts:function(M){
    var S=M.S,r=sel(M),g=ST.g,o={};
    var W=weekly(r.sk,g,ST.q,16);
    o.fc=svgLine({x:W.lab,w:520,h:210,series:[

      valLabels:true,yFmt:function(v){return fm(v,0);}});

  }
};

      '<div data-live="eoqnote"></div>'+
      learn("Why EOQ matters less than people think",
        fx("EOQ = √(2·D·S ÷ H)","D = annual demand · S = cost to place one order · H = holding cost per unit per year.")+
        "<p>The formula is exactly the point where ordering cost and holding cost cross. Order more, and you carry more stock; order less, and you place more orders. The minimum of the sum sits where they are equal.</p>"+
        "<p>But look at the curve on the left: it is <b>very flat near the bottom</b>. Being 30% away from EOQ costs you roughly 4% in total cost. This has two consequences that matter more than the formula:</p>"+
        "<ul><li>Do not agonise over precision. Round to a sensible pallet or case quantity and move on.</li>"+

        minor("EOQ assumes constant demand, instant replenishment, no quantity discounts and no capacity limit. All four are false in your business. Use it as a sanity check on the order of magnitude, never as an instruction.")));

        fx("SS = Z · √(LT·σd² + d²·σLT²)","The full formula. Term one is demand variability over the lead time; term two is lead-time variability.")+
        "<p>Most people use only the first term and then wonder why service is worse than the model promised. If your supplier's delivery varies by ±8 days, that variability is often the <b>larger</b> of the two terms — and it is usually the cheaper one to fix.</p>"+
        "<p>Three things follow directly:</p>"+
        "<ul><li>Halving lead time cuts safety stock by about 29%, not 50% — the lead time sits under a square root.</li>"+
        "<li>Halving lead-time <b>variability</b> often does more than halving lead time itself, and costs a conversation rather than a contract.</li>"+
        "<li>Forecast error and demand variability enter the same term. A better forecast is a genuine inventory reduction, not a soft benefit.</li></ul>"+
        viz(dgPooling(),"<b>The square-root law.</b> Nine warehouses each need their own buffer against their own surprises. Pool them into one and the surprises cancel each other out — you need roughly √9 = 3 units instead of 9, for exactly the same service. This is the entire mathematical case for centralisation, before you add back the extra transport cost.")+
        "<p><b>Service level versus fill rate.</b> Cycle service level is the probability of not stocking out in a cycle. Fill rate is the fraction of demand met from stock. They are different numbers and the gap is usually 3–5 points — 95% CSL typically gives 99%+ fill, because most stockouts are small and brief. Always establish which one the customer is actually measuring.</p>"+

      '<div>'+seg({g:"mode",sku:sk.code,label:"Transport mode",opts:S.modes.map(function(m){return {v:m,l:MODES[m].label.split(" ")[0]};}),
        hint:"High value density can justify air on one line while everything else goes by sea.",

           :r.sk.abc==="C"?"low value. Big batches, generous cover, annual review. Management attention here is waste."

TABS.sourcing={n:"Sourcing",
  html:function(M){

      seg({g:"sourcing",label:"Sourcing posture",opts:[{v:"single",l:"Single source"},{v:"dual",l:"Dual source"}],

          (S.key==="pharma"?"118 to 22 days":"68 to 22 days")+".",
        why:"Dual sourcing raises unit cost, lowers lead-time sigma (so lowers safety stock), and dramatically cuts time-to-recover."})+
      slider({g:"ltStress",label:"Lead time environment",min:0.7,max:1.8,step:0.05,suf:"×",

        hint:"Hours from truck arriving to stock being pickable. The most commonly ignored lead time in the whole chain.",

    ;
    h+=card("Kraljic portfolio","supply risk vs profit impact",'<div data-chart="kraljic"></div>'+
      '<p class="hint">Every purchase belongs in one of four boxes, and each box calls for a completely different behaviour. Most organisations negotiate everything as if it were Leverage.</p>'+
      learn("The four boxes, and what to actually do in each",
        "<ul><li><b>Routine</b> (low risk, low impact) — automate. Catalogues, P-cards, consolidated suppliers. Every hour spent negotiating here is an hour stolen from somewhere it matters.</li>"+
        "<li><b>Leverage</b> (low risk, high impact) — compete it. Many capable suppliers, standardised specification, real tendering. This is where negotiation skill pays.</li>"+
        "<li><b>Bottleneck</b> (high risk, low impact) — secure supply, and stop caring about price. A €4,000 sole-source item that stops your line is not a cost problem, it is a continuity problem. Buffer it, dual-qualify it, or redesign it out.</li>"+
        "<li><b>Strategic</b> (high risk, high impact) — partner. Joint planning, shared forecasts, long agreements, joint development, executive relationships on both sides.</li></ul>"+
        minor("The most common and most expensive error is treating Bottleneck items as Routine because they are cheap. Map your suppliers by revenue at risk, not by spend, and the sole-source label printer will jump straight to the top of the list where it belongs.")));
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Total cost of ownership","the quote is not the cost",'<div data-chart="tco"></div>'+
      '<div data-live="tconote"></div>'+
      learn("Building a TCO that survives scrutiny",
        fx("TCO = price + freight + duty + inventory carrying + quality + risk + switching","Everything the supplier costs you, not everything they charge you.")+
        "<ul><li><b>Pipeline inventory.</b> A 34-day ocean lane on a €448 item at 92,000 units a quarter ties up serious cash. At a 31% carrying rate that is real money, every year, forever.</li>"+
        "<li><b>Quality cost.</b> A 2% defect rate is not 2% of price — it is inspection, rework, scrap, expedited replacement, and the customer credit.</li>"+
        "<li><b>Minimum order quantity.</b> If their MOQ is four times your EOQ, you are financing their production efficiency.</li>"+
        "<li><b>Risk cost.</b> Probability of disruption × cost per day × expected days. Crude, but it puts sole-sourcing in the same units as price.</li></ul>"+
        "<p>A supplier 6% cheaper on paper is regularly 4% more expensive in total. The discipline is to build the model once, honestly, and then apply it to every quote.</p>"));
    h+=card("Supplier scorecard","weighted, quarterly",'<div data-chart="scorecard"></div>'+
      '<p class="hint">Quality, delivery, cost, responsiveness and compliance. The score itself matters less than the fact that the review becomes evidence-based rather than anecdotal.</p>'+
      minor("Ask every critical supplier one question: how long would it take you to resume supply after losing your main site? That single number — time to recover — is worth more than a hundred-question risk questionnaire, and most suppliers have never been asked it."));
    h+='</div>';

    h+=card("Sourcing ledger · every line item","per-SKU overrides available",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Source</th><th>Lead time</th><th>σ lead t</th><th>MOQ</th><th>vs EOQ</th>'+
      '<th>Order cost</th><th>Unit cost</th><th>Pipeline €</th><th>Spend/qtr</th><th>Risk</th>'+
      '</tr></thead><tbody data-live="sgrid"></tbody></table></div>'+
      '<p class="hint" style="margin-top:8px">The "vs EOQ" column is where supplier economics collide with yours. When MOQ is far above EOQ, the supplier has exported '+
      'their setup cost onto your balance sheet — and that is a commercial conversation, not a planning parameter.</p>'+
      learn("Lead time is a negotiable, not a fact",
        viz(dgLeadTime(),"<b>One quoted lead time, broken into what it is actually made of.</b> The grey blocks are pure information delay — paperwork and approvals that produce nothing. The green block is the only part where the product is being made. Most people try to attack the green block, which is the hardest and most expensive one to move.")+
        "<p>Quoted lead time is a marketing number. Measure the actual distribution yourself over six months and plan against that instead — you will usually find the mean is close and the variance is far worse than advertised.</p>"+
        "<p>Then attack it in this order, because this is the order of cost:</p>"+
        "<ul><li><b>Variability first.</b> A reliable 90-day lead time is entirely plannable. An 'anywhere from 20 to 60 days' lead time forces you to buffer the worst case every cycle. Reducing variance is usually free — it needs a conversation about their scheduling, not a change to their process.</li>"+
        "<li><b>Information lead time next.</b> How many of those days are your own order approval, their order entry, and paperwork? This part is often a third of the total and costs nothing but attention to remove.</li>"+

TABS.production={n:"Production",
  html:function(M){

        hint:"Three shifts adds 3.5% to unit cost through overtime and kills your maintenance window.",

      slider({g:"batchDays",label:"Campaign length",min:1,max:20,suf:" days",

      slider({g:"oeeP",label:"Performance",min:60,max:99,suf:"%",hint:"Actual rate against design rate. Micro-stops and slow running — the losses nobody logs.",why:"Performance loss is usually invisible because it never triggers a downtime record."})+
      slider({g:"oeeQ",label:"Quality",min:80,max:99.9,step:0.1,suf:"%",hint:"First-pass yield. Rework counts as a loss even when the product is eventually saved.",why:"Quality loss consumes capacity twice — once making the defect, once making the replacement."}));

      '<div><div class="eyebrow">OEE</div><div class="bignum" data-live="oee"></div><small data-live="oeen"></small></div>'+
      '<div><div class="eyebrow">Utilisation</div><div class="bignum" data-live="util"></div><small>demand ÷ capacity</small></div>'+

    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Queueing: why 98% utilisation is a trap","relative lead time vs utilisation",
      '<div data-chart="queue"></div>'+
      '<p class="hint">Lead time does not rise gently as you load a plant — it rises hyperbolically. Between 85% and 95% utilisation, queue time roughly triples. '+
      'This is the single most counter-intuitive fact in operations, and it is why a plant that looks efficient on a utilisation report is often the one with the worst delivery performance.</p>'+
      learn("Little's Law and the discipline of releasing less work",
        viz(dgLittle(),"<b>Identical machine in both rows.</b> The top row has three jobs in the system and a six-day lead time. The bottom row has eleven jobs and a twenty-two day lead time. Nothing got slower — the work just spends its life queueing. Releasing jobs earlier to 'catch up' is what created the bottom row.")+
        fx("WIP = Throughput × Cycle time","Arithmetic, not theory. It holds in a factory, a warehouse, a hospital and an inbox.")+
        "<p>Rearranged: <b>Cycle time = WIP ÷ Throughput</b>. If throughput is capped by your bottleneck, the only way to cut lead time is to cut work-in-progress. Releasing more work into a busy system does not make it produce faster — it makes everything in it slower, including the urgent job you released it for.</p>"+
        "<p>The practical rules that fall out of this:</p>"+
        "<ul><li>Cap WIP deliberately. Kanban does this by design — you cannot start something new until something finishes.</li>"+
        "<li>Do not schedule the bottleneck at 100%. Leave protective capacity or every disturbance becomes a delivery miss.</li>"+
        "<li>An hour lost at the bottleneck is an hour lost by the whole plant. An hour saved anywhere else is a mirage.</li>"+
        "<li>Fix the constraint and a new one appears somewhere else. That is success, not failure — but it means the plan must be re-checked rather than reused.</li></ul>"+
        minor("When a plant is late on everything, the instinct is to release jobs earlier. It is precisely wrong. Releasing earlier raises WIP, which raises cycle time, which makes you later — and then you release earlier still. A lot of expedite culture is this loop, running quietly for years.")));
    h+=card("MRP explosion","from finished goods to purchase orders",
      '<div data-live="mrp"></div>'+
      learn("What MRP actually does, and where it lies to you",
        "<p>MRP takes three inputs — the master production schedule, the bill of materials, and current inventory plus open orders — and answers one question for every component: <b>what do I need, how much, and by when?</b></p>"+
        "<ul><li><b>Gross requirement</b> — what the BOM says you need, quantity per parent × parent quantity.</li>"+
        "<li><b>Net requirement</b> — gross minus on-hand minus scheduled receipts. This is the netting step, and it is the whole point.</li>"+
        "<li><b>Planned order release</b> — net requirement, offset backwards by the lead time, and rounded to lot-size rules.</li></ul>"+
        viz(dgMRPnet(),"<b>Each bar subtracts from the one above it.</b> You need the gross quantity, but you already hold some and have already ordered some. What is left — the orange bar — is the only quantity that needs a purchase order. Systems that skip this netting step reorder things they already own.")+
        fx("Net = Gross − On hand − Scheduled receipts + Safety stock","Applied level by level down the BOM. Change something at level four and 200 finished goods may need re-planning.")+
        "<p><b>Where it lies.</b> Classic MRP assumes infinite capacity — it will cheerfully tell you to make 40,000 units next Tuesday on a line that can make 12,000. It also assumes lead times are fixed constants, when in reality they lengthen exactly when you are busy. That is why MRP output is a proposal, not an instruction, and why rough-cut capacity planning exists.</p>"+
        minor("A yield or scrap factor missing from the BOM is the most common silent killer in MRP. If the process really consumes 1.06kg to make 1kg and the BOM says 1.00, you will be exactly 6% short forever, and the shortage will be blamed on the supplier every single time.")));
    h+='</div>';

    h+=card("Line loading by product code","effective capacity share",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Demand</th><th>Batch size</th><th>Runs/qtr</th>'+
      '<th>Changeovers</th><th>Capacity share</th><th>Served</th><th>Lost'+dirMini('penalty')+'</th><th>Lost value</th>'+
      '</tr></thead><tbody data-live="pgrid2"></tbody><tfoot data-live="pfoot"></tfoot></table></div>'+
      '<p class="hint" style="margin-top:8px">When capacity is short, something must give. Allocating in proportion to demand feels fair and is usually wrong — '+
      'the profit-maximising rule is to allocate by <b>contribution margin per unit of the constrained resource</b>, not by volume or by whoever shouted loudest.</p>'+
      learn("SMED: buying capacity without buying a machine",
        "<p>Single-Minute Exchange of Die separates changeover work into two kinds:</p>"+
        "<ul><li><b>Internal setup</b> — can only be done with the machine stopped.</li>"+
        "<li><b>External setup</b> — can be done while the machine is still running the previous product.</li></ul>"+
        "<p>The method is simply: observe and classify every step, convert as much internal to external as possible (pre-stage tooling, pre-heat, pre-kit materials), then streamline what remains (quick-release fittings, standardised heights, no threaded fasteners, no adjustment by trial).</p>"+
        fx("Economic batch ∝ √(setup time)","Halve the changeover and the economic batch falls ~29%, which is how lean plants run small batches without losing capacity.")+
        "<p>The consequence matters more than the capacity: shorter changeovers make small batches economic, small batches make fresher stock and faster response possible, and that is worth far more than the recovered hours.</p>"+
        minor("Changeover time is almost always measured last-good-part to first-good-part. If your plant measures machine-stop to machine-start, it is hiding the run-up scrap and the quality settling period, which is often the larger half.")));
    return h;
  },
  live:function(M){
    var g=ST.g,o={};
    o.oee='<span class="'+(M.oee>=80?"g":M.oee>=65?"w":"b")+'">'+fm(M.oee,1)+'%</span>';
    o.oeen=fm(g.oeeA,0)+" × "+fm(g.oeeP,0)+" × "+fm(g.oeeQ,0);
    o.util='<span class="'+(M.util>100?"b":M.util>90?"w":"g")+'">'+fm(M.util,0)+'%</span>';
    o.co='<span class="'+(M.coLoss<8?"g":M.coLoss<16?"w":"b")+'">'+fm(M.coLoss,1)+'%</span>';
    o.con=g.smed?"SMED active":"no SMED programme";
    o.capnote = M.shortfall>0.015
      ? nt("bad","You cannot make what you have sold","Short by "+qty(M.totalDem-M.capacity)+" "+M.S.unit+" ("+pct(M.shortfall*100,1)+
        "). No inventory policy fixes this — it is a capacity gap. Your options are a shift, longer campaigns, SMED, or an OEE improvement. Doing nothing means the shortfall is allocated for you, badly.")
      : M.util>92 ? nt("warn","Running hot","At "+pct(M.util,0)+" utilisation queue times are climbing steeply and you have no protective capacity for a disturbance. This looks efficient on a report and feels terrible in the despatch office.")
      : M.util<55 ? nt("warn","Heavily under-loaded","At "+pct(M.util,0)+" you are paying for capacity you are not using. Fixed cost per unit is high and the plant is absorbing overhead badly. Either fill it or shrink it.")
      : nt("good","Comfortable loading",pct(M.util,0)+" utilisation with OEE at "+pct(M.oee,1)+". You have protective capacity for a disturbance, which is what actually delivers service.");
    var totLoss=sum(M.rows.map(function(r){return r.lost*r.sk.price;}));
    o.pgrid2=M.rows.map(function(r){
      var runs=Math.max(1,91/Math.max(ST.g.batchDays,1)*(r.demand/Math.max(M.totalDem,1)));
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.name)+'</span></td>'+
        '<td><span class="chip '+r.sk.abc.toLowerCase()+'">'+r.sk.abc+'</span></td>'+
        '<td>'+qty(r.demand)+'</td><td>'+qty(r.demand/Math.max(runs,1))+'</td>'+
        '<td>'+fm(runs,1)+'</td><td>'+fm(runs,0)+'</td>'+
        '<td>'+pct(r.demand/Math.max(M.totalDem,1)*100,1)+'</td>'+
        '<td>'+qty(r.served)+'</td>'+
        '<td class="'+(r.lost/r.demand<0.02?"g":r.lost/r.demand<0.06?"w":"b")+'">'+qty(r.lost)+'</td>'+
        '<td>'+money(r.lost*r.sk.price)+'</td></tr>';
    }).join("");
    o.pfoot='<tr><td>PLANT TOTAL</td><td></td><td>'+qty(M.totalDem)+'</td><td></td><td></td><td></td>'+
      '<td>'+pct(M.util,0)+'</td><td>'+qty(M.served)+'</td><td>'+qty(M.lost)+'</td><td>'+money(totLoss)+'</td></tr>';
    var lv=[];
    var S=M.S;
    lv.push('<div class="gridwrap"><table class="dg"><thead><tr><th>Level</th><th>Item</th><th>Qty per</th><th>Gross req</th><th>On hand</th><th>Net req</th><th>Lead time</th><th>Release</th></tr></thead><tbody>');
    var top=M.rows[0];
    var comps=[
      {l:0,n:top.sk.code+" (finished)",q:1,lt:Math.round(ST.g.batchDays)},
      {l:1,n:"Primary pack / housing",q:1,lt:28},
      {l:1,n:"Active component",q:S.key==="pharma"?0.02:1,lt:Math.round(top.lt*0.7)},
      {l:2,n:"Raw material A",q:S.key==="pharma"?0.021:1.06,lt:Math.round(top.lt)},
      {l:2,n:"Raw material B",q:2.04,lt:42},
      {l:3,n:"Label / artwork",q:1,lt:14}
    ];
    comps.forEach(function(c){
      var gross=top.demand*c.q, oh=gross*(0.28-c.l*0.05), net=Math.max(0,gross-oh);
      lv.push('<tr><td class="code">'+"·".repeat(c.l)+" L"+c.l+'</td><td style="text-align:left">'+esc(c.n)+'</td>'+
        '<td>'+fm(c.q,c.q<1?3:2)+'</td><td>'+qty(gross)+'</td><td>'+qty(oh)+'</td>'+
        '<td class="'+(net>0?"w":"g")+'">'+qty(net)+'</td><td>'+c.lt+'d</td>'+
        '<td>day −'+c.lt+'</td></tr>');
    });
    lv.push('</tbody></table></div><p class="hint" style="margin-top:8px">Read it downwards: each level nets against its own stock, then offsets backwards by its own lead time. '+
      'The cumulative lead time to the bottom of this tree is what actually determines how fast you can respond to a change in demand — not the lead time of any single component.</p>');
    o.mrp=lv.join("");
    return o;
  },
  charts:function(M){
    var S=M.S,g=ST.g,o={};
    o.cap=svgBars({w:460,h:210,x:["Theoretical","After OEE","After changeover","Demand"],
      yFmt:function(v){return qty(v);},valLabels:true,
      series:[{name:"units",color:S.acc,data:[
        M.capacity/((M.oee/100)*(1-M.coLoss/100)),
        M.capacity/(1-M.coLoss/100),
        M.capacity, M.totalDem]}]});
    var us=[50,60,70,75,80,85,88,90,92,94,96,98];
    o.queue=svgLine({w:460,h:200,x:us.map(function(u){return u+"%";}),
      series:[{name:"Relative lead time",color:S.acc,data:us.map(function(u){return 1/(1-u/100);})},
              {name:"You",color:"#CE2B3C",data:us.map(function(u){return Math.abs(u-M.util)<3? 1/(1-clamp(M.util,40,97)/100):null;}),dotR:6}],
      yFmt:function(v){return fm(v,0)+"×";}});
    return o;
  }
};

/* ============================== 06 LOGISTICS ============================== */
TABS.logistics={n:"Logistics",
  html:function(M){
    var S=M.S,h='';
    h+='<div class="grid2">';
    h+=card("Transport controls","",
      seg({g:"mode",label:"Primary mode",opts:S.modes.map(function(m){return {v:m,l:MODES[m].label};}),
        hint:MODES[ST.g.mode].note,
        why:"Mode sets transit time, cost per kilo and CO2 per tonne-km simultaneously. There is no free choice here."})+
      slider({g:"fill",label:"Vehicle fill rate",min:35,max:100,suf:"%",
        hint:"Below about 75%, cost and CO2 per unit rise steeply — an empty half-trailer costs the same to move as a full one.",
        why:"Fill rate divides fixed transport cost across more units. It is the cheapest lever in logistics and the most commonly ignored."})+
      seg({g:"heuristic",label:"Routing algorithm",opts:[{v:"sweep",l:"Sweep"},{v:"savings",l:"Clarke-Wright"}],
        hint:"Sweep clusters by angle; savings merges the pairs with the largest distance saving first.",
        why:"Routing algorithm changes total distance by 8–15% at zero capital cost."})+
      slider({g:"vrpCap",label:"Vehicle capacity",min:14,max:60,suf:" drops",
        hint:"Bigger vehicles mean fewer routes but less flexibility on tight urban windows.",
        why:"Vehicle capacity determines how many routes are needed and how well the savings algorithm can merge stops."})+
      sw({g:"crossdock",label:"Cross-docking at the DC",sub:"Inbound to outbound within hours, no storage",why:"Cross-docking removes putaway, storage and picking cost — but it requires reliable inbound timing to work at all."})+
      sw({g:"backhaul",label:"Backhaul programme",sub:"Paid loads on the return leg",why:"An empty return is half the distance, half the fuel and none of the revenue."}));
    h+=card("Route plan","one depot, 14 drops",'<div data-chart="vrp"></div>'+
      '<div data-live="vrpnote"></div>');
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Mode trade-off","the triangle you cannot escape",'<div data-chart="modes"></div>'+
      legend([["Cost index","#CE2B3C"],["Speed index","#00875E"],["Carbon index","#556780"]])+
      '<div data-live="modenote"></div>'+
      learn("Storage versus cross-docking, drawn",
        viz(dgCrossdock(),"<b>Same goods, same building, two routes through it.</b> Cross-docking deletes putaway, storage and picking — the three most expensive steps. What it buys with that saving is a dependency: inbound has to arrive in the window you agreed, or the cross-dock is just an expensive empty floor.")+
        "<p>It suits predictable, high-volume, fast-moving goods with reliable inbound timing, and nothing else. The most common failure is installing it for the cost saving and then discovering supplier delivery reliability was never good enough to support it — at which point you have removed your buffer <i>and</i> your storage.</p>")+
      learn("Choosing a mode without lying to yourself",
        "<p>The comparison people make is cost per shipment. The comparison that decides correctly is <b>total cost including the inventory the mode creates</b>.</p>"+
        "<p>Ocean freight on a 34-day lane is cheap per kilo and expensive in pipeline stock, safety stock (because the lead time is long and variable) and obsolescence risk. Air is the reverse. The break-even depends almost entirely on value density — value per kilo.</p>"+
        fx("Break-even ≈ (air − ocean cost/kg) vs (value/kg × carry rate × days saved ÷ 365)","If the inventory saving exceeds the freight premium, air is genuinely cheaper. For a €690 handset weighing 420g, that maths is closer than most people assume.")+
        "<ul><li><b>Air</b> — high value density, launches, EOL, emergencies, short shelf life. ~600 g CO2e per tonne-km.</li>"+
        "<li><b>Ocean</b> — low value density, stable demand, long horizons. ~12 g. Fifty times cleaner than air.</li>"+
        "<li><b>Rail</b> — dense, steady, fixed corridors, needs road at both ends. ~24 g.</li>"+
        "<li><b>Road</b> — flexible, door to door, priced by the trailer. ~95 g.</li></ul>"+
        minor("Air freight is charged on the greater of actual weight and volumetric weight — usually length × width × height in cm ÷ 5000 or 6000. Redesigning a carton so it falls under the divisor is regularly the highest-return exercise available in logistics, and it costs one afternoon with a tape measure.")));
    h+=card("Load economics","cube-out vs weigh-out by line item",'<div data-chart="cube"></div>'+
      '<div data-live="cubenote"></div>'+
      learn("FTL, LTL, and the pallet count where it flips",
        "<p><b>Full truckload</b> buys the whole trailer: direct, one handling, fastest, and priced the same whether it is full or not. <b>Less-than-truckload</b> shares it: cheaper for small volumes, but with terminal handling, transfers, more damage and longer transit.</p>"+
        viz(dgFTL(),"<b>Two pricing models crossing.</b> LTL charges per pallet, so its line rises steadily. FTL charges for the whole trailer whether you fill it or not, so its line is flat. Below the crossover you are sharing a trailer and saving money; above it you are paying per-pallet rates for something you could move as one full load.")+
        "<p>The break-even is usually somewhere around 12–16 pallets, but it moves with lane, season and carrier. Below it, LTL wins. Above it, you are paying LTL rates for something you could have moved as a full load — and taking the extra handling damage for free.</p>"+
        "<ul><li><b>Cube-out</b> — the trailer fills physically before hitting the weight limit. Light, bulky freight: crisps, pillows, USB docks. Optimise packaging and pallet patterns.</li>"+
        "<li><b>Weigh-out</b> — the trailer hits the weight limit with space left over. Dense freight: cable drums, liquids, transformers. Optimise routing and consolidation instead; there is nothing to gain from smaller boxes.</li></ul>"+
        viz(dgCube(),"<b>Both trailers are full — of different things.</b> The left one ran out of space with weight to spare, so its answer is better packaging and pallet patterns. The right one hit the legal weight limit half empty, so packaging changes are pointless and the answer is consolidation and routing. Find out which yours does before spending anything.")+
        minor("Detention and demurrage are almost entirely avoidable and almost never owned by anyone. Put them on one named person's scorecard and they typically halve within a quarter — not because anyone works harder, but because someone finally looks at them.")));
    h+='</div>';

    h+=card("Freight ledger · every line item","cost, weight and carbon",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Mode</th><th>Unit kg</th><th>Unit m³</th><th>Density</th><th>Chargeable kg</th>'+
      '<th>Freight/unit</th><th>% of price</th><th>Freight €</th><th>CO2 kg</th><th>Behaviour</th>'+
      '</tr></thead><tbody data-live="lgrid"></tbody><tfoot data-live="lfoot"></tfoot></table></div>'+
      '<p class="hint" style="margin-top:8px">The "% of price" column is the one to watch. Where freight is under 2% of price, mode choice is a service decision. '+
      'Where it is over 8%, freight is a product cost and belongs in the pricing conversation.</p>'+
      learn("Incoterms 2020 — where cost and risk part company",
        "<p>Eleven rules define who arranges carriage, who bears cost, and — <b>separately</b> — where risk transfers. The most expensive misunderstanding in international trade is assuming those last two happen at the same place. Under CFR and CIF they emphatically do not: risk passes when goods are loaded at origin, while the seller keeps paying freight all the way to the destination port. Goods lost mid-ocean are the buyer's loss on a shipment the seller is still paying for.</p>"+
        viz(dgIncoterm(),"<b>The circle is where risk passes to the buyer. The bar is how far the seller keeps paying.</b> Under FCA and DAP they line up, which is what everyone assumes always happens. Under CIF they do not: risk passes at the vessel while the seller pays freight to the destination port. Cargo lost mid-ocean is the buyer's loss on a shipment the seller is still funding.")+
        "<p>Two practical rules worth memorising:</p>"+
        "<ul><li>If it moves in a container, use <b>FCA</b>, not FOB. FOB was written for goods lifted over a ship's rail, and containers are handed over at a terminal days earlier — leaving a gap where nobody is clearly liable.</li>"+
        "<li><b>DDP</b> makes the seller the importer of record, which they often cannot legally be in the destination country. It looks generous and creates genuine problems.</li></ul>"+
        "<p>The full table is in the Library tab.</p>"));
    return h;
  },
  live:function(M){
    var g=ST.g,S=M.S,o={};
    var rts=(g.heuristic==="sweep"?sweepRoutes(g.vrpCap):savingsRoutes(g.vrpCap));
    var tot=sum(rts.map(routeLen));
    var alt=sum((g.heuristic==="sweep"?savingsRoutes(g.vrpCap):sweepRoutes(g.vrpCap)).map(routeLen));
    o.vrpnote = g.heuristic==="savings"
      ? nt("good","Clarke-Wright is merging drops","Savings routing is producing "+rts.length+" routes over "+fm(tot,0)+
        " km — "+pct(Math.abs(alt-tot)/alt*100,1)+" shorter than sweep clustering, at zero capital cost. The rule is simply: compute S = d(0,i) + d(0,j) − d(i,j) for every pair, sort descending, and merge while capacity allows.")
      : nt("warn","Sweep is leaving distance on the table","Angular clustering gives "+rts.length+" routes over "+fm(tot,0)+
        " km. Switching to Clarke-Wright savings would cut roughly "+pct(Math.abs(alt-tot)/tot*100,1)+" of distance immediately. Sweep's only real advantage is that a transport office can reproduce it by hand.");
    var mo=MODES[g.mode];
    var frShare=M.revenue>0? M.freight/M.revenue*100:0;
    o.modenote=nt(frShare>8?"warn":"good","Freight is "+pct(frShare,1)+" of revenue",
      mo.label+" at "+fm(S.distanceKm,0)+" km average lane. Transit "+mo.days+" days, "+fm(mo.co2gPerTkm,0)+
      " g CO2e per tonne-km, total "+fm(M.co2/1000,1)+" tonnes this quarter. "+
      (frShare>8?"At this share, freight is a product cost and belongs in the pricing conversation, not just the logistics budget."
                :"At this share, mode choice is a service decision rather than a cost one — buy the speed if it earns service."));
    var cubers=M.rows.filter(function(r){return r.sk.kg/Math.max(r.sk.cbm,1e-9) < 250;});
    o.cubenote=nt("good",cubers.length+" of "+M.rows.length+" lines cube out",
      (cubers.length? "These lines fill the trailer before hitting the weight limit: "+cubers.map(function(r){return r.sk.code;}).join(", ")+
        ". For them, packaging and pallet pattern are the lever; nothing is gained from routing changes."
        : "Everything in this portfolio is dense enough to weigh out. Packaging redesign will not help — consolidation and routing will."));
    o.lgrid=M.rows.map(function(r){
      var dens=r.sk.kg/Math.max(r.sk.cbm,1e-9);
      var chg=(r.mode==="air"||r.mode==="courier")? Math.max(r.sk.kg,r.sk.cbm*167) : r.sk.kg;
      var shr=r.sk.price>0? r.frUnit/r.sk.price*100 : 0;
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.name)+'</span></td>'+
        '<td>'+MODES[r.mode].label+'</td>'+
        '<td>'+fm(r.sk.kg,r.sk.kg<10?3:0)+'</td><td>'+fm(r.sk.cbm,4)+'</td>'+
        '<td>'+fm(dens,0)+'</td><td>'+fm(chg,chg<10?3:0)+'</td>'+
        '<td>'+money(r.frUnit)+'</td>'+
        '<td class="'+(shr<2?"g":shr<8?"w":"b")+'">'+(r.sk.price>0?fm(shr,1)+"%":"—")+'</td>'+
        '<td>'+money(r.freight)+'</td><td>'+fm(r.co2,0)+'</td>'+
        '<td>'+(dens<250?'<span class="chip y">CUBES OUT</span>':'<span class="chip x">WEIGHS OUT</span>')+'</td></tr>';
    }).join("");
    o.lfoot='<tr><td>TOTAL</td><td>'+MODES[g.mode].label+'</td><td></td><td></td><td></td><td></td><td></td>'+
      '<td>'+pct(frShare,1)+'</td><td>'+money(M.freight)+'</td><td>'+fm(M.co2,0)+'</td><td></td></tr>';
    return o;
  },
  charts:function(M){
    var S=M.S,g=ST.g,o={};
    o.vrp=svgVrp(g.heuristic,g.vrpCap);
    var ms=S.modes;
    o.modes=svgBars({w:460,h:210,x:ms.map(function(m){return MODES[m].label.split(" ")[0];}),
      yFmt:function(v){return fm(v,0);},
      series:[
        {name:"Cost",color:"#CE2B3C",data:ms.map(function(m){return MODES[m].eurPerKgKm/MODES.ocean.eurPerKgKm;})},
        {name:"Speed",color:"#00875E",data:ms.map(function(m){return 40/MODES[m].days;})},
        {name:"Carbon",color:"#556780",data:ms.map(function(m){return MODES[m].co2gPerTkm/12;})}]});
    o.cube=svgScatter({w:460,h:290,xMin:0,xMax:Math.max.apply(null,M.rows.map(function(r){return r.sk.kg/Math.max(r.sk.cbm,1e-9);}))*1.15,
      yMin:0,yMax:Math.max.apply(null,M.rows.map(function(r){return r.sk.price||r.sk.cost;}))*1.15,
      xLabel:"density kg/m³  →   (below 250 = cubes out)",yLabel:"value per unit €  →",
      points:M.rows.map(function(r,i){return {x:r.sk.kg/Math.max(r.sk.cbm,1e-9),y:r.sk.price||r.sk.cost,

};

/* ============================== 07 WAREHOUSE ============================== */
TABS.warehouse={n:"Warehouse",
  html:function(M){
    var h='';
    h+='<div class="grid2">';
    h+=card("Warehouse controls","the cheapest wins in the whole chain",
      seg({g:"slotting",label:"Slotting strategy",opts:[{v:"random",l:"Chaotic"},{v:"abc",l:"ABC velocity"},{v:"golden",l:"Golden zone + family"}],
        hint:"Where each SKU physically lives. Walking is 50–60% of a picker's time, so this is not a cosmetic decision.",
        why:"Slotting changes walking distance, which is over half of pick labour. A re-slot costs a weekend and beats most automation business cases."})+
      seg({g:"pickMethod",label:"Picking method",opts:[{v:"single",l:"Order by order"},{v:"batch",l:"Batch pick"},{v:"zone",l:"Zone + sort"}],
        hint:"Batch picking collects several orders in one trip and sorts afterwards. Zone picking gives each picker an area and passes orders between them.",
        why:"Picking method changes travel per order line, which changes labour cost and dock-to-despatch time."})+
      slider({g:"dockToStock",label:"Dock-to-stock time",min:0,max:9,suf:" days",
        hint:"Truck arrival to pickable stock. Anything sitting in goods-in unbooked is invisible to MRP, which will happily reorder it.",
        why:"Dock-to-stock adds directly to effective lead time and therefore to safety stock."})+
      sw({g:"cycleCount",label:"Cycle counting programme",sub:"A items monthly, C items annually",why:"Cycle counting finds root causes continuously instead of correcting numbers once a year."})+
      sw({g:"fefo",label:"FEFO enforced",sub:"First Expired First Out",why:"The oldest received is not always the soonest to expire — with mixed batch lead times, FIFO ships the wrong pallet."}));
    h+=card("Layout and pick path","one 8-line order",'<div data-chart="wh"></div>'+
      '<div data-live="whnote"></div>');
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Where warehouse time goes","typical manual pick operation",'<div data-chart="whtime"></div>'+
      '<p class="hint">Travel dominates. Everything else — the scanning, the picking motion, the paperwork — is a rounding error by comparison, '+
      'which is why almost every worthwhile warehouse project is really a project about walking less.</p>'+
      learn("Slotting properly, in four moves",
        viz(dgGolden(),"<b>A rack seen from the side.</b> The green band between waist and shoulder height is the fastest and safest place to pick from, and it is a small fraction of your total cube. Fill it with the items you pick most often, put slow-and-heavy on the floor and slow-and-light up top, and you have just cut your labour cost without buying anything.")+
        "<ul><li><b>Velocity first.</b> Rank by picks per period, not by units or value. A slow-moving expensive item does not belong in prime space; a fast-moving cheap one does.</li>"+
        "<li><b>Golden zone.</b> The band between knee and shoulder height is fastest to pick and safest for backs. Reserve it for your A-movers. Put slow and heavy items low, slow and light items high.</li>"+
        "<li><b>Family grouping.</b> Items ordered together should be stored together. Check the actual order lines, not the product hierarchy — the categories that marketing invented rarely match what customers buy in one basket.</li>"+
        "<li><b>Re-slot regularly.</b> Velocity changes with season and lifecycle. A slotting plan from eighteen months ago is now actively working against you.</li></ul>"+
        minor("Honeycombing is the space you lose when a pallet position is half-emptied and cannot be used for anything else. It is silent, universal, and typically worth 10–20% of your cube. Deep-lane storage makes it worse; narrower, shallower locations make it better at the cost of more aisles.")));
    h+=card("Inventory accuracy","and why it decides everything else",'<div data-chart="acc"></div>'+
      '<div data-live="accnote"></div>'+
      learn("The 97% threshold",
        "<p>Inventory record accuracy is the percentage of locations where system quantity matches physical quantity. It is the foundation the entire planning stack stands on, and it fails quietly.</p>"+
        "<p>Below roughly 97%, something predictable happens: planners stop trusting the system. They start keeping private spreadsheets, adding informal buffers, and phoning the warehouse to check before committing. Once that culture exists, <b>no software project will fix your planning</b>, because the software is no longer where the decisions are being made.</p>"+
        "<p>What actually restores it:</p>"+
        "<ul><li><b>Cycle counting</b> rather than annual stocktakes — count A items monthly, B quarterly, C annually. You find causes, not just discrepancies.</li>"+
        "<li><b>Root-cause every variance</b> above a threshold. Most accuracy loss traces to a handful of repeating process failures: unrecorded scrap, picks from the wrong location, receipts booked to the wrong unit of measure.</li>"+
        "<li><b>Scan discipline at every touch.</b> Chaotic storage is more space-efficient than fixed locations, but it is completely unusable without reliable scanning.</li></ul>"+
        minor("A stocktake that produces a big adjustment is not a success. It means you have been planning on fiction for a year and have now papered over it for another year. The number that matters is variance frequency, not variance value.")));
    h+='</div>';

    h+=card("Storage profile by line item","cube, velocity and zone",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Picks/qtr est.</th><th>Units held</th><th>m³ held</th>'+
      '<th>Pallets</th><th>Recommended zone</th><th>Shelf life</th><th>Rotation</th><th>Write-off risk</th>'+
      '</tr></thead><tbody data-live="wgrid"></tbody></table></div>'+
      '<p class="hint" style="margin-top:8px">Cube tells you what the warehouse costs; picks tell you what the labour costs. They are different rankings, '+
      'and slotting by the wrong one is the most common warehouse design error.</p>');
    return h;
  },
  live:function(M){
    var g=ST.g,o={};
    var walkIdx=g.slotting==="random"?100:g.slotting==="abc"?72:61;
    var methodIdx=g.pickMethod==="single"?100:g.pickMethod==="batch"?63:71;
    var eff=walkIdx*methodIdx/100;
    o.whnote=nt(eff<50?"good":eff<80?"warn":"bad",
      "Pick labour index "+fm(eff,0)+" (100 = worst case)",
      (g.slotting==="random"?"Chaotic storage maximises space utilisation and maximises walking. ":
       g.slotting==="abc"?"ABC velocity zones cut walking by about 28% against chaotic. ":
       "Golden-zone placement with family grouping cuts walking by about 39% and reduces picker injury risk. ")+
      (g.pickMethod==="single"?"Order-by-order picking means one full trip per order — the simplest method and the most expensive.":
       g.pickMethod==="batch"?"Batch picking amortises the trip across several orders, typically cutting travel per line by a third.":
       "Zone picking removes long trips entirely but adds a sortation and consolidation step downstream.")+
      " Combined, you are at roughly "+fm(eff,0)+"% of the worst-case labour cost.");
    var acc=clamp((g.cycleCount?98.6:94.2)-(g.slotting==="random"?1.1:0)-(g.dockToStock>4?1.4:0),85,99.6);
    o.accnote = acc>=97? nt("good","Records are trustworthy",
        fm(acc,1)+"% accuracy. Above the 97% line, planners believe the system, MRP output is actionable, and nobody keeps a private spreadsheet. This is the quiet precondition for every other improvement on this screen.")
      : nt("bad","Below the trust threshold",
        fm(acc,1)+"% accuracy. Below 97%, MRP is planning on fiction and planners start working around the system. "+
        (g.cycleCount?"Your cycle counting programme is helping — the remaining loss is coming from slotting churn or slow dock-to-stock.":"Start a cycle counting programme: A items monthly, C items annually. It finds causes rather than correcting numbers once a year."));
    o.wgrid=M.rows.map(function(r){
      var picks=r.demand/Math.max(r.Q/6,1);
      var m3=r.avgInv*r.sk.cbm;
      var pallets=m3/1.65;
      var zone= r.sk.abc==="A"? "Golden zone, near dispatch" : r.sk.abc==="B"? "Mid aisle, waist height" : "High bay / far aisle";
      var wr = r.sk.shelf>0? clamp(r.daysCover/(r.sk.shelf*0.4),0,3) : (M.S.key==="tech"? r.daysCover/60 : 0.2);
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.name)+'</span></td>'+
        '<td><span class="chip '+r.sk.abc.toLowerCase()+'">'+r.sk.abc+'</span> <span class="chip '+r.sk.xyz.toLowerCase()+'">'+r.sk.xyz+'</span></td>'+
        '<td>'+qty(picks)+'</td><td>'+qty(r.avgInv)+'</td><td>'+fm(m3,1)+'</td><td>'+fm(pallets,0)+'</td>'+
        '<td style="text-align:left">'+zone+'</td>'+
        '<td>'+(r.sk.shelf>0?fm(r.sk.shelf,0)+"d":"—")+'</td>'+
        '<td>'+(g.fefo?'<span class="chip x">FEFO</span>':'<span class="chip y">FIFO</span>')+'</td>'+
        '<td class="'+(wr<0.6?"g":wr<1.2?"w":"b")+'">'+(wr<0.6?"LOW":wr<1.2?"MED":"HIGH")+'</td></tr>';
    }).join("");
    return o;
  },
  charts:function(M){
    var g=ST.g,o={};
    o.wh=svgWarehouse(g,M.rows);
    var travel=g.slotting==="random"?55:g.slotting==="abc"?44:39;
    var mult=g.pickMethod==="batch"?0.66:g.pickMethod==="zone"?0.74:1;
    travel=travel*mult;
    var rest=100-travel;
    o.whtime=svgHBars({w:460,items:[
      {label:"Travel / walking",v:travel,txt:pct(travel,0),color:"var(--bad)"},
      {label:"Searching",v:rest*0.18,txt:pct(rest*0.18,0),color:"var(--warn)"},
      {label:"Picking motion",v:rest*0.42,txt:pct(rest*0.42,0),color:"var(--good)"},
      {label:"Paperwork / scan",v:rest*0.22,txt:pct(rest*0.22,0),color:"#8497AE"},
      {label:"Setup / other",v:rest*0.18,txt:pct(rest*0.18,0),color:"#8497AE"}]});
    var acc=clamp((g.cycleCount?98.6:94.2)-(g.slotting==="random"?1.1:0)-(g.dockToStock>4?1.4:0),85,99.6);
    o.acc=svgGauge({w:300,h:150,v:acc,min:85,max:100,txt:fm(acc,1)+"%",
      label:"inventory record accuracy · 97% is the trust line",

  }
};

/* ============================== 08 FINANCE ============================== */
TABS.finance={n:"Finance",
  html:function(M){
    var h='';
    h+='<div class="grid2">';
    h+=card("Working capital controls","",
      slider({g:"holdRate",label:"Inventory carrying rate",min:0.08,max:0.45,step:0.01,suf:"",
        hint:"Annual cost of holding stock: capital, storage, insurance, shrinkage, obsolescence. Typically 18–35%. Yours is probably a number someone chose years ago.",
        why:"Carrying rate changes every EOQ, every service-level trade-off and every make-or-buy decision in the company."})+
      slider({g:"dso",label:"Customer payment terms (DSO)",min:15,max:120,suf:" days",
        hint:"Days sales outstanding. Longer terms may win the customer and cost you the cash.",
        why:"DSO adds directly to the cash-to-cash cycle."})+
      slider({g:"dpo",label:"Supplier payment terms (DPO)",min:20,max:120,suf:" days",
        hint:"Days payable outstanding. Subtracts from the cash cycle, and comes back in your next price negotiation.",
        why:"DPO subtracts from cash-to-cash. It is a loan from your supplier at their cost of capital, which is higher than yours."})+
      slider({g:"service",label:"Service level",min:80,max:99.9,step:0.1,suf:"%",
        hint:"Shown here too, because service is a working capital decision as much as a customer one.",
        why:"Service level is the single largest discretionary driver of inventory, and therefore of working capital."}));
    h+=card("Cash-to-cash cycle","days between paying and being paid",'<div data-chart="c2c"></div>'+
      '<div data-live="c2cnote"></div>'+
      learn("The number that gets you heard in the boardroom",
        viz(dgCash(),"<b>Follow the money along the timeline.</b> Goods arrive, and 35 days later you pay for them. They sell at day 60, and the customer pays at day 105. So from day 35 to day 105 — seventy days — your cash is out of the building and has not come back. That gap is what the business has to fund, and it is the single number that turns supply chain work into something a CFO acts on.")+
        fx("C2C = DIO + DSO − DPO","Days inventory + days receivable − days payable.")+
        "<p>This is the translation layer between supply chain work and finance. It says: from the moment cash leaves the company to pay a supplier, how many days pass before cash comes back from a customer? Every one of those days has to be financed.</p>"+
        "<p>Three levers, and they are not equally available to you:</p>"+
        "<ul><li><b>DIO</b> — yours. Inventory policy, lead time, forecast accuracy, service level. This is where supply chain earns its seat.</li>"+
        "<li><b>DSO</b> — mostly sales and credit control's, though order accuracy and invoice quality sit with you more than people admit. A disputed invoice is a receivable that does not age, it just sits.</li>"+
        "<li><b>DPO</b> — procurement's. Real, but it is borrowing from suppliers who price it back in.</li></ul>"+
        minor("Learn to say your result in cash days. 'We cut six days of cash-to-cash' opens doors that 'we improved turns by 0.4' never will — same fact, completely different audience.")));
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Profit bridge","revenue to profit",'<div data-chart="pl"></div>'+
      '<div data-live="plnote"></div>');
    h+=card("Cost to serve by line item","who is actually profitable",'<div data-chart="cts"></div>'+
      '<p class="hint">Logistics, holding and decay cost as a share of each line\'s revenue. Almost every business that does this exercise honestly '+
      'discovers that some of its "profitable" products or customers are not.</p>'+
      learn("Cost to serve, and the uncomfortable conversation after it",
        "<p>Gross margin by product tells you almost nothing, because it charges every line the same average for the things that vary most: order frequency, drop size, packaging, returns, expediting, and the sheer amount of human attention a line consumes.</p>"+
        "<p>A proper cost-to-serve model allocates:</p>"+
        "<ul><li>Freight by actual weight, cube and lane — not as a percentage of revenue.</li>"+
        "<li>Warehouse cost by cube occupied and picks generated, separately, because they rank differently.</li>"+
        "<li>Inventory carrying by the stock that line actually causes, including its pipeline.</li>"+
        "<li>Obsolescence and write-off by where it genuinely lands.</li></ul>"+
        "<p>Then the awkward part: some lines and some customers turn out to be loss-making. The answer is rarely to fire them — it is usually to change the terms. Minimum order quantities, drop-size charges, different pack formats, longer lead times, or a different channel entirely.</p>"+
        fx("GMROI = Gross margin € ÷ Average inventory cost","Margin earned per euro of stock invested — a far better range-rationalisation metric than margin percentage alone.")));
    h+='</div>';

    h+=card("Reading the money, in plain English","no finance background needed",
      '<p class="lede" style="margin-top:-2px">Each card says what the number means, which direction you want it to move, and roughly where you sit on a sensible range. '+
      'If you only remember one thing: <b>profit and service you push up, cash days and cost you push down, and utilisation you keep in the middle.</b></p>'+
      '<div class="mexp" data-live="fexp"></div>'+
      nt("good","Why supply chain people learn to speak in cash days",
        "\"We improved inventory turns by 0.4\" means nothing outside the department. \"We took six days out of the cash cycle, which freed "+
        money(M.revenue/91*6)+" of working capital\" is the same fact, and it is the version that gets funded. Same work, different language, "+
        "completely different outcome for your budget and your career."));

    h+=card("P&L by line item","fully loaded",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Volume</th><th>Revenue</th><th>COGS</th><th>Gross %</th><th>Freight</th>'+
      '<th>Holding</th><th>Decay</th><th>Penalty</th><th>Profit</th><th>Net %'+dirMini('margin')+'</th><th>GMROI'+dirMini('gmroi')+'</th><th>Cost to serve'+dirMini('ctsPct')+'</th>'+
      '</tr></thead><tbody data-live="fgrid"></tbody><tfoot data-live="ffoot"></tfoot></table></div>'+
      minor("The gap between the gross margin column and the net margin column is the supply chain's P&L. It is usually the only place in the business where those costs are visible together — finance sees them as separate cost centres, and nobody else sees them at all."));
    return h;
  },
  live:function(M){
    var g=ST.g,o={};
    o.c2cnote = M.c2c>90? nt("bad","Cash cycle is long",
        fm(M.c2c,0)+" days: "+fm(M.dio,0)+" inventory + "+g.dso+" receivable − "+g.dpo+" payable. You are financing roughly "+
        money(M.revenue/91*M.c2c)+" of working capital. The inventory portion is the part you control directly.")
      : M.c2c<25? nt("good","Cash cycle is strong",
        fm(M.c2c,0)+" days. At this level the business is being partly financed by its own suppliers. Worth checking that DPO is contractually agreed rather than simply taken — the second version costs you in the next negotiation.")
      : nt("good","Cash cycle is conventional",
        fm(M.c2c,0)+" days, of which "+fm(M.dio,0)+" is inventory. That inventory portion is the piece supply chain owns outright, and it is where the next improvement will come from.");
    var svc=M.revenue>0? M.penalty/M.revenue*100:0;
    o.plnote=nt(M.margin>14?"good":M.margin>6?"warn":"bad","Net margin "+pct(M.margin,1),

        arr.sort(function(a,b){return b[1]-a[1];}); return arr[0][0]+" at "+money(arr[0][1]);})()+

    o.fexp=[

      mx("profit",0,money(M.profit),M.profit>0?"g":"b"),

      mx("holding",0,money(M.holding),"w"),
      mx("freight",0,money(M.freight),"w"),
      mx("waste",0,money(M.waste+M.excursion),(M.waste+M.excursion)<M.revenue*0.01?"g":"b"),
      mx("penalty",0,money(M.penalty),M.penalty<M.revenue*0.01?"g":"b"),
      mx("overhead",0,money(M.overhead),"")
    ].join("");
    o.fgrid=M.rows.map(function(r){
      return '<tr data-selsku="'+r.sk.code+'" style="cursor:pointer" class="'+(r.sk.code===ST.selSku?"sel":"")+'">'+
        '<td class="code">'+r.sk.code+'<span class="nm">'+esc(r.sk.name)+'</span></td>'+
        '<td>'+qty(r.served)+'</td><td>'+money(r.revenue)+'</td><td>'+money(r.cogs)+'</td>'+

        '<td>'+money(r.freight)+'</td><td>'+money(r.holding)+'</td><td>'+money(r.waste+r.excursion)+'</td>'+

      '<td>'+money(M.profit)+'</td><td>'+fm(M.margin,1)+'</td><td></td><td></td></tr>';

TABS.risk={n:"Risk",
  html:function(M){
    var S=M.S,h='';
    h+='<div class="grid2">';
    h+=card("Resilience controls","",
      seg({g:"sourcing",label:"Sourcing posture",opts:[{v:"single",l:"Single source"},{v:"dual",l:"Dual source"}],
        hint:"The single biggest lever on time-to-recover.",
        why:"Dual sourcing cuts TTR from "+(S.key==="pharma"?"118":"68")+" days to 22."})+
      slider({g:"ssMult",label:"Safety stock multiplier",min:0.4,max:2.2,step:0.1,suf:"×",
        hint:"Raises time-to-survive across the portfolio — and raises working capital in exact proportion.",
        why:"More buffer means more days of survival without supply. That is what buffer is actually for."})+
      slider({g:"ltStress",label:"Lead time environment",min:0.7,max:1.8,step:0.05,suf:"×",
        hint:"Test what happens when the whole environment degrades: congestion, capacity shortage, a bad year.",
        why:"Stressing lead times simultaneously raises pipeline stock, safety stock requirement and exposure."})+
      (S.key==="pharma"? seg({g:"cold",label:"Cold chain solution",opts:[{v:"passive",l:"Passive"},{v:"hybrid",l:"Hybrid"},{v:"active",l:"Active"}],
        hint:"Passive is insulated packaging with phase-change packs, qualified for a stated duration. Active is powered, controlled, and reports in real time.",
        why:"Cold chain solution determines excursion probability and therefore quarantine risk on every 2–8°C line."}):"")+
      (S.key==="pharma"? slider({g:"qpDays",label:"QP release lead time",min:1,max:21,suf:" days",
        hint:"Batch certification by a Qualified Person. It sits on top of every manufacturing lead time and creates quarantine stock.",
        why:"QP release adds to effective lead time and converts finished stock into quarantine stock — present, owned, unavailable."}):"")+
      (S.key==="pharma"? sw({g:"serial",label:"Serialisation compliant",sub:"Pack-level identifiers and aggregation",
        why:"Non-compliance blocks market access. Aggregation errors surface at the wholesaler, not in your warehouse."}):""));
    h+=card("Time to survive vs time to recover","the only risk metric worth reporting",
      '<div data-chart="ttr"></div>'+
      '<div data-live="ttrnote"></div>'+
      learn("Why TTR/TTS beats every risk heat map",
        viz(dgTTR(),"<b>One timeline, two lengths.</b> Your stock lasts 28 days. Their recovery takes 68. The red bar is the 40 days in between, during which you have nothing to sell. Every risk conversation becomes concrete the moment it is expressed this way — and there is exactly one question to ask each supplier to get the grey bar.")+
        "<p>The standard approach — rank risks by likelihood × impact, colour the grid — feels rigorous and fails for two reasons. Supply chain catastrophes are low-likelihood, so they rank low. And they are correlated, so the grid treats nine suppliers in one industrial park as nine independent risks when they are one risk wearing nine badges.</p>"+
        "<p>The alternative asks two answerable questions about every node:</p>"+
        "<ul><li><b>Time to recover (TTR)</b> — how long would this node take to resume full function after a serious disruption? Ask the supplier. Most have never been asked and will have to go and find out, which is itself informative.</li>"+
        "<li><b>Time to survive (TTS)</b> — how long could you keep serving customers if this node stopped, given current inventory and alternatives?</li></ul>"+
        fx("Exposure = TTR − TTS","In days. Positive means a gap. No colours required.")+
        "<p>The output is a list of nodes with a number of days beside each. That is a board-level conversation: 'if this supplier stops, we run out in 11 days and they need 68 to recover — here are three options and what each costs.' A heat map cannot produce that sentence.</p>"+
        minor("Map by revenue at risk, not by spend. The €4,000-a-year sole-source label printer that halts every line is a far bigger exposure than the €4m component with three qualified sources — and it will never appear on a procurement spend analysis.")));
    h+='</div>';

    h+='<div class="grid2">';
    h+=card("Days of survival by line item","if supply stopped today",'<div data-chart="tts"></div>'+
      '<p class="hint">Each bar is how long that product could keep serving demand from stock on hand and in transit. '+
      'The shortest bar on an A item is your real exposure, regardless of what the portfolio average says.</p>');
    h+=card("Disruption calendar","this simulated year",'<div data-live="events"></div>');
    h+='</div>';

    if(S.key==="pharma"){
      h+=card("Pharma-specific exposures","GxP, cold chain and release",
        '<div data-live="pharmarisk"></div>'+
        learn("Why pharma supply chains behave differently",
          "<p>Every constraint in this sector traces back to one fact: the product is a medicine, and the regulator's question is not 'did it arrive' but 'can you prove it was made, stored and moved correctly, and can you find every pack if it was not'.</p>"+
          viz(dgCold(),"<b>A temperature logger's record from one shipment.</b> The green band is the labelled 2–8°C range. The genset failed and the load spent eleven hours above it. Nothing here proves the product is damaged — but it cannot be sold until a Qualified Person has assessed it against the stability data, and that assessment takes time you do not have.")+
          "<ul><li><b>Release, not production, is the finish line.</b> A Qualified Person must personally certify every batch before sale. Physical stock is not available stock, and quarantine inventory sits on your balance sheet servicing nobody.</li>"+
          "<li><b>Temperature is a quality attribute.</b> An excursion outside 2–8°C does not automatically destroy product — stability data and a QP assessment decide. But the stock is frozen commercially while that runs, which is a service failure whatever the quality verdict.</li>"+
          "<li><b>Shelf life is commercial, not just legal.</b> Customers and tenders routinely demand 75–85% of shelf life remaining on receipt. Product that is in date and compliant can still be worthless.</li>"+
          "<li><b>API concentration is structural.</b> A large share of active ingredients comes from a small number of sites. Qualifying an alternative takes 18–36 months plus a regulatory variation — so the mitigation has to be funded years before the risk arrives, which is exactly why it usually is not.</li>"+
          "<li><b>Serialisation is a supply chain process, not an IT project.</b> Pack-to-case-to-pallet aggregation errors are discovered at the wholesaler, and by then the pallet has been broken down.</li></ul>"+
          minor("When planning a product launch here, the constraint is almost never manufacturing capacity. It is stability data, artwork approval market by market, and QP capacity. Plan those three as critical path and the factory will look easy.")));
    }

    h+=card("Risk register · every line item","exposure, not opinion",
      '<div class="gridwrap"><table class="dg"><thead><tr>'+
      '<th>Product code</th><th>Class</th><th>Source</th><th>Lead time</th><th>Days of cover'+dirMini('daysCover')+'</th>'+

function dirTag(k,dark){
  var D=DIR[k]; if(!D) return "";
  var cls=D.d, txt=D.d==="up"?"↑ higher is better":D.d==="down"?"↓ lower is better":"↕ mid-range is best";
  var shrt=D.d==="up"?"↑ higher":D.d==="down"?"↓ lower":"↕ mid";
  return '<span class="'+(dark?"dir":"dirL")+' '+cls+'" title="'+txt+'">'+(dark?shrt:txt)+'</span>';
}
function dirMini(k){
  var D=DIR[k]; if(!D) return "";
  return '<span class="dir '+D.d+'" title="'+(D.d==="up"?"higher is better":D.d==="down"?"lower is better":"mid-range is best")+'">'+
    (D.d==="up"?"↑":D.d==="down"?"↓":"↕")+'</span>';
}
/* a metric card: value, which way is good, plain English, and where you sit */
function mx(k,val,txt,toneCls){
  var D=DIR[k]; if(!D) return "";
  var pos=clamp((val-D.lo)/((D.hi-D.lo)||1),0,1)*100;
  var revScale = D.d==="down";
  var lowLbl,highLbl;
  if(D.d==="up"){ lowLbl="weak"; highLbl="strong"; }
  else if(D.d==="down"){ lowLbl="good"; highLbl="costly"; }
  else { lowLbl="too low"; highLbl="too high"; }
  var scaleCls = D.d==="mid" ? "" : (revScale?"rev":"");
  var bar = (D.u==="€")? "" :
    '<div class="scale '+scaleCls+'"'+(D.d==="mid"?' style="background:linear-gradient(90deg,var(--warn),var(--good) 50%,var(--bad))"':'')+
    '><i style="left:'+pos.toFixed(1)+'%"></i></div>'+
    '<div class="sl"><span>'+lowLbl+' '+fm(D.lo,0)+D.u+'</span><span>'+highLbl+' '+fm(D.hi,0)+D.u+'</span></div>';
  return '<div class="mx"><div class="t"><span>'+esc(D.n)+'</span>'+dirTag(k)+'</div>'+
    '<div class="v '+(toneCls||"")+'">'+txt+'</div>'+
    '<div class="d">'+D.p+' <b style="color:var(--ink)">'+D.why+'</b></div>'+bar+'</div>';
}

function pager(tab){
  var i=TAB_ORDER.indexOf(tab);

  var h='<div class="pager">';
  h+= prev
    ? '<button class="pgbtn" data-tab="'+prev+'"><span class="ar">←</span><span><span class="lb">Back to step '+i+'</span>'+
      '<span class="tt">'+esc(CHAPTERS[prev].n)+'</span><span class="wy">'+esc(CHAPTERS[prev].t)+'</span></span></button>'
    : '<div class="pgbtn dis"><span class="ar">←</span><span><span class="lb">You are at the start</span>'+

  h+= next
    ? '<button class="pgbtn nx" data-tab="'+next+'"><span class="ar">→</span><span><span class="lb">Next, step '+(i+2)+'</span>'+
      '<span class="tt">'+esc(CHAPTERS[next].n)+'</span><span class="wy">'+esc(CHAPTERS[tab].next)+'</span></span></button>'
